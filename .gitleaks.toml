# Gitleaks configuration
# See https://github.com/gitleaks/gitleaks#configuration for full reference

title = "Event Junkie Gitleaks Config"

# Extend the default gitleaks rules
[extend]
useDefault = true

# Paths to ignore during scanning
[allowlist]
paths = [
    '''gradle-wrapper\.jar''',
    '''\.gradle''',
    '''node_modules''',
    '''build/''',
    '''\.idea''',
    # Scraper snapshots are verbatim captures of public, unauthenticated pages and API
    # responses — by construction they contain no credentials. They do carry high-entropy
    # opaque ids (Sanity Portable Text `_key`s, CDN asset hashes, widget ids) that the
    # entropy-based `generic-api-key` rule flags, so the fixture tree is excluded wholesale
    # rather than accruing a per-file suppression with every new importer.
    '''events-importer/src/test/resources/scraper/''',
]

