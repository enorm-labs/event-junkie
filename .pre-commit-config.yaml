# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Local hooks rather than antonbabenko/pre-commit-terraform: that repo shells out to `terraform`
  # and would need pinning and bumping, while these use the `tofu` already on the machine and are
  # the same two commands .github/workflows/validate-infra.yml runs. Formatting is the one CI
  # failure that is pure waste — it is deterministic, so catch it before the push, not after.
  - repo: local
    hooks:
      - id: tofu-fmt
        name: tofu fmt
        entry: tofu fmt
        language: system
        # `.tftpl` is deliberately absent: `tofu fmt` rejects any extension it does not own, and
        # the cloud-init template is YAML with interpolation, not HCL.
        files: \.(tf|tfvars)$
        pass_filenames: true

      - id: shellcheck-scripts
        name: shellcheck
        entry: shellcheck -x
        language: system
        # `infra` rather than `infra/modules/environment/cloud-init`: the narrower pattern needed a
        # directory prefix, so `infra/check-capacity.sh` — which sits directly in `infra/` — was
        # linted by nothing at all, here or in CI. Found when rewriting it (#424).
        files: ^(infra|scripts)/.*\.sh$
        pass_filenames: true

      # ruff at whatever version is on $PATH (`brew install ruff`), configured by the root ruff.toml;
      # validate-python.yml pins the version that decides, the same split as ShellCheck. `ruff-format`
      # writes in place, like format-markdown, so a reformatted file lands in the same commit.
      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: system
        files: \.py$
        pass_filenames: true

      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        files: \.py$
        pass_filenames: true

      # `.claude/skills/` and `.claude/commands/` are parallel trees of `@` pointers and nothing
      # joins them, so a skill added to one and not the other is silently absent from the other —
      # no error, the command simply is not there. Runs on any of the three copies moving.
      - id: skill-parity
        name: skill and command parity
        entry: scripts/skill-parity.sh
        language: system
        files: ^(\.claude/(skills|commands)/|\.github/prompts/|AGENTS\.md$)
        pass_filenames: false

      - id: rules-parity
        name: rule parity
        entry: scripts/rules-parity.sh
        language: system
        files: ^(\.claude/rules/|\.github/instructions/|AGENTS\.md$)
        pass_filenames: false

      # The product scopes `feat` is allowed, held in the labeller, two scripts and six documents.
      - id: scope-parity
        name: product scope parity
        entry: scripts/scope-parity.sh
        language: system
        files: ^(\.github/workflows/label-pr\.yml|scripts/(version|release-highlights|scope-parity)\.sh|\.github/prompts/(release-highlights|commit-message|squash-commit-message)\.prompt\.md|\.github/instructions/ci-cd\.instructions\.md|docs/ops/RELEASING\.md|CONTRIBUTING\.md)$
        pass_filenames: false

      # Every file under `scripts/` has a row in `scripts/README.md`, every path named there
      # exists, and every script answers `--help`. Scoped to the directory: the check's tree-wide
      # half — a `scripts/<name>` reference in a runbook that no longer resolves — is CI's job in
      # validate-docs.yml, and running a `git grep` over the tree on every Markdown commit is not.
      - id: index-parity
        name: scripts index parity
        entry: scripts/index-parity.sh
        language: system
        files: ^scripts/
        pass_filenames: false

      # Markdown formatting, via the oxfmt pinned in events-frontend/package.json rather than
      # whatever is on $PATH — a Homebrew oxfmt and the pinned one disagree about tables nested
      # under list items, and a hook that formats differently than CI checks is worse than no hook.
      # The script explains the rest; it is the only thing in this repository allowed to run oxfmt
      # outside events-frontend/, and it is scoped to Markdown at two independent levels.
      #
      # This one writes rather than just checking, so a reformatted file lands in the same commit.
      - id: format-markdown
        name: format markdown
        entry: scripts/format-markdown.sh
        language: system
        files: \.md$
        pass_filenames: true

      # The operations page's generated files, regenerated from LINKS.md, DAILY_COMMANDS.md and the
      # page itself. Writes, like format-markdown, so a regenerated file lands in the same commit.
      # Needs events-frontend/node_modules for the CSS half; the script says so when it is missing.
      - id: dashboard-parity
        name: operations page parity
        entry: scripts/dashboard-parity.sh
        language: system
        files: ^(docs/LINKS\.md|docs/ops/DAILY_COMMANDS\.md|docs/ops/dashboard/|scripts/links_export\.py|scripts/dashboard-parity\.sh|events-frontend/scripts/ops-page-css\.mjs)
        pass_filenames: false

      # `helm lint --strict` is a pure function of the working tree — no cluster, no kubeconfig, no
      # credentials — which is what makes it safe as a commit hook at all. `pass_filenames: false`
      # because helm lints a chart directory, not a list of files.
      #
      # The base values.yaml deliberately cannot render alone: database.host and
      # database.existingSecret have no safe default, hence the two --set flags.
      #
      # Deliberately NOT the full CI gate: `helm unittest` needs a plugin that not every checkout
      # has installed, and `scripts/cluster-assertions.sh` renders the chart five times. Both are
      # `/verify` steps rather than commit-time ones.
      #
      # And deliberately no `check-yaml` hook, here or anywhere. Helm templates are Go templates
      # that happen to look like YAML; a generic YAML parser rejects every one of them. If someone
      # adds pre-commit-hooks' check-yaml later, it must exclude `deploy/charts/*/templates/`.
      - id: helm-lint
        name: helm lint
        entry: >-
          helm lint --strict deploy/charts/event-junkie
          --set database.host=10.0.1.2 --set database.existingSecret=events-db
        language: system
        files: ^deploy/charts/
        pass_filenames: false
