# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Local hooks rather than antonbabenko/pre-commit-terraform: that repo shells out to `terraform`
  # and would need pinning and bumping, while these use the `tofu` already on the machine and are
  # the same two commands .github/workflows/validate-infra.yml runs. Formatting is the one CI
  # failure that is pure waste — it is deterministic, so catch it before the push, not after.
  - repo: local
    hooks:
      - id: tofu-fmt
        name: tofu fmt
        entry: tofu fmt
        language: system
        # `.tftpl` is deliberately absent: `tofu fmt` rejects any extension it does not own, and
        # the cloud-init template is YAML with interpolation, not HCL.
        files: \.(tf|tfvars)$
        pass_filenames: true

      - id: shellcheck-scripts
        name: shellcheck
        entry: shellcheck -x
        language: system
        files: ^(infra/modules/environment/cloud-init|deploy/scripts|scripts)/.*\.sh$
        pass_filenames: true

      # One version reaches four files and only one of them is authoritative, so the drift this
      # catches is the kind nobody notices: bump `gradle.properties` alone and everything still
      # builds, lints and renders — the release just publishes a chart whose `appVersion` names image
      # tags that were never pushed. Cheapest possible check, and the earliest place to run it.
      - id: version-consistency
        name: version consistency
        entry: scripts/version.sh check
        language: system
        files: ^(gradle\.properties|events-frontend/package\.json|deploy/charts/event-junkie/Chart\.yaml)$
        pass_filenames: false

      # `helm lint --strict` is a pure function of the working tree — no cluster, no kubeconfig, no
      # credentials — which is what makes it safe as a commit hook at all. `pass_filenames: false`
      # because helm lints a chart directory, not a list of files.
      #
      # The base values.yaml deliberately cannot render alone: database.host and
      # database.existingSecret have no safe default, hence the two --set flags.
      #
      # Deliberately NOT the full CI gate: `deploy/scripts/render-assertions.sh` renders the chart
      # three times and is a `/verify` step rather than a commit-time one.
      #
      # And deliberately no `check-yaml` hook, here or anywhere. Helm templates are Go templates
      # that happen to look like YAML; a generic YAML parser rejects every one of them. If someone
      # adds pre-commit-hooks' check-yaml later, it must exclude `deploy/charts/*/templates/`.
      - id: helm-lint
        name: helm lint
        entry: >-
          helm lint --strict deploy/charts/event-junkie
          --set database.host=10.0.1.2 --set database.existingSecret=events-db
        language: system
        files: ^deploy/charts/
        pass_filenames: false
