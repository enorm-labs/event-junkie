spring:
  application:
    name: events-bff
  r2dbc:
    properties:
      schema: events

# `info` joins the default `health`, so operators can ask a running instance which build it is. It
# must NOT be routed through the public ingress — the browser gets `GET /meta`, a curated
# OpenAPI-documented contract rather than a framework-shaped payload (docs/LEGAL.md §4.4). The chart
# enforces that split by setting MANAGEMENT_SERVER_PORT=9001 on both JVM services, putting the
# actuator on a port no ingress rule names. Deliberately not set here, so local development and the
# tests keep their single-port behaviour.
management:
  endpoints:
    web:
      exposure:
        # `prometheus` joins health and info here, and this is safe *because of where the endpoint
        # lives, not because of what it contains*: the chart moves the whole management port off the
        # application port (bff.service.managementPort) and no Ingress routes it, so /actuator/** —
        # including this — is unreachable from outside the cluster. See PLATFORM_SETUP.md §7.
        include: health,info,prometheus
  # `include` *replaces* a group's default membership, so `readinessState` has to be repeated —
  # omitting it drops Spring's own signal that the context is up. The names are validated at startup,
  # so a typo is a context failure and never a silently smaller readiness group.
  #
  # **Readiness includes the database; liveness must never** (ADR-018). This service is a
  # read-through API over one shared PostgreSQL, so a pod that cannot reach the database can serve
  # nothing and reporting Ready would put Kubernetes' traffic into a black hole (#438). Liveness
  # stays `livenessState`, because a database-dependent liveness probe restarts every replica during
  # an outage and makes recovery slower than the outage. `r2dbc` is the stock indicator (reachable);
  # `eventsSchema` is ours (migrated and readable) — EventsSchemaHealthIndicator has why the first
  # alone would not have closed the window #263 measured.
  endpoint:
    health:
      # `always` rather than the `never` default, and it is the same argument the exposure list above
      # makes: this is safe *because of where the endpoint lives*. The chart moves the whole
      # management port off the application port and no Ingress routes it, so /actuator/** is
      # unreachable from outside the cluster (PLATFORM_SETUP.md §7).
      #
      # Without it the readiness group aggregates to a bare {"status":"DOWN"} and an operator cannot
      # tell "the database is gone" from "the schema is not migrated yet" — which is the whole reason
      # `r2dbc` and `eventsSchema` are two contributors rather than one.
      show-details: always
      group:
        readiness:
          include: readinessState,r2dbc,eventsSchema
        liveness:
          include: livenessState
  info:
    build:
      # Reads META-INF/build-info.properties, stamped by the `bootBuildInfo` task.
      enabled: true
    git:
      # Set explicitly because the *absence* of a git.properties file is a deliberate decision, not
      # an oversight: the commit arrives through build-info.properties as `build.commit` instead, so
      # no gradle-git-properties plugin is needed. Do not "fix" this by adding one.
      enabled: false

---
# Local development only — `--spring.profiles.active=local`. Mirrors console output to a file so a
# run can be grepped afterwards, which matters here because `RequestLoggingFilter` emits one
# access-log line per request. Profile-gated rather than global: on a container platform the log
# belongs on stdout, and a file appender writes into the container's in-memory filesystem.
#
# The path is relative to the working directory (the module directory under `bootRun`), so it lands
# in `events-bff/build/dev-env/` — gitignored at any depth, parents created by Logback. The filename
# differs from the importer's so both services can run at once.
spring:
  config:
    activate:
      on-profile: local

logging:
  file:
    name: build/dev-env/bff.log
