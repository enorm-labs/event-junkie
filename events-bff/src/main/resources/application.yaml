spring:
  application:
    name: events-bff
  # Spring Security guards only the account paths (AccountSecurityConfiguration). Without this, Boot
  # builds an in-memory user with a generated password and logs it at every start.
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.ReactiveUserDetailsServiceAutoConfiguration
  # The BFF serves JSON only. Boot's default catch-all resource handler logged a WARN for every scanner
  # traversal probe before the 404 (#3075). Swagger UI is served by springdoc's own handler.
  web:
    resources:
      add-mappings: false
  r2dbc:
    properties:
      schema: events
      # No cached prepared statements. `findById` selects `table.*`, so a column the next release's
      # migration adds changes a cached statement's result type and aborts its transaction: five
      # 500s from the outgoing pods beside V178 and V179 (#3648). The cost is a parse per query.
      preparedStatementCacheQueries: 0
    # A connection that died without the pool noticing, as when PostgreSQL restarts while the network
    # is down, fails the first query sent on it. A round trip on acquire finds it first, and one retry
    # per pooled connection lets every dead one be replaced before a request fails (#2318).
    pool:
      max-size: 10
      validation-query: SELECT 1
      validation-depth: remote
      acquire-retry: 10
  # Transactional mail through Scaleway TEM (ADR-054). No host here: without SPRING_MAIL_HOST Boot
  # builds no sender and `Mailer` does not exist, so a cluster without the mail Secret still starts.
  # The chart sets host, port, username and password from `mail.existingSecret`. TLS is required, so
  # a misconfigured port fails the send instead of sending the password in clear text.
  mail:
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

# gzip for every caller that asks (#1206): JSON shrinks about tenfold, and the 30-day calendar is
# 2.2 MB without it. 1 KB matches the frontend's nginx `gzip_min_length`. Boot's default MIME types
# include `application/json` and exclude `image/*`, so the image route's bytes are left alone.
server:
  compression:
    enabled: true
    min-response-size: 1KB

app:
  api:
    # The largest page the public read API returns (#268). `@PageableDefault` sets a default and
    # never a maximum, and `spring.data.web.pageable.max-page-size` is servlet-only, so
    # StableSortPageableArgumentResolver applies this. 100 because the venue detail feed asks for 50.
    max-page-size: 100
    cache:
      # How long an assembled response may be reused, and how many are held. Imports run daily per
      # source, so 60 seconds is a fraction of a cycle (ResponseCache has why the bound counts items).
      # Overridable as APP_API_CACHE_TTL_SECONDS and APP_API_CACHE_MAXIMUM_ITEMS.
      ttl-seconds: 60
      maximum-items: 20000
  images:
    serving:
      # Off: a response carries the venue's own URL. On: a path on our own origin, and an image with
      # no derivative yet is reported absent rather than hotlinked (ADR-019). Do not turn this on
      # before the derivatives exist, or the backlog shows as blank cards.
      enabled: ${APP_IMAGES_SERVING_ENABLED:false}
    storage:
      # The same four settings, under the same environment variable names, as the importer, so one
      # Secret serves both. No prefix: a served key is read from the row that recorded it.
      endpoint: ${IMAGE_STORAGE_ENDPOINT:https://fsn1.your-objectstorage.com}
      region: ${IMAGE_STORAGE_REGION:fsn1}
      bucket: ${IMAGE_STORAGE_BUCKET:event-junkie-images}
      # Empty by default: without credentials no client is built and the route answers 503.
      access-key: ${IMAGE_STORAGE_ACCESS_KEY:}
      secret-key: ${IMAGE_STORAGE_SECRET_KEY:}
  site:
    # The origin a sign-in link points at. Per cluster, because a staging link must not open production.
    # The chart sets it from `ingress.host`; `dev-env.sh` points it at Vite.
    origin: ${APP_SITE_ORIGIN:https://event-junkie.de}
  mail:
    # The sending subdomain keeps its MX apart from the Hetzner mailboxes (ADR-054).
    from: ${APP_MAIL_FROM:Event Junkie <noreply@notify.event-junkie.de>}
  push:
    # Web Push (ADR-055). The VAPID keys, `app.push.vapid.private-key` and `.public-key`, are not set here: without
    # them the BFF builds no sender, and the account page says notifications are not available. The chart sets them
    # from the push Secret as APP_PUSH_VAPID_PRIVATE_KEY and APP_PUSH_VAPID_PUBLIC_KEY.
    # The contact a push service's operator reaches us at (RFC 8292).
    subject: ${APP_PUSH_SUBJECT:mailto:hello@event-junkie.de}
    # The push services a subscription may point at: Google, Mozilla, Apple, Microsoft. Anything else is refused.
    # One comma-separated string, because `@Value` does not read a YAML list.
    allowed-origins: >-
      https://fcm.googleapis.com,https://updates.push.services.mozilla.com,https://web.push.apple.com,https://*.notify.windows.com
    # How often new events are announced. The job reads up to `lag` before now, so an import still in its
    # transaction is read on the next run rather than skipped.
    new-dates-delay: PT10M
    new-dates-lag: PT15M

# `info` joins the default `health`. It must NOT be routed through the public ingress: the
# browser gets `GET /meta`, a curated contract (docs/LEGAL.md §4.4), and the chart sets
# MANAGEMENT_SERVER_PORT=9001 so the actuator sits on a port no ingress names
# (PLATFORM_SETUP.md §7). Not set here, so local development keeps its single port.
management:
  endpoints:
    web:
      exposure:
        # `prometheus` joins health and info, unreachable from outside for the reason above.
        include: health,info,prometheus
  # `include` replaces a group's default membership, so `readinessState` has to be repeated. The
  # names are validated at startup, so a typo is a context failure.
  #
  # Readiness includes the database; liveness must never (ADR-018): a pod that cannot reach the
  # database can serve nothing, and reporting Ready puts traffic into a black hole (#438), while a
  # database-dependent liveness probe restarts every replica during an outage. `r2dbc` is
  # reachable, `eventsSchema` is migrated and readable (EventsSchemaHealthIndicator has why the
  # first alone would not have closed the window #263 measured), and `schemaVersion` has reached
  # the highest migration this build knows (#3384).
  # Boot adds a mail contributor to `/actuator/health` once a host is set. A Scaleway outage must not
  # mark the BFF unhealthy: it stops sign-ins, not the event pages (ADR-018).
  health:
    mail:
      enabled: false
  endpoint:
    health:
      # `always` rather than `never`, so an operator can tell "the database is gone" from "the schema
      # is not migrated yet", the reason `r2dbc` and `eventsSchema` are two contributors.
      show-details: always
      group:
        readiness:
          include: readinessState,r2dbc,eventsSchema,schemaVersion
        liveness:
          include: livenessState
  info:
    build:
      # Reads META-INF/build-info.properties, stamped by the `bootBuildInfo` task.
      enabled: true
    git:
      # Set explicitly: the absence of a git.properties file is a decision. The commit arrives through
      # build-info.properties as `build.commit`, so no gradle-git-properties plugin. Do not add one.
      enabled: false

---
# Local development only (`--spring.profiles.active=local`): mirrors console output to a file so
# a run can be grepped, since `RequestLoggingFilter` emits one line per request. Profile-gated
# because on a container platform the log belongs on stdout. The path is relative to the module
# directory under `bootRun`, so it lands in `events-bff/build/dev-env/`, gitignored; the filename
# differs from the importer's so both can run at once.
spring:
  config:
    activate:
      on-profile: local

logging:
  file:
    name: build/dev-env/bff.log
