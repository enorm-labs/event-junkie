spring:
  application:
    name: events-bff
  r2dbc:
    properties:
      schema: events

# `info` joins the default `health`, so operators can ask a running instance which build it is.
# It must NOT be routed through the public ingress — the browser gets `GET /meta` instead, which
# is a curated, OpenAPI-documented contract rather than a framework-shaped payload
# (docs/LEGAL.md §4.4). That split now lives in the Helm chart: `deploy/charts/event-junkie` sets
# MANAGEMENT_SERVER_PORT=9001 on both JVM services, so in a cluster the actuator endpoints are on a
# port no ingress rule names — unroutable rather than merely unrouted. Deliberately not set here, so
# local development and the tests keep their single-port behaviour.
management:
  endpoints:
    web:
      exposure:
        # `prometheus` joins health and info here, and this is safe *because of where the endpoint
        # lives, not because of what it contains*: the chart moves the whole management port off the
        # application port (bff.service.managementPort) and no Ingress routes it, so /actuator/** —
        # including this — is unreachable from outside the cluster. See PLATFORM_SETUP.md §7.
        include: health,info,prometheus
  info:
    build:
      # Reads META-INF/build-info.properties, stamped by the `bootBuildInfo` task.
      enabled: true
    git:
      # Set explicitly because the *absence* of a git.properties file is a deliberate decision, not
      # an oversight: the commit arrives through build-info.properties as `build.commit` instead, so
      # no gradle-git-properties plugin is needed. Do not "fix" this by adding one.
      enabled: false

---
# Local development only — activate with `--spring.profiles.active=local` (IntelliJ: run
# configuration → "Active profiles: local"). Mirrors the console output to a file so a run can
# be grepped after the fact, which the IDE console alone does not allow. Particularly useful
# here because `RequestLoggingFilter` emits one access-log line per request.
#
# Deliberately profile-gated rather than global: on a container platform the log belongs on
# stdout, and a file appender there would write into the container's in-memory filesystem.
#
# The path is relative to the working directory (the module directory under `bootRun`), so it
# lands in `events-bff/build/dev-env/`. `build` is gitignored at any depth, and Logback creates
# the parent directories. The filename differs from the importer's so that running both
# services at once keeps two separate logs.
spring:
  config:
    activate:
      on-profile: local

logging:
  file:
    name: build/dev-env/bff.log
