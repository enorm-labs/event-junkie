# Test configuration for the BFF. Shadows the main application.yaml on the test classpath, so it
# repeats the runtime properties the BFF relies on and enables Flyway, which runs the importer's
# migrations against the Testcontainers database from the absolute path build.gradle.kts passes as
# `spring.flyway.locations`.
spring:
  application:
    name: events-bff
  # Repeated from the main file: no in-memory user with a logged password (AccountSecurityConfiguration).
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.ReactiveUserDetailsServiceAutoConfiguration
  # Repeated because this file shadows the main one. `StaticResourceHandlerTest` asserts the two agree.
  web:
    resources:
      add-mappings: false
  r2dbc:
    properties:
      schema: events
      # No cached prepared statements. `findById` selects `table.*`, so a column the next release's
      # migration adds changes a cached statement's result type and aborts its transaction: five
      # 500s from the outgoing pods beside V178 and V179 (#3648). The cost is a parse per query.
      preparedStatementCacheQueries: 0
    # A connection that died without the pool noticing, as when PostgreSQL restarts while the network
    # is down, fails the first query sent on it. A round trip on acquire finds it first, and one retry
    # per pooled connection lets every dead one be replaced before a request fails (#2318).
    pool:
      max-size: 10
      validation-query: SELECT 1
      validation-depth: remote
      acquire-retry: 10
  flyway:
    enabled: true
    schemas: events
    create-schemas: true

# Repeated because this file shadows the main one. `CompressionTest` asserts the two blocks agree.
server:
  compression:
    enabled: true
    min-response-size: 1KB

# Mirrors the main application.yaml's exposure list and health groups, and has to (#415): this
# file shadows the main one rather than merging, so without the list `/actuator/prometheus` 404s
# in tests while working in production, and the groups prove nothing about what ships. A test
# cannot catch a typo in the main file, which is why `MetricsExposureConfigTest` and
# `ReadinessGroupConfigTest` assert that file directly and that the two agree.
#
# The database contributors exist in every test context, all being full @SpringBootTest against a
# Testcontainers PostgreSQL. A future @WebFluxTest would fail on group-membership validation; the
# fix is to exclude the group, not the indicator.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # `always` rather than `never`, safe because the chart moves the management port off the
      # application port and no Ingress routes it (PLATFORM_SETUP.md §7). Without it an operator cannot
      # tell "the database is gone" from "the schema is not migrated yet".
      show-details: always
      group:
        readiness:
          include: readinessState,r2dbc,eventsSchema,schemaVersion
        liveness:
          include: livenessState

# Repeated because this file shadows the main one, and `WebFluxConfiguration` reads the property
# with no fallback. `MaxPageSizeConfigTest` asserts the two numbers agree.
app:
  # No scheduled jobs in tests: InactiveAccountCleanupTest calls the cleanup directly.
  scheduling:
    enabled: false
  site:
    origin: https://event-junkie.de
  mail:
    from: Event Junkie <noreply@notify.event-junkie.de>
  push:
    # No VAPID keys, so no sender: PushFlowTest adds them with a local push service.
    subject: mailto:hello@event-junkie.de
    # One comma-separated string, because `@Value` does not read a YAML list.
    allowed-origins: >-
      https://fcm.googleapis.com,https://updates.push.services.mozilla.com,https://web.push.apple.com,https://*.notify.windows.com
    new-dates-delay: PT10M
    new-dates-lag: PT15M
    # Long, so the scheduler never runs the job during a test that calls `run()` itself.
    new-dates-initial-delay: PT10M
    changes-delay: PT10M
    changes-lag: PT15M
    changes-initial-delay: PT10M
  api:
    max-page-size: 100
    cache:
      # The shipped numbers, so the tests exercise the path that ships; BaseControllerTest empties the
      # cache beside the TRUNCATE.
      ttl-seconds: 60
      maximum-items: 20000
