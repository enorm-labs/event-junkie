# Test configuration for the BFF.
#
# Shadows the main application.yaml on the test classpath, so it must repeat the runtime
# properties the BFF relies on (schema for the R2DBC NamingStrategy) and additionally enables
# Flyway. The BFF owns no migrations; in tests Flyway runs the importer's migrations to provision
# the `events` schema against the Testcontainers database. The migration location is supplied as
# an absolute filesystem path via the `spring.flyway.locations` system property (see build.gradle.kts).
spring:
  application:
    name: events-bff
  r2dbc:
    properties:
      schema: events
  flyway:
    enabled: true
    schemas: events
    create-schemas: true

# Mirrors the main application.yaml's exposure list, and has to (#415).
#
# **This file shadows the main one rather than merging with it**, which is what the header above
# means in practice for anything actuator-related: with the list absent here, Spring falls back to
# its default of `health` only, and `/actuator/prometheus` 404s in tests while working perfectly in
# production. The consequence worth knowing: a test cannot catch a typo in the *main* file's list,
# because it never reads it. `MetricsExposureConfigTest` asserts that file directly for exactly that
# reason.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
