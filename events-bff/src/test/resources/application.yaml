# Test configuration for the BFF.
#
# Shadows the main application.yaml on the test classpath, so it must repeat the runtime
# properties the BFF relies on (schema for the R2DBC NamingStrategy) and additionally enables
# Flyway. The BFF owns no migrations; in tests Flyway runs the importer's migrations to provision
# the `events` schema against the Testcontainers database. The migration location is supplied as
# an absolute filesystem path via the `spring.flyway.locations` system property (see build.gradle.kts).
spring:
  application:
    name: events-bff
  r2dbc:
    properties:
      schema: events
  flyway:
    enabled: true
    schemas: events
    create-schemas: true

# Mirrors the main application.yaml's exposure list and health groups, and has to (#415). **This
# file shadows the main one rather than merging with it**: with the list absent here Spring falls
# back to `health` only, so `/actuator/prometheus` 404s in tests while working in production, and
# the groups fall back to `readinessState` alone, proving nothing about the group that ships. The
# consequence worth knowing is that a test cannot catch a typo in the *main* file — it never reads
# it — which is why `MetricsExposureConfigTest` and `ReadinessGroupConfigTest` assert that file
# directly and assert the two agree.
#
# Both contributors named here exist in every test context: all BFF tests are full @SpringBootTest
# against a Testcontainers PostgreSQL. A future slice test (@WebFluxTest, no ConnectionFactory)
# would fail to start on group-membership validation — the correct signal, and the fix is to exclude
# the group, not the indicator.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # `always` rather than the `never` default, and it is the same argument the exposure list above
      # makes: this is safe *because of where the endpoint lives*. The chart moves the whole
      # management port off the application port and no Ingress routes it, so /actuator/** is
      # unreachable from outside the cluster (PLATFORM_SETUP.md §7).
      #
      # Without it the readiness group aggregates to a bare {"status":"DOWN"} and an operator cannot
      # tell "the database is gone" from "the schema is not migrated yet" — which is the whole reason
      # `r2dbc` and `eventsSchema` are two contributors rather than one.
      show-details: always
      group:
        readiness:
          include: readinessState,r2dbc,eventsSchema
        liveness:
          include: livenessState
