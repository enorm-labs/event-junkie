name: Role Mailbox Probe

# Proves `hello@` and `security@` still receive, and alerts when they stop (#637). **A mailbox that
# stops receiving looks exactly like a quiet week**, and these two are the only route for Art. 15–21
# requests, Code of Conduct reports, security disclosure and Let's Encrypt's expiry notices.
#
# **On GitHub, because the mail does not run on our node** (Hetzner Webhosting) — a CronJob in the
# cluster would report cluster death as mail death. **A conditional ping, never a heartbeat** (#271):
# `scripts/mail-probe.py` sends, waits for that message over IMAP, deletes it, then pings; a bare
# login would pass while the MX pointed nowhere. **Both mailboxes probed in one job, both even when
# the first fails.** **Arming it is four repository secrets**; without them the job says so in its
# summary rather than passing quietly.

on:
  schedule:
    # **Daily, derived from measurement**: GitHub honours the daily schedules (site-probe.yml has the
    # numbers) and refuses fast ones, so the receiving checks want a 24-hour period and grace. 06:23 is
    # clear of the site probe and the nightly scans, and off the top of the hour.
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Not `cancel-in-progress`: a cancelled run is a probe that asserted nothing, and its check goes late
  # for a reason unrelated to the mailbox.
  group: mail-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Probe the role mailboxes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # `sparse-checkout`: one script is all this needs, and a narrower checkout is a smaller blast radius
      # for a workflow holding a mail password.
      - name: Check out the probe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/mail-probe.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # **One job naming both mailboxes, not a matrix over secret names**: `secrets[matrix.name]` makes
      # GitHub inject *every* secret into the runner, which zizmor and CodeQL refuse. And `${{ cond &&
      # secrets.A || secrets.B }}` is a trap: the `||` arm wins when `secrets.A` is merely empty, sending
      # the other mailbox's credential — and a wrong password costs ~25 minutes of Hetzner blocking the
      # port (docs/ops/EMAIL.md § Monitoring).
      - name: Send, wait for delivery, then ping
        env:
          HELLO_PASSWORD: ${{ secrets.MAIL_PROBE_HELLO_PASSWORD }}
          HELLO_PING_URL: ${{ secrets.HEALTHCHECKS_MAIL_HELLO_PING_URL }}
          SECURITY_PASSWORD: ${{ secrets.MAIL_PROBE_SECURITY_PASSWORD }}
          SECURITY_PING_URL: ${{ secrets.HEALTHCHECKS_MAIL_SECURITY_PING_URL }}
        run: |
          set -uo pipefail

          # One failing must not skip the other: different audiences, different failure modes, and the second
          # is worth testing precisely on the day the first is broken. The exit code is collected, not returned.
          overall=0

          probe() {
            mailbox="$1"
            password="$2"
            ping_url="$3"

            if [ -z "${password}" ] || [ -z "${ping_url}" ]; then
              {
                echo "## ⏸️ Not probing \`${mailbox}\` — its secrets are not set"
                echo
                echo "**To activate:** create a check on healthchecks.io with a 24-hour period and a"
                echo "24-hour grace, then add its ping URL and the mailbox password as repository"
                echo "secrets. docs/ops/EMAIL.md § Monitoring names all four."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "Secrets for ${mailbox} unset — skipping."
              return 0
            fi

            if MAIL_PROBE_PASSWORD="${password}" \
                 python3 scripts/mail-probe.py --mailbox "${mailbox}" --ping-url "${ping_url}"; then
              echo "## ✅ \`${mailbox}\` receives" >> "$GITHUB_STEP_SUMMARY"
              return 0
            fi

            {
              echo "## 🔴 \`${mailbox}\` did not receive"
              echo
              echo "The step log names which hop failed. The check has been pinged \`/fail\`, so the"
              echo "alert is already out rather than waiting on the grace period."
              echo
              echo "**What to do:** docs/ops/EMAIL.md § Monitoring."
            } >> "$GITHUB_STEP_SUMMARY"
            overall=1
            return 0
          }

          probe hello@event-junkie.de "${HELLO_PASSWORD}" "${HELLO_PING_URL}"
          probe security@event-junkie.de "${SECURITY_PASSWORD}" "${SECURITY_PING_URL}"

          exit "${overall}"
