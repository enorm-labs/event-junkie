# ==============================================================================================
#  NEVER ADD `actions/checkout` — OR ANY STEP THAT RUNS PULL-REQUEST CODE — TO THIS FILE.
#  `pull_request_target` runs with the BASE repository's writable token against a pull request
#  from anyone; safe only because nothing fetches or runs the contributor's code (#479, #443).
# ==============================================================================================
#
# Bot pull requests are the one class that arrives with no milestone: `dependabot.yml` has no key for
# one and Renovate has no concept of them. The release App opens none since ADR-032 and stays in
# `BOTS` for one it ever opens again. The "oldest open milestone" rule lives here and nowhere else;
# a milestone already set is never overwritten.
#
# **`BOTS` is matched by login, so a new bot is invisible here until added** — and invisibly: the skip
# is logged as normal operation. The App's login is its slug plus `[bot]`, so renaming the App
# re-opens the gap silently. The filename stays because renaming it breaks every link into it.
name: Milestone bot PRs

on:
  # comment-lint: allow a dated suppression, per the reason in zizmor.yml
# zizmor: ignore[dangerous-triggers]
  # 2026-08-25 — safe only while this file has no checkout, the property to re-check before adding any
  # step. Required, too: a `pull_request` run raised by Dependabot gets a read-only token.
  pull_request_target:
    types: [ opened, reopened ]

  # Sweeps open bot pull requests that have none. The button exists once this file is on the default branch.
  workflow_dispatch:
    inputs:
      milestone:
        description: 'Milestone title to apply (default: the oldest open milestone)'
        required: false
        type: string

permissions:
  contents: read
  # Which scope governs a milestone on a pull request is not clearly documented, so both are granted;
  # guessing wrong is a 403 that reads as milestones quietly not appearing.
  issues: write
  pull-requests: write

concurrency:
  group: milestone-dependabot-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  milestone:
    name: Apply a milestone to bot PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set the milestone
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const BOTS = new Set(['dependabot[bot]', 'dependabot-preview[bot]', 'renovate[bot]', 'event-junkie-release[bot]']);
            const { owner, repo } = context.repo;

            // No milestone here carries a due date, so the oldest open one is the release being worked toward,
            // and when it closes the next wins by itself.
            const milestones = await github.paginate(github.rest.issues.listMilestones, {
              owner, repo, state: 'open', per_page: 100,
            });
            if (milestones.length === 0) {
              core.warning('No open milestone — nothing to apply.');
              return;
            }

            // `core.getInput` reads this step's own `with:` block, not the dispatch inputs.
            const wanted = context.payload.inputs?.milestone;
            const target = wanted
              ? milestones.find((m) => m.title === wanted)
              : milestones.reduce((a, b) => (a.number <= b.number ? a : b));

            // Open milestones only, so an unknown title fails loudly instead of falling back.
            if (!target) {
              core.setFailed(`No open milestone titled "${wanted}". Open: ${milestones.map((m) => m.title).join(', ')}`);
              return;
            }

            const assign = async (number, title) => {
              await github.rest.issues.update({ owner, repo, issue_number: number, milestone: target.number });
              core.info(`#${number} -> ${target.title}   (${title})`);
            };

            if (context.eventName === 'pull_request_target') {
              const pr = context.payload.pull_request;
              if (!BOTS.has(pr.user.login)) {
                core.info(`#${pr.number} is from ${pr.user.login}, not a known bot — left alone.`);
                return;
              }
              if (pr.milestone) {
                core.info(`#${pr.number} already has "${pr.milestone.title}" — left alone.`);
                return;
              }
              await assign(pr.number, pr.title);
              return;
            }

            // `listForRepo` is the issues endpoint, so it returns pull requests too and carries the milestone
            // field the pulls endpoint omits.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const todo = open.filter((i) => i.pull_request && !i.milestone && BOTS.has(i.user.login));

            if (todo.length === 0) {
              core.info('Every open bot pull request already has a milestone.');
              return;
            }
            for (const pr of todo) {
              await assign(pr.number, pr.title);
            }
            core.notice(`Applied "${target.title}" to ${todo.length} bot pull request(s).`);
