# Claude driven by /refactor (#389), opening a pull request and never pushing to main. The shared
# shape is in ci-cd.instructions.md; the traps here:
#
# **`--unattended` fences the run away from shared normalization, and that fence is the whole safety
# argument.** Slug generation, genre normalization, artist-name mapping and price parsing are called
# by every importer; a change there compiles, passes the suite, and still changes the rows that land
# in the database — only a `--full` re-seed catches it, and the runner has no database. Findings in
# that code are reported. **No `github_token:`** (agent-security.yml). **`display_report: true`,
# never `show_full_output`.** **The `inputs` context is empty on a schedule**, so every input carries
# a fallback or a scheduled run goes live by accident.
name: Agent — Refactor

on:
  # Nightly, off-the-hour; the agent workloads keep staggered start times so a night is a queue.
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
    inputs:
      model:
        description: Model to run the refactor with
        type: choice
        default: claude-opus-5
        options:
          - claude-opus-5
          - claude-opus-4-8
          - claude-sonnet-5
      dry_run:
        description: Report only — read, reason, and open no pull request
        type: boolean
        default: true
      scope:
        description: What to reshape — a path, or --audit to rank the whole repository first
        type: string
        default: --audit

permissions:
  contents: read
  id-token: write

concurrency:
  group: agent-refactor
  cancel-in-progress: false

jobs:
  refactor:
    name: Refactor (agent)
    runs-on: ubuntu-latest
    # The longest of the family: the prompt requires the suite after every concern, so several builds.
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25 (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Kover is the before-and-after number the prompt reports; a refactor that drops coverage deleted a
      # tested branch.
      - name: Run /refactor
        id: claude
        uses: anthropics/claude-code-action@7b0b255830a1fab6e602658672acad11c12d841d # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          display_report: true
          prompt: /refactor ${{ inputs.scope || '--audit' }} --unattended${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && ' --dry-run' || '' }}
          claude_args: |
            --model ${{ inputs.model || 'claude-opus-5' }}
            --max-turns 120
            --allowedTools "Bash,Read,Glob,Grep,Edit,Write,TodoWrite"

      # Reporting steps last and guarded. The step summary has no REST API, so the final report is
      # extracted to an artifact — the report alone, never the execution file with every tool result.
      - name: Extract the report
        if: success() || failure()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          : > agent-report.md
          if [ -n "${EXECUTION_FILE:-}" ] && [ -s "$EXECUTION_FILE" ]; then
            jq -s -r '[.. | objects | select(.type == "result") | .result // empty] | last // ""' \
              "$EXECUTION_FILE" > agent-report.md || true
          fi
          if [ ! -s agent-report.md ]; then
            echo 'No report extracted. The execution file was empty or its shape changed.' > agent-report.md
          fi

      - name: Upload the report
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-report
          path: agent-report.md

      # **A run that produced no report is a failed run, whatever its exit code.** A closing line like "I'll
      # compile the report once the checks finish" reports success and delivers a sentence, and has. After
      # the upload, so the stub is preserved; guarded on the agent step succeeding.
      - name: Fail if the report is a stub
        if: steps.claude.outcome == 'success'
        run: |
          set -euo pipefail
          bytes=$(wc -c < agent-report.md)
          lines=$(wc -l < agent-report.md)
          if [ "$bytes" -lt 400 ] || [ "$lines" -lt 5 ]; then
            echo "::error::The agent reported success but wrote no report ($bytes bytes, $lines lines). See the agent-report artifact."
            cat agent-report.md
            exit 1
          fi
