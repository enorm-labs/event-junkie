name: Release

# Build, scan and publish the five artifacts — four images and the chart — to GHCR. **This does not
# deploy**: Flux pulls and reconciles on its own schedule (#414), so a green run means the artifacts
# exist, not that they are live. Nothing here holds a cluster credential.
#
# Three things about the trigger are deliberate. **A snapshot on every push to `main`, a release when a
# GitHub Release is published**; tagging by hand publishes nothing. **No path filters on the publishing
# trigger**: the chart's `appVersion` is every component's default image tag, so a chart published from
# a frontend-only commit would name two backend tags that were never built — ImagePullBackOff in
# staging, hours later. **No tests**: they gate the pull request, and branch protection is what keeps an
# unbuilt-on push off `main`.

on:
  push:
    branches: [ main ]
  # The trigger is the publish event, not the tag: `push: tags` also fires for a tag pushed from a laptop
  # (a release with no notes and no Releases entry) and does not fire for a release cut from an existing
  # tag. `github.ref` is `refs/tags/<tag>` here, so `scripts/version.sh` reads it unchanged. A draft fires
  # nothing until published.
  release:
    types: [ published ]
  # `workflow_dispatch` exists only for workflows already on the default branch, and merging is what
  # publishes — so this workflow tests itself: a change to it, or to the version script, runs the whole
  # thing on the pull request and pushes nothing.
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/version.sh'
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Push to GHCR. Off by default, so a dispatch run builds, scans, lints and packages
          everything and pushes none of it.
        type: boolean
        default: false

# Queue rather than cancel: a cancelled release can leave images pushed and the chart unpushed, the
# one inconsistent state this design exists to prevent.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # The only credential, issued to the run: GHCR grants the token admin on packages this repository
  # publishes, so there is no registry secret to rotate.
  packages: write
  # Trivy's findings go to Code Scanning alongside detekt's and Dependency-Check's.
  security-events: write
  # Build provenance (#443): `id-token: write` mints the OIDC token Sigstore signs with, `attestations:
  # write` stores the statement. Neither can push; `packages: write` is still the only registry write.
  id-token: write
  attestations: write
  # The attest action also registers each image on the organisation's artifacts page; metadata only.
  artifact-metadata: write

env:
  IMAGE_PREFIX: ghcr.io/enorm-labs/event-junkie
  CHART: deploy/charts/event-junkie
  CHART_REPO: oci://ghcr.io/enorm-labs/charts
  # Pinned to the Helm SDK helm-controller embeds, as validate-chart.yml is, so the client that packages
  # the chart is the one that installs it.
  HELM_VERSION: 4.3.0
  TRIVY_VERSION: 0.74.0

jobs:
  publish:
    name: Build, scan and publish
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # The whole history and every tag: the version is read from the last release tag and the commits
      # since it (ADR-032); a shallow clone would compute `0.0.0-local`.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # One number, computed once, stamped onto all four artifacts. `scripts/version.sh` owns the rules,
      # including the guard that a tag cannot claim a number the commits do not deserve. A snapshot embeds
      # the commit's committer date (#455), so `compute` runs after the checkout.
      - name: Compute the version
        id: version
        run: |
          version="$(scripts/version.sh compute)"
          echo "value=$version" >> "$GITHUB_OUTPUT"

          # A release is a tag; everything else is a snapshot of the version that tag will carry.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

          # An allowlist, not a denylist: written as "publish unless dry run", every trigger added later
          # publishes by default — including the `pull_request` trigger above, from a fork.
          if [[ "$GITHUB_EVENT_NAME" == "push" || "$GITHUB_EVENT_NAME" == "release" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${{ inputs.publish }}" == "true" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Dry run — building and scanning $version, publishing nothing."
          fi

      # `latest` is a human pointer and nothing in the deploy path may consume it: with `imagePullPolicy:
      # IfNotPresent` a mutable tag lets two nodes run different code. The chart's assertions refuse a
      # floating tag on the consuming side.
      - name: Assemble the image tags
        id: tags
        run: |
          version="${{ steps.version.outputs.value }}"
          for component in bff importer frontend injector; do
            {
              echo "${component}<<TAGS"
              echo "${IMAGE_PREFIX}/${component}:${version}"
              if [[ "${{ steps.version.outputs.release }}" == "true" ]]; then
                echo "${IMAGE_PREFIX}/${component}:latest"
              fi
              echo "TAGS"
            } >> "$GITHUB_OUTPUT"
          done

      # --- Build the artifacts the images copy ---------------------------------------------------

      - name: Set up Java 25 (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      # **Caching is disabled here, and only here.** zizmor's `cache-poisoning`: a pull-request run can write
      # a cache entry a later privileged run restores, and this workflow is reachable from `pull_request`.
      # The build workflows keep their caches because they publish nothing.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true

      # `-Pversion=` reaches `bootBuildInfo`, so `/actuator/info` reports exactly the string the image is
      # tagged with.
      - name: Extract the layered jars
        run: ./gradlew -Pversion=${{ steps.version.outputs.value }} :events-bff:bootJarLayers :events-importer:bootJarLayers

      # comment-lint: allow a dated suppression, per the reason in zizmor.yml
      # 2026-08-12 — the `ignore` below: `setup-node` *can* cache in a publishing workflow; without
      # `cache:` it caches nothing.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0  # zizmor: ignore[cache-poisoning]
        with:
          node-version: '24' # should match the version specified in .nvmrc
          # No `cache: 'npm'` here, for the same cache-poisoning reason as Gradle above.

      - name: Install frontend dependencies
        working-directory: events-frontend
        run: npm ci

      # The frontend Dockerfile has no builder stage — it copies `dist/`, so this is the only build.
      - name: Build the frontend
        working-directory: events-frontend
        run: npm run build

      # Two builds per image, because a multi-platform image cannot be loaded into the local daemon and so
      # cannot be scanned before it exists in a registry: build amd64 and load, scan, then rebuild for both
      # platforms from the same cache and push. Only the amd64 variant is scanned; the two differ solely in
      # the base image's arch-specific layers.

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      # Only when something will be pushed: the base images and Trivy's database pull anonymously, and on a
      # fork's pull request the token is read-only, so an unconditional login would fail a step it never
      # needed.
      - name: Log in to GHCR
        if: steps.version.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build events-bff (amd64, for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: events-bff/build/docker
          file: events-bff/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_PREFIX }}/bff:${{ steps.version.outputs.value }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}

      - name: Build events-importer (amd64, for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: events-importer/build/docker
          file: events-importer/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_PREFIX }}/importer:${{ steps.version.outputs.value }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}

      - name: Build events-frontend (amd64, for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: events-frontend
          file: events-frontend/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_PREFIX }}/frontend:${{ steps.version.outputs.value }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}

      # The meta-injection sidecar (#287): `npm run build` emitted `dist-injector/` beside `dist/`.
      - name: Build the injector (amd64, for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: events-frontend
          file: events-frontend/Dockerfile.injector
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_PREFIX }}/injector:${{ steps.version.outputs.value }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}

      # From the release archive rather than an action, so the version is pinned in this file and visible.
      - name: Install Trivy
        run: |
          curl -fsSL \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C /usr/local/bin trivy
          trivy --version

      # Blocks on CRITICAL and HIGH **with a fix available** — `--ignore-unfixed` is what keeps a base-image
      # CVE with no upstream fix from blocking every release until someone deletes the gate. Waivers go in
      # `.trivyignore` with a reason and a date. All four are scanned before the first failure is reported.
      - name: Scan the images
        run: |
          status=0
          for component in bff importer frontend injector; do
            ref="${IMAGE_PREFIX}/${component}:${{ steps.version.outputs.value }}"
            echo "::group::trivy ${ref}"
            trivy image "$ref" \
              --image-src docker \
              --severity CRITICAL,HIGH \
              --ignore-unfixed \
              --format json \
              --output "trivy-${component}.json" \
              --exit-code 1 || status=1

            # A missing report means the scan itself failed; the conversions below would hide that behind a
            # "no such file".
            if [[ ! -s "trivy-${component}.json" ]]; then
              echo "::error::Trivy produced no report for ${ref} — the scan failed, rather than finding vulnerabilities."
              exit 1
            fi

            # The table to the log and to a file: `publish-failure-issue.yml` pastes it into the blocker issue,
            # and an artifact is the only way it can read it.
            trivy convert --format table "trivy-${component}.json" | tee "trivy-${component}.txt"
            trivy convert --format sarif --output "trivy-${component}.sarif" "trivy-${component}.json"
            echo "::endgroup::"
          done
          exit $status

      # `sbom: true` (#443): buildx generates one per image and attaches it to the index, so a consumer can
      # ask "is this image affected by CVE-X" without scanning. Chosen over `actions/attest-sbom`, which
      # wants a Syft step kept in step with the build; the provenance statement below is what is signed,
      # and where an image came from is the claim that matters.
      #
      # Images before the chart, deliberately: a chart published first opens a window in which Flux pulls a
      # chart whose images do not exist yet. An image nothing references is inert.

      - name: Publish events-bff (amd64 + arm64)
        id: push-bff
        if: steps.version.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: events-bff/build/docker
          file: events-bff/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          tags: ${{ steps.tags.outputs.bff }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}

      - name: Publish events-importer (amd64 + arm64)
        id: push-importer
        if: steps.version.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: events-importer/build/docker
          file: events-importer/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          tags: ${{ steps.tags.outputs.importer }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}

      - name: Publish events-frontend (amd64 + arm64)
        id: push-frontend
        if: steps.version.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: events-frontend
          file: events-frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          tags: ${{ steps.tags.outputs.frontend }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}

      - name: Publish the injector (amd64 + arm64)
        id: push-injector
        if: steps.version.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: events-frontend
          file: events-frontend/Dockerfile.injector
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          tags: ${{ steps.tags.outputs.injector }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}

      # A Sigstore-signed provenance statement binding each image **digest** to this workflow, repository,
      # commit and trigger, in a public transparency log:
      #
      #     gh attestation verify oci://ghcr.io/enorm-labs/event-junkie/bff:0.1.0 --repo enorm-labs/event-junkie
      #
      # Not the unsigned provenance buildx attaches to the index — anything that can write the index can
      # write that. The digest, not the tag, because a tag is a mutable pointer. After the images and before
      # the chart: an unattested image is inert and can be re-attested; a chart published while attestation
      # fails is one Flux deploys.
      - name: Attest the published bff image
        if: steps.version.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/bff
          subject-digest: ${{ steps.push-bff.outputs.digest }}
          push-to-registry: true

      - name: Attest the published importer image
        if: steps.version.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/importer
          subject-digest: ${{ steps.push-importer.outputs.digest }}
          push-to-registry: true

      - name: Attest the published frontend image
        if: steps.version.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/frontend
          subject-digest: ${{ steps.push-frontend.outputs.digest }}
          push-to-registry: true

      - name: Attest the published injector image
        if: steps.version.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/injector
          subject-digest: ${{ steps.push-injector.outputs.digest }}
          push-to-registry: true

      # A cosign signature per image, keyless: Fulcio certifies the same OIDC token against the workflow's
      # identity, `https://github.com/enorm-labs/event-junkie/.github/workflows/release.yml@<ref>`, which is
      # what each cluster's OCIRepository `spec.verify` matches. **The attestation says where an image came
      # from; this is what Flux can check** (#1425). Signed by digest, credential from the docker login above.
      - name: Install cosign
        if: steps.version.outputs.publish == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign the published images
        if: steps.version.outputs.publish == 'true'
        env:
          BFF_DIGEST: ${{ steps.push-bff.outputs.digest }}
          IMPORTER_DIGEST: ${{ steps.push-importer.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.push-frontend.outputs.digest }}
          INJECTOR_DIGEST: ${{ steps.push-injector.outputs.digest }}
        run: |
          for component in bff importer frontend injector; do
            var="$(echo "$component" | tr '[:lower:]' '[:upper:]')_DIGEST"
            digest="${!var}"
            # A missing digest would sign nothing and pass — the failure #1087 exists to refuse.
            [[ "$digest" == sha256:* ]] || { echo "::error::no digest for ${component}"; exit 1; }
            cosign sign --yes "${IMAGE_PREFIX}/${component}@${digest}"
          done

      # --- Publish the chart ----------------------------------------------------------------------

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      # The stamp, and the only place the chart's published version is decided: `Chart.yaml`'s values are
      # placeholders, overwritten with the string the images were tagged with, so `appVersion` names images
      # this run pushed.
      - name: Stamp the chart with the same version
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          yq -i '.version = strenv(VERSION) | .appVersion = strenv(VERSION)' "$CHART/Chart.yaml"
          yq -N '{"version": .version, "appVersion": .appVersion}' "$CHART/Chart.yaml"

      # The second stamp (#1473): each image's digest from this run's push, so a node pulls `repo:tag@sha256:…`
      # and a repointed tag changes nothing. Publish only — the self-test renders tags alone. An empty digest
      # fails rather than stamping `""` (#1087); the lint step validates the result against the schema.
      - name: Stamp the chart with the image digests
        if: steps.version.outputs.publish == 'true'
        env:
          BFF_DIGEST: ${{ steps.push-bff.outputs.digest }}
          IMPORTER_DIGEST: ${{ steps.push-importer.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.push-frontend.outputs.digest }}
          INJECTOR_DIGEST: ${{ steps.push-injector.outputs.digest }}
        run: |
          set -euo pipefail
          for pair in bff:BFF_DIGEST importer:IMPORTER_DIGEST frontend:FRONTEND_DIGEST frontend.injector:INJECTOR_DIGEST; do
            key="${pair%%:*}"
            var="${pair#*:}"
            digest="${!var}"
            [[ "$digest" == sha256:* ]] || { echo "::error::no digest for ${key}"; exit 1; }
            DIGEST="$digest" yq -i ".${key}.image.digest = strenv(DIGEST)" "$CHART/values.yaml"
          done
          yq -N '{"bff": .bff.image.digest, "importer": .importer.image.digest, "frontend": .frontend.image.digest, "injector": .frontend.injector.image.digest}' "$CHART/values.yaml"

      # Re-run the gates on the *stamped* chart: `helm lint --strict` is what rejects a version string that
      # is not SemVer. The plugin is installed here too, pinned to validate-chart.yml's version, because a
      # fresh runner has none (#430).
      - name: Lint and assert on the stamped chart
        env:
          HELM_UNITTEST_VERSION: v1.1.2
        run: |
          helm lint --strict "$CHART" \
            --set database.host=10.0.1.2 --set database.existingSecret=events-db
          # `--verify=false` is required from Helm 4 on: this source publishes no provenance.
          helm plugin install https://github.com/helm-unittest/helm-unittest \
            --version "$HELM_UNITTEST_VERSION" --verify=false
          helm unittest --strict "$CHART"
          scripts/cluster-assertions.sh "$CHART"

      - name: Package the chart
        run: helm package "$CHART" --destination build/chart

      # Helm keeps its own registry credential store; inheriting the docker login is not something to depend on.
      - name: Publish the chart
        id: push-chart
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
          # Through the environment, not interpolated: `${{ }}` inside a `run:` block is the shape of a template
          # injection, whether or not this instance is exploitable.
          ACTOR: ${{ github.actor }}
        run: |
          helm registry login ghcr.io \
            --username "$ACTOR" \
            --password "${{ secrets.GITHUB_TOKEN }}"
          # `helm push` prints the digest it created, and that is what gets signed — captured rather than
          # re-resolved from the tag. An empty capture fails rather than signing nothing.
          helm push "build/chart/event-junkie-${VERSION}.tgz" "$CHART_REPO" | tee push.log
          digest="$(sed -n 's/^Digest: *//p' push.log)"
          [[ "$digest" == sha256:* ]] || { echo "::error::helm push printed no digest"; exit 1; }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign the published chart
        if: steps.version.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.push-chart.outputs.digest }}
        run: cosign sign --yes "${CHART_REPO#oci://}/event-junkie@${DIGEST}"

      - name: Summarise
        if: success() || failure()
        run: |
          version="${{ steps.version.outputs.value }}"
          {
            echo "## 📦 Release ${version}"
            echo
            if [[ "${{ steps.version.outputs.publish }}" == "true" ]]; then
              echo "| Artifact | Reference |"
              echo "|---|---|"
              for component in bff importer frontend injector; do
                echo "| \`${component}\` | \`${IMAGE_PREFIX}/${component}:${version}\` |"
              done
              echo "| chart | \`${CHART_REPO#oci://}/event-junkie:${version}\` |"
              echo
              if [[ "${{ steps.version.outputs.release }}" == "true" ]]; then
                echo "Also tagged \`latest\` — a human pointer only; nothing in the deploy path may consume it."
              fi
              echo
              echo "Published, **not deployed**. Flux reconciles on its own schedule."
            else
              echo "Dry run — built, scanned, linted and packaged. Nothing was pushed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Last in the job, after the publish steps (#507): every publish step is guarded on
      # `steps.version.outputs.publish == 'true'`, which carries an implicit `success()`, so an upload
      # placed above them can skip the whole publish — images built and scanned, chart packaged, nothing
      # pushed, staging silently without a chart (#455). One upload per image with its own category, since
      # Code Scanning keys on it. `success() || failure()` so findings are filed whatever failed and one
      # upload cannot take the others down; the `hashFiles` guard skips a report the scan never produced.
      - name: Upload Trivy SARIF (bff)
        if: (success() || failure()) && github.event.pull_request.head.repo.fork != true && hashFiles('trivy-bff.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-bff.sarif
          category: trivy-bff
      - name: Upload Trivy SARIF (importer)
        if: (success() || failure()) && github.event.pull_request.head.repo.fork != true && hashFiles('trivy-importer.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-importer.sarif
          category: trivy-importer
      - name: Upload Trivy SARIF (frontend)
        if: (success() || failure()) && github.event.pull_request.head.repo.fork != true && hashFiles('trivy-frontend.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

      # The three tables, for `publish-failure-issue.yml` to quote on a red `main` run. Same guard and
      # position as the SARIF uploads, for the same reason. Unconditional on the fork check: an artifact
      # needs no token. A week is long enough to replay the run through that workflow's dispatch input.
      - name: Upload the Trivy tables
        if: (success() || failure()) && hashFiles('trivy-*.txt') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-reports
          path: trivy-*.txt
          retention-days: 7
