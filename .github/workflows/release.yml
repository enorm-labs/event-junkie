name: Release

# Build, scan and publish the four artifacts — three images and the chart — to GHCR. **This does not
# deploy.** Flux pulls from GHCR and reconciles on its own schedule (#414, PLATFORM_SETUP §4), so a
# green run here means "the artifacts exist", not "it is live". Nothing in this workflow holds a
# cluster credential, because with pull-based deploys there is none to hold.
#
# Two things about the trigger are deliberate:
#
# **A snapshot on every push to `main`; a release when a GitHub Release is published.** Tagging by
# hand publishes nothing — see the `release` trigger below.
#
# **No path filters on the publishing trigger.** The other workflows have them and are right to; the
# `push` trigger here must not. The chart's `appVersion` is the default image tag for all three
# components, so every published chart version needs all three image tags to exist. Filter this on
# `events-frontend/**` and a frontend-only commit publishes a chart pointing at two backend tags that
# were never built — a failure that surfaces as ImagePullBackOff in staging, hours later, with
# nothing in the logs naming the cause. (The `pull_request` trigger below is filtered, and safely so:
# it never publishes.)
#
# **No tests.** They gate the pull request, and re-running the suite on every push to `main` would
# double CI for no new information. The accepted cost: a direct push to `main` that bypasses a PR can
# publish an unbuilt-on snapshot. Branch protection is what makes that not happen.

on:
  push:
    branches: [ main ]
  # A release is published through GitHub's Releases feature, not by pushing a tag by hand — so the
  # trigger is the publish event rather than the tag it creates. The two are not interchangeable:
  # `push: tags` also fires for a tag pushed straight from a laptop, which would publish a release
  # with no release notes and no entry on the Releases page, and it does *not* fire when a release
  # is cut from a tag that already exists. Keying on `published` makes the Releases page the single
  # record of what was released, and it fires exactly once whichever way the tag got there.
  #
  # `github.ref` is `refs/tags/<tag>` on this event, so `scripts/version.sh` reads it unchanged.
  # Drafts create no tag and fire nothing until published.
  release:
    types: [ published ]
  # This workflow is the only one that cannot be tried before it is trusted: `workflow_dispatch` is
  # offered only for workflows already on the default branch, so a dispatch button added in a pull
  # request does not exist until that request merges — and merging is the thing that publishes. So
  # the workflow tests itself: a change to it, or to the script that computes its version, runs the
  # whole thing on the pull request and pushes nothing.
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/version.sh'
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Push to GHCR. Off by default, so a dispatch run builds, scans, lints and packages
          everything and pushes none of it.
        type: boolean
        default: false

# Queue rather than cancel. A cancelled release can leave images pushed and the chart that references
# them unpushed, which is the one inconsistent state this whole design exists to prevent.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # The only credential in play, and it is issued to the run rather than stored: GHCR grants the
  # workflow token admin on packages published by its own repository, so there is no registry secret
  # to create or rotate (PLATFORM_SETUP §3).
  packages: write
  # Trivy's findings go to Code Scanning alongside detekt's and Dependency-Check's.
  security-events: write
  # Build provenance (#443). `id-token: write` mints the OIDC token Sigstore uses to prove *which
  # workflow, on which commit, in which repository* produced an image; `attestations: write` stores
  # the resulting statement against the repository. Neither grants access to anything else, and
  # nothing here can be used to push: `packages: write` above is still the only write to a registry.
  id-token: write
  attestations: write

env:
  IMAGE_PREFIX: ghcr.io/enorm-labs/event-junkie
  CHART: deploy/charts/event-junkie
  CHART_REPO: oci://ghcr.io/enorm-labs/charts
  # Pinned to Helm 3 for the same reason validate-chart.yml is: Flux's helm-controller embeds the
  # Helm 3 SDK, so a chart packaged by a Helm 4 client is a chart the thing that installs it may not
  # understand.
  HELM_VERSION: v3.21.4
  TRIVY_VERSION: 0.74.0

jobs:
  publish:
    name: Build, scan and publish
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # One number, computed once, stamped onto all four artifacts. `scripts/version.sh` owns the
      # rules — including the guard that a tag cannot invent a version `gradle.properties` has not
      # been bumped to.
      #
      # A snapshot version now embeds the commit's own committer date (#455), so `compute` needs the
      # commit to be present locally — which is why it runs after the checkout rather than from the
      # `github` context. The default `fetch-depth: 1` is enough: it is HEAD's own date, not history.
      - name: Check that every file agrees about the version
        run: scripts/version.sh check

      - name: Compute the version
        id: version
        run: |
          version="$(scripts/version.sh compute)"
          echo "value=$version" >> "$GITHUB_OUTPUT"

          # A release is a tag; everything else is a snapshot of the version that tag will carry.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

          # An allowlist, not a denylist, and the difference is the whole safety property: written
          # the other way round — "publish unless this is a dispatch dry run" — every trigger added
          # later becomes a publishing one by default. The pull_request trigger above would have
          # been exactly that, publishing from unreviewed code, including from a fork.
          if [[ "$GITHUB_EVENT_NAME" == "push" || "$GITHUB_EVENT_NAME" == "release" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${{ inputs.publish }}" == "true" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Dry run — building and scanning $version, publishing nothing."
          fi

      # `latest` is a human pointer at the newest release and nothing in the deploy path may consume
      # it: with `imagePullPolicy: IfNotPresent` a mutable tag lets two nodes run different code and
      # neither is wrong. The chart's render assertions fail the build on a floating tag, which is
      # the guard on the consuming side of that rule.
      - name: Assemble the image tags
        id: tags
        run: |
          version="${{ steps.version.outputs.value }}"
          for component in bff importer frontend; do
            {
              echo "${component}<<TAGS"
              echo "${IMAGE_PREFIX}/${component}:${version}"
              if [[ "${{ steps.version.outputs.release }}" == "true" ]]; then
                echo "${IMAGE_PREFIX}/${component}:latest"
              fi
              echo "TAGS"
            } >> "$GITHUB_OUTPUT"
          done

      # --- Build the artifacts the images copy ---------------------------------------------------

      - name: Set up Java 25 (Temurin)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      # **Caching is disabled in this workflow, and only in this one.** zizmor flags the pairing of a
      # restored cache with a job that publishes signed artifacts (`cache-poisoning`): a run from a
      # pull request can write a cache entry that a later privileged run restores, which turns a PR
      # into a way to influence a published artifact. `release.yml` is reachable from
      # `pull_request` — that is how it self-tests — so the path is real rather than theoretical.
      # The cost is a couple of minutes of re-downloading per release; the build workflows keep
      # their caches, because they publish nothing.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true

      # `-Pversion=` overrides gradle.properties, which is how a release version is cut without ever
      # being committed. It reaches `bootBuildInfo`, so `/actuator/info` reports exactly the string
      # the image is tagged with — the two cannot drift, because they are the same variable.
      - name: Extract the layered jars
        run: ./gradlew -Pversion=${{ steps.version.outputs.value }} :events-bff:bootJarLayers :events-importer:bootJarLayers

      # 2026-08-12 — the `ignore` below: flagged because `setup-node` *can* cache in a workflow that
      # publishes, not because it does. `cache:` is deliberately absent, and setup-node caches
      # nothing without it. The audit is conservative on purpose, which is the right default; this
      # is the instance where it is wrong.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0  # zizmor: ignore[cache-poisoning]
        with:
          node-version: '24' # should match the version specified in .nvmrc
          # No `cache: 'npm'` here, for the same cache-poisoning reason as Gradle above.

      - name: Install frontend dependencies
        working-directory: events-frontend
        run: npm ci

      # The frontend Dockerfile has no builder stage — it copies `dist/`, so this is the only build.
      - name: Build the frontend
        working-directory: events-frontend
        run: npm run build

      # --- Build for amd64 and scan, before anything is pushed -----------------------------------
      #
      # Two builds per image, and the duplication is what "scanned before publish" costs: a
      # multi-platform image cannot be loaded into the local daemon, so it cannot be scanned before
      # it exists in a registry. So each image is built for amd64 and loaded, scanned there, and only
      # then rebuilt for both platforms and pushed — the second build reuses the first's cache and
      # the arm64 half is layer copies of architecture-independent files.
      #
      # The known limit: only the amd64 variant is scanned. The two differ solely in the base image's
      # own arch-specific layers, which is a narrow gap and not a closed one.

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Only when something is actually going to be pushed. Nothing else here needs a credential —
      # the base images and Trivy's database both pull anonymously — and on a fork's pull request
      # the token has read-only package scope, so an unconditional login would fail the run for a
      # step it never needed.
      - name: Log in to GHCR
        if: steps.version.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build events-bff (amd64, for scanning)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: events-bff/build/docker
          file: events-bff/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_PREFIX }}/bff:${{ steps.version.outputs.value }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}

      - name: Build events-importer (amd64, for scanning)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: events-importer/build/docker
          file: events-importer/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_PREFIX }}/importer:${{ steps.version.outputs.value }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}

      - name: Build events-frontend (amd64, for scanning)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: events-frontend
          file: events-frontend/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_PREFIX }}/frontend:${{ steps.version.outputs.value }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}

      # Installed from the release archive rather than via an action, so the version is pinned in
      # this file and visible — the same reason validate-chart.yml installs Flux and its schema plugin this way.
      - name: Install Trivy
        run: |
          curl -fsSL \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C /usr/local/bin trivy
          trivy --version

      # Blocks on CRITICAL and HIGH that have a fix available. `--ignore-unfixed` is the load-bearing
      # flag: a base-image CVE with no upstream fix would otherwise block every release until someone
      # deleted the gate, which is how gates die. A fixable one should block — bump the base digest.
      #
      # Waivers, when one is genuinely needed, go in `.trivyignore` with a reason and a date.
      #
      # All three are scanned before the first failure is reported, so one bad image does not hide
      # the state of the other two.
      - name: Scan the images
        run: |
          status=0
          for component in bff importer frontend; do
            ref="${IMAGE_PREFIX}/${component}:${{ steps.version.outputs.value }}"
            echo "::group::trivy ${ref}"
            trivy image "$ref" \
              --image-src docker \
              --severity CRITICAL,HIGH \
              --ignore-unfixed \
              --format json \
              --output "trivy-${component}.json" \
              --exit-code 1 || status=1

            # A missing report means the scan itself failed rather than finding something, and the
            # conversions below would fail with a confusing "no such file" that hides the real error.
            if [[ ! -s "trivy-${component}.json" ]]; then
              echo "::error::Trivy produced no report for ${ref} — the scan failed, rather than finding vulnerabilities."
              exit 1
            fi

            trivy convert --format table "trivy-${component}.json"
            trivy convert --format sarif --output "trivy-${component}.sarif" "trivy-${component}.json"
            echo "::endgroup::"
          done
          exit $status

      # The three Trivy SARIF uploads used to sit here, between the scan and the publish. They have
      # moved to the end of the job (#507), and in this workflow that ordering is worth more than it
      # is in build-backend.yml.
      #
      # `upload-sarif` talks to the Code Scanning API. Its own `success() || failure()` guard kept it
      # running when the scan failed — but every publish step below is guarded on
      # `steps.version.outputs.publish == 'true'`, which carries an implicit `success()`. So an
      # upload failing meant **nothing was published**: images built, images scanned clean, chart
      # packaged, and then all six push steps skipped because a report could not be filed.
      #
      # On a push to `main` that is staging silently not receiving the chart — the same shape of
      # invisible failure as #455, arrived at from a different direction.

      # --- Publish the images ---------------------------------------------------------------------
      #
      # `sbom: true` is the SBOM decision #443 asked for, taken rather than deferred. buildx generates
      # one per image and attaches it to the index, so a consumer can answer "is this image affected
      # by CVE-X" without pulling and scanning it — which is the question our own scheduled Trivy run
      # (#442) answers only for us and only nightly.
      #
      # Chosen over `actions/attest-sbom` because the two do different jobs and only one of them is
      # cheap here: buildx already knows every layer's contents at build time, whereas attest-sbom
      # wants an SBOM produced by something else first, which means adding a Syft step and keeping its
      # view of the image in step with the build's. The cost is a slightly larger index and no
      # signature on the SBOM itself; the provenance statement below is what is signed, and it is the
      # claim that actually matters — where the image came from, not what is inside it.
      #
      # Images before the chart, deliberately. The chart names image tags; publishing it first opens
      # a window in which Flux can pull a chart whose images do not exist yet. The reverse ordering
      # has no such window — an image nothing references yet is inert.

      - name: Publish events-bff (amd64 + arm64)
        id: push-bff
        if: steps.version.outputs.publish == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: events-bff/build/docker
          file: events-bff/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          tags: ${{ steps.tags.outputs.bff }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}

      - name: Publish events-importer (amd64 + arm64)
        id: push-importer
        if: steps.version.outputs.publish == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: events-importer/build/docker
          file: events-importer/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          tags: ${{ steps.tags.outputs.importer }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}

      - name: Publish events-frontend (amd64 + arm64)
        id: push-frontend
        if: steps.version.outputs.publish == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: events-frontend
          file: events-frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          tags: ${{ steps.tags.outputs.frontend }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}

      # --- Attest what was just published ----------------------------------------------------------
      #
      # A Sigstore-signed provenance statement binding each image **digest** to this workflow, this
      # repository, this commit and this trigger, recorded in a public transparency log. Anyone can
      # then check that an image came from here and not from somewhere that merely pushed to the same
      # tag:
      #
      #     gh attestation verify oci://ghcr.io/enorm-labs/event-junkie/bff:0.1.0 \
      #       --repo enorm-labs/event-junkie
      #
      # **Not the same thing as the provenance buildx attaches by default.** That is unsigned metadata
      # inside the image index — useful for reading, worthless for proving, because anything that can
      # write the index can write it too. This is a signed claim in a log nobody here controls.
      #
      # Attesting the *digest* rather than the tag is the whole mechanism: a tag is a mutable pointer,
      # so a statement about `:0.1.0` would say nothing after the next push to `:0.1.0`.
      #
      # AFTER the images and BEFORE the chart, deliberately. An image published without an
      # attestation is inert (nothing references it yet) and can be re-attested; a chart published
      # while attestation is failing is one Flux will happily deploy — the same "images before the
      # chart" argument the block above makes, applied to the signature rather than to the image.
      - name: Attest the published bff image
        if: steps.version.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/bff
          subject-digest: ${{ steps.push-bff.outputs.digest }}
          push-to-registry: true

      - name: Attest the published importer image
        if: steps.version.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/importer
          subject-digest: ${{ steps.push-importer.outputs.digest }}
          push-to-registry: true

      - name: Attest the published frontend image
        if: steps.version.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/frontend
          subject-digest: ${{ steps.push-frontend.outputs.digest }}
          push-to-registry: true

      # --- Publish the chart ----------------------------------------------------------------------

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      # The stamp, and the only place the chart's published version is decided. `Chart.yaml`'s
      # committed values are placeholders; this overwrites both with the same string the images were
      # tagged with, so `appVersion` — the fallback every component's `image.tag` resolves to — names
      # images that were pushed by this very run.
      - name: Stamp the chart with the same version
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          yq -i '.version = strenv(VERSION) | .appVersion = strenv(VERSION)' "$CHART/Chart.yaml"
          yq -N '{"version": .version, "appVersion": .appVersion}' "$CHART/Chart.yaml"

      # Re-run the gates on the *stamped* chart rather than trusting the PR run on the unstamped one.
      # `helm lint --strict` is what rejects a version string that is not SemVer, which is the failure
      # mode a computed version introduces and a hand-written one never had.
      #
      # The plugin is installed here as well as in validate-chart.yml, and pinned to the same
      # version, because this job runs on a fresh runner and `azure/setup-helm` brings no plugins
      # with it. Both pins move together (#430).
      - name: Lint and assert on the stamped chart
        env:
          HELM_UNITTEST_VERSION: v1.1.2
        run: |
          helm lint --strict "$CHART" \
            --set database.host=10.0.1.2 --set database.existingSecret=events-db
          helm plugin install https://github.com/helm-unittest/helm-unittest \
            --version "$HELM_UNITTEST_VERSION"
          helm unittest --strict "$CHART"
          scripts/cluster-assertions.sh "$CHART"

      - name: Package the chart
        run: helm package "$CHART" --destination build/chart

      # `helm registry login` rather than relying on the docker login above: Helm keeps its own
      # registry credential store, and inheriting the docker one is not something to depend on.
      - name: Publish the chart
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
          # Through the environment rather than interpolated into the script. A username cannot
          # contain shell metacharacters today, so this is not exploitable — but `${{ }}` expanding
          # directly into a `run:` block is the shape of a template injection, and the whole point of
          # a lint is that it does not have to reason about which instances are currently harmless.
          ACTOR: ${{ github.actor }}
        run: |
          helm registry login ghcr.io \
            --username "$ACTOR" \
            --password "${{ secrets.GITHUB_TOKEN }}"
          helm push "build/chart/event-junkie-${VERSION}.tgz" "$CHART_REPO"

      - name: Summarise
        if: success() || failure()
        run: |
          version="${{ steps.version.outputs.value }}"
          {
            echo "## 📦 Release ${version}"
            echo
            if [[ "${{ steps.version.outputs.publish }}" == "true" ]]; then
              echo "| Artifact | Reference |"
              echo "|---|---|"
              for component in bff importer frontend; do
                echo "| \`${component}\` | \`${IMAGE_PREFIX}/${component}:${version}\` |"
              done
              echo "| chart | \`${CHART_REPO#oci://}/event-junkie:${version}\` |"
              echo
              if [[ "${{ steps.version.outputs.release }}" == "true" ]]; then
                echo "Also tagged \`latest\` — a human pointer only; nothing in the deploy path may consume it."
              fi
              echo
              echo "Published, **not deployed**. Flux reconciles on its own schedule."
            else
              echo "Dry run — built, scanned, linted and packaged. Nothing was pushed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Last in the job, and after the publish steps rather than before them (#507). One upload per
      # image with its own category, as with the three detekt reports — Code Scanning keys on the
      # category, so a single category would have each upload overwrite the last.
      #
      # `success() || failure()` on each, so the findings are filed whether the scan passed, the scan
      # failed, or a publish failed — and so that one upload failing cannot take the other two with
      # it. The `hashFiles` guard skips an upload whose report was never produced, which is what
      # happens when the scan itself died rather than found something.
      - name: Upload Trivy SARIF (bff)
        if: (success() || failure()) && github.event.pull_request.head.repo.fork != true && hashFiles('trivy-bff.sarif') != ''
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: trivy-bff.sarif
          category: trivy-bff
      - name: Upload Trivy SARIF (importer)
        if: (success() || failure()) && github.event.pull_request.head.repo.fork != true && hashFiles('trivy-importer.sarif') != ''
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: trivy-importer.sarif
          category: trivy-importer
      - name: Upload Trivy SARIF (frontend)
        if: (success() || failure()) && github.event.pull_request.head.repo.fork != true && hashFiles('trivy-frontend.sarif') != ''
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend
