# Claude driven by this repository's own /plausibility-check prompt. It reads the public site's
# API for the next days, checks each row for what cannot be right, compares a sample against the
# venues' own pages, and writes a report. It opens nothing, files nothing and edits nothing —
# which is the whole safety argument, and the reason there is no `dry_run` input: every run is one.
# The shared shape is documented once in ci-cd.instructions.md; three lines below are the traps.
#
# **It scrapes venue websites from a GitHub runner.** The prompt carries ADR-007's politeness
# rules — the importer's identifying User-Agent, one request per event, a second between requests
# to a host — and `sample` is the ceiling on the venues' side, which is the only cost this can incur.
#
# **`SITE_URL` is the variable `site-probe.yml` reads, with the same fallback.** Before go-live it
# names the rehearsal host. Deleting it on launch day (GO_LIVE_CHECKLIST.md § 0, change 3) points
# this workflow at the apex without an edit here.
#
# **There is no `github_token:` input**, and no `issues: write` — see agent-security.yml for the
# first, and the prompt's unattended section for why the second is deliberate. `display_report:
# true` and the empty `inputs` context on a schedule are the same traps as the rest of the family.
name: Agent — Plausibility Check

on:
  # Nightly, off-the-hour for the reason every other schedule here gives, and in the gap between
  # the refactor and comment workloads so a night stays a queue rather than five runners at once.
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      model:
        description: Model to run the check with
        type: choice
        default: claude-opus-5
        options:
          - claude-opus-5
          - claude-opus-4-8
          - claude-sonnet-5
      days:
        description: How many days to check, counted from today in Europe/Berlin
        type: string
        default: '2'
      sample:
        description: How many venue pages the source comparison may fetch
        type: string
        default: '20'
      site:
        description: Origin to check; empty means the SITE_URL variable, then the apex
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

concurrency:
  group: agent-plausibility
  cancel-in-progress: false

jobs:
  check:
    name: Plausibility check (agent)
    runs-on: ubuntu-latest
    # The fetches are rationed by `sample` and throttled by the prompt, so the wall clock is the
    # comparison rather than the network. `--max-turns` below is the cost ceiling.
    timeout-minutes: 45
    env:
      SITE_URL: ${{ inputs.site || vars.SITE_URL || 'https://event-junkie.de' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The prompt is `.claude/skills/plausibility-check.md`, a one-line `@` pointer into
      # `.github/prompts/`, so checkout above is what makes it resolvable at all. No JDK and no
      # Node: the run needs curl, jq and python3, all of which the runner image carries.
      - name: Run /plausibility-check
        id: claude
        uses: anthropics/claude-code-action@8251c103ac8c1d761882c86aba1412c7f583c844 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          display_report: true
          prompt: /plausibility-check --days ${{ inputs.days || '2' }} --sample ${{ inputs.sample || '20' }} --unattended
          claude_args: |
            --model ${{ inputs.model || 'claude-opus-5' }}
            --max-turns 100
            --allowedTools "Bash,Read,Glob,Grep,Write,TodoWrite"

      # Reporting steps, last and guarded, per the rule in ci-cd.instructions.md. The step summary
      # `display_report` writes has no REST API, so a scheduled report would exist only as a browser
      # page. This extracts the same final report and nothing else — the execution file also holds
      # every tool result, which is what must never be uploaded from a public repository.
      - name: Extract the report
        if: success() || failure()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          : > agent-report.md
          if [ -n "${EXECUTION_FILE:-}" ] && [ -s "$EXECUTION_FILE" ]; then
            jq -s -r '[.. | objects | select(.type == "result") | .result // empty] | last // ""' \
              "$EXECUTION_FILE" > agent-report.md || true
          fi
          if [ ! -s agent-report.md ]; then
            echo 'No report extracted. The execution file was empty or its shape changed.' > agent-report.md
          fi

      - name: Upload the report
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-report
          path: agent-report.md

      # **A run that produced no report is a failed run, whatever its exit code.** The agent's turn
      # ends when it stops calling tools, so a closing line like "I'll write the report once the
      # last page arrives" reports success and delivers a sentence. This runs after the upload on
      # purpose: the stub is preserved for diagnosis, then the job goes red. Guarded on the agent
      # step succeeding, because a failure above is already red for a better reason.
      - name: Fail if the report is a stub
        if: steps.claude.outcome == 'success'
        run: |
          set -euo pipefail
          bytes=$(wc -c < agent-report.md)
          lines=$(wc -l < agent-report.md)
          if [ "$bytes" -lt 400 ] || [ "$lines" -lt 5 ]; then
            echo "::error::The agent reported success but wrote no report ($bytes bytes, $lines lines). See the agent-report artifact."
            cat agent-report.md
            exit 1
          fi
