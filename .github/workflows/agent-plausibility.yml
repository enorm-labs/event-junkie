# Claude driven by /plausibility-check: reads the public site's API for the next days, checks each
# row, compares a sample against the venues' pages, writes a report. Opens, files and edits nothing,
# which is the safety argument and why there is no `dry_run` — every run is one. A second job comments
# the report on a monthly issue so it is read (#1499). ci-cd.instructions.md has the shared shape.
#
# **It scrapes venue websites from a runner**: the prompt carries ADR-007's politeness rules, and
# `sample` is the ceiling on the venues' side. **`SITE_URL` is site-probe.yml's variable with the
# same fallback**, so deleting it at go-live retargets this without an edit. **No `github_token:`,
# no `issues: write`** (agent-security.yml and the prompt say why). **`Bash` stays in
# `--allowedTools`, and the pages it fetches are attacker-controlled text**: the shell holds the
# Claude App's `contents: write`, which is why merge-gate.yml exists (#1424) — a smuggled instruction
# can open a pull request and cannot land one.
name: Agent — Plausibility Check

on:
  # Nightly, off-the-hour, in the gap between the refactor and comment workloads.
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      model:
        description: Model to run the check with
        type: choice
        default: claude-opus-5
        options:
          - claude-opus-5
          - claude-opus-4-8
          - claude-sonnet-5
      days:
        description: How many days to check, counted from today in Europe/Berlin
        type: string
        default: '2'
      sample:
        description: How many venue pages the source comparison may fetch
        type: string
        default: '20'
      site:
        description: Origin to check; empty means the SITE_URL variable, then the apex
        type: string
        default: ''

permissions: {}

concurrency:
  group: agent-plausibility
  cancel-in-progress: false

jobs:
  check:
    name: Plausibility check (agent)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC exchange for the Claude App's token.
      id-token: write
    # The fetches are rationed and throttled, so the wall clock is the comparison. `--max-turns` is the
    # cost ceiling.
    timeout-minutes: 45
    env:
      SITE_URL: ${{ inputs.site || vars.SITE_URL || 'https://event-junkie.de' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The prompt is a one-line `@` pointer into `.github/prompts/`, so the checkout is what resolves it.
      # No JDK, no Node: curl, jq and python3 are on the runner.
      - name: Run /plausibility-check
        id: claude
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          display_report: true
          prompt: /plausibility-check --days ${{ inputs.days || '2' }} --sample ${{ inputs.sample || '20' }} --unattended
          claude_args: |
            --model ${{ inputs.model || 'claude-opus-5' }}
            --max-turns 100
            --allowedTools "Bash,Read,Glob,Grep,Write,TodoWrite"

      # Reporting steps last and guarded. The step summary has no REST API, so the final report is
      # extracted to an artifact — the report alone, never the execution file with every tool result.
      - name: Extract the report
        if: success() || failure()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          : > agent-report.md
          if [ -n "${EXECUTION_FILE:-}" ] && [ -s "$EXECUTION_FILE" ]; then
            jq -s -r '[.. | objects | select(.type == "result") | .result // empty] | last // ""' \
              "$EXECUTION_FILE" > agent-report.md || true
          fi
          if [ ! -s agent-report.md ]; then
            echo 'No report extracted. The execution file was empty or its shape changed.' > agent-report.md
          fi

      - name: Upload the report
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-report
          path: agent-report.md

      # **A run that produced no report is a failed run, whatever its exit code.** A closing line like "I'll
      # write the report once the last page arrives" reports success and delivers a sentence. After the
      # upload, so the stub is preserved; guarded on the agent step succeeding.
      - name: Fail if the report is a stub
        if: steps.claude.outcome == 'success'
        run: |
          set -euo pipefail
          bytes=$(wc -c < agent-report.md)
          lines=$(wc -l < agent-report.md)
          if [ "$bytes" -lt 400 ] || [ "$lines" -lt 5 ]; then
            echo "::error::The agent reported success but wrote no report ($bytes bytes, $lines lines). See the agent-report artifact."
            cat agent-report.md
            exit 1
          fi

  # The report reaches a person by email, which a summary and an artifact never do (#1499). Its own job,
  # so `issues: write` never exists where the agent runs — its shell holds text from venue pages.
  notify:
    name: Post the report on the rolling issue
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write

    steps:
      # A local action needs the tree; `$/` would not, and actionlint 1.7.12 rejects it.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/report-to-issue

      - name: Download the report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent-report

      - name: Comment it on this month's issue
        uses: ./.github/actions/report-to-issue
        with:
          title: Plausibility check — nightly reports
          report: agent-report.md
          assignee: enorm
          labels: area:agents, area:data-quality, size:S
          about: >-
            Nightly `/plausibility-check` reports against the public site: rows that cannot be right,
            and a sample compared with the venues' own pages.
