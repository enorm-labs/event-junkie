# ==============================================================================================
#  NEVER ADD `actions/checkout` — OR ANY STEP THAT RUNS PULL-REQUEST CODE — TO THIS FILE.
#
#  This workflow runs on `pull_request_target`, which executes with the BASE repository's token
#  and full write permissions, against a pull request that may come from anyone. That is safe
#  here for exactly one reason: nothing in this file ever fetches or runs the contributor's code.
#  It reads the title from `context.payload` inside `actions/github-script` and calls the REST API.
#
#  Adding a checkout would turn this into an arbitrary-code-execution path holding
#  `pull-requests: write` and `issues: write` — the single worst supply-chain shape a repository
#  can have, and it would look like a one-line convenience in review. If a future step genuinely
#  needs the PR's contents, it belongs in a `pull_request` workflow with a read-only token, not
#  here (#479, #443).
# ==============================================================================================
#
# Labels each pull request from its Conventional Commits title, so the automatically
# generated release notes can group it (see .github/release.yml).
#
#   feat(scraper): import Astra   -> feat, importer
#   fix(api)!: drop the v1 route  -> fix, breaking-change
#   chore(deps): bump hono        -> chore   (+ `dependencies`, added by the bot itself)
#
# Conventional Commits Spec: https://www.conventionalcommits.org/en/v1.0.0/
#
# Runs on pull_request_target because a `pull_request` run from a fork gets a read-only
# token and could not apply labels. That trigger is only safe because this workflow never
# checks out or executes PR code — it reads the title/body from the event payload and
# calls the REST API, nothing else.
name: Label Pull Requests

on:
  # comment-lint: allow a dated suppression, per the reason in zizmor.yml
# zizmor: ignore[dangerous-triggers]
  # 2026-08-12 — `pull_request_target` is insecure when it checks out or executes pull-request code.
  # This workflow does neither: it reads the title from `context.payload` inside `actions/github-script`
  # and calls the REST API. There is no `actions/checkout` step in this file at all, which is the
  # property that makes the trigger safe and the one to re-check before adding any step here.
  pull_request_target:
    types: [ opened, edited, reopened ]

permissions:
  contents: read
  # `pull-requests` to set the labels, `issues` to create a managed label that does not exist yet
  pull-requests: write
  issues: write

# A quick succession of title edits should converge on the final title, not race.
concurrency:
  group: label-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Apply Conventional Commits labels
    runs-on: ubuntu-latest

    steps:
      - name: Label from the PR title
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // The labels this workflow owns. Anything not listed here (`dependencies`,
            // `java`, `javascript` from Dependabot, or hand-applied labels) is left alone.
            const MANAGED = {
              'breaking-change': { color: 'b60205', description: 'Contains a breaking change' },
              importer:          { color: '5319e7', description: 'Adds or reworks a venue event importer' },
              feat:              { color: '0e8a16', description: 'New feature' },
              fix:               { color: 'd73a4a', description: 'Bug fix' },
              perf:              { color: 'fbca04', description: 'Performance improvement' },
              refactor:          { color: 'c2e0c6', description: 'Code change that neither fixes a bug nor adds a feature' },
              docs:              { color: '0075ca', description: 'Documentation only' },
              test:              { color: 'bfd4f2', description: 'Tests only' },
              build:             { color: 'c5def5', description: 'Build system or dependency change' },
              ci:                { color: '1d76db', description: 'CI configuration change' },
              style:             { color: 'f9d0c4', description: 'Formatting only, no behaviour change' },
              chore:             { color: 'ededed', description: 'Maintenance work' },
              revert:            { color: 'e99695', description: 'Reverts a previous change' },
            };

            // The Conventional Commits types that map 1:1 onto a label of the same name.
            // `breaking-change` and `importer` are derived below instead.
            const TYPES = new Set(['feat', 'fix', 'perf', 'refactor', 'docs', 'test', 'build', 'ci', 'style', 'chore', 'revert']);

            // `feat` in one of these scopes means a new/reworked event source, which gets its
            // own section in the release notes. `fix(scraper)` stays an ordinary bug fix.
            const IMPORTER_SCOPES = new Set(['scraper', 'importer']);

            const pr = context.payload.pull_request;
            const match = /^\s*([a-zA-Z]+)\s*(?:\(([^)]*)\))?\s*(!)?:/.exec(pr.title);

            if (!match) {
              core.notice(`PR title "${pr.title}" is not a Conventional Commits subject — no labels applied. ` +
                          'It will appear under "Other Changes" in the release notes.');
              return;
            }

            const [, rawType, rawScope, bang] = match;
            const type = rawType.toLowerCase();
            const scope = (rawScope ?? '').toLowerCase();
            // Either the `!` marker or a BREAKING CHANGE footer marks a breaking change.
            const breaking = Boolean(bang) || /^BREAKING[ -]CHANGE:/m.test(pr.body ?? '');

            const wanted = new Set();
            if (TYPES.has(type)) wanted.add(type);
            if (breaking) wanted.add('breaking-change');
            if (type === 'feat' && IMPORTER_SCOPES.has(scope)) wanted.add('importer');

            if (wanted.size === 0) {
              core.notice(`Unknown Conventional Commits type "${type}" — no labels applied.`);
              return;
            }

            const issue = { owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number };
            const current = new Set(pr.labels.map((label) => label.name));

            // Drop managed labels that no longer apply — the title may have been edited.
            for (const name of current) {
              if (name in MANAGED && !wanted.has(name)) {
                await github.rest.issues.removeLabel({ ...issue, name });
                core.info(`Removed label: ${name}`);
              }
            }

            const missing = [...wanted].filter((name) => !current.has(name));
            if (missing.length === 0) {
              core.info(`Labels already up to date: ${[...wanted].join(', ')}`);
              return;
            }

            // Create any managed label the repository does not have yet, so the workflow
            // works on a fresh clone without a separate label-seeding step.
            for (const name of missing) {
              try {
                await github.rest.issues.getLabel({ owner: issue.owner, repo: issue.repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner: issue.owner, repo: issue.repo, name, ...MANAGED[name] });
                core.info(`Created label: ${name}`);
              }
            }

            await github.rest.issues.addLabels({ ...issue, labels: missing });
            core.info(`Added labels: ${missing.join(', ')}`);
