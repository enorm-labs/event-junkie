name: Validate Infrastructure

# `tofu fmt` and `tofu validate` are the only checks that can run against `infra/` without
# credentials — `plan` needs a Hetzner token and CI does not have one, deliberately (see
# docs/PLATFORM_SETUP.md §4: nothing outside the cluster holds a credential for it).
#
# That makes this a syntax and type gate, not a correctness one. It catches the failure mode that
# actually happens to infrastructure code in a repository where nobody runs it daily: a config that
# stopped parsing months ago and nobody noticed until the afternoon it was needed.

on:
  push:
    branches: [ main ]
    paths:
      - 'infra/**'
      - '.github/workflows/validate-infra.yml'
  pull_request:
    branches: [ main ]
    # No `paths:` here, deliberately, since #443. These checks are **required** on the `main`
    # ruleset, and a required check that never runs stays Pending forever — GitHub's own words:
    # "A pull request that requires those checks to be successful will be blocked from merging."
    # So a filter here would deadlock every pull request that happens not to touch these paths.
    # Affordable because the whole workflow is seconds: `tofu fmt`/`validate` and the cloud-init ShellCheck.
    # The `push:` filter above keeps its paths — nothing requires those runs.
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned for the reason validate-scripts.yml sets out at length: `ubuntu-latest` preinstalls an
  # older ShellCheck than a current local install, old enough to disagree about SC2015. **This pin
  # appears in three workflows** — here, validate-chart.yml and validate-scripts.yml — and they must
  # move together, the same rule HELM_VERSION carries. Three pins that can drift are a weaker
  # version of the problem pinning was meant to remove.
  SHELLCHECK_VERSION: v0.11.0

jobs:
  validate:
    name: Format & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        stack:
          - infra/bootstrap
          - infra/environments/production
          - infra/environments/staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: '1.12.5'
          # The wrapper rewrites stdout and buys nothing here.
          tofu_wrapper: false

      - name: Check formatting
        run: tofu fmt -recursive -check -diff infra

      # -backend=false so no state bucket, no credentials, and no lock is touched.
      - name: Initialise ${{ matrix.stack }}
        run: tofu -chdir=${{ matrix.stack }} init -backend=false -input=false

      - name: Validate ${{ matrix.stack }}
        run: tofu -chdir=${{ matrix.stack }} validate

  shellcheck:
    # NAME IS LOAD-BEARING — "ShellCheck cloud-init" is a required status check on the `main`
    # ruleset (#443). Renaming this job retires that context and creates a new one, and the required
    # check then sits Pending forever on every pull request. So the name stays even though the job
    # now covers more than cloud-init; the scope is described here instead.
    name: ShellCheck cloud-init
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The cloud-init scripts run once, unattended, on a node nobody can log into until they
      # succeed. A typo there is not a failed build, it is a server that boots into an unreachable
      # state.
      #
      # `infra/*.sh` was added in #424: the top-level scripts sit directly in `infra/` and so matched
      # neither this glob nor the pre-commit hook's pattern, which both wanted a directory prefix.
      # `check-capacity.sh` had been linted by nothing since it was written.
      #
      # Runs from the pinned image rather than the runner's preinstalled binary. It matters more here
      # than anywhere else: these scripts run once, unattended, on a host nobody can log into, so the
      # analyser that clears them should be the one the author ran, not whatever the runner image
      # happened to ship that month.
      - name: Run ShellCheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            "koalaman/shellcheck:${SHELLCHECK_VERSION}" \
            -x infra/*.sh infra/modules/environment/cloud-init/*.sh
