name: Validate Infrastructure

# `tofu fmt` and `tofu validate` are the only checks that run against `infra/` without credentials —
# `plan` needs a Hetzner token and CI holds none, deliberately. A syntax and type gate, not a
# correctness one: it catches a config that stopped parsing months ago.

on:
  push:
    branches: [ main ]
    paths:
      - 'infra/**'
      - '.github/workflows/validate-infra.yml'
  pull_request:
    branches: [ main ]
    # No `paths:` here (#443): these checks are **required**, and a required check that never runs stays
    # Pending forever. Affordable because the whole workflow is seconds. The `push:` filter keeps its paths.
  workflow_dispatch:

permissions:
  contents: read

env:
  # `ubuntu-latest` preinstalls a ShellCheck old enough to disagree about SC2015 (validate-scripts.yml).
  # **This pin appears in three workflows** and they move together.
  SHELLCHECK_VERSION: v0.11.0

jobs:
  validate:
    name: Format & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        stack:
          - infra/bootstrap
          - infra/environments/production
          - infra/environments/staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: '1.12.5'
          # The wrapper rewrites stdout and buys nothing here.
          tofu_wrapper: false

      - name: Check formatting
        run: tofu fmt -recursive -check -diff infra

      # `-backend=false`: no state bucket, no credentials, no lock.
      - name: Initialise ${{ matrix.stack }}
        run: tofu -chdir=${{ matrix.stack }} init -backend=false -input=false

      - name: Validate ${{ matrix.stack }}
        run: tofu -chdir=${{ matrix.stack }} validate

  shellcheck:
    # NAME IS LOAD-BEARING — "ShellCheck cloud-init" is a required status check on the `main` ruleset
    # (#443). Renaming it retires the context and the check sits Pending forever; the job covers more
    # than cloud-init now, and the name stays.
    name: ShellCheck cloud-init
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The cloud-init scripts run once, unattended, on a node nobody can log into until they succeed: a
      # typo is a server that boots unreachable. `infra/*.sh` because the top-level scripts matched neither
      # this glob nor the hook's (#424). From the pinned image: the analyser that clears these should be the
      # one the author ran.
      - name: Run ShellCheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            "koalaman/shellcheck:${SHELLCHECK_VERSION}" \
            -x infra/*.sh infra/modules/environment/cloud-init/*.sh

      # `tofu validate` never renders `templatefile`, so nobody saw the size of what `cloudinit.tf`
      # assembles until it passed Hetzner's 32 KiB `user_data` cap (#1482). The script renders with sample
      # values, parses each document, proves every gzipped script round-trips, and fails 2 KiB under the cap.
      - name: Measure the rendered cloud-init against the user_data cap
        run: python3 infra/check_user_data.py
