# Opens an issue when a node pin falls behind upstream, and never opens a pull request. `k3s_version`
# and `walg_version` are `default =` strings in `infra/modules/environment/variables.tf`: no manifest
# declares them, Renovate's allow-list excludes them (ADR-024), and k3s is not apt-managed, so a k3s
# security release went unnoticed by every mechanism (#1068).
#
# **A reminder rather than a bot** because both values feed `user_data`, which is force-new: a
# routine-looking patch pull request that means "rebuild production" is worse than the drift. For
# wal-g, `walg_checksums` must move with the version or `backups.sh` aborts the boot, and no updater
# can compute it — such a pull request would be green and break the next rebuild.
#
# **The comparison is `scripts/upstream-node-pins.sh`**, which a person can run during a rebuild.
# **Idempotent**: one issue per pin, keyed on the exact title.
name: Node Pin Reminder

on:
  schedule:
    # Weekly, Mondays, off-the-hour; the k3s stable channel moves about monthly.
    - cron: '52 6 * * 1'
  # The only way to see it work without waiting for a Monday, and to produce the first issue.
  workflow_dispatch:

permissions:
  contents: read
  # Creating the issue, and listing to find one that already exists.
  issues: write

# A dispatch racing the schedule must not produce two issues; the second still checks.
concurrency:
  group: node-pin-reminder
  cancel-in-progress: false

jobs:
  check:
    name: Check the node pins
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Exit 1 is "something is behind" and expected. Anything above it is "the check could not be made",
      # which fails the job — a run that cannot reach `update.k3s.io` and stays green is the failure this
      # exists about.
      - name: Compare the pins with upstream
        id: check
        env:
          # Lifts api.github.com's 60-per-hour anonymous limit, which a shared runner address reaches alone.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rc=0
          pins="$(scripts/upstream-node-pins.sh --json)" || rc=$?
          if [ "$rc" -ge 2 ]; then
            echo "::error::The pin check could not be made — see the message above." >&2
            exit "$rc"
          fi
          echo "pins=$(printf '%s' "$pins" | jq -c .)" >> "$GITHUB_OUTPUT"

      - name: Open an issue for anything behind
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PINS: ${{ steps.check.outputs.pins }}
          # An assignee rather than a mention: an unassigned issue on a board is nobody's.
          PIN_OWNER: enorm
        with:
          script: |
            const pins = JSON.parse(process.env.PINS);

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const blob = `https://github.com/${owner}/${repo}/blob/main`;
            const variables = 'infra/modules/environment/variables.tf';

            // WHAT MERGING MEANS, in every body this opens: `user_data` is force-new, so either edit destroys and
            // recreates the server.
            const rebuild = [
              '## Not a routine version bump',
              '',
              '`user_data` is a force-new attribute in the Hetzner provider, and both pins feed cloud-init, ' +
                'so the OpenTofu plan says **destroy and recreate the server**. A rebuild loses the k3s cluster, ' +
                'Flux, the six hand-made Secrets, `/etc/wal-g/credentials.env` and OpenObserve\'s dashboards.',
              '',
              `**Take it in place instead.** [\`K3S_UPGRADE.md\`](${blob}/docs/ops/K3S_UPGRADE.md) ` +
                `and [\`BACKUPS.md\` §8](${blob}/docs/ops/BACKUPS.md) are the two procedures. Bump the pin in the same change, ` +
                'or the next rebuild silently downgrades the node. A rebuild that is happening anyway is the free moment for both.',
            ];

            // The title carries the *pinned* version, never the target, so upstream moving cannot pile up issues;
            // crossing a minor gets its own title, so the escalation is visible on the board.
            const candidates = [];

            if (pins.k3s.status === 'behind') {
              const minor = pins.k3s.gap === 'minor';
              candidates.push({
                title: minor
                  ? `k3s is a minor behind — the pinned ${pins.k3s.pinned} is on ${pins.k3s.pinnedMinor}, stable is ${pins.k3s.latestMinor}`
                  : `Bump k3s — the pinned ${pins.k3s.pinned} is behind stable`,
                size: minor ? 'size:M' : 'size:S',
                body: [
                  `**The pinned \`k3s_version\` is \`${pins.k3s.pinned}\`. The \`stable\` channel is \`${pins.k3s.latest}\`.**`,
                  '',
                  minor
                    ? `That is a **minor** gap. The \`${pins.k3s.pinnedMinor}\` line itself offers \`${pins.k3s.lineLatest}\`, which is the ` +
                      'conservative move and a different piece of work from crossing a minor — a new minor carries its own upstream ' +
                      'upgrade notes, and the Kubernetes API server is what is being changed.'
                    : 'That is a patch inside the pinned minor line.',
                  '',
                  ...rebuild,
                  '',
                  '## The edit',
                  '',
                  '```hcl',
                  `# ${variables}`,
                  'variable "k3s_version" {',
                  `  default = "${minor ? pins.k3s.lineLatest : pins.k3s.latest}"`,
                  '}',
                  '```',
                  '',
                  '## Done when',
                  '',
                  '- [ ] `k3s_version` names a version that is current, or this issue says why it deliberately does not',
                  '- [ ] Both environments are on the new version, staging first',
                  '- [ ] `kubectl get nodes -o wide` reports it on each cluster',
                  '- [ ] The Traefik checks pass on each: `svc/traefik` is still `ClusterIP`, no svclb pods, the site answers',
                  '- [ ] Only if this was taken as a rebuild: `CLUSTER_BOOTSTRAP.md` §8b redone, because a rebuild destroys `/etc/wal-g/credentials.env`',
                ].join('\n'),
              });
            }

            if (pins.walg.status === 'behind') {
              candidates.push({
                title: `Bump wal-g — the pinned ${pins.walg.pinned} is behind`,
                size: 'size:S',
                body: [
                  `**The pinned \`walg_version\` is \`${pins.walg.pinned}\`. The newest release is \`${pins.walg.latest}\`.**`,
                  '',
                  'wal-g is a binary on the node with no cluster blast radius, so this is a smaller obligation than k3s. ' +
                    'What it puts at risk is the backups, and a backup that stops working is invisible until a restore.',
                  '',
                  ...rebuild,
                  '',
                  '## The edit — both values, or the node does not boot',
                  '',
                  '`backups.sh` runs under `set -euo pipefail` and verifies the tarball against the pinned SHA-256. ' +
                    'A version moved without its checksums aborts cloud-init, and nothing in CI boots a node, so no check would say so.',
                  '',
                  '```hcl',
                  `# ${variables}`,
                  'variable "walg_version" {',
                  `  default = "${pins.walg.latest}"`,
                  '}',
                  '',
                  'variable "walg_checksums" {',
                  '  default = {',
                  `    amd64 = "${pins.walg.checksums.amd64}"`,
                  `    arm64 = "${pins.walg.checksums.arm64}"`,
                  '  }',
                  '}',
                  '```',
                  '',
                  'Those two are the SHA-256 of `wal-g-pg-24.04-amd64.tar.gz` and `wal-g-pg-24.04-aarch64.tar.gz`, computed from the ' +
                    'tarballs and cross-checked against the `.sha256` published beside them. Both come from the same release, so this is ' +
                    'not independent verification — what the pin buys is a value a person reviewed once, which is why this issue proposes ' +
                    'them rather than committing them.',
                  '',
                  '## Done when',
                  '',
                  '- [ ] `walg_version` and both `walg_checksums` entries move in the same commit',
                  '- [ ] Both environments are on the new version, staging first',
                  '- [ ] Only if this was taken as a rebuild: `/etc/wal-g/credentials.env` rewritten on each node — it is deliberately not in `user_data`',
                  '- [ ] `sudo -u postgres walg check` passes on each node, which is the assertion that matters rather than the unit state',
                ].join('\n'),
              });
            }

            // Listing, not search: the search index is eventually consistent. `listForRepo` returns pull requests
            // too, and a same-titled one would suppress the reminder.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const openIssues = open.filter((issue) => !issue.pull_request);

            const opened = [];
            const skipped = [];

            for (const candidate of candidates) {
              const existing = openIssues.find((issue) => issue.title === candidate.title);
              if (existing) {
                skipped.push(`${candidate.title} — already open as #${existing.number}`);
                continue;
              }

              const body = [
                `> Opened automatically by [\`node-pin-reminder.yml\`](${blob}/.github/workflows/node-pin-reminder.yml) ` +
                  '([#1068](https://github.com/enorm-labs/event-junkie/issues/1068)). The versions below were true when this ' +
                  `issue opened; [\`scripts/upstream-node-pins.sh\`](${blob}/scripts/upstream-node-pins.sh) answers for today.`,
                '',
                candidate.body,
              ].join('\n');

              const { data: issue } = await github.rest.issues.create({
                owner,
                repo,
                title: candidate.title,
                body,
                // Intrinsic properties of the work; Status and Priority are board fields.
                labels: ['area:infra', 'area:security', candidate.size],
                assignees: [process.env.PIN_OWNER],
                // No milestone: a recurring operational obligation outlives every release gate.
                type: 'Task',
              });

              // The board cannot be written from here (`GITHUB_TOKEN` cannot write to an organisation project), and
              // "Auto-add to project" misses items at roughly 4% (#1092) — this workflow's first two issues were
              // both missed. Check the card after a run.
              core.notice(`Opened #${issue.number} — ${candidate.title}`);
              opened.push(`[#${issue.number}](${issue.html_url}) — ${candidate.title}`);
            }

            const summary = core.summary.addHeading('📌 Node pins', 2);
            summary.addTable([
              [{ data: 'Pin', header: true }, { data: 'Pinned', header: true },
               { data: 'Upstream', header: true }, { data: 'Status', header: true }],
              ['k3s', pins.k3s.pinned, pins.k3s.latest, pins.k3s.status === 'behind' ? `behind (${pins.k3s.gap})` : 'current'],
              ['wal-g', pins.walg.pinned, pins.walg.latest, pins.walg.status],
            ]);
            if (opened.length > 0) {
              summary.addRaw('Opened:').addList(opened);
            }
            if (skipped.length > 0) {
              summary.addRaw('Already open:').addList(skipped);
            }
            if (candidates.length === 0) {
              summary.addRaw('Both pins are current.');
            }
            await summary.write();
