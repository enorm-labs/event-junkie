# Claude driven by this repository's own /update-dependencies prompt, opening a pull request and
# never pushing to main. Second of #387's four workloads. The shared shape is documented once in
# ci-cd.instructions.md; the two lines below are what fails silently if edited here.
#
# **`--unattended` narrows this to Step 12, and that is the entire point.** Dependabot already owns
# gradle, npm, docker, actions and opentofu, with grouping and a reasoned suppression. An agent
# re-deriving those bumps produces a worse second pull request against the same files. Step 12 is
# the blind spot: a tool version pinned as a plain string belongs to no ecosystem, so it rots while
# the check using it keeps reporting success.
#
# **There is no `github_token:` input.** See agent-security.yml — passing one makes the pull request
# unmergeable in a way that reads as a hung check.
#
# **This is the one workload that edits `.github/workflows/`, and it could not until #996.** Nine of
# Step 12's eleven pins live there, so every run that found something failed at the push with
# `refusing to allow a GitHub App to create or update workflow ... without `workflows` permission`.
# The Claude App now carries `workflows: write`, which is a **repository-wide grant**: every agent
# workload here gained it, not only this one. Weighed and accepted in #996 — a workflow file is the
# one file where a bad edit changes what CI itself is allowed to do, so the review of a pull request
# touching this directory is the control, not the credential.
#
# **`display_report: true` is what makes the run readable**, and is not interchangeable with
# `show_full_output`. ci-cd.instructions.md has the difference and why it matters here.
#
# **The `inputs` context is empty on a `schedule` trigger**, so every input below carries an explicit
# fallback. Without them a scheduled run passes `--model` with no value, and goes live by accident
# rather than by decision. ci-cd.instructions.md has the rest.
name: Agent — Dependency Pins

on:
  # Nightly, off-the-hour for the reason every other schedule here gives: the top of the hour is
  # a stampede on shared runners. The five agent workloads keep the staggered start times they
  # had as one-per-weekday, so a night is a queue rather than five runners at once.
  schedule:
    - cron: '52 5 * * *'
  workflow_dispatch:
    inputs:
      model:
        description: Model to run the sweep with
        type: choice
        default: claude-opus-5
        options:
          - claude-opus-5
          - claude-opus-4-8
          - claude-sonnet-5
      dry_run:
        description: Report only — read, reason, and open no pull request
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: agent-dependencies
  cancel-in-progress: false

jobs:
  sweep:
    name: Dependency pins (agent)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run /update-dependencies
        id: claude
        uses: anthropics/claude-code-action@1f291e1cfe0f5fc21db2aef19af844591600ade7 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          display_report: true
          prompt: /update-dependencies --unattended${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && ' --dry-run' || '' }}
          claude_args: |
            --model ${{ inputs.model || 'claude-opus-5' }}
            --max-turns 60
            --allowedTools "Bash,Read,Glob,Grep,Edit,Write,WebFetch,TodoWrite"

      # Reporting steps, last and guarded, per the rule in ci-cd.instructions.md. The step summary
      # `display_report` writes has no REST API, so a scheduled report would exist only as a browser
      # page. This extracts the same final report and nothing else — the execution file also holds
      # every tool result, which is what must never be uploaded from a public repository.
      - name: Extract the report
        if: success() || failure()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          : > agent-report.md
          if [ -n "${EXECUTION_FILE:-}" ] && [ -s "$EXECUTION_FILE" ]; then
            jq -s -r '[.. | objects | select(.type == "result") | .result // empty] | last // ""' \
              "$EXECUTION_FILE" > agent-report.md || true
          fi
          if [ ! -s agent-report.md ]; then
            echo 'No report extracted. The execution file was empty or its shape changed.' > agent-report.md
          fi

      - name: Upload the report
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-report
          path: agent-report.md

      # **A run that produced no report is a failed run, whatever its exit code.** The agent's turn
      # ends when it stops calling tools, so a closing line like "I'll compile the report once the
      # checks finish" reports success and delivers a sentence. That has happened once already.
      # This runs after the upload on purpose: the stub is preserved for diagnosis, then the job goes
      # red. Guarded on the agent step succeeding, because a failure above is already red for a
      # better reason.
      - name: Fail if the report is a stub
        if: steps.claude.outcome == 'success'
        run: |
          set -euo pipefail
          bytes=$(wc -c < agent-report.md)
          lines=$(wc -l < agent-report.md)
          if [ "$bytes" -lt 400 ] || [ "$lines" -lt 5 ]; then
            echo "::error::The agent reported success but wrote no report ($bytes bytes, $lines lines). See the agent-report artifact."
            cat agent-report.md
            exit 1
          fi
