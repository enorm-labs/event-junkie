name: Scheduled Image Scan

# Scans the images that are **deployed**, on a schedule — the half of image scanning a publish-time
# gate structurally cannot do. `release.yml`'s Trivy gate runs only when something is published, so a
# vulnerability disclosed against a running image triggers no build and the gate is silent exactly
# when the risk is newest (#442). The same split `build-backend.yml` and
# `dependency-check-scheduled.yml` make for dependencies.
#
# **It scans a published tag, not a rebuild of `main`.** `scripts/deployed-versions.sh` makes the
# selection Flux makes — each cluster's `semver` range against what GHCR lists, through Helm's own
# solver — so the target cannot drift from what is deployed. That guarantee is only as good as the
# listing: the registry paginates at 100 tags, and a resolver that read one page scanned a
# fortnight-old snapshot and called production unscannable (#1027). When this job looks wrong,
# suspect the resolver's inputs before its logic.
#
# **Both architectures**, which the publish gate cannot do (a multi-platform image cannot be loaded
# before it is pushed). arm64 is what the Hetzner nodes run (#424).
#
# **No credential.** The packages are public, so listing and pulls are anonymous — the same path the
# clusters use, and nothing here worth stealing.

on:
  schedule:
    # 04:41 UTC daily: off-the-hour for the runner stampede, clear of dependency-check-scheduled.yml's 03:17.
    - cron: '41 4 * * *'
  # Also when the thing that decides *what* gets scanned changes, so a broken resolver is caught by the
  # change that caused it.
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/image-scan-scheduled.yml'
      - 'scripts/deployed-versions.sh'
      - 'deploy/clusters/**/oci-repository.yaml'
      - '.trivyignore'
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Scan this exact published version instead of resolving what each cluster would deploy.
          Leave empty for the normal behaviour.
        type: string
        default: ''

permissions:
  contents: read
  # Findings go to Code Scanning with detekt's, Dependency-Check's and release.yml's.
  security-events: write

env:
  IMAGE_PREFIX: ghcr.io/enorm-labs/event-junkie
  # Matched to the SDK helm-controller embeds: `deployed-versions.sh` borrows Helm's solver to reproduce
  # helm-controller's selection, and a Helm 3 client answers a slightly different question.
  HELM_VERSION: 4.3.0
  # **Must match release.yml's**, so a finding here the publish gate did not raise means the advisory is
  # new, not the scanner. Renovate groups both copies into one pull request (ADR-024).
  TRIVY_VERSION: 0.74.0

jobs:
  scan:
    name: Scan the deployed images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # For `.trivyignore`, which Trivy reads from the working directory, and the cluster sources the
      # resolver reads. **One waiver file** — no second ignore list here.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      # From the release archive, so the version is pinned in this file and visible.
      - name: Install Trivy
        run: |
          curl -fsSL \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C /usr/local/bin trivy
          trivy --version

      # The resolver prints `cluster<TAB>version`, and `(none)` for a range matching nothing published.
      # Distinct versions only: k3d copies staging's range, and scanning the same tag twice buys a
      # duplicate category.
      - name: Work out what is deployed
        id: deployed
        env:
          # Through the environment: this input is free text, and `${{ }}` in a `run:` block is the injection shape.
          REQUESTED: ${{ inputs.version }}
        run: |
          if [[ -n "$REQUESTED" ]]; then
            echo "::notice::Scanning the requested version $REQUESTED rather than resolving."
            versions="$REQUESTED"
            table="| _requested_ | \`$REQUESTED\` |"
          else
            resolved="$(scripts/deployed-versions.sh)"
            printf '%s\n' "$resolved"
            versions="$(printf '%s\n' "$resolved" | cut -f2 | grep -v '^(none)$' | sort -u || true)"
            table="$(printf '%s\n' "$resolved" | awk -F'\t' '{printf "| %s | `%s` |\n", $1, $2}')"
          fi

          # Nothing to scan means the resolver found no deployable version anywhere — a broken mechanism, not a
          # clean bill of health. Fail rather than go green having looked at nothing.
          if [[ -z "$versions" ]]; then
            echo "::error::No cluster resolves a published version — nothing to scan. This is a broken resolver, not a clean result."
            exit 1
          fi

          {
            echo "versions<<EOF"
            echo "$versions"
            echo "EOF"
            echo "table<<EOF"
            echo "$table"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Thresholds match release.yml's exactly, so a finding here the publish gate did not raise means the
      # advisory is new. `--ignore-unfixed` for the same reason: a base-image CVE with no upstream fix would
      # fail every night until somebody deleted the gate. **A red run here is a call to cut a release, not
      # to re-run the job** — these images are immutable and deployed. Every image on every platform is
      # scanned before the first failure is reported.
      - name: Scan every deployed image, on both architectures
        id: scan
        env:
          # Through the environment, never `${{ }}` inside the script; zizmor blocks the shape, and rightly.
          VERSIONS: ${{ steps.deployed.outputs.versions }}
        run: |
          status=0
          mkdir -p sarif
          for version in $VERSIONS; do
            for component in bff importer frontend injector; do
              ref="${IMAGE_PREFIX}/${component}:${version}"

              # **A component a deployed version never shipped is a warning, not a failure.** `injector` (#287) has
              # no image for a version cut before it, and Trivy reports that with the same words as a registry
              # outage; a manifest that is not there is skipped and said so, everything else still fails below.
              # Expected until the first release carrying the component reaches both clusters, wrong after.
              if ! docker manifest inspect "$ref" >/dev/null 2>&1; then
                echo "::warning::${ref} is not in the registry — ${component} was not part of ${version}, or the registry is unreachable. Skipped."
                continue
              fi

              for arch in amd64 arm64; do
                echo "::group::trivy ${ref} (linux/${arch})"
                trivy image "$ref" \
                  --platform "linux/${arch}" \
                  --severity CRITICAL,HIGH \
                  --ignore-unfixed \
                  --list-all-pkgs \
                  --format json \
                  --output "trivy-${component}-${arch}.json" \
                  --exit-code 1 || status=1

                # A missing report means the scan itself failed; the conversions below would hide that behind a
                # "no such file". Same guard as release.yml.
                if [[ ! -s "trivy-${component}-${arch}.json" ]]; then
                  echo "::error::Trivy produced no report for ${ref} (linux/${arch}) — the scan failed, rather than finding vulnerabilities."
                  exit 1
                fi

                # **Zero findings is only good news if something was examined** — a misconfigured OWASP scan once
                # reported `Dependencies Scanned: 0` and passed for months. `--list-all-pkgs` exists so this assertion
                # can. The realistic trigger is a base image Trivy cannot fingerprint: no OS family, no os-pkgs
                # result, reported as clean rather than unknown. A floor of zero cannot rot.
                packages="$(jq '[.Results[]?.Packages // [] | length] | add // 0' "trivy-${component}-${arch}.json")"
                if [[ "$packages" -eq 0 ]]; then
                  echo "::error::Trivy enumerated 0 packages in ${ref} (linux/${arch}) — it looked at nothing, which is not the same as finding nothing."
                  exit 1
                fi
                echo "${component}/${arch}: ${packages} packages examined"

                trivy convert --format table "trivy-${component}-${arch}.json"
                trivy convert --format sarif \
                  --output "sarif/trivy-${component}-${arch}.sarif" \
                  "trivy-${component}-${arch}.json"
                echo "::endgroup::"
              done
            done
          done
          exit $status

      # imgproxy is not ours and is digest-pinned, so it cannot join the loop above. Scanned because ADR-020
      # named this the strongest argument against adopting it: a third-party image we cannot rebuild when a
      # finding has no fix. `--ignore-unfixed` keeps that from being a nightly red for something nobody can
      # act on.
      - name: Scan the imgproxy sidecar
        id: scan-imgproxy
        if: success() || failure()
        run: |
          # **Render the chart rather than read the file.** A grep for the digest near the repository name broke
          # when a comment was added above it. Rendering asks the chart what it deploys. The `--set` values are
          # only what the chart `required`s; none reach the scan.
          ref="$(helm template scan deploy/charts/event-junkie \
            --set database.host=10.0.0.1 \
            --set database.existingSecret=scan \
            --set networkPolicy.databaseCidr=10.0.0.1/32 \
            --set images.enabled=true \
            --set images.storage.prefix=scan \
            --set images.imgproxy.enabled=true \
            | grep -oE 'ghcr\.io/imgproxy/imgproxy@sha256:[0-9a-f]{64}' | sort -u)"
          if [[ -z "$ref" ]]; then
            echo "::error::The chart rendered no imgproxy image — the scan would silently examine nothing."
            exit 1
          fi
          if [[ "$(wc -l <<<"$ref")" -ne 1 ]]; then
            echo "::error::The chart rendered more than one imgproxy image, so the scan cannot say which one runs:"
            echo "$ref"
            exit 1
          fi
          # Runs on `failure()` too, so it cannot assume the loop above created the directory.
          mkdir -p sarif
          echo "::group::trivy ${ref}"
          trivy image "$ref" \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --list-all-pkgs \
            --format json \
            --output trivy-imgproxy.json \
            --exit-code 1 || status=1
          if [[ ! -s trivy-imgproxy.json ]]; then
            echo "::error::Trivy produced no report for ${ref} — the scan failed, rather than finding vulnerabilities."
            exit 1
          fi
          trivy convert --format table trivy-imgproxy.json
          trivy convert --format sarif --output sarif/trivy-imgproxy.sarif trivy-imgproxy.json
          echo "::endgroup::"
          exit "${status:-0}"

      - name: Upload Trivy SARIF (imgproxy)
        if: (success() || failure()) && github.event.pull_request.head.repo.fork != true && hashFiles('sarif/trivy-imgproxy.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: sarif/trivy-imgproxy.sarif
          category: trivy-deployed-imgproxy

      - name: Summarise
        if: success() || failure()
        env:
          TABLE: ${{ steps.deployed.outputs.table }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          {
            echo "## 🔍 Scheduled image scan"
            echo
            echo "| Cluster | Version |"
            echo "|---|---|"
            echo "$TABLE"
            echo
            if [[ "$SCAN_OUTCOME" == "success" ]]; then
              echo "No fixable CRITICAL or HIGH in any of the three images, on \`linux/amd64\` or \`linux/arm64\`."
            else
              echo "**Fixable CRITICAL or HIGH findings above.** These images are already published and immutable, so"
              echo "the fix is: bump the base image digest, merge, publish, and let Flux reconcile — not a re-run."
              echo
              echo "Full findings are in the Security tab under the \`trivy-deployed-*\` categories."
            fi
            echo
            echo "_A cluster showing \`(none)\` resolves no published version. Production does that until its first release._"
          } >> "$GITHUB_STEP_SUMMARY"

      # Last in the job, after everything that scans (#507): `if:` carries an implicit `success()`, so a
      # report step above a verify step loses its annotations the moment anything below fails.
      #
      # **One upload per category, one SARIF run per upload.** Both architectures under one category was
      # the intent — one CVE, one alert — and the CodeQL Action rejects it: `does not support uploading
      # multiple SARIF runs with the same category`. So a CVE on both architectures is **two alerts**, closed
      # twice, each naming its architecture. `trivy-deployed-*`, not release.yml's `trivy-*`: the same
      # category would replace the publish-time findings with these. `success() || failure()` on each, and
      # the `hashFiles` guard skips a report the scan never produced.
      - name: Upload Trivy SARIF (bff, amd64)
        if: (success() || failure()) && github.event.pull_request.head.repo.fork != true && hashFiles('sarif/trivy-bff-amd64.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: sarif/trivy-bff-amd64.sarif
          category: trivy-deployed-bff-amd64
      - name: Upload Trivy SARIF (bff, arm64)
        if: (success() || failure()) && github.event.pull_request.head.repo.fork != true && hashFiles('sarif/trivy-bff-arm64.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: sarif/trivy-bff-arm64.sarif
          category: trivy-deployed-bff-arm64
      - name: Upload Trivy SARIF (importer, amd64)
        if: (success() || failure()) && github.event.pull_request.head.repo.fork != true && hashFiles('sarif/trivy-importer-amd64.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: sarif/trivy-importer-amd64.sarif
          category: trivy-deployed-importer-amd64
      - name: Upload Trivy SARIF (importer, arm64)
        if: (success() || failure()) && github.event.pull_request.head.repo.fork != true && hashFiles('sarif/trivy-importer-arm64.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: sarif/trivy-importer-arm64.sarif
          category: trivy-deployed-importer-arm64
      - name: Upload Trivy SARIF (frontend, amd64)
        if: (success() || failure()) && github.event.pull_request.head.repo.fork != true && hashFiles('sarif/trivy-frontend-amd64.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: sarif/trivy-frontend-amd64.sarif
          category: trivy-deployed-frontend-amd64
      - name: Upload Trivy SARIF (frontend, arm64)
        if: (success() || failure()) && github.event.pull_request.head.repo.fork != true && hashFiles('sarif/trivy-frontend-arm64.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: sarif/trivy-frontend-arm64.sarif
          category: trivy-deployed-frontend-arm64
      - name: Upload Trivy SARIF (injector, amd64)
        if: (success() || failure()) && github.event.pull_request.head.repo.fork != true && hashFiles('sarif/trivy-injector-amd64.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: sarif/trivy-injector-amd64.sarif
          category: trivy-deployed-injector-amd64
      - name: Upload Trivy SARIF (injector, arm64)
        if: (success() || failure()) && github.event.pull_request.head.repo.fork != true && hashFiles('sarif/trivy-injector-arm64.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: sarif/trivy-injector-arm64.sarif
          category: trivy-deployed-injector-arm64
