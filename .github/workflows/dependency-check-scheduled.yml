# The enforced OWASP Dependency-Check, nightly on main rather than per pull request: it owns the NVD
# cache the informational PR scan in build-backend.yml restores, and the NVD API is often rate-limited
# or 503s, so a transient outage retries the next night instead of blocking a PR. `workflow_dispatch`
# seeds the cache on demand.
name: Scheduled OWASP Dependency-Check

on:
  schedule:
    # 03:17 UTC daily, off-the-hour.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # For the SARIF upload to Code Scanning.
  security-events: write

jobs:
  dependency-check:
    name: OWASP Dependency-Check (authoritative)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25 (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # The most recent NVD cache, so only a small incremental update runs.
      - name: Restore NVD database cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/dependency-check-data
          key: dependency-check-data-${{ github.run_id }}
          restore-keys: |
            dependency-check-data-

      # Blocking on purpose: a failure here (a real CVE or an NVD outage) marks the run red.
      # `--no-configuration-cache`: the Aggregate task reaches for `project` at execution time (upstream
      # #478 would remove the need).
      - name: Run OWASP Dependency-Check
        run: ./gradlew dependencyCheckAggregate --no-configuration-cache
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      # Save only on success, so a corrupted H2 store from a failed run is never persisted.
      - name: Save NVD database cache
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/dependency-check-data
          key: dependency-check-data-${{ github.run_id }}

      # **Zero findings is only good news if something was examined.** `failBuildOnCVSS` passes trivially
      # over an empty dependency set, which a misconfigured `scanProjects` produced for months (#1087). A
      # floor of zero, because the count moves with every dependency change.
      - name: Assert the scan examined something
        run: scripts/scan-coverage.sh owasp build/reports/dependency-check/dependency-check-report.json

      # The `hashFiles` guards fail *silently*: if the plugin moves its output directory again (13.0.0
      # did), uploads stop and the job stays green. Re-check on every plugin upgrade.
      - name: Upload SARIF to GitHub Code Scanning
        if: (success() || failure()) && hashFiles('build/reports/dependency-check/dependency-check-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: build/reports/dependency-check/dependency-check-report.sarif
          category: owasp-dependency-check

      - name: Upload HTML report as artifact
        if: (success() || failure()) && hashFiles('build/reports/dependency-check/dependency-check-report.html') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-check-report
          path: build/reports/dependency-check/dependency-check-report.html
