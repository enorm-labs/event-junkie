# Authoritative OWASP Dependency-Check.
#
# This is the enforced dependency vulnerability scan. It runs on a nightly schedule
# (and on demand) against main rather than on every PR, for two reasons:
#
#   1. It owns the shared NVD database cache. Caches saved here on main are restorable
#      from PR branches, so the informational PR scan in build-backend.yml stays fast
#      and is not exposed to NVD API outages.
#   2. The NVD API is frequently rate-limited or returns 503s. A nightly cadence means a
#      transient outage just retries the next night instead of blocking anyone's PR.
#
# Use the "Run workflow" button (workflow_dispatch) to seed the cache on demand — e.g.
# the first time, or after an NVD outage clears.
name: Scheduled OWASP Dependency-Check

on:
  schedule:
    # 03:17 UTC daily. Off-the-hour to avoid the cron stampede on shared runners.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # Required for uploading SARIF to GitHub Code Scanning
  security-events: write

jobs:
  dependency-check:
    name: OWASP Dependency-Check (authoritative)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25 (Temurin)
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Restore the most recent NVD cache so we only apply a small incremental update
      # instead of re-downloading the whole database every night.
      - name: Restore NVD database cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/dependency-check-data
          key: dependency-check-data-${{ github.run_id }}
          restore-keys: |
            dependency-check-data-

      # Blocking on purpose: this is the enforced scan. A failure here (real CVE or NVD
      # outage) marks the scheduled run red so it gets attention and retried.
      # --no-configuration-cache: the Dependency-Check plugin's Aggregate task reaches for
      # `project` at execution time and so cannot be used with the configuration cache
      # (enabled in gradle.properties). Upstream PR #478, open at 13.0.0, would remove the need.
      - name: Run OWASP Dependency-Check
        run: ./gradlew dependencyCheckAggregate --no-configuration-cache
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      # Save only on success so a partially-written/corrupted H2 store from a failed run
      # is never persisted and restored by later runs (here or in the PR job).
      - name: Save NVD database cache
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/dependency-check-data
          key: dependency-check-data-${{ github.run_id }}

      # NOTE: the `hashFiles` guards below fail *silently* — if these paths ever stop
      # matching where the plugin writes, the uploads are skipped and the job still goes
      # green while findings quietly stop reaching Code Scanning. Dependency-Check 13.0.0
      # moved the default output directory to build/reports/dependency-check/, so re-check
      # these paths whenever the plugin is upgraded.
      - name: Upload SARIF to GitHub Code Scanning
        if: (success() || failure()) && hashFiles('build/reports/dependency-check/dependency-check-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: build/reports/dependency-check/dependency-check-report.sarif
          category: owasp-dependency-check

      - name: Upload HTML report as artifact
        if: (success() || failure()) && hashFiles('build/reports/dependency-check/dependency-check-report.html') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-check-report
          path: build/reports/dependency-check/dependency-check-report.html
