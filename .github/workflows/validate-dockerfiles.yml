name: Validate Dockerfiles

# hadolint over every tracked Dockerfile. The image scan in release.yml judges what a build produced;
# this judges the instructions that produce it, which is where a `latest` tag, an unpinned package or
# a forgotten `USER` is cheapest to catch. The pre-commit hook is advisory; this is the gate.

on:
  push:
    branches: [ main ]
    paths:
      - '**/Dockerfile'
      - '**/Dockerfile.*'
      - '**/*.Dockerfile'
      - '.github/workflows/validate-dockerfiles.yml'
  pull_request:
    branches: [ main ]
    # `paths:` is present because this check is **not** required. **If it is ever made required, delete
    # this filter in the same change** — a required check that never runs stays Pending forever.
    paths:
      - '**/Dockerfile'
      - '**/Dockerfile.*'
      - '**/*.Dockerfile'
      - '.github/workflows/validate-dockerfiles.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # A string in YAML, so Renovate's `customManagers` watch it (ADR-024).
  HADOLINT_VERSION: v2.15.1

jobs:
  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The file list comes from git, so a new Dockerfile is linted without editing this workflow. An
      # empty list would pass in silence, so it fails instead.
      - name: Run hadolint
        run: |
          mapfile -t files < <(git ls-files '*Dockerfile' '*Dockerfile.*' '*.Dockerfile')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::git ls-files matched no Dockerfile"
            exit 1
          fi
          printf 'Linting %s\n' "${files[@]}"
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            "hadolint/hadolint:${HADOLINT_VERSION}" hadolint "${files[@]}"
