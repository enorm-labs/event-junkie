name: Public Site Probe

# The outer half of #271's two-layer alerting. **The slower of two outer paths** (ADR-021): a Better
# Stack monitor polls every three minutes; this runs once a day and pings a dead-man's switch, so
# silence raises the alarm. Neither runs on Hetzner — an alerting path on the node it monitors cannot
# report that node's death. **Do not restore a fast cron here**; the schedule block says why.
#
# **A conditional ping.** It resolves the hostname, fetches the site over the public internet and
# asserts status and content **before** pinging, so one check also catches DNS failure, an expired
# certificate, misrouting and an application error.
#
# **Arming it is the `HEALTHCHECKS_PING_URL` secret.** The probe skips loudly when it is unset. Staging is not
# on the internet and cannot be probed from here.
#
# **Do not self-host the other end**: a dead-man's switch on the infrastructure it monitors cannot
# report that infrastructure's death. `wal-g`'s backup drill pings the same account.

on:
  schedule:
    # **Daily, because GitHub refuses a faster cron here** (#889). A 15-minute cron delivered 39 of 480
    # runs over five days: shortest 29 min, median 129, longest 678. The daily schedules here are
    # honoured at a median gap of ~24 hours and a worst of ~34, so the check that receives this ping
    # wants a 24-hour period and a 24-hour grace. **Derive those numbers from the measurement, never from
    # this line.** Off-the-hour, clear of 03:17 and 04:41.
    - cron: '37 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Deliberately NOT `cancel-in-progress`: cancelling the older run discards the probe that was
  # mid-flight while the site was failing.
  group: site-probe
  cancel-in-progress: false

env:
  # `ingress.host` from the chart's values.yaml; if it changes, it changes there first. A `SITE_URL`
  # repository variable overrides it, for a rehearsal hostname while production is dark
  # (GO_LIVE_CHECKLIST.md §4). Delete the variable when the site is public again.
  SITE_URL: ${{ vars.SITE_URL || 'https://event-junkie.de' }}
  # Asserted in the body. The product name rather than a layout detail: a redesign should not page
  # anyone; a page that no longer says what it is should.
  EXPECTED_CONTENT: Event Junkie

jobs:
  probe:
    name: Probe the public site
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # No `actions/checkout`: nothing reads the repository, so no token is written to `.git/config` at all.
      - name: Resolve, fetch, assert, then ping
        env:
          PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
        run: |
          set -uo pipefail

          if [ -z "${PING_URL}" ]; then
            {
              echo "## ⏸️ Not probing — \`HEALTHCHECKS_PING_URL\` is not set"
              echo
              echo "This is expected until the production deploy (#285) lands: staging is not on the"
              echo "public internet by design (PLATFORM_SETUP §4a), so there is nothing to probe yet."
              echo
              echo "**To activate:** create a check on healthchecks.io with a 24-hour period and a"
              echo "24-hour grace, then add its ping URL as the \`HEALTHCHECKS_PING_URL\`"
              echo "repository secret. No change to this workflow is needed."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "HEALTHCHECKS_PING_URL unset — skipping the probe."
            exit 0
          fi

          fail() {
            echo "::error::$1"
            {
              echo "## 🔴 Probe failed"
              echo
              echo "$1"
            } >> "$GITHUB_STEP_SUMMARY"
            # Signal the failure now rather than waiting out the grace period; silence still covers GitHub being
            # unable to run us at all.
            curl -fsS -m 15 --retry 3 --retry-delay 2 "${PING_URL}/fail" >/dev/null || true
            exit 1
          }

          # 1 — Fetch. `--retry` absorbs a blip; three failures over ~20s is an outage, and false alarms mute a
          #     pager. No `-f`: a 5xx must reach the status assertion.
          body="$(mktemp)"
          code="$(curl -sS -m 20 --retry 3 --retry-delay 3 --retry-all-errors \
                    -o "${body}" -w '%{http_code}' "${SITE_URL}")"
          curl_status=$?

          # 2 — Name curl's own failures: DNS, connection refused and a bad certificate are three outages with
          #     three fixes, and the first line is what someone reads at 03:00. Not `getent`: Linux-only.
          if [ "${curl_status}" -ne 0 ]; then
            case "${curl_status}" in
              6)      fail "DNS did not resolve ${SITE_URL} — the name is gone, not the site." ;;
              7)      fail "Connection to ${SITE_URL} refused — ingress or the node is down." ;;
              28)     fail "${SITE_URL} timed out after 20s." ;;
              35|60)  fail "TLS failed for ${SITE_URL} — expired or untrusted certificate." ;;
              *)      fail "Could not reach ${SITE_URL} after retries (curl exit ${curl_status})." ;;
            esac
          fi

          # 3 — Status and content, in that order: a 200 serving the wrong page is still an outage.
          [ "${code}" = "200" ] || fail "${SITE_URL} answered HTTP ${code}, expected 200."
          grep -qF "${EXPECTED_CONTENT}" "${body}" \
            || fail "${SITE_URL} answered 200 but the body does not contain '${EXPECTED_CONTENT}'."

          # 4 — Only now, and NOT on failure: reporting success is the one thing a dead-man's switch can never
          #     do speculatively.
          curl -fsS -m 15 --retry 3 --retry-delay 2 "${PING_URL}" >/dev/null \
            || fail "Site is healthy but the healthchecks.io ping failed — the switch is now blind."

          {
            echo "## ✅ Site healthy"
            echo
            echo "\`${SITE_URL}\` answered 200 and contains '${EXPECTED_CONTENT}'. healthchecks.io pinged."
          } >> "$GITHUB_STEP_SUMMARY"

      # **This step must never ping healthchecks.io.** Configuration drift is not an outage: the site can be
      # healthy while the console has moved, so drift turns the *workflow* red and leaves the *check* green.
      # ADR-021 conceded that half the assertions left git; `SITE_URL` and `EXPECTED_CONTENT` above are the
      # truth and the console is what gets checked against them.
      - name: Assert the Better Stack monitor still matches this file
        if: always()
        env:
          BS_TOKEN: ${{ secrets.BETTERSTACK_API_TOKEN }}
          MONITOR_ID: ${{ vars.BETTERSTACK_MONITOR_ID || '4876693' }}
        run: |
          set -uo pipefail

          if [ -z "${BS_TOKEN}" ]; then
            {
              echo "## ⏸️ Not checking the monitor — \`BETTERSTACK_API_TOKEN\` is not set"
              echo
              echo "The fast path is unverified. Nothing compares the console against this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "BETTERSTACK_API_TOKEN unset — skipping the configuration check."
            exit 0
          fi

          # A read-only GET; the token has no read-only scope, so this is the only call made with it, and no
          # code is checked out that could reach it.
          response="$(mktemp)"
          code="$(curl -sS -m 20 --retry 3 --retry-delay 3 --retry-all-errors \
                    -o "${response}" -w '%{http_code}' \
                    -H "Authorization: Bearer ${BS_TOKEN}" \
                    "https://uptime.betterstack.com/api/v2/monitors/${MONITOR_ID}")"

          # **Failing to check is a state worth a red run.** A revoked token that skipped quietly would leave
          # the console unwatched and everything green.
          if [ "${code}" != "200" ]; then
            echo "::error::Better Stack API answered HTTP ${code} for monitor ${MONITOR_ID}. The monitor is unverified."
            {
              echo "## 🔴 Could not read the monitor"
              echo
              echo "The API answered HTTP ${code}. Check that \`BETTERSTACK_API_TOKEN\` is valid and is an Uptime token."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          drifted=0
          findings="$(mktemp)"

          expect() { # field, actual, wanted
            if [ "$2" != "$3" ]; then
              echo "::error::Monitor ${MONITOR_ID}: $1 is '$2', this repository says '$3'."
              printf -- '- **%s** — console `%s`, repository `%s`\n' "$1" "$2" "$3" >> "${findings}"
              drifted=1
            fi
          }

          a() { jq -r "$1" < "${response}"; }

          # The two that matter most: the values the probe above asserts.
          expect url                 "$(a '.data.attributes.url')"                 "${SITE_URL}"
          expect required_keyword    "$(a '.data.attributes.required_keyword')"    "${EXPECTED_CONTENT}"
          # A keyword monitor also alerts when the URL is unavailable; any other type stops asserting the body.
          expect monitor_type        "$(a '.data.attributes.monitor_type')"        'keyword'
          expect check_frequency     "$(a '.data.attributes.check_frequency')"     '180'
          expect confirmation_period "$(a '.data.attributes.confirmation_period')" '180'
          expect http_method         "$(a '.data.attributes.http_method')"         'get'
          expect verify_ssl          "$(a '.data.attributes.verify_ssl')"          'true'
          expect email               "$(a '.data.attributes.email')"               'true'
          expect regions             "$(a '.data.attributes.regions | join(",")')"   'eu'
          # `paused_at` is a timestamp, so null is the only healthy value; a paused monitor looks exactly like a
          # passing one from outside.
          expect paused_at           "$(a '.data.attributes.paused_at')"           'null'

          if [ "${drifted}" -ne 0 ]; then
            {
              echo "## 🔴 The Better Stack monitor no longer matches this repository"
              echo
              cat "${findings}"
              echo
              echo "The site may well be up — see above. **This is the console drifting from \`site-probe.yml\`.**"
              echo "Fix it in the console, or change this workflow and \`docs/ops/HEALTHCHECKS.md\` if the console is right."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo "## ✅ Monitor matches"
            echo
            echo "Ten fields on monitor \`${MONITOR_ID}\` agree with this workflow, \`${SITE_URL}\` and '${EXPECTED_CONTENT}' included."
          } >> "$GITHUB_STEP_SUMMARY"
