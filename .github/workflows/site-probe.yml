name: Public Site Probe

# The outer half of #271's two-layer alerting, and the half that is not optional.
#
# **This is the slower of two outer paths, and ADR-021 records why there are two.** A Better Stack
# monitor polls the site every three minutes and alerts in about six. This file runs once a day and
# pings a dead-man's switch, so silence is what raises the alarm. The two share no infrastructure,
# and neither runs on Hetzner. **Do not restore a fast cron here** — the schedule block says what
# happened the last time this asked GitHub for one.
#
# **An alerting path that runs on the node it monitors cannot report that node's death.** If the
# Hetzner box is gone, OpenObserve and the Signal bridge are gone with it, and the silence is
# indistinguishable from health. So this runs on GitHub's infrastructure — off Hetzner, notifying
# through healthchecks.io's own channel and never through the in-cluster bridge.
#
# **It is a *conditional* ping, and that is the whole design.**
# A bare heartbeat proves the cron ran. This resolves the hostname, fetches the site over the public
# internet, and asserts both the status code and expected content **before** pinging. That way one
# check also catches DNS failure, an expired certificate, ingress misrouting and an application
# error — none of which a heartbeat would notice.
#
# **Why it is inert until somebody arms it, and how.**
# Staging is deliberately not on the internet at all (PLATFORM_SETUP §4a: no public `A` record, no
# public 80/443, Ingress on the WireGuard tunnel), so it can never be probed from here. Production
# can: it serves a rehearsal hostname over a real certificate while the domain stays dark.
#
# The probe **skips when `HEALTHCHECKS_PING_URL` is unset**, and says so in the job summary rather
# than passing quietly — a silent skip is the failure mode this repository has been bitten by twice
# (`hashFiles` in build-backend.yml, the Kustomize resource list in #416).
#
# **Arming it is two settings and no change to this file:** the `HEALTHCHECKS_PING_URL` secret, and
# the `SITE_URL` variable below pointed at whatever production currently serves. Setting the secret
# without the variable probes the apex, which does not resolve until go-live — a failure every
# fifteen minutes, which is precisely how a monitor gets muted.
#
# **Do not self-host the other end.**
# healthchecks.io is external on purpose. A dead-man's switch on the infrastructure it monitors
# cannot report that infrastructure's death — the same argument as the first paragraph, one layer
# out. The account already exists and `wal-g`'s backup drill pings it (infra/AGENTS.md).

on:
  schedule:
    # **Daily, because GitHub refuses a faster cron here.** This asked for every fifteen minutes
    # until #889. It did not get one. Measured over five days, against 480 requested runs:
    #
    #   asked 15 min | shortest 29 min | median 129 min | longest 678 min | 39 runs delivered, 8%
    #
    # The daily schedules in this repository *are* honoured, and that is what sets the number below.
    # `dependency-check-scheduled.yml` and `image-scan-scheduled.yml` both measure a median gap of
    # about 24 hours and a worst gap of about 34. So the check that receives this ping wants a
    # 24-hour period and a 24-hour grace, which leaves real headroom over that worst gap.
    #
    # **Derive those two numbers from the measurement, never from this line.** Reading the cron and
    # doubling it is exactly what produced #889.
    #
    # Off-the-hour, and clear of 03:17 and 04:41, for the reason every scheduled workflow here gives:
    # the top of the hour is a stampede on shared runners.
    - cron: '37 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Deliberately NOT `cancel-in-progress`. Cancelling the older run to start a newer one would
  # discard exactly the probe that was mid-flight while the site was failing.
  group: site-probe
  cancel-in-progress: false

env:
  # Pinned and visible, like every other tool version and endpoint here. This is `ingress.host` from
  # the chart's values.yaml and the repository's homepage field — if it changes, it changes there
  # first and here second.
  #
  # **A repository variable overrides it, and that is what lets this run before go-live.** Production
  # serves a rehearsal hostname while `publish_dns` is false, so the apex resolves to nothing and a
  # probe against it would fail every fifteen minutes for ever. Set `SITE_URL` to the name production
  # actually serves; delete the variable at go-live and the default below is correct again.
  #
  # The default is the canonical host rather than the rehearsal one on purpose: the value that
  # survives someone forgetting this workflow exists should be the one that is right at launch.
  SITE_URL: ${{ vars.SITE_URL || 'https://event-junkie.de' }}
  # Asserted in the body. Chosen because it is the product name rather than a layout detail: a
  # redesign should not page anyone, but a page that no longer says what it is should.
  EXPECTED_CONTENT: Event Junkie

jobs:
  probe:
    name: Probe the public site
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # No `actions/checkout`. Nothing here reads the repository, so not checking out means no token
      # is written to `.git/config` in the first place — the strongest form of the
      # `persist-credentials: false` rule the other workflows apply.
      - name: Resolve, fetch, assert, then ping
        env:
          PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
        run: |
          set -uo pipefail

          if [ -z "${PING_URL}" ]; then
            {
              echo "## ⏸️ Not probing — \`HEALTHCHECKS_PING_URL\` is not set"
              echo
              echo "This is expected until the production deploy (#285) lands: staging is not on the"
              echo "public internet by design (PLATFORM_SETUP §4a), so there is nothing to probe yet."
              echo
              echo "**To activate:** create a check on healthchecks.io with a 24-hour period and a"
              echo "24-hour grace, then add its ping URL as the \`HEALTHCHECKS_PING_URL\`"
              echo "repository secret. No change to this workflow is needed."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "HEALTHCHECKS_PING_URL unset — skipping the probe."
            exit 0
          fi

          fail() {
            echo "::error::$1"
            {
              echo "## 🔴 Probe failed"
              echo
              echo "$1"
            } >> "$GITHUB_STEP_SUMMARY"
            # Signal the failure immediately rather than waiting out the grace period. Silence still
            # covers the case this cannot: GitHub itself being unable to run us at all.
            curl -fsS -m 15 --retry 3 --retry-delay 2 "${PING_URL}/fail" >/dev/null || true
            exit 1
          }

          # 1 — Fetch. `--retry` absorbs a single transient blip; three failures in a row over ~20s
          #     is a real outage rather than a hiccup, and false alarms are how a pager gets muted.
          #     No `-f`: a 5xx must reach the status assertion below rather than exit here.
          body="$(mktemp)"
          code="$(curl -sS -m 20 --retry 3 --retry-delay 3 --retry-all-errors \
                    -o "${body}" -w '%{http_code}' "${SITE_URL}")"
          curl_status=$?

          # 2 — Name curl's own failures rather than reporting an exit code. DNS, connection refused
          #     and a bad certificate are three different outages with three different fixes, and the
          #     first line of the alert is the one someone reads at 03:00. Deliberately not `getent`:
          #     that is Linux-only, so it could not be exercised outside the runner.
          if [ "${curl_status}" -ne 0 ]; then
            case "${curl_status}" in
              6)      fail "DNS did not resolve ${SITE_URL} — the name is gone, not the site." ;;
              7)      fail "Connection to ${SITE_URL} refused — ingress or the node is down." ;;
              28)     fail "${SITE_URL} timed out after 20s." ;;
              35|60)  fail "TLS failed for ${SITE_URL} — expired or untrusted certificate." ;;
              *)      fail "Could not reach ${SITE_URL} after retries (curl exit ${curl_status})." ;;
            esac
          fi

          # 3 — Status and content, in that order: a 200 serving the wrong page is still an outage,
          #     and an ingress problem shows up here as a non-200.
          [ "${code}" = "200" ] || fail "${SITE_URL} answered HTTP ${code}, expected 200."
          grep -qF "${EXPECTED_CONTENT}" "${body}" \
            || fail "${SITE_URL} answered 200 but the body does not contain '${EXPECTED_CONTENT}'."

          # 4 — Only now. The ping is the *last* step and, unlike the SARIF uploads elsewhere in this
          #     repository, it must NOT run on failure — reporting success is the one thing a
          #     dead-man's switch can never do speculatively.
          curl -fsS -m 15 --retry 3 --retry-delay 2 "${PING_URL}" >/dev/null \
            || fail "Site is healthy but the healthchecks.io ping failed — the switch is now blind."

          {
            echo "## ✅ Site healthy"
            echo
            echo "\`${SITE_URL}\` answered 200 and contains '${EXPECTED_CONTENT}'. healthchecks.io pinged."
          } >> "$GITHUB_STEP_SUMMARY"

      # **This step must never ping healthchecks.io, in either direction.** Configuration drift is
      # not an outage. The site can be perfectly healthy while the console has moved, and the check
      # above has already reported that truthfully. So drift turns the *workflow* red and leaves the
      # *check* green, which is what each of them means.
      #
      # It exists because ADR-021 conceded that half the assertions left git. The status code and
      # the body string now live in a console form as well as in this file, and nothing compared
      # them. This is the comparison. `SITE_URL` and `EXPECTED_CONTENT` above are the single source
      # of truth, and the console is what gets checked against them.
      - name: Assert the Better Stack monitor still matches this file
        if: always()
        env:
          BS_TOKEN: ${{ secrets.BETTERSTACK_API_TOKEN }}
          MONITOR_ID: ${{ vars.BETTERSTACK_MONITOR_ID || '4876693' }}
        run: |
          set -uo pipefail

          if [ -z "${BS_TOKEN}" ]; then
            {
              echo "## ⏸️ Not checking the monitor — \`BETTERSTACK_API_TOKEN\` is not set"
              echo
              echo "The fast path is unverified. Nothing compares the console against this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "BETTERSTACK_API_TOKEN unset — skipping the configuration check."
            exit 0
          fi

          # A read-only GET. The token has no read-only scope, so this is the only call made with it,
          # and the job checks out no code that could reach it.
          response="$(mktemp)"
          code="$(curl -sS -m 20 --retry 3 --retry-delay 3 --retry-all-errors \
                    -o "${response}" -w '%{http_code}' \
                    -H "Authorization: Bearer ${BS_TOKEN}" \
                    "https://uptime.betterstack.com/api/v2/monitors/${MONITOR_ID}")"

          # **Failing to check is a state worth a red run.** A revoked token that skipped quietly
          # would leave the console unwatched and everything looking green — the failure mode this
          # repository has been bitten by twice.
          if [ "${code}" != "200" ]; then
            echo "::error::Better Stack API answered HTTP ${code} for monitor ${MONITOR_ID}. The monitor is unverified."
            {
              echo "## 🔴 Could not read the monitor"
              echo
              echo "The API answered HTTP ${code}. Check that \`BETTERSTACK_API_TOKEN\` is valid and is an Uptime token."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          drifted=0
          findings="$(mktemp)"

          expect() { # field, actual, wanted
            if [ "$2" != "$3" ]; then
              echo "::error::Monitor ${MONITOR_ID}: $1 is '$2', this repository says '$3'."
              printf -- '- **%s** — console `%s`, repository `%s`\n' "$1" "$2" "$3" >> "${findings}"
              drifted=1
            fi
          }

          a() { jq -r "$1" < "${response}"; }

          # The two that matter most: they are the same values the probe above asserts.
          expect url                 "$(a '.data.attributes.url')"                 "${SITE_URL}"
          expect required_keyword    "$(a '.data.attributes.required_keyword')"    "${EXPECTED_CONTENT}"
          # A keyword monitor also alerts when the URL is unavailable, so this type is a superset.
          # Any other type silently stops asserting the body.
          expect monitor_type        "$(a '.data.attributes.monitor_type')"        'keyword'
          expect check_frequency     "$(a '.data.attributes.check_frequency')"     '180'
          expect confirmation_period "$(a '.data.attributes.confirmation_period')" '180'
          expect http_method         "$(a '.data.attributes.http_method')"         'get'
          expect verify_ssl          "$(a '.data.attributes.verify_ssl')"          'true'
          expect email               "$(a '.data.attributes.email')"               'true'
          expect regions             "$(a '.data.attributes.regions | join(",")')"   'eu'
          # `paused_at` is a timestamp, so null is the only healthy value. A paused monitor reports
          # nothing and looks exactly like a passing one from outside.
          expect paused_at           "$(a '.data.attributes.paused_at')"           'null'

          if [ "${drifted}" -ne 0 ]; then
            {
              echo "## 🔴 The Better Stack monitor no longer matches this repository"
              echo
              cat "${findings}"
              echo
              echo "The site may well be up — see above. **This is the console drifting from \`site-probe.yml\`.**"
              echo "Fix it in the console, or change this workflow and \`docs/ops/HEALTHCHECKS.md\` if the console is right."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo "## ✅ Monitor matches"
            echo
            echo "Ten fields on monitor \`${MONITOR_ID}\` agree with this workflow, \`${SITE_URL}\` and '${EXPECTED_CONTENT}' included."
          } >> "$GITHUB_STEP_SUMMARY"
