# Regenerates docs/BACKLOG.md — a read-only mirror of the open issues — and commits it if it
# changed.
#
# Why a generated file exists at all: GitHub Issues is the backlog, but *finding* work should stay
# a local file read. Before the migration, TODO.md was one grep away and 23 files pointed at it,
# including five agent prompts that told agents to consult it. Turning every one of those reads
# into a `gh issue list` call would have made the tracker slower and less reliable to consult than
# the file it replaced. So reads get this snapshot; writes go to the API. Nothing edits the
# snapshot by hand, so it cannot drift from the tracker.
#
# Triggers are deliberately narrow. `opened`/`closed`/`reopened` are the events that change what
# work exists; `edited` and `labeled` are not, and including them would push a commit to main a
# dozen times an afternoon while someone triages. The nightly run catches everything else.
name: Backlog Snapshot

on:
  issues:
    types: [ opened, closed, reopened, deleted, transferred ]
  schedule:
    # 04:17 UTC — off the hour, because everything scheduled on the hour queues behind everything
    # else scheduled on the hour.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

# Bulk issue operations fire many events at once. Without this they race each other's pushes and
# all but one fail on a non-fast-forward. `cancel-in-progress` is right here because each run
# regenerates the whole file from scratch — a superseded run has nothing worth finishing.
concurrency:
  group: backlog-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    name: Regenerate docs/BACKLOG.md
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Regenerate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/generate-backlog-snapshot.sh

      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/BACKLOG.md; then
            echo "No change."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/BACKLOG.md
          # [skip ci] so a docs-only bot commit does not start the full backend and frontend
          # pipelines on main.
          git commit -m 'docs(backlog): refresh the issue snapshot [skip ci]'
          # Rebase rather than force-push: a human commit landing between the checkout and this
          # push must survive, and the snapshot is regenerated content that rebases cleanly.
          git pull --rebase origin main
          git push origin HEAD:main
