# ==============================================================================================
#  NEVER ADD `actions/checkout` — OR ANY STEP THAT RUNS PULL-REQUEST CODE — TO THIS FILE.
#  Same banner as label-pr.yml: `pull_request_target` is safe only because nothing here fetches or
#  executes the pull request's contents. This reads two payload fields and exits.
# ==============================================================================================
#
# A required check that refuses a pull request opened by a GitHub App not listed below, unless a
# person has approved the head it is at (#1424). Three Apps hold `contents: write`, the `main`
# ruleset needs zero approvals, and one App runs agents with a shell that read venue pages. A
# "restrict updates" ruleset closed that and broke auto-merge (GitHub's deferred merge runs without
# bypass, known and not planned), so this check replaced it.
#
# **The approval is what lets an agent's pull request land at all.** A required check with no bypass
# actor blocks the merge button for everyone, so the person says so with an approving review — a
# User, not a Bot, on the current head. A push after the approval moves the head and the gate is red
# again. The `claude` App cannot approve as a person.
#
# **`pull_request_target` is load-bearing**: it runs THIS file as it stands on `main`, never the pull
# request's copy, so an App with `workflows: write` cannot edit the gate green from the pull request
# it gates. **Never add a `paths:` filter**: a required check that never runs is Pending forever.
#
# **What it does not stop**: an App with `contents: write` pushing onto a person's open branch with
# auto-merge armed. THREAT_MODEL.md B9 carries that as an accepted row.
name: Merge Gate

on:
  # comment-lint: allow a dated suppression, per the reason in zizmor.yml
# zizmor: ignore[dangerous-triggers]
  # 2026-09-14 — `pull_request_target` is insecure when it checks out or executes pull-request code;
  # this reads `pull_request.user` from the payload and exits. `synchronize`, because a required check
  # reports on every head.
  pull_request_target:
    types: [ opened, reopened, synchronize ]
  # A review is the event that can turn a red gate green, so the check runs again on each one, on the
  # same head.
  pull_request_review:
    types: [ submitted, edited, dismissed ]

# To list the pull request's reviews. Nothing is written.
permissions:
  pull-requests: read

concurrency:
  group: merge-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    # The check context the `main` ruleset requires, by this exact name.
    name: Merge gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse a pull request from an App that is not on the list, unless a person approved this head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          set -euo pipefail
          # Bots that may open a pull request here: Dependabot, Renovate (ADR-024), the release App.
          # `claude[bot]` is absent on purpose — the approval below is how a person says they read it.
          allowed='dependabot[bot] renovate[bot] event-junkie-release[bot]'
          if [[ "$TYPE" != "Bot" ]]; then
            echo "::notice::${AUTHOR} is a ${TYPE} — passing"
            exit 0
          fi
          for bot in $allowed; do
            if [[ "$AUTHOR" == "$bot" ]]; then
              echo "::notice::${AUTHOR} is a listed App — passing"
              exit 0
            fi
          done
          # An approval counts only from a User with write access, on this exact head, and the newest review
          # per reviewer decides: an approval followed by a dismissal is not one. A comment review is left out
          # first — GitHub does not let one dismiss an approval, and an agent's `gh pr review --comment` under
          # the reviewer's account turned two approved pull requests red (#1574, #1575).
          approver=$(gh api --paginate "repos/${REPO}/pulls/${NUMBER}/reviews" --jq '
            [ .[] | select(.user.type == "User")
                  | select(.author_association == "OWNER" or .author_association == "MEMBER" or .author_association == "COLLABORATOR")
                  | select(.state != "COMMENTED") ]
            | group_by(.user.login) | map(max_by(.submitted_at))
            | map(select(.state == "APPROVED" and .commit_id == env.HEAD_SHA))
            | .[0].user.login // empty')
          if [[ -n "$approver" ]]; then
            echo "::notice::${AUTHOR} is a GitHub App, and ${approver} approved ${HEAD_SHA:0:7} — passing"
            exit 0
          fi
          echo "::error::${AUTHOR} is a GitHub App that is not allowed to land pull requests here on its own (#1424). A person reads it and approves this head, ${HEAD_SHA:0:7}; the gate runs again on the review."
          exit 1
