# ==============================================================================================
#  NEVER ADD `actions/checkout` — OR ANY STEP THAT RUNS PULL-REQUEST CODE — TO THIS FILE.
#  Same banner, same reason as label-pr.yml: this runs on `pull_request_target`, and the only thing
#  that makes that safe is that nothing here ever fetches or executes the pull request's contents.
#  This file reads two fields from the event payload and exits. That is all it may ever do.
# ==============================================================================================
#
# A required check that refuses a pull request opened by a GitHub App we did not list, unless a
# person has approved the head it is at. The control #1424 exists for: three Apps hold `contents:
# write` and `pull_requests: write`, the `main` ruleset needs zero approvals, and one of the Apps
# runs agents with a shell that read venue pages. A "restrict updates" ruleset closed that and broke
# auto-merge — GitHub's deferred merge runs without bypass, a known limitation with no fix planned —
# so this check is what replaced it.
#
# **The approval is what lets an agent's pull request land at all.** A required check with no
# bypass actor blocks the merge button for everyone, the person included, so "a person merges it"
# needs a way to say so that the gate can read: an approving review, by a User and not a Bot, on
# the pull request's current head. A push after the approval moves the head and the gate is red
# again until the new head is approved. The `claude` App cannot approve as a person and cannot edit
# this file into passing, so the review is the one thing only a person can supply.
#
# **`pull_request_target` is load-bearing here, not a convenience.** It runs THIS file as it stands
# on `main`, never the pull request's copy. The `claude` App holds `workflows: write`, so a
# `pull_request` check could be edited green by the very pull request it gates; this one cannot,
# because nothing but a merge to `main` changes what runs, and a merge is what it gates.
#
# **Never add a `paths:` filter.** A required check that never runs leaves the pull request Pending
# forever — the same rule codeql.yml, validate-chart.yml and validate-infra.yml state.
#
# **What it does not stop, stated rather than discovered:** an App with `contents: write` can push
# onto a person's open branch, and that pull request's author stays the person. Auto-merge armed on
# such a branch would land the push. docs/security/THREAT_MODEL.md B9 carries that as an accepted
# row, with the reason.
name: Merge Gate

on:
  # comment-lint: allow a dated suppression, per the reason in zizmor.yml
# zizmor: ignore[dangerous-triggers]
  # 2026-09-14 — `pull_request_target` is insecure when it checks out or executes pull-request code.
  # This workflow does neither: it reads `pull_request.user` from the event payload and exits. The
  # trigger is the point (see the header), and the absence of a checkout is what keeps it safe.
  # `synchronize`, because a required check has to report on every head the pull request gets.
  pull_request_target:
    types: [ opened, reopened, synchronize ]
  # A review is the event that can turn a red gate green, so the check runs again on each one. The
  # payload carries the same `pull_request` object, and the run reports on the same head.
  pull_request_review:
    types: [ submitted, edited, dismissed ]

# To list the pull request's reviews. Nothing is written.
permissions:
  pull-requests: read

concurrency:
  group: merge-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    # The check context the `main` ruleset requires, by this exact name.
    name: Merge gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse a pull request from an App that is not on the list, unless a person approved this head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          set -euo pipefail
          # Bots that may open a pull request here. Dependabot and Renovate propose dependency bumps
          # (ADR-024); the release App opens the version bump after a cut. `claude[bot]` is absent
          # on purpose: the agent workflows open pull requests a person reads first, and the
          # approval below is how the person says so.
          allowed='dependabot[bot] renovate[bot] event-junkie-release[bot]'
          if [[ "$TYPE" != "Bot" ]]; then
            echo "::notice::${AUTHOR} is a ${TYPE} — passing"
            exit 0
          fi
          for bot in $allowed; do
            if [[ "$AUTHOR" == "$bot" ]]; then
              echo "::notice::${AUTHOR} is a listed App — passing"
              exit 0
            fi
          done
          # An approval counts only from a User with write access, on this exact head. The reviews
          # API returns every review ever submitted, so the newest one per reviewer decides: an
          # approval followed by a dismissal or a request for changes is not an approval. A comment
          # review is left out before that choice — GitHub does not let one dismiss an approval, and
          # an agent posting its notes as `gh pr review --comment` under the reviewer's account
          # turned two approved pull requests red (#1574, #1575).
          approver=$(gh api --paginate "repos/${REPO}/pulls/${NUMBER}/reviews" --jq '
            [ .[] | select(.user.type == "User")
                  | select(.author_association == "OWNER" or .author_association == "MEMBER" or .author_association == "COLLABORATOR")
                  | select(.state != "COMMENTED") ]
            | group_by(.user.login) | map(max_by(.submitted_at))
            | map(select(.state == "APPROVED" and .commit_id == env.HEAD_SHA))
            | .[0].user.login // empty')
          if [[ -n "$approver" ]]; then
            echo "::notice::${AUTHOR} is a GitHub App, and ${approver} approved ${HEAD_SHA:0:7} — passing"
            exit 0
          fi
          echo "::error::${AUTHOR} is a GitHub App that is not allowed to land pull requests here on its own (#1424). A person reads it and approves this head, ${HEAD_SHA:0:7}; the gate runs again on the review."
          exit 1
