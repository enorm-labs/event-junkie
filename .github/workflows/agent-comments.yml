# Claude driven by this repository's own /compact-comments prompt, opening a pull request and never
# pushing to main. Third of #387's four workloads. The shared shape is documented once in
# ci-cd.instructions.md; three lines below are what fails silently if edited here.
#
# **This is the workload #387 calls the dangerous one, and the model choice is part of the answer.**
# A large share of the comments here exist to carry reasoning, and every one of them reads as
# removable to something optimising for brevity. `--unattended` limits the run to DELETE, RENAME and
# EXTRACT — the buckets a reviewer can check in seconds. RELOCATE and KEEP are reported, never
# applied, because rewriting load-bearing prose looks like an improvement whatever it deleted.
#
# **The default model is not the default elsewhere.** Opus 4.8 is measurably less verbose at comment
# work than Opus 5, which is the whole quality being asked for. The input exists so 4.6 and 4.8 can
# be compared on the same prompt rather than argued about.
#
# **There is no `github_token:` input.** See agent-security.yml.
#
# **`display_report: true` is what makes the run readable**, and is not interchangeable with
# `show_full_output`. ci-cd.instructions.md has the difference and why it matters here.
#
# **The `inputs` context is empty on a `schedule` trigger**, so every input below carries an explicit
# fallback. Without them a scheduled run passes `--model` with no value, and goes live by accident
# rather than by decision. ci-cd.instructions.md has the rest.
name: Agent — Compact Comments

on:
  # Nightly, off-the-hour like every other schedule here, and **`--all` rather than
  # `--worst N`**: ranking by comment lines times ratio selects for files that are dense on purpose,
  # where the least is removable. Boilerplate is a few lines each across many files and ranks
  # nowhere, so only a whole-tree walk reaches it. The prompt caps the pull request at twelve files
  # and reports the rest, so a sweep converges over several runs instead of arriving unreviewable —
  # nightly rather than weekly is what makes "several runs" a week rather than a month.
  schedule:
    - cron: '14 6 * * *'
  workflow_dispatch:
    inputs:
      model:
        description: Model to run the sweep with
        type: choice
        default: claude-opus-4-8
        options:
          - claude-opus-4-8
          - claude-opus-4-6
          - claude-opus-5
      dry_run:
        description: Report only — read, reason, and open no pull request
        type: boolean
        default: true
      scope:
        description: What to sweep — --all, a path, --worst N, or blank for the current diff
        type: string
        default: --all

permissions:
  contents: read
  id-token: write

concurrency:
  group: agent-comments
  cancel-in-progress: false

jobs:
  compact:
    name: Compact comments (agent)
    runs-on: ubuntu-latest
    # Longer than the others: the proof obligation is a full Gradle build, and a comment-only change
    # that turns a test red is the signal this job exists to produce.
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The agent runs `./gradlew detekt` and `build` itself, so the toolchain has to be here rather
      # than left to it — a missing JDK reads to a model as "the build is broken".
      - name: Set up Java 25 (Temurin)
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run /compact-comments
        id: claude
        uses: anthropics/claude-code-action@1f291e1cfe0f5fc21db2aef19af844591600ade7 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          display_report: true
          prompt: /compact-comments ${{ inputs.scope || '--all' }} --unattended${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && ' --dry-run' || '' }}
          claude_args: |
            --model ${{ inputs.model || 'claude-opus-4-8' }}
            --max-turns 80
            --allowedTools "Bash,Read,Glob,Grep,Edit,Write,TodoWrite"

      # Reporting steps, last and guarded, per the rule in ci-cd.instructions.md. The step summary
      # `display_report` writes has no REST API, so a scheduled report would exist only as a browser
      # page. This extracts the same final report and nothing else — the execution file also holds
      # every tool result, which is what must never be uploaded from a public repository.
      - name: Extract the report
        if: success() || failure()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          : > agent-report.md
          if [ -n "${EXECUTION_FILE:-}" ] && [ -s "$EXECUTION_FILE" ]; then
            jq -s -r '[.. | objects | select(.type == "result") | .result // empty] | last // ""' \
              "$EXECUTION_FILE" > agent-report.md || true
          fi
          if [ ! -s agent-report.md ]; then
            echo 'No report extracted. The execution file was empty or its shape changed.' > agent-report.md
          fi

      - name: Upload the report
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-report
          path: agent-report.md

      # **A run that produced no report is a failed run, whatever its exit code.** The agent's turn
      # ends when it stops calling tools, so a closing line like "I'll compile the report once the
      # checks finish" reports success and delivers a sentence. That has happened once already.
      # This runs after the upload on purpose: the stub is preserved for diagnosis, then the job goes
      # red. Guarded on the agent step succeeding, because a failure above is already red for a
      # better reason.
      - name: Fail if the report is a stub
        if: steps.claude.outcome == 'success'
        run: |
          set -euo pipefail
          bytes=$(wc -c < agent-report.md)
          lines=$(wc -l < agent-report.md)
          if [ "$bytes" -lt 400 ] || [ "$lines" -lt 5 ]; then
            echo "::error::The agent reported success but wrote no report ($bytes bytes, $lines lines). See the agent-report artifact."
            cat agent-report.md
            exit 1
          fi
