# Claude driven by this repository's own /compact-comments prompt, opening a pull request and never
# pushing to main. Third of #387's four workloads. The shared shape is documented once in
# ci-cd.instructions.md; three lines below are what fails silently if edited here.
#
# **This is the workload #387 calls the dangerous one, and the model choice is part of the answer.**
# A large share of the comments here exist to carry reasoning, and every one of them reads as
# removable to something optimising for brevity. `--unattended` limits the run to DELETE, RENAME and
# EXTRACT — the buckets a reviewer can check in seconds. RELOCATE and KEEP are reported, never
# applied, because rewriting load-bearing prose looks like an improvement whatever it deleted.
#
# **The default model is not the default elsewhere.** Opus 4.8 is measurably less verbose at comment
# work than Opus 5, which is the whole quality being asked for. The input exists so 4.6 and 4.8 can
# be compared on the same prompt rather than argued about.
#
# **There is no `github_token:` input.** See agent-security.yml.
#
# **`display_report: true` is what makes the run readable**, and is not interchangeable with
# `show_full_output`. ci-cd.instructions.md has the difference and why it matters here.
name: Agent — Compact Comments

on:
  # Dispatch only until a run has been watched end to end. This is the last of the four to earn a
  # schedule, per #387's ordering: a wrong answer here is a plausible paragraph nobody notices.
  workflow_dispatch:
    inputs:
      model:
        description: Model to run the sweep with
        type: choice
        default: claude-opus-4-8
        options:
          - claude-opus-4-8
          - claude-opus-4-6
          - claude-opus-5
      dry_run:
        description: Report only — read, reason, and open no pull request
        type: boolean
        default: true
      scope:
        description: What to sweep — a path, or --worst N for the densest files
        type: string
        default: --worst 5

permissions:
  contents: read
  id-token: write

concurrency:
  group: agent-comments
  cancel-in-progress: false

jobs:
  compact:
    name: Compact comments (agent)
    runs-on: ubuntu-latest
    # Longer than the others: the proof obligation is a full Gradle build, and a comment-only change
    # that turns a test red is the signal this job exists to produce.
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The agent runs `./gradlew detekt` and `build` itself, so the toolchain has to be here rather
      # than left to it — a missing JDK reads to a model as "the build is broken".
      - name: Set up Java 25 (Temurin)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run /compact-comments
        uses: anthropics/claude-code-action@1f291e1cfe0f5fc21db2aef19af844591600ade7 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          display_report: true
          prompt: /compact-comments ${{ inputs.scope }} --unattended${{ inputs.dry_run && ' --dry-run' || '' }}
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns 80
            --allowedTools "Bash,Read,Glob,Grep,Edit,Write,TodoWrite"
