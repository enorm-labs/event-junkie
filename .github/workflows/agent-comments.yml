# Claude driven by /compact-comments, opening a pull request and never pushing to main. The shared
# shape is in ci-cd.instructions.md; what fails silently if edited here:
#
# **The dangerous workload, and the model choice is part of the answer.** Comments here carry
# reasoning, and every one reads as removable to something optimising for brevity: `--unattended`
# limits the run to DELETE, RENAME and EXTRACT; RELOCATE and KEEP are reported, never applied. **The
# default model is Opus 4.8**, measurably less verbose at comment work than Opus 5; the input exists
# so the two can be compared on one prompt. **No `github_token:`** (agent-security.yml).
# **`display_report: true`, never `show_full_output`.** **The `inputs` context is empty on a
# schedule**, so every input carries a fallback or a scheduled run goes live by accident.
name: Agent — Compact Comments

on:
  # Nightly, off-the-hour, and **`--all` rather than `--worst N`**: ranking by lines × ratio selects the
  # files that are dense on purpose; boilerplate is a few lines across many files and only a whole-tree
  # walk reaches it. The prompt caps the pull request at twelve files, so a sweep converges over a
  # week of nightly runs.
  schedule:
    - cron: '14 6 * * *'
  workflow_dispatch:
    inputs:
      model:
        description: Model to run the sweep with
        type: choice
        default: claude-opus-4-8
        options:
          - claude-opus-4-8
          - claude-opus-4-6
          - claude-opus-5
      dry_run:
        description: Report only — read, reason, and open no pull request
        type: boolean
        default: true
      scope:
        description: What to sweep — --all, a path, --worst N, or blank for the current diff
        type: string
        default: --all

permissions:
  contents: read
  id-token: write

concurrency:
  group: agent-comments
  cancel-in-progress: false

jobs:
  compact:
    name: Compact comments (agent)
    runs-on: ubuntu-latest
    # Longer than the others: the proof obligation is a full Gradle build.
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The agent runs `./gradlew detekt` and `build` itself; a missing JDK reads to a model as "the build
      # is broken".
      - name: Set up Java 25 (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run /compact-comments
        id: claude
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          display_report: true
          prompt: /compact-comments ${{ inputs.scope || '--all' }} --unattended${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && ' --dry-run' || '' }}
          claude_args: |
            --model ${{ inputs.model || 'claude-opus-4-8' }}
            --max-turns 80
            --allowedTools "Bash,Read,Glob,Grep,Edit,Write,TodoWrite"

      # Reporting steps last and guarded. The step summary has no REST API, so the final report is
      # extracted to an artifact — the report alone, never the execution file with every tool result.
      - name: Extract the report
        if: success() || failure()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          : > agent-report.md
          if [ -n "${EXECUTION_FILE:-}" ] && [ -s "$EXECUTION_FILE" ]; then
            jq -s -r '[.. | objects | select(.type == "result") | .result // empty] | last // ""' \
              "$EXECUTION_FILE" > agent-report.md || true
          fi
          if [ ! -s agent-report.md ]; then
            echo 'No report extracted. The execution file was empty or its shape changed.' > agent-report.md
          fi

      - name: Upload the report
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-report
          path: agent-report.md

      # **A run that produced no report is a failed run, whatever its exit code.** "I'll compile the report
      # once the checks finish" reports success and delivers a sentence, and has. After the upload, so the
      # stub is preserved; guarded on the agent step succeeding.
      - name: Fail if the report is a stub
        if: steps.claude.outcome == 'success'
        run: |
          set -euo pipefail
          bytes=$(wc -c < agent-report.md)
          lines=$(wc -l < agent-report.md)
          if [ "$bytes" -lt 400 ] || [ "$lines" -lt 5 ]; then
            echo "::error::The agent reported success but wrote no report ($bytes bytes, $lines lines). See the agent-report artifact."
            cat agent-report.md
            exit 1
          fi
