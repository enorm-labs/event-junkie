name: CodeQL

# CodeQL as a workflow rather than default setup, because default setup produces no run for a fork
# pull request — and `CodeQL` is required, so the pull request sat Pending forever (#479, #579).
#
# **The fork path.** A fork's `GITHUB_TOKEN` is read-only, so `security-events: write` is never
# granted and an upload would 403. `analyze` takes `upload: never` there: the analysis runs, the job
# reports. **On a fork pull request CodeQL findings do not reach the Security tab** and are a review
# responsibility, the trade `build-backend.yml` makes for detekt.
#
# **Never add a `paths:` filter to the `pull_request` trigger** — a required check skipped by filter
# stays Pending forever. Filtering happens inside the job (the `relevance` step): a job that runs and
# skips its steps still reports, ~10s a language instead of 340s.
#
# `.github/codeql/codeql-config.yml` excludes the venue pages saved as scraper fixtures, whose
# findings were dismissed by hand sixty-two times (#1480); the suite stays the default.
#
# **The matrix defines the check contexts.** Each language is an `Analyze (<language>)` context the
# ruleset names exactly: add or remove one and the ruleset changes in the same pull request.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    # No `paths:` filter — see the header.
  schedule:
    # Weekly, off-the-hour; the scheduled run is the one that catches a new query finding an old bug.
    - cron: '29 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A second push supersedes the first: nobody will merge the earlier commit.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # Named explicitly: otherwise the context is composed from every matrix value — `Analyze (actions,
    # none)` — so a change to `build-mode` would silently rename a required check. By language alone the
    # contexts are the strings default setup produced.
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # java-kotlin builds the whole backend. Generous enough for a cold Gradle cache, tight enough that a
    # hung analysis does not hold a pull request for six hours.
    timeout-minutes: 60

    permissions:
      contents: read
      # Reading the Actions API for the analysis metadata.
      actions: read
      # **Not granted on a fork pull request** — GitHub's model, and `upload:` below accommodates it.
      security-events: write

    strategy:
      # One language's failure should not hide another's findings.
      fail-fast: false
      matrix:
        include:
          # `build-mode` is required per language since CodeQL v3: `none` where the analyser reads source,
          # `autobuild` for java-kotlin, which runs the Gradle wrapper as default setup did.
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: java-kotlin
            build-mode: autobuild

    steps:
      # **The job is unconditional; only its steps are gated.** These names are the required contexts, and
      # a job skipped at job level would rely on "a skipped job counts as success". **Every step below
      # carries the `if:`** — a step without it runs on a docs-only pull request with nothing checked out.
      # The blast radius of a wrong pattern is bounded: `push:` to main and the schedule analyse everything.
      - name: Decide whether this language is affected
        id: relevance
        env:
          # Through `env:`, not interpolated — the template-injection shape zizmor rejects.
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          LANGUAGE: ${{ matrix.language }}
        run: |
          set -euo pipefail
          # A push to main, the weekly schedule and a manual dispatch all analyse everything.
          if [ "$EVENT_NAME" != 'pull_request' ]; then
            echo 'value=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Where each language's source lives. A change to this workflow re-runs all three, so a change to the
          # patterns is validated by the pull request that makes it.
          case "$LANGUAGE" in
            java-kotlin)
              PATTERN='^(events-core/|events-bff/|events-importer/|detekt-rules/|gradle/|gradlew|build\.gradle\.kts$|settings\.gradle\.kts$|gradle\.properties$|\.github/workflows/codeql\.yml$|\.github/codeql/)' ;;
            javascript-typescript)
              PATTERN='^(events-frontend/|perf/|docs/ops/dashboard/|\.github/workflows/codeql\.yml$|\.github/codeql/)' ;;
            actions)
              PATTERN='^\.github/' ;;
            *)
              echo "::error::no path pattern for language '$LANGUAGE' — refusing to skip it"
              exit 1 ;;
          esac
          FILES="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')"
          # An empty list means the API call went wrong. Fail loudly rather than skip an analysis.
          if [ -z "$FILES" ]; then
            echo '::error::no changed files returned for this pull request'
            exit 1
          fi
          if printf '%s\n' "$FILES" | grep -qE "$PATTERN"; then
            echo "$LANGUAGE is affected; analysing."
            echo 'value=true' >> "$GITHUB_OUTPUT"
          else
            echo "No $LANGUAGE sources changed; skipping the analysis."
            echo 'value=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.relevance.outputs.value == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Without it the token is written into `.git/config`; zizmor's `artipacked` blocks at medium.
          persist-credentials: false

      # autobuild runs Gradle, which needs the JDK the toolchain names; the runner's default is how a CodeQL
      # run fails for a reason unrelated to CodeQL.
      - name: Set up JDK
        if: steps.relevance.outputs.value == 'true' && matrix.language == 'java-kotlin'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25

      - name: Initialize CodeQL
        if: steps.relevance.outputs.value == 'true'
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # The one `paths-ignore`, a directory of venue pages and nothing wider (#1480).
          config-file: .github/codeql/codeql-config.yml
          # **Off, because it was evicting every other cache in the repository** (#589). `java-kotlin` stored
          # ~333 MB of Gradle dependencies per run, 8.99 GB within a day, past GitHub's 10 GB limit — and what
          # GitHub evicted was the Playwright browser cache, so the frontend job took a 500–900s install every
          # run and died on its own timeout six times running. The cost is ~two minutes on `Analyze
          # (java-kotlin)`; the Gradle cache that shortens the feedback loop belongs to `Build & Test`.
          dependency-caching: false
          # No `queries:` input: the **default** suite, which default setup ran, so this migration changes where
          # CodeQL runs and not what it finds. `security-extended` is a separate decision with its own noise
          # budget.

      - name: Perform CodeQL analysis
        if: steps.relevance.outputs.value == 'true'
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: /language:${{ matrix.language }}
          # The fork accommodation, and the reason this file exists: `never` on a fork pull request, because a
          # read-only token cannot upload and the 403 would fail the step.
          upload: ${{ github.event.pull_request.head.repo.fork == true && 'never' || 'always' }}
