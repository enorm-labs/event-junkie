name: Build & Test Frontend

on:
  push:
    branches: [ main ]
    paths:
      - 'events-frontend/**'
      - '.github/workflows/build-frontend.yml'
  pull_request:
    branches: [ main ]
    # No `paths:` here (#494): `Build & Test (frontend)` is **required**, and a required check that never
    # runs stays Pending forever. The filtering lives in `detect-changes` below; the `push:` filter keeps
    # its paths.
  # Manual trigger, for an Actions incident that drops webhooks and leaves nothing to re-run. Ignores
  # the path filters: `gh workflow run build-frontend.yml --ref <branch>`.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Seconds, and no checkout: the file list comes from the API, so the required context below can be
  # unconditional while the build stays conditional.
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Decide whether the frontend is affected
        id: filter
        env:
          # Through `env:`, not interpolated: `${{ }}` inside `run:` is the template-injection shape zizmor rejects.
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # `push` is already path-filtered above, and a manual dispatch means "build it anyway".
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')"
          # An empty list means the API call went wrong, not that nothing changed. The gate refuses to pass
          # when detection did not succeed.
          if [ -z "$FILES" ]; then
            echo '::error::no changed files returned for this pull request'
            exit 1
          fi
          printf '%s\n' "$FILES" | sed 's/^/  /'
          if printf '%s\n' "$FILES" | grep -qE '^(events-frontend/|\.github/workflows/build-frontend\.yml$)'; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
          else
            echo 'relevant=false' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Frontend build
    needs: detect-changes
    if: needs.detect-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: events-frontend
    timeout-minutes: 15

    steps:
      # The whole history and every tag: the image label reads the version from them (ADR-032).
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24' # should match the version specified in .nvmrc
          cache: 'npm'
          cache-dependency-path: events-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run check:lint

      - name: Check formatting
        run: npm run check:format

      - name: Check for unused files, exports and dependencies
        run: npm run check:knip

      # Every production npm dependency against config/allowed-licenses-npm.json. `./gradlew checkLicense`
      # sees only the JVM tree, and dependency-review looks only at newly introduced dependencies.
      - name: Check dependency licences
        run: npm run check:licenses

      - name: Build
        run: npm run build

      - name: Run unit tests with coverage
        run: npm run test:unit:coverage -- --reporter=default

      - name: Post coverage to Job Summary
        if: success() || failure()
        run: |
          echo "## 📊 Test Coverage (Vitest/V8)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/coverage-summary.json ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            node -e "
              const r = require('./coverage/coverage-summary.json').total;
              const fmt = (m) => m.pct + '%';
              console.log('Lines:      ' + fmt(r.lines));
              console.log('Statements: ' + fmt(r.statements));
              console.log('Functions:  ' + fmt(r.functions));
              console.log('Branches:   ' + fmt(r.branches));
            " >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "_No coverage report generated._" >> $GITHUB_STEP_SUMMARY
          fi

      # Build the container image and do not push it: this runs on fork pull requests, and pushing belongs
      # to release.yml, which builds the same image on every push to `main` (#264). `npm run build` above
      # produced `dist/`, which the Dockerfile copies — no builder stage. The version comes from
      # `scripts/version.sh`, so the label matches the tag release.yml would publish; package.json holds
      # `0.0.0` (ADR-032).
      - name: Read the version
        id: version
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        run: echo "value=$(scripts/version.sh compute)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: github.event_name == 'pull_request'
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      # Both platforms build with no QEMU step: the Dockerfile does no build work in a `RUN`, and its one
      # `apk upgrade` runs under the runner's emulation. `type=cacheonly` because a multi-platform image
      # cannot be loaded, and one platform would leave arm64 — the Hetzner nodes' architecture — unbuilt.
      - name: Build the frontend image (amd64 + arm64, no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: events-frontend
          file: events-frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=cacheonly
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}

      # The meta-injection sidecar (#287): `npm run build` emitted `dist-injector/` beside `dist/`.
      - name: Build the injector image (amd64 + arm64, no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: events-frontend
          file: events-frontend/Dockerfile.injector
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=cacheonly
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}

  # The image's tag is the installed `@playwright/test`, read from the lockfile `npm ci` installs, so a
  # Dependabot bump moves both at once. A mismatch makes Playwright refuse the image's browsers.
  playwright-image:
    name: Resolve the Playwright image
    needs: detect-changes
    if: needs.detect-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - name: Checkout the lockfile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: events-frontend/package-lock.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read the Playwright version
        id: resolve
        run: |
          set -euo pipefail
          version="$(jq -r '.packages["node_modules/@playwright/test"].version' events-frontend/package-lock.json)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::no @playwright/test version in the lockfile: $version"; exit 1; }
          echo "image=mcr.microsoft.com/playwright:v${version}-noble" >> "$GITHUB_OUTPUT"

  # In Playwright's own image (#2309): it carries the system packages and all five browsers. Installing
  # the packages ran on every build, cache hit or not, so a slow Ubuntu mirror (126 kB/s, 17 minutes)
  # could time out the job.
  e2e:
    name: Frontend e2e
    needs: [ detect-changes, playwright-image ]
    if: needs.detect-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    container:
      # An exact version, not a digest: pinning the digest needs a second bot, and a Playwright bump
      # would then arrive as two pull requests that pass only together.
      image: ${{ needs.playwright-image.outputs.image }} # zizmor: ignore[unpinned-images]
      options: --user 1001
    defaults:
      run:
        working-directory: events-frontend
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image's Node is older than the floor in package.json.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24' # should match the version specified in .nvmrc
          cache: 'npm'
          cache-dependency-path: events-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # On CI the suite runs against `vite preview`, which serves `dist/`.
      - name: Build
        run: npm run build

      - name: Run e2e tests
        run: npm run test:e2e

      # An axe violation is a rule id plus a CSS selector; the HTML report carries the DOM snapshot and the
      # trace that make it actionable. Failure only: a green run's report is noise, and these are not small.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            events-frontend/playwright-report/
            events-frontend/test-results/
          retention-days: 7

  # **The required context, and the only job here that always runs.** A conditional job cannot be a
  # required check — GitHub leaves an unreported context Pending forever (#443, #494) — so the
  # requirement sits on a job that always reports and fails when the build failed, without relying on
  # "a skipped job counts as success".
  gate:
    name: Build & Test (frontend)
    needs: [ detect-changes, playwright-image, build, e2e ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the build's result
        env:
          CHANGES_RESULT: ${{ needs.detect-changes.result }}
          IMAGE_RESULT: ${{ needs.playwright-image.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          set -euo pipefail
          echo "detect-changes: $CHANGES_RESULT · image: $IMAGE_RESULT · build: $BUILD_RESULT · e2e: $E2E_RESULT"
          # A failed detection must not be reported as a pass — it would silently gate nothing.
          if [ "$CHANGES_RESULT" != 'success' ]; then
            echo "::error::change detection did not succeed ($CHANGES_RESULT); refusing to report a pass"
            exit 1
          fi
          # All three ran and passed, or none ran. Any mix means something was cancelled or failed.
          case "$IMAGE_RESULT $BUILD_RESULT $E2E_RESULT" in
            'success success success') echo 'The frontend build and e2e ran and passed.' ;;
            'skipped skipped skipped') echo 'No frontend files changed; there was nothing to build.' ;;
            *) echo "::error::frontend results: image $IMAGE_RESULT, build $BUILD_RESULT, e2e $E2E_RESULT"; exit 1 ;;
          esac
