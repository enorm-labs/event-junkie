name: Build & Test Frontend

on:
  push:
    branches: [ main ]
    paths:
      - 'events-frontend/**'
      - '.github/workflows/build-frontend.yml'
  pull_request:
    branches: [ main ]
    # No `paths:` here (#494): `Build & Test (frontend)` is **required**, and a required check that never
    # runs stays Pending forever. The filtering lives in `detect-changes` below; the `push:` filter keeps
    # its paths.
  # Manual trigger, for an Actions incident that drops webhooks and leaves nothing to re-run. Ignores
  # the path filters: `gh workflow run build-frontend.yml --ref <branch>`.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Seconds, and no checkout: the file list comes from the API, so the required context below can be
  # unconditional while the build stays conditional.
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Decide whether the frontend is affected
        id: filter
        env:
          # Through `env:`, not interpolated: `${{ }}` inside `run:` is the template-injection shape zizmor rejects.
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # `push` is already path-filtered above, and a manual dispatch means "build it anyway".
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')"
          # An empty list means the API call went wrong, not that nothing changed. The gate refuses to pass
          # when detection did not succeed.
          if [ -z "$FILES" ]; then
            echo '::error::no changed files returned for this pull request'
            exit 1
          fi
          printf '%s\n' "$FILES" | sed 's/^/  /'
          if printf '%s\n' "$FILES" | grep -qE '^(events-frontend/|\.github/workflows/build-frontend\.yml$)'; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
          else
            echo 'relevant=false' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Frontend build
    needs: detect-changes
    if: needs.detect-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: events-frontend
    # **30, not 15, because 15 could not fit a cache-miss run — and that made the miss permanent.**
    # `actions/cache` writes only in its post-job step, so a timeout kills the job before anything is
    # saved, and the run reports `cancelled` rather than `failure`. Measured: a hit is ≈9 min, a miss
    # 17–23 min (a 519–875s Playwright install). A miss is a normal event — every Playwright bump changes
    # the key — so the budget has to fit one, while still failing fast against the 6h default.
    timeout-minutes: 30

    steps:
      # The whole history and every tag: the image label reads the version from them (ADR-032).
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24' # should match the version specified in .nvmrc
          cache: 'npm'
          cache-dependency-path: events-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Every production npm dependency against config/allowed-licenses-npm.json. `./gradlew checkLicense`
      # sees only the JVM tree, and dependency-review looks only at newly introduced dependencies.
      - name: Check dependency licences
        run: npm run check:licenses

      - name: Build
        run: npm run build

      - name: Run unit tests with coverage
        run: npm run test:unit:coverage -- --reporter=default

      - name: Post coverage to Job Summary
        if: success() || failure()
        run: |
          echo "## 📊 Test Coverage (Vitest/V8)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/coverage-summary.json ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            node -e "
              const r = require('./coverage/coverage-summary.json').total;
              const fmt = (m) => m.pct + '%';
              console.log('Lines:      ' + fmt(r.lines));
              console.log('Statements: ' + fmt(r.statements));
              console.log('Functions:  ' + fmt(r.functions));
              console.log('Branches:   ' + fmt(r.branches));
            " >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "_No coverage report generated._" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Get Playwright version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.PLAYWRIGHT_VERSION }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright system dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Run e2e tests
        run: npm run test:e2e

      # An axe violation is a rule id plus a CSS selector; the HTML report carries the DOM snapshot and the
      # trace that make it actionable. Failure only: a green run's report is noise, and these are not small.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            events-frontend/playwright-report/
            events-frontend/test-results/
          retention-days: 7

      # Build the container image and do not push it: this runs on fork pull requests, and pushing belongs
      # to release.yml, which builds the same image on every push to `main` (#264). `npm run build` above
      # produced `dist/`, which the Dockerfile copies — no builder stage. The version comes from
      # `scripts/version.sh`, so the label matches the tag release.yml would publish; package.json holds
      # `0.0.0` (ADR-032).
      - name: Read the version
        id: version
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        run: echo "value=$(scripts/version.sh compute)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: github.event_name == 'pull_request'
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      # Both platforms build with no QEMU step: the Dockerfile does no build work in a `RUN`, and its one
      # `apk upgrade` runs under the runner's emulation. `type=cacheonly` because a multi-platform image
      # cannot be loaded, and one platform would leave arm64 — the Hetzner nodes' architecture — unbuilt.
      - name: Build the frontend image (amd64 + arm64, no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: events-frontend
          file: events-frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=cacheonly
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}

      # The meta-injection sidecar (#287): `npm run build` emitted `dist-injector/` beside `dist/`.
      - name: Build the injector image (amd64 + arm64, no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: events-frontend
          file: events-frontend/Dockerfile.injector
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=cacheonly
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}

  # **The required context, and the only job here that always runs.** A conditional job cannot be a
  # required check — GitHub leaves an unreported context Pending forever (#443, #494) — so the
  # requirement sits on a job that always reports and fails when the build failed, without relying on
  # "a skipped job counts as success".
  gate:
    name: Build & Test (frontend)
    needs: [ detect-changes, build ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the build's result
        env:
          CHANGES_RESULT: ${{ needs.detect-changes.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          echo "detect-changes: $CHANGES_RESULT · build: $BUILD_RESULT"
          # A failed detection must not be reported as a pass — it would silently gate nothing.
          if [ "$CHANGES_RESULT" != 'success' ]; then
            echo "::error::change detection did not succeed ($CHANGES_RESULT); refusing to report a pass"
            exit 1
          fi
          case "$BUILD_RESULT" in
            success) echo 'The frontend build ran and passed.' ;;
            skipped) echo 'No frontend files changed; there was nothing to build.' ;;
            *)       echo "::error::frontend build result: $BUILD_RESULT"; exit 1 ;;
          esac
