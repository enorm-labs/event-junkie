name: Build & Test Frontend

on:
  push:
    branches: [ main ]
    paths:
      - 'events-frontend/**'
      - '.github/workflows/build-frontend.yml'
  pull_request:
    branches: [ main ]
    # No `paths:` here, deliberately, since #494. `Build & Test (frontend)` is **required** on the
    # `main` ruleset, and a required check that never runs stays Pending forever, deadlocking every
    # pull request that happens not to touch these paths. The filtering moved to the `detect-changes`
    # job below, which is what keeps a documentation-only pull request from paying for a 10-minute
    # build: the work is skipped, the context still reports. The `push:` filter above keeps its
    # paths — nothing requires those runs.
  # Manual trigger, for when the automatic ones cannot be relied on: an Actions incident can drop
  # most webhooks, and pull requests then merge with no run ever created — `gh run rerun` is no help
  # when there is no run to re-run. Ignores the path filters above, so it
  # also serves "build this ref anyway". Pick the branch to run it on from the Actions tab, or
  # `gh workflow run build-frontend.yml --ref <branch>`.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Seconds, and no checkout: the pull request's file list comes from the API. This exists so the
  # required context below can be unconditional while the 10-minute build stays conditional.
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Decide whether the frontend is affected
        id: filter
        env:
          # Read through `env:` rather than interpolated into the script — a `${{ }}` expression
          # expanded inside `run:` is the template-injection shape zizmor rejects.
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # `push` is already path-filtered above, and a manual dispatch means "build it anyway".
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')"
          # An empty list means the API call went wrong, not that nothing changed. Failing here is
          # correct: the gate below refuses to report a pass when detection did not succeed, so the
          # pull request blocks visibly instead of skipping a build that was needed.
          if [ -z "$FILES" ]; then
            echo '::error::no changed files returned for this pull request'
            exit 1
          fi
          printf '%s\n' "$FILES" | sed 's/^/  /'
          if printf '%s\n' "$FILES" | grep -qE '^(events-frontend/|\.github/workflows/build-frontend\.yml$)'; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
          else
            echo 'relevant=false' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Frontend build
    needs: detect-changes
    if: needs.detect-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: events-frontend
    # Fail fast instead of hanging for the GitHub default of 6h when the Playwright
    # system-dependency install stalls on a slow apt mirror.
    #
    # **30, not 15, because 15 could not fit a cache-miss run — and that made the miss permanent.**
    # `actions/cache` only writes in its post-job step, so a timeout kills the job before anything is
    # saved: the miss recreates the conditions for the next miss. A run killed this way reports
    # `cancelled` rather than `failure`, which is why it does not look like what it is.
    #
    # The arithmetic, measured rather than guessed:
    #
    #     cache hit    6s cache + 30s install-deps + 507s e2e   ≈ 9 min
    #     cache miss   519-875s install          + 507s e2e     ≈ 17-23 min
    #
    # A miss is a normal event — every Playwright bump changes the cache key — so the budget has to
    # accommodate one. 30 leaves headroom above the worst observed miss and still fails fast against
    # the 6h default this comment was originally about.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24' # should match the version specified in .nvmrc
          cache: 'npm'
          cache-dependency-path: events-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Audits every production npm dependency against config/allowed-licenses-npm.json. The
      # backend's `./gradlew checkLicense` only ever sees the JVM tree — the frontend is not a
      # Gradle subproject — so without this the several hundred npm packages were covered only by
      # dependency-review, which looks at newly introduced dependencies and never the existing tree.
      - name: Check dependency licences
        run: npm run check:licenses

      - name: Build
        run: npm run build

      - name: Run unit tests with coverage
        run: npm run test:unit:coverage -- --reporter=default

      - name: Post coverage to Job Summary
        if: success() || failure()
        run: |
          echo "## 📊 Test Coverage (Vitest/V8)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/coverage-summary.json ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            node -e "
              const r = require('./coverage/coverage-summary.json').total;
              const fmt = (m) => m.pct + '%';
              console.log('Lines:      ' + fmt(r.lines));
              console.log('Statements: ' + fmt(r.statements));
              console.log('Functions:  ' + fmt(r.functions));
              console.log('Branches:   ' + fmt(r.branches));
            " >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "_No coverage report generated._" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Get Playwright version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.PLAYWRIGHT_VERSION }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright system dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Run e2e tests
        run: npm run test:e2e

      # Without this the report exists only inside the runner. An axe violation is reported as a
      # rule id plus a CSS selector, which is enough to know something broke and not enough to see
      # what — the HTML report carries the DOM snapshot and the trace that make it actionable.
      # Failure only: a green run's report is noise, and these artifacts are not small.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            events-frontend/playwright-report/
            events-frontend/test-results/
          retention-days: 7

      # Build the container image, and deliberately do not push it. This workflow runs on every
      # pull request, including from forks — publishing here would put an image built from
      # unreviewed code into GHCR. Pushing belongs to release.yml.
      #
      # `npm run build` above has already produced events-frontend/dist, which is what the image
      # copies: the Dockerfile has no builder stage, so there is no second, uncached build.
      #
      # Pull requests only, since #264: release.yml builds and pushes this same image on every push
      # to `main`, so building it here too would be twice the work for the same answer.
      #
      # The version comes from `scripts/version.sh` rather than package.json, so the label matches
      # the tag release.yml would publish — package.json's number is a mirror of `gradle.properties`,
      # not a source (the check that keeps them equal is `scripts/version.sh check`).
      - name: Read the version
        id: version
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        run: echo "value=$(scripts/version.sh compute)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: github.event_name == 'pull_request'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Both platforms genuinely build, with no QEMU, because the Dockerfile contains no `RUN` —
      # `dist/` is identical on amd64 and arm64. `type=cacheonly` because a multi-platform image
      # cannot be loaded into the local daemon, and building one platform would leave arm64
      # unbuilt — the architecture the Hetzner nodes run (#424).
      - name: Build the frontend image (amd64 + arm64, no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: events-frontend
          file: events-frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=cacheonly
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}

  # **This is the required context, and it is the only job here that always runs.** The build above
  # is conditional, and a conditional job cannot be a required check: GitHub leaves an unreported
  # context Pending forever, which reads as a hung check rather than a misconfiguration (#443, #494).
  # So the requirement is placed on a job that always reports, and which fails when the build failed.
  #
  # Deliberately not relying on "a skipped job counts as success" — GitHub documents that, but
  # AGENTS.md recorded those semantics as unverified, and this shape does not need them to hold.
  gate:
    name: Build & Test (frontend)
    needs: [ detect-changes, build ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the build's result
        env:
          CHANGES_RESULT: ${{ needs.detect-changes.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          echo "detect-changes: $CHANGES_RESULT · build: $BUILD_RESULT"
          # A failed detection must not be reported as a pass — it would silently gate nothing.
          if [ "$CHANGES_RESULT" != 'success' ]; then
            echo "::error::change detection did not succeed ($CHANGES_RESULT); refusing to report a pass"
            exit 1
          fi
          case "$BUILD_RESULT" in
            success) echo 'The frontend build ran and passed.' ;;
            skipped) echo 'No frontend files changed; there was nothing to build.' ;;
            *)       echo "::error::frontend build result: $BUILD_RESULT"; exit 1 ;;
          esac
