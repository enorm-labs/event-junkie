# Opens an issue before a credential expires, so the deadline stops depending on anyone remembering.
#
# #565 put a fine-grained PAT in the staging cluster, and it is the first credential here with an
# expiry date at all — the Hetzner and S3 keys do not expire, and the age key is a file. Writing the
# date into `docs/CREDENTIALS.md` was the documented-as-quarterly half of the answer; this is the
# other half, and `restore-drill-reminder.yml`'s header already argues the general case:
#
#   **Documented as quarterly is not a schedule** — this is the class of task that stops happening
#   without anyone deciding to stop it, and its failure mode is invisible until the day it matters.
#
# **The failure mode here is worse than invisible, it is misleading.** When the dispatch PAT lapses,
# Flux's `repository_dispatch` is rejected inside the cluster, notification-controller logs it, and
# nothing on GitHub says a word: the Environments tab simply stops gaining entries, which reads
# exactly like "no deploys lately". There is no red mark to notice.
#
# **Why the dates live here rather than being read from GitHub.** `GET /orgs/{org}/personal-access-tokens`
# would report every fine-grained PAT's `token_expires_at`, which would make this true by construction
# rather than by maintenance — the property #467 is chasing for the architecture diagram. It needs
# **`admin:org`**, and `GITHUB_TOKEN` is repository-scoped and cannot ever hold it. So that route
# monitors token expiry using a token that itself expires and is *more* powerful than the one being
# watched, which is a circle worth refusing rather than breaking (#569). The table below is dumber and
# has no credential at all.
#
# **This does not rotate anything**, deliberately. A workflow able to mint and install credentials is
# a far larger blast radius than this problem justifies. It opens an issue; a human rotates.
name: Credential Expiry Reminder

on:
  schedule:
    # Weekly, Mondays, off-the-hour for the reason the other scheduled workflows give: the top of the
    # hour is a stampede on shared runners. Weekly rather than daily because the lead time below is
    # 30 days — checking 30 times inside one warning window buys nothing, and every run that finds
    # nothing is a run whose only output is noise.
    - cron: '38 6 * * 1'
  # The only way to see it work without waiting for a Monday, and the only way to produce the first
  # issue: GitHub offers a manual trigger only for workflows already on the default branch.
  workflow_dispatch:

permissions:
  contents: read
  # Creating the issue, and listing to find one that already exists.
  issues: write

# A dispatch racing the schedule must not produce two issues. `cancel-in-progress: false` because the
# second run still has to check whether the first one created it.
concurrency:
  group: credential-expiry-reminder
  cancel-in-progress: false

jobs:
  check:
    name: Check credential expiry
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Open an issue for anything expiring soon
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # An assignee rather than a mention, for the reason restore-drill-reminder.yml gives: an
          # unassigned issue on a board is nobody's.
          CREDENTIAL_OWNER: enorm
        with:
          script: |
            // ADDING A CREDENTIAL IS ONE LINE HERE, and one row in docs/CREDENTIALS.md §2. The two
            // must agree, which is duplication this repository already accepts for pinned tool
            // versions ("this pin appears in three workflows — they must move together"). The
            // alternative — parsing the dates out of a Markdown table — makes a docs reformat able
            // to silently switch the gate off, which is a worse failure than a stale second copy.
            //
            // `where` and `breaks` are not decoration: they are what the issue body says, and the
            // point of a reminder is that it can be acted on without first reconstructing what the
            // credential was for.
            const CREDENTIALS = [
              {
                name: 'event-junkie-staging-github-dispatch',
                expires: '2027-08-20',
                doc: 'docs/CREDENTIALS.md #15',
                what: 'Fine-grained GitHub PAT, **Contents: Read and write** on this repository only.',
                where: 'Kubernetes Secret `github-dispatch` in `flux-system` on the **staging** cluster, hand-made.',
                rotate: 'kubectl --context event-junkie-staging create secret generic github-dispatch \\\n' +
                  '  -n flux-system --from-literal=token="<the new PAT>" --dry-run=client -o yaml \\\n' +
                  '  | kubectl --context event-junkie-staging apply -f -',
                breaks: 'Flux\'s `repository_dispatch` is rejected and the Environments tab stops gaining entries. ' +
                  'Nothing on GitHub reports it — the silence is indistinguishable from "no deploys lately".',
              },
            ];

            // 30 days. Long enough to rotate without pressure, short enough that the issue is still
            // the current thing when it opens rather than something that has been sitting for months.
            const LEAD_DAYS = 30;
            const MS_PER_DAY = 86_400_000;

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const blob = `https://github.com/${owner}/${repo}/blob/main`;

            // Midnight UTC today, so "days remaining" is a whole number and does not wobble with the
            // time the schedule happens to fire.
            const today = new Date();
            const todayUTC = Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), today.getUTCDate());

            // Listing rather than the search API, and deliberately so: search is an index and the
            // index is eventually consistent, so an issue created seconds ago can be absent from it —
            // which is exactly the case this guard exists for. `listForRepo` returns pull requests
            // too, since they are issues to the API, and a same-titled PR would otherwise suppress
            // the reminder entirely.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const openIssues = open.filter((issue) => !issue.pull_request);

            const opened = [];
            const skipped = [];

            for (const credential of CREDENTIALS) {
              const expiryUTC = Date.parse(`${credential.expires}T00:00:00Z`);
              if (Number.isNaN(expiryUTC)) {
                core.setFailed(`${credential.name} has an unparseable expiry ${JSON.stringify(credential.expires)} — expected YYYY-MM-DD.`);
                return;
              }

              const days = Math.round((expiryUTC - todayUTC) / MS_PER_DAY);
              if (days > LEAD_DAYS) {
                skipped.push(`${credential.name} — ${days} days left`);
                continue;
              }

              // Expired and expiring are different obligations and get different titles, so the
              // second does not quietly satisfy the first: an issue opened at 30-days-left stays
              // open and on-title after the date passes, and closing it would look like the work
              // was done. A separate title makes the escalation visible on the board.
              const expired = days < 0;
              const title = expired
                ? `Credential EXPIRED — ${credential.name} (${credential.expires})`
                : `Rotate ${credential.name} — expires ${credential.expires}`;

              const existing = openIssues.find((issue) => issue.title === title);
              if (existing) {
                skipped.push(`${credential.name} — already open as #${existing.number}`);
                continue;
              }

              const lede = expired
                ? `**This credential expired ${Math.abs(days)} day(s) ago, on ${credential.expires}.** Whatever depends on it stopped working then.`
                : `**${credential.name} expires in ${days} day(s)**, on ${credential.expires}.`;

              const body = [
                `> Opened automatically by [\`credential-expiry-reminder.yml\`](${blob}/.github/workflows/credential-expiry-reminder.yml) ` +
                  '([#569](https://github.com/enorm-labs/event-junkie/issues/569)). A credential nobody is warned about is one that ' +
                  'fails on its own schedule.',
                '',
                lede,
                '',
                '## What it is',
                '',
                credential.what,
                '',
                `**Where it lives:** ${credential.where}`,
                '',
                '## What breaks, and why you will not notice',
                '',
                credential.breaks,
                '',
                '## Rotate it',
                '',
                'Create the replacement first, install it, then revoke the old one — in that order, so there is no window with neither.',
                '',
                '```sh',
                credential.rotate,
                '```',
                '',
                '## Done when',
                '',
                '- [ ] A new token exists, with the same scope and no more',
                '- [ ] The cluster Secret carries the new value',
                '- [ ] The old token is revoked',
                `- [ ] The new expiry date is written into [\`${credential.doc}\`](${blob}/docs/CREDENTIALS.md) **and into the \`CREDENTIALS\` table in this workflow** — they must agree`,
                '- [ ] A deploy has been observed reaching the Environments tab since the rotation',
              ].join('\n');

              const { data: issue } = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                // Intrinsic properties of the work, which is what labels carry here. Status and
                // Priority are project fields and are set on the board.
                labels: ['area:security', 'size:S'],
                assignees: [process.env.CREDENTIAL_OWNER],
                // No milestone, deliberately: milestones here are release gates (v0.3, v1.0), and a
                // recurring operational obligation outlives all of them and belongs to none.
                type: 'Task',
              });

              // The board cannot be written from here — `GITHUB_TOKEN` cannot write to an
              // *organisation* project, and a token that could rewrite the whole board is more than
              // a reminder is worth holding a credential for. The board's own "Auto-add to project"
              // workflow is enabled to cover that, and it misses items at roughly 4% (#1092), so
              // check the card after a run. See restore-drill-reminder.yml, whose own two issues are
              // among the ones it missed.
              core.notice(`Opened #${issue.number} — ${title}`);
              opened.push(`[#${issue.number}](${issue.html_url}) — ${title}`);
            }

            const summary = core.summary.addHeading('🔑 Credential expiry', 2);
            if (opened.length > 0) {
              summary.addRaw('Opened:').addList(opened);
            } else {
              summary.addRaw('Nothing expiring within ' + LEAD_DAYS + ' days.');
            }
            if (skipped.length > 0) {
              summary.addRaw('Checked:').addList(skipped);
            }
            await summary.write();
