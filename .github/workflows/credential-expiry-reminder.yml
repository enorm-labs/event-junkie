# Opens an issue before a credential expires. The dispatch PAT (#565) is the first credential here
# with an expiry, and **the failure mode is worse than invisible, it is misleading**: when it lapses,
# the Environments tab simply stops gaining entries, which reads as "no deploys lately".
#
# **The dates live here rather than being read from GitHub.** `GET /orgs/{org}/personal-access-tokens`
# would make this true by construction, and it needs `admin:org`, which `GITHUB_TOKEN` cannot hold —
# monitoring token expiry with a stronger expiring token is a circle worth refusing (#569). The table
# below has no credential at all. **This rotates nothing**: a human rotates.
#
# **`dispatch-records` watches the same PAT for the failure that has no date** (#1003): a token that is
# revoked, regenerated read-only or re-scoped. Actions cannot hold the PAT (ADR-016), so the job reads
# the effect instead: a publish that no deployment record followed.
name: Credential Expiry Reminder

on:
  schedule:
    # Weekly, Mondays, off-the-hour. Weekly because the lead time is 30 days; every run that finds
    # nothing is noise.
    - cron: '38 6 * * 1'
    # Daily, for `dispatch-records`: a silent token is a regression window, and #872 ran nine days.
    - cron: '17 7 * * *'
  # The only way to see it work without waiting for a Monday, and to produce the first issue.
  workflow_dispatch:
    inputs:
      grace_minutes:
        # Staging records a publish in about a minute, production in about seven.
        description: How long after a publish `dispatch-records` expects its deployment record
        type: number
        default: 120

permissions:
  contents: read

# A dispatch racing the schedule must not produce two issues; the second still checks.
concurrency:
  group: credential-expiry-reminder
  cancel-in-progress: false

jobs:
  check:
    name: Check credential expiry
    if: github.event_name != 'schedule' || github.event.schedule == '38 6 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Creating the issue, and listing to find one that already exists.
      issues: write

    steps:
      - name: Open an issue for anything expiring soon
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # An assignee rather than a mention: an unassigned issue on a board is nobody's.
          CREDENTIAL_OWNER: enorm
        with:
          script: |
            // ADDING A CREDENTIAL IS ONE LINE HERE, and one row in docs/CREDENTIALS.md §2; the two must agree.
            // Parsing the dates out of a Markdown table would let a docs reformat switch the gate off silently.
            // `where` and `breaks` are what the issue body says, so it can be acted on without reconstruction.
            const CREDENTIALS = [
              {
                name: 'event-junkie-staging-github-dispatch',
                expires: '2027-08-20',
                doc: 'docs/CREDENTIALS.md #15',
                what: 'Fine-grained GitHub PAT, **Contents: Read and write** on this repository only.',
                where: 'Kubernetes Secret `github-dispatch` in `flux-system` on the **staging** cluster, hand-made.',
                rotate: 'kubectl --context event-junkie-staging create secret generic github-dispatch \\\n' +
                  '  -n flux-system --from-literal=token="<the new PAT>" --dry-run=client -o yaml \\\n' +
                  '  | kubectl --context event-junkie-staging apply -f -',
                breaks: 'Flux\'s `repository_dispatch` is rejected and the Environments tab stops gaining entries. ' +
                  'Nothing on GitHub reports it — the silence is indistinguishable from "no deploys lately".',
              },
            ];

            // 30 days: long enough to rotate without pressure, short enough that the issue is still current.
            const LEAD_DAYS = 30;
            const MS_PER_DAY = 86_400_000;

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const blob = `https://github.com/${owner}/${repo}/blob/main`;

            // Midnight UTC, so "days remaining" is a whole number.
            const today = new Date();
            const todayUTC = Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), today.getUTCDate());

            // Listing, not search: the search index is eventually consistent. `listForRepo` returns pull requests
            // too, and a same-titled one would suppress the reminder.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const openIssues = open.filter((issue) => !issue.pull_request);

            const opened = [];
            const skipped = [];

            for (const credential of CREDENTIALS) {
              const expiryUTC = Date.parse(`${credential.expires}T00:00:00Z`);
              if (Number.isNaN(expiryUTC)) {
                core.setFailed(`${credential.name} has an unparseable expiry ${JSON.stringify(credential.expires)} — expected YYYY-MM-DD.`);
                return;
              }

              const days = Math.round((expiryUTC - todayUTC) / MS_PER_DAY);
              if (days > LEAD_DAYS) {
                skipped.push(`${credential.name} — ${days} days left`);
                continue;
              }

              // Expired and expiring are different obligations with different titles, so the second does not
              // quietly satisfy the first and the escalation is visible on the board.
              const expired = days < 0;
              const title = expired
                ? `Credential EXPIRED — ${credential.name} (${credential.expires})`
                : `Rotate ${credential.name} — expires ${credential.expires}`;

              const existing = openIssues.find((issue) => issue.title === title);
              if (existing) {
                skipped.push(`${credential.name} — already open as #${existing.number}`);
                continue;
              }

              const lede = expired
                ? `**This credential expired ${Math.abs(days)} day(s) ago, on ${credential.expires}.** Whatever depends on it stopped working then.`
                : `**${credential.name} expires in ${days} day(s)**, on ${credential.expires}.`;

              const body = [
                `> Opened automatically by [\`credential-expiry-reminder.yml\`](${blob}/.github/workflows/credential-expiry-reminder.yml) ` +
                  '([#569](https://github.com/enorm-labs/event-junkie/issues/569)). A credential nobody is warned about is one that ' +
                  'fails on its own schedule.',
                '',
                lede,
                '',
                '## What it is',
                '',
                credential.what,
                '',
                `**Where it lives:** ${credential.where}`,
                '',
                '## What breaks, and why you will not notice',
                '',
                credential.breaks,
                '',
                '## Rotate it',
                '',
                'Create the replacement first, install it, then revoke the old one — in that order, so there is no window with neither.',
                '',
                '```sh',
                credential.rotate,
                '```',
                '',
                '## Done when',
                '',
                '- [ ] A new token exists, with the same scope and no more',
                '- [ ] The cluster Secret carries the new value',
                '- [ ] The old token is revoked',
                `- [ ] The new expiry date is written into [\`${credential.doc}\`](${blob}/docs/CREDENTIALS.md) **and into the \`CREDENTIALS\` table in this workflow** — they must agree`,
                '- [ ] A deploy has been observed reaching the Environments tab since the rotation',
              ].join('\n');

              const { data: issue } = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                // Intrinsic properties of the work; Status and Priority are board fields.
                labels: ['area:security', 'size:S'],
                assignees: [process.env.CREDENTIAL_OWNER],
                // No milestone: a recurring operational obligation outlives every release gate.
                type: 'Task',
              });

              // The board cannot be written from here (`GITHUB_TOKEN` cannot write to an organisation project), and
              // "Auto-add to project" misses items at roughly 4% (#1092). Check the card after a run.
              core.notice(`Opened #${issue.number} — ${title}`);
              opened.push(`[#${issue.number}](${issue.html_url}) — ${title}`);
            }

            const summary = core.summary.addHeading('🔑 Credential expiry', 2);
            if (opened.length > 0) {
              summary.addRaw('Opened:').addList(opened);
            } else {
              summary.addRaw('Nothing expiring within ' + LEAD_DAYS + ' days.');
            }
            if (skipped.length > 0) {
              summary.addRaw('Checked:').addList(skipped);
            }
            await summary.write();

  # Every deployment record arrives through the cluster's `github-dispatch` PAT, and so does
  # `flux-source-failure.yml`. A publish with no record after it means the dispatch path is silent,
  # whatever the cause. `Provider` has no status to watch instead (#1003).
  dispatch-records:
    name: Check Flux still records deployments
    if: github.event_name != 'schedule' || github.event.schedule == '17 7 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      deployments: read
      issues: write

    steps:
      - name: Open an issue when a publish has no deployment record
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CREDENTIAL_OWNER: enorm
          # Empty on a schedule; a dispatch can shorten it for a drill.
          GRACE_MINUTES: ${{ inputs.grace_minutes || 120 }}
        with:
          script: |
            const grace = Number(process.env.GRACE_MINUTES);
            if (!Number.isFinite(grace) || grace < 0) {
              core.setFailed(`grace_minutes is ${JSON.stringify(process.env.GRACE_MINUTES)}, expected a number of minutes.`);
              return;
            }

            // What each cluster pulls: staging every snapshot from `main`, production every release.
            const ENVIRONMENTS = [
              { environment: 'staging', filter: { event: 'push', branch: 'main' }, token: 'event-junkie-staging-github-dispatch', doc: '#15' },
              { environment: 'production', filter: { event: 'release' }, token: 'event-junkie-production-github-dispatch', doc: '#15a' },
            ];

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const site = `https://github.com/${owner}/${repo}`;
            const now = Date.now();

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const openIssues = open.filter((issue) => !issue.pull_request);

            const overdue = (run) => now - Date.parse(run.updated_at) >= grace * 60_000;
            const newestFirst = (a, b) => Date.parse(b.updated_at) - Date.parse(a.updated_at);
            const greenRuns = async (params) => (await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'release.yml', status: 'success', ...params,
            })).data.workflow_runs;

            // The newest green publish whose record is overdue. A newer one is still inside its window.
            // The run list's order is not stable: one read put a day-old run first and hid a silent
            // dispatch (#2796). So staging walks main's commits, and production sorts what it reads.
            async function overduePublish(filter) {
              if (filter.event === 'release') {
                return (await greenRuns({ ...filter, per_page: 30 })).sort(newestFirst).find(overdue);
              }
              const { data: commits } = await github.rest.repos.listCommits({ owner, repo, sha: filter.branch, per_page: 20 });
              for (const commit of commits) {
                const run = (await greenRuns({ ...filter, head_sha: commit.sha, per_page: 5 })).sort(newestFirst).find(overdue);
                if (run) return run;
              }
              return undefined;
            }

            const lines = [];
            for (const { environment, filter, token, doc } of ENVIRONMENTS) {
              const title = `No deployment record from ${environment} — Flux's GitHub dispatch may be failing`;
              const existing = openIssues.find((issue) => issue.title === title);

              const publish = await overduePublish(filter);
              if (!publish) {
                lines.push(`${environment} — no green publish older than ${grace} minutes among the recent ones`);
                continue;
              }
              const published = Date.parse(publish.updated_at);

              // A record for that commit, or any record created after the publish: either proves a dispatch
              // reached GitHub. The second covers a publish that Flux skipped for a newer one.
              const { data: forCommit } = await github.rest.repos.listDeployments({
                owner, repo, environment, sha: publish.head_sha, per_page: 1,
              });
              const { data: newest } = await github.rest.repos.listDeployments({
                owner, repo, environment, per_page: 1,
              });
              const latest = newest[0];
              const recorded = forCommit.length > 0 || (latest !== undefined && Date.parse(latest.created_at) >= published);
              const label = `${publish.head_sha.slice(0, 7)} (${publish.event === 'release' ? publish.head_branch : 'snapshot'})`;

              if (recorded) {
                lines.push(`${environment} — ${label} published ${publish.updated_at}, recorded`);
                if (existing) {
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: existing.number,
                    body: `[This run](${site}/actions/runs/${context.runId}) found a deployment record after the publish of ${label}. The dispatch path works again, so this closes.`,
                  });
                  await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed', state_reason: 'completed' });
                  core.notice(`Closed #${existing.number} — ${environment} records deployments again`);
                }
                continue;
              }

              lines.push(`**${environment} — ${label} published ${publish.updated_at}, no record since**`);
              if (existing) {
                lines.push(`${environment} — already open as #${existing.number}`);
                continue;
              }

              const body = [
                `> Opened automatically by [\`credential-expiry-reminder.yml\`](${site}/blob/main/.github/workflows/credential-expiry-reminder.yml) ` +
                  `([#1003](${site}/issues/1003)). The same job closes it once a record appears.`,
                '',
                `**[\`release.yml\`](${publish.html_url}) published ${label} at ${publish.updated_at}, and ${environment} has written no GitHub deployment since.** ` +
                  `Staging usually records a publish within minutes, production within about ten. The newest ${environment} record is ` +
                  (latest ? `${latest.sha.slice(0, 7)} from ${latest.created_at}.` : 'missing altogether.'),
                '',
                '## What can cause it',
                '',
                `1. **The \`github-dispatch\` PAT** (\`${token}\`, [CREDENTIALS.md ${doc}](${site}/blob/main/docs/CREDENTIALS.md)) was revoked, regenerated without ` +
                  '**Contents: write**, or expired. Flux then logs a rejected dispatch inside the cluster, and nothing else shows it. ' +
                  '`flux-source-failure.yml` uses the same token, so a failing source is silent too.',
                `2. **\`deployment-status.yml\` failed** on the dispatch. Its [runs](${site}/actions/workflows/deployment-status.yml) show it.`,
                '3. **Flux did not roll out**: suspended, or stuck on its source. The cluster is then still on an older version, and `scripts/deployed-versions.sh` shows which.',
                '',
                '## Check',
                '',
                `Run the write probe in [CLUSTER_BOOTSTRAP.md § Prove the dispatch token's scope](${site}/blob/main/docs/ops/CLUSTER_BOOTSTRAP.md#prove-the-dispatch-tokens-scope-because-existence-is-not-the-check) ` +
                  `against ${environment}. \`204\` clears the token. \`401\` or \`403\` is the token.`,
                '',
                '## Done when',
                '',
                '- [ ] The cause is known and fixed',
                `- [ ] A deployment record for ${environment} has appeared since the fix`,
              ].join('\n');

              const { data: issue } = await github.rest.issues.create({
                owner, repo, title, body,
                labels: ['area:infra', 'size:S'],
                assignees: [process.env.CREDENTIAL_OWNER],
                type: 'Task',
              });
              core.notice(`Opened #${issue.number} — ${title}`);
              lines.push(`${environment} — opened [#${issue.number}](${issue.html_url})`);
            }

            await core.summary
              .addHeading('🛰️ Flux deployment records', 2)
              .addRaw(`A publish older than ${grace} minutes needs a deployment record after it.`)
              .addList(lines)
              .write();
