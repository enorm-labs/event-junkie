# Opens an issue before a credential expires. The dispatch PAT (#565) is the first credential here
# with an expiry, and **the failure mode is worse than invisible, it is misleading**: when it lapses,
# the Environments tab simply stops gaining entries, which reads as "no deploys lately".
#
# **The dates live here rather than being read from GitHub.** `GET /orgs/{org}/personal-access-tokens`
# would make this true by construction, and it needs `admin:org`, which `GITHUB_TOKEN` cannot hold —
# monitoring token expiry with a stronger expiring token is a circle worth refusing (#569). The table
# below has no credential at all. **This rotates nothing**: a human rotates.
name: Credential Expiry Reminder

on:
  schedule:
    # Weekly, Mondays, off-the-hour. Weekly because the lead time is 30 days; every run that finds
    # nothing is noise.
    - cron: '38 6 * * 1'
  # The only way to see it work without waiting for a Monday, and to produce the first issue.
  workflow_dispatch:

permissions:
  contents: read
  # Creating the issue, and listing to find one that already exists.
  issues: write

# A dispatch racing the schedule must not produce two issues; the second still checks.
concurrency:
  group: credential-expiry-reminder
  cancel-in-progress: false

jobs:
  check:
    name: Check credential expiry
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Open an issue for anything expiring soon
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # An assignee rather than a mention: an unassigned issue on a board is nobody's.
          CREDENTIAL_OWNER: enorm
        with:
          script: |
            // ADDING A CREDENTIAL IS ONE LINE HERE, and one row in docs/CREDENTIALS.md §2; the two must agree.
            // Parsing the dates out of a Markdown table would let a docs reformat switch the gate off silently.
            // `where` and `breaks` are what the issue body says, so it can be acted on without reconstruction.
            const CREDENTIALS = [
              {
                name: 'event-junkie-staging-github-dispatch',
                expires: '2027-08-20',
                doc: 'docs/CREDENTIALS.md #15',
                what: 'Fine-grained GitHub PAT, **Contents: Read and write** on this repository only.',
                where: 'Kubernetes Secret `github-dispatch` in `flux-system` on the **staging** cluster, hand-made.',
                rotate: 'kubectl --context event-junkie-staging create secret generic github-dispatch \\\n' +
                  '  -n flux-system --from-literal=token="<the new PAT>" --dry-run=client -o yaml \\\n' +
                  '  | kubectl --context event-junkie-staging apply -f -',
                breaks: 'Flux\'s `repository_dispatch` is rejected and the Environments tab stops gaining entries. ' +
                  'Nothing on GitHub reports it — the silence is indistinguishable from "no deploys lately".',
              },
            ];

            // 30 days: long enough to rotate without pressure, short enough that the issue is still current.
            const LEAD_DAYS = 30;
            const MS_PER_DAY = 86_400_000;

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const blob = `https://github.com/${owner}/${repo}/blob/main`;

            // Midnight UTC, so "days remaining" is a whole number.
            const today = new Date();
            const todayUTC = Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), today.getUTCDate());

            // Listing, not search: the search index is eventually consistent. `listForRepo` returns pull requests
            // too, and a same-titled one would suppress the reminder.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const openIssues = open.filter((issue) => !issue.pull_request);

            const opened = [];
            const skipped = [];

            for (const credential of CREDENTIALS) {
              const expiryUTC = Date.parse(`${credential.expires}T00:00:00Z`);
              if (Number.isNaN(expiryUTC)) {
                core.setFailed(`${credential.name} has an unparseable expiry ${JSON.stringify(credential.expires)} — expected YYYY-MM-DD.`);
                return;
              }

              const days = Math.round((expiryUTC - todayUTC) / MS_PER_DAY);
              if (days > LEAD_DAYS) {
                skipped.push(`${credential.name} — ${days} days left`);
                continue;
              }

              // Expired and expiring are different obligations with different titles, so the second does not
              // quietly satisfy the first and the escalation is visible on the board.
              const expired = days < 0;
              const title = expired
                ? `Credential EXPIRED — ${credential.name} (${credential.expires})`
                : `Rotate ${credential.name} — expires ${credential.expires}`;

              const existing = openIssues.find((issue) => issue.title === title);
              if (existing) {
                skipped.push(`${credential.name} — already open as #${existing.number}`);
                continue;
              }

              const lede = expired
                ? `**This credential expired ${Math.abs(days)} day(s) ago, on ${credential.expires}.** Whatever depends on it stopped working then.`
                : `**${credential.name} expires in ${days} day(s)**, on ${credential.expires}.`;

              const body = [
                `> Opened automatically by [\`credential-expiry-reminder.yml\`](${blob}/.github/workflows/credential-expiry-reminder.yml) ` +
                  '([#569](https://github.com/enorm-labs/event-junkie/issues/569)). A credential nobody is warned about is one that ' +
                  'fails on its own schedule.',
                '',
                lede,
                '',
                '## What it is',
                '',
                credential.what,
                '',
                `**Where it lives:** ${credential.where}`,
                '',
                '## What breaks, and why you will not notice',
                '',
                credential.breaks,
                '',
                '## Rotate it',
                '',
                'Create the replacement first, install it, then revoke the old one — in that order, so there is no window with neither.',
                '',
                '```sh',
                credential.rotate,
                '```',
                '',
                '## Done when',
                '',
                '- [ ] A new token exists, with the same scope and no more',
                '- [ ] The cluster Secret carries the new value',
                '- [ ] The old token is revoked',
                `- [ ] The new expiry date is written into [\`${credential.doc}\`](${blob}/docs/CREDENTIALS.md) **and into the \`CREDENTIALS\` table in this workflow** — they must agree`,
                '- [ ] A deploy has been observed reaching the Environments tab since the rotation',
              ].join('\n');

              const { data: issue } = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                // Intrinsic properties of the work; Status and Priority are board fields.
                labels: ['area:security', 'size:S'],
                assignees: [process.env.CREDENTIAL_OWNER],
                // No milestone: a recurring operational obligation outlives every release gate.
                type: 'Task',
              });

              // The board cannot be written from here (`GITHUB_TOKEN` cannot write to an organisation project), and
              // "Auto-add to project" misses items at roughly 4% (#1092). Check the card after a run.
              core.notice(`Opened #${issue.number} — ${title}`);
              opened.push(`[#${issue.number}](${issue.html_url}) — ${title}`);
            }

            const summary = core.summary.addHeading('🔑 Credential expiry', 2);
            if (opened.length > 0) {
              summary.addRaw('Opened:').addList(opened);
            } else {
              summary.addRaw('Nothing expiring within ' + LEAD_DAYS + ' days.');
            }
            if (skipped.length > 0) {
              summary.addRaw('Checked:').addList(skipped);
            }
            await summary.write();
