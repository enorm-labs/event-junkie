# Turns a Flux reconcile into a GitHub deployment, so the Environments tab says what is running.
# Nothing in Actions deploys — `release.yml` pushes to GHCR and stops, Flux pulls — so GitHub had no
# idea what was running anywhere. A `githubdispatch` Provider in each cluster fires a
# `repository_dispatch` when the HelmRelease reconciles, and this turns it into a deployment (#565).
#
# NOT CREATED IN `release.yml`, because that would record "published" where the tab says "running on
# production"; a wrong answer displayed confidently is worse than a blank tab.
#
# THIS WORKFLOW CANNOT BE TESTED FROM A PULL REQUEST: `repository_dispatch` runs workflows from the
# default branch only. Everything below fails loudly on a payload it does not recognise, because a
# silent default writes a plausible lie into a permanent timeline.
name: Deployment Status

on:
  # The event type is Flux's own `{Kind}/{Name}.{Namespace}`, and must match the involved object
  # exactly. Only the HelmRelease: a chart in the registry is not a deployment. The OCIRepository's
  # failures go to `flux-source-failure.yml` (#1454).
  repository_dispatch:
    types: [ HelmRelease/event-junkie.flux-system ]

permissions:
  # To resolve a release version to the commit its tag points at. Read-only; no checkout.
  contents: read
  deployments: write

# Per environment, queued: `Progressing` then `UpgradeSucceeded` must land in order on one deployment,
# and cancelling the first would leave a rollout that looks like it never started.
concurrency:
  group: deployment-status-${{ github.event.client_payload.metadata.env }}
  cancel-in-progress: false

jobs:
  record:
    name: Record the deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # No `actions/checkout`, and none should be added: everything comes from the payload and the API.
      - name: Record the deployment and its status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const event = context.payload.client_payload;
            if (!event || typeof event !== 'object') {
              core.setFailed('client_payload is missing — the dispatch did not come from a Flux githubdispatch Provider.');
              return;
            }

            // Flux strips the API-group prefix before a Provider sees the event, so these keys arrive bare
            // (`revision`, not `helm.toolkit.fluxcd.io/revision`). `env` and `cluster` come from the Alert's
            // `.spec.eventMetadata`.
            const metadata = event.metadata ?? {};

            // `production` earns the badge on the front page; `url` is the "View deployment" link. An unknown env
            // is a failure, not a default. **Staging has no url on purpose**: it answers only through the tunnel,
            // and a link that resolves for nobody reads as a broken deploy. Production's is the chart's
            // `ingress.host`; `event-junkie.com` is only a 301.
            const ENVIRONMENTS = {
              staging: { production: false, url: null },
              production: { production: true, url: 'https://event-junkie.de' },
            };
            const environment = metadata.env;
            if (!Object.hasOwn(ENVIRONMENTS, environment)) {
              core.setFailed(
                `client_payload.metadata.env is ${JSON.stringify(environment)}, expected one of ` +
                `${Object.keys(ENVIRONMENTS).join(', ')}. It is set by the Alert's .spec.eventMetadata ` +
                `in deploy/clusters/<cluster>/notification.yaml.`);
              return;
            }

            // --- The revision is a chart version, not a commit ------------------------------------
            // The chart carries no `org.opencontainers.image.revision`, so Flux reports the chart version, and
            // the Deployments API wants a ref. Both shapes `scripts/version.sh` produces encode the commit —
            // `0.1.1-snapshot.20260814122042.g1a2b3c4` (the short sha) and `0.1.1` (the tag `v0.1.1`) — and
            // `repos.getCommit` accepts either and dereferences an annotated tag, which `git/ref` would not.
            const revision = metadata.revision;
            if (typeof revision !== 'string' || revision === '') {
              core.setFailed('client_payload.metadata.revision is missing — cannot place a deployment without a commit.');
              return;
            }

            // WHAT ARRIVES IS NOT WHAT `scripts/version.sh` PRODUCES: helm-controller appends the chart's OCI
            // digest as SemVer build metadata — `…g3b1c09e+97ec754320b5` — so two charts with one version and
            // different content are distinguishable. Split it off before matching: the release branch builds a
            // tag from this string, and `v0.1.1+97ec754320b5` is not a tag that exists.
            const version = revision.split('+')[0];

            const SNAPSHOT = /^\d+\.\d+\.\d+-snapshot\.\d{14}\.g([0-9a-f]{7})$/;
            const RELEASE = /^\d+\.\d+\.\d+$/;

            const snapshot = SNAPSHOT.exec(version);
            let ref;
            if (snapshot) {
              ref = snapshot[1];
            } else if (RELEASE.test(version)) {
              ref = `v${version}`;
            } else {
              core.setFailed(
                `revision ${JSON.stringify(revision)} (version core ${JSON.stringify(version)}) is neither ` +
                `a snapshot nor a release version. If scripts/version.sh changed shape, or helm-controller ` +
                `changed what it appends, this workflow has to change with it.`);
              return;
            }

            let sha;
            try {
              const commit = await github.rest.repos.getCommit({ ...context.repo, ref });
              sha = commit.data.sha;
            } catch (error) {
              core.setFailed(`cannot resolve ${JSON.stringify(ref)} (from revision ${revision}) to a commit: ${error.message}`);
              return;
            }

            // --- What the reconcile actually did --------------------------------------------------
            // `severity: error` is authoritative for failure. Success is matched on the reason suffix, because
            // helm-controller has several (`InstallSucceeded`, `UpgradeSucceeded`, `RollbackSucceeded`, …) and a
            // list would silently degrade the day it gains another. Anything else is `in_progress`.
            const reason = typeof event.reason === 'string' ? event.reason : '';
            const state = event.severity === 'error' ? 'failure'
              : /Succeeded$/.test(reason) ? 'success'
                : 'in_progress';

            // --- One deployment per (environment, commit) -----------------------------------------
            // Reused rather than re-created, so Progressing then UpgradeSucceeded is one entry with two statuses.
            // The timeline is the product; duplicates ruin it.
            const existing = await github.rest.repos.listDeployments({
              ...context.repo, environment, sha, per_page: 1,
            });

            let deploymentId;
            if (existing.data.length > 0) {
              deploymentId = existing.data[0].id;
              core.info(`Reusing deployment ${deploymentId} for ${environment} at ${sha.slice(0, 7)}.`);
            } else {
              // `required_contexts: []` is load-bearing: left unset, GitHub refuses a deployment while any check on
              // the ref is pending, which for a commit Flux reached minutes after CI is most of the time.
              const created = await github.rest.repos.createDeployment({
                ...context.repo,
                ref: sha,
                environment,
                auto_merge: false,
                required_contexts: [],
                production_environment: ENVIRONMENTS[environment].production,
                transient_environment: false,
                description: `Flux reconciled ${revision} on ${metadata.cluster ?? environment}`.slice(0, 140),
                payload: {
                  revision,
                  cluster: metadata.cluster ?? null,
                  reportingController: event.reportingController ?? null,
                },
              });
              deploymentId = created.data.id;
              core.info(`Created deployment ${deploymentId} for ${environment} at ${sha.slice(0, 7)}.`);
            }

            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: deploymentId,
              state,
              environment,
              // 140 characters is the API's limit; a Flux message can exceed it and the call is rejected, not truncated.
              description: `${reason}: ${event.message ?? ''}`.slice(0, 140),
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              // Omitted rather than null when there is no public address: an explicit empty string means "clear the
              // link", the same result by a route that reads like an accident.
              ...(ENVIRONMENTS[environment].url ? { environment_url: ENVIRONMENTS[environment].url } : {}),
            });

            await core.summary
              .addHeading(`${environment} — ${state}`, 2)
              .addTable([
                [{ data: 'Field', header: true }, { data: 'Value', header: true }],
                ['Revision', `\`${revision}\``],
                ['Commit', `\`${sha}\``],
                ['Reason', reason || '—'],
                ['Cluster', metadata.cluster ?? '—'],
              ])
              .write();
