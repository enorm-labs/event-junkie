# Claude driven by this repository's own /security-triage prompt; opens a pull request, never pushes
# to main. ci-cd.instructions.md carries the reasoning shared by every agent workload. The traps:
#
# **`--unattended` is a clause in the prompt.** Dropping it from the string silently arms the
# irreversible half. **No `github_token:` input**: the agent would commit as GITHUB_TOKEN, Actions
# starts no workflow on those commits, and the pull request sits Pending forever. **`--allowedTools`
# is load-bearing**: no frontmatter, so without it the agent has no shell. **`ACTIONS_GITHUB_TOKEN` is
# the only way `security-events: read` reaches the agent** — the action overwrites `GITHUB_TOKEN` and
# `GH_TOKEN` with its App token, which cannot read code scanning; renaming the variable here without
# the prompt restores a silent `403` (#1021). **`display_report: true`, never `show_full_output`.**
# **The `inputs` context is empty on `schedule` and `workflow_run`**, so every input carries a
# fallback, or a scheduled run goes live by accident. **A failed publish wakes this workflow, and the
# job-level `if:` keeps that to publishes** — `release.yml` also completes on its self-test and on a
# dispatch dry run.
name: Agent — Security Triage

on:
  # Nightly, off-the-hour; the agent workloads keep staggered start times so a night is a queue.
  schedule:
    - cron: '23 4 * * *'
  # comment-lint: allow a dated suppression, per the reason in zizmor.yml
# zizmor: ignore[dangerous-triggers]
  # 2026-09-05 — `workflow_run` runs with the default branch's secrets, and the danger is checking out
  # the triggering run's head. Nothing from that run is checked out: the checkout below is `main`, and
  # the only thing taken from the event is the run's URL. The job-level `if:` narrows it to a red
  # publish on `main` or a red release.
  workflow_run:
    workflows: [ 'Release' ]
    types: [ completed ]
  workflow_dispatch:
    inputs:
      model:
        description: Model to run the triage with
        type: choice
        default: claude-opus-5
        options:
          - claude-opus-5
          - claude-opus-4-8
          - claude-sonnet-5
      dry_run:
        description: Report only — read, reason, and open no pull request
        type: boolean
        default: true

permissions:
  contents: read
  # Reaching the agent as `ACTIONS_GITHUB_TOKEN` — see the header. Never `write`: dismissal is the thing
  # this workflow must not do.
  security-events: read
  # Required by the action's default GitHub App authentication, per its own documentation.
  id-token: write

# One triage at a time; a cancelled agent can leave a pushed branch with no pull request.
concurrency:
  group: agent-security
  cancel-in-progress: false

jobs:
  triage:
    name: Security triage (agent)
    runs-on: ubuntu-latest
    # The schedule and a dispatch always run. A `workflow_run` runs only for a publish that failed: a push
    # to `main` or a `release` event, whose `head_branch` is the tag (verified: `head_branch: v0.3.10`).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       ((github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') ||
        github.event.workflow_run.event == 'release'))
    # Generous; `--max-turns` is the cost ceiling, this only stops a wedged run billing overnight.
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The prompt is a one-line `@` pointer into `.github/prompts/`, so the checkout is what resolves it.
      - name: Run /security-triage
        id: claude
        uses: anthropics/claude-code-action@7b0b255830a1fab6e602658672acad11c12d841d # v1
        env:
          # The Actions token, under a name the action does not overwrite. Read-only.
          ACTIONS_GITHUB_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          display_report: true
          # `--failed-publish <url>` names the red run on the `workflow_run` trigger; the prompt's § A blocked
          # publish starts from it. Live either way — `--dry-run` is dispatch-only.
          prompt: /security-triage --unattended${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && ' --dry-run' || '' }}${{ github.event_name == 'workflow_run' && format(' --failed-publish {0}', github.event.workflow_run.html_url) || '' }}
          claude_args: |
            --model ${{ inputs.model || 'claude-opus-5' }}
            --max-turns 80
            --allowedTools "Bash,Read,Glob,Grep,Edit,Write,WebFetch,TodoWrite"

      # Reporting steps last and guarded. The step summary has no REST API, so the final report is extracted
      # to an artifact — the report alone, never the execution file, which holds every tool result.
      - name: Extract the report
        if: success() || failure()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          : > agent-report.md
          if [ -n "${EXECUTION_FILE:-}" ] && [ -s "$EXECUTION_FILE" ]; then
            jq -s -r '[.. | objects | select(.type == "result") | .result // empty] | last // ""' \
              "$EXECUTION_FILE" > agent-report.md || true
          fi
          if [ ! -s agent-report.md ]; then
            echo 'No report extracted. The execution file was empty or its shape changed.' > agent-report.md
          fi

      - name: Upload the report
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-report
          path: agent-report.md

      # **A run that produced no report is a failed run, whatever its exit code.** The agent's turn ends when
      # it stops calling tools, so "I'll compile the report once the checks finish" reports success and
      # delivers a sentence. After the upload, so the stub is preserved; guarded on the agent step succeeding.
      - name: Fail if the report is a stub
        if: steps.claude.outcome == 'success'
        run: |
          set -euo pipefail
          bytes=$(wc -c < agent-report.md)
          lines=$(wc -l < agent-report.md)
          if [ "$bytes" -lt 400 ] || [ "$lines" -lt 5 ]; then
            echo "::error::The agent reported success but wrote no report ($bytes bytes, $lines lines). See the agent-report artifact."
            cat agent-report.md
            exit 1
          fi
