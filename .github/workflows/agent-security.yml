# Claude driven by this repository's own /security-triage prompt. It opens a pull request and never
# pushes to main. First of #387's four workloads. ci-cd.instructions.md carries the reasoning,
# including why Dependabot alerts are expected to 403. Three lines below are traps.
#
# **`--unattended` is a clause in the prompt, not a hint.** It is what makes the run dismiss nothing
# and file nothing. Dropping it from the prompt string silently arms the irreversible half.
#
# **There is no `github_token:` input, deliberately.** Passing one makes the agent commit as
# GITHUB_TOKEN, and Actions starts no workflow on those commits — so the pull request sits Pending
# against nine required checks forever, looking like a hung check rather than this line.
#
# **`--allowedTools` is load-bearing.** These prompts carry no frontmatter, so without it the agent
# has no shell and no GitHub API, and the run reads the repository and does nothing. Bash is
# unrestricted because the fix half runs Gradle and npm. The runner is ephemeral and main is ruled.
#
# **`ACTIONS_GITHUB_TOKEN` is the only way the `security-events: read` below reaches the agent.**
# The action overwrites both `GITHUB_TOKEN` and `GH_TOKEN` in the process environment with its App
# installation token, which holds no `security_events` permission, so `gh` authenticates as the App
# and the code-scanning API answers `403`. A differently named variable survives, and the prompt
# reads code scanning through it. Renaming it here without renaming it there restores the 403 —
# silently, because a blind inventory and a clean one produce the same empty list (#1021).
#
# **`display_report: true` is what makes the run readable**, and is not interchangeable with
# `show_full_output`. ci-cd.instructions.md has the difference and why it matters here.
#
# **The `inputs` context is empty on a `schedule` trigger**, so every input below carries an explicit
# fallback. Without them a scheduled run passes `--model` with no value, and goes live by accident
# rather than by decision. ci-cd.instructions.md has the rest.
name: Agent — Security Triage

on:
  # Nightly, off-the-hour for the reason every other schedule here gives: the top of the hour is
  # a stampede on shared runners. The five agent workloads keep the staggered start times they
  # had as one-per-weekday, so a night is a queue rather than five runners at once.
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      model:
        description: Model to run the triage with
        type: choice
        default: claude-opus-5
        options:
          - claude-opus-5
          - claude-opus-4-8
          - claude-sonnet-5
      dry_run:
        description: Report only — read, reason, and open no pull request
        type: boolean
        default: true

permissions:
  contents: read
  # Reading code scanning alerts, and reaching the agent as `ACTIONS_GITHUB_TOKEN` rather than
  # `GITHUB_TOKEN` — see the header. Never `write`: dismissal is the thing this workflow must not do.
  security-events: read
  # Required by the action's default GitHub App authentication, per its own documentation.
  id-token: write

# One triage at a time. `cancel-in-progress: false` because a cancelled agent can leave a pushed
# branch with no pull request on it, which is worse than waiting.
concurrency:
  group: agent-security
  cancel-in-progress: false

jobs:
  triage:
    name: Security triage (agent)
    runs-on: ubuntu-latest
    # Generous, because the prompt reads advisories and compares versions. The cost ceiling is
    # `--max-turns` below; this only stops a wedged run billing runner minutes overnight.
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The prompt is `.claude/skills/security-triage.md`, a one-line `@` pointer into
      # `.github/prompts/`, so checkout above is what makes it resolvable at all.
      - name: Run /security-triage
        id: claude
        uses: anthropics/claude-code-action@8251c103ac8c1d761882c86aba1412c7f583c844 # v1
        env:
          # The Actions token, under a name the action does not overwrite. Read-only, and the whole
          # of what the `permissions:` block above grants.
          ACTIONS_GITHUB_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          display_report: true
          prompt: /security-triage --unattended${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && ' --dry-run' || '' }}
          claude_args: |
            --model ${{ inputs.model || 'claude-opus-5' }}
            --max-turns 80
            --allowedTools "Bash,Read,Glob,Grep,Edit,Write,WebFetch,TodoWrite"

      # Reporting steps, last and guarded, per the rule in ci-cd.instructions.md. The step summary
      # `display_report` writes has no REST API, so a scheduled report would exist only as a browser
      # page. This extracts the same final report and nothing else — the execution file also holds
      # every tool result, which is what must never be uploaded from a public repository.
      - name: Extract the report
        if: success() || failure()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          : > agent-report.md
          if [ -n "${EXECUTION_FILE:-}" ] && [ -s "$EXECUTION_FILE" ]; then
            jq -s -r '[.. | objects | select(.type == "result") | .result // empty] | last // ""' \
              "$EXECUTION_FILE" > agent-report.md || true
          fi
          if [ ! -s agent-report.md ]; then
            echo 'No report extracted. The execution file was empty or its shape changed.' > agent-report.md
          fi

      - name: Upload the report
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-report
          path: agent-report.md

      # **A run that produced no report is a failed run, whatever its exit code.** The agent's turn
      # ends when it stops calling tools, so a closing line like "I'll compile the report once the
      # checks finish" reports success and delivers a sentence. That has happened once already.
      # This runs after the upload on purpose: the stub is preserved for diagnosis, then the job goes
      # red. Guarded on the agent step succeeding, because a failure above is already red for a
      # better reason.
      - name: Fail if the report is a stub
        if: steps.claude.outcome == 'success'
        run: |
          set -euo pipefail
          bytes=$(wc -c < agent-report.md)
          lines=$(wc -l < agent-report.md)
          if [ "$bytes" -lt 400 ] || [ "$lines" -lt 5 ]; then
            echo "::error::The agent reported success but wrote no report ($bytes bytes, $lines lines). See the agent-report artifact."
            cat agent-report.md
            exit 1
          fi
