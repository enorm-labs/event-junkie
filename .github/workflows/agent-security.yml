# Claude driven by this repository's own /security-triage prompt. It opens a pull request and never
# pushes to main. First of #387's four workloads. ci-cd.instructions.md carries the reasoning,
# including why Dependabot alerts are expected to 403. Three lines below are traps.
#
# **`--unattended` is a clause in the prompt, not a hint.** It is what makes the run dismiss nothing
# and file nothing. Dropping it from the prompt string silently arms the irreversible half.
#
# **There is no `github_token:` input, deliberately.** Passing one makes the agent commit as
# GITHUB_TOKEN, and Actions starts no workflow on those commits — so the pull request sits Pending
# against nine required checks forever, looking like a hung check rather than this line.
#
# **`--allowedTools` is load-bearing.** These prompts carry no frontmatter, so without it the agent
# has no shell and no GitHub API, and the run reads the repository and does nothing. Bash is
# unrestricted because the fix half runs Gradle and npm. The runner is ephemeral and main is ruled.
name: Agent — Security Triage

on:
  # Dispatch only, deliberately, until a run has been watched end to end. The schedule is the easy
  # half and can be added in a line; what it cannot do is tell you the prompt behaves unattended.
  workflow_dispatch:
    inputs:
      model:
        description: Model to run the triage with
        type: choice
        default: claude-opus-5
        options:
          - claude-opus-5
          - claude-opus-4-8
          - claude-sonnet-5
      dry_run:
        description: Report only — read, reason, and open no pull request
        type: boolean
        default: true

permissions:
  contents: read
  # Reading code scanning alerts. Never `write`: dismissal is the thing this workflow must not do.
  security-events: read
  # Required by the action's default GitHub App authentication, per its own documentation.
  id-token: write

# One triage at a time. `cancel-in-progress: false` because a cancelled agent can leave a pushed
# branch with no pull request on it, which is worse than waiting.
concurrency:
  group: agent-security
  cancel-in-progress: false

jobs:
  triage:
    name: Security triage (agent)
    runs-on: ubuntu-latest
    # Generous, because the prompt reads advisories and compares versions. The cost ceiling is
    # `--max-turns` below; this only stops a wedged run billing runner minutes overnight.
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The prompt is `.claude/skills/security-triage.md`, a one-line `@` pointer into
      # `.github/prompts/`, so checkout above is what makes it resolvable at all.
      - name: Run /security-triage
        uses: anthropics/claude-code-action@1f291e1cfe0f5fc21db2aef19af844591600ade7 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: /security-triage --unattended${{ inputs.dry_run && ' --dry-run' || '' }}
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns 80
            --allowedTools "Bash,Read,Glob,Grep,Edit,Write,WebFetch,TodoWrite"
