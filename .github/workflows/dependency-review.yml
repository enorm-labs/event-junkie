# Newly introduced dependency vulnerabilities and licence issues, diffed between PR head and base —
# the fast gate at review time beside OWASP Dependency-Check's full-tree scan. Needs the dependency
# graph (dependency-submission.yml). source: https://github.com/actions/dependency-review-action
name: Dependency Review

on: [ pull_request ]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # High+ severity, matching Dependency-Check's CVSS ≥ 7.
          fail-on-severity: high

          # Licence policy (docs/LEGAL.md §9.2). A deny-list rather than an allow-list: an allow-list fails on
          # every unrecognised-but-fine SPDX spelling and trains people to bypass the gate. Named here are the
          # licences incompatible with shipping a public network service under Apache-2.0: AGPL (§ 13 fires on
          # network interaction — this project is the exact case), GPL-2.0-only, GPL-3.0 (compatible only in
          # the direction that makes the whole work GPL), SSPL / BUSL / Elastic-2.0 / Commons Clause (restrict
          # "offer this as a service"). Newly introduced dependencies only; the notices page surfaces the rest.
          deny-licenses: >-
            AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later,
            GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later,
            SSPL-1.0, BUSL-1.1, Elastic-2.0

