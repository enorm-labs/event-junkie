name: Validate Scripts

# ShellCheck over `scripts/`. The pre-commit hook already matches this directory
# (`.pre-commit-config.yaml`, `^(infra|scripts)/.*\.sh$`), but a hook is advisory by
# construction — `git commit --no-verify` skips it, and so does anything committed through the
# GitHub web UI or by an agent that never installed pre-commit. This is the gate that makes it hold
# on `main`, exactly as validate-docs.yml is for the Markdown formatter.
#
# It closes a gap the chart workflow names in its own comment: "The remaining scripts/ files are
# covered by the pre-commit hook only — a gap, but a pre-existing one." `scripts/issue-board.sh`
# grew a batch mode with real parsing in it, which is the point at which "linted only if the author
# happened to have the hook installed" stopped being comfortable.
#
# **This is now the only ShellCheck job that covers the deploy scripts.** validate-chart.yml used to
# lint `scripts/k3d-rehearsal.sh`, `scripts/version.sh` and `scripts/version-test.sh` a second time
# from a "ShellCheck deploy scripts" job, because `deploy/scripts/` had a script of its own to lint
# and those three belong to the same story. #430 ported that script to helm-unittest suites and
# `deploy/scripts/` no longer exists, so the job went with it. The deliberate overlap it recorded is
# gone rather than forgotten: a pull request that changes any of those files matches this workflow's
# own `paths:` filter, which is what made the second job redundant rather than merely duplicated.

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/**.sh'
      - '.github/workflows/validate-scripts.yml'
  pull_request:
    branches: [ main ]
    # `paths:` is present here, like validate-docs.yml and unlike validate-infra.yml, because this
    # check is **not** on the `main` ruleset's required list. Those workflows dropped their filters
    # after #443: a required check that never runs stays Pending forever and deadlocks the pull
    # request. **If this one is ever made required, delete this filter in the same change.**
    paths:
      - 'scripts/**.sh'
      - '.github/workflows/validate-scripts.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned, and not optional. `ubuntu-latest` preinstalls ShellCheck, and the version it ships is
  # older than what a contributor has locally — old enough to disagree. v0.9.0 reports SC2015
  # ("A && B || C is not if-then-else") for `[[ -n "$pids" ]] && kill $pids || true`; v0.11.0
  # correctly does not, because `|| true` cannot be a mistaken else-branch. Three such lines in
  # `scripts/dev-env.sh` failed this job on its first run while passing locally and in pre-commit.
  #
  # Same trap validate-docs.yml records for oxfmt: a gate run against "whatever the runner ships"
  # fails on files the author's own copy had just passed, and the fix is not to edit the files.
  # Invisible to Dependabot — a string in YAML, not a manifest — so /update-dependencies step 12
  # sweeps it alongside HELM_VERSION, FLUX_VERSION, ACTIONLINT_VERSION and ZIZMOR_VERSION.
  #
  # **This pin appears in three workflows** — here, validate-chart.yml and validate-infra.yml — and
  # they must move together, the same rule HELM_VERSION carries. `k3d-rehearsal.sh`, `version.sh` and
  # `version-test.sh` are linted by two of them, so a drifted pin would show up as two jobs
  # disagreeing about the same file: three pins that can diverge are a weaker version of the problem
  # pinning was meant to fix.
  SHELLCHECK_VERSION: v0.11.0

jobs:
  shellcheck:
    name: ShellCheck repo scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Run from the pinned image rather than the runner's preinstalled binary, for the version
      # reason above — the same way validate-workflows.yml runs actionlint and zizmor. `-x` follows
      # `source`d files, matching the pre-commit hook's invocation so the two cannot disagree about
      # a finding.
      - name: Run ShellCheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            "koalaman/shellcheck:${SHELLCHECK_VERSION}" -x scripts/*.sh

      - name: Explain the fix
        if: failure()
        run: |
          {
            echo "## ShellCheck"
            echo
            echo "The findings above are in \`scripts/\`. To reproduce locally with the same"
            echo "ShellCheck this job pins — your installed version may differ and disagree:"
            echo
            echo '```bash'
            echo "docker run --rm -v \"\$PWD:/mnt\" -w /mnt \\"
            echo "  koalaman/shellcheck:${SHELLCHECK_VERSION} -x scripts/*.sh"
            echo '```'
            echo
            echo "Installing the pre-commit hooks (\`pre-commit install\`) runs ShellCheck on every"
            echo "commit, which is why this rarely fires — though the hook uses your local binary."
          } >> "$GITHUB_STEP_SUMMARY"
