name: Validate Scripts

# ShellCheck over `scripts/`. The pre-commit hook matches this directory, and a hook is advisory:
# `--no-verify`, the web UI and an agent without pre-commit all skip it. This is the gate on `main`.
#
# **`cluster-assertions.sh`, `k3d-rehearsal.sh`, `version.sh` and `version-test.sh` are linted
# twice** — here and in validate-chart.yml's "ShellCheck deploy-story scripts" — deliberately: a chart
# change should lint them and so should a scripts change. **That job is on the `main` ruleset's
# required list and this one is not**, so that one makes shell linting a merge gate; #430 deleted it
# once and the required check sat Pending forever. Do not remove either side without editing the
# ruleset in the same change.
#
# The index check runs here and in validate-docs.yml for the same reason: a script is added under
# `scripts/`, which this sees, and a reference is written in Markdown, which it does not. `scripts/**`
# rather than `scripts/**.sh` because the index covers every file there.

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - '.github/workflows/validate-scripts.yml'
  pull_request:
    branches: [ main ]
    # `paths:` is present because this check is **not** required. **If it is ever made required, delete
    # this filter in the same change** — a required check that never runs stays Pending forever.
    paths:
      - 'scripts/**'
      - '.github/workflows/validate-scripts.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned, and not optional: `ubuntu-latest` preinstalls a ShellCheck old enough to disagree with a
  # current local install — v0.9.0 reports SC2015 for `[[ -n "$pids" ]] && kill $pids || true`, v0.11.0
  # correctly does not, and three such lines failed this job while passing pre-commit. A string in YAML,
  # so Renovate's `customManagers` watch it (ADR-024). **This pin appears in three workflows** and they
  # move together; a drifted pin shows up as two jobs disagreeing about the same file.
  SHELLCHECK_VERSION: v0.11.0

jobs:
  shellcheck:
    name: ShellCheck repo scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # From the pinned image, not the runner's binary. `-x` follows `source`d files, matching the hook.
      - name: Run ShellCheck
        id: shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            "koalaman/shellcheck:${SHELLCHECK_VERSION}" -x scripts/*.sh

      # Every file in `scripts/` has a row in `scripts/README.md`, every `scripts/<name>` the tree names
      # exists, and every script answers `--help` before touching a tool — which is why this runs on a
      # runner with none of yq, helm or gh.
      - name: Check the scripts index
        run: scripts/index-parity.sh

      # `scan-coverage.sh` decides whether a scanner covered less than it did, and the expensive way for it
      # to be wrong is "covered everything" when it could not read the output. A silent always-pass is
      # caught only here (#1087).
      - name: Assert what scan-coverage.sh decides
        run: scripts/scan-coverage-test.sh

      # `version.sh deserved` turns the commits since the last release into the number; a wrong verdict is
      # a release numbered as if nothing changed, not a red build, so each rule is asserted against a
      # fabricated history. Needs only git.
      - name: Assert what version.sh deserved decides
        run: scripts/version-deserved-test.sh

      # Every way the release summary can be wrong is quiet, and the release that shows it up is already out.
      - name: Assert what release-highlights.sh summarises
        run: scripts/release-highlights-test.sh

      # Gated on the step it explains; otherwise a failing assertion above sends the reader to ShellCheck.
      - name: Explain the fix
        if: failure() && steps.shellcheck.outcome == 'failure'
        run: |
          {
            echo "## ShellCheck"
            echo
            echo "The findings above are in \`scripts/\`. To reproduce locally with the same"
            echo "ShellCheck this job pins — your installed version may differ and disagree:"
            echo
            echo '```bash'
            echo "docker run --rm -v \"\$PWD:/mnt\" -w /mnt \\"
            echo "  koalaman/shellcheck:${SHELLCHECK_VERSION} -x scripts/*.sh"
            echo '```'
            echo
            echo "Installing the pre-commit hooks (\`pre-commit install\`) runs ShellCheck on every"
            echo "commit, which is why this rarely fires — though the hook uses your local binary."
          } >> "$GITHUB_STEP_SUMMARY"
