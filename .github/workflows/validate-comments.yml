name: Validate Comments

# The CI half of `scripts/comment-lint.sh` (#713). It fails when the tree carries any comment-lint
# violation at all. There is no baseline and no per-area ceiling: both were removed once it became
# clear the volume budget was failing builds over comment lines rather than over comments.
#
# **No `paths:` filter, deliberately.** Both checks are repository-wide, so a filter would be a hole
# rather than an optimisation, and the job takes under a second. It is also not on the `main`
# ruleset's required list — if it is ever added there, no filter has to be removed first, which is
# the trap validate-docs.yml and validate-scripts.yml both warn about.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comments:
    name: Check comment rules
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check comment rules for Terraform, shell, YAML and Python
        run: scripts/comment-lint.sh check

      # Runs after the check rather than before it, so a real violation is the first thing in the
      # log. This asserts what the linter counts — a rule that silently starts measuring something
      # else still reports zero findings, which is how the block cap spent months charging a comment
      # for its own paragraph breaks (#750).
      - name: Assert what comment-lint.sh counts
        run: scripts/comment-lint-test.sh

      # comment-density.sh no longer gates anything, but /compact-comments and /code-review both
      # steer by its report, and a miscount there sends a sweep at the wrong files.
      - name: Assert what comment-density.sh counts
        run: scripts/comment-density-test.sh

      - name: Explain the fix
        if: failure()
        run: |
          {
            echo "## Comment rules"
            echo
            echo "A comment broke one of the rules for .tf, .sh, .yaml or .py. The fix is to"
            echo "compress or delete it, or to say why it has to stay:"
            echo
            echo '```bash'
            echo "scripts/comment-lint.sh report               # every violation, with its rule"
            echo "scripts/comment-density.sh report --top 20   # where the volume is, if you want it"
            echo '```'
            echo
            echo "A block that genuinely has to stay takes '# comment-lint: allow <reason>' on the"
            echo "line above it, or '# comment-lint: allow-file <reason>' for a whole file. The"
            echo "reason is not optional, and a bare directive is itself a violation."
            echo
            echo "See .github/instructions/comments.instructions.md and #713."
          } >> "$GITHUB_STEP_SUMMARY"
