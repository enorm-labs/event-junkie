# The committed open-source notices against what the dependencies resolve to (#1037).
# `events-frontend/src/assets/notices.json` is generated, committed and rendered at /legal/notices;
# nothing joined it to its inputs, and it drifted by 51 components before a pull request happened to
# regenerate it. **A stale notices file understates what we distribute** (docs/LEGAL.md §9.2).
#
# **Its own workflow** because the generator merges two ecosystems and needs a JDK and Node in one
# job; folding it into `validate-docs.yml` would trigger that workflow's unrelated jobs on
# `gradle.properties`. **The `paths:` filter names both ecosystems and is the part most likely to
# rot**: a dependency file missing from it means a change that moves the notices does not run this.
# `notices.json` itself is listed so a hand-edit is caught.
#
# **This job is the authority on what the notices contain.** `license-checker` walks `node_modules`,
# where optional dependencies differ per OS, so the generator drops platform-named binaries and
# anything whose `os` excludes Linux (#1043); a laptop regeneration otherwise fails here over one
# component.
#
# **Required on the `main` ruleset, therefore no `pull_request` filter** (#443) — and required only
# because `fix-notices-on-bot-prs.yml` repairs a bot's branch (#1084): a check red for something its
# author cannot fix teaches people to merge past it. If that workflow goes, this comes off the
# required list in the same change.
name: Validate Notices

on:
  push:
    branches: [ main ]
    paths:
      - 'events-frontend/package.json'
      - 'events-frontend/package-lock.json'
      - 'events-frontend/src/assets/notices.json'
      - 'events-frontend/scripts/generate-notices.mjs'
      - 'gradle.properties'
      - 'build.gradle.kts'
      - '*/build.gradle.kts'
      - 'scripts/notices-parity.sh'
      - '.github/workflows/validate-notices.yml'
  pull_request:
    branches: [ main ]
    # No `paths:` here: this check is **required**, and a filter would deadlock every pull request that
    # does not touch a dependency file (#443). **The cost was priced**: both dependency graphs resolve on
    # every pull request — 58s warm, 213–260s cold. The `push:` filter keeps its paths.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notices:
    name: Check the notices against the dependencies
    runs-on: ubuntu-latest
    # Both graphs resolve from scratch on a cold cache. Generous: a timeout reads as a broken check, and
    # the thing it would protect against is a registry outage that fails the step anyway.
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24' # should match the version specified in .nvmrc
          cache: 'npm'
          cache-dependency-path: events-frontend/package-lock.json

      # The generator shells out to a devDependency, so no `--omit=dev`.
      - name: Install frontend dependencies
        run: npm ci
        working-directory: events-frontend

      - name: Check the notices are current
        run: scripts/notices-parity.sh check

      - name: Explain the fix
        if: failure()
        run: |
          {
            echo "## Open-source notices"
            echo
            echo "\`events-frontend/src/assets/notices.json\` no longer matches what the"
            echo "dependencies resolve to. It is generated and committed, and \`/legal/notices\`"
            echo "renders it — so a stale one understates what we distribute."
            echo
            echo "Regenerate both halves and commit the result:"
            echo
            echo '```bash'
            echo "scripts/notices-parity.sh    # runs both generators"
            echo '```'
            echo
            echo "The generator writes no timestamp, so an unchanged dependency set produces an"
            echo "identical file and an empty diff. A diff here means something really moved."
            echo
            echo "See events-frontend/AGENTS.md § Open-source notices and #1037."
          } >> "$GITHUB_STEP_SUMMARY"
