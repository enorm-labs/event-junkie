name: DAST

# Hostile requests against the running site, from something with no source and no credential (#1421,
# #1419). Every other scanner here reads an artifact; this one talks to the site.
#
# **Four jobs, two targets.** `dast-k3d` is the active scan: ZAP's full and API scans fuzzing every
# parameter, then Nuclei (#1423) asking "is a known bad thing exposed" — one template per CVE or
# misconfiguration, kept current upstream — against the chart on an ephemeral k3d cluster on this
# runner, built the way Hetzner runs it: same chart, images and Traefik middlewares. `dast-production`
# is passive: a spider and the passive rules against the public site, because an active scan against
# a CX33 with visitors on it is a self-inflicted load test; staging is on the tunnel, unreachable on
# purpose. `nuclei-production` (#1461) is the Nuclei pass against the public site, weekly, at a
# quarter of the k3d rate — what production has that k3d does not is the surface the templates check.
# `e2e-k3d` (#1699) is not a scanner at all: it points a browser at the same ephemeral cluster and
# runs the un-mocked Playwright suite, because CI can reach no other deployment (ADR-033).
#
# **No job holds a credential to any cluster, and that is a property to keep.** The k3d cluster is
# created and deleted inside the job; the production jobs send HTTPS with `contents: read`.
#
# **What makes a run fail.** `-I` makes every WARN non-fatal, so only a rule set to FAIL under `.zap/`
# is red; every IGNORE there and every row of `.nuclei/waivers-*.tsv` carries a date and a reason, and
# a Nuclei match outside the waivers is red. The denominators — URLs spidered, rules run, templates
# loaded — are floors in `scripts/scan-coverage-baseline.txt` (#1087), because a Traefik that never
# came up or a spider behind a 429 wall looks like a clean scan otherwise.
#
# **Nothing here opens an issue**; reports are artifacts. **k3d comes up through Flux**
# (`k3d-rehearsal.sh flux-up`), pulling the newest signed snapshot chart from GHCR, so cosign
# verification (#1425) is exercised nightly as a side effect; a dispatch on a branch scans the
# published snapshot, not the branch. **No `pull_request` trigger** (#1421): a DAST finding is rarely
# about the pull request.

on:
  schedule:
    # Off-the-hour and clear of every other schedule. Each job reads `github.event.schedule` to know
    # which cron woke it.
    - cron: '52 3 * * *' # dast-k3d, nightly
    - cron: '19 4 * * 0' # nuclei-production, weekly on Sunday
    - cron: '46 5 * * 0' # dast-production, weekly on Sunday
  workflow_dispatch:
    inputs:
      job:
        description: Which scan to run
        type: choice
        options:
          - both
          - k3d
          - production
          - e2e
        default: both
      target:
        description: URL for the two production jobs. Empty means SITE_URL, then the apex.
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: dast-${{ github.event_name }}
  cancel-in-progress: false

env:
  # Pinned by tag **and** digest, because a tag on GHCR is mutable; Renovate reads both from this line
  # (ADR-024). The digest is the multi-arch index.
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
  # `k3d-rehearsal.sh` needs k3d and flux. Renovate moves every occurrence of FLUX_VERSION in one pull request.
  K3D_VERSION: v5.9.0
  FLUX_VERSION: 2.9.5
  # Binary and templates are two releases with two cadences, pinned apart; `-update-templates` at run
  # time would be the unpinned dependency ADR-024 refuses. No `v`: the download URLs add it.
  NUCLEI_VERSION: 3.11.1
  NUCLEI_TEMPLATES_VERSION: 10.4.9
  # The public target, site-probe.yml's convention: the repository variable while production serves a
  # rehearsal hostname, the apex once it is deleted at go-live, a dispatch input over both. Never unset,
  # so never a silent permanent skip.
  SITE_URL: ${{ inputs.target || vars.SITE_URL || 'https://event-junkie.de' }}
  # The shared dataset (#272). Its row count is asserted through the API before the scan, so a seed
  # that no longer matches the schema fails as a PostgreSQL error, not as a spider that found one page.
  FIXTURE: fixtures/events.sql

jobs:
  dast-k3d:
    name: Active scan against k3d
    runs-on: ubuntu-latest
    # Measured: flux-up 2 minutes, the full scan 15, the API scan 1, Nuclei 4.
    timeout-minutes: 75
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '52 3 * * *')
      || (github.event_name == 'workflow_dispatch' && inputs.job != 'production')

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install k3d and flux
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/k3d \
            "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          chmod +x /usr/local/bin/k3d
          curl -fsSL \
            "https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}/flux_${FLUX_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin flux
          k3d version
          flux version --client

      # The templates go to `~/nuclei-templates`, where nuclei installs them itself: a workflow template
      # chains others by a path relative to that directory, and elsewhere 261 fail to resolve. `-duc` stops
      # the update check. `.nuclei-ignore` lists the tags excluded by default (`dos`, `fuzz`, `bruteforce`)
      # and is read only from the config directory — anywhere else nuclei warns and runs them.
      - name: Install nuclei and its templates
        run: |
          set -euo pipefail
          curl -fsSL -o "${RUNNER_TEMP}/nuclei.zip" \
            "https://github.com/projectdiscovery/nuclei/releases/download/v${NUCLEI_VERSION}/nuclei_${NUCLEI_VERSION}_linux_amd64.zip"
          unzip -oq "${RUNNER_TEMP}/nuclei.zip" nuclei -d /usr/local/bin
          mkdir -p build/nuclei ~/.config/nuclei
          curl -fsSL \
            "https://github.com/projectdiscovery/nuclei-templates/archive/refs/tags/v${NUCLEI_TEMPLATES_VERSION}.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}"
          mv "${RUNNER_TEMP}/nuclei-templates-${NUCLEI_TEMPLATES_VERSION}" ~/nuclei-templates
          cp ~/nuclei-templates/.nuclei-ignore ~/.config/nuclei/.nuclei-ignore
          nuclei -version 2>&1 | head -1

      # The rehearsal script owns every k3d, helm and kubectl incantation; `down` at the end leaves nothing
      # behind. `flux-verify` asserts what was pulled: a snapshot, from GHCR, one tag, tests passed.
      - name: Bring the chart up through Flux
        run: |
          scripts/k3d-rehearsal.sh flux-up
          scripts/k3d-rehearsal.sh flux-verify

      # A fixture, not an import: the same rows every night, no venue's page fetched for our scanner's sake.
      # The expected count comes from the database, not a literal: the file carries a past row the
      # default list leaves out, and `FixtureTest` in the BFF is where that window is asserted.
      - name: Seed the database and assert the site serves the rows
        run: |
          set -euo pipefail
          psql() { docker exec -i event-junkie-postgres-1 psql -U admin -d event_junkie_k3d -v ON_ERROR_STOP=1 "$@"; }
          psql < "$FIXTURE"
          expected="$(psql -qAt -c "SELECT count(*) FROM events.event WHERE COALESCE(end_date, event_date) >= CURRENT_DATE")"
          total="$(curl -sS -H 'Host: event-junkie.localhost' 'http://localhost:8080/api/events?size=1' \
            | jq -r '.totalElements')"
          if [ "$total" != "$expected" ]; then
            echo "::error::/api/events reports $total events after seeding, expected $expected from $FIXTURE."
            exit 1
          fi
          echo "/api/events serves $total seeded events"

      # ZAP runs as uid 1000 and the runner is not, so the work directory is opened before mounting. The
      # rules files are copied in so ZAP reads them from the mount it writes the reports to.
      - name: Prepare the ZAP work directory
        run: |
          mkdir -p build/zap
          cp .zap/rules-k3d-full.tsv .zap/rules-k3d-api.tsv build/zap/
          chmod -R a+rwX build/zap

      # Through Traefik, because that is where the security-headers, CSP, `noindex` and rate-limit
      # middlewares are: the container reaches the k3d load balancer on `host.docker.internal:8080` and a
      # replacer rule rewrites `Host` to the Ingress name. Not `--network host`: `.localhost` resolves to
      # loopback inside curl and Firefox whatever `/etc/hosts` says. `-j` adds the browser spider — the
      # frontend is an SPA and the traditional spider reads a head with no links. Two threads and a delay
      # keep the active scan under the per-source rate limit (50 req/s, burst 250); a fuzzer that gets 429s
      # tests the limiter and nothing else. Capped at 30 minutes.
      #
      # The exit status is kept and applied after the coverage floors, so a red run says which it was.
      # `-e` is what makes a missed floor red; no `-s`, because the short format drops the `Total of N URLs`
      # line the floor reads.
      - name: Full scan through Traefik
        run: |
          set -euo pipefail
          status=0
          docker run --rm --add-host host.docker.internal:host-gateway \
            -v "$PWD/build/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-full-scan.py -t http://host.docker.internal:8080 -j -m 3 -T 40 -I \
              -c rules-k3d-full.tsv -J full.json -r full.html \
              -z "-config scanner.threadPerHost=2 -config scanner.delayInMs=10 -config scanner.maxScanDurationInMins=30 $HOST_REPLACER" \
            | tee build/zap/full.txt || status=$?
          scripts/scan-coverage.sh baseline zap-k3d-full-urls build/zap/full.txt
          scripts/scan-coverage.sh baseline zap-k3d-full-rules build/zap/full.txt
          exit "$status"
        env:
          # One replacer rule: every request's `Host` becomes the Ingress hostname (`replacer` add-on, index 0).
          HOST_REPLACER: >-
            -config replacer.full_list(0).description=host
            -config replacer.full_list(0).enabled=true
            -config replacer.full_list(0).matchtype=REQ_HEADER
            -config replacer.full_list(0).matchstr=Host
            -config replacer.full_list(0).regex=false
            -config replacer.full_list(0).replacement=event-junkie.localhost

      # The OpenAPI document is on the BFF port, not routed through Traefik, so a port-forward exposes it —
      # on every interface, because the container reaches the runner through the bridge. The scan fuzzes
      # the BFF directly, deliberately past the rate limiter, which would otherwise hide every finding
      # behind 429s; this is where `sort`, `page`, `size`, `q` and the slugs get hostile values. Its rules
      # file ignores the headers Traefik adds. Runs even when the full scan failed: one red step should not
      # hide the other's report.
      - name: API scan against the BFF
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          status=0
          kubectl --context k3d-event-junkie -n event-junkie port-forward --address 0.0.0.0 \
            svc/event-junkie-bff 18080:8080 >/dev/null 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:18080/v3/api-docs && break
            [ "$i" = 30 ] && { echo "::error::the BFF never answered on :18080"; exit 1; }
            sleep 2
          done
          docker run --rm --add-host host.docker.internal:host-gateway \
            -v "$PWD/build/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-api-scan.py -t http://host.docker.internal:18080/v3/api-docs -f openapi -T 40 -I \
              -c rules-k3d-api.tsv -J api.json -r api.html \
            | tee build/zap/api.txt || status=$?
          scripts/scan-coverage.sh baseline zap-k3d-api-urls build/zap/api.txt
          scripts/scan-coverage.sh baseline zap-k3d-api-rules build/zap/api.txt
          exit "$status"

      # On the runner, not in a container: the load balancer is on the host's :8080 and `Host` does the
      # routing. `-type http` keeps out the network, code, javascript and headless templates; `-ni` drops
      # the ones needing an out-of-band server; info severity is not run (`tech-detect` describes the stack).
      # nuclei exits 0 whatever it matches, so red is the JSONL having a line — after the floor. Waivers in
      # `.nuclei/waivers-k3d.tsv`, one template id per row with the date and the reason.
      - name: Nuclei through Traefik
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          status=0
          # Against a target that never came up, nuclei loads every template, sends every probe into a refused
          # connection and reports zero matches — green. The first runner exercise did exactly that.
          curl -sf -o /dev/null -H 'Host: event-junkie.localhost' http://127.0.0.1:8080/ \
            || { echo '::error::the site does not answer on :8080, so there is nothing to scan'; exit 1; }
          waived=$(grep -v '^#' .nuclei/waivers-k3d.tsv | cut -f1 | grep . | paste -sd, - || true)
          nuclei -duc -ni -nc -stats -si 60 -t ~/nuclei-templates -type http \
            -tags misconfig,exposure,tech,cve -severity medium,high,critical \
            -rate-limit 40 ${waived:+-exclude-id "$waived"} \
            -u http://127.0.0.1:8080 -H 'Host: event-junkie.localhost' \
            -jsonl -o build/nuclei/nuclei.jsonl 2>&1 | tee build/nuclei/nuclei.txt || status=$?
          touch build/nuclei/nuclei.jsonl
          scripts/scan-coverage.sh baseline nuclei-k3d-templates build/nuclei/nuclei.txt
          if [ -s build/nuclei/nuclei.jsonl ]; then
            jq -r '"::error title=Nuclei match::\(.["template-id"]) [\(.info.severity)] \(.["matched-at"])"' build/nuclei/nuclei.jsonl
            exit 1
          fi
          exit "$status"

      - name: Summarise
        if: always()
        run: |
          {
            echo "## ZAP and Nuclei against k3d"
            echo
            for scan in full api; do
              f="build/zap/$scan.txt"
              [ -f "$f" ] || { echo "- \`$scan\`: no output"; continue; }
              echo "- \`$scan\`: $(grep -E '^Total of [0-9]+ URLs' "$f" | tail -1 || echo 'no URL count') — $(grep -E '^FAIL-NEW:' "$f" | tail -1 || echo 'no tally')"
            done
            f=build/nuclei/nuclei.txt
            if [ -f "$f" ]; then
              echo "- \`nuclei\`: $(grep -oE 'Templates loaded for current scan: [0-9]+' "$f" || echo 'no template count') — $(grep -c '' build/nuclei/nuclei.jsonl 2>/dev/null || echo 0) matches"
            else
              echo "- \`nuclei\`: no output"
            fi
            echo
            echo "Reports are in the \`zap-k3d\` artifact. A FAIL row or a Nuclei match is a regression; a WARN row is for the reader."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-k3d
          path: |
            build/zap/*.html
            build/zap/*.json
            build/zap/*.txt
            build/nuclei/*.jsonl
            build/nuclei/*.txt
          retention-days: 30

      - name: Tear the cluster down
        if: always()
        run: scripts/k3d-rehearsal.sh down

  # The browser half of #298, answered on k3d rather than staging for the reason ADR-033 gives: no
  # workflow gets a route into staging, and the chart runs here exactly as it runs on Hetzner. A
  # cluster of its own rather than `dast-k3d`'s: the scan job runs for over an hour, and coupling a
  # five-minute browser suite to it makes either failure the other's problem.
  e2e-k3d:
    name: Un-mocked e2e against k3d
    runs-on: ubuntu-latest
    # Measured locally: flux-up 4 minutes, the suite 5 seconds. The margin is the cluster, not the tests.
    timeout-minutes: 30
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '52 3 * * *')
      || (github.event_name == 'workflow_dispatch' && (inputs.job == 'both' || inputs.job == 'e2e'))

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install k3d and flux
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/k3d \
            "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          chmod +x /usr/local/bin/k3d
          curl -fsSL \
            "https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}/flux_${FLUX_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin flux

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24' # should match the version specified in .nvmrc
          cache: 'npm'
          cache-dependency-path: events-frontend/package-lock.json

      # No `npm run build`: the bundle under test is the one inside the chart's image. Only the test
      # runner and the browser come from here.
      - name: Install dependencies
        working-directory: events-frontend
        run: npm ci

      - name: Install Playwright chromium
        working-directory: events-frontend
        run: npx playwright install --with-deps chromium

      # The same two commands `dast-k3d` runs: the newest signed snapshot from GHCR, through the
      # controllers that run on Hetzner, so cosign verification is exercised here too (#1425).
      - name: Bring the chart up through Flux
        run: |
          scripts/k3d-rehearsal.sh flux-up
          scripts/k3d-rehearsal.sh flux-verify

      - name: Seed the database and assert the site serves the rows
        run: |
          set -euo pipefail
          psql() { docker exec -i event-junkie-postgres-1 psql -U admin -d event_junkie_k3d -v ON_ERROR_STOP=1 "$@"; }
          psql < "$FIXTURE"
          expected="$(psql -qAt -c "SELECT count(*) FROM events.event WHERE COALESCE(end_date, event_date) >= CURRENT_DATE")"
          total="$(curl -sS -H 'Host: event-junkie.localhost' 'http://localhost:8080/api/events?size=1' \
            | jq -r '.totalElements')"
          if [ "$total" != "$expected" ]; then
            echo "::error::/api/events reports $total events after seeding, expected $expected from $FIXTURE."
            exit 1
          fi
          echo "/api/events serves $total seeded events"

      # The property that makes this suite worth running: a spec here must talk to the deployment, and
      # a `page.route` would quietly put a mock back in front of it. Cheap enough to check in the job
      # that cares rather than in a lint rule nobody reads.
      - name: Refuse a mock in the un-mocked suite
        working-directory: events-frontend
        run: |
          if grep -rn "page.route" e2e/real-data/; then
            echo "::error::e2e/real-data is the suite that talks to the deployment; a route handler makes it test a mock again."
            exit 1
          fi
          echo "No request interception in e2e/real-data."

      # `--host-resolver-rules` in the project config points the Ingress name at the published port,
      # which is what carries the right `Host` on a navigation; `extraHTTPHeaders` cannot.
      - name: Run the un-mocked suite through Traefik
        working-directory: events-frontend
        run: npm run test:e2e -- --project=real-data
        env:
          E2E_BASE_URL: http://event-junkie.localhost:8080

      # Failure and success alike: the durations are the trend #298 asks for, and the artifact is
      # where they live — a runner cannot reach the cluster's OpenObserve (ADR-033).
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-k3d
          path: |
            events-frontend/playwright-report/
            events-frontend/test-results/
          retention-days: 30

      - name: Tear the cluster down
        if: always()
        run: scripts/k3d-rehearsal.sh down

  dast-production:
    name: Passive baseline against production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '46 5 * * 0')
      || (github.event_name == 'workflow_dispatch' && inputs.job != 'k3d')

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare the ZAP work directory
        run: |
          mkdir -p build/zap
          cp .zap/rules-production.tsv build/zap/
          chmod -R a+rwX build/zap

      # Passive only: the spider for two minutes plus the browser spider, then the passive rules. No active
      # rule against production, ever. The spider's pacing is a tenth of the per-source limit, the browser
      # spider one visitor. `-T` and the job timeout are sized for a 15-minute run.
      - name: Baseline scan
        run: |
          set -euo pipefail
          status=0
          echo "Target: $SITE_URL"
          docker run --rm \
            -v "$PWD/build/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t "$SITE_URL" -j -m 2 -T 20 -I \
              -c rules-production.tsv -J baseline.json -r baseline.html \
            | tee build/zap/baseline.txt || status=$?
          scripts/scan-coverage.sh baseline zap-production-urls build/zap/baseline.txt
          scripts/scan-coverage.sh baseline zap-production-rules build/zap/baseline.txt
          exit "$status"

      - name: Summarise
        if: always()
        run: |
          {
            echo "## ZAP baseline against \`$SITE_URL\`"
            echo
            f=build/zap/baseline.txt
            if [ -f "$f" ]; then
              echo "- $(grep -E '^Total of [0-9]+ URLs' "$f" | tail -1 || echo 'no URL count') — $(grep -E '^FAIL-NEW:' "$f" | tail -1 || echo 'no tally')"
            else
              echo "- no output"
            fi
            echo
            echo "Reports are in the \`zap-production\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-production
          path: |
            build/zap/*.html
            build/zap/*.json
            build/zap/*.txt
          retention-days: 90

  nuclei-production:
    name: Nuclei against production
    runs-on: ubuntu-latest
    # Measured against prod-check at this rate: 11,967 requests in 14 minutes, 13 a second.
    timeout-minutes: 40
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '19 4 * * 0')
      || (github.event_name == 'workflow_dispatch' && inputs.job != 'k3d')

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same install as `dast-k3d`; its comment says why the templates go where they go.
      - name: Install nuclei and its templates
        run: |
          set -euo pipefail
          curl -fsSL -o "${RUNNER_TEMP}/nuclei.zip" \
            "https://github.com/projectdiscovery/nuclei/releases/download/v${NUCLEI_VERSION}/nuclei_${NUCLEI_VERSION}_linux_amd64.zip"
          unzip -oq "${RUNNER_TEMP}/nuclei.zip" nuclei -d /usr/local/bin
          mkdir -p build/nuclei ~/.config/nuclei
          curl -fsSL \
            "https://github.com/projectdiscovery/nuclei-templates/archive/refs/tags/v${NUCLEI_TEMPLATES_VERSION}.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}"
          mv "${RUNNER_TEMP}/nuclei-templates-${NUCLEI_TEMPLATES_VERSION}" ~/nuclei-templates
          cp ~/nuclei-templates/.nuclei-ignore ~/.config/nuclei/.nuclei-ignore
          nuclei -version 2>&1 | head -1

      # The `dast-k3d` step against the public hostname: same templates and filters, the same red (a match
      # outside `.nuclei/waivers-production.tsv`), a quarter of the rate — ten a second, a fifth of the
      # per-source limit's average. No `Host` header: the hostname is real here.
      - name: Nuclei against the site
        run: |
          set -euo pipefail
          status=0
          curl -sf -o /dev/null "$SITE_URL/" \
            || { echo "::error::$SITE_URL does not answer, so there is nothing to scan"; exit 1; }
          waived=$(grep -v '^#' .nuclei/waivers-production.tsv | cut -f1 | grep . | paste -sd, - || true)
          nuclei -duc -ni -nc -stats -si 60 -t ~/nuclei-templates -type http \
            -tags misconfig,exposure,tech,cve -severity medium,high,critical \
            -rate-limit 10 ${waived:+-exclude-id "$waived"} \
            -u "$SITE_URL" \
            -jsonl -o build/nuclei/nuclei.jsonl 2>&1 | tee build/nuclei/nuclei.txt || status=$?
          touch build/nuclei/nuclei.jsonl
          scripts/scan-coverage.sh baseline nuclei-production-templates build/nuclei/nuclei.txt
          if [ -s build/nuclei/nuclei.jsonl ]; then
            jq -r '"::error title=Nuclei match::\(.["template-id"]) [\(.info.severity)] \(.["matched-at"])"' build/nuclei/nuclei.jsonl
            exit 1
          fi
          exit "$status"

      - name: Summarise
        if: always()
        run: |
          {
            echo "## Nuclei against production"
            echo
            echo "- target: \`$SITE_URL\`"
            f=build/nuclei/nuclei.txt
            if [ -f "$f" ]; then
              echo "- $(grep -oE 'Templates loaded for current scan: [0-9]+' "$f" || echo 'no template count') — $(grep -c '' build/nuclei/nuclei.jsonl 2>/dev/null || echo 0) matches"
            else
              echo "- no output"
            fi
            echo
            echo "The JSONL and the log are in the \`nuclei-production\` artifact. A match is a regression unless it is waived in \`.nuclei/waivers-production.tsv\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuclei-production
          path: |
            build/nuclei/*.jsonl
            build/nuclei/*.txt
          retention-days: 90
