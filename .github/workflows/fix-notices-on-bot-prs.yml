# Regenerates the open-source notices on a bot's dependency branch, because the bot cannot (#1084):
# `validate-notices.yml` fails on every Dependabot or Renovate pull request that moves a frontend
# dependency, and regenerating needs a JDK and Node in one job. **A check that is red for something
# the author cannot fix is a check people learn to merge past**, and this one guards a licence artifact
# (docs/LEGAL.md §9.2).
#
# **A workflow triggered by a Dependabot push gets a read-only `GITHUB_TOKEN` and cannot read
# repository secrets at all**, so a `push:` trigger would fail at the token mint on most branches;
# `workflow_run` runs in the default branch's context with the normal secrets.
#
# **`pull_request_target` is forbidden here.** It would hand a writable token to a job that checks
# out a branch and runs `npm ci` on its lockfile — the arbitrary-code-execution path
# `milestone-dependabot.yml` refuses in capitals.
#
# `npm ci` executes install scripts from the branch's lockfile. **So the token is minted below
# `npm ci`, not above it**, and reaches only the push step: a malicious package runs where the
# credential does not yet exist.
#
# Both bots abandon a branch once a foreign commit lands, which is wanted (the regeneration must not
# be force-pushed away) and means the bump no longer auto-rebases. **Renovate decides that from the
# commit author**, so the identity below must not be `renovate[bot]`.
name: Fix notices on bot PRs

on:
  # comment-lint: allow a dated suppression, per the reason in zizmor.yml
# zizmor: ignore[dangerous-triggers]
  # 2026-09-04 — `workflow_run` is usually insecure, and **this job does check out the head**, so the
  # containment is explicit: forks cannot reach it (`head_repository.full_name == github.repository`);
  # only two bot branch prefixes reach it; the credential does not exist while untrusted code runs;
  # one file is staged by name; the token carries `contents: write` alone. Re-check all five before
  # adding a step.
  workflow_run:
    workflows: [ 'Validate Notices' ]
    types: [ completed ]

# Nothing at the top level: the push uses the minted App token, because a push made with
# `GITHUB_TOKEN` starts no check run and the pull request sits Pending forever.
permissions:
  contents: read

concurrency:
  # Per branch: a second failing run should replace the first, not race it to the same push.
  group: fix-notices-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate the notices for a bot branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Four load-bearing conditions: the check failed; it was a pull request (a `push` run is `main`
    # itself, and this job must never commit there); the branch belongs to a bot we recognise (a human's
    # branch is theirs to fix); the head repository is this one.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (startsWith(github.event.workflow_run.head_branch, 'dependabot/') ||
       startsWith(github.event.workflow_run.head_branch, 'renovate/'))

    steps:
      # `persist-credentials: false`, and a token only at the push step, so no credential sits in
      # `.git/config` while `npm ci` runs the lockfile's install scripts.
      - name: Checkout the bot's branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24' # should match the version specified in .nvmrc
          cache: 'npm'
          cache-dependency-path: events-frontend/package-lock.json

      # The generator shells out to a devDependency, so no `--omit=dev`.
      - name: Install frontend dependencies
        run: npm ci
        working-directory: events-frontend

      # Both generators in order. The npm half alone merges whatever Gradle report is on disk, which on a
      # fresh runner does not exist — it fails rather than writing a wrong file (#1084).
      - name: Regenerate the notices
        run: scripts/notices-parity.sh

      - name: Decide whether anything changed
        id: changed
        run: |
          if git diff --quiet -- events-frontend/src/assets/notices.json; then
            echo "result=none" >> "$GITHUB_OUTPUT"
            echo "The notices were already current. Nothing to push."
          else
            echo "result=changed" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- events-frontend/src/assets/notices.json
          fi

      # **Below the untrusted install, on purpose.** See the header.
      - name: Mint an App installation token
        id: app-token
        if: steps.changed.outputs.result == 'changed'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # The numeric App id, which `client-id` accepts.
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # One permission: commit a file and push it.
          permission-contents: write

      - name: Commit and push the regeneration
        if: steps.changed.outputs.result == 'changed'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          # Not `renovate[bot]` and not `dependabot[bot]`: Renovate reads the last author to decide whether a
          # human touched the branch, and would force-push over its own name.
          git config user.name 'event-junkie-ci[bot]'
          git config user.email '<>'
          git add events-frontend/src/assets/notices.json
          git commit -m 'chore(deps): regenerate the open-source notices

          The dependency change on this branch moves events-frontend/src/assets/notices.json, which
          neither Dependabot nor Renovate can regenerate: it merges the Gradle licence report with
          npm'"'"'s and needs a JDK and Node in one job. Added here so validate-notices.yml passes
          (#1084).

          Note that pushing this stops the bot rebasing this branch. If main moves under it, close
          and reopen the pull request rather than expecting an automatic update.'
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${BRANCH}"

      # Through `env:`: a branch name is attacker-controllable, and expanded into `run:` it is shell.
      - name: Say what happened
        if: always()
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RESULT: ${{ steps.changed.outputs.result }}
        run: |
          {
            echo "## Notices on \`$BRANCH\`"
            echo
            if [ "$RESULT" = 'changed' ]; then
              echo "Regenerated \`events-frontend/src/assets/notices.json\` and pushed it to the branch."
              echo
              echo "**The bot will not rebase this branch again.** Both Dependabot and Renovate abandon"
              echo "a branch once a foreign commit lands on it. If \`main\` moves under this pull request,"
              echo "close and reopen it rather than waiting for an update that will not come."
            else
              echo "The notices were already current, so nothing was pushed."
              echo
              echo "If \`Validate Notices\` still failed, it failed for some other reason — read that job."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
