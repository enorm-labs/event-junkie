# source: https://github.com/gradle/actions
# full documentation: https://github.com/gradle/actions/blob/main/docs/setup-gradle.md
name: Build & Test Backend

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'events-frontend/**'
      - '*.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
    # No `paths-ignore:` here (#494): `Build & Test (backend)` is **required**, and a required check that
    # never runs stays Pending forever. The filtering lives in `detect-changes` below, so a docs-only pull
    # request skips the build while the context still reports. The `push:` filter keeps its paths.
  # Manual trigger, for an Actions incident that drops webhooks and leaves nothing to re-run. Ignores
  # the path filters: `gh workflow run build-backend.yml --ref <branch>`.
  workflow_dispatch:

# Scoped per job (#383): a workflow-level `pull-requests: write` is exactly the token an attacker
# wants. Only `build` comments; only the two SARIF jobs get `security-events: write`.
permissions:
  contents: read

jobs:
  # Seconds, and no checkout: the file list comes from the API, so the required context below can be
  # unconditional while the build stays conditional. The patterns mirror the `push:` `paths-ignore`.
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Decide whether the backend is affected
        id: filter
        env:
          # Through `env:`, not interpolated: `${{ }}` inside `run:` is the template-injection shape zizmor rejects.
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')"
          # An empty list means the API call went wrong, not that nothing changed. Failing here is correct: the
          # gate refuses to pass when detection did not succeed.
          if [ -z "$FILES" ]; then
            echo '::error::no changed files returned for this pull request'
            exit 1
          fi
          printf '%s\n' "$FILES" | sed 's/^/  /'
          # Anything NOT ignorable makes the backend relevant. `^[^/]*\.md$`, not `\.md$`: the `push:` filter's
          # `*.md` is root-level only, so `.github/prompts/*.md` counts as backend-relevant. Filter-then-test
          # rather than `grep -qv`, which is not equivalent in every grep.
          if printf '%s\n' "$FILES" | grep -vE '^(events-frontend/|docs/|[^/]*\.md$)' | grep -q .; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
          else
            echo 'relevant=false' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Backend build
    needs: detect-changes
    if: needs.detect-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # The sticky Kover coverage comment on pull requests.
      pull-requests: write
      # Uploading the three detekt SARIF reports to Code Scanning.
      security-events: write

    # Kotlin warnings fail the build here, and only here (`warningsAsErrors` in the root build.gradle.kts).
    # An environment variable rather than `-P` per step: every invocation gets it, and a project property
    # is part of the configuration-cache key, so flagging some steps and not others doubles the misses.
    env:
      ORG_GRADLE_PROJECT_warningsAsErrors: 'true'

    steps:
      # The whole history and every tag: the image label reads the version from them (ADR-032).
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 25 (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # One invocation with `--parallel` (per step, because the licence-report plugin cannot run under it).
      # All three detekt tasks, because they are different analyses (#407): `detekt` reads the syntax tree,
      # `detektMain` and `detektTest` resolve types first and run `UnsafeCallOnNullableType`, `UseOrEmpty`,
      # `UnusedPrivateProperty` and the rest — rules that are **not run** when only the first task runs. The
      # build below reuses their compiled output.
      - name: Lint with ktlint and analyse with detekt
        run: ./gradlew ktlintCheck detekt detektMain detektTest --parallel

      - name: Post detekt report to Job Summary
        if: success() || failure()
        run: |
          echo "## 🔍 Detekt Static Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for report in */build/reports/detekt/detekt.md */build/reports/detekt/main.md */build/reports/detekt/test.md; do
            [ -f "$report" ] || continue
            module=$(echo "$report" | cut -d'/' -f1)
            # `main.md` and `test.md` are the type-resolution runs; say which analysis a section came from.
            case "$(basename "$report")" in
              main.md) variant="main, with type resolution" ;;
              test.md) variant="test, with type resolution" ;;
              *) variant="syntax only" ;;
            esac
            # Replace the generic "# detekt" heading with a module-specific one
            sed "s/^# detekt$/# detekt — ${module} (${variant})/" "$report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "---" >> $GITHUB_STEP_SUMMARY
          done

      # `-x koverVerify` alongside `-x test`: without execution data every module reports 0% and the floor
      # fails for the wrong reason. The coverage step below verifies for real, after `test`.
      - name: Build all modules
        run: ./gradlew build -x test -x koverVerify --parallel

      # The runtime-dependency licence policy (docs/LEGAL.md §9.2). A separate step because the plugin is
      # not configuration-cache compatible; `--no-configuration-cache` keeps that cost here.
      - name: Check dependency licences
        run: ./gradlew checkLicense --no-configuration-cache

      # `test` and the Kover tasks in ONE invocation: the reports read the execution data the same task
      # graph wrote. It also stops both Boot suites running twice — `bootBuildInfo` stamps `build.time` as
      # `Instant.now()`, which IS a task input, so a second invocation re-runs `test` (#1058). Not folded
      # into `build` above, which runs with `-x test`.
      - name: Run tests, then generate Kover coverage reports and verify the floors
        run: ./gradlew test koverXmlReport koverLog koverVerify --parallel

      - name: Post coverage to Job Summary
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 Test Coverage (Kover)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat build/kover/coverage.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # Build the container images and do not push them: this runs on fork pull requests, and pushing
      # belongs to release.yml. It catches a Dockerfile that stopped building; a built image is not a
      # started one. Pull requests only (#264): a push to `main` builds the same images in release.yml.
      #
      # **These steps run BEFORE anything that posts to the pull request** (#507). `if: github.event_name
      # == 'pull_request'` carries an implicit `success()`, so with the coverage comment ahead of them a
      # GitHub API error turned the job red for a cosmetic reason and silently skipped the image build —
      # on #506, the pull request that changed the JRE base image. Verification first, reporting last.
      - name: Extract the layered jars
        if: github.event_name == 'pull_request'
        run: ./gradlew :events-bff:bootJarLayers :events-importer:bootJarLayers --parallel

      # `scripts/version.sh` knows what version a commit is (ADR-032); on a pull request this is the
      # snapshot string release.yml would compute. The jar itself carries `0.0.0` here, because this build
      # passes no `-Pversion`.
      - name: Read the project version
        id: version
        if: github.event_name == 'pull_request'
        run: echo "value=$(scripts/version.sh compute)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: github.event_name == 'pull_request'
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      # No per-architecture runner and no QEMU step: neither Dockerfile does build work in a `RUN`, and the
      # one `apk upgrade` runs under the emulation the runner image has (#770). `type=cacheonly` because a
      # multi-platform image cannot be loaded, and a single platform would leave arm64 — the Hetzner nodes'
      # architecture — unbuilt.
      - name: Build events-bff image (amd64 + arm64, no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: events-bff/build/docker
          file: events-bff/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=cacheonly
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}

      - name: Build events-importer image (amd64 + arm64, no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: events-importer/build/docker
          file: events-importer/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=cacheonly
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}

      # LAST ON PURPOSE — it reaches the GitHub API, so it is the step most likely to fail for a reason that
      # has nothing to do with the code (#507). Not `continue-on-error`, because `min-coverage-changed-files:
      # 80` is a gate nothing else carries (`min-coverage-overall` is redundant with `koverVerify`).
      #
      # SKIPPED ON A FORK'S PULL REQUEST (#479): a fork gets a read-only `GITHUB_TOKEN`, so the comment is
      # impossible however written, and without the guard the run goes red where a first-time contributor
      # cannot tell a broken repository from a permission they never had. The cost: the changed-files gate
      # does not run on that path and is a review responsibility.
      - name: Post coverage to Pull Request
        id: coverage
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true
        uses: mi-kas/kover-report@94d69bc9d417de89b808cd5fe846bca2840911bb # v2.7
        with:
          path: build/reports/kover/report.xml
          title: Code Coverage
          update-comment: true
          min-coverage-overall: 60
          min-coverage-changed-files: 80

      # The step above fails for two different reasons — coverage below 80%, or GitHub unable to serve an
      # API call — and only its message says which. This puts that in the job summary.
      - name: Say which kind of coverage failure this was
        if: always() && steps.coverage.outcome == 'failure'
        run: |
          {
            echo "## Coverage comment failed"
            echo
            echo "**The build itself passed.** ktlint, detekt, compilation, tests, the licence check,"
            echo "the Kover floors and both container images all ran and succeeded before this step —"
            echo "that is why it is last."
            echo
            echo "Two things fail here, and the error message above is what tells them apart:"
            echo
            echo "| Message | Meaning |"
            echo "| --- | --- |"
            echo "| Coverage below \`min-coverage-changed-files\` | **Real.** Files changed by this PR are under 80% covered. Add tests |"
            echo "| \`Not Found\`, \`503\`, \`No server is currently available\` | **Not yours.** A GitHub API error. Check githubstatus.com, then re-run |"
            echo
            echo "\`min-coverage-overall: 60\` is not the cause: \`koverVerify\` enforces 90 aggregate"
            echo "plus per-module floors and runs earlier, so it would have failed first."
          } >> "$GITHUB_STEP_SUMMARY"

      # One upload for all nine detekt reports (three modules × three analyses), kept apart by
      # `runAutomationDetails.id` — what `upload-sarif`'s `category` sets internally. Without the ids, nine
      # runs of one tool under one category are one analysis, and the last erases the others' alerts. One
      # upload is ~7s; nine are ~63s on the critical path (#1394).
      #
      # Last, with the other API steps (#507), `success() || failure()`. A module with zero findings still
      # has a valid file and is uploaded — an analysis that stops arriving reads as the tool switched off.
      # `head.repo.fork != true` for the coverage comment's reason (#479): on that path detekt findings do
      # not reach Code Scanning and are a review responsibility; detekt still fails the build.
      - name: Collect the detekt SARIF reports under their categories
        id: sarif
        if: (success() || failure()) && github.event.pull_request.head.repo.fork != true
        run: |
          mkdir -p build/sarif
          count=0
          for module in events-core events-bff events-importer; do
            for report in detekt main test; do
              file="$module/build/reports/detekt/$report.sarif"
              if [ ! -f "$file" ]; then
                echo "::warning::$file was not written; that analysis is not uploaded for this commit"
                continue
              fi
              case "$report" in
                detekt) category="detekt-$module" ;;
                *) category="detekt-$report-$module" ;;
              esac
              jq --arg id "$category/" '.runs[].automationDetails.id = $id' "$file" >"build/sarif/$category.sarif"
              count=$((count + 1))
            done
          done
          echo "count=$count" >>"$GITHUB_OUTPUT"
          echo "$count report(s) collected"

      - name: Upload detekt SARIF
        if: (success() || failure()) && github.event.pull_request.head.repo.fork != true && steps.sarif.outputs.count != '0'
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: build/sarif

  # A separate job in parallel with the build. On PRs it is INFORMATIONAL: findings reach Code Scanning
  # and never block a merge, so a flaky NVD API cannot hold up PRs. The enforced scan is
  # dependency-check-scheduled.yml, which seeds the NVD cache this job restores.
  dependency-check:
    name: OWASP Dependency-Check (informational)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Uploading the Dependency-Check SARIF report to Code Scanning.
      security-events: write
      # Required for workflows in private repositories.
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25 (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # The NVD cache the nightly scan seeds on main; a warm one skips the NVD update (`nvd.validForHours`).
      # Read-only here.
      - name: Restore NVD database cache
        id: nvd-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/dependency-check-data
          key: dependency-check-data-${{ github.run_id }}
          restore-keys: |
            dependency-check-data-

      # Non-blocking, so PRs are never blocked by the scan. `--no-configuration-cache`: the Aggregate task
      # reaches for `project` at execution time (upstream #478 would remove the need).
      - name: Run OWASP Dependency-Check
        id: depcheck
        continue-on-error: true
        run: ./gradlew dependencyCheckAggregate --no-configuration-cache
        env:
          # Empty on a fork's pull request, where the scan falls back to rate-limited unauthenticated NVD —
          # why `continue-on-error` matters most there. The one place a pull request touches a secret (#479).
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      # **Zero findings is only good news if something was examined.** `failBuildOnCVSS` passes trivially
      # over an empty dependency set, which a misconfigured `scanProjects` produced for months (#1087). A
      # floor of zero, not a number, because the count moves with every dependency change. Gated on the
      # scan having completed: a fork run writes no report, and that is an absent scan, not an empty one.
      - name: Assert the scan examined something
        if: steps.depcheck.outcome == 'success'
        run: scripts/scan-coverage.sh owasp build/reports/dependency-check/dependency-check-report.json

      - name: Post report to Job Summary
        if: success() || failure()
        run: |
          echo "## 🛡️ OWASP Dependency-Check (informational)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.depcheck.outcome }}" = "success" ]; then
            echo "✅ Scan completed. Findings (if any) are in the Security → Code scanning tab." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Scan did not complete (often a transient NVD API outage). This is" >> $GITHUB_STEP_SUMMARY
            echo "non-blocking on PRs — the authoritative scan runs nightly via" >> $GITHUB_STEP_SUMMARY
            echo "dependency-check-scheduled.yml." >> $GITHUB_STEP_SUMMARY
          fi

      # Only when the report exists; an aborted scan would otherwise fail with a "Path does not exist" that
      # masks the cause. The `hashFiles` guard fails *silently*: if the plugin moves its output directory
      # again (13.0.0 did), uploads stop and the job stays green. Re-check on every plugin upgrade.
      - name: Upload SARIF to GitHub Code Scanning
        if: (success() || failure()) && github.event.pull_request.head.repo.fork != true && hashFiles('build/reports/dependency-check/dependency-check-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: build/reports/dependency-check/dependency-check-report.sarif
          category: owasp-dependency-check

      - name: Upload HTML report as artifact
        if: (success() || failure()) && hashFiles('build/reports/dependency-check/dependency-check-report.html') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-check-report
          path: build/reports/dependency-check/dependency-check-report.html


  # **The required context, and the only job here that always runs.** A conditional job cannot be a
  # required check: GitHub leaves an unreported context Pending forever (#443, #494). This job always
  # reports and fails when the build failed; it does not rely on "a skipped job counts as success".
  # `dependency-check` is deliberately NOT a dependency: informational, `continue-on-error`, and its
  # `NVD_API_KEY` is empty on a fork.
  gate:
    name: Build & Test (backend)
    needs: [ detect-changes, build ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Report the build's result
        env:
          CHANGES_RESULT: ${{ needs.detect-changes.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          echo "detect-changes: $CHANGES_RESULT · build: $BUILD_RESULT"
          # A failed detection must not be reported as a pass — it would silently gate nothing.
          if [ "$CHANGES_RESULT" != 'success' ]; then
            echo "::error::change detection did not succeed ($CHANGES_RESULT); refusing to report a pass"
            exit 1
          fi
          case "$BUILD_RESULT" in
            success) echo 'The backend build ran and passed.' ;;
            skipped) echo 'No backend files changed; there was nothing to build.' ;;
            *)       echo "::error::backend build result: $BUILD_RESULT"; exit 1 ;;
          esac
