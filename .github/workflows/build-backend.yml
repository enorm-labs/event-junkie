# source: https://github.com/gradle/actions
# full documentation: https://github.com/gradle/actions/blob/main/docs/setup-gradle.md
name: Build & Test Backend

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'events-frontend/**'
      - '*.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
    # No `paths-ignore:` here, deliberately, since #494. `Build & Test (backend)` is **required** on
    # the `main` ruleset, and a required check that never runs stays Pending forever, deadlocking
    # every pull request that happens to touch only the ignored paths. The filtering moved to the
    # `detect-changes` job below, which is what keeps a documentation-only pull request from paying
    # for a 7-minute Gradle build: the work is skipped, the context still reports. The `push:` filter
    # above keeps its paths — nothing requires those runs.
  # Manual trigger, for when the automatic ones cannot be relied on: an Actions incident can drop
  # most webhooks, and pull requests then merge with no run ever created — `gh run rerun` is no help
  # when there is no run to re-run. Ignores the path filters above, so it
  # also serves "build this ref anyway". Pick the branch to run it on from the Actions tab, or
  # `gh workflow run build-backend.yml --ref <branch>`.
  workflow_dispatch:

# Scoped per job rather than at workflow level, since #383: a workflow-level grant applies to every
# job, including ones that have no use for it, and `pull-requests: write` is exactly the token an
# attacker would want. Only `build` posts a coverage comment; only the two jobs that upload SARIF get
# `security-events: write`.
permissions:
  contents: read

jobs:
  # Seconds, and no checkout: the pull request's file list comes from the API. This exists so the
  # required context at the bottom can be unconditional while the 7-minute build stays conditional.
  # The patterns mirror the `push:` trigger's `paths-ignore` — a change is irrelevant to the backend
  # only when *every* file in it is under events-frontend/, docs/, or a root-level *.md.
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Decide whether the backend is affected
        id: filter
        env:
          # Read through `env:` rather than interpolated into the script — a `${{ }}` expression
          # expanded inside `run:` is the template-injection shape zizmor rejects.
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')"
          # An empty list means the API call went wrong, not that nothing changed. Failing here is
          # correct: the gate below refuses to report a pass when detection did not succeed, so the
          # pull request blocks visibly instead of skipping a build that was needed.
          if [ -z "$FILES" ]; then
            echo '::error::no changed files returned for this pull request'
            exit 1
          fi
          printf '%s\n' "$FILES" | sed 's/^/  /'
          # Anything that is NOT ignorable makes the backend relevant. Note `^[^/]*\.md$` rather
          # than `\.md$`: the `push:` filter's `*.md` matches root-level Markdown only, so
          # .github/prompts/*.md is a backend-relevant change and is treated as one here too.
          #
          # Filter-then-test rather than `grep -qv`: the two forms are not equivalent in every grep,
          # and this one says what it means — drop the ignorable paths, then ask whether anything is
          # left.
          if printf '%s\n' "$FILES" | grep -vE '^(events-frontend/|docs/|[^/]*\.md$)' | grep -q .; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
          else
            echo 'relevant=false' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Backend build
    needs: detect-changes
    if: needs.detect-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # The sticky Kover coverage comment on pull requests.
      pull-requests: write
      # Uploading the three detekt SARIF reports to Code Scanning.
      security-events: write

    # Kotlin warnings fail the build here, and only here — see `warningsAsErrors` in the root
    # build.gradle.kts for why it is CI-only. Set as an environment variable rather than `-P` on
    # each step for two reasons: every Gradle invocation in the job gets it without the flag being
    # forgotten on a step added later, and the value stays identical across steps, so they keep
    # sharing one configuration-cache entry (a project property is part of the cache key, so
    # flagging some steps and not others would silently double the cache misses).
    env:
      ORG_GRADLE_PROJECT_warningsAsErrors: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25 (Temurin)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Lint with ktlint
        run: ./gradlew ktlintCheck

      - name: Static analysis with detekt
        run: ./gradlew detekt

      - name: Post detekt report to Job Summary
        if: success() || failure()
        run: |
          echo "## 🔍 Detekt Static Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for report in */build/reports/detekt/detekt.md; do
            module=$(echo "$report" | cut -d'/' -f1)
            # Replace the generic "# detekt" heading with a module-specific one
            sed "s/^# detekt$/# detekt — ${module}/" "$report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "---" >> $GITHUB_STEP_SUMMARY
          done

      # `-x koverVerify` alongside `-x test`: `koverVerify` is attached to `check` (so a local
      # `./gradlew build` enforces the coverage floors), but skipping tests means there is no
      # execution data — every module reports 0% and the rule fails for the wrong reason. The
      # verification runs for real in the coverage step below, after `test`.
      - name: Build all modules
        run: ./gradlew build -x test -x koverVerify

      - name: Run tests
        run: ./gradlew test

      # Enforces the runtime-dependency licence policy in config/allowed-licenses.json
      # (docs/LEGAL.md §9.2). Deliberately a separate step rather than wired into
      # `check`: the plugin is not configuration-cache compatible, so attaching it to the main
      # build would discard the cache entry on every run. `--no-configuration-cache` keeps the cost
      # contained to this step.
      - name: Check dependency licences
        run: ./gradlew checkLicense --no-configuration-cache

      # `koverVerify` here rather than in the build step, because this runs after `test` and so has
      # execution data to measure. The per-module floors are in the root build.gradle.kts.
      - name: Generate Kover coverage reports and verify the floors
        run: ./gradlew koverXmlReport koverLog koverVerify

      - name: Post coverage to Job Summary
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 Test Coverage (Kover)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat build/kover/coverage.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # Build the container images, and deliberately do not push them. This workflow runs on every
      # pull request, including from forks — publishing from here would put an image built from
      # unreviewed code into GHCR. Pushing belongs to release.yml.
      #
      # What this catches is the rot `validate-infra.yml` exists to catch, in a different medium: a
      # Dockerfile that stopped building months ago and nobody noticed until the afternoon it was
      # needed. It is not a correctness gate — a built image is not a started one.
      #
      # Pull requests only, since #264: on a push to `main` release.yml builds the same two images
      # from the same Dockerfiles and then pushes them, so doing it here as well would be six
      # multi-platform builds per merge instead of three, to learn the same thing twice.
      #
      # **These five steps run BEFORE anything that posts to the pull request, and the order is
      # load-bearing (#507).** `if: github.event_name == 'pull_request'` carries an implicit
      # `success()`, so a failure anywhere above skips every step below it. With the coverage
      # comment ahead of these, a GitHub API error — a 404 from the compare endpoint, a 503 during
      # an incident — turned the job red for a cosmetic reason *and* silently dropped the image
      # build. Silently, because a skipped step produces no annotation: the job is red for the
      # comment, nobody reads further, and the missing build leaves no trace.
      #
      # It happened on #506, which changed the JRE base image in both Dockerfiles — the one pull
      # request where "do these still build, on both architectures" mattered most was the one where
      # it did not run. Verification first, reporting last.
      - name: Extract the layered jars
        if: github.event_name == 'pull_request'
        run: ./gradlew :events-bff:bootJarLayers :events-importer:bootJarLayers

      # `scripts/version.sh` is the single place that knows what version a commit is, and it derives
      # everything from `gradle.properties` — what `bootBuildInfo` stamps into build-info.properties
      # and serves at /actuator/info. Taking the number from anywhere else would let the image label
      # and the running instance disagree. On a pull request this yields the same snapshot string
      # release.yml would compute, so the label matches what merging would publish.
      - name: Read the project version
        id: version
        if: github.event_name == 'pull_request'
        run: echo "value=$(scripts/version.sh compute)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: github.event_name == 'pull_request'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # No QEMU and no per-architecture runner, because neither Dockerfile contains a `RUN` — see
      # the header comment in events-bff/Dockerfile. Both platforms genuinely build here.
      #
      # `type=cacheonly` because a multi-platform image cannot be loaded into the local daemon:
      # `load: true` would fail, and dropping to a single platform would leave arm64 unbuilt, which
      # is the architecture the Hetzner nodes actually run (#424).
      - name: Build events-bff image (amd64 + arm64, no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: events-bff/build/docker
          file: events-bff/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=cacheonly
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}

      - name: Build events-importer image (amd64 + arm64, no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: events-importer/build/docker
          file: events-importer/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=cacheonly
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}

      # LAST ON PURPOSE — it reaches the GitHub API, so it is the step most likely to fail for a
      # reason that has nothing to do with the code (#507). Nothing runs after it, so when it does,
      # it takes nothing down with it.
      #
      # It is not merely cosmetic, which is why it is not `continue-on-error`. It carries one gate
      # nothing else does:
      #
      #   * `min-coverage-overall: 60`      — redundant. `koverVerify` above already enforces an
      #                                       aggregate floor of 90 and per-module floors, and it
      #                                       runs earlier, so a real shortfall fails before here.
      #   * `min-coverage-changed-files: 80` — UNIQUE. Gradle has per-module and aggregate rules and
      #                                       nothing per-changed-file. Removing this loses it.
      #
      # SKIPPED ON A FORK'S PULL REQUEST, and that is not a nicety (#479). A fork PR gets a
      # **read-only** `GITHUB_TOKEN`, so posting a comment is impossible however the step is
      # written — and without this guard the run goes red on the one contribution path where a
      # first-time contributor has no way to tell a broken repository from a permission they were
      # never going to have. `release.yml` guards its SARIF uploads on the same expression.
      #
      # The cost is real and worth naming rather than hiding: **the `min-coverage-changed-files: 80`
      # gate does not run on fork pull requests.** It is unique to this step, so on that path it has
      # to be a review responsibility. `koverVerify` above still runs and still enforces the
      # aggregate and per-module floors, which is the larger half.
      - name: Post coverage to Pull Request
        id: coverage
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true
        uses: mi-kas/kover-report@fe40bd3712cf57dd19bfb0c16ccb0472a0478dae # v2.6
        with:
          path: build/reports/kover/report.xml
          title: Code Coverage
          update-comment: true
          min-coverage-overall: 60
          min-coverage-changed-files: 80

      # The step above fails the same way for two very different reasons — coverage on changed files
      # below 80%, or GitHub being unable to serve an API call — and its error message is the only
      # thing that distinguishes them. This says so in the job summary, so the next person does not
      # re-derive it from the log. Same shape as validate-scripts.yml's "Explain the fix".
      - name: Say which kind of coverage failure this was
        if: always() && steps.coverage.outcome == 'failure'
        run: |
          {
            echo "## Coverage comment failed"
            echo
            echo "**The build itself passed.** ktlint, detekt, compilation, tests, the licence check,"
            echo "the Kover floors and both container images all ran and succeeded before this step —"
            echo "that is why it is last."
            echo
            echo "Two things fail here, and the error message above is what tells them apart:"
            echo
            echo "| Message | Meaning |"
            echo "| --- | --- |"
            echo "| Coverage below \`min-coverage-changed-files\` | **Real.** Files changed by this PR are under 80% covered. Add tests |"
            echo "| \`Not Found\`, \`503\`, \`No server is currently available\` | **Not yours.** A GitHub API error. Check githubstatus.com, then re-run |"
            echo
            echo "\`min-coverage-overall: 60\` is not the cause: \`koverVerify\` enforces 90 aggregate"
            echo "plus per-module floors and runs earlier, so it would have failed first."
          } >> "$GITHUB_STEP_SUMMARY"

      # Upload each module's SARIF report separately with a unique category. GitHub Code Scanning
      # supports multiple SARIF uploads per commit when each has a distinct category. See:
      # https://docs.github.com/en/code-security/code-scanning/integrating-with-code-scanning/uploading-a-sarif-file-to-github
      #
      # Last, with the other GitHub-API steps (#507), and `success() || failure()` on each so they
      # run regardless of what failed above — including each other. detekt wrote these files near the
      # top of the job; nothing since then removes them.
      #
      # `head.repo.fork != true` for the same reason the coverage comment above carries it, and it is
      # the same guard `release.yml` and `image-scan-scheduled.yml` already put on their own uploads
      # (#479). A fork's `GITHUB_TOKEN` is read-only, so `security-events: write` is not granted and
      # the Code Scanning API answers 403 — which fails the step, and turns every fork pull request
      # red for a reason the contributor did not cause and cannot fix. The cost is worth naming: on
      # that path **detekt findings do not reach Code Scanning at all**, so they are a review
      # responsibility, exactly as the per-changed-file coverage threshold already is. detekt itself
      # still runs and still fails the build, which is the larger half.
      - name: Upload detekt SARIF (events-core)
        if: (success() || failure()) && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: events-core/build/reports/detekt/detekt.sarif
          category: detekt-events-core
      - name: Upload detekt SARIF (events-bff)
        if: (success() || failure()) && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: events-bff/build/reports/detekt/detekt.sarif
          category: detekt-events-bff
      - name: Upload detekt SARIF (events-importer)
        if: (success() || failure()) && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: events-importer/build/reports/detekt/detekt.sarif
          category: detekt-events-importer

  # OWASP Dependency-Check runs as a separate job in parallel with the build to avoid
  # slowing down the main feedback loop.
  #
  # On PRs this job is INFORMATIONAL and non-blocking: it surfaces newly introduced
  # vulnerable dependencies in GitHub Code Scanning but never blocks a merge, so a
  # flaky/unavailable NVD API can't hold up PRs. The authoritative, enforced scan runs
  # nightly in dependency-check-scheduled.yml, which also seeds the shared NVD cache on
  # main that this job restores (caches created on main are restorable from PR branches).
  dependency-check:
    name: OWASP Dependency-Check (informational)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Uploading the Dependency-Check SARIF report to Code Scanning.
      security-events: write
      # Required for workflows in private repositories.
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25 (Temurin)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Restore the NVD database cache seeded by the nightly scheduled scan on main.
      # A warm cache lets the build skip the NVD update entirely (see nvd.validForHours
      # in build.gradle.kts), so PR runs are fast and not exposed to NVD API outages.
      # This job is read-only on the cache — the scheduled workflow owns seeding it.
      - name: Restore NVD database cache
        id: nvd-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/dependency-check-data
          key: dependency-check-data-${{ github.run_id }}
          restore-keys: |
            dependency-check-data-

      # Non-blocking: a failure here (e.g. NVD unreachable on a cold cache) is recorded
      # but does not fail the job, so PRs are never blocked by the dependency scan.
      # --no-configuration-cache: the Dependency-Check plugin's Aggregate task reaches for
      # `project` at execution time and so cannot be used with the configuration cache
      # (enabled in gradle.properties). Upstream PR #478, open at 13.0.0, would remove the need.
      - name: Run OWASP Dependency-Check
        id: depcheck
        continue-on-error: true
        run: ./gradlew dependencyCheckAggregate --no-configuration-cache
        env:
          # Empty on a pull request from a fork — secrets are not exposed to forked `pull_request`
          # runs. The scan then falls back to unauthenticated NVD access, which is heavily rate
          # limited, which is why `continue-on-error` above matters more on that path than on ours.
          # This is also the one place a pull request touches a repository secret at all, so it is
          # the counter-example to "no pull request can reach a secret" (#479).
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Post report to Job Summary
        if: success() || failure()
        run: |
          echo "## 🛡️ OWASP Dependency-Check (informational)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.depcheck.outcome }}" = "success" ]; then
            echo "✅ Scan completed. Findings (if any) are in the Security → Code scanning tab." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Scan did not complete (often a transient NVD API outage). This is" >> $GITHUB_STEP_SUMMARY
            echo "non-blocking on PRs — the authoritative scan runs nightly via" >> $GITHUB_STEP_SUMMARY
            echo "dependency-check-scheduled.yml." >> $GITHUB_STEP_SUMMARY
          fi

      # Only upload when the report exists. If the scan aborts (e.g. an NVD update
      # failure), no report is written and these steps would otherwise fail with a
      # confusing "Path does not exist" error that masks the real cause.
      # NOTE: the `hashFiles` guard fails *silently* — if this path ever stops matching
      # where the plugin writes, the upload is skipped and the job still goes green while
      # findings quietly stop reaching Code Scanning. Dependency-Check 13.0.0 moved the
      # default output directory to build/reports/dependency-check/, so re-check this path
      # whenever the plugin is upgraded.
      - name: Upload SARIF to GitHub Code Scanning
        if: (success() || failure()) && github.event.pull_request.head.repo.fork != true && hashFiles('build/reports/dependency-check/dependency-check-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: build/reports/dependency-check/dependency-check-report.sarif
          category: owasp-dependency-check

      - name: Upload HTML report as artifact
        if: (success() || failure()) && hashFiles('build/reports/dependency-check/dependency-check-report.html') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-check-report
          path: build/reports/dependency-check/dependency-check-report.html


  # **This is the required context, and it is the only job here that always runs.** The build above
  # is conditional, and a conditional job cannot be a required check: GitHub leaves an unreported
  # context Pending forever, which reads as a hung check rather than a misconfiguration (#443, #494).
  # So the requirement is placed on a job that always reports, and which fails when the build failed.
  #
  # Deliberately not relying on "a skipped job counts as success" — GitHub documents that, but
  # AGENTS.md recorded those semantics as unverified, and this shape does not need them to hold.
  #
  # `dependency-check` is deliberately NOT a dependency of this job: it is informational, it is
  # `continue-on-error`, and its NVD_API_KEY is empty on a fork run. Gating merges on it would make
  # an unauthenticated NVD rate limit into a blocked pull request.
  gate:
    name: Build & Test (backend)
    needs: [ detect-changes, build ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Report the build's result
        env:
          CHANGES_RESULT: ${{ needs.detect-changes.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          echo "detect-changes: $CHANGES_RESULT · build: $BUILD_RESULT"
          # A failed detection must not be reported as a pass — it would silently gate nothing.
          if [ "$CHANGES_RESULT" != 'success' ]; then
            echo "::error::change detection did not succeed ($CHANGES_RESULT); refusing to report a pass"
            exit 1
          fi
          case "$BUILD_RESULT" in
            success) echo 'The backend build ran and passed.' ;;
            skipped) echo 'No backend files changed; there was nothing to build.' ;;
            *)       echo "::error::backend build result: $BUILD_RESULT"; exit 1 ;;
          esac
