name: Validate Helm Chart

# `helm lint`, `helm template`, `flux schema validate` and `helm unittest` are pure functions of the
# working tree — no cluster, no kubeconfig — which is what makes them safe in CI at all. A syntax and
# shape gate, not a correctness one: `scripts/k3d-rehearsal.sh` is what proves a pod starts. `helm
# unittest` earns its keep because lint and schema both pass on a chart that quietly does the wrong
# thing — an ingress routing /actuator, an importer at two replicas (#430).

# The version scripts are in the `push:` filter because `version-test.sh` runs here, where Helm is.
# On pull requests the filter is moot — since #443 this workflow runs on every one.

on:
  push:
    branches: [ main ]
    paths:
      - 'deploy/**'
      - 'scripts/cluster-assertions.sh'
      - 'scripts/k3d-rehearsal.sh'
      - 'scripts/version.sh'
      - 'scripts/version-test.sh'
      - 'scripts/uid-consistency.sh'
      - 'scripts/csp-parity.sh'
      - 'scripts/architecture-diagram.sh'
      # The committed inventories, which are a function of the chart and each cluster's values.
      - 'docs/architecture/**'
      # The coverage floors this workflow asserts. Editing the baseline without a run lowers a floor unnoticed.
      - 'scripts/scan-coverage.sh'
      - 'scripts/scan-coverage-baseline.txt'
      # The other two files csp-parity.sh reads; editing one alone is the drift it catches.
      - 'events-frontend/scripts/csp.ts'
      - 'events-frontend/index.html'
      # The Dockerfiles, because `scripts/uid-consistency.sh` reads their `USER` line against the chart's.
      - 'events-bff/Dockerfile'
      - 'events-importer/Dockerfile'
      - 'events-frontend/Dockerfile'
      - 'gradle.properties'
      - 'events-frontend/package.json'
      - '.github/workflows/validate-chart.yml'
  pull_request:
    branches: [ main ]
    # No `paths:` here (#443): these checks are **required**, and a required check that never runs stays
    # Pending forever, deadlocking every pull request that does not touch these paths. Affordable
    # because the whole workflow is seconds. The `push:` filter keeps its paths.
  workflow_dispatch:

permissions:
  contents: read

env:
  CHART: deploy/charts/event-junkie
  # Matched to the Helm SDK helm-controller embeds — the client that gates the chart is the one that
  # installs it. It was 3.x until #1006 on a lapsed premise, and Helm 4's `--strict` rejects an unknown
  # `Chart.yaml` key that 3's let through: **the gate must not be weaker than the hook in front of
  # it.** Every copy of this pin moves together.
  HELM_VERSION: 4.3.0
  # `flux schema validate` replaced kubeconform (#414). Strings in YAML, invisible to Dependabot, so
  # Renovate's `customManagers` watch them (ADR-024).
  FLUX_VERSION: 2.9.5
  FLUX_SCHEMA_VERSION: 0.14.0
  # `ubuntu-latest` preinstalls an older ShellCheck than a local install, old enough to disagree about
  # SC2015. **This pin appears in three workflows** and they move together.
  SHELLCHECK_VERSION: v0.11.0
  # Installed onto the Helm above rather than run from the `helmunittest/helm-unittest` image (#430):
  # the image pins a Helm and a plugin together, and its plugin has no `--values` flag, which is how
  # `scripts/cluster-assertions.sh` feeds each cluster's `spec.values` in. Watched by Renovate.
  HELM_UNITTEST_VERSION: v1.1.2

jobs:
  lint:
    name: Lint & render
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # The whole history and every tag: `version-test.sh` computes real snapshot versions from them
      # (ADR-032); a shallow clone would compute `0.0.0-local`.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # `security.runAsUser` must match the `USER` line in the three Dockerfiles, and a comment is not a
      # gate. `helm unittest` sees only the chart. A mismatch does not look like a values problem: the pod
      # starts non-root either way, and then the JVM cannot read its own jar (#448).
      - name: Check the chart and the images agree about the UID
        run: scripts/uid-consistency.sh "$CHART"

      # The Content-Security-Policy in the chart and in `events-frontend/scripts/csp.ts`, plus the
      # `script-src` hash from index.html: editing the theme script without the policy blocks it, and the
      # only symptom is a theme flash.
      - name: Check the chart and the frontend agree about the CSP
        run: scripts/csp-parity.sh "$CHART"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      # Whether the versions **order** (#455): `0.1.0-snapshot.g<sha>` lint-passed and published, and gave
      # staging's `>=0.0.0-0` no way to mean "newest" — Flux resolved whichever short sha sorted highest in
      # ASCII while reporting Ready. Fabricated version sets through Helm's own Masterminds solver, the
      # library source-controller embeds, so this is the comparison the cluster makes. Here because this
      # is where Helm is.
      - name: Assert snapshot versions order
        run: scripts/version-test.sh "$CHART"

      # `flux schema validate` rather than kubeconform (#414): the same JSON Schema, plus CEL rules with
      # the API server's semantics, duplicate YAML keys (which parse silently and once dropped
      # `kubernetes.io/description` from ingress.yaml), and SOPS-encrypted fields without decrypting them.
      # One tool for the chart and the Flux resources. `flux plugin install` verifies its cosign signature.
      - name: Install Flux and the schema plugin
        run: |
          curl -fsSL \
            "https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}/flux_${FLUX_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin flux
          flux plugin install "schema@${FLUX_SCHEMA_VERSION}"
          flux schema --version

      # `--strict` promotes the chart guide's conventions from warnings to failures.
      #
      # The base values.yaml cannot render alone: `database.host`, `database.existingSecret` and
      # `networkPolicy.databaseCidr` are `required`, which is the point. **`values-k3d-images.yaml` is an
      # overlay** on `values-k3d.yaml`, rendered here the way `k3d-rehearsal.sh` uses it (#691). Enumerated,
      # not globbed: a new values file fails here until somebody says how it composes, instead of rendering
      # standalone and reporting success.
      - name: Assert the values files are the ones this job knows how to compose
        run: |
          set -euo pipefail
          expected='values-k3d-images.yaml values-k3d.yaml'
          actual="$(cd "$CHART" && echo values-*.yaml | tr ' ' '\n' | sort | tr '\n' ' ')"
          actual="${actual% }"
          if [ "$actual" != "$expected" ]; then
            echo "values files changed: expected '$expected', found '$actual'" >&2
            echo "Add it to the Lint and render steps below, layered or standalone as it is used." >&2
            exit 1
          fi

      - name: Lint
        run: |
          set -euo pipefail
          helm lint --strict "$CHART" \
            --set database.host=10.0.1.2 --set database.existingSecret=events-db \
            --set networkPolicy.databaseCidr=10.0.1.2/32
          echo "== values-k3d.yaml =="
          helm lint --strict "$CHART" --values "$CHART/values-k3d.yaml"
          echo "== values-k3d.yaml + values-k3d-images.yaml =="
          helm lint --strict "$CHART" \
            --values "$CHART/values-k3d.yaml" --values "$CHART/values-k3d-images.yaml"

      # `ecosystem` carries the CRDs this chart renders instances of but does not ship. Every render
      # reports **Skipped: 0**, and that is the number to watch — `--skip-missing-schemas` is deliberately
      # absent. **`Skipped: 0` says nothing on its own** (#691): an empty stream from a failed `helm
      # template` also reports `Valid: 0, Invalid: 0, Skipped: 0`, and `set -o pipefail` is what makes the
      # number mean something. The HelmRelease loop (#265) is what schema-checks the two configurations that
      # actually deploy; `cluster-assertions.sh` reads those values but cannot tell a malformed Middleware.
      - name: Validate rendered manifests
        run: |
          set -euo pipefail
          # `scan-coverage.sh render` makes the paragraph above an assertion: every resource validated, none
          # skipped, the count positive (#1087).
          render() {
            helm template validate "$CHART" "$@" \
              | flux schema validate - -s ecosystem --verbose \
              | tee "${RUNNER_TEMP}/render.txt"
            scripts/scan-coverage.sh render "${RUNNER_TEMP}/render.txt"
          }
          render --set database.host=10.0.1.2 --set database.existingSecret=events-db \
            --set networkPolicy.databaseCidr=10.0.1.2/32
          echo "== values-k3d.yaml =="
          render --values "$CHART/values-k3d.yaml"
          echo "== values-k3d.yaml + values-k3d-images.yaml =="
          render --values "$CHART/values-k3d.yaml" --values "$CHART/values-k3d-images.yaml"
          # A HelmRelease is not a values document; `spec.values` is extracted as cluster-assertions.sh does it.
          for release in deploy/clusters/*/helm-release.yaml; do
            echo "== $release =="
            yq -N '.spec.values' "$release" > /tmp/release-values.yaml
            helm lint --strict "$CHART" --values /tmp/release-values.yaml
            render --values /tmp/release-values.yaml
          done

      # The Flux custom resources (#414), which nothing else here can see: a typo in `spec.ref.semver` is an
      # environment that silently stops updating. `kustomization.yaml` is skipped by kind (a build file,
      # legitimately without `metadata.name`). `--skip-json-path v1/Secret:/sops` strips the block SOPS adds,
      # which Flux removes at apply time (#416). DELIBERATELY NOT `--skip-kind v1/Secret`, which would switch
      # the gate off for every Secret; stripping one path keeps the Secret validated.
      - name: Validate the Flux manifests
        run: |
          set -euo pipefail
          flux schema validate deploy/clusters -s ecosystem --verbose \
            --skip-kind kustomize.config.k8s.io/v1beta1/Kustomization \
            --skip-json-path v1/Secret:/sops \
            | tee "${RUNNER_TEMP}/flux-clusters.txt"

      # The step above passes on a `deploy/clusters` that has quietly stopped being read — every such case
      # reports `Invalid: 0` (#1087). These two are how much it read.
      - name: Assert the Flux manifests are all still being read
        run: |
          scripts/scan-coverage.sh baseline flux-clusters-resources "${RUNNER_TEMP}/flux-clusters.txt"
          scripts/scan-coverage.sh baseline flux-clusters-files "${RUNNER_TEMP}/flux-clusters.txt"

      - name: Install the helm-unittest plugin
        run: |
          # `--verify=false` is required from Helm 4 on: this source publishes no provenance.
          helm plugin install https://github.com/helm-unittest/helm-unittest \
            --version "$HELM_UNITTEST_VERSION" --verify=false
          helm unittest --help >/dev/null

      # The chart's own suites under the two value sets it renders from alone. `--strict` makes an unknown
      # key in a suite an error.
      - name: Assert on the rendered chart
        run: helm unittest --strict "$CHART"

      # The other three value sets live in each cluster's HelmRelease and cannot be named in a suite. This
      # extracts `spec.values` from each and re-runs the invariant suites, so the assertions gate what Flux
      # deploys — and carries the assertions *between* files no single render can see: no pinned image tag,
      # `dependsOn` on a ClusterIssuer, every third-party chart pinned.
      - name: Assert on the cluster configurations
        run: scripts/cluster-assertions.sh "$CHART"

      # What each environment deploys, as sorted text, against what is committed under
      # `docs/architecture/`. The assertions above say the chart is well formed; this says the shape
      # of the deployment has not changed behind the hand-written diagrams in PLATFORM_SETUP.md,
      # which no generator maintains. ADR-034.
      - name: Check the committed inventories still match the chart
        run: scripts/architecture-diagram.sh check

  # The job name **`ShellCheck deploy-story scripts`** is a required status check on the `main` ruleset:
  # **the name here and the context in the ruleset are one string in two places.** Change one without
  # the other and pull requests stop being mergeable rather than start failing. #430 deleted this job
  # once on the reasoning that `deploy/scripts/` no longer existed; the scripts had moved, not vanished.
  shellcheck:
    name: ShellCheck deploy-story scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # All seven are part of the deploy story, so a chart change lints them even when nothing under
      # `scripts/` moved. **The overlap with validate-scripts.yml is deliberate**: that one is not required
      # and carries a `paths:` filter, so this is the job that makes shell linting a merge gate. From the
      # pinned image, so the two cannot reach different verdicts.
      - name: Run ShellCheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            "koalaman/shellcheck:${SHELLCHECK_VERSION}" \
            -x scripts/cluster-assertions.sh scripts/k3d-rehearsal.sh \
            scripts/version.sh scripts/version-test.sh scripts/uid-consistency.sh \
            scripts/csp-parity.sh scripts/architecture-diagram.sh
