name: Validate Helm Chart

# `helm lint`, `helm template`, `flux schema validate` and `helm unittest` are pure functions of the
# working tree — they reach no cluster and need no kubeconfig, which is what makes them safe to run
# in CI at all (docs/ops/PLATFORM_SETUP.md §4: nothing outside the cluster holds a credential for it).
#
# So this is a syntax and shape gate, not a correctness one. It cannot tell you a pod starts — the
# k3d rehearsal does that, and `scripts/k3d-rehearsal.sh` is where. What it catches
# is the failure mode that actually happens to deployment code nobody runs daily: a chart that
# stopped rendering months ago and nobody noticed until the afternoon it was needed.
#
# `helm unittest` is the part that earns its keep. Lint and schema validation both pass on a chart
# that quietly does the wrong thing — an ingress that routes /actuator, an importer scaled to two
# replicas, a selector carrying a label that changes on every release. It replaced
# `deploy/scripts/render-assertions.sh` in #430, and it also asserts two things that script
# structurally could not: that the chart *refuses* to render without `database.host` or
# `database.existingSecret` and says what to do about it, and that `values.schema.json` still
# rejects a second importer replica.

# `gradle.properties` and `events-frontend/package.json` are in the `push:` filter because the chart's
# `version` and `appVersion` must equal the base version they declare (#264). Editing one of them
# without the chart is exactly how they drift. On pull requests the question is moot — since #443
# this workflow runs on every one of them.

on:
  push:
    branches: [ main ]
    paths:
      - 'deploy/**'
      - 'scripts/cluster-assertions.sh'
      - 'scripts/k3d-rehearsal.sh'
      - 'scripts/version.sh'
      - 'scripts/version-test.sh'
      - 'gradle.properties'
      - 'events-frontend/package.json'
      - '.github/workflows/validate-chart.yml'
  pull_request:
    branches: [ main ]
    # No `paths:` here, deliberately, since #443. These checks are **required** on the `main`
    # ruleset, and a required check that never runs stays Pending forever — GitHub's own words:
    # "A pull request that requires those checks to be successful will be blocked from merging."
    # So a filter here would deadlock every pull request that happens not to touch these paths.
    # Affordable because the whole workflow is seconds: the chart, the Flux resources and the version consistency check.
    # The `push:` filter above keeps its paths — nothing requires those runs.
  workflow_dispatch:

permissions:
  contents: read

env:
  CHART: deploy/charts/event-junkie
  # Flux's helm-controller embeds the Helm 3 SDK, so the chart is gated against a Helm 3 client even
  # though local binaries are Helm 4. A chart that only renders under Helm 4 is a chart Flux cannot
  # install (#414), and that would not surface until the deployment pipeline itself was being built.
  HELM_VERSION: v3.21.3
  # `flux schema validate` replaced kubeconform in #414. Both pinned, both invisible to Dependabot —
  # they are strings in YAML, not a manifest — so /update-dependencies step 12 sweeps them.
  FLUX_VERSION: 2.9.4
  FLUX_SCHEMA_VERSION: 0.11.0
  # Pinned for the reason validate-scripts.yml sets out at length: `ubuntu-latest` preinstalls an
  # older ShellCheck than a current local install, old enough to disagree about SC2015. **This pin
  # appears in three workflows** — here, validate-infra.yml and validate-scripts.yml — and they must
  # move together, the same rule HELM_VERSION carries. Three pins that can drift are a weaker
  # version of the problem pinning was meant to remove.
  SHELLCHECK_VERSION: v0.11.0
  # Pinned like everything else here, and installed onto the Helm above rather than run from the
  # `helmunittest/helm-unittest` image (#430). The image's tags pin a Helm and a plugin version
  # together, which reads like the safer option — but its newest Helm 3 tag carries plugin 1.0.3,
  # which has no `--values` flag, and that flag is how `scripts/cluster-assertions.sh` feeds each
  # cluster's `spec.values` in. Installing the plugin keeps HELM_VERSION exact and gets a plugin
  # that can do it. Invisible to Dependabot, like the pins above — /update-dependencies step 12
  # sweeps it.
  HELM_UNITTEST_VERSION: v1.1.2

jobs:
  lint:
    name: Lint & render
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # First, because it is the cheapest gate here and the one whose failure invalidates the rest:
      # a chart whose `appVersion` disagrees with `gradle.properties` renders and lints perfectly
      # while naming image tags the release build will never produce (#264).
      - name: Check the version is consistent across all four files
        run: scripts/version.sh check

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      # The step above asks whether the four files agree; this one asks whether the versions they
      # produce **order**, which is a different question and the one that went unasked for three
      # days (#455). `0.1.0-snapshot.g<sha>` agreed with everything, lint-passed, published fine —
      # and gave staging's `>=0.0.0-0` no way to mean "newest", so Flux resolved whichever short sha
      # sorted highest in ASCII while reporting Ready throughout.
      #
      # It resolves fabricated version sets through Helm's own Masterminds constraint solver, which
      # is the library Flux's source-controller embeds, so this is the same comparison the cluster
      # makes. Runs here rather than in validate-scripts.yml purely because that is where Helm is —
      # and it is pinned to the Helm 3 the helm-controller uses, which is the version whose verdict
      # actually matters.
      - name: Assert snapshot versions order
        run: scripts/version-test.sh "$CHART"

      # `flux schema validate` rather than kubeconform, since #414. It validates the same manifests
      # against the same kind of JSON Schema, and then three things kubeconform cannot:
      #
      #   * **CEL rules, with the API server's own evaluation semantics** — so a manifest that passes
      #     here is one the API server will accept, not merely one that is shaped correctly.
      #   * **Duplicate YAML keys**, which parse silently and drop the earlier value. That is exactly
      #     how the `annotations:` block in ingress.yaml lost `kubernetes.io/description` once.
      #   * **SOPS-encrypted fields, without decrypting them** — which is what makes this still work
      #     when #416 encrypts the Secrets.
      #
      # One tool covering the chart *and* the Flux resources, instead of two with different flags.
      # The plugin is pinned and `flux plugin install` verifies its cosign signature.
      - name: Install Flux and the schema plugin
        run: |
          curl -fsSL \
            "https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}/flux_${FLUX_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin flux
          flux plugin install "schema@${FLUX_SCHEMA_VERSION}"
          flux schema --version

      # --strict promotes the chart guide's own conventions — chart name, SemVer, unknown fields —
      # from warnings to failures.
      #
      # The base values.yaml cannot render on its own: database.host and database.existingSecret
      # have no safe default and the helpers `required` them, which is the point. So the default
      # case gets the two on the command line and the environment cases get theirs from their file.
      - name: Lint
        run: |
          helm lint --strict "$CHART" \
            --set database.host=10.0.1.2 --set database.existingSecret=events-db
          for values in "$CHART"/values-*.yaml; do
            echo "== $values =="
            helm lint --strict "$CHART" --values "$values"
          done

      # `ecosystem` is the catalog carrying the CRDs this chart renders instances of but does not
      # ship — cert-manager's ClusterIssuer and Traefik's Middleware — plus Flux's own. Verified to
      # cover all of them: every render below reports **Skipped: 0**, and that number is the one to
      # watch. A resource nothing can check is a resource nothing checks, which is why
      # `--skip-missing-schemas` is deliberately not used.
      #
      # The HelmRelease loop was added in #265, and it closed a gap #414 had opened without anyone
      # noticing: once per-environment configuration moved out of `values-staging.yaml` and into each
      # cluster's `spec.values`, this step stopped covering staging and production altogether. Only
      # `values-k3d.yaml` was left, so the two configurations that actually deploy were the two
      # nothing schema-checked. `scripts/cluster-assertions.sh` reads those values, but it asserts
      # about content and cannot tell you a Middleware is malformed.
      - name: Validate rendered manifests
        run: |
          render() {
            helm template validate "$CHART" "$@" | flux schema validate - -s ecosystem --verbose
          }
          render --set database.host=10.0.1.2 --set database.existingSecret=events-db
          for values in "$CHART"/values-*.yaml; do
            echo "== $values =="
            render --values "$values"
          done
          # A HelmRelease is not a values document, so `spec.values` is extracted the same way
          # scripts/cluster-assertions.sh does it.
          for release in deploy/clusters/*/helm-release.yaml; do
            echo "== $release =="
            yq -N '.spec.values' "$release" > /tmp/release-values.yaml
            helm lint --strict "$CHART" --values /tmp/release-values.yaml
            render --values /tmp/release-values.yaml
          done

      # The Flux custom resources (#414) — the objects that decide which chart version each
      # environment runs, and which nothing else here can see: `helm lint` does not know they exist
      # and `cluster-assertions.sh` reads only their `spec.values`. A typo in `spec.ref.semver` is a
      # staging environment that silently stops updating, so it is worth a schema check even though
      # it is not worth a cluster.
      #
      # The `kustomization.yaml` files are skipped by kind rather than by filename: they are kustomize
      # *build* files, not cluster resources, so they legitimately have no `metadata.name` and would
      # otherwise be reported as three schema violations.
      - name: Validate the Flux manifests
        run: |
          flux schema validate deploy/clusters -s ecosystem --verbose \
            --skip-kind kustomize.config.k8s.io/v1beta1/Kustomization

      - name: Install the helm-unittest plugin
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest \
            --version "$HELM_UNITTEST_VERSION"
          helm unittest --help >/dev/null

      # The chart's own suites, under the two value sets it can be rendered from on its own:
      # `values.yaml` plus the two required overrides, and `values-k3d.yaml`. `--strict` makes an
      # unknown key in a suite an error rather than a silently ignored line.
      - name: Assert on the rendered chart
        run: helm unittest --strict "$CHART"

      # The other three value sets — k3d, staging and production — live in each cluster's
      # HelmRelease and cannot be named inside a suite, because a HelmRelease is not a values
      # document. This extracts `spec.values` from each and re-runs the invariant suites against it,
      # so the assertions gate exactly what Flux deploys. It also carries the assertions that are
      # about relationships *between* files, which no single render can see: no published
      # HelmRelease pinning an image tag, a release that creates a ClusterIssuer declaring
      # `dependsOn`, and every third-party chart pinned to one version rather than a range.
      #
      # yq is preinstalled on ubuntu-latest runners.
      - name: Assert on the cluster configurations
        run: scripts/cluster-assertions.sh "$CHART"

  # The job name is **`ShellCheck deploy-story scripts`** and it is load-bearing: it is a required
  # status check on the `main` ruleset, and a required check that never runs stays Pending forever
  # rather than failing — which deadlocks every pull request instead of one. #430 deleted this job
  # on the reasoning that `deploy/scripts/` no longer exists, and that was wrong twice over: the
  # deadlock, and the premise. The script did not vanish, it moved.
  #
  # It was `ShellCheck deploy scripts` until #430 renamed it, because that name read as
  # `deploy/scripts/` — a directory that no longer exists — while every file it lints is under
  # `scripts/`. The rename and the ruleset edit were one change, and that is the rule: **the name
  # here and the context in the ruleset are one string in two places.** Change one without the
  # other and pull requests stop being mergeable rather than start failing.
  shellcheck:
    name: ShellCheck deploy-story scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # All four are part of the deploy story: one asserts on what each cluster's HelmRelease
      # deploys (#430), one installs this chart, one decides what version gets published, and one
      # proves those versions order (#455). So a chart change lints them even when nothing under
      # `scripts/` was touched.
      #
      # They are *also* linted by validate-scripts.yml, which covers `scripts/*.sh`. The overlap is
      # deliberate: both jobs take seconds, and narrowing either side trades that for a hole that
      # only opens when the other workflow's path filter misses. It matters more than it reads —
      # validate-scripts.yml is **not** on the required list and carries a `paths:` filter, so this
      # is the job that makes shell linting a merge gate rather than a courtesy.
      #
      # Runs from the pinned image rather than the runner's preinstalled binary, so this job and
      # validate-scripts.yml cannot reach different verdicts about the files they both lint — which
      # is exactly what the version skew would produce.
      - name: Run ShellCheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            "koalaman/shellcheck:${SHELLCHECK_VERSION}" \
            -x scripts/cluster-assertions.sh scripts/k3d-rehearsal.sh \
            scripts/version.sh scripts/version-test.sh
