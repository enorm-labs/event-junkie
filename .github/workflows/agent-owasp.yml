# Claude driven by /owasp-top-10: walks the OWASP Top 10:2025 against the tree as deployed and writes
# one line per category. Opens, files and edits nothing, so no `dry_run` — every run is one. A second
# job comments the report on a monthly issue (#1499). ci-cd.instructions.md has the shared shape.
#
# **Weekly, and diff-first is what makes weekly readable** (#1422): the categories move when a
# boundary changes, so an unmoved category gets one line. **`Bash` stays in `--allowedTools`, and the
# shell holds two tokens**: `gh api` reads the ruleset through `ACTIONS_GITHUB_TOKEN` (the wiring
# agent-security.yml documents); the Claude App's `contents: write` is survivable because merge-gate.yml
# (#1424) refuses a pull request this App authored. **`SITE_URL` is site-probe.yml's variable**; A02
# and A04 read production's live headers with `curl -sI`.
name: Agent — OWASP Top 10

on:
  # Monday, off-the-hour, clear of the three other Monday crons.
  schedule:
    - cron: '31 6 * * 1'
  workflow_dispatch:
    inputs:
      model:
        description: Model to run the review with
        type: choice
        default: claude-opus-5
        options:
          - claude-opus-5
          - claude-opus-4-8
          - claude-sonnet-5
      since:
        description: Window in days. Raise it after a gap, or after an ADR that adds a surface
        type: string
        default: '7'

permissions: {}

concurrency:
  group: agent-owasp
  cancel-in-progress: false

jobs:
  review:
    name: OWASP Top 10 review (agent)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC exchange for the Claude App's token.
      id-token: write
    # Reading, not fetching; `--max-turns` is the ceiling.
    timeout-minutes: 30
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://event-junkie.de' }}
      SINCE: ${{ inputs.since || '7' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # `git log --since` over the evidence paths is Step 1 of the prompt; a shallow clone shows one commit.
          fetch-depth: 0

      # The prompt is a one-line `@` pointer into `.github/prompts/`, so the checkout resolves it. `helm` is
      # on the runner for the A01 render.
      - name: Run /owasp-top-10
        id: claude
        uses: anthropics/claude-code-action@7b0b255830a1fab6e602658672acad11c12d841d # v1
        env:
          ACTIONS_GITHUB_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          display_report: true
          prompt: /owasp-top-10 --since ${{ inputs.since || '7' }} --unattended
          claude_args: |
            --model ${{ inputs.model || 'claude-opus-5' }}
            --max-turns 80
            --allowedTools "Bash,Read,Glob,Grep,Write,TodoWrite"

      # Reporting steps last and guarded. The step summary has no REST API, so the final report is
      # extracted to an artifact — the report alone, never the execution file with every tool result.
      - name: Extract the report
        if: success() || failure()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          : > agent-report.md
          if [ -n "${EXECUTION_FILE:-}" ] && [ -s "$EXECUTION_FILE" ]; then
            jq -s -r '[.. | objects | select(.type == "result") | .result // empty] | last // ""' \
              "$EXECUTION_FILE" > agent-report.md || true
          fi
          if [ ! -s agent-report.md ]; then
            echo 'No report extracted. The execution file was empty or its shape changed.' > agent-report.md
          fi

      - name: Upload the report
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-report
          path: agent-report.md

      # **A run that produced no report is a failed run, whatever its exit code.** After the upload, so the
      # stub is preserved; guarded on the agent step succeeding. Ten category rows alone are more than five
      # lines, so a report that skipped the table trips this.
      - name: Fail if the report is a stub
        if: steps.claude.outcome == 'success'
        run: |
          set -euo pipefail
          bytes=$(wc -c < agent-report.md)
          lines=$(wc -l < agent-report.md)
          if [ "$bytes" -lt 400 ] || [ "$lines" -lt 5 ]; then
            echo "::error::The agent reported success but wrote no report ($bytes bytes, $lines lines). See the agent-report artifact."
            cat agent-report.md
            exit 1
          fi

  # The report reaches a person by email (#1499). Its own job, so `issues: write` never exists where the
  # agent runs.
  notify:
    name: Post the report on the rolling issue
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write

    steps:
      # A local action needs the tree; `$/` would not, and actionlint 1.7.12 rejects it.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/report-to-issue

      - name: Download the report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent-report

      - name: Comment it on this month's issue
        uses: ./.github/actions/report-to-issue
        with:
          title: OWASP Top 10 — weekly reports
          report: agent-report.md
          assignee: enorm
          labels: area:agents, area:security, size:S
          about: >-
            Weekly `/owasp-top-10` reports: one line per category against the tree as deployed,
            diff-first over the week's commits.
