# Claude driven by this repository's own /owasp-top-10 prompt. It walks the OWASP Top 10:2025
# against the tree as deployed — the workflows, the chart, the cluster manifests, the ADRs, the
# threat model — and writes a report with one line per category. It opens nothing, files nothing
# and edits nothing, which is the whole safety argument and the reason there is no `dry_run`
# input: every run is one. The shared shape is documented once in ci-cd.instructions.md.
#
# **Weekly, not quarterly, and diff-first is what makes weekly readable** (#1422). The categories
# move when a boundary changes, not when a week passes, so the prompt leads with the commits of
# the window that touched a category's evidence and gives an unmoved category one line. A quiet
# week is a short report. A quarter of commits read at once would be a wall.
#
# **`Bash` stays in `--allowedTools`, and the shell holds two tokens.** `git log`, `grep` and
# `helm template` are the job. `gh api` reads the ruleset and the secret-scanning settings, and it
# does so through `ACTIONS_GITHUB_TOKEN` — the Actions token, `contents: read`, the same wiring
# agent-security.yml documents. The other token is the Claude App's, with `contents: write`, and
# merge-gate.yml (#1424) is why that is survivable: a pull request this App authored cannot land.
#
# **`SITE_URL` is the variable `site-probe.yml` reads, with the same fallback.** A02 and A04 read
# production's live headers with `curl -sI`, nothing more.
name: Agent — OWASP Top 10

on:
  # Monday, off-the-hour for the reason every other schedule here gives, and clear of the three
  # other Monday crons (CodeQL 05:29, credential expiry 06:38, node pins 06:52).
  schedule:
    - cron: '31 6 * * 1'
  workflow_dispatch:
    inputs:
      model:
        description: Model to run the review with
        type: choice
        default: claude-opus-5
        options:
          - claude-opus-5
          - claude-opus-4-8
          - claude-sonnet-5
      since:
        description: Window in days. Raise it after a gap, or after an ADR that adds a surface
        type: string
        default: '7'

permissions:
  contents: read
  id-token: write

concurrency:
  group: agent-owasp
  cancel-in-progress: false

jobs:
  review:
    name: OWASP Top 10 review (agent)
    runs-on: ubuntu-latest
    # Reading, not fetching: the wall clock is the model's, and `--max-turns` below is the ceiling.
    timeout-minutes: 30
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://event-junkie.de' }}
      SINCE: ${{ inputs.since || '7' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # `git log --since` over the evidence paths is Step 1 of the prompt, and a shallow clone
          # has one commit to show it.
          fetch-depth: 0

      # The prompt is `.claude/skills/owasp-top-10.md`, a one-line `@` pointer into
      # `.github/prompts/`, so checkout above is what makes it resolvable at all. No JDK and no
      # Node. `helm` is on the runner image for the A01 render.
      - name: Run /owasp-top-10
        id: claude
        uses: anthropics/claude-code-action@5ccc3a35a6367cdb8e6fbd0728287467540ecfe2 # v1
        env:
          ACTIONS_GITHUB_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          display_report: true
          prompt: /owasp-top-10 --since ${{ inputs.since || '7' }} --unattended
          claude_args: |
            --model ${{ inputs.model || 'claude-opus-5' }}
            --max-turns 80
            --allowedTools "Bash,Read,Glob,Grep,Write,TodoWrite"

      # Reporting steps, last and guarded, per the rule in ci-cd.instructions.md. The step summary
      # `display_report` writes has no REST API, so a scheduled report would exist only as a browser
      # page. This extracts the same final report and nothing else — the execution file also holds
      # every tool result, which is what must never be uploaded from a public repository.
      - name: Extract the report
        if: success() || failure()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          : > agent-report.md
          if [ -n "${EXECUTION_FILE:-}" ] && [ -s "$EXECUTION_FILE" ]; then
            jq -s -r '[.. | objects | select(.type == "result") | .result // empty] | last // ""' \
              "$EXECUTION_FILE" > agent-report.md || true
          fi
          if [ ! -s agent-report.md ]; then
            echo 'No report extracted. The execution file was empty or its shape changed.' > agent-report.md
          fi

      - name: Upload the report
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-report
          path: agent-report.md

      # **A run that produced no report is a failed run, whatever its exit code.** The agent's turn
      # ends when it stops calling tools, so a closing line reports success and delivers a
      # sentence. This runs after the upload on purpose: the stub is preserved for diagnosis, then
      # the job goes red. Guarded on the agent step succeeding, because a failure above is already
      # red for a better reason. Ten category rows alone are more than five lines, so a report that
      # skipped the table trips this.
      - name: Fail if the report is a stub
        if: steps.claude.outcome == 'success'
        run: |
          set -euo pipefail
          bytes=$(wc -c < agent-report.md)
          lines=$(wc -l < agent-report.md)
          if [ "$bytes" -lt 400 ] || [ "$lines" -lt 5 ]; then
            echo "::error::The agent reported success but wrote no report ($bytes bytes, $lines lines). See the agent-report artifact."
            cat agent-report.md
            exit 1
          fi
