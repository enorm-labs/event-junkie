name: Validate Workflows

# The one surface nothing else in this repository looks at.
#
# #383 evaluated four scanners against four surfaces by running them rather than by reading their
# documentation, and this was the only genuinely additive result. Trivy and Checkov have nothing to
# say about `infra/` — 153 rule evaluations there, every one of them AWS, GCP or Azure, all passing
# vacuously against Hetzner resources. The chart is better served by its `helm unittest` suites,
# which know the project's own invariants. But **`.github/workflows/` had no gate at all**, and on its
# first run zizmor found three real problems: a template injection in the publishing workflow, a
# cache-poisoning path into it, and two workflow-level permission grants that belonged to one job.
#
# That matters more since ADR-016. Flux reconciles what lands on `main`, so a workflow compromise is
# now a path to the cluster rather than only to a build.
#
# Two tools, deliberately: **actionlint** is the correctness half (it caught a `min-coverage`
# input silently attached to the wrong action in #264) and **zizmor** is the security half.

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      - 'zizmor.yml'
      # The audit-coverage floors and the script that reads them. A baseline edited without a run is
      # how a floor gets lowered unnoticed.
      - 'scripts/scan-coverage.sh'
      - 'scripts/scan-coverage-baseline.txt'
  pull_request:
    branches: [ main ]
    # No `paths:` here, deliberately, since #443. These checks are **required** on the `main`
    # ruleset, and a required check that never runs stays Pending forever — GitHub's own words:
    # "A pull request that requires those checks to be successful will be blocked from merging."
    # So a filter here would deadlock every pull request that happens not to touch these paths.
    # Affordable because the whole workflow is seconds: actionlint and zizmor.
    # The `push:` filter above keeps its paths — nothing requires those runs.
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned and visible, like every other tool version here — and invisible to Dependabot for the same
  # reason, so `/update-dependencies` step 12 sweeps them.
  ZIZMOR_VERSION: 1.30.0
  ACTIONLINT_VERSION: 1.7.12

jobs:
  validate:
    name: Lint & audit workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Correctness: undefined contexts, wrong action inputs, bad expressions, and shellcheck over
      # every `run:` block. Its shellcheck findings are informational here — the repository's own
      # scripts are linted properly in validate-scripts.yml, validate-chart.yml and
      # validate-infra.yml — so only actionlint's own rules gate.
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            "rhysd/actionlint:${ACTIONLINT_VERSION}" \
            -color -ignore 'shellcheck reported issue'

      # Security: template injection, cache poisoning, credential persistence, over-broad
      # permissions, dangerous triggers.
      #
      # `--min-severity medium` rather than everything: the repository sits at 0 medium and 0 high
      # today, so this blocks regressions without failing on the informational tail. Suppressions
      # live in `zizmor.yml` and as inline `# zizmor: ignore[...]` comments, each with a reason and a
      # date — the same bar `.trivyignore` and `owasp-suppressions.xml` are held to.
      - name: zizmor
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/src" -w /src \
            "ghcr.io/zizmorcore/zizmor:${ZIZMOR_VERSION}" \
            --config zizmor.yml --min-severity medium --format plain .github/workflows/ \
            | tee "${RUNNER_TEMP}/zizmor.txt"

      # A clean zizmor run is two claims, and the exit code carries only one of them: nothing was
      # found, and the whole set was audited. A release that drops an audit, or a suppression added
      # to `zizmor.yml`, narrows the second while leaving the first green (#1087). The two counts
      # below are the denominator, and a drop in either fails here.
      - name: Assert zizmor still audits what it did
        run: |
          scripts/scan-coverage.sh baseline zizmor-ignored "${RUNNER_TEMP}/zizmor.txt"
          scripts/scan-coverage.sh baseline zizmor-suppressed "${RUNNER_TEMP}/zizmor.txt"
