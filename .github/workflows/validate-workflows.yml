name: Validate Workflows

# The one surface nothing else here looks at (#383): Trivy and Checkov say nothing about Hetzner
# resources and the chart has its own suites, but `.github/workflows/` had no gate at all, and on
# its first run zizmor found a template injection in the publishing workflow, a cache-poisoning path
# into it and two over-broad permission grants. Since ADR-016 a workflow compromise is a path to the
# cluster. **actionlint** is the correctness half, **zizmor** the security half.

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      - 'zizmor.yml'
      # The audit-coverage floors. A baseline edited without a run lowers a floor unnoticed.
      - 'scripts/scan-coverage.sh'
      - 'scripts/scan-coverage-baseline.txt'
  pull_request:
    branches: [ main ]
    # No `paths:` here (#443): these checks are **required**, and a required check that never runs stays
    # Pending forever. Affordable because the whole workflow is seconds. The `push:` filter keeps its paths.
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned and visible; invisible to Dependabot, so Renovate's `customManagers` watch them (ADR-024).
  ZIZMOR_VERSION: 1.30.1
  ACTIONLINT_VERSION: 1.7.12

jobs:
  validate:
    name: Lint & audit workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Correctness: undefined contexts, wrong action inputs, bad expressions. Its shellcheck findings are
      # informational — the scripts are linted properly elsewhere — so only actionlint's own rules gate.
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            "rhysd/actionlint:${ACTIONLINT_VERSION}" \
            -color -ignore 'shellcheck reported issue'

      # Security: template injection, cache poisoning, credential persistence, over-broad permissions,
      # dangerous triggers. `--min-severity medium` blocks regressions without the informational tail.
      # Suppressions live in `zizmor.yml` and as inline `# zizmor: ignore[...]`, each with a reason and a date.
      - name: zizmor
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/src" -w /src \
            "ghcr.io/zizmorcore/zizmor:${ZIZMOR_VERSION}" \
            --config zizmor.yml --min-severity medium --format plain .github/workflows/ \
            | tee "${RUNNER_TEMP}/zizmor.txt"

      # A clean zizmor run is two claims, and the exit code carries one: nothing found, and the whole set
      # audited. A dropped audit or a new suppression narrows the second while leaving the first green
      # (#1087); these two counts are the denominator.
      - name: Assert zizmor still audits what it did
        run: |
          scripts/scan-coverage.sh baseline zizmor-ignored "${RUNNER_TEMP}/zizmor.txt"
          scripts/scan-coverage.sh baseline zizmor-suppressed "${RUNNER_TEMP}/zizmor.txt"
