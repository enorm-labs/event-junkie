name: Validate Docs

# The CI half of `scripts/format-markdown.sh`. The pre-commit hook is advisory — `--no-verify`, the
# web UI and an agent without pre-commit skip it — and this is the gate on `main`. It checks and
# never writes: a job pushing a formatting commit back would need write access on every fork pull
# request. The failure names the files and the fix is one command.

on:
  push:
    branches: [ main ]
    paths:
      - '**.md'
      - '.oxfmtrc.json'
      - 'scripts/format-markdown.sh'
      - 'scripts/skill-parity.sh'
      - 'scripts/rules-parity.sh'
      - 'scripts/collector-parity.sh'
      - 'scripts/scope-parity.sh'
      - '.github/workflows/label-pr.yml'
      - 'scripts/version.sh'
      - 'scripts/release-highlights.sh'
      - 'scripts/index-parity.sh'
      - 'events-importer/src/main/kotlin/de/norm/events/scraper/LogContext.kt'
      - 'events-importer/src/main/kotlin/de/norm/events/scraper/LogFields.kt'
      - 'events-bff/src/main/kotlin/de/norm/events/LogContextConfiguration.kt'
      - 'deploy/clusters/base/collector.yaml'
      - 'scripts/ste-lint.sh'
      - 'scripts/ste_lint.py'
      - 'scripts/ste-baseline.txt'
      - 'docs/ops/dashboard/**'
      - 'scripts/links_export.py'
      - 'scripts/dashboard-parity.sh'
      - 'events-frontend/scripts/ops-page-css.mjs'
      - 'events-frontend/package-lock.json'
      - '.github/workflows/validate-docs.yml'
  pull_request:
    branches: [ main ]
    # `paths:` is present because this check is **not** required. **If it is ever made required, delete
    # this filter in the same change** — a required check that never runs stays Pending forever (#443).
    paths:
      - '**.md'
      - '.oxfmtrc.json'
      - 'scripts/format-markdown.sh'
      - 'scripts/skill-parity.sh'
      - 'scripts/rules-parity.sh'
      - 'scripts/collector-parity.sh'
      - 'scripts/scope-parity.sh'
      - '.github/workflows/label-pr.yml'
      - 'scripts/version.sh'
      - 'scripts/release-highlights.sh'
      - 'scripts/index-parity.sh'
      - 'events-importer/src/main/kotlin/de/norm/events/scraper/LogContext.kt'
      - 'events-importer/src/main/kotlin/de/norm/events/scraper/LogFields.kt'
      - 'events-bff/src/main/kotlin/de/norm/events/LogContextConfiguration.kt'
      - 'deploy/clusters/base/collector.yaml'
      - 'scripts/ste-lint.sh'
      - 'scripts/ste_lint.py'
      - 'scripts/ste-baseline.txt'
      - 'docs/ops/dashboard/**'
      - 'scripts/links_export.py'
      - 'scripts/dashboard-parity.sh'
      - 'events-frontend/scripts/ops-page-css.mjs'
      - 'events-frontend/package-lock.json'
      - '.github/workflows/validate-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # `.claude/skills/` and `.claude/commands/` are parallel `@`-pointer trees with nothing joining them,
  # `.github/instructions/` carries one glob key per agent, and a log field name is written in four
  # places (#992) — that one reads Kotlin and YAML too, which is why the filter names them. The scripts
  # index is the fourth: a stale `scripts/<name>` reference is usually in a runbook or a prompt. No
  # Node, so this does not wait on the formatting job's setup.
  parity:
    name: Check skill, rule, log field, product scope and scripts index parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check skill and command parity
        run: scripts/skill-parity.sh

      - name: Check rule parity
        run: scripts/rules-parity.sh

      - name: Check log field parity
        run: scripts/collector-parity.sh

      - name: Check product scope parity
        run: scripts/scope-parity.sh

      - name: Check the scripts index
        run: scripts/index-parity.sh

  # The sentence rules, held per area to a ceiling that only moves down (scripts/ste-baseline.txt, #733).
  # Standard library only; no setup step.
  language:
    name: Check documentation language
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Simplified Technical English findings against the baseline
        run: scripts/ste-lint.sh check

      - name: Explain the fix
        if: failure()
        run: |
          {
            echo "## Documentation language"
            echo
            echo "An area carries more ASD-STE100 findings than its baseline allows. The ceiling"
            echo "only moves down: split the sentence, rather than raise the number."
            echo
            echo "Every area is at zero, so a finding here is a regression rather than a budget"
            echo "that ran out. update-baseline is not the fix, and it never was: a count that"
            echo "goes *down* does not fail this job."
            echo
            echo '```bash'
            echo "scripts/ste-lint.sh report --top 20   # where the findings are"
            echo "scripts/ste-lint.sh stats             # sentences scanned, and the share over cap"
            echo '```'
            echo
            echo "A sentence that has to stay long takes an inline reason on the line above it:"
            echo
            echo '```html'
            echo '<!-- ste-lint: allow the exact wording the DPA uses -->'
            echo '```'
            echo
            echo "See .github/instructions/documentation.instructions.md and #733."
          } >> "$GITHUB_STEP_SUMMARY"

  format:
    name: Check Markdown formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # oxfmt is a devDependency of events-frontend so that `package-lock.json` pins the exact version: it
      # is pre-1.0 and its Markdown output moves between versions, so a check against "whatever is newest"
      # would fail files a contributor's pinned copy had just written. `package-lock.json` is in the path
      # filters for the same reason — an oxfmt bump can reformat every document.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24' # should match the version specified in .nvmrc
          cache: 'npm'
          cache-dependency-path: events-frontend/package-lock.json

      - name: Install dependencies
        working-directory: events-frontend
        run: npm ci

      # Writes nothing, exits 1 listing every unformatted file. From the root: oxfmt rejects a path with `..`.
      - name: Check Markdown formatting
        run: scripts/format-markdown.sh check

      # The operations page's three generated files against their sources; here rather than in the parity
      # job because the CSS half needs the tailwindcss that `npm ci` installs.
      - name: Check the operations page's generated files
        run: scripts/dashboard-parity.sh check

      - name: Explain the fix
        if: failure()
        run: |
          {
            echo "## Markdown formatting"
            echo
            echo "The files listed above are not formatted. To fix:"
            echo
            echo '```bash'
            echo "scripts/format-markdown.sh"
            echo '```'
            echo
            echo "It rewrites in place — commit the result. Installing the pre-commit hooks"
            echo "(\`pre-commit install\`) does this on every commit, which is why this rarely fires."
          } >> "$GITHUB_STEP_SUMMARY"
