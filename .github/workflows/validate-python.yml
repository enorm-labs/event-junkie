name: Validate Python

# ruff over every `.py` file, and the two Python tests. The pre-commit hooks are advisory; this is the
# gate on `main`. The tests ran nowhere before (#1189): `deploy/alerts/test_diff_alerts.py` holds the
# property that no credential appears in an alert diff, `deploy/dashboards/test_lint_dashboard.py`
# proves the dashboard linter catches each case it claims. Plain scripts that exit non-zero, so the
# runner's python3 is enough.

on:
  push:
    branches: [ main ]
    paths:
      - '**.py'
      - 'ruff.toml'
      - '.github/workflows/validate-python.yml'
  pull_request:
    branches: [ main ]
    # `paths:` is present because this check is **not** required. **If it is ever made required, delete
    # this filter in the same change.**
    paths:
      - '**.py'
      - 'ruff.toml'
      - '.github/workflows/validate-python.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned: ruff's formatter style moves between releases, and a gate on whatever the runner ships fails
  # files the author's copy just passed. Renovate watches it (ADR-024). No `v`.
  RUFF_VERSION: 0.16.9

jobs:
  python:
    name: ruff, and the Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # From the pinned image. Both commands read the root ruff.toml, so the hook and this job cannot
      # disagree except by version.
      - name: ruff check
        id: check
        run: |
          docker run --rm -v "$PWD:/io" -w /io "ghcr.io/astral-sh/ruff:${RUFF_VERSION}" check

      - name: ruff format --check
        id: format
        run: |
          docker run --rm -v "$PWD:/io" -w /io "ghcr.io/astral-sh/ruff:${RUFF_VERSION}" format --check --diff

      - name: No credential appears in an alert diff
        run: python3 deploy/alerts/test_diff_alerts.py

      - name: The dashboard linter rejects what it claims to
        run: python3 deploy/dashboards/test_lint_dashboard.py

      # Gated on the two steps it explains.
      - name: Explain the fix
        if: failure() && (steps.check.outcome == 'failure' || steps.format.outcome == 'failure')
        run: |
          {
            echo "## ruff"
            echo
            echo "The findings above are from ruff ${RUFF_VERSION}, which is what this job pins;"
            echo "your installed version may differ and disagree. To reproduce with the same one:"
            echo
            echo '```bash'
            echo "uvx ruff@${RUFF_VERSION} check --fix && uvx ruff@${RUFF_VERSION} format"
            echo '```'
            echo
            echo "Installing the pre-commit hooks (\`pre-commit install\`) runs both on every commit,"
            echo "though the hook uses your local binary."
          } >> "$GITHUB_STEP_SUMMARY"
