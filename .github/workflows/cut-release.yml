name: Cut release

# Publish a GitHub Release for the number the commits since the last one deserve; creating it fires
# `release.yml`, which builds the artifacts (#868).
#
# **The version is never typed, and never chosen.** No file carries it (ADR-032): `scripts/version.sh
# deserved` reads the Conventional Commits since the last release — a `feat` a minor, a break a major
# (a minor before 1.0.0), the rest a patch — and `release.yml` computes the same number from the same
# commits, so the two cannot disagree. Nothing moves `main` afterwards.
#
# **The notes open with a visitor-facing summary**, from `/release-highlights`, above the label
# buckets `.github/release.yml` groups. Three sources in order: the `highlights` input (a dry run's
# text shipped unchanged), the model, `scripts/release-highlights.sh`. **The model step cannot be tried
# from a branch** — the action reports success on a workflow file that differs from `main`'s — so a
# change to it is proved after merge, by the default dry run.
#
# **A release is a rebuild of what `main` already published as a snapshot**, so a red snapshot is a red
# release: v0.3.10 was cut over four failed runs and left an empty tag (#1117). The cut refuses a
# commit whose snapshot publish is not green, in dry run too.

on:
  workflow_dispatch:
    inputs:
      at_least:
        description: >-
          A floor under what the commits deserve, for the one decision they cannot show: 1.0.0 is
          cut with `major`. `auto` takes the commits' verdict, and the floor never lowers it.
        type: choice
        options: [ auto, minor, major ]
        default: auto
      highlights:
        description: >-
          The Highlights section to ship, heading included, as a dry run printed it — edited or not.
          Empty asks the model again, whose answer can differ from the one that was read.
        type: string
        default: ''
      notes:
        description: >-
          A paragraph of its own for this release, between the highlights and the categories from
          .github/release.yml.
        type: string
        default: ''
      model:
        description: Model to write the highlights with
        type: choice
        default: claude-opus-4-8
        options:
          - claude-opus-4-8
          - claude-opus-4-6
          - claude-opus-5
      dry_run:
        description: >-
          Resolve the version and print the notes, creating nothing. On by default, the same posture
          as release.yml's `publish: false`.
        type: boolean
        default: true

# Two runs would race for one tag; the loser fails after the winner has published.
concurrency:
  group: cut-release
  cancel-in-progress: false

permissions:
  contents: read
  # To read release.yml's runs for the snapshot check below.
  actions: read
  # The highlights step exchanges an OIDC token for the Claude App's, like every agent workload.
  id-token: write

jobs:
  cut:
    name: Cut the release
    runs-on: ubuntu-latest
    # Ten before the model wrote the highlights; its step alone is allowed five.
    timeout-minutes: 20

    steps:
      # The whole history and every tag, because `deserved` measures from the last release tag.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      # The reasoning goes to the summary, so a dry run answers "what would this be".
      - name: Resolve the version
        id: version
        env:
          AT_LEAST: ${{ inputs.at_least }}
        run: |
          last="$(scripts/version.sh last)"
          if [ "$AT_LEAST" = auto ]; then
            deserved="$(scripts/version.sh deserved 2>"$RUNNER_TEMP/deserved.txt")"
          else
            deserved="$(scripts/version.sh deserved --at-least "$AT_LEAST" 2>"$RUNNER_TEMP/deserved.txt")"
          fi
          {
            echo "### The commits since v$last"
            echo
            echo '```'
            cat "$RUNNER_TEMP/deserved.txt"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          {
            echo "last=$last"
            echo "version=$deserved"
          } >>"$GITHUB_OUTPUT"

      # **Not `GITHUB_TOKEN`, and this is the whole design risk.** GitHub suppresses the events its own
      # token triggers: a release created with it fires no `release: published`, nothing is published, and
      # every job here is green. An App installation token is a different identity. Minted per run, narrowed
      # to what this job uses, on a dry run too: `generate-notes` is the cheapest call that proves the App
      # can authenticate before a run that publishes.
      - name: Mint an App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # `client-id` takes the numeric App id; `app-id` warns on every run.
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Narrowed to the one the job uses; without it the token inherits everything the installation holds.
          permission-contents: write

      - name: Refuse a tag that already exists
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::v$VERSION is already released, and the commits since it deserve nothing new."
            exit 1
          fi
          echo "v$VERSION is free"

      # The run for this exact commit, not the latest on main: a green run for an older commit says nothing
      # about a base image that moved since. No run at all is refused too — a cut in that window would race
      # the publish.
      - name: Refuse a commit whose snapshot publish is not green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          # A point lookup by commit, not a page of the run listing: the listing is eventually
          # consistent and returned nothing for a run that had been green for 13 minutes, which
          # this gate reported as "no snapshot publish has run" (#1579).
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${sha}&event=push&per_page=100" \
            --jq '[.workflow_runs[] | select(.path == ".github/workflows/release.yml")][0]')"
          if [ -z "$run" ] || [ "$run" = "null" ]; then
            echo "::error::release.yml has never run for ${sha}. Wait for the snapshot publish on main, then retry."
            exit 1
          fi
          status="$(jq -r .status <<<"$run")"
          conclusion="$(jq -r .conclusion <<<"$run")"
          url="$(jq -r .html_url <<<"$run")"
          if [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
            echo "::error::The snapshot publish for ${sha} is ${status}/${conclusion}: ${url} — a release from this commit fails the same gate. See docs/ops/RELEASING.md § Publishing is blocked."
            exit 1
          fi
          echo "Snapshot publish for ${sha} is green: ${url}"

      # The few changes worth naming, in a visitor's words. Skipped when the operator pasted them in. Written
      # outside the working tree. `continue-on-error`, because the release must not wait on the model.
      # `--allowedTools` is load-bearing (no frontmatter, no shell); no `github_token`, for the reason
      # agent-security.yml records; `display_report` puts the agent's final message in the summary.
      - name: Ask the model for the highlights
        if: ${{ inputs.highlights == '' }}
        id: claude
        continue-on-error: true
        timeout-minutes: 5
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          display_report: true
          prompt: /release-highlights --out ${{ runner.temp }}/highlights.md --unattended
          claude_args: |
            --model ${{ inputs.model || 'claude-opus-4-8' }}
            --max-turns 40
            --allowedTools "Bash,Read,Glob,Grep"

      # The one place that decides which text the release carries. The model step ends `outcome=success`
      # having written nothing when the file differs from `main`'s, so the file is what is checked: a file
      # that opens with the heading is the model's answer, anything else is the script's turn.
      - name: Settle the highlights
        id: highlights
        env:
          HIGHLIGHTS: ${{ inputs.highlights }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
        run: |
          file="$RUNNER_TEMP/highlights.md"
          if [ -n "$HIGHLIGHTS" ]; then
            source="the highlights input"
            case "$HIGHLIGHTS" in
              "## Highlights"*) printf '%s' "$HIGHLIGHTS" >"$file" ;;
              *) printf '## Highlights\n\n%s' "$HIGHLIGHTS" >"$file" ;;
            esac
          elif [ -s "$file" ] && [ "$(head -1 "$file")" = "## Highlights" ]; then
            source="the model"
          else
            echo "::warning::The model wrote no highlights (step outcome: ${CLAUDE_OUTCOME:-skipped}); scripts/release-highlights.sh writes them instead."
            scripts/release-highlights.sh >"$file"
            source="scripts/release-highlights.sh"
          fi
          echo "source=$source" >>"$GITHUB_OUTPUT"
          {
            echo "_Highlights from $source:_"
            echo
            if [ -s "$file" ]; then
              cat "$file"
              echo
            else
              echo "No commit since the last release earns a highlight."
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      # `generate-notes` renders what `--generate-notes` would produce and creates nothing, so a dry run
      # shows the notes. **It needs the App token**: the endpoint is a POST asking `contents: write`.
      - name: Preview the release notes
        if: ${{ inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          {
            echo "### Notes for v$VERSION"
            echo
            if [ -s "$RUNNER_TEMP/highlights.md" ]; then printf '%s\n\n' "$(cat "$RUNNER_TEMP/highlights.md")"; fi
            if [ -n "$NOTES" ]; then printf '%s\n\n' "$NOTES"; fi
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="v$VERSION" -f target_commitish=main --jq .body
          } >>"$GITHUB_STEP_SUMMARY"

      # Summary, then the dispatch's paragraph, then the generated categories: `--notes-file` is prepended.
      - name: Create the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          # No trailing newline on any part: `gh` joins this file to the generated section with a blank line of
          # its own.
          : >"$RUNNER_TEMP/notes.md"
          if [ -s "$RUNNER_TEMP/highlights.md" ]; then
            printf '%s' "$(cat "$RUNNER_TEMP/highlights.md")" >>"$RUNNER_TEMP/notes.md"
          fi
          if [ -n "$NOTES" ]; then
            if [ -s "$RUNNER_TEMP/notes.md" ]; then
              printf '\n\n' >>"$RUNNER_TEMP/notes.md"
            fi
            printf '%s' "$NOTES" >>"$RUNNER_TEMP/notes.md"
          fi
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            gh release create "v$VERSION" --target main --generate-notes --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "v$VERSION" --target main --generate-notes
          fi

      - name: Summary
        env:
          LAST: ${{ steps.version.outputs.last }}
          VERSION: ${{ steps.version.outputs.version }}
          AT_LEAST: ${{ inputs.at_least }}
          DRY_RUN: ${{ inputs.dry_run }}
          HIGHLIGHTS_SOURCE: ${{ steps.highlights.outputs.source }}
        run: |
          {
            if [ "$DRY_RUN" = "true" ]; then
              echo "### Dry run — nothing was created"
            else
              echo "### Cut v$VERSION"
            fi
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Last release | \`v$LAST\` |"
            echo "| Deserves | \`$VERSION\` (at least: $AT_LEAST) |"
            echo "| Release | \`v$VERSION\` |"
            echo "| Highlights | from $HIGHLIGHTS_SOURCE |"
          } >>"$GITHUB_STEP_SUMMARY"
