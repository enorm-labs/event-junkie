name: Cut release

# Publish a GitHub Release from `gradle.properties`, then open the pull request that moves `main` on
# to the next snapshot. This does not build anything: creating the release fires `release.yml`,
# which is what produces the four artifacts (#868).
#
# **The version is never typed, and never chosen either.** It comes from `scripts/version.sh base`,
# so the tag cannot claim a number the tree has not been bumped to. And the tree has to carry what
# `scripts/version.sh deserved` reads off the Conventional Commits since the last release: a `feat`
# earns a minor, a breaking change a major (a minor before 1.0.0), the rest a patch. A tree that
# says less is not cut. The run opens the pull request that raises it, and stops. The same script
# writes the four files either way, so a workflow and a person at a terminal edit them the same way.
#
# **The second step is the one that matters.** Until `main` carries the next snapshot, staging stops
# following it: snapshots of the just-released version sort *below* the release, so the
# `>=0.0.0-0` range keeps resolving the release itself and nothing reports it (#455). Doing both
# halves in one run is the whole point.
#
# **A release is a rebuild of what `main` already published as a snapshot**, so a red snapshot
# publish is a red release: v0.3.10 was cut over four failed runs and left a tag with nothing
# behind it, for a base-image finding no change on `main` had caused (#1117). The cut therefore
# refuses a commit whose snapshot publish is not green, in dry run too.

on:
  workflow_dispatch:
    inputs:
      at_least:
        description: >-
          A floor under what the commits deserve, for the one decision they cannot show: 1.0.0 is
          cut with `major`. `auto` takes the commits' verdict, and the floor never lowers it.
        type: choice
        options: [ auto, minor, major ]
        default: auto
      notes:
        description: >-
          Prepended to the generated release notes, for a release that needs a paragraph of its own.
          The categories below it come from .github/release.yml.
        type: string
        default: ''
      dry_run:
        description: >-
          Resolve the version and print the notes, creating nothing. On by default, the same posture
          as release.yml's `publish: false`.
        type: boolean
        default: true

# Two runs would race for one tag, and the loser fails after the winner has already published.
concurrency:
  group: cut-release
  cancel-in-progress: false

permissions:
  contents: read
  # To read release.yml's runs for the snapshot check below.
  actions: read

jobs:
  cut:
    name: Cut the release and open the bump
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # The whole history and every tag, because `deserved` measures from the last release tag.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      # The gate that makes everything after it safe. A tree whose four files disagree would publish
      # a chart whose appVersion names image tags that were never built.
      - name: Check that every file agrees about the version
        run: scripts/version.sh check

      # `raise` is the branch the rest of the run takes: the tree says less than the commits since
      # the last release deserve, so there is no release to cut and a pull request to open instead.
      # The reasoning goes to the summary either way, so a dry run answers "what would this be".
      - name: Resolve the version
        id: version
        env:
          AT_LEAST: ${{ inputs.at_least }}
        run: |
          base="$(scripts/version.sh base)"
          last="$(scripts/version.sh last)"
          if [ "$AT_LEAST" = auto ]; then
            deserved="$(scripts/version.sh deserved 2>"$RUNNER_TEMP/deserved.txt")"
          else
            deserved="$(scripts/version.sh deserved --at-least "$AT_LEAST" 2>"$RUNNER_TEMP/deserved.txt")"
          fi
          {
            echo "### The commits since v$last"
            echo
            echo '```'
            cat "$RUNNER_TEMP/deserved.txt"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          raise=false
          if [ "$base" != "$deserved" ]; then
            raise=true
            echo "::warning::The tree says $base-SNAPSHOT and the commits since v$last deserve $deserved. No release is cut from this run."
          fi
          {
            echo "last=$last"
            echo "version=$deserved"
            echo "raise=$raise"
            echo "next=$(scripts/version.sh next patch)"
          } >>"$GITHUB_OUTPUT"

      # **Not `GITHUB_TOKEN`, and this is the whole design risk.** GitHub suppresses the events its
      # own token triggers, so a release created with it fires no `release: published` — `release.yml`
      # would never run, no images and no chart would be published, and every job here would report
      # green. The same rule stops a pull request it opens from running any check, which would leave
      # the bump unmergeable. A GitHub App installation token is a different identity, so both fire.
      #
      # It is minted per run and expires in an hour. The App holds `contents: write` and
      # `pull-requests: write` on this repository alone (docs/CREDENTIALS.md §2, #25).
      # Minted on a dry run too, and deliberately: it creates nothing, and it is the only thing that
      # proves the App can authenticate before a run that publishes. `generate-notes` below is the
      # cheapest call that exercises it.
      - name: Mint an App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Narrowed to the two the job uses. Without these the token inherits everything the
          # installation holds, which today is the same two — and would silently widen the moment
          # anybody granted the App a third.
          permission-contents: write
          permission-pull-requests: write

      - name: Refuse a tag that already exists
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::v$VERSION is already released. Bump gradle.properties first."
            exit 1
          fi
          echo "v$VERSION is free"

      # The run for this exact commit, not the latest on main: a green run for an older commit says
      # nothing about a base image that moved since. No run at all is refused too — the publish
      # takes minutes, and a cut in that window would race it.
      - name: Refuse a commit whose snapshot publish is not green
        if: ${{ steps.version.outputs.raise != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          run="$(gh run list --workflow=release.yml --event push --branch main --limit 30 \
            --json headSha,status,conclusion,url |
            jq -c --arg sha "$sha" '[.[] | select(.headSha == $sha)][0]')"
          if [ -z "$run" ] || [ "$run" = "null" ]; then
            echo "::error::No snapshot publish has run for ${sha}. Wait for release.yml on main, then retry."
            exit 1
          fi
          status="$(jq -r .status <<<"$run")"
          conclusion="$(jq -r .conclusion <<<"$run")"
          url="$(jq -r .url <<<"$run")"
          if [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
            echo "::error::The snapshot publish for ${sha} is ${status}/${conclusion}: ${url} — a release from this commit fails the same gate. See docs/ops/RELEASING.md § Publishing is blocked."
            exit 1
          fi
          echo "Snapshot publish for ${sha} is green: ${url}"

      # `generate-notes` renders what `gh release create --generate-notes` would produce and creates
      # nothing, so a dry run can show the notes rather than only the number. The categories come
      # from `.github/release.yml`.
      #
      # **It needs the App token, not `github.token`.** The endpoint is a POST and asks for
      # `contents: write`, which this workflow does not grant its own token and should not.
      - name: Preview the release notes
        if: ${{ inputs.dry_run && steps.version.outputs.raise != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          {
            echo "### Notes for v$VERSION"
            echo
            if [ -n "$NOTES" ]; then printf '%s\n\n' "$NOTES"; fi
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="v$VERSION" -f target_commitish=main --jq .body
          } >>"$GITHUB_STEP_SUMMARY"

      # Written outside the working tree, so it cannot be swept into the bump commit below.
      - name: Create the release
        if: ${{ !inputs.dry_run && steps.version.outputs.raise != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" >"$RUNNER_TEMP/notes.md"
            gh release create "v$VERSION" --target main --generate-notes --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "v$VERSION" --target main --generate-notes
          fi

      # One step for the two pull requests this run can open, which differ only in the number and
      # the sentence. After a release, `main` moves to the next patch snapshot. On `raise`, it moves
      # to the number the commits deserve, and the release is cut on the next dispatch.
      #
      # A branch, not a push to main: main is protected, and the bump has to run the checks like any
      # other change.
      #
      # The committer is the App's own bot account, and the address needs that account's numeric id
      # rather than the App id — the two differ, and a wrong one leaves the commit attributed to
      # nobody. `gh api` is the only place the id is available.
      - name: Open the version pull request
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
          RAISE: ${{ steps.version.outputs.raise }}
          LAST: ${{ steps.version.outputs.last }}
          VERSION: ${{ steps.version.outputs.version }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          if [ "$RAISE" = true ]; then
            target="$VERSION"
            title="chore(release): raise the coming release to $target-SNAPSHOT"
            cat >"$RUNNER_TEMP/pr-body.md" <<BODY
          The commits since v$LAST deserve $target (docs/ops/RELEASING.md § What a release deserves),
          and the tree says less. Merge this, wait for the snapshot publish, and dispatch
          \`cut-release.yml\` again.

          $(sed 's/^/    /' "$RUNNER_TEMP/deserved.txt")

          Opened by \`cut-release.yml\`.
          BODY
          else
            target="$NEXT"
            title="chore(release): open the next development version at $target-SNAPSHOT"
            cat >"$RUNNER_TEMP/pr-body.md" <<BODY
          v$VERSION is published, so \`main\` moves on to the next number. All four files together,
          because \`scripts/version.sh check\` accepts nothing else.

          Opened by \`cut-release.yml\` (#868).
          BODY
          fi

          branch="chore/version-${target//./-}-snapshot"
          bot_id="$(gh api "/users/${SLUG}[bot]" --jq .id)"
          git config user.name "${SLUG}[bot]"
          git config user.email "${bot_id}+${SLUG}[bot]@users.noreply.github.com"

          git switch -c "$branch"
          scripts/version.sh set "$target"
          git commit -am "$title"
          # Pushed to an explicit URL rather than through the remote, so the token is never written
          # into `.git/config` — the same reason every checkout here sets `persist-credentials: false`.
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "$branch"

          gh pr create --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md"

      - name: Summary
        env:
          LAST: ${{ steps.version.outputs.last }}
          VERSION: ${{ steps.version.outputs.version }}
          NEXT: ${{ steps.version.outputs.next }}
          RAISE: ${{ steps.version.outputs.raise }}
          AT_LEAST: ${{ inputs.at_least }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            if [ "$RAISE" = true ]; then
              echo "### Not cut — the tree has to be raised to $VERSION first"
            elif [ "$DRY_RUN" = "true" ]; then
              echo "### Dry run — nothing was created"
            else
              echo "### Cut v$VERSION"
            fi
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Last release | \`v$LAST\` |"
            echo "| Deserves | \`$VERSION\` (at least: $AT_LEAST) |"
            if [ "$RAISE" = true ]; then
              echo "| Next | merge the raise pull request, wait for the snapshot publish, dispatch again |"
            else
              echo "| Release | \`v$VERSION\` |"
              echo "| Bump | \`$NEXT-SNAPSHOT\` |"
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      # Red, because a release was asked for and none was cut. Last, so the summary and the pull
      # request exist before the run says why it stopped.
      - name: Stop when the tree says less than the commits deserve
        if: ${{ steps.version.outputs.raise == 'true' }}
        env:
          LAST: ${{ steps.version.outputs.last }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "::error::The commits since v$LAST deserve $VERSION and the tree says less. Merge the raise pull request, then dispatch again."
          exit 1
