# Opens the restore drill as an issue, so the obligation stops depending on anyone remembering it.
# **Documented as quarterly is not a schedule** — this is the class of task that stops happening
# without anyone deciding to stop it. An issue rather than a calendar entry: it lands on the board, is
# assignable, a skipped quarter is an open card, and each run records its timings there before they
# reach BACKUPS.md §9.
#
# **Two triggers, two obligations** (#519): **time** — quarterly, to prove the procedure and the
# numbers still hold — and **change** — a push to `backups.sh` or `postgres.sh` invalidates the last
# run's evidence. **A PostgreSQL major bump is deliberately not wired up**: `var.postgres_version`
# lives in a file that moves for a dozen unrelated reasons, and a gate that cries wolf is worse than
# the note in `infra/AGENTS.md`.
#
# **Idempotent**: a dispatch, a re-run and a late schedule converge on one issue, keyed on the exact
# title.
name: Restore Drill Reminder

on:
  schedule:
    # 07:23 UTC on the first of January, April, July and October, off-the-hour. A calendar quarter rather
    # than "90 days since": no stored state, and a human can tell at a glance whether this quarter's drill
    # happened.
    - cron: '23 7 1 1,4,7,10 *'
  push:
    branches: [ main ]
    paths:
      - 'infra/modules/environment/cloud-init/backups.sh'
      - 'infra/modules/environment/cloud-init/postgres.sh'
  # Also the only way to produce the first issue: the button exists once the file is on the default branch.
  workflow_dispatch:

permissions:
  contents: read
  # Creating an issue, and listing the open ones.
  issues: write

# Two pushes in quick succession must not race into two issues; the second still checks whether the
# first created it.
concurrency:
  group: restore-drill-reminder
  cancel-in-progress: false

jobs:
  remind:
    name: Open the restore drill issue
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Open the drill issue, unless it is already open
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # One place to change the owner. An assignee, not a mention: an unassigned issue on a board is nobody's.
          DRILL_OWNER: enorm
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // The quarter we are in, so a mid-quarter dispatch and the scheduled run converge on one issue.
            const now = new Date();
            const year = now.getUTCFullYear();
            const quarter = Math.floor(now.getUTCMonth() / 3) + 1;

            // A push to one of the scripts is a *different* obligation, so its own title, keyed on the commit.
            const changeTriggered = context.eventName === 'push';
            const sha = context.sha.slice(0, 7);

            const title = changeTriggered
              ? `Restore drill — after a backup/postgres script change (${sha})`
              : `Restore drill — ${year} Q${quarter}`;

            // Idempotency through listing, deliberately **not** search: the search index is eventually consistent,
            // and an issue created seconds ago can be absent from it. Open issues only — a closed one means the
            // drill was done.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            // `listForRepo` returns pull requests too; a PR titled after the drill would suppress the issue.
            const existing = open.find((issue) => !issue.pull_request && issue.title === title);

            if (existing) {
              core.notice(`Already open: #${existing.number} "${title}" — nothing to do.`);
              await core.summary
                .addHeading('🗄️ Restore drill', 2)
                .addRaw(`Already open: [#${existing.number}](${existing.html_url}) — <em>${title}</em>.`)
                .write();
              return;
            }

            const why = changeTriggered
              ? `[\`${sha}\`](${context.payload.compare ?? `https://github.com/${owner}/${repo}/commit/${context.sha}`}) changed ` +
                '`backups.sh` or `postgres.sh`. The last drill proved the *previous* version of those scripts, ' +
                'so its evidence no longer covers what runs now.'
              : `The quarterly drill for **${year} Q${quarter}**. Nothing is known to be wrong — that is the point. ` +
                'This proves the procedure still works and that the recorded numbers are still true.';

            // Absolute URLs: a relative link in an issue body resolves against the rendered page.
            const blob = `https://github.com/${owner}/${repo}/blob/main`;

            const body = [
              `> Opened automatically by [\`restore-drill-reminder.yml\`](${blob}/.github/workflows/restore-drill-reminder.yml) ` +
                '([#519](https://github.com/enorm-labs/event-junkie/issues/519)). A backup nobody has restored is a belief about a backup.',
              '',
              why,
              '',
              '## Run it',
              '',
              `The procedure is [\`docs/ops/RESTORE_RUNBOOK.md\`](${blob}/docs/ops/RESTORE_RUNBOOK.md) §4 and §5 — full replay, then ` +
                'point-in-time recovery past a destructive statement. It restores into a **scratch cluster on port 5433** and never into live `PGDATA`.',
              '',
              `[\`scripts/restore-drill.sh\`](${blob}/scripts/restore-drill.sh) runs both sections and the cleanup after them, and prints the table below.`,
              '',
              '## Record the numbers here first',
              '',
              `Fill this in as you go, then copy it over the table in [\`docs/ops/BACKUPS.md\`](${blob}/docs/ops/BACKUPS.md) §9 — ` +
                '**overwrite it, do not append**. The recorded figure should always be the one from the database\'s current size, ' +
                'not the day it was first small. An RTO measured on a database that has since grown is not an RTO.',
              '',
              '| Step | Time |',
              '| --- | --- |',
              '| Base backup | |',
              '| `backup-fetch` | |',
              '| Replay and promote | |',
              '| **Restore to serving, end to end** | |',
              '',
              '**Database size at the time of the run:**',
              '',
              '## Done when',
              '',
              '- [ ] §4 passed — a full replay from the bucket alone, including a row written **after** the base backup was taken',
              '- [ ] §5 passed — PITR recovered something dropped after the backup, and the live database is unchanged',
              '- [ ] The table above is filled in and copied over `BACKUPS.md` §9, with the new database size',
              '- [ ] Anything the runbook got wrong is fixed in the runbook, in the same pass',
            ].join('\n');

            const { data: issue } = await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              // `area:infra` and `size:S` are intrinsic; Status and Priority are board fields.
              labels: ['area:infra', 'size:S'],
              assignees: [process.env.DRILL_OWNER],
              // No milestone: a recurring operational obligation outlives every release gate.
              type: 'Task',
            });

            // **This issue does NOT reach the project board on its own** (#1092). The board's "Auto-add to
            // project" is enabled and misses items at roughly 4% — #561 and #862, both opened here, were off the
            // board — and GraphQL exposes no workflow filter to say why. `GITHUB_TOKEN` cannot write to an
            // organisation project, and a PAT able to rewrite the whole board is more than a quarterly reminder
            // should hold. A setting being on is not the same as having seen it work. **Check the card after a
            // run**: `scripts/issue-board.sh status <n> Ready`.
            core.notice(`Opened #${issue.number} — ${title}`);
            await core.summary
              .addHeading('🗄️ Restore drill', 2)
              .addRaw(`Opened [#${issue.number}](${issue.html_url}) — <em>${title}</em>, assigned to @${process.env.DRILL_OWNER}.`)
              .write();
