# Makes a failing Flux source visible on GitHub (#1454). Each cluster's `source-failure` Alert in
# `deploy/clusters/<cluster>/notification.yaml` fires a `repository_dispatch` when the OCIRepository
# reports an error — a chart that fails cosign verification (#1425), a registry that cannot be
# reached, a range that matches nothing. source-controller keeps the last good artifact in every one
# of those cases, so the HelmRelease stays Ready and `deployment-status.yml` records nothing.
#
# THIS JOB IS RED BY CONSTRUCTION. The Alert is `eventSeverity: error`, so every dispatch that reaches
# it is a failure, and a failed run is the only shape GitHub notifies anyone about: the actor of a
# `repository_dispatch` is the owner of the `github-dispatch` PAT, and GitHub mails the actor of a
# failed run. A green run that prints the failure would be one more silent record.
#
# The dispatch type is Flux's own `{Kind}/{Name}.{Namespace}`. An unmatched `repository_dispatch`
# leaves no trace on GitHub at all, which is why this workflow exists instead of the Alert alone.
# Like `deployment-status.yml` it cannot be tested from a pull request; the proof on #1454 is the
# first exercise.
name: Flux Source Failure

on:
  repository_dispatch:
    types: [ OCIRepository/event-junkie.flux-system ]

permissions: {}

# Per environment and queued: notification-controller drops repeats of an identical event for five
# minutes, and two different ones for the same cluster should both be seen.
concurrency:
  group: flux-source-failure-${{ github.event.client_payload.metadata.env }}
  cancel-in-progress: false

jobs:
  report:
    name: Report the failing source
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      # No checkout: the payload is the whole input. The keys arrive bare — notification-controller
      # strips the involved object's API-group prefix — and `env`/`cluster` come from the Alert's
      # `.spec.eventMetadata`.
      - name: Fail with the source's own message
        env:
          CLUSTER: ${{ github.event.client_payload.metadata.cluster }}
          REASON: ${{ github.event.client_payload.reason }}
          MESSAGE: ${{ github.event.client_payload.message }}
          REVISION: ${{ github.event.client_payload.metadata.revision }}
          CONTROLLER: ${{ github.event.client_payload.reportingController }}
        run: |
          set -euo pipefail
          {
            echo "## ${CLUSTER:-unknown cluster} — OCIRepository event-junkie failed"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Reason | ${REASON:-—} |"
            echo "| Revision | \`${REVISION:-—}\` |"
            echo "| Controller | ${CONTROLLER:-—} |"
            echo
            echo '```'
            echo "${MESSAGE:-no message in the payload}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Flux source failed on ${CLUSTER:-unknown cluster}::${REASON:-?}: ${MESSAGE:-no message in the payload}"
          exit 1
