# Configures GitHub's automatically generated release notes.
# full documentation: https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
#
# GitHub groups every merged pull request since the previous release into the first
# category whose `labels` it matches — so ORDER MATTERS. More specific categories come
# first: a `feat(scraper)` PR carries both `importer` and `feat`, and lands under
# "New Event Sources"; a bot dependency PR carries both `dependencies` and its
# Conventional Commits type, and lands under "Dependencies" because that category
# is ordered above both "Build & Tooling" and "Chores".
#
# Do not key anything on the type prefix here. Dependabot has already changed its own
# prefix once, from `build(deps)` to `chore(deps)`, without anything in this repository
# asking it to. The `dependencies` label is the stable signal, and it is matched before
# either type is reached.
#
# Labels are applied automatically from the Conventional Commits PR title by
# .github/workflows/label-pr.yml. The `enhancement`/`bug`/`documentation` aliases are
# GitHub's stock labels, kept so hand-labelled PRs land in the right bucket too.
#
# NOTE: the file must be named release.yml — GitHub does not pick up a .yaml extension.
changelog:
  exclude:
    labels:
      - ignore-for-release

  categories:
    - title: 🚨 Breaking Changes
      labels:
        - breaking-change

    - title: 🎪 New Event Sources
      labels:
        - importer

    - title: ✨ Features
      labels:
        - feat
        - enhancement

    - title: 🐛 Bug Fixes
      labels:
        - fix
        - bug

    - title: ⚡ Performance
      labels:
        - perf

    - title: ♻️ Refactoring
      labels:
        - refactor

    - title: 📖 Documentation
      labels:
        - docs
        - documentation

    - title: ✅ Tests
      labels:
        - test

    - title: ⬆️ Dependencies
      labels:
        - dependencies

    - title: 🏗️ Build & Tooling
      labels:
        - build

    - title: 🤖 CI
      labels:
        - ci

    - title: 💄 Styling
      labels:
        - style

    - title: 🧹 Chores
      labels:
        - chore

    - title: ⏪ Reverts
      labels:
        - revert

    # Catch-all for PRs whose title did not follow Conventional Commits.
    - title: 📦 Other Changes
      labels:
        - "*"
