# Issue-template chooser configuration.
# https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/configuring-issue-templates-for-your-repository
#
# The chooser lists forms in FILENAME order, which is why every form carries a numeric prefix.
# 1-3 are for visitors and come first; 4-8 are maintainer forms. A visitor should never have to
# scroll past an internal form to find the one that fits them.
#
# Every form also sets `type:`, which maps it to a GitHub issue type (Task / Bug / Feature, defined
# on the enorm-labs org). Issue types ARE the type axis in this repo — there is deliberately no
# `type:` label family to keep in sync with them.

# Forms only. A blank issue is almost always missing the one thing needed to act on it — which
# event, which venue, which URL — and asking for it afterwards costs a round trip and usually loses
# the reporter. Everything the forms deliberately do not cover has a route below.
blank_issues_enabled: false

contact_links:
  # Both of these must stay OFF the public tracker: a security problem should not be public before
  # it is fixed, and nobody should have to ask for their own name to be removed in front of an
  # audience. See SECURITY.md and the privacy notice (§4, "Event, artist and venue information").
  - name: 🔒 Report a security vulnerability
    url: https://github.com/enorm-labs/event-junkie/security/advisories/new
    about: Private disclosure, straight to the maintainer. Please do not open a public issue for this.

  - name: 🙋 Ask for your name or details to be removed
    url: https://github.com/enorm-labs/event-junkie/security/advisories/new
    about: >-
      Artists and organisers — you do not need a reason and you do not have to ask in public.
      This form is private. (It is labelled for security reports; it is the confidential channel
      until the site's contact address is live.)

  # Questions and ideas belong in Discussions rather than the issue tracker: they are conversations,
  # not units of work, and threading them keeps the tracker to things that can actually be closed.
  # A discussion that turns out to be actionable can be converted into an issue, so nothing is lost
  # by starting here.
  - name: 💬 Ask a question
    url: https://github.com/enorm-labs/event-junkie/discussions/new?category=q-a
    about: Anything about using the site, the data, or the code.

  - name: 💡 Suggest a feature or an idea
    url: https://github.com/enorm-labs/event-junkie/discussions/new?category=ideas
    about: For product ideas. To suggest a venue we should be importing, use the venue form instead.
