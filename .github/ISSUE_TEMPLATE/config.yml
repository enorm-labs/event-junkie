# Issue-template chooser configuration. See GitHub's "Configuring issue templates for your
# repository".
#
# The chooser lists forms in FILENAME order, hence the numeric prefixes: 1-3 are for visitors and
# come first, 4-8 are maintainer forms, and a visitor should never scroll past an internal form to
# find theirs. Every form also sets `type:`, mapping it to a GitHub issue type defined on the org.
# Issue types ARE the type axis here — there is deliberately no `type:` label family to sync.

# Forms only. A blank issue is almost always missing the one thing needed to act on it — which
# event, which venue, which URL — and asking afterwards costs a round trip and usually loses the
# reporter.
blank_issues_enabled: false

contact_links:
  # Both must stay OFF the public tracker: a security problem should not be public before it is
  # fixed, and nobody should have to ask for their own name to be removed in front of an audience.
  # **Both point at the advisory form by choice, not for want of a mailbox** — `security@` and
  # `hello@` are live (#274), but the form is encrypted in transit and at rest and it threads, so
  # the addresses are named in the text where anyone preferring email can copy them.
  #
  # **Not `mailto:`.** GitHub describes `url` as a link to follow, and `mailto:` is reported to fail
  # schema validation, at which point the entry does not render at all — worse than copying an
  # address, and it fails where nobody looks. **At go-live** the removal route should point at the
  # published privacy notice, which states the same address alongside the Art. 15-21 rights; it
  # cannot yet, production running dark with the domain resolving to nothing (#284).
  - name: 🔒 Report a security vulnerability
    url: https://github.com/enorm-labs/event-junkie/security/advisories/new
    about: >-
      Private disclosure, straight to the maintainer — encrypted, and it does not become public
      before a fix. Please do not open a public issue. Prefer email? security@event-junkie.de.

  - name: 🙋 Ask for your name or details to be removed
    url: https://github.com/enorm-labs/event-junkie/security/advisories/new
    about: >-
      Artists and organisers — you do not need a reason and you do not have to ask in public.
      Email hello@event-junkie.de, or use this private form if you would rather not. It is
      labelled for security because GitHub gives us one private form, not because this is one.

  # Questions and ideas belong in Discussions: they are conversations rather than units of work, and
  # keeping them out leaves the tracker to things that can be closed. One that turns out to be
  # actionable converts into an issue, so nothing is lost by starting here.
  - name: 💬 Ask a question
    url: https://github.com/enorm-labs/event-junkie/discussions/new?category=q-a
    about: Anything about using the site, the data, or the code.

  - name: 💡 Suggest a feature or an idea
    url: https://github.com/enorm-labs/event-junkie/discussions/new?category=ideas
    about: >-
      For product ideas. To suggest a venue we should be importing, use the venue form instead.
