# See the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
      spring-boot:
        patterns:
          - "org.springframework.boot*"
          - "org.springframework:*"
          - "io.spring.dependency-management*"
      spring-modulith:
        patterns:
          - "org.springframework.modulith*"
      jackson:
        patterns:
          - "tools.jackson*"
      springdoc:
        patterns:
          - "org.springdoc*"
      testcontainers:
        patterns:
          - "org.testcontainers*"
      kotest:
        patterns:
          - "io.kotest*"
      postgresql:
        patterns:
          - "org.postgresql*"
      flyway:
        patterns:
          - "org.flywaydb*"
      reactor:
        patterns:
          - "io.projectreactor*"
      detekt:
        patterns:
          - "dev.detekt*"
      gradle-plugins:
        patterns:
          - "io.github.ben-manes*"
          - "org.jlleitschuh.gradle*"
      owasp:
        patterns:
          - "org.owasp*"

  # The frontend pins every version exactly — no `^` or `~` anywhere in package.json, which is a
  # deliberate convention (see .github/prompts/update-dependencies.prompt.md). `increase` is what
  # preserves it: Dependabot rewrites the pin rather than widening it into a range.
  #
  # 45 exact pins would be 45 pull requests a week ungrouped, so the toolchains that have to move
  # together are grouped by family, and everything else is swept up by `frontend-minor-patch`.
  # A dependency lands in the *first* group it matches, so the families must stay above the sweep.
  # Majors outside a family stay ungrouped on purpose: a Vite or Vue major deserves its own PR.
  - package-ecosystem: "npm"
    directory: "/events-frontend"
    schedule:
      interval: "weekly"
    versioning-strategy: "increase"
    # The only suppression in this file, and it carries a reason and a date like every other one in
    # the repository (`.trivyignore`, `zizmor.yml`, `owasp-suppressions.xml`).
    #
    # 2026-08-13 — **TypeScript 7 is blocked by two things, neither of them ours** (#371, #420):
    #
    #   1. `vue-tsc@3.3.9` requires `typescript/lib/tsc`, which the TS 7 native port no longer
    #      exports. `npm run type-check` and `npm run build` both die with
    #      `ERR_PACKAGE_PATH_NOT_EXPORTED`. 3.3.9 is the latest vue-tsc, and its peer range
    #      (`typescript >=5.0.0`) is stale — npm installs the combination happily and it fails at
    #      run time, which is what makes this worth writing down rather than rediscovering.
    #   2. typescript-eslint cannot support TS 7 until TS 7 exposes an API at all
    #      (typescript-eslint#10940, labelled "blocked by external API"; 8.67.0 still declares
    #      `typescript >=4.8.4 <6.1.0`).
    #
    # Without this entry Dependabot re-opens the same unmergeable pull request every week, and a
    # weekly PR that is always closed unread is how people learn to ignore Dependabot.
    #
    # Deliberately `semver-major` rather than `versions: ["7.x"]`: the whole 7-and-later line is the
    # restructured Go port, so 8.x would be blocked for the same reason. Minor and patch updates on
    # 6.x still come through. **`vue-tsc` is deliberately NOT ignored** — a vue-tsc release is the
    # thing that unblocks this, so we want to be told about it.
    #
    # **Remove this the moment #371 closes.** A suppression that outlives its issue is an upgrade
    # that has been quietly switched off.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      vue:
        patterns:
          - "vue"
          - "vue-router"
          - "vue-i18n"
          - "@vue/*"
          - "@vitejs/plugin-vue"
          - "@intlify/*"
      linting:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "oxlint"
          - "oxfmt"
          - "@vitest/eslint-plugin"
      testing:
        patterns:
          - "vitest"
          - "@vitest/coverage-v8"
          - "@playwright/*"
          - "@axe-core/*"
          - "jsdom"
      typescript:
        patterns:
          - "typescript"
          - "vue-tsc"
          - "@types/*"
          - "@tsconfig/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tailwind-merge"
          - "tw-animate-css"
      frontend-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Keeps the `uses:` pins in .github/workflows/ current. `/` is correct here and does not mean the
  # repository root in the usual sense — for this ecosystem Dependabot always reads .github/workflows.
  # One group, because an action bump is a one-line change and fourteen separate PRs for fourteen
  # actions is how people learn to ignore Dependabot.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  # `opentofu`, not `terraform`. They are separate ecosystems with separate registries, and the
  # lock files in infra/ record providers as `registry.opentofu.org/...` — the `terraform`
  # updater would rewrite them to `registry.terraform.io` and churn every one of them.
  #
  # What this actually produces: `versions.tf` pins `~> 1.68`, which already permits 1.69, so
  # Dependabot leaves the constraint alone until 2.0. It updates `.terraform.lock.hcl` instead,
  # which is the file that decides the version actually used — and it preserves the platforms
  # already recorded there (linux_amd64, linux_arm64, darwin_arm64). That is the useful half.
  - package-ecosystem: "opentofu"
    directories:
      - "/infra/bootstrap"
      - "/infra/environments/*"
      - "/infra/modules/*"
    schedule:
      interval: "weekly"
    groups:
      # One PR for all four directories. Without this a single provider release opens four,
      # each bumping the same version in a different lock file.
      opentofu:
        patterns:
          - "*"

  # The base image in every Dockerfile is pinned by tag *and* digest, and this is what keeps the
  # digest from going stale. Without it a pinned digest is a promise never to get a security fix:
  # `bellsoft/liberica-openjre-alpine:25` moves, the digest does not, and nothing says so.
  #
  # Alpine advisories are fixed by rebuilds, so merging these PRs is the remediation path itself
  # rather than housekeeping (#492, ADR-017).
  #
  # It updates the tag too, not only the digest — and the limit is not what it notices but what it
  # can do about it. In #264 the Trivy gate found 10 fixable HIGH Alpine advisories in the frontend
  # image; Dependabot had already opened #437 proposing exactly that bump, and it was sitting open.
  # **An open Dependabot PR is a live vulnerability**, and nothing in its title says which of the two
  # it is. Merging these promptly is the control; the image scan in release.yml is what makes an
  # unmerged one fail a build instead of waiting quietly.
  #
  # A directory per Dockerfile, because the ecosystem discovers them per directory and each module
  # owns its own. All three are grouped into one PR: the two backends pin the same JRE, so a single
  # release would otherwise open two identical PRs, and the frontend's nginx is cheap to carry along.
  # compose.yaml belonged to no ecosystem until #819. The `docker` updater above reads Dockerfiles
  # only, so `postgres` sat unwatched here for as long as it has existed — the MinIO added for the
  # image cache merely joined it. Docker Compose is its own ecosystem in dependabot-core, not a
  # directory of the `docker` one, which is why this is a separate entry rather than another path.
  #
  # These are development services. A stale pin here never reaches production, and it does decide
  # what a local run and a Testcontainers test exercise — so a Postgres that drifts from the
  # cluster's is a difference nobody sees until a deploy.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      compose-services:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/events-bff"
      - "/events-importer"
      - "/events-frontend"
    schedule:
      interval: "weekly"
    ignore:
      # **The JRE major follows the toolchain, not the registry.** ADR-017 chose Liberica partly for
      # offering a version-pinned tag, and rejected Chainguard for the opposite: its free tier
      # publishes only `latest`, so "the runtime's major version would track Chainguard's release
      # schedule rather than ours". A major bump merged here reintroduces exactly that drift with a
      # different vendor — #509 proposed 25 -> 26 and would have passed CI, because bytecode built
      # for 25 runs happily on a 26 JRE. Nothing would have failed; the runtime would simply have
      # stopped matching `java.version` without anyone deciding it should.
      #
      # It is also the wrong direction on support. **25 is an LTS; 26 is not** — released 2026-03-17,
      # with updates ending when 27 ships in September 2026. Merging it would have moved production
      # onto a JRE going EOL within the month, in the same repository that empties `.trivyignore` and
      # gates releases on `trivy --severity CRITICAL,HIGH`.
      #
      # Patch bumps still come through, and they are the ones that matter: `25.0.4` -> `25.0.5` is
      # how a pinned digest gets its security fixes, which is the whole reason this ecosystem is
      # configured at all. Only the major is held.
      #
      # Lift this at the Java upgrade — 25 -> 29 (LTS, September 2027), or 27 if something in it
      # earns the move. ADR-017's own consequences name "the Java 26 upgrade" as the moment to
      # re-draw the base-image comparison, so this is a deferral to that decision, not a veto.
      - dependency-name: "bellsoft/liberica-openjre-alpine"
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        patterns:
          - "*"

  # No entry for the Helm chart in deploy/, and that is a non-change worth recording so it is not
  # re-investigated: Dependabot has no Helm ecosystem, and the chart has no `dependencies:` block
  # for one to watch anyway — PostgreSQL runs on a VM per ADR-012, so there is no subchart. The
  # versions the chart does pin are container image tags, which #426 will bring under the `docker`
  # ecosystem via the Dockerfiles rather than via the chart.
  #
  # **What this file does NOT watch now has an owner: `.github/renovate.json5`** (#384, ADR-024).
  # Renovate covers the chart versions inside Flux `HelmRelease` manifests, Flux itself, the images
  # pinned in plain Kubernetes manifests, one image in the chart's `values.yaml`, gitleaks' `rev:`
  # in `.pre-commit-config.yaml`, and the Gradle wrapper — every one of them a version string that
  # belongs to no ecosystem here. Its `enabledManagers` is an allow-list that deliberately excludes
  # all six ecosystems above, so the two bots cannot propose the same bump. **Read both files before
  # concluding something is unwatched**, and add a new ecosystem here rather than there whenever
  # Dependabot can express it — a manifest it understands beats a pattern we maintain.
