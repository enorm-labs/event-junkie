# zizmor — security lint for GitHub Actions workflows. Adopted by #383 after a real run, because it
# is the only tool in this repository that looks at `.github/workflows/` at all, and on its first run
# it found three genuine problems that nothing else here would have: a template injection, a
# cache-poisoning path into the publishing workflow, and two workflow-level permission grants that
# belonged to single jobs.
#
# The chart's `helm unittest` suites are the model for what a gate here is worth: they fail the
# build rather than posting an advisory. Everything below is a *suppression*, and each one carries a
# reason and a date, the same rule `.trivyignore` and `owasp-suppressions.xml` are held to.

rules:
  unpinned-uses:
    config:
      policies:
        # 2026-08-18 — **raised to `hash-pin` because #443 landed.** Every `uses:` in
        # `.github/workflows/` now names a commit SHA with the human-readable version as a trailing
        # comment, which is the form Dependabot maintains, so the ongoing cost is the same as it was
        # with tags and the gate can hold the stronger line.
        #
        # It replaces the `ref-pin` downgrade this file carried from 2026-08-12, whose own comment
        # said to raise it the moment #443 landed — *"a suppression that outlives its issue is a gate
        # that has been quietly switched off"*. There is nothing left to suppress here: the next
        # action added must arrive pinned or the build fails, which is the half of item 4 that does
        # not depend on a repository setting being remembered.
        "*": hash-pin
