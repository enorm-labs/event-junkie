<!doctype html>
<!-- WCAG 3.1.1 Language of Page (Level A). An empty `lang` is worse than a wrong one: assistive
     tech falls back to the user's system language and mispronounces the whole page. Becomes
     dynamic when locales land — see docs/LEGAL.md §6.2. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link href="/favicon.svg" rel="icon" type="image/svg+xml" />
    <link href="/favicon.ico" rel="icon" sizes="32x32" />
    <link href="/apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Event Junkie — Can't get enough of Berlin</title>

    <!--
      Site-level meta and social-share tags. The SPA keeps `og:title`/`twitter:title` in
      sync per view (see usePageTitle), which reaches JS-executing crawlers; non-JS
      scrapers fall back to these static values. Full per-route coverage needs SSR/prerender.
    -->
    <meta
      content="Concerts, club nights, festivals and more across Berlin venues. Find your next event with Event Junkie."
      name="description"
    />
    <meta content="website" property="og:type" />
    <meta content="Event Junkie" property="og:site_name" />
    <meta content="Event Junkie — Can't get enough of Berlin" property="og:title" />
    <meta
      content="Concerts, club nights, festivals and more across Berlin venues. Find your next event with Event Junkie."
      property="og:description"
    />
    <!--
      og:image is an ABSOLUTE URL by spec — relative paths are not resolved by most scrapers, so
      this is the one place the production origin is hard-coded rather than derived. The card is
      `summary_large_image` because there is one: `summary` renders a thumbnail beside the text and
      wastes a 1200x630 asset.
    -->
    <meta content="https://event-junkie.de/og-image.png" property="og:image" />
    <meta content="1200" property="og:image:width" />
    <meta content="630" property="og:image:height" />
    <meta content="Event Junkie — can't get enough of Berlin" property="og:image:alt" />
    <meta content="summary_large_image" name="twitter:card" />
    <meta content="https://event-junkie.de/og-image.png" name="twitter:image" />
    <meta content="Event Junkie — Can't get enough of Berlin" name="twitter:title" />
    <meta
      content="Concerts, club nights, festivals and more across Berlin venues. Find your next event with Event Junkie."
      name="twitter:description"
    />
    <script>
      // Apply the theme before first paint so a reload never flashes the wrong mode.
      // New visitors default to dark (nightlife brand); an explicit stored choice always wins.
      try {
        if (localStorage.getItem('theme') !== 'light') {
          document.documentElement.classList.add('dark')
        }
      } catch {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script src="/src/main.ts" type="module"></script>
  </body>
</html>
