# Server block for the built SPA. Replaces the base image's /etc/nginx/conf.d/default.conf and NOT
# its /etc/nginx/nginx.conf, which is what makes the image unprivileged-safe: `pid /tmp/nginx.pid`,
# every *_temp_path in /tmp, logs symlinked to /dev/stdout and /dev/stderr, so /tmp is the one
# writable path on a read-only root.
#
# No `/api` proxy: the ingress routes /api to the BFF, which serves under /api itself via
# `spring.webflux.base-path`. Running this image alone gives a site whose API calls 404.

# Access-log format (#276). The base image's default `main` format ends with
# `"$http_x_forwarded_for"`, the field that puts a visitor's public IP on disk: Traefik populates
# it with the immediate client, and since ADR-012 dropped Cloudflare that is the visitor.
# `$remote_addr` is Traefik's own pod address. Observed on a k3d rehearsal:
#
#     10.42.1.5 - - [19/Aug/2026:19:54:32 +0000] "GET / HTTP/1.1" 200 1212 "-" "curl/8.7.1" "10.42.1.1"
#     └─ Traefik                                                                          └─ the client
#
# A dynamic IP held by an online service is personal data (Breyer, C-582/14), so this decides
# what the privacy notice declares (LEGAL.md §7.5). `$remote_addr` is dropped too: harmless only
# while a proxy sits in front, and logging no address stays true when the topology changes.
# Kept: time, request, status, bytes, referrer, user agent, which is what separates probe traffic
# from real requests. `log_format` is an `http`-context directive, so it belongs at the top of
# this file, not in the `server` block.
log_format ej_no_ip '[$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

# Kubernetes probes are the majority of this container's access log and none of its signal: the
# kubelet requests `GET /` on the visitor's port and path, so only the user agent differs.
# Measured on production: 1,079 probe lines an hour. `map` is an `http`-context directive. A user
# agent matching nothing is logged, so a new probe is visible until added here and a new visitor
# is never silently dropped. Better Stack's uptime bot is deliberately absent: its line is
# evidence the site answered the internet.
map $http_user_agent $ej_log_request {
    default            1;
    "~^kube-probe/"    0;
}

server {
    listen 8080;

    # Overrides the base image's http-level `access_log … main`, which carries X-Forwarded-For.
    # /dev/stdout rather than the file the base image symlinks there.
    access_log /dev/stdout ej_no_ip if=$ej_log_request;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hide the version from error pages and the Server header.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Vite content-hashes everything under /assets/, so a year of immutable caching is safe.
    # `try_files $uri =404` rather than the SPA fallback: a stale index.html requesting a deleted
    # bundle would receive index.html as text/html with 200, a blank page instead of an honest 404.
    # No `always` here, unlike the blocks below: with it a browser would cache "this asset does not
    # exist" for a year; without it nginx applies the header to success and redirect codes only,
    # which already includes 304.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # The self-hosted map (`scripts/map-assets.sh`), copied in from its own image. MapLibre reads
    # `berlin.pmtiles` with Range requests, which static files answer without configuration. The
    # names carry no hash, so a week rather than a year; a refresh is rare and only redraws the map.
    location /map/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # index.html must never be cached: it is the only file whose URL is stable while its contents
    # change on every deploy, and a cached copy pins a browser to deleted bundles, the white screen
    # after a deploy. Both locations are needed: `/` does not match `location = /index.html`, and the
    # site root would otherwise be cached heuristically.
    location = / {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # The index and the static pages' sitemap, generated at build time by the seoFiles() Vite plugin
    # from the router's LOCALES and INDEXABLE_PATHS. An hour: a crawler is never long wrong.
    location ~ ^/sitemap(-pages)?\.xml$ {
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Nothing in a built SPA is a dotfile. Anything asking for one is probing.
    location ~ /\. {
        deny all;
    }

    # The detail sitemaps (#367): the BFF renders them and the sidecar forwards them. They are served
    # here at the root because a sitemap only vouches for URLs under its own directory, and the BFF's
    # path is `/api`. No `error_page`: a crawler retries a 502, and an HTML shell under an `.xml`
    # name would be read as a broken sitemap. The sidecar budgets 10s for the BFF. The weeks
    # sitemap (#2728) follows from the date, so the sidecar writes it without the BFF.
    location ~ ^/sitemap-(events|venues|artists|promoters|weeks)\.xml$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_connect_timeout 100ms;
        proxy_send_timeout 2s;
        proxy_read_timeout 15s;
    }

    # The RSS feed of new events (#368), at the root so its public URL does not depend on the API's
    # path. The sidecar forwards it with its query, which carries the list's filters, to
    # `/api/events/feed`. `If-None-Match` passes through, so a polling reader gets a 304.
    location = /feed.xml {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_connect_timeout 100ms;
        proxy_send_timeout 2s;
        proxy_read_timeout 5s;
    }

    # The calendar subscription (#2719), the same way: the sidecar forwards the query to
    # `/api/events/calendar.ics`. Up to 500 events, so it gets the sitemaps' longer budget.
    location = /calendar.ics {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_connect_timeout 100ms;
        proxy_send_timeout 2s;
        proxy_read_timeout 15s;
    }

    # The four detail route families, the static pages and the week pages (#2728) go through the
    # meta-injection sidecar (ADR-014 §Decision 3, injector/server.ts), which fills the head of
    # index.html for scrapers that run no JavaScript, and redirects `/week` to this week. A regex
    # location wins over the prefix fallback below, and the regex is the same shape as
    # `injector/routes.ts`, so an edit here cannot widen what the sidecar answers for. `injector/__tests__/routes.spec.ts` reads this file and holds the two together.
    #
    # Every failure ends in the plain shell: `proxy_intercept_errors` hands the sidecar's 404 and 502
    # to `error_page`, and a sidecar that is down or slow lands there through 502/504. A 404 keeps its
    # status, because it is the BFF saying the slug does not exist, and a 200 would be a soft 404 in
    # Search Console. A 5xx becomes 200: the page may well exist, and the SPA can still render it.
    # The timeouts are tight because the sidecar budgets 1.5s for the BFF and answers 502 past it. A
    # missing sidecar costs one refused loopback connect per request, logged; that line is the
    # signal.
    #
    # Nothing about the visitor is passed on: the sidecar reads no request header, and Traefik's two
    # forwarding headers are cleared here (LEGAL.md §7.5).
    location ~ ^/(en|de)(/(events|venues|artists|promoters)/[a-z0-9][a-z0-9-]*|/events|/venues|/promoters|/calendar|/map|/about|/legal/(imprint|privacy|notices|for-venues)|/week(/[0-9]{4}-[0-9]{2})?)?/?$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_connect_timeout 100ms;
        proxy_send_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors on;
        error_page 404 @spa;
        error_page 500 502 503 504 = @spa;
        add_header Cache-Control "no-cache" always;
    }

    # The app routes that are no page of their own: search is one page per query, and its route meta
    # says noindex. The injector answers only what the sitemap lists, so it would 404 these; the shell
    # is served with 200 instead, and the header says noindex before any script runs.
    location ~ ^/(en|de)/search/?$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex" always;
        try_files /index.html =404;
    }

    # The fallback the blocks above and below land on: a named location cannot be entered from
    # outside. It answers with whatever status `error_page` passes in, 404 without `=` and 200 with.
    location @spa {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # Every route the app has is matched above, so a path that reaches this block and is not a file
    # is a page that does not exist. It still gets the app, whose router sends the visitor to a
    # locale's home, but with 404, not 200: a crawler must not index a nonsense URL as the home page.
    location / {
        try_files $uri =404;
        error_page 404 @spa;
    }
}
