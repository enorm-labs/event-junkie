# Server block for the built SPA. Replaces the base image's /etc/nginx/conf.d/default.conf and
# deliberately does NOT replace its /etc/nginx/nginx.conf: that file is what makes the image
# unprivileged-safe, and re-writing it is how those properties get lost. It already sets
# `pid /tmp/nginx.pid`, redirects every *_temp_path into /tmp (overriding the compiled
# /var/cache/nginx defaults), and symlinks the access and error logs to /dev/stdout and /dev/stderr.
# Together that is why this container needs exactly one writable path — /tmp — on a read-only root
# filesystem.
#
# There is no `/api` proxy here, and that is not an omission. The ingress routes /api to the BFF and
# / to this container, so an API request never reaches nginx. The BFF serves under /api itself via
# `spring.webflux.base-path`, so nothing rewrites anything anywhere. Consequence worth knowing:
# running this image on its own gives a working site whose API calls 404.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hide the version from error pages and the Server header.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Vite content-hashes everything under /assets/, so a given URL's bytes can never change and a
    # year of immutable caching is safe.
    #
    # `try_files $uri =404` rather than falling back to index.html: a missing asset must 404
    # honestly. With the SPA fallback applied here a stale index.html requesting a hashed bundle
    # that no longer exists would receive index.html with HTTP 200 and a text/html content type,
    # and the browser would fail to parse it as JavaScript — a blank page and a console error
    # instead of a 404 that says what happened.
    #
    # Note the absence of `always` on this one, unlike the blocks below, and do not add it: with
    # `always` the header is attached to *every* response including the 404 above, so a browser
    # would cache "this asset does not exist" for a year. Without it nginx applies the header to
    # the success and redirect codes only — a list that already includes 304, which is the case
    # `always` would otherwise have been there to cover.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # index.html must never be cached: it is the only file whose URL is stable while its contents
    # change on every deploy, and it is what names the hashed assets. A cached copy pins a browser
    # to bundles that have already been deleted, which is the classic white screen after a deploy.
    #
    # Both locations are needed. `/` does not match `location = /index.html`, so without the first
    # block the site root — the most requested URL there is — would be served with no
    # Cache-Control at all and cached heuristically.
    location = / {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Generated at build time by the seoFiles() Vite plugin from the same LOCALES and
    # INDEXABLE_PATHS the router uses, so they change whenever routes do. An hour is short enough
    # that a crawler is never long wrong, and long enough to be worth setting.
    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Nothing in a built SPA is a dotfile. Anything asking for one is probing.
    location ~ /\. {
        deny all;
    }

    # Vue Router history mode: a deep link is a real URL to the browser and a nonexistent path to
    # nginx, so unmatched paths serve the app and let the router resolve them. The internal
    # redirect re-enters location matching, so the fallback picks up the no-cache header above.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
