- main:
  - heading "Kalender" [level=1]
  - paragraph: Kommende Musikveranstaltungen in Berlin im Überblick.
  - search:
    - searchbox "Events durchsuchen …"
  - button "Mehr Filter"
  - button "Vorheriger Monat"
  - button "Nächster Monat"
  - button "Heute" [disabled]
  - heading /August \d+/ [level=2]
  - tablist:
    - tab "Ansicht Monat" [selected]
    - tab "Ansicht Woche"
    - tab "Ansicht Liste"
  - table /August \d+/:
    - rowgroup:
      - row "Montag Dienstag Mittwoch Donnerstag Freitag Samstag Sonntag":
        - columnheader "Montag"
        - columnheader "Dienstag"
        - columnheader "Mittwoch"
        - columnheader "Donnerstag"
        - columnheader "Freitag"
        - columnheader "Samstag"
        - columnheader "Sonntag"
    - rowgroup:
