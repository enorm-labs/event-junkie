<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>DSTRKT | MODULAR EVENT SPACE | BERLIN</title>
    <!--
        Hand-crafted variant of dstrkt-overview.html with the same Wix Data record shape, carrying the
        states the live collection did not show when it was captured: a rich-text description, a last
        day before the start, a record with no date, one with a blank title and one with no ticket link.
    -->
    <script type="application/json" id="wix-warmup-data">{
        "appsWarmupData": {
            "dataBinding": {
                "dataStore": {
                    "recordsByCollectionId": {
                        "UPCOMINGEVENTS": {
                            "rich-text": {
                                "_id": "rich-text",
                                "title": "SUMMER RAVE",
                                "date": { "$date": "2027-06-12T20:00:00.000Z" },
                                "date2nd": "2027-06-11",
                                "tickets": "https://de.ra.co/events/1",
                                "eventbeschreibung": "<p><span>Two floors of </span><strong>techno</strong><span> until noon.</span></p><p>Garden open.</p>"
                            },
                            "no-date": {
                                "_id": "no-date",
                                "title": "DATE TBA"
                            },
                            "blank-title": {
                                "_id": "blank-title",
                                "title": "  ",
                                "date": { "$date": "2027-07-03T20:00:00.000Z" }
                            },
                            "no-tickets": {
                                "_id": "no-tickets",
                                "title": "OPEN AIR",
                                "date": { "$date": "2027-07-10T12:00:00.000Z" }
                            }
                        }
                    }
                }
            }
        }
    }</script>
</head>
<body></body>
</html>
