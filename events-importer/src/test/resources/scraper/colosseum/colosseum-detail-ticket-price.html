n<\/p>\n<p>his late teens before embarking on a solo career. Tracks from his debut solo album <em>Piano Solos<\/em><\/p>\n<p>(2004) caught the attention of music supervisor Brian Reitzell, who shared them with Sofia<\/p>\n<p>Coppola to help inspire her script for <em>Marie Antoinette<\/em>. Coppola invited him to contribute music<\/p>\n<p>to the film, which marked his breakthrough as a film composer. These tracks were subsequently included in his second solo album <em>Piano Solos Vol 2 <\/em>(2006).<\/p>\n<p>O’Halloran’s third and fourth solo albums <em>Vorleben <\/em>(2010) and <em>Lumiere <\/em>(2011) followed, with the latter being mixed by the late Jóhann Jóhannsson. In 2011, he also co-founded the band A Winged Victory for the Sullen with Adam Wiltzie of Stars of the Lid, while continuing his work scoring films.<\/p>\n<p>As part of A Winged Victory For The Sullen, he worked on Jalil Lespert’s film <em>In the Shadow of Iris <\/em>in 2016. This music was released as the album <em>Iris <\/em>the same year. The band’s catalogue also includes <em>Atomos <\/em>(2014), based on music composed for a dance piece by Wayne McGregor, resident choreographer for The Royal Ballet in London; <em>The Undivided Five <\/em>(2019), which was released by Ninja Tune; and their last album <em>Invisible Cities <\/em>(2021), released as a side project under their own label Artificial Pinearch Manufacturing. It contains music from the Manchester- Festival-produced live performance Invisible Cities, which the band scored in 2019.<\/p>\n<p>O’Halloran signed with renowned classical music label Deutsche Grammophon in early 2019, releasing the EP <em>Sundoor <\/em>(2019), which offers a 20-minute piece entitled ‘196 Hz’, adapted from a 2017 site-specific composition for cross-disciplinary American artist Slater Bradley’s ‘Sundoor At World’s End’. His next album released by the label, <em>Silfur <\/em>(2021), revisits select songs from his catalogue, exploring time and place. In 2021, he contributed &#34;What Gently Flutters&#34; to the Deutsche Grammophon Christmas album Winter Tales, featuring Bryan Senti.<\/p>\n<p>O’Halloran also produced Katy Perry’s ‘Into Me You See’ on her 2017 album <em>Witness<\/em>, collaborated with Gyda Valtýsdóttir for the EP <em>3 Movements <\/em>in 2017, and appears on Leonard Cohen’s 2019 posthumous album <em>Thanks For The Dance<\/em>.<\/p>\n<p>In 2019 he premiered the electronic composition <em>1 0 0 1 <\/em>at Minneapolis’s Liquid Music Series with choreographer Fukiko Takase. It was well-received, but subsequent productions were halted by the pandemic. O’Halloran’s latest record <em>1 0 0 1, <\/em>released on Deutsche Grammophon in March 2024, is an expansion of that composition, marking a departure from the introspective solo piano music with which he first made his name. Recorded at RRO Studios in Reykjavík, it features his collaborator Bryan Senti on violin, an eight-voice choir, Paul Corley on electronic production, and the Budapest Art Orchestra orchestrated by Roman Vinuesa, mixed by Francesco Donadello.<\/p>","mainImage":{"id":"fb623f_6d2f2948a10d458da093534e9d1cb232~mv2.png","url":"https:\/\/static.wixstatic.com\/media\/fb623f_6d2f2948a10d458da093534e9d1cb232~mv2.png","height":357,"width":1020},"slug":"investment","language":"de","created":"2026-06-26T08:49:25.088Z","modified":"2026-07-16T17:59:44.000Z","status":0,"registration":{"type":2,"status":5,"rsvpCollection":{"config":{"rsvpStatusOptions":0,"waitlist":false,"confirmationMessages":{"positiveConfirmation":{"title":"Vielen Dank!","message":"Wir haben die Veranstaltungsdetails per E-Mail gesendet.","addToCalendarActionLabel":"Zum Kalender hinzufügen","shareActionLabel":"Teilen"},"waitlistMessages":{"title":"Danke! Du wurdest auf die Warteliste gesetzt.","message":"Wir informieren dich, wenn Plätze frei werden.","addToCalendarActionLabel":"Zum Kalender hinzufügen","shareActionLabel":"Teilen"},"negativeMessages":{"title":"Schade, dass du nicht kommen ka bellingSettings":{"assignedContactsLabelDeleted":false},"longDescription":{"nodes":[{"type":"PARAGRAPH","id":"hbpez240","nodes":[{"type":"TEXT","id":"","nodes":[],"textData":{"text":"Einlass: 19:00 Uhr","decorations":[{"type":"BOLD","fontWeightValue":700}]}}],"paragraphData":{"textStyle":{"textAlignment":"AUTO"}}},{"type":"PARAGRAPH","id":"juatt241","nodes":[{"type":"TEXT","id":"","nodes":[],"textData":{"text":"Beginn: 20:00 Uhr","decorations":[{"type":"BOLD","fontWeightValue":700}]}}],"paragraphData":{"textStyle":{"textAlignment":"AUTO"}}},{"type":"PARAGRAPH","id":"2oh8e242","nodes":[],"paragraphData":{"textStyle":{"textAlignment":"AUTO"}}},{"type":"PARAGRAPH","id":"7474m321","nodes":[],"paragraphData":{"textStyle":{"textAlignment":"AUTO"}}},{"type":"PARAGRAPH","id":"hk3bc325","nodes":[],"paragraphData":{"textStyle":{"textAlignment":"AUTO"}}},{"type":"PARAGRAPH","id":"556mq478","nodes":[{"type":"TEXT","id":"","nodes":[],"textData":{"text":"Früher war alles billiger","decorations":[{"type":"BOLD","fontWeightValue":700}]}}],"paragraphData":{"textStyle":{"textAlignment":"AUTO"}}},{"type":"PARAGRAPH","id":"1avn0422","nodes":[{"type":"TEXT","id":"","nodes":[],"textData":{"text":"Wir sollten über unser Verhältnis zum Geld sprechen. Wir leben in einer Zeit der Preisnostalgie, in der die Menschen nichts stärker vereint, als Erinnerungen an Tage, als das Pfund Butter noch eine Mark gekostet hat. Denn das Geld treibt sich inzwischen immer irgendwo anders rum, und lässt uns allein mit dem Preis sitzen. Momentan ist das Geld besonders gern bei reichen Menschen und arbeitet für diese. Während der Preis besonders gern bei allen anderen ist und gegen diese arbeitet. Das ist der Unterschied zwischen Konsum und Investition. Ein Paartherapeut würde nun vorschlagen mal wieder etwas Gemeinsames zu unternehmen. Einen Ausflug vielleicht, zusammen Sport machen, ins Museum gehen oder Theater? Wir haben Musik gemacht und es Investment genannt. Denn die wahre Währung in unserem Leben ist Zeit und die haben wir gemeinsam investiert. Wir denken es hat sich gelohnt, auch wenn wieder nur Lieder bei rumgekommen sind. 10, um genau zu sein. Musikalisch bewegen sich die Songs zwischen dem, was Ramin Bijan gut findet, dem, was Gunther Osburg mag, und dem musikalischen Geschmack von Maurice Summen. Wobei es da natürlich noch viel mehr gäbe, aber soviel Zeit hatten wir dann doch nicht.","decorations":[{"type":"BOLD","fontWeightValue":700}]}}],"style":{},"paragraphData":{"textStyle":{"textAlignment":"AUTO"}}},{"type":"PARAGRAPH","id":"wn4e5426","nodes":[{"type":"TEXT","id":"","nodes":[],"textData":{"text":"Investment – Wieder nur Lieder","decorations":[{"type":"BOLD","fontWeightValue":700}]}}],"style":{},"paragraphData":{"textStyle":{"textAlignment":"AUTO"}}},{"type":"PARAGRAPH","id":"h209h428","nodes":[{"type":"TEXT","id":"","nodes":[],"textData":{"text":"Ramin Bijan, Gunther Osburg und Maurice Summen spielen seit vielen Jahren in verschiedenen Formationen und Bands zusammen. Die Türen und Der Mann veröffentlichen regelmäßig neue Alben. Warum braucht es also ein drittes Parallel-Projekt? Wahrscheinlich weil zwei Bands für drei Musiker zu wenig sind. Darum haben sie jetzt Investment gegründet.","decorations":[{"type":"BOLD","fontWeightValue":700}]}}],"style":{},"paragraphData":{"textStyle":{"textAlignment":"AUTO"}}},{"type":"PARAGRAPH","id":"imfi2430","nodes":[{"type":"TEXT","id":"","nodes":[],"textData":{"text":"Das Konzept ist so simpel wie einleuchtend: Wenn man vor 40 Jahren zeitlose Klassiker schreiben konnte, warum sollte das heute nicht gehen?! Zumal wir heute ja bereits wissen, wie diese klingen würden, und deswegen nicht noch einmal 40 Jahre warten müssten. Kontrafaktische Popmusik aus makellosem Songwriting und einem Sounddesign wie eine Mid-Century Teakholzkommode mit RGB-Beleuchtungsstreifen, die sich zwischen 10CC und CCR, zwischen NRBQ und The Cars, zwischen La Düsseldorf und den Eagles im C64 Rubber Band Club bewegt.","decorations":[{"type":"BOLD","fontWeightValue":700}]}}],"style":{},"paragraphData":{"textStyle":{"textAlignment":"AUTO"}}},{"type":"PARAGRAPH","id":"0pcnd432","nodes":[{"type":"TEXT","id":"","nodes":[],"textData":{"text":"Zum Albumstart laden Investment zu drei exklusiven Kinoevents ein: Die drei Musiker präsentieren Lyric-Videos aller 10 Albumtracks auf großer Leinwand. Anschließend spricht die Band mit ausgewählten Journalist:innen (Dirk Böhme in Hamburg, Silke Super in Berlin und Wolfgang Frömberg in Köln) über ihre Kunst, ihre Visionen und vermutlich auch darüber, warum man drei Projekte parallel betreiben muss, um wirklich produktiv zu sein. Den Abend krönt ein kurzes Live-Set: Für alle, die wissen wollen, wie sich 1984 heute anfühlt.","decorations":[{"type":"BOLD","fontWeightValue":700}]}}],"style":{},"paragraphData":{"textStyle":{"textAlignment":"AUTO"}}},{"type":"PARAGRAPH","id":"rc0u7434","nodes":[{"type":"TEXT","id":"","nodes":[],"textData":{"text":"Präsentiert wird die Veranstaltung von „Der Interrationale Frühschoppen“, dem offiziellen Podcast zum Album, und ","decorations":[{"type":"BOLD","fontWeightValue":700}]}},{"type":"TEXT","id":"","nodes":[],"textData":{"text":"Byte.FM","decorations":[{"type":"BOLD","fontWeightValue":700},{"type":"LINK","linkData":{"link":{"url":"http:\/\/Byte.FM","target":"BLANK","rel":{"noreferrer":true}}}}]}},{"type":"TEXT","id":"","nodes":[],"textData":{"text":".","decorations":[{"type":"BOLD","fontWeightValue":700}]}}],"style":{},"paragraphData":{"textStyle":{"textAlignment":"AUTO"}}},{"type":"PARAGRAPH","id":"9arsg438","nodes":[{"type":"TEXT","id":"","nodes":[],"textData":{"text":"Das Album „Wieder nur Lieder“ erscheint am 02.10.2026 bei dem Label, das sie mit einer ihrer Bands einmal gegründet haben: Staatsakt.","decorations":[{"type":"BOLD","fontWeightValue":700}]}}],"style":{},"paragraphData":{"textStyle":{"textAlignment":"AUTO"}}}],"documentStyle":{}},"publishedDate":"2026-06-26T08:53:07.757Z","badges":[]}},"eventsSettings":{"id":"a98b7c35-fc04-455b
