<script type="application/json" id="wix-warmup-data">{"appsWarmupData": {"140603ad-af8d-84a5-2c80-a0f60cb47351": {"EventsPageInitialState": {"event": {"event": {"id": "6ddce24a-18d7-47de-a168-f2f4c8f1a047", "title": "Gysis Begegnungen mit … Felix Jaehn", "slug": "gysis-begegnungen-mit-felix-jaehn", "scheduling": {"config": {"scheduleTbd": false, "startDate": "2026-10-04T09:00:00.000Z", "endDate": "2026-10-04T11:30:00.000Z", "timeZoneId": "Europe/Berlin", "endDateHidden": false, "showTimeZone": false, "recurrences": {"occurrences": [], "status": 0}}, "formatted": "4. Oktober 2026, 11:00–13:30 Uhr", "startDateFormatted": "4. Oktober 2026", "startTimeFormatted": "11:00", "endDateFormatted": "4. Oktober 2026", "endTimeFormatted": "13:30"}, "description": "DJ, Musikproduzent und international erfolgreicher Künstler", "about": "<p>Einlass: 19 Uhr</p>\n<p>Beginn: 20 Uhr</p>\n<p></p>\n<p>Dustin O’Halloran is an American pianist and composer with six acclaimed solo albums under his own name, and is a member of the band A Winged Victory for the Sullen, which has released five albums, some based on scores and soundtracks.</p>\n<p>He previously released music with dreampop band Dēvics – which he co-founded with Sara Lov in</p>\n<p>his late teens before embarking on a solo career. Tracks from his debut solo album <em>Piano Solos</em></p>\n<p>(2004) caught the attention of music supervisor Brian Reitzell, who shared them with Sofia</p>\n<p>Coppola to help inspire her script for <em>Marie Antoinette</em>. Coppola invited him to contribute music</p>\n<p>to the film, which marked his breakthrough as a film composer. These tracks were subsequently included in his second solo album <em>Piano Solos Vol 2 </em>(2006).</p>\n<p>O’Halloran’s third and fourth solo albums <em>Vorleben </em>(2010) and <em>Lumiere </em>(2011) followed, with the latter being mixed by the late Jóhann Jóhannsson. In 2011, he also co-founded the band A Winged Victory for the Sullen with Adam Wiltzie of Stars of the Lid, while continuing his work scoring films.</p>\n<p>As part of A Winged Victory For The Sullen, he worked on Jalil Lespert’s film <em>In the Shadow of Iris </em>in 2016. This music was released as the album <em>Iris </em>the same year. The band’s catalogue also includes <em>Atomos </em>(2014), based on music composed for a dance piece by Wayne McGregor, resident choreographer for The Royal Ballet in London; <em>The Undivided Five </em>(2019), which was released by Ninja Tune; and their last album <em>Invisible Cities </em>(2021), released as a side project under their own label Artificial Pinearch Manufacturing. It contains music from the Manchester- Festival-produced live performance Invisible Cities, which the band scored in 2019.</p>\n<p>O’Halloran signed with renowned classical music label Deutsche Grammophon in early 2019, releasing the EP <em>Sundoor </em>(2019), which offers a 20-minute piece entitled ‘196 Hz’, adapted from a 2017 site-specific composition for cross-disciplinary American artist Slater Bradley’s ‘Sundoor At World’s End’. His next album released by the label, <em>Silfur </em>(2021), revisits select songs from his catalogue, exploring time and place. In 2021, he contributed &#34;What Gently Flutters&#34; to the Deutsche Grammophon Christmas album Winter Tales, featuring Bryan Senti.</p>\n<p>O’Halloran also produced Katy Perry’s ‘Into Me You See’ on her 2017 album <em>Witness</em>, collaborated with Gyda Valtýsdóttir for the EP <em>3 Movements </em>in 2017, and appears on Leonard Cohen’s 2019 posthumous album <em>Thanks For The Dance</em>.</p>\n<p>In 2019 he premiered the electronic composition <em>1 0 0 1 </em>at Minneapolis’s Liquid Music Series with choreographer Fukiko Takase. It was well-received, but subsequent productions were halted by the pandemic. O’Halloran’s latest record <em>1 0 0 1, </em>released on Deutsche Grammophon in March 2024, is an expansion of that composition, marking a departure from the introspective solo piano music with which he first made his name. Recorded at RRO Studios in Reykjavík, it features his collaborator Bryan Senti on violin, an eight-voice choir, Paul Corley on electronic production, and the Budapest Art Orchestra orchestrated by Roman Vinuesa, mixed by Francesco Donadello.</p>", "longDescription": {"nodes": [{"type": "PARAGRAPH", "id": "hbpez240", "nodes": [{"type": "TEXT", "id": "", "nodes": [], "textData": {"text": "Einlass: 11:00 Uhr", "decorations": [{"type": "BOLD", "fontWeightValue": 700}]}}], "paragraphData": {"textStyle": {"textAlignment": "AUTO"}}}, {"type": "PARAGRAPH", "id": "juatt241", "nodes": [{"type": "TEXT", "id": "", "nodes": [], "textData": {"text": "Beginn: 11:30 Uhr", "decorations": [{"type": "BOLD", "fontWeightValue": 700}]}}], "paragraphData": {"textStyle": {"textAlignment": "AUTO"}}}, {"type": "PARAGRAPH", "id": "2oh8e242", "nodes": [], "paragraphData": {"textStyle": {"textAlignment": "AUTO"}}}, {"type": "PARAGRAPH", "id": "7474m321", "nodes": [], "paragraphData": {"textStyle": {"textAlignment": "AUTO"}}}, {"type": "PARAGRAPH", "id": "hk3bc325", "nodes": [], "paragraphData": {"textStyle": {"textAlignment": "AUTO"}}}, {"type": "PARAGRAPH", "id": "556mq478", "nodes": [{"type": "TEXT", "id": "", "nodes": [], "textData": {"text": "Gysis Begegnungen …", "decorations": []}}], "paragraphData": {"textStyle": {"textAlignment": "AUTO"}}}, {"type": "PARAGRAPH", "id": "dt1ka806", "nodes": [{"type": "TEXT", "id": "", "nodes": [], "textData": {"text": " ", "decorations": []}}], "paragraphData": {}}, {"type": "PARAGRAPH", "id": "fhx0y808", "nodes": [{"type": "TEXT", "id": "", "nodes": [], "textData": {"text": "Gregor Gysi trifft Menschen, die etwas zu sagen und etwas erlebt haben: Prominente Zeitzeugen des öffentlichen Lebens aus Medien, Kultur, Politik, Show, Musik, Sport und Gesellschaft.", "decorations": []}}], "paragraphData": {}}, {"type": "PARAGRAPH", "id": "kwtk1810", "nodes": [{"type": "TEXT", "id": "", "nodes": [], "textData": {"text": "Kaum ein deutscher Staatsmann wurde so geschmäht, kaum einer schlug sich so erfolgreich durch Gestrüpp der Anfeindungen – hin zu einer anerkannten Prominenz und zu einem der wichtigsten Protagonisten linken Denkens in Deutschland.", "decorations": []}}], "paragraphData": {}}, {"type": "PARAGRAPH", "id": "slmg4812", "nodes": [{"type": "TEXT", "id": "", "nodes": [], "textData": {"text": " ", "decorations": []}}], "paragraphData": {}}, {"type": "PARAGRAPH", "id": "ydkje814", "nodes": [{"type": "TEXT", "id": "", "nodes": [], "textData": {"text": "Gregor Gysi, geboren 1948 in Berlin, ist Rechtsanwalt, Autor, Podcaster, Moderator und Politiker. Von 1990-2002 und von 2005-2015 war er Fraktionsvorsitzender der PDS, beziehungsweise der Partei „Die Linke“ im Bundestag. Dort war er von 2020-2023 außenpolitischer Sprecher der Linksfraktion. Auch als Autor ist Gregor Gysi erfolgreich, unter anderem mit seiner Bestseller-Autobiografie „Ein Leben ist zu wenig“.", "decorations": []}}], "paragraphData": {}}, {"type": "PARAGRAPH", "id": "v7drq816", "nodes": [{"type": "TEXT", "id": "", "nodes": [], "textData": {"text": " ", "decorations": []}}], "paragraphData": {}}, {"type": "PARAGRAPH", "id": "vuluz818", "nodes": [{"type": "TEXT", "id": "", "nodes": [], "textData": {"text": "In kurzweiligen Gesprächen mit Tiefgang und jeder Menge Humor präsentiert Gregor Gysi jeweils einen Gast im Colosseum Kino, spricht mit diesem über Leben und Erlebtes. ", "decorations": []}}], "paragraphData": {}}], "documentStyle": {}}, "status": 0}}}}}}</script>
