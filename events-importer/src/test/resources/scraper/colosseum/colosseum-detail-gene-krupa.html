<script type="application/json" id="wix-warmup-data">{"appsWarmupData": {"140603ad-af8d-84a5-2c80-a0f60cb47351": {"EventsPageInitialState": {"event": {"event": {"id": "93aa3035-2ae4-477e-a79a-0f21761520f1", "title": "The Gene Krupa Show", "slug": "the-gene-krupa-show", "scheduling": {"config": {"scheduleTbd": false, "startDate": "2026-10-31T17:00:00.000Z", "endDate": "2026-10-31T19:00:00.000Z", "timeZoneId": "Europe/Berlin", "endDateHidden": false, "showTimeZone": false, "recurrences": {"occurrences": [], "status": 0}}, "formatted": "31. Oktober 2026, 18:00–20:00 Uhr", "startDateFormatted": "31. Oktober 2026", "startTimeFormatted": "18:00", "endDateFormatted": "31. Oktober 2026", "endTimeFormatted": "20:00"}, "description": "The  Worlds Most Famous Drummer", "about": "<p>Einlass: 19 Uhr</p>\n<p>Beginn: 20 Uhr</p>\n<p></p>\n<p>Dustin O’Halloran is an American pianist and composer with six acclaimed solo albums under his own name, and is a member of the band A Winged Victory for the Sullen, which has released five albums, some based on scores and soundtracks.</p>\n<p>He previously released music with dreampop band Dēvics – which he co-founded with Sara Lov in</p>\n<p>his late teens before embarking on a solo career. Tracks from his debut solo album <em>Piano Solos</em></p>\n<p>(2004) caught the attention of music supervisor Brian Reitzell, who shared them with Sofia</p>\n<p>Coppola to help inspire her script for <em>Marie Antoinette</em>. Coppola invited him to contribute music</p>\n<p>to the film, which marked his breakthrough as a film composer. These tracks were subsequently included in his second solo album <em>Piano Solos Vol 2 </em>(2006).</p>\n<p>O’Halloran’s third and fourth solo albums <em>Vorleben </em>(2010) and <em>Lumiere </em>(2011) followed, with the latter being mixed by the late Jóhann Jóhannsson. In 2011, he also co-founded the band A Winged Victory for the Sullen with Adam Wiltzie of Stars of the Lid, while continuing his work scoring films.</p>\n<p>As part of A Winged Victory For The Sullen, he worked on Jalil Lespert’s film <em>In the Shadow of Iris </em>in 2016. This music was released as the album <em>Iris </em>the same year. The band’s catalogue also includes <em>Atomos </em>(2014), based on music composed for a dance piece by Wayne McGregor, resident choreographer for The Royal Ballet in London; <em>The Undivided Five </em>(2019), which was released by Ninja Tune; and their last album <em>Invisible Cities </em>(2021), released as a side project under their own label Artificial Pinearch Manufacturing. It contains music from the Manchester- Festival-produced live performance Invisible Cities, which the band scored in 2019.</p>\n<p>O’Halloran signed with renowned classical music label Deutsche Grammophon in early 2019, releasing the EP <em>Sundoor </em>(2019), which offers a 20-minute piece entitled ‘196 Hz’, adapted from a 2017 site-specific composition for cross-disciplinary American artist Slater Bradley’s ‘Sundoor At World’s End’. His next album released by the label, <em>Silfur </em>(2021), revisits select songs from his catalogue, exploring time and place. In 2021, he contributed &#34;What Gently Flutters&#34; to the Deutsche Grammophon Christmas album Winter Tales, featuring Bryan Senti.</p>\n<p>O’Halloran also produced Katy Perry’s ‘Into Me You See’ on her 2017 album <em>Witness</em>, collaborated with Gyda Valtýsdóttir for the EP <em>3 Movements </em>in 2017, and appears on Leonard Cohen’s 2019 posthumous album <em>Thanks For The Dance</em>.</p>\n<p>In 2019 he premiered the electronic composition <em>1 0 0 1 </em>at Minneapolis’s Liquid Music Series with choreographer Fukiko Takase. It was well-received, but subsequent productions were halted by the pandemic. O’Halloran’s latest record <em>1 0 0 1, </em>released on Deutsche Grammophon in March 2024, is an expansion of that composition, marking a departure from the introspective solo piano music with which he first made his name. Recorded at RRO Studios in Reykjavík, it features his collaborator Bryan Senti on violin, an eight-voice choir, Paul Corley on electronic production, and the Budapest Art Orchestra orchestrated by Roman Vinuesa, mixed by Francesco Donadello.</p>", "longDescription": {"nodes": [{"type": "PARAGRAPH", "id": "hbpez240", "nodes": [{"type": "TEXT", "id": "", "nodes": [], "textData": {"text": "Einlass: 17 Uhr", "decorations": [{"type": "BOLD", "fontWeightValue": 700}]}}], "paragraphData": {"textStyle": {"textAlignment": "AUTO"}}}, {"type": "PARAGRAPH", "id": "juatt241", "nodes": [{"type": "TEXT", "id": "", "nodes": [], "textData": {"text": "Beginn: 18 Uhr", "decorations": [{"type": "BOLD", "fontWeightValue": 700}]}}], "paragraphData": {"textStyle": {"textAlignment": "AUTO"}}}, {"type": "PARAGRAPH", "id": "2oh8e242", "nodes": [], "paragraphData": {"textStyle": {"textAlignment": "AUTO"}}}, {"type": "PARAGRAPH", "id": "7474m321", "nodes": [{"type": "TEXT", "id": "", "nodes": [], "textData": {"text": "Berlin, 30. Juli 2026 – Die international gefeierte Multimedia-Produktion „The Gene Krupa", "decorations": []}}], "paragraphData": {"textStyle": {"textAlignment": "AUTO"}}}, {"type": "PARAGRAPH", "id": "eo9xp768", "nodes": [{"type": "TEXT", "id": "", "nodes": [], "textData": {"text": "Story“ kommt diesen Herbst erstmalig nach Berlin. Die rund zweistündige Live-Show erzählt die", "decorations": []}}], "paragraphData": {"textStyle": {"textAlignment": "AUTO"}}}, {"type": "PARAGRAPH", "id": "gc1ui770", "nodes": [{"type": "TEXT", "id": "", "nodes": [], "textData": {"text": "Geschichte des legendären Jazz-Schlagzeugers Gene Krupa (1909–1973), und verbindet Big-Band-", "decorations": []}}], "paragraphData": {"textStyle": {"textAlignment": "AUTO"}}}, {"type": "PARAGRAPH", "id": "8p17p772", "nodes": [{"type": "TEXT", "id": "", "nodes": [], "textData": {"text": "Sound mit historischen Film- und Bildaufnahmen sowie Erzählungen aus Krupas Leben und Karriere.", "decorations": []}}], "paragraphData": {"tex
