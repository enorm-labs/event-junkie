<script type="application/json" id="wix-warmup-data">{"appsWarmupData": {"140603ad-af8d-84a5-2c80-a0f60cb47351": {"EventsPageInitialState": {"event": {"event": {"id": "edf0bf2a-7b7b-4742-819a-bb1518ca4e6e", "title": "Christoph Kramer", "slug": "christoph-kramer", "scheduling": {"config": {"scheduleTbd": false, "startDate": "2026-10-05T17:30:00.000Z", "endDate": "2026-10-05T19:30:00.000Z", "timeZoneId": "Europe/Berlin", "endDateHidden": false, "showTimeZone": false, "recurrences": {"occurrences": [], "status": 0}}, "formatted": "5. Oktober 2026, 19:30–21:30 Uhr", "startDateFormatted": "5. Oktober 2026", "startTimeFormatted": "19:30", "endDateFormatted": "5. Oktober 2026", "endTimeFormatted": "21:30"}, "description": "Christoph Kramer ist zurück! Der Fußballspieler, TV-Experte und Autor feiert nach seinem Debüt \"Das Leben fing im Sommer an\" am 5. Oktober die Berlinprememiere zu seinem nächsten Roman \"Wolkenberührpunkt\" im historischen Berliner Kino.", "about": "<p>Einlass: 19 Uhr</p>\n<p>Beginn: 20 Uhr</p>\n<p></p>\n<p>Dustin O’Halloran is an American pianist and composer with six acclaimed solo albums under his own name, and is a member of the band A Winged Victory for the Sullen, which has released five albums, some based on scores and soundtracks.</p>\n<p>He previously released music with dreampop band Dēvics – which he co-founded with Sara Lov in</p>\n<p>his late teens before embarking on a solo career. Tracks from his debut solo album <em>Piano Solos</em></p>\n<p>(2004) caught the attention of music supervisor Brian Reitzell, who shared them with Sofia</p>\n<p>Coppola to help inspire her script for <em>Marie Antoinette</em>. Coppola invited him to contribute music</p>\n<p>to the film, which marked his breakthrough as a film composer. These tracks were subsequently included in his second solo album <em>Piano Solos Vol 2 </em>(2006).</p>\n<p>O’Halloran’s third and fourth solo albums <em>Vorleben </em>(2010) and <em>Lumiere </em>(2011) followed, with the latter being mixed by the late Jóhann Jóhannsson. In 2011, he also co-founded the band A Winged Victory for the Sullen with Adam Wiltzie of Stars of the Lid, while continuing his work scoring films.</p>\n<p>As part of A Winged Victory For The Sullen, he worked on Jalil Lespert’s film <em>In the Shadow of Iris </em>in 2016. This music was released as the album <em>Iris </em>the same year. The band’s catalogue also includes <em>Atomos </em>(2014), based on music composed for a dance piece by Wayne McGregor, resident choreographer for The Royal Ballet in London; <em>The Undivided Five </em>(2019), which was released by Ninja Tune; and their last album <em>Invisible Cities </em>(2021), released as a side project under their own label Artificial Pinearch Manufacturing. It contains music from the Manchester- Festival-produced live performance Invisible Cities, which the band scored in 2019.</p>\n<p>O’Halloran signed with renowned classical music label Deutsche Grammophon in early 2019, releasing the EP <em>Sundoor </em>(2019), which offers a 20-minute piece entitled ‘196 Hz’, adapted from a 2017 site-specific composition for cross-disciplinary American artist Slater Bradley’s ‘Sundoor At World’s End’. His next album released by the label, <em>Silfur </em>(2021), revisits select songs from his catalogue, exploring time and place. In 2021, he contributed &#34;What Gently Flutters&#34; to the Deutsche Grammophon Christmas album Winter Tales, featuring Bryan Senti.</p>\n<p>O’Halloran also produced Katy Perry’s ‘Into Me You See’ on her 2017 album <em>Witness</em>, collaborated with Gyda Valtýsdóttir for the EP <em>3 Movements </em>in 2017, and appears on Leonard Cohen’s 2019 posthumous album <em>Thanks For The Dance</em>.</p>\n<p>In 2019 he premiered the electronic composition <em>1 0 0 1 </em>at Minneapolis’s Liquid Music Series with choreographer Fukiko Takase. It was well-received, but subsequent productions were halted by the pandemic. O’Halloran’s latest record <em>1 0 0 1, </em>released on Deutsche Grammophon in March 2024, is an expansion of that composition, marking a departure from the introspective solo piano music with which he first made his name. Recorded at RRO Studios in Reykjavík, it features his collaborator Bryan Senti on violin, an eight-voice choir, Paul Corley on electronic production, and the Budapest Art Orchestra orchestrated by Roman Vinuesa, mixed by Francesco Donadello.</p>", "longDescription": {"nodes": [{"type": "PARAGRAPH", "id": "hbpez240", "nodes": [{"type": "TEXT", "id": "", "nodes": [], "textData": {"text": "Einlass: 18:30 Uhr", "decorations": [{"type": "BOLD", "fontWeightValue": 700}]}}], "paragraphData": {"textStyle": {"textAlignment": "AUTO"}}}, {"type": "PARAGRAPH", "id": "juatt241", "nodes": [{"type": "TEXT", "id": "", "nodes": [], "textData": {"text": "Beginn: 19:30 Uhr", "decorations": [{"type": "BOLD", "fontWeightValue": 700}]}}], "paragraphData": {"textStyle": {"textAlignment": "AUTO"}}}, {"type": "PARAGRAPH", "id": "hk3bc325", "nodes": [], "paragraphData": {"textStyle": {"textAlignment": "AUTO"}}}, {"type": "PARAGRAPH", "id": "556mq478", "nodes": [{"type": "TEXT", "id": "", "nodes": [], "textData": {"text": "»Wolkenberührpunkt« ist ein Roman über zwei auf den ersten Blick sehr unterschiedliche Männer und die eine Frage: Findet das Glück uns erst dann, wenn wir aufhören, jemand sein zu wollen? Christoph Kramers zweites Buch ist ein sensibles Porträt über das, was nur zwischen den Zeilen steht – was unser Leben aber wirklich ausmacht.", "decorations": [{"type": "ITALIC", "italicData": true}]}}], "paragraphData": {"textStyle": {"textAlignment": "AUTO"}}}, {"type": "PARAGRAPH", "id": "xakky14", "nodes": [{"type": "TEXT", "id": "", "nodes": [], "textData": {"text": "Herbst 2024: Christoph Kramers Ära bei Borussia Mönchengladbach endet. Um der drohenden Leere zu entkommen, schreibt er sein erstes Buch »Das Leben fing im Sommer an«. Nach Erscheinen trifft Chris in einer Buchhandlung Roman, einen jungen Mann, der sein Buch mit abgezählten Münzen zahlt und dessen Schicksal ihn nicht mehr loslässt.", "decorations": []}}], "style": {}, "paragraphData": {"textStyle": {"textAlignment": "AUTO"}}}, {"type": "PARAGRAPH", "id": "ppoa316", "nodes": [{"type": "TEXT", "id": "", "nodes": [], "textData": {"text": "Es ist die Geschichte eines Schocks in der Silvesternacht 2000, der Romans Welt für immer zerreißt. Es ist die Suche nach dem geheimnisvollen »J« und die Flucht auf den »Wolkenberührpunkt« – jenen alten Mast, auf dem er mit seinem besten Freund Steve dem Himmel nah ist, um Wünsche in die Welt zu schreien.", "decorations": []}}], "style": {}, "paragraphData": {"textStyle": {"textAlignment": "AUTO"}}}, {"type": "PARAGRAPH", "id": "esn4x18", "nodes": [{"type": "TEXT", "id": "", "nodes": [], "textData": {"text": "Eine Geschichte über die leise Sehnsucht nach Mira und über zwei Leben, wie sie unterschiedlicher nicht sein könnten: hier der Weltmeister, dort der Junge, der nie ein Zuhause besaß. Melancholisch, ehrlich und zutiefst bewegend.", "decorations": []}}], "style": {}, "paragraphData": {"textStyle": {"textAlignment": "AUTO"}}}, {"type": "PARAGRAPH", "id": "32kzr20", "nodes": [{"type": "TEXT", "id": "", "nodes": [], "textData": {"text": "Über ungleiche Schicksale und einen Telefonmast, der Wünsche erfüllt", "decorations": [{"type": "ITALIC", "italicData": true}]}}], "style": {}, "paragraphData": {"textStyle": {"textAlignment": "AUTO"}}}, {"type": "PARAGRAPH", "id": "lkyyf22", "nodes": [{"type": "TEXT", "id": "", "nodes": [], "textData": {"text": "Christoph Kramer", "decorations": [{"type": "BOLD", "fontWeightValue": 700}]}}, {"type": "TEXT", "id": "", "nodes": [], "textData": {"text": ", geboren 1991 in Solingen, ist Fußballspieler, TV-Experte, Podcaster — und Autor. Er spielte zuletzt für den Bundesligisten Borussia Mönchengladbach und war von 2014 bis 2016 Nationalspieler. 2014 wurde er Weltmeister. Seit Jahren ist er einer der beliebtesten TV-Experten bei Länderspielen und den großen Turnieren. Christoph Kramer hat als erster Profi-Fußballer einen Roman veröffentlicht. »Das Leben fing im Sommer an« sprang sofort auf Platz 1 der ", "decorations": []}}, {"type": "TEXT", "id": "", "nodes": [], "textData": {"text": "SPIEGEL", "decorations": [{"type": "ITALIC", "italicData": true}]}}, {"type": "TEXT", "id": "", "nodes": [], "textData": {"text": "-Bestsellerliste, wird fürs Kino verfilmt und an deutschen Theatern gespielt. ", "decorations": []}}], "style": {}, "paragraphData": {"textStyle": {"textAlignment": "AUTO"}}}, {"type": "PARAGRAPH", "id": "ll1b527", "nodes": [{"type": "TEXT", "id": "", "nodes": [], "textData": {"text": "©Markus Tedeskino", "decorations": []}}], "style": {}, "paragraphData": {"textStyle": {"textAlignment": "AUTO"}}}], "documentStyle": {}}, "status": 0}}}}}}</script>
