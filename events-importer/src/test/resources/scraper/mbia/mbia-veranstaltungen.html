       "descriptionLong": "<p class=\"font_8\">Die Tage werden kürzer, die Nächte intensiver. 🌌</p>\n<p class=\"font_8\">Am 07. November öffnet GOA MAGIC erneut das Portal im M-BIA Berlin. Freut euch auf eine Nacht voller rollender Basslines, hypnotischer Melodien und psychedelischer Energie. Auf dem Main Floor erwartet euch eine Reise durch Progressive, Proggy &amp; Psytrance, während der Second Floor mit einer energiegeladenen Mischung aus Bounce, Trance &amp; Techno bis in die Morgenstunden für Abriss sorgt. 🌀</p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\">🇧🇷 REVERENCE (Brasilien) 🔥</p>\n<p class=\"font_8\">Direkt aus Brasilien begrüßen wir Reverence, einen der spannendsten Newcomer der internationalen Psytrance-Szene. Mit Releases auf renommierten Labels wie Solar Tech Records, Produktionen gemeinsam mit Claudinho Brasil sowie seinem gefeierten Remix für Paranormal Attack hat er sich weltweit einen Namen gemacht. Seine energiegeladenen Sets führten ihn bereits auf zahlreiche Festivals und Clubs in Brasilien und darüber hinaus – jetzt bringt er seinen unverwechselbaren brasilianischen Spirit erstmals zu GOA MAGIC nach Berlin. 🌎🚀</p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\">✨ S P E C I A L S ✨</p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\">• Druckvolles Club-Soundsystem mit Funktion-One Elementen 🔊</p>\n<p class=\"font_8\">• Psychedelische Indoor-Festivaldekoration 🌿</p>\n<p class=\"font_8\">• Safe Space &amp; Awareness Culture 🤍</p>\n<p class=\"font_8\">• Berliner Underground-Vibes direkt unter den Stadtbahnbögen am Alexanderplatz 🌃</p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\">📍 M-BIA Club Berlin</p>\n<p class=\"font_8\">Dircksenstraße 123 · S+U Alexanderplatz</p>\n<p class=\"font_8\">🕚 Doors Open: 23:00 Uhr</p>\n<p class=\"font_8\">See you in the vortex. 🌀💚</p>",

       "descriptionLong": "<p>Hypenotic</p><p>Are you ready for HYPENOTIC ?? On Friday 20.03.2026 well open our doors for an unforgettable night on two floors. The Mainfloor will make the walls tremble with its Groove, Hardtechno, Industrial and Schranz beats, while the 2nd Floor will enchant the senses with Trance, Bounce and Hardtechno. The party starts at 11:00 PM and goes until the break of dawn at 09:00 AM with an open end. Let yourself be carried away by the sounds and dance through the night until it gets light outside. - Our respectful and tolerant security ensures that you feel safe. Experience a night full of energy, beats, and unforgettable moments with us! 2 areas & chill area Funktion one sound system free entry for birthday people • sate space for everyone no racism no hate just love!!!!!!!!!!</p><p></p>",
