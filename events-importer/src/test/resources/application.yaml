# Disable scheduled imports during tests to avoid interference with integration tests
app:
  scheduling:
    enabled: false
  metrics:
    # **`app.scheduling.enabled` above does not reach the gauge refreshers** (#934). It gates beans
    # that opt in, and `MetricsRefreshService` and `ImageMetricsRefreshService` are plain services.
    # At the 60s default each queries the database every minute in every cached context, the R2DBC
    # pools behind them accumulate, and one arbitrary test per run died on the transient exception
    # that `53300 too_many_connections` maps to.
    #
    # An hour is "never" here, and **the beans stay**: two integration tests autowire them and call
    # `refreshGauges()` themselves.
    refresh-interval-ms: 3600000

spring:
  flyway:
    schemas: events
  r2dbc:
    properties:
      schema: events

# Mirrors the main application.yaml's exposure list, and has to (#415).
#
# **This file shadows the main one rather than merging with it**, which is what the header above
# means in practice for anything actuator-related: with the list absent here, Spring falls back to
# its default of `health` only, and `/actuator/prometheus` 404s in tests while working perfectly in
# production. The consequence worth knowing: a test cannot catch a typo in the *main* file's list,
# because it never reads it. `MetricsExposureConfigTest` asserts that file directly for exactly that
# reason.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
