# **Scheduling is off for the whole suite, and `SchedulingConfiguration` is what makes that true.**
# `@EnableScheduling` sits on that gated class rather than on the application class, so this one
# property stops every `@Scheduled` method — including the gauge refreshers, which no per-bean
# condition could gate because two integration tests autowire them. `SchedulingConfigurationTest`
# guards both ends.
#
# **A long interval is not a switch (#949).** `fixedDelayString` carries no `initialDelay`, so the
# first execution runs at context refresh whatever the interval says. #934 read the hour below as a
# fix and it was not: every cached context still fired each refresher once on startup, racing the
# `TRUNCATE` in `BaseControllerTest.cleanUp`. That is `40P01 deadlock_detected`, not the
# `53300 too_many_connections` #934 named — r2dbc maps class 53 to a *non*-transient exception.
#
# The intervals below stay as belt and braces for `DataQualitySnapshotIntegrationTest`, the one
# context that switches scheduling back on.
app:
  # Repeated from the main file because this one shadows it, and `WebFluxConfiguration` reads the
  # property with no fallback. `MaxPageSizeConfigTest` asserts the two numbers agree.
  api:
    max-page-size: 100
  scheduling:
    enabled: false
  metrics:
    refresh-interval-ms: 3600000
  images:
    tick-millis: 3600000
    sweep:
      tick-millis: 3600000

spring:
  modulith:
    moments:
      # Spring Modulith's Moments auto-configuration carries `@EnableScheduling` (#949). Without this
      # the `@Scheduled` beans run whatever `SchedulingConfiguration` above decides, because the
      # scheduler is switched on by a dependency rather than by this application.
      enabled: false
  flyway:
    schemas: events
  r2dbc:
    properties:
      schema: events

# Mirrors the main application.yaml's exposure list, and has to (#415).
#
# **This file shadows the main one rather than merging with it**, which is what the header above
# means in practice for anything actuator-related: with the list absent here, Spring falls back to
# its default of `health` only, and `/actuator/prometheus` 404s in tests while working perfectly in
# production. The consequence worth knowing: a test cannot catch a typo in the *main* file's list,
# because it never reads it. `MetricsExposureConfigTest` asserts that file directly for exactly that
# reason.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
