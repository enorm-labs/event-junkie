server:
  port: 8081

spring:
  application:
    name: events-importer
  http:
    codecs:
      # Max response body size buffered in memory (guards against OOM from huge pages during scraping).
      # Raised from 2MB for Kulturhaus Insel Berlin, whose Gatsby static-query artefact ships the venue's
      # whole event archive in one 2.2MB response; at the configured import concurrency of 4 the worst
      # case is 32MB in flight.
      max-in-memory-size: 8MB
  flyway:
    schemas: events
  r2dbc:
    pool:
      # Sized above app.import.max-concurrency so every in-flight import can hold a connection
      # for its upsert transaction while leaving headroom for the out-of-transaction status
      # writes (markRunning/markSuccess/markFailed) and the scheduler's own queries.
      initial-size: 5
      max-size: 12
    properties:
      schema: events

# `info` joins the default `health` so an operator can ask a running importer which build it is —
# the same rationale as the BFF (docs/LEGAL.md §4.4). The importer has no public
# surface and no `/meta` endpoint: nothing user-facing reads its version.
management:
  endpoints:
    web:
      exposure:
        # `prometheus` joins health and info here, and this is safe *because of where the endpoint
        # lives, not because of what it contains*: the chart moves the whole management port off the
        # application port (bff.service.managementPort) and no Ingress routes it, so /actuator/** —
        # including this — is unreachable from outside the cluster. See PLATFORM_SETUP.md §7.
        include: health,info,prometheus
  # **No readiness group here, deliberately — this is the importer's answer to #438, not an
  # oversight.** The BFF puts `r2dbc` and `eventsSchema` in its readiness group so that Kubernetes
  # stops routing to a pod that cannot serve. The importer has nothing to route: its Service is
  # ClusterIP with no Ingress backend anywhere in the chart, it runs one replica under `Recreate`,
  # and its work is a scheduler tick rather than a request. Readiness gates no traffic, so making it
  # database-dependent would buy nothing and would take the admin API away during a blip — which is
  # the one thing an operator needs *during* a database incident. ADR-018 §"And the importer" argues
  # this at length. Leaving readiness at Spring's `readinessState` default is the decision.
  info:
    build:
      enabled: true
    git:
      # No git.properties is generated anywhere in this build, by design — see the BFF's
      # application.yaml and LEGAL.md §4.3.
      enabled: false

# Application configuration for import pipeline, scraping, and scheduling
app:
  import:
    # Maximum number of event sources imported concurrently (bounded by coroutine Semaphore)
    max-concurrency: 4
  scraper:
    response-timeout: 30s
    polite-delay-millis: 200
    # A full import of every source found nothing disallowed, so this costs nothing and fails loudly
    # the day a venue adds a rule (#795).
    robots-enforced: true
    robots-cache-ttl: 24h
  scheduling:
    # Reset sources stuck in RUNNING longer than this to FAILED (Duration format, e.g. 30m, 1h)
    staleness-timeout: 30m
  images:
    # Off until the storage client lands (PR 4). Off means nothing is fetched and nothing is stored.
    # This is not a hotlink-versus-cache switch: the BFF has no such flag and can never emit a venue
    # URL (ADR-019 §2.10).
    fetch-enabled: false
    tick-millis: 300000
    # Security limits, not tuning. The URL comes out of scraped HTML and the bytes are untrusted.
    max-bytes: 8388608
    max-pixels: 50000000
    refresh-after: 30d
    retry-failed-after: 7d
    batch-size: 200

---
# Local development only — activate with `--spring.profiles.active=local` (IntelliJ: run
# configuration → "Active profiles: local"). Mirrors the console output to a file so an
# import run can be grepped after the fact, which the IDE console alone does not allow.
#
# Deliberately profile-gated rather than global: on a container platform the log belongs on
# stdout, and a file appender there would write into the container's in-memory filesystem.
#
# The path is relative to the working directory (the module directory under `bootRun`), so
# it lands in `events-importer/build/dev-env/`. `build` is gitignored at any depth, and
# Logback creates the parent directories. `scripts/dev-env.sh up` does not use this profile —
# it redirects the process's stdout to `build/dev-env/importer.log` at the repository root
# instead, so the two never write to the same file.
spring:
  config:
    activate:
      on-profile: local

logging:
  file:
    name: build/dev-env/importer.log
