<!--
  PROPOSAL, NOT THE SHIPPED MARK — #475.

  "The overflowing calendar cell": a single date square holding more entries than fits, the last one
  spilling past its edge. Of the directions in BRANDING.md §4 it is the only one that is about
  *events* rather than about music or about addiction, and it draws the tagline rather than
  illustrating the name — "Can't get enough of Berlin", literally.

  Held to the §4 principles that produced the mark being replaced, and that are not the reason it is
  being replaced: monochrome-first (`currentColor`, no gradient, no fill), one strong silhouette,
  legible at 16 px, inline-able SVG.

  Deliberately NOT a waveform, a heartbeat, a soundbar or an equaliser — every one of those is the
  neighbourhood the pulse mark has to leave.

  Geometry notes, so this can be redrawn rather than only tweaked:
    - the cell is 19x20 at rx=3, so its straight edges run y=10.5..24.5; every entry sits on the
      straight part and no stroke meets a corner curve
    - the escaping entry is the LAST one and exits through the right edge, not the bottom: at 16 px
      an overflow through the bottom edge reads as a descender, and one through the side reads as
      overflow
    - stroke-width 3 on a 32-unit grid is ~1.5 px at 16 px, which is the thinnest that survives
      hinting on a non-retina display
-->
<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Event Junkie">
  <g stroke="currentColor" stroke-width="3" stroke-linecap="round">
    <!-- The two hanger ticks are what make this read as a calendar rather than as a box. They are
         the first thing to go if the mark ever needs to be simpler; the silhouette survives it. -->
    <path d="M10 4v5M18 4v5" />
    <rect x="3.5" y="7.5" width="19" height="20" rx="3" stroke-linejoin="round" />
    <!-- Two entries that fit, and one that does not. -->
    <path d="M8 13h9" />
    <path d="M8 18h11" />
    <path d="M8 23h21" />
  </g>
</svg>
