# Staging overrides — one CAX11 running k3s, PostgreSQL and everything else (#265).
#
# Written from `infra/environments/staging`, not from guesswork, but never applied: nothing in this
# file has been installed anywhere. `helm template` passing is not evidence that a pod starts.

# database.host is the k3s node's own private address, because PostgreSQL is co-located here
# (`postgres_server_type = null`). It is still reached over the network at a private address, so the
# connection path the applications exercise is the same shape as production's. Matches
# `k3s_private_ip` in infra/environments/staging/main.tf — confirm with
# `tofu -chdir=infra/environments/staging output postgres_ip`.
database:
  host: "10.1.1.10"
  # database.existingSecret is created out of band before the first install:
  #   kubectl create secret generic events-db \
  #     --from-literal=username=events --from-literal=password=…
  existingSecret: "events-db"

# One node with 4 GB of RAM shared between k3s, PostgreSQL and three workloads, so both stateless
# services drop to a single replica. This is the one place staging is not production-shaped, and it
# is a capacity fact rather than a preference.
bff:
  replicaCount: 1
  resources:
    requests:
      cpu: "50m"
      memory: "384Mi"
    limits:
      cpu: "1000m"
      memory: "640Mi"

importer:
  resources:
    requests:
      cpu: "50m"
      memory: "384Mi"
    limits:
      cpu: "1000m"
      memory: "768Mi"

frontend:
  replicaCount: 1

ingress:
  # ingress.host does not resolve on the public internet, and that is the design rather than an
  # omission (PLATFORM_SETUP §4a): resolution happens over the WireGuard tunnel, via its DNS or a
  # hosts entry pointing at the node's tunnel address.
  host: "staging.event-junkie.de"
  # No redirect domain on staging — the .com 301 is a production concern, and emptying this list is
  # also what leaves staging with nothing Traefik-specific in its rendered output.
  redirectHosts: []
  tls:
    enabled: true
    secretName: "event-junkie-staging-tls"

certManager:
  clusterIssuer:
    # Created here because staging is its own cluster with exactly one release on it, so the
    # singleton problem that keeps `create` false by default does not arise. It stays false for k3d,
    # where the whole point is installing the chart more than once.
    create: true
    name: "letsencrypt-staging-dns"
    # A role mailbox, not a person (docs/LEGAL.md §6). Let's Encrypt sends expiry warnings here.
    email: "hello@event-junkie.de"
    # DNS-01 is not a preference here, it is the only option: HTTP-01 needs Let's Encrypt to reach
    # the host, and this environment exists to stop that. The TXT record is public; the A record
    # never exists — so staging gets a genuine, publicly-trusted certificate for a hostname with no
    # public address. Needs the Hetzner DNS webhook and its token Secret, both installed by #265.
    solver: "dns01"
    # Still the ACME *staging* endpoint. Production's rate limits are per registered domain, and
    # `event-junkie.de` is the same registered domain here as in production — so burning the limit
    # from this environment would lock out the real one.
    server: "https://acme-staging-v02.api.letsencrypt.org/directory"
