# comment-lint: allow-file every override here is a deviation from production that needs its reason
# The image-caching half of the k3d rehearsal, applied on top of values-k3d.yaml when `K3D_IMAGES=1`.
# Separate because it needs two Secrets and a reachable object store. **It exists because nothing
# exercised this path**: three defects reached staging from one pull request, and every one would
# have failed here.

images:
  enabled: true
  # The switch a visitor sees. On here because this is the only place the whole path can be walked:
  # fetch, store, derive, serve, through a real Traefik.
  serving:
    enabled: true
  storage:
    # The compose stack's MinIO, published on the host. Plain HTTP, unlike Hetzner.
    endpoint: "http://host.k3d.internal:9000"
    # MinIO does not enforce it; kept at the production value so the request signing is exercised.
    region: "fsn1"
    bucket: "event-junkie-images"
    prefix: "k3d"
    # Created by the rehearsal script, which knows the compose credentials.
    existingSecret: "event-junkie-images"
  imgproxy:
    enabled: true
    existingSecret: "event-junkie-imgproxy"

# Both stores live on the host, which production's policies exclude. 9000 is MinIO, and only
# 169.254.0.0/16 is kept — the carve-out that matters most for a workload that fetches URLs out of
# scraped HTML. A rule the rehearsal cannot prove tight.
networkPolicy:
  scrapeEgress:
    ports:
      - 80
      - 443
      - 9000
    exceptCidrs:
      - "169.254.0.0/16"
  objectStorageEgress:
    ports:
      - 9000
    exceptCidrs:
      - "169.254.0.0/16"
