{{- if .Values.certManager.clusterIssuer.create }}
{{- $issuer := .Values.certManager.clusterIssuer }}
{{- $args := dict "ctx" $ "component" "certmanager" }}
{{- /* Off by default because a ClusterIssuer is cluster-scoped: a chart that owns one cannot be
   installed twice on one cluster, which the k3d rehearsal (#263) does. Staging and production
   create the issuer once, out of band, and `certManager.clusterIssuer.name` points at it.

   No `crds/` directory either: Helm has no story for upgrading or deleting CRDs a chart
   installed, so cert-manager's belong to cert-manager (#265); this chart renders only instances. */}}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  {{- /* Not the release-scoped name: a cluster-scoped singleton that other releases point at by name. */}}
  name: {{ $issuer.name | quote }}
  labels:
    {{- include "event-junkie.labels" $args | nindent 4 }}
spec:
  acme:
    {{- /* Defaults to Let's Encrypt staging. Production allows 50 certificates per registered domain
       per week and 5 duplicates, easy to burn debugging an annotation, then seven days locked out. */}}
    server: {{ $issuer.server | quote }}
    email: {{ required "certManager.clusterIssuer.email is required when clusterIssuer.create is true — Let's Encrypt sends expiry warnings there." $issuer.email | quote }}
    privateKeySecretRef:
      name: {{ printf "%s-account-key" $issuer.name | quote }}
    solvers:
      {{- if eq $issuer.solver "dns01" }}
      {{- /* Staging has no public address for an HTTP-01 challenge to reach (PLATFORM_SETUP §4a). The
         Hetzner DNS webhook is installed by #265; rendering a solver that names it is not requiring it.

         The shape is the official webhook's, not a community fork's, and that is not cosmetic: Hetzner
         shut the old dns.hetzner.com API down in May 2026, and the community webhooks that top a search
         still speak it. The official hetzner/cert-manager-webhook-hetzner (chart `hcloud/…`) speaks the
         Cloud API with an ordinary hcloud token. So: groupName `acme.hetzner.com` (not `.cloud`), and
         `tokenSecretKeyRef`, not the `secretName`/`secretKey` pair. Either wrong fails at challenge
         time, long after everything looks installed. */}}
      - dns01:
          webhook:
            groupName: {{ $issuer.dns01.webhookGroupName | quote }}
            solverName: hetzner
            config:
              tokenSecretKeyRef:
                name: {{ $issuer.dns01.tokenSecret.name | quote }}
                key: {{ $issuer.dns01.tokenSecret.key | quote }}
      {{- else }}
      {{- /* HTTP-01 needs port 80 reachable and the A record resolving, so the order is DNS, deploy,
         certificate, and it cannot be reordered. */}}
      - http01:
          ingress:
            ingressClassName: {{ $.Values.ingress.className | quote }}
      {{- end }}
{{- end }}
