{{- $args := dict "ctx" $ "component" "bff" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "event-junkie.componentName" $args }}
  annotations:
    kubernetes.io/description: >-
      Public read API. Serves under /api via spring.webflux.base-path; actuator is on the management port, which no Ingress routes.
  labels:
    {{- include "event-junkie.labels" $args | nindent 4 }}
spec:
  replicas: {{ .Values.bff.replicaCount }}
  selector:
    matchLabels:
      {{- include "event-junkie.selectorLabels" $args | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "event-junkie.labels" $args | nindent 8 }}
      annotations:
        {{- /* Roll the pods when the shared ConfigMap changes. Without this a `helm upgrade` that
               only touches config leaves every pod running the old values, and the drift shows up
               as a setting that is set in git and not in the cluster. */}}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        {{- with .Values.bff.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "event-junkie.serviceAccountName" $args }}
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "event-junkie.podSecurityContext" $args | nindent 8 }}
      containers:
        - name: bff
          image: {{ include "event-junkie.image" $args | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "event-junkie.containerSecurityContext" $args | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.bff.service.port }}
            {{- /* The management port is what keeps /actuator/** private. The Service publishes it
                   so a port-forward can reach it, the Ingress never names it, and so actuator is
                   *unroutable* rather than merely unrouted — which is the difference between a
                   network guarantee and an ingress rule that has to stay correct forever (§3.2). */}}
            - name: management
              containerPort: {{ .Values.bff.service.managementPort }}
          envFrom:
            - configMapRef:
                name: {{ include "event-junkie.fullname" $ }}
          env:
            - name: SERVER_PORT
              value: {{ .Values.bff.service.port | quote }}
            - name: MANAGEMENT_SERVER_PORT
              value: {{ .Values.bff.service.managementPort | quote }}
            {{- /* /api is served by Spring itself, so the Ingress routes /api straight through with
                   no rewrite and the chart needs no Traefik Middleware CRD (§3.1). This does not
                   move the actuator paths: the management port runs its own context whose base path
                   is `/` regardless of what webflux's is. */}}
            {{- /* A JVM that reads the container limit and then sizes its heap at 25% of it is the
                   other way memory goes wrong here — the pod does not OOM, it just runs in a
                   quarter of what it was given. */}}
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage={{ .Values.bff.maxRamPercentage }}"
            {{- include "event-junkie.databaseEnv" $ | nindent 12 }}
            {{- if and .Values.images.enabled .Values.images.serving.enabled }}
            {{- /* The half of ADR-019 a visitor sees. With this set the API hands out a path on our
                   own origin instead of the venue's URL, and the browser stops contacting the venue
                   (#792). It needs `images.enabled` as well, because there is nothing to serve until
                   the importer has fetched and derived it.

                   No IMAGE_STORAGE_PREFIX here, and that is not an omission: a served key is read
                   from the row that recorded it, so this workload never builds a key and cannot
                   build one for the wrong environment. */}}
            - name: APP_IMAGES_SERVING_ENABLED
              value: "true"
            {{- /* Only set where serving is on: nothing reads the bucket otherwise, and a cache
                   sized for a workload that is not running is memory taken from the heap. */}}
            - name: APP_IMAGES_CACHE_SIZE
              value: {{ .Values.images.cacheSize | quote }}
            - name: IMAGE_STORAGE_ENDPOINT
              value: {{ .Values.images.storage.endpoint | quote }}
            - name: IMAGE_STORAGE_REGION
              value: {{ .Values.images.storage.region | quote }}
            - name: IMAGE_STORAGE_BUCKET
              value: {{ .Values.images.storage.bucket | quote }}
            {{- /* The same Secret the importer reads, because it is the same bucket. This workload
                   only ever gets objects, but the keypair can write — Hetzner scopes a keypair to a
                   bucket and not to a verb. That is why the scoping matters twice over: it is now
                   mounted into the pod that is reachable from the internet
                   (SECRETS.md §event-junkie-images). */}}
            - name: IMAGE_STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.images.storage.existingSecret | quote }}
                  key: IMAGE_STORAGE_ACCESS_KEY
            - name: IMAGE_STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.images.storage.existingSecret | quote }}
                  key: IMAGE_STORAGE_SECRET_KEY
            {{- end }}
          {{- include "event-junkie.jvmProbes" $ | nindent 10 }}
          resources:
            {{- toYaml .Values.bff.resources | nindent 12 }}
          {{- /* `readOnlyRootFilesystem: true` and a JVM means /tmp must be writable: the JDK puts
                 hsperfdata there, and any temp file a library takes for granted lands there too. */}}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.bff.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.bff.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.bff.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
