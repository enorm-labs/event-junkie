{{- $args := dict "ctx" $ "component" "bff" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "event-junkie.componentName" $args }}
  annotations:
    kubernetes.io/description: >-
      Public read API. Its controllers are mapped under /api, so no rewrite exists; actuator is on the management port, which no Ingress routes.
  labels:
    {{- include "event-junkie.labels" $args | nindent 4 }}
spec:
  replicas: {{ .Values.bff.replicaCount }}
  selector:
    matchLabels:
      {{- include "event-junkie.selectorLabels" $args | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "event-junkie.labels" $args | nindent 8 }}
      annotations:
        {{- /* Roll the pods when the shared ConfigMap changes; otherwise a config-only `helm upgrade`
           leaves every pod on the old values, set in git and not in the cluster. */}}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        {{- with .Values.bff.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "event-junkie.serviceAccountName" $args }}
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "event-junkie.podSecurityContext" $args | nindent 8 }}
      containers:
        - name: bff
          image: {{ include "event-junkie.image" $args | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "event-junkie.containerSecurityContext" $args | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.bff.service.port }}
            {{- /* The management port is what keeps /actuator/** private: the Service publishes it for a
               port-forward, the Ingress never names it, so actuator is unroutable rather than merely
               unrouted, a network guarantee instead of an ingress rule that has to stay correct (§3.2). */}}
            - name: management
              containerPort: {{ .Values.bff.service.managementPort }}
          envFrom:
            - configMapRef:
                name: {{ include "event-junkie.fullname" $ }}
          env:
            - name: SERVER_PORT
              value: {{ .Values.bff.service.port | quote }}
            - name: MANAGEMENT_SERVER_PORT
              value: {{ .Values.bff.service.managementPort | quote }}
            {{- /* /api is served by Spring itself, so the Ingress routes it with no rewrite and no Middleware
               (§3.1). The management port runs its own context at `/` regardless of webflux's base path. */}}
            {{- /* A JVM that sizes its heap at 25% of the container limit does not OOM; it runs in a quarter
               of what it was given. */}}
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage={{ .Values.bff.maxRamPercentage }}"
            {{- include "event-junkie.databaseEnv" $ | nindent 12 }}
            {{- if and .Values.images.enabled .Values.images.serving.enabled }}
            {{- /* The half of ADR-019 a visitor sees: the API hands out a path on our own origin and the
               browser stops contacting the venue (#792). Needs `images.enabled` too, since there is
               nothing to serve until the importer has derived it. No IMAGE_STORAGE_PREFIX here: a served
               key is read from the row that recorded it, so this workload never builds a key for the
               wrong environment. */}}
            - name: APP_IMAGES_SERVING_ENABLED
              value: "true"
            {{- /* Only where serving is on: a cache sized for a workload that is not running is memory taken
               from the heap. */}}
            - name: APP_IMAGES_CACHE_SIZE
              value: {{ .Values.images.cacheSize | quote }}
            - name: IMAGE_STORAGE_ENDPOINT
              value: {{ .Values.images.storage.endpoint | quote }}
            - name: IMAGE_STORAGE_REGION
              value: {{ .Values.images.storage.region | quote }}
            - name: IMAGE_STORAGE_BUCKET
              value: {{ .Values.images.storage.bucket | quote }}
            {{- /* The same Secret the importer reads, because it is the same bucket. This workload only gets
               objects, but Hetzner scopes a keypair to a bucket and not to a verb, so the write-capable
               key is mounted into the pod reachable from the internet (SECRETS.md §event-junkie-images). */}}
            - name: IMAGE_STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.images.storage.existingSecret | quote }}
                  key: IMAGE_STORAGE_ACCESS_KEY
            - name: IMAGE_STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.images.storage.existingSecret | quote }}
                  key: IMAGE_STORAGE_SECRET_KEY
            {{- end }}
          {{- include "event-junkie.jvmProbes" $ | nindent 10 }}
          resources:
            {{- toYaml .Values.bff.resources | nindent 12 }}
          {{- /* `readOnlyRootFilesystem: true` and a JVM means /tmp must be writable: hsperfdata and every
             library's temp file land there. */}}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.bff.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.bff.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.bff.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
