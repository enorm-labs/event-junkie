{{- $args := dict "ctx" $ "component" "bff" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "event-junkie.componentName" $args }}
  labels:
    {{- include "event-junkie.labels" $args | nindent 4 }}
spec:
  replicas: {{ .Values.bff.replicaCount }}
  selector:
    matchLabels:
      {{- include "event-junkie.selectorLabels" $args | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "event-junkie.labels" $args | nindent 8 }}
      annotations:
        {{- /* Roll the pods when the shared ConfigMap changes. Without this a `helm upgrade` that
               only touches config leaves every pod running the old values, and the drift shows up
               as a setting that is set in git and not in the cluster. */}}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        {{- with .Values.bff.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "event-junkie.serviceAccountName" $args }}
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "event-junkie.podSecurityContext" $args | nindent 8 }}
      containers:
        - name: bff
          image: {{ include "event-junkie.image" $args | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "event-junkie.containerSecurityContext" $args | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.bff.service.port }}
              protocol: TCP
            {{- /* The management port is what keeps /actuator/** private. The Service publishes it
                   so a port-forward can reach it, the Ingress never names it, and so actuator is
                   *unroutable* rather than merely unrouted — which is the difference between a
                   network guarantee and an ingress rule that has to stay correct forever (§3.2). */}}
            - name: management
              containerPort: {{ .Values.bff.service.managementPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "event-junkie.fullname" $ }}
          env:
            - name: SERVER_PORT
              value: {{ .Values.bff.service.port | quote }}
            - name: MANAGEMENT_SERVER_PORT
              value: {{ .Values.bff.service.managementPort | quote }}
            {{- /* /api is served by Spring itself, so the Ingress routes /api straight through with
                   no rewrite and the chart needs no Traefik Middleware CRD (§3.1). This does not
                   move the actuator paths: the management port runs its own context whose base path
                   is `/` regardless of what webflux's is. */}}
            - name: SPRING_WEBFLUX_BASE_PATH
              value: {{ .Values.bff.basePath | quote }}
            {{- /* A JVM that reads the container limit and then sizes its heap at 25% of it is the
                   other way memory goes wrong here — the pod does not OOM, it just runs in a
                   quarter of what it was given. */}}
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage={{ .Values.bff.maxRamPercentage }}"
            {{- include "event-junkie.databaseEnv" $ | nindent 12 }}
          {{- include "event-junkie.jvmProbes" $ | nindent 10 }}
          resources:
            {{- toYaml .Values.bff.resources | nindent 12 }}
          {{- /* `readOnlyRootFilesystem: true` and a JVM means /tmp must be writable: the JDK puts
                 hsperfdata there, and any temp file a library takes for granted lands there too. */}}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.bff.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.bff.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.bff.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
