{{- if .Values.ingress.noindex }}
{{- $args := dict "ctx" $ "component" "frontend-seo" }}
{{- /* `robots.txt` and `sitemap.xml` for an environment that is not production: the body half of
   `ingress.noindex` (#286). The Middleware next door adds `X-Robots-Tag`, and a header cannot
   rewrite a response body, so the image's allow-all `robots.txt` with its production `Sitemap:`
   line would still be served.

   It cannot be fixed in the build: `events-frontend/scripts/seoFiles.ts` emits both files from
   the hard-coded `SITE_URL` in `src/lib/seo.ts`, because a canonical URL exists to name ONE
   address, and deriving it from the request host would make staging and every preview declare
   themselves canonical. One image serves every environment, so the override belongs here.

   A ConfigMap mounted over the built files rather than a second nginx server block, which would
   make the chart own a copy of `events-frontend/docker/nginx.conf` that drifts from the one
   carrying the unprivileged-safe properties #262 established. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-seo" (include "event-junkie.fullname" $) }}
  annotations:
    kubernetes.io/description: >-
      A disallow-all robots.txt and an empty sitemap, mounted over the ones baked into the frontend image. Gated on ingress.noindex, which is on wherever the environment is not the canonical host -- staging always, and production while the domain is dark.
  labels:
    {{- include "event-junkie.labels" $args | nindent 4 }}
data:
  {{- /* Keys are filenames, load-bearing: the frontend Deployment mounts each with `subPath`, and a
     `subPath` naming a missing key mounts an empty directory over the file instead of failing, so
     the environment quietly keeps the image's allow-all copy. The render assertions check the two
     lists against each other. */}}
  robots.txt: |
    # This host is not the Event Junkie site. Nothing here should be indexed.
    # This file and the X-Robots-Tag header are the control, so do not weaken either.
    User-agent: *
    Disallow: /
  {{- /* No `Sitemap:` line, deliberately: the image's copy names production, which is the second half
     of #286, a non-production environment pointing the crawler at the real site. */}}
  sitemap.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!-- Deliberately empty. A ConfigMap can replace a file's contents but cannot make it 404, and
         an empty urlset is valid, names no production URL, and does not read as a broken deploy to
         anything that fetches it. -->
    <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"/>
{{- end }}
