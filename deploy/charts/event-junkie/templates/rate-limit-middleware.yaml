{{- if and .Values.ingress.enabled .Values.ingress.rateLimit.enabled }}
{{- $args := dict "ctx" $ "component" "rate-limit" }}
{{- /* Abuse control at the edge (#268, PLATFORM_SETUP §8 item 9), Traefik-specific because the
   Ingress API has no vocabulary for a limit.

   Two limits that answer different questions. **`inFlightReq` bounds concurrency** per
   `requestHost`, so it holds whatever address Traefik sees; it protects the resource that runs
   out, ten R2DBC connections per BFF replica, with a 429 instead of a queue. **`rateLimit` bounds
   a request rate per remote address**, which only became the visitor's in #1013: k3s exposed
   Traefik through ServiceLB, whose klipper-lb masquerades unconditionally, and
   `externalTrafficPolicy: Local` did not help. A **hostPort** on Traefik with the Service at
   `ClusterIP` removed ServiceLB from the path (each cluster's `traefik-host-ports.yaml`).

   The numbers are large because this middleware sits on the Ingress that carries the whole site:
   a first visit costs about 30 requests and a second costs two, so the limit is sized for
   first-time visitors behind a carrier NAT (`values.yaml` carries the arithmetic).

   Deliberately absent: `sourceCriterion.requestHost` on `rateLimit`, which would hand one client
   the whole site's budget.

   Two objects, not a style choice: Traefik permits one type per Middleware, and a second key makes
   the whole object `multi-types middleware not supported`, dropping every router that names it.
   The site then answers Traefik's own 404 on every path. No schema rejects it, because the CRD
   models the types as optional siblings; it cost staging an outage (#268). */}}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ printf "%s-in-flight-req" (include "event-junkie.fullname" $) }}
  labels:
    {{- include "event-junkie.labels" $args | nindent 4 }}
  annotations:
    kubernetes.io/description: >-
      Bounds concurrent requests, grouped by request host, so it holds whatever address Traefik sees.
spec:
  inFlightReq:
    {{- /* `| int64` is load-bearing, as on `stsSeconds`: Helm parses a values number as float64, and the
       CRD's `format=int64` rejects the scientific notation `helm template` shows without complaint. */}}
    amount: {{ required "ingress.rateLimit.inFlightRequests is required when rateLimit is enabled" .Values.ingress.rateLimit.inFlightRequests | int64 }}
{{- with .Values.ingress.rateLimit.perSource }}
{{- if .enabled }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ printf "%s-rate-limit" (include "event-junkie.fullname" $) }}
  labels:
    {{- include "event-junkie.labels" $args | nindent 4 }}
  annotations:
    kubernetes.io/description: >-
      Bounds sustained request rate per client address, which the Traefik hostPort preserves.
spec:
  rateLimit:
    average: {{ required "ingress.rateLimit.perSource.average is required when perSource is enabled — 0 silently disables the limit rather than setting it to zero" .average | int64 }}
    burst: {{ required "ingress.rateLimit.perSource.burst is required when perSource is enabled — 1 is Traefik's default and is not what anyone means" .burst | int64 }}
    period: {{ .period | quote }}
{{- end }}
{{- end }}
{{- end }}
