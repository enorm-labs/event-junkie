{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- $importerSelector := include "event-junkie.selectorLabels" (dict "ctx" $ "component" "importer") }}
{{- $bffSelector := include "event-junkie.selectorLabels" (dict "ctx" $ "component" "bff") }}
{{- $testSelector := include "event-junkie.selectorLabels" (dict "ctx" $ "component" "test") }}
{{- /* PLATFORM_SETUP §8 item 1 (#416): **NetworkPolicy enforcement being on means nothing while
   every pod may talk to every pod.** A NetworkPolicy selects pods in its own namespace only, and
   this chart owns exactly one, so this is default-deny for the release namespace; kube-system,
   cert-manager and flux-system are the cluster's business. One deny-all plus one narrow allowance
   per real conversation — the only shape that produces a reviewable list. READ THE ALLOWANCES AS
   THE ARCHITECTURE: if a conversation is not below, it does not happen.

     Traefik  -> frontend:8080    the SPA
     Traefik  -> bff:8080         /api
     frontend -> bff:8080         the meta-injection sidecar, one lookup per detail page
     bff      -> PostgreSQL:5432
     importer -> PostgreSQL:5432
     importer -> the internet     scraping venue sites, which is the product
     bff      -> the internet:443 reading cached images out of the bucket, while serving them
     all      -> CoreDNS:53
     test pod -> bff, frontend    the helm test hook, only while tests are enabled

   WHAT IS ABSENT IS THE POINT. Nothing reaches the importer — not Traefik, not the frontend, not
   the BFF: its admin API was unroutable, now it is unreachable from inside the namespace too.
   Nothing reaches either management port except the kubelet and the test hook. THE KUBELET IS NOT
   LISTED, deliberately: probes originate on the node, and node-to-pod traffic is not subject to
   NetworkPolicy in k3s — a property tested rather than believed, because if it were wrong every
   pod would fail its probes and the k3d rehearsal would say so. `kubectl port-forward` arrives
   the same way. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-default-deny" (include "event-junkie.fullname" $) }}
  labels:
    {{- include "event-junkie.labels" (dict "ctx" $ "component" "networkpolicy") | nindent 4 }}
  annotations:
    kubernetes.io/description: >-
      Denies all ingress and egress in this namespace. Every allowance is a separate, named policy — so an arrow that is not written down does not exist.
spec:
  {{- /* An empty podSelector selects every pod in the namespace, including a debug pod someone
     kubectl-runs — the exact shape of the hole this closes. */}}
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-allow-dns" (include "event-junkie.fullname" $) }}
  labels:
    {{- include "event-junkie.labels" (dict "ctx" $ "component" "networkpolicy") | nindent 4 }}
  annotations:
    kubernetes.io/description: >-
      Egress to the cluster DNS service. Without this every other allowance below is unusable, because each one addresses a name.
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $np.dns.namespaceSelector | nindent 14 }}
      ports:
        {{- /* Both protocols: UDP carries almost every query, TCP the responses over 512 bytes, and a
           UDP-only rule fails intermittently in a way that reads as a flaky network. */}}
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-allow-ingress-controller" (include "event-junkie.fullname" $) }}
  labels:
    {{- include "event-junkie.labels" (dict "ctx" $ "component" "networkpolicy") | nindent 4 }}
  annotations:
    kubernetes.io/description: >-
      The only way in from outside the namespace. Traefik reaches the frontend and the BFF on their service ports, and nothing else.
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - bff
          - frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $np.ingressController.namespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $np.ingressController.podSelector | nindent 14 }}
      ports:
        {{- /* The service ports only. The management port is unroutable already; this makes it unreachable
           from the controller at all — a network guarantee rather than an ingress rule. */}}
        - protocol: TCP
          port: {{ .Values.bff.service.port }}
        - protocol: TCP
          port: {{ .Values.frontend.service.port }}
---
{{- if .Values.frontend.injector.enabled }}
{{- $frontendSelector := include "event-junkie.selectorLabels" (dict "ctx" $ "component" "frontend") }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-allow-frontend-to-bff" (include "event-junkie.fullname" $) }}
  labels:
    {{- include "event-junkie.labels" (dict "ctx" $ "component" "networkpolicy") | nindent 4 }}
  annotations:
    kubernetes.io/description: >-
      The meta-injection sidecar in the frontend pod reads one entity per detail page from the BFF. Rendered only while the sidecar is.
spec:
  {{- /* Both directions in one object, as the test-hook policy does: a policy carrying one half would be
     silently useless once the other was deleted. The service port only. Gated on the sidecar, so
     the arrow disappears with the process that used it. */}}
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - bff
          - frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- $frontendSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.bff.service.port }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- $bffSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.bff.service.port }}
{{- end }}
---
{{- if and .Values.ingress.enabled .Values.ingress.tls.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-allow-acme-solver" (include "event-junkie.fullname" $) }}
  labels:
    {{- include "event-junkie.labels" (dict "ctx" $ "component" "networkpolicy") | nindent 4 }}
  annotations:
    kubernetes.io/description: >-
      Lets the ingress controller reach cert-manager's HTTP-01 solver pod. Without it the default-deny policy blocks the challenge and no certificate can issue or renew.
spec:
  {{- /* cert-manager creates this pod itself, carrying only its own labels, so the default-deny catches
     it and the challenge sticks on `wrong status code '502', expected '200'`. Only an HTTP-01 cluster
     has this pod at all — staging solves DNS-01, k3d runs `tls.enabled: false`. This governs RENEWAL
     as much as issuance: removing it breaks nothing for sixty days. */}}
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $np.ingressController.namespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $np.ingressController.podSelector | nindent 14 }}
      ports:
        {{- /* cert-manager's solver listens on 8089; its own constant, not ours to configure. */}}
        - protocol: TCP
          port: 8089
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-allow-database" (include "event-junkie.fullname" $) }}
  labels:
    {{- include "event-junkie.labels" (dict "ctx" $ "component" "networkpolicy") | nindent 4 }}
  annotations:
    kubernetes.io/description: >-
      The two JVM services reach PostgreSQL. The frontend is excluded because a static bundle has no database.
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - bff
          - importer
  policyTypes:
    - Egress
  egress:
    - to:
        {{- /* A CIDR and not `database.host`, because **NetworkPolicy cannot resolve a name**: set the host and
           forget this, and the pods resolve the name and hang on connect, which looks like the database
           being down. The `required` below turns that into a render error. PostgreSQL is off-cluster on a
           private address, so an ipBlock rather than a pod selector. */}}
        - ipBlock:
            cidr: {{ required "networkPolicy.databaseCidr is required when networkPolicy.enabled — NetworkPolicy speaks CIDRs and cannot resolve database.host. Use the /32 of `postgres_ip` from the matching infra stack." $np.databaseCidr | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.database.port }}
{{- if $np.scrapeEgress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-allow-scraping" (include "event-junkie.fullname" $) }}
  labels:
    {{- include "event-junkie.labels" (dict "ctx" $ "component" "networkpolicy") | nindent 4 }}
  annotations:
    kubernetes.io/description: >-
      The importer reaches venue websites. This is the one workload that must talk to the open internet, and the only one that may.
spec:
  podSelector:
    matchLabels:
      {{- $importerSelector | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            {{- /* The private ranges are carved out, so "the internet" means the internet: without these the
               importer — the workload that parses untrusted HTML — would also reach the cluster, the node and
               any peered network. 169.254.0.0/16 is the sharpest: a cloud metadata service lives there, the
               classic SSRF-to-credentials path. */}}
            except:
              {{- toYaml $np.scrapeEgress.exceptCidrs | nindent 14 }}
      ports:
        {{- range $np.scrapeEgress.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
{{- end }}
{{- if and $np.objectStorageEgress.enabled .Values.images.enabled .Values.images.serving.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-allow-object-storage" (include "event-junkie.fullname" $) }}
  labels:
    {{- include "event-junkie.labels" (dict "ctx" $ "component" "networkpolicy") | nindent 4 }}
  annotations:
    kubernetes.io/description: >-
      The BFF reads cached venue images out of Object Storage. Rendered only while it is serving them, so the second workload with a route off the cluster
      exists for exactly as long as it has a reason to.
spec:
  podSelector:
    matchLabels:
      {{- $bffSelector | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        {{- /* Hetzner publishes no stable address range for Object Storage, so this is the internet minus the
           private ranges, as `-allow-scraping` is. Narrower in two ways: 443 only, and the BFF never fetches
           a URL a venue chose. */}}
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml $np.objectStorageEgress.exceptCidrs | nindent 14 }}
      ports:
        {{- range $np.objectStorageEgress.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
{{- end }}
{{- if .Values.tests.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-allow-test-hook" (include "event-junkie.fullname" $) }}
  labels:
    {{- include "event-junkie.labels" (dict "ctx" $ "component" "networkpolicy") | nindent 4 }}
  annotations:
    kubernetes.io/description: >-
      The helm test hook reaches the BFF's readiness endpoint and the frontend's index. Rendered only while tests are enabled.
spec:
  {{- /* Both directions in one object, so one half cannot be deleted without the other. The only
     allowance naming the *management* port — reachable in-cluster, unroutable from outside, the
     asymmetry the hook proves. Gated on `tests.enabled`, so disabling tests removes the reachability. */}}
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - bff
          - frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- $testSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.bff.service.managementPort }}
        - protocol: TCP
          port: {{ .Values.frontend.service.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-allow-test-hook-egress" (include "event-junkie.fullname" $) }}
  labels:
    {{- include "event-junkie.labels" (dict "ctx" $ "component" "networkpolicy") | nindent 4 }}
  annotations:
    kubernetes.io/description: >-
      The other half of the test hook's conversation. Kept adjacent to its ingress twin so the pair is obvious.
spec:
  podSelector:
    matchLabels:
      {{- $testSelector | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - bff
                  - frontend
      ports:
        - protocol: TCP
          port: {{ .Values.bff.service.managementPort }}
        - protocol: TCP
          port: {{ .Values.frontend.service.port }}
{{- end }}
{{- if $np.metricsScrape.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-allow-metrics-scrape" (include "event-junkie.fullname" $) }}
  labels:
    {{- include "event-junkie.labels" (dict "ctx" $ "component" "networkpolicy") | nindent 4 }}
  annotations:
    kubernetes.io/description: >-
      Lets a metrics collector reach the management port. Without this the meters are exposed, the pods are annotated, the collector finds them, and every
      scrape is refused — the state this chart was in until #271 ran it. Note that `-allow-scraping` is the opposite direction: the importer scraping venue
      websites.
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - bff
          - importer
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- if eq $np.metricsScrape.mode "ipBlock" }}
        {{- /* Opens the management port to every pod in the cluster, only for the cross-node case values.yaml
           describes: a selector cannot match SNAT'd traffic. */}}
        - ipBlock:
            cidr: {{ $np.metricsScrape.cidr | required "networkPolicy.metricsScrape.cidr is required when mode is ipBlock" }}
        {{- else }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.metricsScrape.namespace }}
        {{- end }}
      ports:
        {{- /* The management port only; a collector has no business on the application ports. */}}
        - protocol: TCP
          port: {{ .Values.bff.service.managementPort }}
        - protocol: TCP
          port: {{ .Values.importer.service.managementPort }}
{{- end }}
{{- end }}
