{{- $args := dict "ctx" $ "component" "importer" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "event-junkie.componentName" $args }}
  annotations:
    kubernetes.io/description: >-
      Scrapers and scheduler. One replica and strategy Recreate are an ADR-008 correctness constraint, not a cost one: two schedulers means two concurrent imports of the same source. Owns the Flyway migrations.
  labels:
    {{- include "event-junkie.labels" $args | nindent 4 }}
spec:
  {{- /* One replica, a correctness constraint from ADR-008: two schedulers means two concurrent imports
     of one source, and the RUNNING check has no lock. `SELECT … FOR UPDATE SKIP LOCKED` is the
     prerequisite for raising this; values.schema.json pins it so the constraint fails at install time. */}}
  replicas: {{ .Values.importer.replicaCount }}
  strategy:
    {{- /* Recreate for the same reason: a rolling update briefly runs two pods, two schedulers by another
       route. The gap in imports during a deploy is invisible on a 60-second tick. */}}
    type: Recreate
  selector:
    matchLabels:
      {{- include "event-junkie.selectorLabels" $args | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "event-junkie.labels" $args | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        {{- with .Values.importer.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "event-junkie.serviceAccountName" $args }}
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "event-junkie.podSecurityContext" $args | nindent 8 }}
      containers:
        - name: importer
          image: {{ include "event-junkie.image" $args | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "event-junkie.containerSecurityContext" $args | nindent 12 }}
          ports:
            {{- /* Serves /api/admin/** and nothing else public-facing. No Ingress here points at it, the assertions
               fail the build if one ever does, and the access path is `kubectl port-forward` over WireGuard. */}}
            - name: http
              containerPort: {{ .Values.importer.service.port }}
            - name: management
              containerPort: {{ .Values.importer.service.managementPort }}
          envFrom:
            - configMapRef:
                name: {{ include "event-junkie.fullname" $ }}
          env:
            - name: SERVER_PORT
              value: {{ .Values.importer.service.port | quote }}
            - name: MANAGEMENT_SERVER_PORT
              value: {{ .Values.importer.service.managementPort | quote }}
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage={{ .Values.importer.maxRamPercentage }}"
            {{- include "event-junkie.databaseEnv" $ | nindent 12 }}
            {{- /* The importer owns the schema (ADR-005), and Flyway has no reactive driver, so this one workload
               holds two connection configurations. Locally Docker Compose support supplies both; in a cluster
               the JDBC half is the one forgotten, and its failure is a migration that never runs. */}}
            {{- include "event-junkie.flywayEnv" $ | nindent 12 }}
            {{- if .Values.images.enabled }}
            - name: APP_IMAGES_FETCH_ENABLED
              value: "true"
            - name: APP_IMAGES_SWEEP_ENABLED
              value: {{ .Values.images.sweep.enabled | quote }}
            - name: IMAGE_STORAGE_ENDPOINT
              value: {{ .Values.images.storage.endpoint | quote }}
            - name: IMAGE_STORAGE_REGION
              value: {{ .Values.images.storage.region | quote }}
            - name: IMAGE_STORAGE_BUCKET
              value: {{ .Values.images.storage.bucket | quote }}
            {{- /* One bucket serves both environments with content-addressed keys, so this prefix is the only thing
               keeping their objects apart. Required: a shared prefix lets one environment's orphan sweep delete
               an object the other still serves. */}}
            - name: IMAGE_STORAGE_PREFIX
              value: {{ required "images.storage.prefix is required when images.enabled — it is what separates this environment's objects from the other's." .Values.images.storage.prefix | quote }}
            {{- /* A keypair scoped to this bucket alone: the importer fetches URLs taken out of scraped HTML, so a
               credential reaching -backups or -tfstate would turn an SSRF into an infrastructure compromise. */}}
            - name: IMAGE_STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.images.storage.existingSecret | quote }}
                  key: IMAGE_STORAGE_ACCESS_KEY
            - name: IMAGE_STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.images.storage.existingSecret | quote }}
                  key: IMAGE_STORAGE_SECRET_KEY
            {{- end }}
            {{- if eq .Values.importer.translation.engine "anthropic" }}
            {{- /* Two switches stand between here and a byte leaving the platform: this one, and a per-source
               `translation_licence` of PERMITTED, which follows the display rule since ADR-027. */}}
            - name: APP_TRANSLATION_ENGINE
              value: "anthropic"
            - name: APP_TRANSLATION_MODEL
              value: {{ .Values.importer.translation.model | quote }}
            - name: APP_TRANSLATION_MAX_PER_RUN
              value: {{ .Values.importer.translation.maxPerRun | quote }}
            {{- /* Hand-made, never SOPS: the ciphertext in a public repository is permanent, and this key is usable
               by anyone who holds it (docs/ops/SECRETS.md). Regenerating it is a Console click. */}}
            - name: APP_TRANSLATION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.importer.translation.existingSecret | quote }}
                  key: APP_TRANSLATION_API_KEY
            {{- end }}
            {{- if and .Values.images.enabled .Values.images.imgproxy.enabled }}
            {{- /* **The client half of the sidecar, and it is easy to leave out.** Without these the sidecar starts,
               passes every probe, is never asked for anything, and no derivative is generated — no error anywhere. */}}
            - name: APP_IMAGES_IMGPROXY_ENABLED
              value: "true"
            {{- /* The other end of IMGPROXY_BIND below; two values that have to agree, written next to each other. */}}
            - name: IMGPROXY_BASE_URL
              value: "http://127.0.0.1:8080"
            {{- /* The same key and salt the sidecar checks. A JVM without them signs nothing and gets 403 on every
               request, which reads as a broken sidecar rather than a missing secret. */}}
            - name: IMGPROXY_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.images.imgproxy.existingSecret | quote }}
                  key: IMGPROXY_KEY
            - name: IMGPROXY_SALT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.images.imgproxy.existingSecret | quote }}
                  key: IMGPROXY_SALT
            {{- end }}
          {{- include "event-junkie.jvmProbes" $ | nindent 10 }}
          resources:
            {{- toYaml .Values.importer.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        {{- if and .Values.images.enabled .Values.images.imgproxy.enabled }}
        {{- /* imgproxy generates the derivatives at import time and never for a visitor (ADR-020). A sidecar
           rather than a Deployment: idle outside import windows, and only the importer may call it.
           **NetworkPolicy cannot constrain it separately** — a sidecar shares the pod's network namespace
           and inherits the importer's open-internet egress — so IMGPROXY_ALLOWED_SOURCES below is what keeps
           it off venue URLs. */}}
        - name: imgproxy
          image: "{{ .Values.images.imgproxy.image.repository }}@{{ .Values.images.imgproxy.image.digest }}"
          imagePullPolicy: {{ .Values.images.imgproxy.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.images.imgproxy.securityContext | nindent 12 }}
          env:
            {{- /* Loopback only: nothing outside this pod can reach the sidecar, the first half of "imgproxy never
               serves a visitor"; URL signing is the second. */}}
            - name: IMGPROXY_BIND
              value: "127.0.0.1:8080"
            {{- /* The bounds that kill a decompression bomb, set explicitly: ADR-020 moved decoding out of the JVM
               into a Go process with a memory limit. `| int64` is load-bearing: Helm parses a values number as
               float64, and 8388608 quoted straight renders as "8.388608e+06", which imgproxy refuses with
               `strconv.Atoi: parsing "8.388608e+06": invalid syntax` and crash-loops. */}}
            - name: IMGPROXY_MAX_SRC_RESOLUTION
              value: {{ .Values.images.imgproxy.maxSrcResolutionMp | int64 | quote }}
            - name: IMGPROXY_MAX_SRC_FILE_SIZE
              value: {{ .Values.images.imgproxy.maxSrcFileSizeBytes | int64 | quote }}
            {{- /* Stated, not assumed: EXIF can carry GPS coordinates and a camera serial, personal data for
               photographs of venues and artists (LEGAL.md §7.3a). */}}
            - name: IMGPROXY_STRIP_METADATA
              value: "true"
            {{- /* The bucket, and nothing else: our fetcher owns robots.txt, throttling and the SSRF checks, and
               imgproxy pulling directly would go around all three (ADR-007). */}}
            - name: IMGPROXY_ALLOWED_SOURCES
              value: "s3://{{ .Values.images.storage.bucket }}/"
            - name: IMGPROXY_USE_S3
              value: "true"
            - name: IMGPROXY_S3_ENDPOINT
              value: {{ .Values.images.storage.endpoint | quote }}
            - name: IMGPROXY_S3_REGION
              value: {{ .Values.images.storage.region | quote }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.images.storage.existingSecret | quote }}
                  key: IMAGE_STORAGE_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.images.storage.existingSecret | quote }}
                  key: IMAGE_STORAGE_SECRET_KEY
            {{- /* Signing, so nothing that reaches the sidecar can ask it to process anything. */}}
            - name: IMGPROXY_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.images.imgproxy.existingSecret | quote }}
                  key: IMGPROXY_KEY
            - name: IMGPROXY_SALT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.images.imgproxy.existingSecret | quote }}
                  key: IMGPROXY_SALT
          resources:
            {{- toYaml .Values.images.imgproxy.resources | nindent 12 }}
          volumeMounts:
            - name: imgproxy-tmp
              mountPath: /tmp
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if and .Values.images.enabled .Values.images.imgproxy.enabled }}
        {{- /* libvips writes temporary files, and the container runs read-only. */}}
        - name: imgproxy-tmp
          emptyDir: {}
        {{- end }}
      {{- with .Values.importer.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.importer.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.importer.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
