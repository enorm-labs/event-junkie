{{- if .Values.ingress.enabled }}
{{- $args := dict "ctx" $ "component" "ingress" }}
{{- $bff := include "event-junkie.componentName" (dict "ctx" $ "component" "bff") }}
{{- $frontend := include "event-junkie.componentName" (dict "ctx" $ "component" "frontend") }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "event-junkie.fullname" $ }}
  labels:
    {{- include "event-junkie.labels" $args | nindent 4 }}
  annotations:
    kubernetes.io/description: >-
      The only route into the release. /api reaches the BFF, / reaches the frontend, and nothing reaches the importer or actuator.
    {{- if .Values.ingress.tls.enabled }}
    {{- /* cert-manager's ingress-shim watches this annotation and creates the Certificate, so the chart
       owns none. cert-manager must already be installed: the API server rejects an unknown kind,
       so `helm install` fails outright rather than racing. */}}
    cert-manager.io/cluster-issuer: {{ .Values.certManager.clusterIssuer.name | quote }}
    {{- end }}
    {{- /* `<namespace>-<name>@kubernetescrd` is Traefik's cross-namespace reference format; the
       namespace is `.Release.Namespace` because Flux sets `targetNamespace`, as the redirect
       Ingress does.

       Built as a list in one place (#416): the annotation is a comma-separated string with no
       schema, so a stray comma or an empty element is not a render error but a router that
       silently drops every middleware, which looks like a working deployment. Order matters: the
       rate limit comes after the header middlewares so a 429 still carries the security headers.

       Only on this Ingress, not the redirect one, which answers every request with a 301 to the
       host that carries the headers. The exception: a 301 carries no HSTS, so `event-junkie.com`
       is not pinned to HTTPS, only `event-junkie.de` is. Pinning a host we merely redirect from
       would be a long-lived promise about a name we do not serve. */}}
    {{- $middlewares := list }}
    {{- if .Values.ingress.securityHeaders.enabled }}
    {{- $middlewares = append $middlewares (printf "%s-%s-security-headers@kubernetescrd" .Release.Namespace (include "event-junkie.fullname" $)) }}
    {{- end }}
    {{- /* Two names, because Traefik permits one type per Middleware and the limit is two types. The
       second is conditional on `perSource.enabled` because a name that resolves to nothing drops
       every middleware AND the router. */}}
    {{- if .Values.ingress.rateLimit.enabled }}
    {{- $middlewares = append $middlewares (printf "%s-%s-in-flight-req@kubernetescrd" .Release.Namespace (include "event-junkie.fullname" $)) }}
    {{- if .Values.ingress.rateLimit.perSource.enabled }}
    {{- $middlewares = append $middlewares (printf "%s-%s-rate-limit@kubernetescrd" .Release.Namespace (include "event-junkie.fullname" $)) }}
    {{- end }}
    {{- end }}
    {{- if .Values.ingress.noindex }}
    {{- $middlewares = append $middlewares (printf "%s-%s-noindex@kubernetescrd" .Release.Namespace (include "event-junkie.fullname" $)) }}
    {{- end }}
    {{- if $middlewares }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ join "," $middlewares | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- /* Two rules and no rewrite: the BFF's controllers are mapped under /api themselves. Traefik
             prioritises the longer prefix, but the rules are most-specific-first anyway, because relying
             on a controller's tie-breaking breaks on a different one.

             What is NOT here matters: no path routes to the importer or names the management port, so
             /api/admin/** and /actuator/** are unreachable because nothing addresses them, not because a
             rule excludes them. `tests/ingress_test.yaml` fails the build if that stops being true. */}}
          - path: {{ .Values.bff.basePath | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ $bff }}
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $frontend }}
                port:
                  name: http
{{- end }}
