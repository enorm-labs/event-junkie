{{- $args := dict "ctx" $ "component" "importer" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "event-junkie.componentName" $args }}
  annotations:
    kubernetes.io/description: >-
      ClusterIP with no Ingress anywhere in this chart. The admin API has no authentication of its own; what keeps it private is that nothing outside the cluster can address it.
  labels:
    {{- include "event-junkie.labels" $args | nindent 4 }}
spec:
  {{- /* ClusterIP with no `type` value: the admin API has no authentication of its own, and a
     NodePort or LoadBalancer here would expose it in one word. */}}
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.importer.service.port }}
      targetPort: http
    - name: management
      port: {{ .Values.importer.service.managementPort }}
      targetPort: management
  selector:
    {{- include "event-junkie.selectorLabels" $args | nindent 4 }}
