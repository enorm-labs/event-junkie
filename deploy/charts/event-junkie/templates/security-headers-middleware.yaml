{{- if and .Values.ingress.enabled .Values.ingress.securityHeaders.enabled }}
{{- $args := dict "ctx" $ "component" "security-headers" }}
{{- /* Response headers the Ingress API cannot express (#416): a header is a property of the response,
   and `networking.k8s.io/v1` has no vocabulary for one, so this is Traefik-specific like the other
   two middlewares.

   What each one buys:

   - **HSTS** is the only one that changes what an attacker can do: without it the first request
     of a session is plaintext and strippable. A 301 is obeyed only after the plaintext request was
     made; HSTS is what makes the redirect Ingress unnecessary after the first visit.
   - **X-Content-Type-Options: nosniff** — the BFF serves JSON; a sniffed JSON response rendered as
     HTML is the shape of the attack.
   - **X-Frame-Options: DENY** — nothing here is meant to be embedded, and it stops being free to add
     once someone links to an embed.
   - **Referrer-Policy** is named in the privacy notice: event slugs describe what somebody was
     looking at, and without it the full URL goes to every third-party host they navigate to.
   - **Permissions-Policy** denies the browser features nothing here uses.
   - **Cross-Origin-Resource-Policy: same-origin** keeps another origin from loading the assets and
     cached venue images (#1442); no Traefik field, so it goes through `customResponseHeaders`.
   - **COEP: credentialless** and **COOP: same-origin** complete the isolation trio (#1464).
     `credentialless` rather than `require-corp`: with image serving off every image is a venue's
     own URL with no CORP header, and `require-corp` would blank them all.

   Deliberately absent: **X-XSS-Protection** (`browserXssFilter`), removed from every current browser
   and a source of vulnerabilities in its last implementations.

   **Content-Security-Policy** is the one that depends on something else: `img-src` can only be
   strict because the images are cached (ADR-019), and #845 fixes which origin it names. It renders
   from a list because a second copy in `events-frontend/scripts/csp.ts` applies the policy to
   `npm run preview`, the server Playwright runs against; `scripts/csp-parity.sh` holds the two
   together and recomputes the `script-src` hash from `index.html`. values.yaml carries the
   report-only default and its reason. */}}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ printf "%s-security-headers" (include "event-junkie.fullname" $) }}
  labels:
    {{- include "event-junkie.labels" $args | nindent 4 }}
  annotations:
    kubernetes.io/description: >-
      A content security policy, HSTS, nosniff, frame-deny, a referrer policy, a permissions policy and the three cross-origin policies on every response. Response headers have no Ingress API equivalent.
spec:
  headers:
    {{- /* `stsSeconds: 0` means "do not send the header at all", so the value is required rather
       than defaulted: a typo that empties it fails the render instead of turning HSTS off. */}}
    {{- /* `| int64` is load-bearing: Helm parses a values number as float64, and an unpiped 31536000
       renders as `3.1536e+07`, which the CRD's `format=int64` rejects and `helm template` shows
       without complaint. `tests/network_test.yaml` caught this. */}}
    stsSeconds: {{ required "ingress.securityHeaders.hsts.maxAgeSeconds is required when securityHeaders is enabled — 0 silently disables HSTS rather than setting it to zero" .Values.ingress.securityHeaders.hsts.maxAgeSeconds | int64 }}
    stsIncludeSubdomains: {{ .Values.ingress.securityHeaders.hsts.includeSubdomains }}
    stsPreload: {{ .Values.ingress.securityHeaders.hsts.preload }}
    {{- /* `forceSTSHeader` stays FALSE: HSTS over plaintext is ignored by browsers, and it is wrong on
       the one host that serves plain HTTP on purpose, the ACME http-01 challenge. */}}
    forceSTSHeader: false
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: {{ .Values.ingress.securityHeaders.referrerPolicy | quote }}
    permissionsPolicy: {{ .Values.ingress.securityHeaders.permissionsPolicy | quote }}
    customResponseHeaders:
      Cross-Origin-Resource-Policy: {{ .Values.ingress.securityHeaders.crossOriginResourcePolicy | quote }}
      Cross-Origin-Embedder-Policy: {{ .Values.ingress.securityHeaders.crossOriginEmbedderPolicy | quote }}
      Cross-Origin-Opener-Policy: {{ .Values.ingress.securityHeaders.crossOriginOpenerPolicy | quote }}
    {{- with .Values.ingress.securityHeaders.contentSecurityPolicy }}
    {{- if .enabled }}
    {{- /* `img-src` is composed here so the header cannot contradict the deployment it is sent from.
       With serving off, `CachedImageGate` returns the venue's own URL and a `'self'` policy would
       blank every image, a failure that looks like a broken image cache rather than a wrong header. */}}
    {{- $imgSrc := ternary "'self'" "'self' https:" $.Values.images.serving.enabled }}
    {{- $policy := printf "%s; img-src %s" (join "; " .directives) $imgSrc }}
    {{- if .reportOnly }}
    contentSecurityPolicyReportOnly: {{ $policy | quote }}
    {{- else }}
    contentSecurityPolicy: {{ $policy | quote }}
    {{- end }}
    {{- end }}
    {{- end }}
{{- end }}
