{{- if and .Values.ingress.enabled .Values.ingress.noindex }}
{{- $args := dict "ctx" $ "component" "noindex" }}
{{- /* `X-Robots-Tag: noindex, nofollow` on every response from a non-production environment.
   Traefik-specific because the Ingress API cannot express a response header; gated on
   `ingress.noindex`, which production leaves off, so "empty redirectHosts leaves nothing
   Traefik-specific" holds for the environment that matters.

   A header and not the build: the frontend emits `robots.txt` and `sitemap.xml` at build time,
   and the same image runs in both environments, so this is a deployment concern by
   construction. #286 covers the `robots.txt` body, which a header cannot rewrite.

   Defence in depth, not the control: staging has no public address (PLATFORM_SETUP §4a). This
   is what stands between us and the afternoon somebody adds an A record to check something. */}}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ printf "%s-noindex" (include "event-junkie.fullname" $) }}
  labels:
    {{- include "event-junkie.labels" $args | nindent 4 }}
  annotations:
    kubernetes.io/description: >-
      Adds X-Robots-Tag to every response so a non-production environment cannot be indexed. Gated
      on ingress.noindex, which is off in production.
spec:
  headers:
    customResponseHeaders:
      {{- /* `noindex` keeps the page out of the index, `nofollow` stops the crawler walking into the
         rest of the environment. */}}
      X-Robots-Tag: "noindex, nofollow"
{{- end }}
