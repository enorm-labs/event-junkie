{{- $args := dict "ctx" $ "component" "frontend" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "event-junkie.componentName" $args }}
  annotations:
    kubernetes.io/description: >-
      The web app, served as static files by nginx on 8080. Not 80: the pod runs non-root and cannot bind a privileged port.
  labels:
    {{- include "event-junkie.labels" $args | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "event-junkie.selectorLabels" $args | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "event-junkie.labels" $args | nindent 8 }}
      {{- if or .Values.frontend.podAnnotations .Values.ingress.noindex }}
      annotations:
        {{- if .Values.ingress.noindex }}
        {{- /* Same job as the BFF's `checksum/config`, for a sharper reason: a `subPath` mount is a
           point-in-time copy the kubelet never refreshes, so editing the SEO ConfigMap changes
           nothing nginx serves until the pod restarts. This makes the pod template change with the
           content. Conditional because the ConfigMap does not exist in production, where an
           unconditional one would render the sha256 of an empty string. */}}
        checksum/seo: {{ include (print $.Template.BasePath "/frontend-seo-configmap.yaml") $ | sha256sum }}
        {{- end }}
        {{- with .Values.frontend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "event-junkie.serviceAccountName" $args }}
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "event-junkie.podSecurityContext" $args | nindent 8 }}
      containers:
        - name: frontend
          image: {{ include "event-junkie.image" $args | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "event-junkie.containerSecurityContext" $args | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.service.port }}
          {{- /* nginx serves a static bundle with no health endpoint; a HEAD on the index is the whole contract. */}}
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          {{- /* One writable path, verified against the real image in #262 with `--read-only --tmpfs /tmp`.
             /var/cache/nginx and /var/run are not needed: `nginxinc/nginx-unprivileged` sets
             `pid /tmp/nginx.pid`, redirects every `*_temp_path` into /tmp and symlinks both logs to
             /dev/stdout and /dev/stderr. If the base image changes, re-check: the failure is at startup. */}}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.ingress.noindex }}
            {{- /* Mounted over the built files rather than beside them (#286). Without `subPath` this volume
               would mount as a directory over /usr/share/nginx/html and hide the whole bundle, which fails
               as a blank site rather than a bad robots.txt. `readOnly` because nothing here writes. */}}
            - name: seo
              mountPath: /usr/share/nginx/html/robots.txt
              subPath: robots.txt
              readOnly: true
            - name: seo
              mountPath: /usr/share/nginx/html/sitemap.xml
              subPath: sitemap.xml
              readOnly: true
            {{- end }}
        {{- if .Values.frontend.injector.enabled }}
        {{- $injector := .Values.frontend.injector }}
        {{- /* The meta-injection sidecar (ADR-014 §Decision 3). nginx proxies the four detail route families
           to it on loopback; it fetches the shell from nginx, the entity from the BFF Service, and
           rewrites the head. Every failure is a 502 that nginx turns into the plain shell (docker/nginx.conf).
           A sidecar, like imgproxy, because sharing the pod is what makes the loopback contract hold; it
           shares the network namespace, so `allow-frontend-to-bff` in networkpolicy.yaml is its only
           egress beyond DNS. */}}
        - name: injector
          image: {{ include "event-junkie.imageRef" (dict "image" $injector.image "defaultRegistry" .Values.image.registry "appVersion" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "event-junkie.containerSecurityContext" $args | nindent 12 }}
          env:
            - name: INJECTOR_PORT
              value: {{ $injector.port | quote }}
            {{- /* The frontend container over loopback; index.html by name says what is being fetched. */}}
            - name: SHELL_URL
              value: {{ printf "http://127.0.0.1:%v/index.html" .Values.frontend.service.port | quote }}
            {{- /* The BFF Service, not Traefik: the lookup stays in the namespace and passes neither the rate
               limiter nor the security headers. */}}
            - name: BFF_URL
              value: {{ printf "http://%s:%v" (include "event-junkie.componentName" (dict "ctx" $ "component" "bff")) .Values.bff.service.port | quote }}
            - name: BFF_TIMEOUT_MS
              value: {{ $injector.bffTimeoutMs | quote }}
          ports:
            - name: injector
              containerPort: {{ $injector.port }}
          startupProbe:
            httpGet:
              path: /healthz
              port: injector
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: injector
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: injector
            periodSeconds: 10
          resources:
            {{- toYaml $injector.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.ingress.noindex }}
        - name: seo
          configMap:
            name: {{ printf "%s-seo" (include "event-junkie.fullname" $) }}
        {{- end }}
      {{- with .Values.frontend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
