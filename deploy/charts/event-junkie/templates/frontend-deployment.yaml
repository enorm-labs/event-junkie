{{- $args := dict "ctx" $ "component" "frontend" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "event-junkie.componentName" $args }}
  annotations:
    kubernetes.io/description: >-
      The web app, served as static files by nginx on 8080. Not 80: the pod runs non-root and cannot bind a privileged port.
  labels:
    {{- include "event-junkie.labels" $args | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "event-junkie.selectorLabels" $args | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "event-junkie.labels" $args | nindent 8 }}
      {{- if or .Values.frontend.podAnnotations .Values.ingress.noindex }}
      annotations:
        {{- if .Values.ingress.noindex }}
        {{- /* Same job as the BFF's `checksum/config`, for a sharper reason. A `subPath` mount is a
               point-in-time copy: unlike a whole-volume ConfigMap mount the kubelet never refreshes
               it, so editing the SEO ConfigMap changes the object and NOT the bytes nginx serves —
               not eventually, not after the sync period, not at all until the pod restarts for some
               unrelated reason. This makes the pod template change with the content, so the rollout
               is what applies it.

               Conditional, unlike the BFF's, because the ConfigMap it hashes does not exist in
               production — an unconditional one would render the sha256 of an empty string there
               and invite somebody to wonder what it was checksumming. */}}
        checksum/seo: {{ include (print $.Template.BasePath "/frontend-seo-configmap.yaml") $ | sha256sum }}
        {{- end }}
        {{- with .Values.frontend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "event-junkie.serviceAccountName" $args }}
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "event-junkie.podSecurityContext" $args | nindent 8 }}
      containers:
        - name: frontend
          image: {{ include "event-junkie.image" $args | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "event-junkie.containerSecurityContext" $args | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.service.port }}
          {{- /* nginx serves a static bundle: there is no application health endpoint to ask, and
                 `/` is the only thing that proves it is serving. A HEAD on the index is the whole
                 contract. */}}
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          {{- /* One writable path, and only one — verified against the real image in #262 by
                 running it with `--read-only --tmpfs /tmp`.

                 This block used to mount /var/cache/nginx and /var/run as well, on the reasoning
                 that nginx writes its temp files and pid file there and fails at *startup*
                 without them. That is true of the stock `nginx` image and false of the
                 `nginxinc/nginx-unprivileged` one #262 chose: its own nginx.conf sets
                 `pid /tmp/nginx.pid` and redirects every `*_temp_path` into /tmp, overriding the
                 compiled /var/cache/nginx defaults, and it symlinks both logs to /dev/stdout and
                 /dev/stderr. So nothing is written outside /tmp.

                 If the base image ever changes, re-check this before assuming: the failure is at
                 startup, not at first request. */}}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.ingress.noindex }}
            {{- /* Mounted over the built files rather than beside them (#286). `subPath` is what
                   makes that possible: without it this volume would mount as a directory over
                   /usr/share/nginx/html and hide the entire bundle — index.html included — which
                   fails as a blank site rather than as a bad robots.txt.

                   `readOnly` because nothing here writes, and the root filesystem is read-only for
                   the same reason. */}}
            - name: seo
              mountPath: /usr/share/nginx/html/robots.txt
              subPath: robots.txt
              readOnly: true
            - name: seo
              mountPath: /usr/share/nginx/html/sitemap.xml
              subPath: sitemap.xml
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.ingress.noindex }}
        - name: seo
          configMap:
            name: {{ printf "%s-seo" (include "event-junkie.fullname" $) }}
        {{- end }}
      {{- with .Values.frontend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
