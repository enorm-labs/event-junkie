{{- if and .Values.ingress.enabled .Values.ingress.redirectHosts }}
{{- $args := dict "ctx" $ "component" "redirect" }}
{{- /* The first Traefik-specific object in the chart, because there is no portable alternative: the
   Ingress API cannot express a redirect. The /api routing avoided a Middleware (§3.1) because
   that rewrite could live in the application; a redirect from a domain the application never
   sees cannot. Gateway API's RequestRedirect is the portable successor and is not enabled on
   k3s's bundled Traefik. Gated on `ingress.redirectHosts`, so emptying that list leaves nothing
   Traefik-specific in the chart. */}}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ printf "%s-redirect" (include "event-junkie.fullname" $) }}
  labels:
    {{- include "event-junkie.labels" $args | nindent 4 }}
  annotations:
    kubernetes.io/description: >-
      One of five Traefik-specific objects in this chart. The Ingress API cannot express a redirect, so
      every controller does it through its own extension. Gated on ingress.redirectHosts.
spec:
  redirectRegex:
    regex: {{ printf "^https?://[^/]+/(.*)" | quote }}
    replacement: {{ printf "https://%s/${1}" .Values.ingress.host | quote }}
    permanent: true
{{- end }}
