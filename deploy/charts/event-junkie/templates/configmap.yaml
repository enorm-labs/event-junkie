{{- $args := dict "ctx" $ "component" "config" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "event-junkie.fullname" $ }}
  annotations:
    kubernetes.io/description: >-
      Settings that belong to running in a cluster rather than to the application, so they are here and not in each module's application.yaml.
  labels:
    {{- include "event-junkie.labels" $args | nindent 4 }}
{{- /* Settings that belong to running in a cluster, not to the application, so each module's
   application.yaml and the tests keep their single-port behaviour. Consumed with `envFrom`, so
   relaxed binding maps each key onto the property of the same name. `MANAGEMENT_SERVER_PORT` is
   per-component in values and deliberately not here: one source of truth per number. */}}
data:
  # Spring Boot enables the liveness/readiness health groups on its own once it detects Kubernetes.
  # Set explicitly because a probe path that exists only by autodetection is a probe path that
  # disappears the day the detection stops working.
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  {{- /* MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE is deliberately absent (#538). It used to restate
     `health,info` from application.yaml, and because envFrom becomes an environment variable that
     outranks application.yaml, adding `prometheus` in #535 left the endpoint at 404 in every cluster
     while every test passed. Which endpoints exist is a property of the application, not of the
     cluster, and the management port is unroutable anyway (`ingress_test.yaml`, PLATFORM_SETUP.md §7).
     `invariants_test.yaml` fails the build if this key comes back. */}}
  # The banner is six lines of ASCII art at the top of every container log, repeated on every
  # restart. Harmless locally, pure noise in an aggregated log.
  SPRING_MAIN_BANNER_MODE: "off"
  {{- /* Structured logs, and here rather than application.yaml because a terminal wants Spring's console
     layout and an aggregated log store wants fields: envFrom outranks application.yaml, so this is
     container-only by construction, the same precedence that bit in #538 used on purpose. ECS because
     Spring Boot copies every MDC entry into the JSON object, which makes `sourceSlug` and
     `importRunId` filterable (#380).

     DELIBERATELY NOT SET: logging.structured.ecs.service.version. `service_version` already arrives
     on every row from the collector's k8sattributes processor, read off the pod's
     `app.kubernetes.io/version` label; a second writer on one field would make the winner depend on
     parser order, and the label is per-pod, so the two versions in a rollout stay distinguishable. */}}
  LOGGING_STRUCTURED_FORMAT_CONSOLE: "ecs"
