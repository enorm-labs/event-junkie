{{- if .Values.tests.enabled }}
{{- $args := dict "ctx" $ "component" "test" }}
{{- $bff := include "event-junkie.componentName" (dict "ctx" $ "component" "bff") }}
{{- $frontend := include "event-junkie.componentName" (dict "ctx" $ "component" "frontend") }}
{{- /* `helm test` only: reaching the two public workloads through their Services is the cheapest
   thing that distinguishes "the pods are Running" from "the release serves". #414 wires Flux's
   `test.enable` and rollback to this hook. Deliberately does NOT touch the importer: a test pod
   that can reach /api/admin/** has just demonstrated the admin API is reachable from an
   unprivileged pod. */}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ printf "%s-connection-test" (include "event-junkie.fullname" $) }}
  labels:
    {{- include "event-junkie.labels" $args | nindent 4 }}
  annotations:
    helm.sh/hook: test
    {{- /* Deleted before the next test run rather than after this one, so a failed test leaves its
       pod behind for `kubectl logs`. */}}
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  {{- /* Taken from `security.runAsUser` even though this pod runs a curl image: two literals here
     would be a fourth place the UID can drift, and the one place `scripts/uid-consistency.sh`
     cannot check, since a test pod has no Dockerfile to compare with. */}}
  securityContext:
    runAsNonRoot: true
    runAsUser: {{ .Values.security.runAsUser }}
    runAsGroup: {{ .Values.security.runAsGroup }}
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: connection-test
      image: {{ printf "%s/%s:%s" .Values.tests.image.registry .Values.tests.image.repository .Values.tests.image.tag | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext:
        {{- include "event-junkie.containerSecurityContext" $args | nindent 8 }}
      command:
        - /bin/sh
        - -c
        - |
          set -eu
          # BOTH CURLS RETRY, AND THE REASON IS A MEASURED RACE (#416). This pod's first packet can leave
          # before the CNI has programmed the NetworkPolicy rules that permit it — k3s populates its ipsets
          # from pod labels asynchronously, and a hook pod running curl as its entrypoint connects milliseconds
          # after starting: on k3d the first attempt failed with `curl: (7) … after 0 ms`, the retry two
          # seconds later returned 200. Flux runs this hook with `remediateLastFailure: true`, so a flake
          # **rolls back a deploy that was fine**. `--retry-all-errors` alongside `--retry-connrefused`: a
          # packet dropped by a policy is not a refused connection.
          probe() {
            curl --fail --silent --show-error --output /dev/null --max-time 10 \
              --retry 10 --retry-delay 2 --retry-all-errors --retry-connrefused "$1"
          }
          # The BFF's readiness endpoint on the management port — reachable in-cluster, unroutable from outside.
          probe "http://{{ $bff }}:{{ .Values.bff.service.managementPort }}/actuator/health/readiness"
          # The frontend's index: a static bundle has no health endpoint; serving / is the contract.
          probe "http://{{ $frontend }}:{{ .Values.frontend.service.port }}/"
          echo "connection test passed"
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
{{- end }}
