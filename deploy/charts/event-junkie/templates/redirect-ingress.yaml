{{- if and .Values.ingress.enabled .Values.ingress.redirectHosts }}
{{- $args := dict "ctx" $ "component" "redirect" }}
{{- $frontend := include "event-junkie.componentName" (dict "ctx" $ "component" "frontend") }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ printf "%s-redirect" (include "event-junkie.fullname" $) }}
  labels:
    {{- include "event-junkie.labels" $args | nindent 4 }}
  annotations:
    kubernetes.io/description: >-
      301s the redirect domains to ingress.host. Separate from the main Ingress so a redirect domain
      failing certificate validation cannot take the primary certificate down with it.
    {{- if .Values.ingress.tls.enabled }}
    {{- /* Its own certificate, listing the redirect hosts explicitly: a wildcard would cover names
       nobody decided to serve, and only DNS-01 can issue one. Separate from the main certificate
       so a redirect domain failing validation cannot take the primary down with it. */}}
    cert-manager.io/cluster-issuer: {{ .Values.certManager.clusterIssuer.name | quote }}
    {{- end }}
    {{- /* `<namespace>-<name>@kubernetescrd` is Traefik's cross-namespace reference format; the
       namespace is `.Release.Namespace` because Flux's HelmRelease sets `targetNamespace`. */}}
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-%s-redirect@kubernetescrd" .Release.Namespace (include "event-junkie.fullname" $) | quote }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        {{- range .Values.ingress.redirectHosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ printf "%s-redirect" .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    {{- range .Values.ingress.redirectHosts }}
    - host: {{ . | quote }}
      http:
        paths:
          {{- /* A backend is required by the Ingress schema although the middleware answers first. The
             frontend is the least surprising: without the middleware this degrades to serving the site
             on the second domain rather than to a 502. */}}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $frontend }}
                port:
                  name: http
    {{- end }}
{{- end }}
