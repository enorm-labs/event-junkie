{{- $args := dict "ctx" $ "component" "frontend" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "event-junkie.componentName" $args }}
  annotations:
    kubernetes.io/description: >-
      Static file server for the SPA.
  labels:
    {{- include "event-junkie.labels" $args | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
  selector:
    {{- include "event-junkie.selectorLabels" $args | nindent 4 }}
