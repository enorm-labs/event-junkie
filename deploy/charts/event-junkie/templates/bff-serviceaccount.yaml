{{- if .Values.bff.serviceAccount.create }}
{{- $args := dict "ctx" $ "component" "bff" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "event-junkie.serviceAccountName" $args }}
  labels:
    {{- include "event-junkie.labels" $args | nindent 4 }}
{{- /* No workload in this chart talks to the Kubernetes API, so no token is mounted and there is no
       Role to bind — which is also why the chart has no `rbac.create` knob. An empty toggle would
       imply a permission model that does not exist. */}}
automountServiceAccountToken: false
{{- end }}
