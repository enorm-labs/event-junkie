{{- if .Values.bff.serviceAccount.create }}
{{- $args := dict "ctx" $ "component" "bff" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "event-junkie.serviceAccountName" $args }}
  labels:
    {{- include "event-junkie.labels" $args | nindent 4 }}
{{- /* No workload here talks to the Kubernetes API, so no token is mounted and there is no Role to
   bind, which is why there is no `rbac.create` knob either. */}}
automountServiceAccountToken: false
{{- end }}
