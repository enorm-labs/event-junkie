# comment-lint: allow-file 33 overrides, each of which is a deviation from production that needs its reason.
# k3d overrides for the local rehearsal (#263): `--port "8080:80@loadbalancer"`, images side-loaded
# with `k3d image import`, PostgreSQL on the host in the compose stack. **The database port and name
# cannot be checked by rendering** — compare the rendered URL against `compose.yaml` before installing.

image:
  # Side-loaded with `k3d image import`, so no registry. The `localhost/` prefix is not the thing to
  # suspect on an ImagePullBackOff: with `IfNotPresent` the kubelet never resolves it.
  registry: "localhost"
  # IfNotPresent is what makes a side-loaded image win; `Always` would ask a registry that lacks it.
  pullPolicy: "IfNotPresent"

database:
  # k3d's built-in name for the host from inside the cluster, injected into CoreDNS at cluster-create time.
  host: "host.k3d.internal"
  # The container listens on 5432; compose publishes it on the *host* as 56298.
  port: 56298
  # A database of its own, NOT the `event_junkie` that `bootRun` uses: installing this chart runs
  # Flyway, and two importers on one schema is the ADR-008 failure. `events` is the *schema* inside
  # it. Created once:
  #
  #     docker exec event-junkie-postgres-1 psql -U admin -d postgres -c 'CREATE DATABASE event_junkie_k3d OWNER admin'
  name: "event_junkie_k3d"
  # Created before the first install:
  #   kubectl create secret generic events-db \
  #     --from-literal=username=events --from-literal=password=events
  existingSecret: "events-db"

bff:
  replicaCount: 1
  image:
    repository: "event-junkie/bff"
    # Not `.Chart.AppVersion` (a local build has no release version) and not `latest` (the assertions
    # reject a floating tag, and `latest` is how a laptop debugs yesterday's build).
    tag: "dev"

importer:
  image:
    repository: "event-junkie/importer"
    tag: "dev"

frontend:
  replicaCount: 1
  image:
    repository: "event-junkie/frontend"
    tag: "dev"
  injector:
    image:
      repository: "event-junkie/injector"
      tag: "dev"

ingress:
  # k3d ships the same Traefik k3s does, so the ingress path is exercised. `.localhost` resolves to
  # 127.0.0.1 without a hosts entry.
  host: "event-junkie.localhost"
  redirectHosts: []
  # Non-production configuration, and the point: it makes /k3d-rehearsal fetch the overridden
  # `robots.txt` and `sitemap.xml` over a real Traefik route — the only place #286's `subPath` mount
  # can be proven outside the tunnel.
  noindex: true
  tls:
    # No TLS, therefore no cert-manager: the rehearsal is about whether the workloads start and route,
    # not about ACME against a name that does not exist.
    enabled: false
  # The nightly ZAP active scan runs through this Traefik, to exercise the middlewares, and a fuzzer
  # spends requests far faster than a visitor. At the chart's 50/s it crossed the limiter and rule
  # 40018 read the 429s as an injected expression (#1746). The middleware still renders and still
  # applies; only its ceiling moves, and the numbers a visitor meets are proven by `perf/ratelimit.js`
  # against staging and production.
  rateLimit:
    perSource:
      average: 5000
      burst: 10000

certManager:
  clusterIssuer:
    # Nothing to create: with `tls.enabled: false` no annotation references an issuer, and a
    # ClusterIssuer would fail the install on an unknown kind.
    create: false

# The rehearsal's PostgreSQL is on the host, reached through `host.k3d.internal` — an address k3d
# assigns at cluster-create time, so `0.0.0.0/0` stands in and the rule still constrains the **port**.
# Weaker than the /32 the real environments set, and the one policy the rehearsal cannot prove tight.
networkPolicy:
  databaseCidr: "0.0.0.0/0"
# The smoke hook (#1697) is off in the chart and on here, so `k3d-rehearsal.sh test` proves the
# route — the test pod, through Traefik's container port, to the BFF and the SPA — before a cluster
# that rolls back on a failed hook ever runs it. Plain HTTP, since TLS is off above.
tests:
  smoke:
    enabled: true
