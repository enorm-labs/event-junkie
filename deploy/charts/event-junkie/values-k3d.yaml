# k3d overrides for the local rehearsal (#263): k3d with `--port "8080:80@loadbalancer"`, images
# side-loaded with `k3d image import`, PostgreSQL on the host in the repository's own compose stack.
# The full loop is in docs/DEVELOPMENT.md.
#
# **The database port and name cannot be checked by rendering the chart.** Both are valid whatever
# they are, and nothing in the chart knows what is actually listening — compare the rendered URL
# against `compose.yaml` before installing.

image:
  # Images are side-loaded with `k3d image import`, so there is no registry to pull from. The
  # `localhost/` prefix is **not** the thing to suspect on an ImagePullBackOff here: with
  # `IfNotPresent` the kubelet finds the imported image and never resolves the prefix at all.
  registry: "localhost"
  # IfNotPresent is what makes a side-loaded image win. `Always` would send k3d to a registry that
  # does not have it and fail with ImagePullBackOff.
  pullPolicy: "IfNotPresent"

database:
  # PostgreSQL runs on the host, in the same compose stack local development already uses.
  # `host.k3d.internal` is k3d's built-in name for the host from inside the cluster, injected into
  # CoreDNS when the cluster is created.
  host: "host.k3d.internal"
  # The container listens on 5432; compose publishes it on the *host* as 56298, and the host is what
  # `host.k3d.internal` resolves to.
  port: 56298
  # A database of its own, NOT the `event_junkie` that `bootRun` and `scripts/dev-env.sh` use.
  # Installing this chart runs the importer's Flyway migrations, so pointing it at the development
  # database would have two importers competing for one schema — over thousands of scraped rows
  # nobody wants to re-scrape (ADR-007 on politeness). Create it once:
  #
  #     docker exec event-junkie-postgres-1 psql -U admin -d postgres -c 'CREATE DATABASE event_junkie_k3d OWNER admin'
  #
  # `events` is the *schema* inside it, which each app sets itself via
  # `spring.r2dbc.properties.schema` — the two are different things and the chart's `database.name`
  # is the database.
  name: "event_junkie_k3d"
  # Created before the first install:
  #   kubectl create secret generic events-db \
  #     --from-literal=username=events --from-literal=password=events
  existingSecret: "events-db"

bff:
  replicaCount: 1
  image:
    repository: "event-junkie/bff"
    # A tag that is not `.Chart.AppVersion`, because a locally-built image has no release version.
    # Not `latest`: the render assertions reject floating tags, and the reason they exist applies to
    # a laptop too — `latest` is how you spend an afternoon debugging yesterday's build.
    tag: "dev"

importer:
  image:
    repository: "event-junkie/importer"
    tag: "dev"

frontend:
  replicaCount: 1
  image:
    repository: "event-junkie/frontend"
    tag: "dev"

ingress:
  # k3d ships the same Traefik k3s does, so the ingress path is genuinely exercised. `.localhost`
  # resolves to 127.0.0.1 without a hosts entry on every current browser and OS.
  host: "event-junkie.localhost"
  redirectHosts: []
  # Non-production configuration, and the point rather than a formality: it makes /k3d-rehearsal
  # fetch the overridden `robots.txt` and `sitemap.xml` over a real Traefik route, the only place
  # #286's `subPath` mount can be proven outside the tunnel. A render assertion cannot tell you
  # nginx served the mounted file rather than the one baked into the image.
  noindex: true
  tls:
    # No TLS, and therefore no cert-manager: the rehearsal is about whether the workloads start,
    # reach the database and route to each other. Certificate issuance would mean installing
    # cert-manager into k3d and debugging ACME against a name that does not exist.
    enabled: false

certManager:
  clusterIssuer:
    # Nothing to create: with `tls.enabled: false` no annotation references an issuer, and k3d has
    # no cert-manager installed — a ClusterIssuer here would fail the install on an unknown kind.
    create: false

# The rehearsal's PostgreSQL runs in a Docker container on the host, reached through
# `host.k3d.internal` — an address k3d assigns at cluster-create time and writes into CoreDNS, so it
# is not knowable when this file is written. `0.0.0.0/0` therefore stands in for it here, and the
# rule still constrains the **port**: the two JVM services may open 5432 anywhere and nothing else.
#
# That is weaker than the /32 the real environments set, and it is the one policy the rehearsal
# cannot prove tight. Everything else in the set — default-deny, DNS, the ingress controller's two
# ports, the importer's internet egress, the test hook's pair — is exercised exactly as deployed.
networkPolicy:
  databaseCidr: "0.0.0.0/0"
