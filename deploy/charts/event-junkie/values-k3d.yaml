# k3d overrides, for the local rehearsal in #263.
#
# Written blind in #261 and corrected in #263, which ran it. Two of its guesses were wrong — the
# database port and the database name — and neither could have been caught by rendering the chart,
# because both were valid values that simply did not match what was listening. See the comments on
# each below; they are the record of what a blind file costs.
#
# The rehearsal it supports: k3d with `--port "8080:80@loadbalancer"`, images side-loaded with
# `k3d image import`, PostgreSQL on the host in the repository's own compose stack. The full loop is
# in docs/DEVELOPMENT.md.

image:
  # Images are side-loaded into the k3d cluster with `k3d image import`, so there is no registry to
  # pull from. #263 expected the `localhost/` prefix to be the problem — a registry-shaped prefix
  # that containerd might try to resolve as a remote host — and it was not: with `IfNotPresent` the
  # kubelet finds the imported image and never reaches out. Recorded because it is the obvious thing
  # to suspect when a pod does go ImagePullBackOff here, and it is not the cause.
  registry: "localhost"
  # IfNotPresent is what makes a side-loaded image win. `Always` would send k3d to a registry that
  # does not have it and fail with ImagePullBackOff.
  pullPolicy: "IfNotPresent"

database:
  # PostgreSQL runs on the host, in the same compose stack local development already uses.
  # `host.k3d.internal` is k3d's built-in name for the host from inside the cluster, injected into
  # CoreDNS when the cluster is created.
  host: "host.k3d.internal"
  # Both of these were wrong while this file was written blind, and neither could have been caught
  # by rendering the chart — `5432` and `events` are perfectly valid values, and nothing in the
  # chart knows what is actually listening. Found by comparing the rendered URL against
  # `compose.yaml` before the first install (#263).
  #
  # The container listens on 5432; compose publishes it on the *host* as 56298, and the host is what
  # `host.k3d.internal` resolves to.
  port: 56298
  # A database of its own, NOT the `event_junkie` that `bootRun` and `scripts/dev-env.sh` use.
  # Installing this chart runs the importer's Flyway migrations, and pointing that at the local
  # development database would have the in-cluster importer and a local one competing for the same
  # schema — with ~86 sources and thousands of scraped rows behind it that nobody wants to re-scrape
  # (ADR-007 on politeness). Create it once:
  #
  #     docker exec event-junkie-postgres-1 psql -U admin -d postgres -c 'CREATE DATABASE event_junkie_k3d OWNER admin'
  #
  # `events` is the *schema* inside it, which each app sets itself via
  # `spring.r2dbc.properties.schema` — the two are different things and the chart's `database.name`
  # is the database.
  name: "event_junkie_k3d"
  # Created before the first install:
  #   kubectl create secret generic events-db \
  #     --from-literal=username=events --from-literal=password=events
  existingSecret: "events-db"

bff:
  replicaCount: 1
  image:
    repository: "event-junkie/bff"
    # A tag that is not `.Chart.AppVersion`, because a locally-built image has no release version.
    # Not `latest`: the render assertions reject floating tags, and the reason they exist applies to
    # a laptop too — `latest` is how you spend an afternoon debugging yesterday's build.
    tag: "dev"

importer:
  image:
    repository: "event-junkie/importer"
    tag: "dev"

frontend:
  replicaCount: 1
  image:
    repository: "event-junkie/frontend"
    tag: "dev"

ingress:
  # k3d ships the same Traefik k3s does, so the ingress path is genuinely exercised. `.localhost`
  # resolves to 127.0.0.1 without a hosts entry on every current browser and OS.
  host: "event-junkie.localhost"
  redirectHosts: []
  # The rehearsal is not production either, so it gets the non-production configuration — and that
  # is the point rather than a formality: it makes /k3d-rehearsal fetch the overridden `robots.txt`
  # and `sitemap.xml` over a real Traefik route, which is the only place the `subPath` mount in
  # #286 can be proven outside the tunnel. A render assertion cannot tell you that nginx served
  # the mounted file rather than the one baked into the image.
  noindex: true
  tls:
    # No TLS, and therefore no cert-manager: the rehearsal is about whether the workloads start,
    # reach the database and route to each other. Adding certificate issuance to that would mean
    # installing cert-manager into k3d and debugging ACME against a name that does not exist. Plain
    # HTTP over a loopback address costs nothing and tests the same routing.
    enabled: false

certManager:
  clusterIssuer:
    # Nothing to create: with `tls.enabled: false` no annotation references an issuer, and k3d has
    # no cert-manager installed — a ClusterIssuer here would fail the install on an unknown kind.
    create: false

# The rehearsal's PostgreSQL runs in a Docker container on the host, reached through
# `host.k3d.internal` — an address k3d assigns at cluster-create time and writes into CoreDNS, so it
# is not knowable when this file is written. `0.0.0.0/0` therefore stands in for it here, and the
# rule still constrains the **port**: the two JVM services may open 5432 anywhere and nothing else.
#
# That is weaker than the /32 the real environments set, and it is the one policy the rehearsal
# cannot prove tight. Everything else in the set — default-deny, DNS, the ingress controller's two
# ports, the importer's internet egress, the test hook's pair — is exercised exactly as deployed.
networkPolicy:
  databaseCidr: "0.0.0.0/0"
