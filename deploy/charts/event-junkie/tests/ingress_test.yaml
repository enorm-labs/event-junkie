# The ingress must not reach anything private, and the noindex mechanism must not render half of
# itself. The importer has no Ingress backend and actuator lives on a port no rule names; both are
# one careless path entry from false, and neither failure is visible in a diff.
suite: ingress routing, noindex and rate limiting

templates:
  - ingress.yaml
  - redirect-ingress.yaml
  - noindex-middleware.yaml
  - redirect-middleware.yaml
  - rate-limit-middleware.yaml

tests:
  - it: routes /api to the BFF and / to the frontend, and nothing else
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
    documentSelector:
      path: kind
      value: Ingress
      matchMany: true
    asserts:
      # Positive and exhaustive rather than a list of absences: naming the two paths that may exist covers
      # everything nobody has thought of yet, and cannot pass vacuously.
      - equal:
          path: "$..http.paths[*].pathType"
          value: Prefix
      - matchRegex:
          path: "$..http.paths[*].path"
          pattern: "^(/api|/)$"
      # No backend names the importer.
      - matchRegex:
          path: "$..backend.service.name"
          pattern: "^RELEASE-NAME-event-junkie-(bff|frontend)$"
      # Actuator is private because it is on its own port. Every backend names the `http` port;
      # `management` is never named, and because backends name ports rather than numbering them, 9001
      # cannot appear either.
      - equal:
          path: "$..backend.service.port.name"
          value: http
      - notExists:
          path: "$..backend.service.port.number"

  - it: routes the same way under values-k3d.yaml
    values:
      - ../values-k3d.yaml
    documentSelector:
      path: kind
      value: Ingress
      matchMany: true
    asserts:
      - matchRegex:
          path: "$..http.paths[*].path"
          pattern: "^(/api|/)$"
      - matchRegex:
          path: "$..backend.service.name"
          pattern: "^RELEASE-NAME-event-junkie-(bff|frontend)$"
      - equal:
          path: "$..backend.service.port.name"
          value: http

  # --- the redirect hosts -----------------------------------------------------------------------
  # `redirectHosts` is a list that behaves like a scalar — production lists three names, staging and
  # k3d none — so the `range` needs a multi-entry case to be exercised at all (#634). **Named hosts are
  # set here rather than taken from values**: `cluster-assertions.sh` re-runs this against every
  # cluster, where staging and k3d set `redirectHosts: []`.
  - it: gives every redirect host a rule and a SAN on one certificate of its own
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      ingress.enabled: true
      ingress.tls.enabled: true
      ingress.host: "canonical.example"
      ingress.redirectHosts:
        - "first.example"
        - "second.example"
        - "third.example"
    template: redirect-ingress.yaml
    asserts:
      - lengthEqual:
          path: spec.rules
          count: 3
      - lengthEqual:
          path: spec.tls[0].hosts
          count: 3
      # One certificate covering all of them, and **not** the primary's Secret: a redirect domain failing
      # validation cannot take the main certificate down only while these are two Secrets.
      - lengthEqual:
          path: spec.tls
          count: 1
      - matchRegex:
          path: spec.tls[0].secretName
          pattern: "-redirect$"

  - it: sends every redirect host to the canonical host, not to itself
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      ingress.enabled: true
      ingress.host: "canonical.example"
      ingress.redirectHosts:
        - "first.example"
        - "second.example"
    template: redirect-middleware.yaml
    asserts:
      # One Middleware for the whole list, because the regex matches any host. A per-host replacement is
      # the bug this guards: a name 301ing to itself renders perfectly and only fails in a browser.
      - hasDocuments:
          count: 1
      - equal:
          path: spec.redirectRegex.replacement
          value: "https://canonical.example/${1}"
      - equal:
          path: spec.redirectRegex.permanent
          value: true

  # --- noindex is a two-part mechanism, and half of it is silent -------------------------------
  # The header needs a Middleware and an Ingress annotation naming it. Only the Middleware: every
  # response lacks the header while the manifest looks correct — a staging environment that believes
  # it is noindexed. Only the annotation: Traefik drops the route. Production renders neither half, and
  # that is as much the invariant as staging rendering both.
  - it: renders neither half of noindex when it is off, as production has it
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      ingress.noindex: false
    templates:
      - noindex-middleware.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: names no noindex middleware on the ingress when it is off
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      ingress.noindex: false
    templates:
      - ingress.yaml
    asserts:
      - notMatchRegex:
          path: metadata.annotations["traefik.ingress.kubernetes.io/router.middlewares"]
          pattern: "-noindex@kubernetescrd"

  - it: renders both halves of noindex when it is on, as staging has it
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      ingress.noindex: true
    templates:
      - noindex-middleware.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-event-junkie-noindex
      # Never an empty header: `X-Robots-Tag: ""` renders, installs, reports healthy and indexes the environment.
      - equal:
          path: spec.headers.customResponseHeaders["X-Robots-Tag"]
          value: "noindex, nofollow"

  # The annotation is a comma-separated string with no schema, so a stray comma is not a render error —
  # it is a router that silently drops **every** middleware in the list. These pin the whole list (#416).
  - it: names all three middlewares on the ingress when noindex is on, in one well-formed list
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      ingress.noindex: true
    templates:
      - ingress.yaml
    asserts:
      # The rate limit sits after the header middlewares: a 429 travels back out through them (#268).
      - equal:
          path: metadata.annotations["traefik.ingress.kubernetes.io/router.middlewares"]
          value: >-
            NAMESPACE-RELEASE-NAME-event-junkie-security-headers@kubernetescrd,NAMESPACE-RELEASE-NAME-event-junkie-in-flight-req@kubernetescrd,NAMESPACE-RELEASE-NAME-event-junkie-rate-limit@kubernetescrd,NAMESPACE-RELEASE-NAME-event-junkie-noindex@kubernetescrd

  - it: names the security headers and rate limit middlewares in production, where noindex is off
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      ingress.noindex: false
    templates:
      - ingress.yaml
    asserts:
      - equal:
          path: metadata.annotations["traefik.ingress.kubernetes.io/router.middlewares"]
          value: >-
            NAMESPACE-RELEASE-NAME-event-junkie-security-headers@kubernetescrd,NAMESPACE-RELEASE-NAME-event-junkie-in-flight-req@kubernetescrd,NAMESPACE-RELEASE-NAME-event-junkie-rate-limit@kubernetescrd

  # With all three off the annotation must be absent rather than empty.
  - it: omits the annotation entirely when no middleware applies
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      ingress.noindex: false
      ingress.securityHeaders.enabled: false
      ingress.rateLimit.enabled: false
    templates:
      - ingress.yaml
    asserts:
      - notExists:
          path: metadata.annotations["traefik.ingress.kubernetes.io/router.middlewares"]

  # --- the rate limit, which is two limits and therefore two objects ---------------------------
  # `inFlightReq` bounds concurrency by request host; `rateLimit` groups by client address, which the
  # hostPort preserves since #1013. **ONE TYPE PER OBJECT IS THE INVARIANT, AND IT IS NOT A STYLE
  # RULE**: Traefik refuses a Middleware carrying two types (`multi-types middleware not supported`) and
  # drops every router naming it, so the whole site answers 404 — and `helm template`, `helm unittest`
  # and `flux schema validate` all pass the manifest, because the CRD models the types as optional
  # siblings. It took staging down once.
  - it: renders the two limits as two objects, because one object cannot carry both
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
    templates:
      - rate-limit-middleware.yaml
    asserts:
      - hasDocuments:
          count: 2
      # Each document declares exactly one of the two keys; `notExists` on the sibling is the assertion.
      - notExists:
          path: spec.rateLimit
        documentIndex: 0
      - equal:
          path: spec.inFlightReq.amount
          value: 100
        documentIndex: 0
      - notExists:
          path: spec.inFlightReq
        documentIndex: 1
      # Pinned rather than present: a first-time visitor's whole page load has to fit inside these, so a
      # well-meant reduction is the failure this catches. `values.yaml` carries the arithmetic.
      - equal:
          path: spec.rateLimit.average
          value: 50
        documentIndex: 1
      # Traefik's default burst is 1, which nobody means: one view fires several requests together.
      - equal:
          path: spec.rateLimit.burst
          value: 250
        documentIndex: 1
      - equal:
          path: spec.rateLimit.period
          value: "1s"
        documentIndex: 1

  # The escape hatch: an environment whose client address is masqueraded again wants concurrency
  # bounded and the per-source budget gone, not both off.
  - it: drops the per-source object and keeps concurrency when it is turned off
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      ingress.rateLimit.perSource.enabled: false
    templates:
      - rate-limit-middleware.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.inFlightReq.amount
          value: 100
      - notExists:
          path: spec.rateLimit

  # An Ingress may not name a Middleware that was not rendered: Traefik drops the router.
  - it: names no per-source middleware on the ingress when the object is not rendered
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      ingress.rateLimit.perSource.enabled: false
    templates:
      - ingress.yaml
    asserts:
      - matchRegex:
          path: metadata.annotations["traefik.ingress.kubernetes.io/router.middlewares"]
          pattern: "-in-flight-req@kubernetescrd"
      - notMatchRegex:
          path: metadata.annotations["traefik.ingress.kubernetes.io/router.middlewares"]
          pattern: "-rate-limit@kubernetescrd"

  - it: renders neither the middleware nor its reference when the rate limit is off
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      ingress.rateLimit.enabled: false
    templates:
      - rate-limit-middleware.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: names no rate limit middleware on the ingress when it is off
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      ingress.rateLimit.enabled: false
    templates:
      - ingress.yaml
    asserts:
      - notMatchRegex:
          path: metadata.annotations["traefik.ingress.kubernetes.io/router.middlewares"]
          pattern: "-rate-limit@kubernetescrd"
