# What may talk to what, and the headers that come back (#416). **These assert the shape of the
# policy set, not its effect**: no render can prove a packet was dropped. What it can prove is that
# the default-deny exists and selects every pod, that each allowance names the ports it claims, and
# that nothing quietly grew a rule reaching the importer or a management port. The effect is proved
# on k3d. The negatives are phrased against the whole document set, so a *new* policy that opens one
# of these paths fails too.
suite: network policy and response headers

templates:
  - "**/*.yaml"

tests:
  - it: default-deny selects every pod in the namespace, both directions
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-event-junkie-default-deny
    asserts:
      - isKind:
          of: NetworkPolicy
      # An empty podSelector is what covers a debug pod somebody kubectl-runs.
      - equal:
          path: spec.podSelector
          value: {}
      - contains:
          path: spec.policyTypes
          content: Ingress
      - contains:
          path: spec.policyTypes
          content: Egress
      # A deny policy with an `ingress:` or `egress:` list is not a deny policy. The single most
      # consequential assertion in the file.
      - notExists:
          path: spec.ingress
      - notExists:
          path: spec.egress

  - it: the ACME HTTP-01 solver is reachable from the ingress controller
    # Regression guard. cert-manager creates the solver pod itself, so the default-deny caught it and
    # every HTTP-01 challenge failed with `wrong status code '502'` — several steps from anything
    # mentioning a NetworkPolicy, and only production solves HTTP-01. This governs renewal as much as
    # issuance: deleting the policy breaks nothing for sixty days.
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      # Forced: `cluster-assertions.sh` re-runs this against every cluster's values, and k3d turns TLS off.
      ingress.enabled: true
      ingress.tls.enabled: true
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-event-junkie-allow-acme-solver
    asserts:
      - isKind:
          of: NetworkPolicy
      # cert-manager's own label on the pod it creates; selecting anything of ours would match nothing.
      - equal:
          path: spec.podSelector.matchLabels["acme.cert-manager.io/http01-solver"]
          value: "true"
      # 8089 is cert-manager's solver port, not ours to configure.
      - contains:
          path: spec.ingress[0].ports
          content:
            protocol: TCP
            port: 8089

  - it: the ingress controller reaches the service ports and neither management port
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-event-junkie-allow-ingress-controller
    asserts:
      - contains:
          path: spec.ingress[0].ports
          content:
            protocol: TCP
            port: 8080
      # 9001 is the management port, already unroutable; this is the half that makes it unreachable.
      - notContains:
          path: spec.ingress[0].ports
          content:
            protocol: TCP
            port: 9001

  - it: the frontend pod reaches the BFF on its service port, for the meta-injection sidecar, and nothing else
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-event-junkie-allow-frontend-to-bff
    asserts:
      - isKind:
          of: NetworkPolicy
      # Both halves in one object: the frontend's egress and the BFF's ingress from it. One without the
      # other renders and blocks.
      - contains:
          path: spec.policyTypes
          content: Ingress
      - contains:
          path: spec.policyTypes
          content: Egress
      - equal:
          path: spec.egress[0].to[0].podSelector.matchLabels["app.kubernetes.io/component"]
          value: bff
      - equal:
          path: spec.ingress[0].from[0].podSelector.matchLabels["app.kubernetes.io/component"]
          value: frontend
      # The service port alone, as the whole list: the management port must not quietly join it.
      - equal:
          path: spec.egress[0].ports
          value:
            - protocol: TCP
              port: 8080
      - equal:
          path: spec.ingress[0].ports
          value:
            - protocol: TCP
              port: 8080

  - it: turning the sidecar off removes the frontend's route to the BFF with it
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      frontend.injector.enabled: false
    templates:
      - networkpolicy.yaml
    asserts:
      # Against every document, so it is a real negative rather than a selector that finds nothing.
      - notMatchRegex:
          path: metadata.name
          pattern: allow-frontend-to-bff

  - it: only the two JVM services may reach the database, and only on its port
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      # Pinned explicitly because `cluster-assertions.sh` replays this against each cluster, and k3d's
      # PostgreSQL is on a mapped port (56298); without it the assertion is about whichever environment ran
      # last. It failed exactly that way once.
      database.port: 5432
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-event-junkie-allow-database
    asserts:
      - equal:
          path: spec.egress[0].to[0].ipBlock.cidr
          value: "10.0.1.2/32"
      - equal:
          path: spec.egress[0].ports[0].port
          value: 5432
      # The frontend is a static bundle; if it ever appears here, this chart's whole shape is wrong.
      - notContains:
          path: spec.podSelector.matchExpressions[0].values
          content: frontend

  - it: the importer reaches the internet and not the private ranges behind it
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-event-junkie-allow-scraping
    asserts:
      - equal:
          path: spec.egress[0].to[0].ipBlock.cidr
          value: "0.0.0.0/0"
      # The sharpest exclusion, asserted by itself: 169.254.0.0/16 is where a cloud metadata service lives,
      # and this is the one workload that fetches attacker-influenced URLs. Losing it turns a scraper into
      # an SSRF-to-credentials path silently.
      - contains:
          path: spec.egress[0].to[0].ipBlock.except
          content: "169.254.0.0/16"
      - contains:
          path: spec.egress[0].to[0].ipBlock.except
          content: "10.0.0.0/8"
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: importer

  # --- The BFF's route off the cluster (ADR-019) -------------------------------------------------
  # Explicit values throughout: a case relying on a chart default fails the moment an environment
  # overrides it.
  - it: the BFF has no route off the cluster until it serves images
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      images.enabled: true
      images.storage.prefix: "staging"
      images.serving.enabled: false
    templates:
      - networkpolicy.yaml
    asserts:
      # The second workload with internet egress exists for exactly as long as it has a reason to.
      - notMatchRegex:
          path: "$..metadata.name"
          pattern: "allow-object-storage$"

  - it: the BFF reaches Object Storage on 443 and not the private ranges behind it
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      images.enabled: true
      images.storage.prefix: "staging"
      images.serving.enabled: true
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-event-junkie-allow-object-storage
    asserts:
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: bff
      - equal:
          path: spec.egress[0].to[0].ipBlock.cidr
          value: "0.0.0.0/0"
      - contains:
          path: spec.egress[0].to[0].ipBlock.except
          content: "169.254.0.0/16"
      # 443 alone, as the whole list: the importer needs 80 as well and this must not acquire it.
      - equal:
          path: spec.egress[0].ports
          value:
            - protocol: TCP
              port: 443

  - it: nothing anywhere grants ingress to the importer
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
    documentSelector:
      path: kind
      value: NetworkPolicy
      matchMany: true
    asserts:
      # Against every policy rather than a named one. The importer's admin API has no business being
      # reachable by anything.
      - notMatchRegex:
          path: "$..ingress[*].from[*].podSelector.matchLabels['app.kubernetes.io/component']"
          pattern: "^importer$"
      - notMatchRegex:
          path: "$..ingress[*].from[*].podSelector.matchExpressions[*].values[*]"
          pattern: "^importer$"

  # Scoped by template rather than documentSelector: a selector matching nothing reports "document not
  # found", an error rather than the count of zero this case asserts.
  - it: turning the policies off removes every one of them
    set:
      database.host: "10.0.1.2"
      database.existingSecret: "events-db"
      networkPolicy.enabled: false
    templates:
      - networkpolicy.yaml
    asserts:
      - hasDocuments:
          count: 0

  # --- Response headers -------------------------------------------------------------------------

  - it: the security headers middleware sets the four it always sent, and none of the ones that are wrong to set
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-event-junkie-security-headers
    asserts:
      - isKind:
          of: Middleware
      - equal:
          path: spec.headers.stsSeconds
          value: 31536000
      - equal:
          path: spec.headers.stsIncludeSubdomains
          value: true
      # Preload takes months to withdraw and needs a submission outside this chart; off by default is the
      # decision, held here.
      - equal:
          path: spec.headers.stsPreload
          value: false
      # Traefik would send HSTS over plaintext with this on; browsers ignore it there, and it is wrong on
      # the ACME http-01 path.
      - equal:
          path: spec.headers.forceSTSHeader
          value: false
      - equal:
          path: spec.headers.contentTypeNosniff
          value: true
      - equal:
          path: spec.headers.frameDeny
          value: true
      - equal:
          path: spec.headers.referrerPolicy
          value: strict-origin-when-cross-origin
      # The two the first ZAP baseline found missing (#1442); Traefik has a field for one and none for the
      # other.
      - equal:
          path: spec.headers.permissionsPolicy
          value: camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()
      - equal:
          path: spec.headers.customResponseHeaders["Cross-Origin-Resource-Policy"]
          value: same-origin
      # The other two of ZAP's site-isolation trio (#1464). `credentialless`, because with image serving
      # off every image is a venue's URL without a CORP header.
      - equal:
          path: spec.headers.customResponseHeaders["Cross-Origin-Embedder-Policy"]
          value: credentialless
      - equal:
          path: spec.headers.customResponseHeaders["Cross-Origin-Opener-Policy"]
          value: same-origin
      # X-XSS-Protection is removed from every current browser and its last implementations introduced
      # vulnerabilities; this says so in a place that fails.
      - notExists:
          path: spec.headers.browserXssFilter

  # The policy is report-only by default, and `img-src` is derived (#846). Both are ways to blank a live
  # site: an enforced policy nobody watched in a browser, and a strict `img-src` on a deployment still
  # handing out venue URLs.
  - it: the content security policy reports rather than blocks, and permits venue images while serving is off
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      # Forced: staging serves cached images, and this case asserts the serving-off policy.
      images.serving.enabled: false
      # Forced: staging enforces the policy since #854, and this case is about the report-only header.
      ingress.securityHeaders.contentSecurityPolicy.reportOnly: true
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-event-junkie-security-headers
    asserts:
      - notExists:
          path: spec.headers.contentSecurityPolicy
      - matchRegex:
          path: spec.headers.contentSecurityPolicyReportOnly
          pattern: "img-src 'self' https:$"
      # The hash allows the theme script in events-frontend/index.html; a policy that lost it renders and
      # drops the site to a light-mode flash on every load.
      - matchRegex:
          path: spec.headers.contentSecurityPolicyReportOnly
          pattern: "script-src 'self' 'sha256-[A-Za-z0-9+/]+='"
      - matchRegex:
          path: spec.headers.contentSecurityPolicyReportOnly
          pattern: "^default-src 'self';"

  # The other half of the switch: `serving.enabled` swaps where images come from, and a policy still
  # naming `https:` would keep permitting the venues' servers — the disclosure ADR-019 removes.
  - it: the content security policy stops permitting venue images once serving is on
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      images.enabled: true
      images.storage.prefix: "test"
      images.serving.enabled: true
      # Forced: the case is about `img-src`, not which header carries it.
      ingress.securityHeaders.contentSecurityPolicy.reportOnly: true
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-event-junkie-security-headers
    asserts:
      - matchRegex:
          path: spec.headers.contentSecurityPolicyReportOnly
          pattern: "img-src 'self'$"

  - it: turning report-only off enforces it, and serving our own images narrows img-src to self
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      images.serving.enabled: true
      ingress.securityHeaders.contentSecurityPolicy.reportOnly: false
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-event-junkie-security-headers
    asserts:
      - notExists:
          path: spec.headers.contentSecurityPolicyReportOnly
      - matchRegex:
          path: spec.headers.contentSecurityPolicy
          pattern: "img-src 'self'$"

  # The rest of the middleware has to survive it, because the policy is the one header a deployment
  # might switch off in a hurry.
  - it: turning the policy off leaves the other headers alone
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      ingress.securityHeaders.contentSecurityPolicy.enabled: false
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-event-junkie-security-headers
    asserts:
      - notExists:
          path: spec.headers.contentSecurityPolicy
      - notExists:
          path: spec.headers.contentSecurityPolicyReportOnly
      - equal:
          path: spec.headers.contentTypeNosniff
          value: true

  # --- Metrics scraping (#271) --------------------------------------------------------------------
  # The rule that makes the meters reachable. Its absence is silent: the pods stay healthy, the
  # collector finds them, every scrape is refused.
  - it: allows the collector namespace to reach the management ports
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
    templates:
      - templates/networkpolicy.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-event-junkie-allow-metrics-scrape
    asserts:
      - equal:
          path: spec.policyTypes
          value: [Ingress]
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: observability
      # Both management ports and nothing else.
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 9001
      - notExists:
          path: spec.ingress[0].from[0].ipBlock

  # The escape hatch, asserted so it cannot rot: it exists for the cross-node case a single-node
  # cluster never exercises.
  - it: switches to an ipBlock when the mode says so
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      networkPolicy.metricsScrape.mode: ipBlock
      networkPolicy.metricsScrape.cidr: "10.42.0.0/16"
    templates:
      - templates/networkpolicy.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-event-junkie-allow-metrics-scrape
    asserts:
      - equal:
          path: spec.ingress[0].from[0].ipBlock.cidr
          value: "10.42.0.0/16"
      - notExists:
          path: spec.ingress[0].from[0].namespaceSelector

  # --- The smoke hook's route to the ingress controller (#1697) ----------------------------------
  # Egress only: the return half, Traefik into the two workloads, is `-allow-ingress-controller` and
  # exists whether or not the hook does. The pod ports, because policy sees the packet after DNAT.
  - it: the smoke hook reaches the ingress controller on its container ports and nothing else
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      tests.smoke.enabled: true
    templates:
      - templates/networkpolicy.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-event-junkie-allow-smoke-hook-to-ingress
    asserts:
      - equal:
          path: spec.policyTypes
          value: [Egress]
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: test
      - equal:
          path: spec.egress[0].to[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: kube-system
      - equal:
          path: spec.egress[0].to[0].podSelector.matchLabels["app.kubernetes.io/name"]
          value: traefik
      # Traefik's container ports, not the Service's 80 and 443, and no node address.
      - equal:
          path: spec.egress[0].ports
          value:
            - protocol: TCP
              port: 8000
            - protocol: TCP
              port: 8443
      - notExists:
          path: spec.egress[0].to[0].ipBlock

  - it: turning the smoke hook off removes its route with it
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      tests.smoke.enabled: false
    templates:
      - templates/networkpolicy.yaml
    asserts:
      - notMatchRegex:
          path: "$..metadata.name"
          pattern: "allow-smoke-hook-to-ingress$"
