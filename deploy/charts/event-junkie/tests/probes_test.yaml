# Probe semantics (ADR-018). One `event-junkie.jvmProbes` serves two services whose readiness means
# different things — what `/actuator/health/readiness` *contains* is each module's `application.yaml`
# — so this suite pins the chart's half: paths, ports, and the two numbers the decision leans on.
# **If an assertion fails, read ADR-018 before changing the number**: `periodSeconds ×
# failureThreshold` is the ~30 seconds of sustained failure between a PostgreSQL hiccup and every BFF
# replica draining at once. The frontend is absent: nginx has no actuator and its probes are inline.
suite: probe semantics

# `configmap.yaml` is here and not optional: both Deployments include it for `checksum/config`, and
# helm-unittest renders only what a suite lists. `documentSelector` keeps the assertions on the two
# Deployments.
templates:
  - bff-deployment.yaml
  - importer-deployment.yaml
  - configmap.yaml

tests:
  - it: both JVM workloads probe the actuator on the management port
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
    documentSelector:
      path: kind
      value: Deployment
      matchMany: true
    asserts: &probes
      # --- Readiness: "can this pod serve?" ----------------------------------------------------
      - equal:
          path: spec.template.spec.containers[*].readinessProbe.httpGet.path
          value: /actuator/health/readiness
      - equal:
          path: spec.template.spec.containers[*].readinessProbe.httpGet.port
          value: management
      # The blip tolerance ADR-018 depends on: 3 × 10s before a pod leaves the Service.
      - equal:
          path: spec.template.spec.containers[*].readinessProbe.periodSeconds
          value: 10
      - equal:
          path: spec.template.spec.containers[*].readinessProbe.failureThreshold
          value: 3

      # --- Liveness: "is this process wedged?" -------------------------------------------------
      - equal:
          path: spec.template.spec.containers[*].livenessProbe.httpGet.path
          value: /actuator/health/liveness

      # --- Startup watches LIVENESS, and that is the assertion --------------------------------
      # Pointing the startup probe at readiness would fail a first install: the BFF's readiness waits for
      # the importer's Flyway migrations, and 30 × 5s of waiting ends in a killed container. The liveness
      # path has never depended on the database and must not start.
      - equal:
          path: spec.template.spec.containers[*].startupProbe.httpGet.path
          value: /actuator/health/liveness
      - equal:
          path: spec.template.spec.containers[*].startupProbe.failureThreshold
          value: 30

  - it: holds under values-k3d.yaml
    values:
      - ../values-k3d.yaml
    documentSelector:
      path: kind
      value: Deployment
      matchMany: true
    asserts: *probes
