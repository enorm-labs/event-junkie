# Prometheus scrape annotations (#415, #271). The collector discovers targets by `prometheus.io/*`
# pod annotations and nothing else. Both failures are quiet: an unannotated pod is never scraped,
# a wrong port fails every interval, and neither shows up as an unhealthy pod.
suite: prometheus scrape annotations

tests:
  - it: annotates the BFF for scraping, on the management port
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
    templates:
      - templates/bff-deployment.yaml
    asserts:
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/path"]
          value: /actuator/prometheus
      # `prometheus.io/port` is a string the collector reads and `service.managementPort` an int the
      # container binds; nothing but this test keeps them equal, and drift fails silently.
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/port"]
          value: "9001"

  - it: annotates the importer for scraping, on the management port
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
    templates:
      - templates/importer-deployment.yaml
    asserts:
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/port"]
          value: "9001"

  # Asserted as an absence: nginx exposes no metrics endpoint, and annotating it would give the
  # collector a permanently failing target that trains people to ignore failing targets.
  - it: does not annotate the frontend, which has no metrics endpoint
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
    templates:
      - templates/frontend-deployment.yaml
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
