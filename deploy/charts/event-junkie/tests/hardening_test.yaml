# Workload hardening — the pod-level half of the Pod Security Standards `restricted` profile.
# Positive assertions, therefore scoped: `documentSelector` with `matchMany: true` applies each to
# every Deployment, so a new Deployment is inside these without being named. Container-level fields
# are quantified with `containers[*]`, every container rather than the first.
suite: workload hardening

templates:
  - "**/*.yaml"

tests:
  - it: every workload is hardened under the default values
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
    documentSelector:
      path: kind
      value: Deployment
      matchMany: true
    asserts: &hardening
      # --- Pod level ---------------------------------------------------------------------------
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      # No token to steal from a workload that never calls the API server.
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

      # --- Container level ---------------------------------------------------------------------
      # Requests and limits are a security control on a single node: one workload without a memory limit
      # can evict the other two.
      - exists:
          path: spec.template.spec.containers[*].resources.limits.memory
      - exists:
          path: spec.template.spec.containers[*].resources.requests.memory
      - equal:
          path: spec.template.spec.containers[*].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[*].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[*].securityContext.capabilities.drop[0]
          value: ALL

      # --- Volume types --------------------------------------------------------------------------
      # `restricted` permits configMap, csi, downwardAPI, emptyDir, ephemeral, persistentVolumeClaim,
      # projected and secret — and nothing else. helm-unittest cannot ask for a map's keys, so this is the
      # complement written out, exhaustive as of Kubernetes 1.34; a volume type added later escapes it, so
      # add it here when one appears. `hostPath` is also asserted chart-wide in invariants_test.yaml.
      - notExists:
          path: spec.template.spec.volumes[*].awsElasticBlockStore
      - notExists:
          path: spec.template.spec.volumes[*].azureDisk
      - notExists:
          path: spec.template.spec.volumes[*].azureFile
      - notExists:
          path: spec.template.spec.volumes[*].cephfs
      - notExists:
          path: spec.template.spec.volumes[*].cinder
      - notExists:
          path: spec.template.spec.volumes[*].fc
      - notExists:
          path: spec.template.spec.volumes[*].flexVolume
      - notExists:
          path: spec.template.spec.volumes[*].flocker
      - notExists:
          path: spec.template.spec.volumes[*].gcePersistentDisk
      - notExists:
          path: spec.template.spec.volumes[*].gitRepo
      - notExists:
          path: spec.template.spec.volumes[*].glusterfs
      - notExists:
          path: spec.template.spec.volumes[*].hostPath
      - notExists:
          path: spec.template.spec.volumes[*].image
      - notExists:
          path: spec.template.spec.volumes[*].iscsi
      - notExists:
          path: spec.template.spec.volumes[*].nfs
      - notExists:
          path: spec.template.spec.volumes[*].photonPersistentDisk
      - notExists:
          path: spec.template.spec.volumes[*].portworxVolume
      - notExists:
          path: spec.template.spec.volumes[*].quobyte
      - notExists:
          path: spec.template.spec.volumes[*].rbd
      - notExists:
          path: spec.template.spec.volumes[*].scaleIO
      - notExists:
          path: spec.template.spec.volumes[*].storageos
      - notExists:
          path: spec.template.spec.volumes[*].vsphereVolume

  - it: every workload is hardened under values-k3d.yaml
    values:
      - ../values-k3d.yaml
    documentSelector:
      path: kind
      value: Deployment
      matchMany: true
    asserts: *hardening

  # `runAsUser` has to match the UID the images run as; a mismatch is a pod that cannot read its own
  # files, so the value is asserted, not its presence.
  - it: every pod runs as the UID the images are built with
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
    documentSelector:
      path: kind
      value: Deployment
      matchMany: true
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 10001
      - equal:
          path: spec.template.spec.securityContext.runAsGroup
          value: 10001
