# What the BFF is given, and what it is not given until the release asks. `configmap.yaml` is in
# `templates:` and not optional: `bff-deployment.yaml` includes it for `checksum/config`, and
# helm-unittest renders only what a suite lists. Explicit values throughout: this suite is re-run
# against every cluster's `spec.values`.
suite: bff

templates:
  - bff-deployment.yaml
  - configmap.yaml

tests:
  # --- Memory budget (#1766) ---------------------------------------------------------------------
  # Heap and Netty's buffers are both capped, so the pod's native memory fits the limit under load.
  - it: caps the heap and the direct memory in JAVA_TOOL_OPTIONS
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: JAVA_TOOL_OPTIONS
            value: "-XX:MaxRAMPercentage=50 -XX:MaxDirectMemorySize=64m"

  # --- Serving cached venue images (ADR-019) -----------------------------------------------------
  # The switch a visitor sees: off, the API hands out the venue's URL; on, a path on our own origin (#792).
  - it: passes no storage configuration while it is not serving images
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      images.enabled: true
      images.storage.prefix: "staging"
      images.serving.enabled: false
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      # A bucket credential in an internet-reachable pod, for a feature not turned on, is reach nothing
      # is asking for.
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: APP_IMAGES_SERVING_ENABLED
            value: "true"
      - notMatchRegex:
          path: "$.spec.template.spec.containers[0].env[*].name"
          pattern: "^IMAGE_STORAGE_"

  # Serving needs the importer half as well: nothing to hand out until something has fetched it.
  - it: serves nothing while the importer is not caching
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      images.enabled: false
      images.serving.enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: APP_IMAGES_SERVING_ENABLED
            value: "true"

  - it: takes the image bucket keypair from a Secret rather than a value
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      images.enabled: true
      images.storage.prefix: "staging"
      images.serving.enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      # The chart never templates a credential.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: IMAGE_STORAGE_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: "event-junkie-images"
                key: IMAGE_STORAGE_SECRET_KEY
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: APP_IMAGES_SERVING_ENABLED
            value: "true"
      # No prefix, and not an omission: a served key is read from the row that recorded it, so this
      # workload never builds a key.
      - notMatchRegex:
          path: "$.spec.template.spec.containers[0].env[*].name"
          pattern: "^IMAGE_STORAGE_PREFIX$"
      # The read-through cache in front of the bucket (#847). One word on both sides: Boot maps a dashed
      # property by removing the dash, so `max-size` would bind to nothing.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: APP_IMAGES_CACHE_SIZE
            value: "32MB"

  # A cache sized for a workload that is not running is heap taken from everything else.
  - it: sizes no image cache while serving is off
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      images.enabled: true
      images.storage.prefix: "staging"
      images.serving.enabled: false
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notMatchRegex:
          path: "$.spec.template.spec.containers[0].env[*].name"
          pattern: "^APP_IMAGES_CACHE_SIZE$"

  # --- Transactional mail (ADR-054) --------------------------------------------------------------
  - it: passes no mail configuration without a mail Secret
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      mail.existingSecret: ""
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      # No host means no sender: the BFF starts and nothing can send (MailerConfigurationTest).
      - notMatchRegex:
          path: "$.spec.template.spec.containers[0].env[*].name"
          pattern: "^SPRING_MAIL_"

  - it: passes the relay and the credentials from the mail Secret
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      mail.existingSecret: "event-junkie-mail"
      mail.host: "smtp.tem.scaleway.com"
      mail.port: 587
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SPRING_MAIL_HOST
            value: "smtp.tem.scaleway.com"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SPRING_MAIL_PORT
            value: "587"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SPRING_MAIL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: event-junkie-mail
                key: password

  # --- The BFF's own database role (ADR-053) ------------------------------------------------------
  - it: shares the importer's database login while it has no Secret of its own
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      bff.database.existingSecret: ""
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SPRING_R2DBC_USERNAME
            valueFrom:
              secretKeyRef:
                name: events-db
                key: username

  - it: logs in as the bff role once its Secret is named
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      bff.database.existingSecret: "events-bff-db"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SPRING_R2DBC_USERNAME
            valueFrom:
              secretKeyRef:
                name: events-bff-db
                key: username
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SPRING_R2DBC_PASSWORD
            valueFrom:
              secretKeyRef:
                name: events-bff-db
                key: password
