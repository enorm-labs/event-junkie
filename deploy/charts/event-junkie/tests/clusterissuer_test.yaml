# Without `keep`, `create: false` deletes the live issuer during the move out of this release (#4445).
suite: cluster issuer
templates:
  - templates/clusterissuer.yaml
set:
  database.host: "10.0.1.2"
  networkPolicy.databaseCidr: "10.0.1.2/32"
  database.existingSecret: "events-db"

tests:
  - it: keeps the issuer when a later release stops rendering it
    set:
      certManager.clusterIssuer.create: true
      certManager.clusterIssuer.email: "hello@example.de"
    asserts:
      - isKind:
          of: ClusterIssuer
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: renders no issuer by default
    asserts:
      - hasDocuments:
          count: 0
