# The importer's two ADR-008 constraints, and the JDBC half of its database configuration.
# `configmap.yaml` is in `templates:` and is not optional: `importer-deployment.yaml` includes it for
# its `checksum/config` annotation, and helm-unittest renders only what a suite lists — omit it and
# the suite fails with `no template "…/configmap.yaml" associated with template "gotpl"`.
suite: importer

templates:
  - importer-deployment.yaml
  - importer-service.yaml
  - configmap.yaml

tests:
  # --- The single replica is a correctness constraint, not a cost one -------------------------
  # Two schedulers means two concurrent imports of one source; the RUNNING check has no lock. A rolling
  # update briefly runs two pods, the same failure by another route — hence Recreate.
  - it: runs exactly one replica and replaces rather than rolls
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.strategy.type
          value: Recreate

  - it: runs exactly one replica under values-k3d.yaml too
    values:
      - ../values-k3d.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.strategy.type
          value: Recreate

  # --- Flyway's JDBC connection ---------------------------------------------------------------
  # The apps are R2DBC and Flyway is JDBC, so the importer needs two connection configurations for one
  # database; forgetting the JDBC half means migrations never run, silently. Each path filters `env` by
  # name — `env[?(@.name=="…")]` — so a filter matching nothing is an unknown path, not a pass. Also the
  # control for invariants_test.yaml's negative on `$..env[*].name`, which lives here because the
  # frontend has no `env`.
  - it: carries the JDBC connection Flyway needs, spelled the way Spring binds it
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
    documentSelector:
      path: kind
      value: Deployment
    asserts: &flyway
      - matchRegex:
          path: 'spec.template.spec.containers[0].env[?(@.name=="SPRING_FLYWAY_URL")].value'
          pattern: '^jdbc:postgresql://[^:/]+:[0-9]+/[^/]+$'
      # `SPRING_FLYWAY_USER`, not `_USERNAME`; invariants_test.yaml rejects the wrong spelling anywhere, this
      # says the right one is present. The credential comes from `database.existingSecret`, so the
      # assertion is on `valueFrom`, and there is deliberately none on a literal `value`.
      - exists:
          path: 'spec.template.spec.containers[0].env[?(@.name=="SPRING_FLYWAY_USER")].valueFrom.secretKeyRef.name'
      - equal:
          path: 'spec.template.spec.containers[0].env[?(@.name=="SPRING_FLYWAY_USER")].valueFrom.secretKeyRef.key'
          value: username
      - equal:
          path: 'spec.template.spec.containers[0].env[?(@.name=="SPRING_FLYWAY_PASSWORD")].valueFrom.secretKeyRef.key'
          value: password
      # The R2DBC half alongside it: the failure guarded against is having one of the two, not neither.
      - matchRegex:
          path: 'spec.template.spec.containers[0].env[?(@.name=="SPRING_R2DBC_URL")].value'
          pattern: '^r2dbc:postgresql://[^:/]+:[0-9]+/[^/]+$'

  - it: carries both connection styles under values-k3d.yaml too
    values:
      - ../values-k3d.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts: *flyway

  # --- Nothing outside the cluster can address the importer ------------------------------------
  # Its /api/admin/** has no authentication of its own; no Ingress names its Service and the Service is
  # ClusterIP. ingress_test.yaml asserts the first half from the Ingress side.
  - it: exposes itself only inside the cluster
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
    templates:
      - importer-service.yaml
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP

  # --- Cached venue images (ADR-019) ------------------------------------------------------------
  # Off has to mean the importer carries no storage configuration at all. **`images.enabled: false` is
  # set explicitly**: `cluster-assertions.sh` re-runs this suite against every cluster's values, and a
  # test relying on a chart default fails the moment an environment overrides it.
  - it: passes no image storage configuration while images are disabled
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      images.enabled: false
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: APP_IMAGES_FETCH_ENABLED
            value: "true"

  - it: takes the image bucket keypair from a Secret rather than a value
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      images.enabled: true
      images.storage.prefix: "staging"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      # The chart never templates a credential.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: IMAGE_STORAGE_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: "event-junkie-images"
                key: IMAGE_STORAGE_SECRET_KEY
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: IMAGE_STORAGE_PREFIX
            value: "staging"

  # The sweep is the only code path here that deletes anything. Off has to reach the container as a
  # value rather than an absent variable, or the two are indistinguishable in a running pod.
  - it: passes the sweep switch through as a value, off as well as on
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      images.enabled: true
      images.storage.prefix: "staging"
      images.sweep.enabled: false
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: APP_IMAGES_SWEEP_ENABLED
            value: "false"

  - it: turns the sweep on when the values say so
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      images.enabled: true
      images.storage.prefix: "staging"
      images.sweep.enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: APP_IMAGES_SWEEP_ENABLED
            value: "true"

  # One bucket serves both environments with content-addressed keys, so a missing prefix would let one
  # environment's sweep delete the other's objects (ADR-019 §2.8). Failing the render is the only
  # place that is caught in time.
  - it: refuses to render with images enabled and no environment prefix
    # Scoped to one template: `failedTemplate` is asserted against every template the suite lists.
    template: importer-deployment.yaml
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      images.enabled: true
      # Empty explicitly, for the reason `enabled` is: an environment supplying a prefix would make this
      # render succeed.
      images.storage.prefix: ""
    asserts:
      - failedTemplate:
          errorMessage: "images.storage.prefix is required when images.enabled — it is what separates this environment's objects from the other's."

  # --- The imgproxy sidecar (ADR-020) -----------------------------------------------------------
  # Explicit values throughout: this suite is re-run against every cluster's spec.values.
  - it: runs no sidecar until imgproxy is enabled
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      images.enabled: true
      images.storage.prefix: "staging"
      images.imgproxy.enabled: false
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1

  - it: binds the sidecar to loopback and allows only the bucket as a source
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      images.enabled: true
      images.storage.prefix: "staging"
      images.imgproxy.enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      # Nothing outside the pod may reach it. NetworkPolicy cannot express this — a sidecar shares the
      # pod's network namespace — so the bind address is the control.
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: IMGPROXY_BIND
            value: "127.0.0.1:8080"
      # imgproxy may reach the bucket and nothing else; a venue URL would go around robots.txt, the
      # throttle and the SSRF checks in our own fetcher.
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: IMGPROXY_ALLOWED_SOURCES
            value: "s3://event-junkie-images/"
      # EXIF can carry GPS coordinates and a camera serial: a legal step (LEGAL.md §7.3a), stated rather
      # than left to the default.
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: IMGPROXY_STRIP_METADATA
            value: "true"

  # **The sidecar and the client that calls it are two halves.** One PR wired the container and never
  # the JVM, so staging ran a sidecar nothing called with every probe passing. These assert
  # `containers[0]`.
  - it: tells the importer to call the sidecar, and how to sign for it
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      images.enabled: true
      images.storage.prefix: "staging"
      images.imgproxy.enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: APP_IMAGES_IMGPROXY_ENABLED
            value: "true"
      # The other end of the sidecar's IMGPROXY_BIND; a pair that has to agree.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: IMGPROXY_BASE_URL
            value: "http://127.0.0.1:8080"
      # Without the same key and salt the JVM signs nothing and every request is 403, which reads as a
      # broken sidecar rather than a missing secret.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: IMGPROXY_SALT
            valueFrom:
              secretKeyRef:
                name: "event-junkie-imgproxy"
                key: IMGPROXY_SALT

  - it: leaves the importer no imgproxy configuration while the sidecar is off
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      images.enabled: true
      images.storage.prefix: "staging"
      images.imgproxy.enabled: false
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notMatchRegex:
          path: "$.spec.template.spec.containers[0].env[*].name"
          pattern: "^IMGPROXY_"
      - notMatchRegex:
          path: "$.spec.template.spec.containers[0].env[*].name"
          pattern: "^APP_IMAGES_IMGPROXY_ENABLED$"

  - it: pins the sidecar by digest and bounds what it will decode
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      images.enabled: true
      images.storage.prefix: "staging"
      images.imgproxy.enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      # A third-party image we cannot rebuild, so the version is a decision, not a tag that moves (ADR-017).
      - matchRegex:
          path: spec.template.spec.containers[1].image
          pattern: "^ghcr\\.io/imgproxy/imgproxy@sha256:[0-9a-f]{64}$"
      # The decode bounds, here because ADR-020 moved decoding out of the JVM: a bomb is small on the wire
      # and enormous decoded.
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: IMGPROXY_MAX_SRC_RESOLUTION
            value: "50"
      # **Asserted as a rendered value, not a present key**: this shipped as "8.388608e+06" because Helm
      # parses a values number as float64, and imgproxy exits on `strconv.Atoi: parsing "8.388608e+06"`. The
      # sidecar crash-looped; the presence assertion passed throughout, because 50 renders without an exponent.
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: IMGPROXY_MAX_SRC_FILE_SIZE
            value: "8388608"
      - equal:
          path: spec.template.spec.containers[1].resources.limits.memory
          value: 512Mi
      - equal:
          path: spec.template.spec.containers[1].securityContext.readOnlyRootFilesystem
          value: true


  # --- Translation: two switches, and the chart owns only the first ---------------------------
  # A missing Secret must not be a broken cluster: with the engine off the deployment names no Secret
  # at all (ADR-026).
  - it: names no translation secret while the engine is off
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      # Forced: production sets `anthropic`, and this case asserts the default.
      importer.translation.engine: "none"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: APP_TRANSLATION_ENGINE
          any: true

  - it: reads the key from the hand-made secret once the engine is anthropic
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      importer.translation.engine: "anthropic"
      importer.translation.maxPerRun: 50
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: APP_TRANSLATION_ENGINE
            value: "anthropic"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: APP_TRANSLATION_API_KEY
            valueFrom:
              secretKeyRef:
                name: event-junkie-translation
                key: APP_TRANSLATION_API_KEY
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: APP_TRANSLATION_MAX_PER_RUN
            value: "50"

  - it: carries a raised per-run cap into the importer's environment
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      importer.translation.engine: "anthropic"
      importer.translation.maxPerRun: 250
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: APP_TRANSLATION_MAX_PER_RUN
            value: "250"
