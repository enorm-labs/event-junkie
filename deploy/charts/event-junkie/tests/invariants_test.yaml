# Whole-chart invariants: what must hold for every document the chart renders, under every values
# file. `templates: ["**/*.yaml"]` is the point: a template added tomorrow is inside these assertions
# without anyone listing it (#430). Every assertion is a negative — "no document does X" — because a
# positive over `**/*.yaml` fails on every document that legitimately lacks the path. The cost: a
# negative passes when a rename breaks its path expression, which is what the controls at the bottom
# are for. They must not be deleted.
suite: whole-chart invariants

templates:
  - "**/*.yaml"

tests:
  # The two value sets the chart renders from on its own. k3d, staging and production's `spec.values`
  # cannot be named here; `scripts/cluster-assertions.sh` re-runs this suite against each, so the matrix
  # is five renders.
  - it: holds under the default values
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
    asserts: &invariants
      # --- Namespaces belong to whoever installs the chart -----------------------------------
      # Flux's HelmRelease sets targetNamespace, and a hardcoded metadata.namespace silently wins over it.
      - notExists:
          path: metadata.namespace

      # --- Selector labels must be the immutable subset ---------------------------------------
      # spec.selector is immutable after creation, and `helm.sh/chart` and `app.kubernetes.io/version`
      # change every release; a chart that mixes them installs and then fails the *second* release. Two
      # paths because a Deployment selects through `spec.selector.matchLabels` and a Service through
      # `spec.selector`; recursive descent, so a StatefulSet added later is covered.
      - notExists:
          path: '$..matchLabels["helm.sh/chart"]'
      - notExists:
          path: '$..matchLabels["app.kubernetes.io/version"]'
      - notExists:
          path: '$..selector["helm.sh/chart"]'
      - notExists:
          path: '$..selector["app.kubernetes.io/version"]'

      # --- Images ------------------------------------------------------------------------------
      # `image.tag` falls back to `.Chart.AppVersion`, which keeps chart and images in step (#264).
      - notMatchRegex:
          path: "$..image"
          pattern: ":(latest|head|canary|main|edge)$"
      # "carries an explicit tag", as a negative: an untagged reference is one whose last path segment
      # holds no colon.
      - notMatchRegex:
          path: "$..image"
          pattern: "(^|/)[^/:]+$"

      # --- Pod Security Standards, `restricted` profile ----------------------------------------
      # The chart satisfies every field of the profile, and these keep that true rather than incidental.
      # https://kubernetes.io/docs/concepts/security/pod-security-standards/
      - notExists:
          path: "$..hostNetwork"
      - notExists:
          path: "$..hostPID"
      - notExists:
          path: "$..hostIPC"
      - notExists:
          path: "$..hostPort"
      - notExists:
          path: "$..privileged"

      # hostPath is how a pod escapes being a pod, so it is asserted chart-wide and recursively;
      # hardening_test.yaml carries the rest of the volume rule as an explicit list.
      - notExists:
          path: "$..hostPath"

      # --- Flyway's JDBC connection -------------------------------------------------------------
      # The Spring property is `spring.flyway.user`; the `_USERNAME` spelling binds to nothing and
      # migrations never run. Chart-wide, because the wrong spelling is as silent anywhere. Its control
      # lives in importer_test.yaml: the frontend has no `env` at all.
      - notMatchRegex:
          path: "$..env[*].name"
          pattern: "^SPRING_FLYWAY_USERNAME$"

      # --- The chart does not decide what actuator exposes ---------------------------------------
      # A ConfigMap key becomes an environment variable through envFrom, which outranks application.yaml —
      # so a chart-set exposure list silently 404s every endpoint it omits, in every cluster, while passing
      # every other test (#538). Two paths, because a plain `env` entry is the second way back in.
      - notExists:
          path: "$..MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE"
      - notMatchRegex:
          path: "$..env[*].name"
          pattern: "^MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE$"

  - it: holds under values-k3d.yaml
    values:
      - ../values-k3d.yaml
    asserts: *invariants

  # --- The controls ---------------------------------------------------------------------------
  # Every assertion above passes when its path expression matches nothing. These are the positive
  # counterparts, scoped with `documentSelector`, and they fail if the documents stop being reachable.
  # Delete one and the invariant above it silently stops being an invariant.
  - it: control — the selector paths above reach all three Deployments
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
    documentSelector:
      path: kind
      value: Deployment
      matchMany: true
    asserts:
      - matchRegex:
          path: '$..matchLabels["app.kubernetes.io/component"]'
          pattern: "^(bff|importer|frontend)$"

  - it: control — the selector paths above reach all three Services
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
    documentSelector:
      path: kind
      value: Service
      matchMany: true
    asserts:
      - matchRegex:
          path: '$..selector["app.kubernetes.io/component"]'
          pattern: "^(bff|importer|frontend)$"

  - it: control — the image paths above reach every workload image
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
    documentSelector:
      path: kind
      value: Deployment
      matchMany: true
    asserts:
      # No version number in the pattern: it asserts the `.Chart.AppVersion` fallback produced a SemVer
      # tag, which breaks if a published values file pins `image.tag`. The prerelease tail is not padding:
      # a snapshot build stamps `0.1.1-snapshot.<utc-timestamp>.g<sha>` (#455), so a pattern anchored at
      # the patch digit passes every pull request and fails only in the release job. `injector` (#287)
      # follows the first rule. **The imgproxy sidecar is the one image this chart does not build**: it
      # carries a digest and never a tag (ADR-017, ADR-020), so `images.imgproxy.enabled` is set explicitly
      # below — staging turned it on and this assertion had never seen a second container.
      - matchRegex:
          path: "$..image"
          pattern: '^(ghcr\.io/enorm-labs/event-junkie/(bff|importer|frontend|injector):[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?(@sha256:[0-9a-f]{64})?|ghcr\.io/imgproxy/imgproxy@sha256:[0-9a-f]{64})$'

  - it: a stamped digest rides behind the tag on all four of our images, and the tag stays
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      images.imgproxy.enabled: false
      bff.image.digest: "sha256:1111111111111111111111111111111111111111111111111111111111111111"
      importer.image.digest: "sha256:2222222222222222222222222222222222222222222222222222222222222222"
      frontend.image.digest: "sha256:3333333333333333333333333333333333333333333333333333333333333333"
      frontend.injector.image.digest: "sha256:4444444444444444444444444444444444444444444444444444444444444444"
    documentSelector:
      path: kind
      value: Deployment
      matchMany: true
    asserts:
      # Four containers, four digests, each behind a SemVer tag: `repo:tag@sha256:…`. A digest with no tag
      # would lose the version from every pod listing.
      - matchRegex:
          path: "$..image"
          pattern: '^ghcr\.io/enorm-labs/event-junkie/(bff|importer|frontend|injector):[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?@sha256:(1{64}|2{64}|3{64}|4{64})$'

  - it: control — the image path above reaches the imgproxy sidecar too
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      images.enabled: true
      images.storage.prefix: "staging"
      images.imgproxy.enabled: true
    documentSelector:
      path: kind
      value: Deployment
      matchMany: true
    asserts:
      - matchRegex:
          path: "$..image"
          pattern: '^(ghcr\.io/enorm-labs/event-junkie/(bff|importer|frontend|injector):[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?(@sha256:[0-9a-f]{64})?|ghcr\.io/imgproxy/imgproxy@sha256:[0-9a-f]{64})$'

  - it: control — the ConfigMap data path above reaches the shared ConfigMap
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
    documentSelector:
      path: metadata.labels["app.kubernetes.io/component"]
      value: config
    asserts:
      # A sibling key that must stay, asserted positively; without it the `notExists` above would keep
      # passing if the ConfigMap were renamed — the failure that let #538 exist.
      - exists:
          path: data.MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
