# The chart's three mandatory values, and the one its schema pins. The render must *fail*, and the
# message is asserted, not just the failure: `required` messages are the chart's interface for a
# first-time installer. **No `templates:` key anywhere in this suite**: Helm attributes a `required`
# failure to whichever template it reached first, so a scoped suite asserts on where Helm blamed
# rather than on whether the chart refused.
suite: required values

tests:
  - it: refuses to render without database.existingSecret, and says what to create
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
    asserts:
      - failedTemplate:
          errorPattern: "database\\.existingSecret is required — create the Secret out of band"
      # There is no inline-password path in this chart, and the message says so to the person looking.
      - failedTemplate:
          errorPattern: "This chart never templates a password"

  - it: refuses to render without database.host, and says where to find it
    set:
      database.existingSecret: "events-db"
      # Turned off so this case is about `database.host` alone; with policies on, whichever `required` Helm
      # reaches first wins.
      networkPolicy.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "database\\.host is required"
      - failedTemplate:
          errorPattern: "postgres_ip.*infra/environments"

  # The third mandatory value, and the one most likely to be missed (#416): NetworkPolicy cannot
  # resolve a name, so the CIDR is separate from `database.host`, and getting only one right produces
  # pods that hang on connect. The `required` turns that into a render error.
  - it: refuses to render with policies on and no database CIDR, and says why it is not database.host
    set:
      database.host: "10.0.1.2"
      database.existingSecret: "events-db"
    asserts:
      - failedTemplate:
          errorPattern: "networkPolicy\\.databaseCidr is required"
      - failedTemplate:
          errorPattern: "cannot resolve database\\.host"

  # The escape hatch works: policies off, no CIDR needed. Without this the `required` could be
  # unconditional and nothing would notice.
  - it: needs no CIDR when the policies are turned off
    set:
      database.host: "10.0.1.2"
      database.existingSecret: "events-db"
      networkPolicy.enabled: false
    asserts:
      - notFailedTemplate: {}

  # --- The importer's replica count is pinned by the schema ------------------------------------
  # ADR-008: two schedulers means two concurrent imports of one source. `values.schema.json` gives it
  # `const: 1`, and this is what proves the schema is wired in at all: delete the `const` and every
  # other assertion in this directory still passes.
  - it: the schema rejects a second importer replica
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      importer.replicaCount: 2
    asserts:
      - failedTemplate:
          errorPattern: "importer.*replicaCount"

  # The counterpart, so the three above cannot pass because the chart failed to render for an
  # unrelated reason.
  - it: renders once both are supplied
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
    asserts:
      - notFailedTemplate: {}
