# The chart's two mandatory values, and the one its schema pins.
#
# **New coverage, not a port.** `render-assertions.sh` could not test these at all: it asserted on
# renders that succeeded, and the whole point of these three is that the render must *fail*. They
# were verified by hand once, when the helpers were written, and nothing has re-checked them since —
# so the `required` messages, which are the chart's actual interface for `database.host` and
# `database.existingSecret`, could rot silently.
#
# The message is asserted, not just the failure. A `required` that fires with an unhelpful string is
# barely better than a nil-pointer render: the person hitting it is installing the chart for the
# first time and has no other source for what to put there.
#
# No `templates:` key anywhere in this suite, and that is deliberate. `failedTemplate` matches the
# error against each template in scope, and Helm attributes a `required` failure to whichever
# template it reached first — scope the suite and the assertion passes or fails on where Helm
# happened to blame rather than on whether the chart refused.
suite: required values

tests:
  - it: refuses to render without database.existingSecret, and says what to create
    set:
      database.host: "10.0.1.2"
    asserts:
      - failedTemplate:
          errorPattern: "database\\.existingSecret is required — create the Secret out of band"
      # There is no inline-password path in this chart, and the message is where that is stated to
      # the person who would otherwise go looking for one.
      - failedTemplate:
          errorPattern: "This chart never templates a password"

  - it: refuses to render without database.host, and says where to find it
    set:
      database.existingSecret: "events-db"
    asserts:
      - failedTemplate:
          errorPattern: "database\\.host is required"
      - failedTemplate:
          errorPattern: "postgres_ip.*infra/environments"

  # --- The importer's replica count is pinned by the schema ------------------------------------
  #
  # ADR-008: two schedulers means two concurrent imports of the same source, and the 60-second
  # tick's RUNNING check is a read-then-write with no lock. `values.schema.json` gives it
  # `const: 1`, so raising it fails at install time rather than in a review comment — and this is
  # what proves the schema is still wired in at all. Delete the `const` and every other assertion in
  # this directory still passes.
  - it: the schema rejects a second importer replica
    set:
      database.host: "10.0.1.2"
      database.existingSecret: "events-db"
      importer.replicaCount: 2
    asserts:
      - failedTemplate:
          errorPattern: "importer.*replicaCount"

  # The counterpart, so the three above cannot pass because the chart fails to render for some
  # unrelated reason: with both values supplied and the replica count left alone, it renders.
  - it: renders once both are supplied
    set:
      database.host: "10.0.1.2"
      database.existingSecret: "events-db"
    asserts:
      - notFailedTemplate: {}
