# The body half of `ingress.noindex` (#286): a disallow-all `robots.txt` and an empty sitemap mounted
# over the ones baked into the image. Every assertion exists because the failure is silent: a
# `subPath` naming no ConfigMap key, a volume naming the wrong ConfigMap, a mount without `subPath` —
# each renders and reports healthy, and serves the image's allow-all copy or a blank site.
suite: robots.txt and sitemap overrides outside production

templates:
  - frontend-seo-configmap.yaml
  - frontend-deployment.yaml

tests:
  # --- production renders none of it -------------------------------------------------------------

  - it: renders no SEO ConfigMap when noindex is off, as production has it
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      ingress.noindex: false
    templates:
      - frontend-seo-configmap.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: mounts nothing over the build when noindex is off
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      ingress.noindex: false
    templates:
      - frontend-deployment.yaml
    asserts:
      # /tmp and nothing else — the state established by running the real image `--read-only --tmpfs /tmp`.
      - lengthEqual:
          path: spec.template.spec.containers[0].volumeMounts
          count: 1
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /tmp
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 1
      # No checksum for a ConfigMap that does not exist here.
      - notExists:
          path: spec.template.metadata.annotations["checksum/seo"]

  # --- what the override actually says -----------------------------------------------------------

  - it: serves a disallow-all robots.txt when noindex is on
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      ingress.noindex: true
    templates:
      - frontend-seo-configmap.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-event-junkie-seo
      - matchRegex:
          path: data["robots.txt"]
          pattern: "User-agent: \\*"
      # Anchored: `Disallow:` with an empty value means *allow everything*.
      - matchRegex:
          path: data["robots.txt"]
          pattern: "(?m)^Disallow: /$"

  - it: names no sitemap in robots.txt, because the only one it could name is production's
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      ingress.noindex: true
    templates:
      - frontend-seo-configmap.yaml
    asserts:
      - notMatchRegex:
          path: data["robots.txt"]
          pattern: "(?i)sitemap:"
      - notMatchRegex:
          path: data["robots.txt"]
          pattern: "event-junkie\\.de"

  - it: serves a sitemap that lists nothing at all
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      ingress.noindex: true
    templates:
      - frontend-seo-configmap.yaml
    asserts:
      # The file's point is that it names no production URL; asserting the absence of `<loc>` stays true if
      # the empty-urlset spelling changes.
      - notMatchRegex:
          path: data["sitemap.xml"]
          pattern: "<loc>"
      - notMatchRegex:
          path: data["sitemap.xml"]
          pattern: "event-junkie\\.de"
      - matchRegex:
          path: data["sitemap.xml"]
          pattern: "<urlset"

  # --- the two halves must agree, and this is where they are checked ----------------------------

  - it: mounts both files with subPath, so the rest of the bundle survives
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      ingress.noindex: true
    templates:
      - frontend-deployment.yaml
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].volumeMounts
          count: 3
      # `subPath` is the load-bearing field: without it this mounts as a directory over
      # /usr/share/nginx/html and hides index.html — a blank site, not a bad robots.txt.
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1]
          value:
            name: seo
            mountPath: /usr/share/nginx/html/robots.txt
            subPath: robots.txt
            readOnly: true
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[2]
          value:
            name: seo
            mountPath: /usr/share/nginx/html/sitemap.xml
            subPath: sitemap.xml
            readOnly: true

  - it: points the seo volume at the ConfigMap this chart actually renders
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      ingress.noindex: true
    templates:
      - frontend-deployment.yaml
    asserts:
      # The literal must equal the ConfigMap's `metadata.name` above; a volume naming a missing ConfigMap
      # leaves the pod Pending with the reason three `describe`s away.
      - equal:
          path: spec.template.spec.volumes[1].configMap.name
          value: RELEASE-NAME-event-junkie-seo

  - it: rolls the pods when the override content changes
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      ingress.noindex: true
    templates:
      - frontend-deployment.yaml
    asserts:
      # A subPath mount is a point-in-time copy the kubelet never refreshes; without this the ConfigMap
      # changes and the served bytes do not.
      - exists:
          path: spec.template.metadata.annotations["checksum/seo"]

  - it: keeps podAnnotations working alongside the checksum
    set:
      database.host: "10.0.1.2"
      networkPolicy.databaseCidr: "10.0.1.2/32"
      database.existingSecret: "events-db"
      ingress.noindex: true
      frontend.podAnnotations:
        example.com/owner: "platform"
    templates:
      - frontend-deployment.yaml
    asserts:
      - equal:
          path: spec.template.metadata.annotations["example.com/owner"]
          value: "platform"
      - exists:
          path: spec.template.metadata.annotations["checksum/seo"]
