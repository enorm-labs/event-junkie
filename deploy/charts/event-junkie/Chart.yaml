# apiVersion v2 is deliberate and must not be raised to v3. The local Helm binary is v4, but Flux's
# helm-controller embeds the Helm 3 SDK — a v3-apiVersion chart would render fine here and then be
# uninstallable by the thing that actually installs it (#414). CI renders and unit-tests the chart
# under a pinned Helm 3 client for exactly this reason.
apiVersion: v2
name: event-junkie
description: The event-junkie stack — BFF, importer and frontend behind one Traefik ingress
type: application

# version and appVersion are PLACEHOLDERS, stamped by `.github/workflows/release.yml` from one
# computed number before packaging, so editing them here decides nothing. They must equal the base
# version in `gradle.properties` and `scripts/version.sh check` fails the build if they drift — a
# chart that lies about its own version in a local `helm install` is worth nothing. They move in
# lockstep (#264): separate versioning suits a public chart with many consumers, and this one has
# exactly one and ships from the same commit as the code. The cost is that a template-only fix
# still consumes a version.
version: 0.3.1

# appVersion is also the default image tag for all three workloads (`<component>.image.tag`
# overrides it, and no published values file may), which is what keeps the chart and the images in
# step: one number, stamped once per build, reaches all four artifacts. Never `latest`.
appVersion: "0.3.1"

# No `dependencies:` block, a decision rather than an omission: PostgreSQL runs on its own VM per
# ADR-012, so vendoring the Bitnami subchart would put the database inside the blast radius of a
# `helm uninstall`. cert-manager and Traefik are installed separately (#265); this chart renders only
# instances of their types and ships no `crds/`. See docs/ops/PLATFORM_SETUP.md §6.

home: https://event-junkie.com
sources:
  - https://github.com/enorm-labs/event-junkie
keywords:
  - events
  - berlin
maintainers:
  - name: enorm-labs
    url: https://github.com/enorm-labs
