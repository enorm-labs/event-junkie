# apiVersion v2 is deliberate and must not be raised to v3. The local Helm binary is v4, but Flux's
# helm-controller embeds the Helm 3 SDK — a v3-apiVersion chart would render fine here and then be
# uninstallable by the thing that actually installs it (#414). CI renders and unit-tests the chart
# under a pinned Helm 3 client for exactly this reason.
apiVersion: v2
name: event-junkie
description: The event-junkie stack — BFF, importer and frontend behind one Traefik ingress
type: application

# version and appVersion are PLACEHOLDERS, and both are stamped by `.github/workflows/release.yml`
# from one computed number before the chart is packaged — so editing them here does not decide what
# gets published. They must equal the base version in `gradle.properties` (0.1.1-SNAPSHOT -> 0.1.1),
# and `scripts/version.sh check` fails the build if they drift; a checkout is still installable, and
# a chart that lies about its own version in a local `helm install` is worth nothing.
#
# They move in lockstep rather than independently, which is the unusual half of the decision (#264).
# Versioning a chart separately from the application it deploys is right for a public chart with
# many consumers; here the chart has exactly one consumer and ships from the same commit as the code
# it deploys, so a second number would be pure bookkeeping. The cost — a template-only fix still
# consumes a version number — is cheaper than the thing to reason about.
version: 0.1.1

# appVersion is also the default image tag for all three workloads (`<component>.image.tag`
# overrides it, and no published values file may). That fallback is what keeps the chart and the
# images in step: one number, stamped once per build, reaches all four artifacts. Never `latest` —
# see the chart README.
appVersion: "0.1.1"

# No `dependencies:` block, and that is a decision rather than an omission: PostgreSQL runs on its
# own VM per ADR-012, so the reflex of vendoring the Bitnami postgresql subchart is wrong here — it
# would put the database inside the blast radius of a `helm uninstall`. cert-manager and Traefik are
# installed on the cluster separately (#265); this chart renders only instances of their types and
# ships no `crds/` directory. See docs/ops/PLATFORM_SETUP.md §6.

home: https://event-junkie.com
sources:
  - https://github.com/enorm-labs/event-junkie
keywords:
  - events
  - berlin
maintainers:
  - name: enorm-labs
    url: https://github.com/enorm-labs
