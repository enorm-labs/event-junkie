# The DNS-01 solver for Hetzner DNS.
#
# WHICH WEBHOOK THIS IS MATTERS MORE THAN ANY VALUE IN IT. Hetzner shut down the old
# `dns.hetzner.com` API and console in May 2026, and every token the old console issued stopped
# working with it. Roughly half a dozen community webhooks — vadimkim, mecodia, fionera and their
# forks — still rank top in a search and all speak that dead API. They will install cleanly, report
# Ready, and fail at challenge time.
#
# This is Hetzner's own: `hetzner/cert-manager-webhook-hetzner`, published to charts.hetzner.cloud,
# speaking the Cloud API with an ordinary hcloud token — the same kind of credential `infra/`
# authenticates with. `groupName` is `acme.hetzner.com`; the community ones use `.cloud`.
#
# Staging only. Production reaches Let's Encrypt over HTTP-01 and needs none of this.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-webhook-hetzner
  namespace: flux-system
  annotations:
    kubernetes.io/description: >-
      Answers cert-manager's DNS-01 challenges by writing TXT records through the Hetzner Cloud API.
      The TXT record is public; staging's A record never exists.
spec:
  releaseName: cert-manager-webhook-hetzner
  # Into cert-manager's namespace rather than one of its own: the chart defaults `certManager.namespace`
  # and `certManager.serviceAccountName` to `cert-manager`, and its RBAC grants that service account
  # permission to call this webhook's API group.
  targetNamespace: cert-manager
  storageNamespace: cert-manager
  interval: 1h
  # NOT OPTIONAL, AND NOT MERELY ORDERING PREFERENCE. This chart renders `cert-manager.io/v1`
  # Certificate and Issuer objects for its own serving certificate, so it cannot even be *rendered*
  # onto a cluster whose CRDs are absent. Without this the first reconcile fails on an unknown kind
  # and recovers only on a later retry, which looks like flakiness rather than a missing dependency.
  dependsOn:
    - name: cert-manager
  install:
    remediation:
      retries: 2
  upgrade:
    remediation:
      retries: 2
      strategy: rollback
      remediateLastFailure: true
    cleanupOnFail: true
  chart:
    spec:
      chart: cert-manager-webhook-hetzner
      version: "0.8.0"
      sourceRef:
        kind: HelmRepository
        name: hetzner
        namespace: flux-system
      interval: 1h
  values:
    # Must match `certManager.clusterIssuer.dns01.webhookGroupName` in the application HelmRelease —
    # cert-manager routes a challenge to a webhook by this group name, and a mismatch is not an error
    # anywhere, it is a challenge that is never delivered and a certificate that never issues.
    groupName: "acme.hetzner.com"
    replicaCount: 1
    resources:
      requests:
        cpu: "10m"
        memory: "32Mi"
      limits:
        memory: "64Mi"
