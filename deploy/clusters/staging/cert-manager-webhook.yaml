# The DNS-01 solver for Hetzner DNS. WHICH WEBHOOK THIS IS MATTERS MORE THAN ANY VALUE IN IT: Hetzner
# shut down the old `dns.hetzner.com` API in May 2026, and the community webhooks that rank top in a
# search all speak it — they install, report Ready, and fail at challenge time. This is Hetzner's own,
# `hetzner/cert-manager-webhook-hetzner` from charts.hetzner.cloud, speaking the Cloud API with an
# ordinary hcloud token; `groupName` is `acme.hetzner.com`, the forks use `.cloud`. Staging only;
# production solves HTTP-01.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-webhook-hetzner
  namespace: flux-system
  annotations:
    kubernetes.io/description: >-
      Answers cert-manager's DNS-01 challenges by writing TXT records through the Hetzner Cloud API.
      The TXT record is public; staging's A record never exists.
spec:
  releaseName: cert-manager-webhook-hetzner
  # Into cert-manager's namespace: the chart defaults `certManager.namespace` and
  # `serviceAccountName` to `cert-manager`, and its RBAC grants that account this API group.
  targetNamespace: cert-manager
  storageNamespace: cert-manager
  interval: 1h
  # NOT OPTIONAL: this chart renders `cert-manager.io/v1` objects for its own serving certificate, so
  # without this the first reconcile fails on an unknown kind and recovers on a later retry, which looks
  # like flakiness.
  dependsOn:
    - name: cert-manager
  install:
    remediation:
      retries: 2
  upgrade:
    remediation:
      retries: 2
      strategy: rollback
      remediateLastFailure: true
    cleanupOnFail: true
  chart:
    spec:
      chart: cert-manager-webhook-hetzner
      version: "0.9.0"
      sourceRef:
        kind: HelmRepository
        name: hetzner
        namespace: flux-system
      interval: 1h
  values:
    # Must match `certManager.clusterIssuer.dns01.webhookGroupName` in the application HelmRelease: a
    # mismatch is not an error, it is a challenge never delivered.
    groupName: "acme.hetzner.com"
    replicaCount: 1
    resources:
      requests:
        cpu: "10m"
        memory: "32Mi"
      limits:
        memory: "64Mi"
