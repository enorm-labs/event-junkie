# GitHub deployments for staging — what is running here, and since when (#565). **Deliberately no
# `github` commit-status Provider** (#567): `parseRevision` needs a git hash and a HelmRelease event
# reports the *chart version*; the `originRevision` mechanism exists only in kustomize-controller.
---
# A deployment is per environment and answers "what is on staging right now, and since when".
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: github-dispatch
  namespace: flux-system
  annotations:
    kubernetes.io/description: >-
      Fires a repository_dispatch so .github/workflows/deployment-status.yml can record a
      GitHub deployment for this cluster.
spec:
  type: githubdispatch
  address: https://github.com/enorm-labs/event-junkie
  # THE ONLY CREDENTIAL THIS CLUSTER HOLDS FOR GITHUB'S SAKE. `repository_dispatch` needs **contents:
  # write**, which is why the token is per-cluster: revoking one must not take the other down.
  # Fine-grained, scoped to this repository, and **hand-made rather than SOPS-encrypted**
  # (docs/ops/SECRETS.md): encrypting a value into a PUBLIC repository publishes its ciphertext, and
  # `contents: write` is where that costs most. NOTHING IN THIS REPOSITORY CREATES IT:
  #
  #   kubectl --context event-junkie-staging create secret generic github-dispatch \
  #     -n flux-system --from-literal=token=…
  #
  # Until it exists this Provider reconciles into a failed state and no dispatch is sent.
  secretRef:
    name: github-dispatch
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: github-dispatch
  namespace: flux-system
spec:
  providerRef:
    name: github-dispatch
  eventSeverity: info
  # The HelmRelease only: a chart arriving in the registry is not a deployment, and recording it would
  # put two entries on the timeline per rollout. The OCIRepository has its own Alert below.
  eventSources:
    - kind: HelmRelease
      name: event-junkie
      namespace: flux-system
  # The workflow's whole input beyond the revision. An unrecognised `env` fails the run rather than
  # filing staging under production.
  eventMetadata:
    env: staging
    cluster: staging
---
# The source's failures, and nothing else (#1454): a chart that fails cosign verification or an
# unreachable registry keeps the last good artifact, and the HelmRelease emits no event. `error`
# rather than `info`, or every merge would spend a `contents: write` call on nothing.
# `flux-source-failure.yml` receives these and goes red.
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: source-failure
  namespace: flux-system
spec:
  providerRef:
    name: github-dispatch
  eventSeverity: error
  eventSources:
    - kind: OCIRepository
      name: event-junkie
      namespace: flux-system
  eventMetadata:
    env: staging
    cluster: staging
