# comment-lint: allow-file 89 lines of config, of which two upstream defaults silently drop data (#625).
# OpenObserve on staging — ADR-015's trial. **The `openobserve-standalone` chart, NOT `openobserve`**:
# the plain chart deploys microservices at two replicas, nothing like the footprint ADR-015 compared,
# and every measured number there is standalone's, so picking the wrong one silently invalidates
# criterion 2.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openobserve
  namespace: flux-system
  annotations:
    kubernetes.io/description: >-
      Logs, metrics and alerting for staging. Backed by the event-junkie-o2 Object Storage bucket, which #271 declared and imported so that retention is a
      bucket policy rather than a competitor for the node's disk.
spec:
  releaseName: openobserve
  targetNamespace: observability
  # Where Helm keeps its release secret: left alone, Flux stores it in flux-system while the objects
  # live elsewhere, and `helm list -n observability` disagrees with reality.
  storageNamespace: observability
  interval: 1h
  # **How long Helm waits for the rollout, and it has to exceed the startup window below** (#924): at
  # the five-minute default a pod that needs longer is marked `Failed`, remediation rolls back to the
  # template that caused the problem, and the fix cannot deploy because it needs the pod it fixes.
  timeout: 10m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      # Explicit because the default is the trap #414's flux-break rehearsal found: a failed upgrade is
      # retried and then left running.
      remediateLastFailure: true
  chart:
    spec:
      chart: openobserve-standalone
      # Pinned, not a range. A major lands here a night before production: v1.0.0 migrates the metadata
      # sqlite forward on start, and a rollback across that is untested (#1571).
      version: "1.0.1"
      sourceRef:
        kind: HelmRepository
        name: openobserve
        namespace: flux-system
      interval: 1h

  # **The whole reason `valuesFrom` is used.** The chart takes `auth.ZO_S3_ACCESS_KEY` and
  # `auth.ZO_S3_SECRET_KEY` as plain values, which under `spec.values` would be plaintext credentials in
  # a public repository. Nothing here creates the Secret (docs/ops/SECRETS.md); until it exists this
  # release reconciles into a failed state, as intended.
  valuesFrom:
    - kind: Secret
      name: openobserve-credentials
      valuesKey: ZO_S3_ACCESS_KEY
      targetPath: auth.ZO_S3_ACCESS_KEY
    - kind: Secret
      name: openobserve-credentials
      valuesKey: ZO_S3_SECRET_KEY
      targetPath: auth.ZO_S3_SECRET_KEY

  values:
    # **What `restricted` asks of a pod that needs no privilege** (#709): the chart runs the server as
    # UID 10000 with `runAsNonRoot`, and these are the three fields it leaves empty. `podSecurityContext`
    # merges with the chart's map. `OnRootMismatch` skips the kubelet's chown of every inode on the data
    # volume at each start (#1519): 13 GB and 1.26 million files on production, four minutes per start.
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
      fsGroupChangePolicy: OnRootMismatch

    auth:
      # Root credentials from the same hand-made Secret; the chart reads the two keys directly.
      existingRootUserSecret:
        name: openobserve-credentials
        emailKey: ZO_ROOT_USER_EMAIL
        passwordKey: ZO_ROOT_USER_PASSWORD

    config:
      # Object storage rather than local disk: ADR-015 wants log retention to stop competing with the
      # node's disk, and LEGAL.md §7.5 needs that retention enforced. **`ZO_LOCAL_MODE` stays `true`** — it
      # chooses single-node versus cluster, not disk versus S3, and `false` crash-loops on `Meta store only
      # supports postgres in cluster mode`. `ZO_LOCAL_MODE_STORAGE` is what moves the data off the disk.
      ZO_LOCAL_MODE: "true"
      ZO_LOCAL_MODE_STORAGE: "s3"
      ZO_S3_PROVIDER: "s3"
      ZO_S3_SERVER_URL: "https://fsn1.your-objectstorage.com"
      # Hetzner enforces the region in the request signature; the chart's default is `us-east-2`.
      ZO_S3_REGION_NAME: "fsn1"
      ZO_S3_BUCKET_NAME: "event-junkie-o2"

      # **One bucket, two environments, and this line is what keeps them apart** — the same separation the
      # backups and images buckets make. The file list stores keys **relative** to the prefix (production
      # proves it: `files/default/metrics/…` under `ZO_S3_BUCKET_PREFIX: "production/"`), so the prefix is
      # applied at the S3 client. **This line cannot be changed on its own**: adding it points every entry
      # already in the list at a key that does not exist, and the corpus goes unreadable while new ingest
      # carries on. It landed together with a wipe of the file-list PVC — docs/ops/OPENOBSERVE.md
      # §Changing the prefix has the sequence. In `config:` rather than `extraEnv` because the chart lists
      # this key; **verify the objects, not this comment**.
      ZO_S3_BUCKET_PREFIX: "staging/"
      # Path style, not virtual-hosted: Hetzner's endpoint serves `<endpoint>/<bucket>`.
      ZO_S3_FEATURE_FORCE_HOSTED_STYLE: "false"

      # **Retention, the number LEGAL.md §7.5 depends on** (#271 item 1). The default is `3650`, ten years.
      # **OpenObserve's own compactor is the mechanism, not an S3 lifecycle rule**: it deletes the Parquet
      # *and* its file-list entry, where a bucket rule would leave queries referencing files that are gone.
      # `infra/bootstrap/storage.tf`'s lifecycle rule is a backstop set deliberately longer, for the case
      # where the compactor stops. **14 days is a starting position** — room to investigate an incident a
      # week old, short of an archive — and #278's privacy notice must state whatever this says. It applies
      # to metrics too; an availability figure that survives a year needs per-stream retention in the
      # application. This errs toward the recoverable mistake.
      ZO_COMPACT_DATA_RETENTION_DAYS: "14"

      # **The memtable never rotates on size, because the default cannot be reached (#625).** In `v0.92.2`,
      # `writer.rs:68` rejects a write with `MemoryTableOverflowError` once the **global** gauge
      # `zo_ingest_memtable_arrow_bytes` reaches `ZO_MEM_TABLE_MAX_SIZE`, derived when unset as
      # `mem_total / 4` of the **cgroup** limit — 256 MiB against `limits.memory: 1Gi`. But `writer.rs:706`
      # rotates a memtable only when **that one table** passes `ZO_MAX_FILE_SIZE_IN_MEMORY`, default
      # **512 MB**. One table cannot reach 512 MB while all of them may not exceed 256 MiB, so the only
      # rotation is the 600s age check: the pod accumulates ten minutes of batches, hits the ceiling and
      # returns 503 until the timer fires. Over 48 hours that lost ~51% of post-filter metric points and
      # 74% of k8s event logs.
      #
      # **32 MB, not something closer to the ceiling.** Writers are one per `(bucket, org, stream_type)`,
      # a handful; six full tables at 32 MB is 192 MB against 256 MiB, at 64 MB the worst case is over it.
      # Raising the memory limit does not work — reaching the default by sizing alone needs 4 GiB. The cost
      # is more, smaller Parquet files, which the compactor merges every 10s; a rejected write is data that
      # no longer exists.
      ZO_MAX_FILE_SIZE_IN_MEMORY: "32"

      # **The disk cache sizes itself from the node's disk, not from the claim (#1521).** Unset,
      # `check_disk_cache_config` takes half the free space on the disk the data directory sits on —
      # `local-path` puts that on the node's root disk — so the cache grew to 13 GB on a `5Gi` claim. 3072 MB
      # leaves room inside the claim for `db/`, `wal/` and the two 10% caches derived from this.
      ZO_DISK_CACHE_MAX_SIZE: "3072"
      # **The chart pauses the cache's own GC** (`"0"` means paused), so nothing above the cap is released
      # until a write forces it. 60 is the application's default.
      ZO_DISK_CACHE_GC_INTERVAL: "60"

      # **Let it report its own pressure — the chart turns this off, the app defaults it on.** With
      # `ZO_PROMETHEUS_ENABLED: false`, `/metrics` answers 200 with an empty body and the store that holds
      # every metric exports none of its own; `zo_ingest_memtable_arrow_bytes` is the exact gauge the
      # overflow check reads, and #625 had to be diagnosed from log lines. Paired with the scrape
      # annotations below.
      ZO_PROMETHEUS_ENABLED: "true"

      # **An outbound flow nobody decided on.** `ZO_TELEMETRY` defaults to **true** and posts to
      # `https://e1.zinclabs.dev` every 30 minutes; found while working out what this pod may connect to.
      # Off, on the same principle as the egress policy: this component holds every log line and metric in
      # the system, and what its heartbeat contains is documented nowhere we control.
      ZO_TELEMETRY: "false"

      # **An alert has to have a destination, and every in-cluster URL is refused.** `POST /api/v2/{org}/alerts`
      # returns `Alert destination or workflows is required`, and every destination inside the cluster —
      # the pod's own Service, `signal-cli.observability.svc` — gets `400 Destination URL blocked by SSRF
      # guard`. `config.rs:1177` offers two ways out: `ZO_SSRF_ALLOW_LOOPBACK` lets the process notify
      # itself and nothing else, `ZO_SKIP_SSRF_CHECKS` removes the check for every destination. **Both are
      # set** — the first for the interim destination (a POST into this pod's own ingest API, so a firing
      # becomes a row in `alert_history`), the second only because `openobserve-netpol.yaml` now constrains
      # the pod: the control moved from the application to the network, which is the stronger place. What
      # it does not fix: a destination may still be any *public* address, inherent to having a webhook.

      # **NOT in the `config:` block above.** The chart renders its ConfigMap from the keys it knows and
      # silently drops anything else, with a `helm template` that looks correct. `extraEnv` lands as a
      # plain environment variable anyway.

    extraEnv:
      # Kept alongside the skip below: revert the wider flag and the loopback destination keeps working.
      - name: ZO_SSRF_ALLOW_LOOPBACK
        value: "true"
      # Files older than this are read from the bucket rather than cached (#1521); the dashboards query
      # hours. Not in `config:` — the chart would drop the key.
      - name: ZO_DISK_CACHE_MAX_AGE_DAYS
        value: "3"
      - name: ZO_SKIP_SSRF_CHECKS
        value: "true"

    # The gateway's `prometheus-autodiscovery` job keys on these; without them the setting above exposes
    # metrics nothing collects.
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "5080"
      prometheus.io/path: "/metrics"

    persistence:
      # Small on purpose: with S3 as the store this is the write-ahead and cache directory. `local-path`
      # does not enforce the size; `ZO_DISK_CACHE_MAX_SIZE` above bounds it.
      enabled: true
      size: 5Gi

    resources:
      requests:
        memory: "512Mi"
        cpu: "100m"
      limits:
        # **1Gi became 1536Mi.** 1Gi was set deliberately under ADR-015's ~1.5 GB ceiling so a breach would
        # be observable, and the breach arrived: six OOMKills in twenty minutes, each mid-compaction, on a
        # backlog #924's crash-loop had built — a pod that never stays up long enough to compact turns the
        # `ZO_MAX_FILE_SIZE_IN_MEMORY: 32` trade into a debt it cannot pay off inside 1Gi.
        #
        # **This number sizes two things inside the process.** The memtable ceiling is a quarter of it
        # (`config.rs:3612`), so 1536Mi means 384 MiB against six writers at 32 MB. `config.rs:3060` caps worker
        # threads at one core per GiB floored at two, and `cpu: "1"` pins that at two, so the compactor does
        # not get more parallel — which is what makes the raise safe, and why it was not the fix for #625.
        memory: "1536Mi"
        cpu: "1"

  # **The chart cannot express this, and the default kills the pod** (#924). Its `probes:` block has no
  # `timeoutSeconds`, so both probes render with Kubernetes' one-second default; the process compacts
  # Parquet on its own schedule, `/healthz` occasionally answers slower than that, and three in a row
  # are a SIGKILL — 124 restarts in 8 days, every one `Exit Code: 137` with no error in any log. Raising
  # `failureThreshold` multiplies a wrong timeout rather than correcting it. Readiness is patched too:
  # a failing readiness probe takes the pod out of its Service, so `deploy/alerts/apply.sh` reported all
  # eleven rules as returning no data — a dead server reading like a metrics problem. 5s against a 10s
  # period, `failureThreshold: 3`: killed after 30 seconds of a genuinely unresponsive process. A
  # strategic merge patch, so the container is matched by name.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: StatefulSet
              name: openobserve-openobserve-standalone
            patch: |
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: openobserve-openobserve-standalone
              spec:
                template:
                  spec:
                    containers:
                      - name: openobserve-standalone
                        livenessProbe:
                          timeoutSeconds: 5
                        readinessProbe:
                          timeoutSeconds: 5
                        # **Neither of the two above runs until this one succeeds.** On start the process replays its
                        # write-ahead log and merges the small Parquet files it left behind, and until then a liveness probe
                        # measures the backlog, not the health — staging spiralled from a kill every half hour to every sixty
                        # seconds, 146 restarts. 30 × 10s is five minutes to become responsive, against a release timeout of
                        # ten; a process that cannot answer inside five minutes is genuinely wedged.
                        startupProbe:
                          httpGet:
                            path: /healthz
                            port: 5080
                          periodSeconds: 10
                          timeoutSeconds: 5
                          failureThreshold: 30
