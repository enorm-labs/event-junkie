# OpenObserve on staging — ADR-015's trial, which cannot start until this runs somewhere real.
#
# **The `openobserve-standalone` chart, NOT `openobserve`.** The plain chart deploys microservices —
# ingester, querier, router, scheduler, compactor, and `o2ai` at two replicas — which is nothing like
# the footprint ADR-015 compared and would not fit a node already running two JVMs. Standalone is one
# StatefulSet and one PVC. **Picking the wrong one silently invalidates the ADR's criterion 2**, which
# is the criterion the whole decision turned on. Every measured number in ADR-015 is standalone's.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: openobserve
  namespace: flux-system
  annotations:
    kubernetes.io/description: >-
      The upstream OpenObserve chart repository. Same reasoning as the jetstack one next to it: an install nothing versions and nothing notices drifting is
      the thing this avoids.
spec:
  # An hour, like jetstack's and for the same reason: this only asks "what versions exist?", and the
  # version actually installed is pinned below.
  interval: 1h
  url: https://charts.openobserve.ai
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openobserve
  namespace: flux-system
  annotations:
    kubernetes.io/description: >-
      Logs, metrics and alerting for staging. Backed by the event-junkie-o2 Object Storage bucket, which #271 declared and imported so that retention is a
      bucket policy rather than a competitor for the node's disk.
spec:
  releaseName: openobserve
  targetNamespace: observability
  # Where Helm keeps its release secret. Same reasoning cert-manager.yaml gives: left alone Flux
  # stores it in flux-system while the objects live elsewhere, which puts `helm list -n observability`
  # at odds with reality for anyone debugging.
  storageNamespace: observability
  interval: 1h
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      # Explicit because the default is the trap #414's flux-break rehearsal found: without it a
      # failed upgrade is retried and then left running, rather than rolled back.
      remediateLastFailure: true
  chart:
    spec:
      chart: openobserve-standalone
      # Pinned, not a range. This is the version ADR-015's measurements were taken against, and a
      # trial whose subject changes under it is not a trial.
      version: "0.92.2"
      sourceRef:
        kind: HelmRepository
        name: openobserve
        namespace: flux-system
      interval: 1h

  # The two S3 credentials, injected from the hand-made Secret rather than written here.
  #
  # **This is the whole reason `valuesFrom` is used at all.** The chart takes `auth.ZO_S3_ACCESS_KEY`
  # and `auth.ZO_S3_SECRET_KEY` as plain values, so putting them under `spec.values` below would put
  # live Object Storage credentials in a public repository in plaintext. `existingRootUserSecret`
  # covers the root user and nothing else — these two have no such option, so Flux merges them in at
  # reconcile time instead.
  #
  # The Secret is created by hand and nothing here creates it: docs/ops/SECRETS.md. Until it exists
  # this release reconciles into a failed state, which is the intended shape — a missing credential
  # should stop the deploy, not produce a running server nobody can log into.
  valuesFrom:
    - kind: Secret
      name: openobserve-credentials
      valuesKey: ZO_S3_ACCESS_KEY
      targetPath: auth.ZO_S3_ACCESS_KEY
    - kind: Secret
      name: openobserve-credentials
      valuesKey: ZO_S3_SECRET_KEY
      targetPath: auth.ZO_S3_SECRET_KEY

  values:
    auth:
      # Root credentials from the same hand-made Secret. The chart reads the two keys named here
      # directly, so they never pass through Helm values at all.
      existingRootUserSecret:
        name: openobserve-credentials
        emailKey: ZO_ROOT_USER_EMAIL
        passwordKey: ZO_ROOT_USER_PASSWORD

    config:
      # Object storage rather than local disk, which is the point of the bucket. ADR-015: "its
      # object-storage backend means log retention stops competing with the node's disk", and
      # LEGAL.md §7.5 needs that retention to be a policy something enforces rather than an intent.
      #
      # **`ZO_LOCAL_MODE` stays `true`, and the storage switch is the line below it.** This first
      # went out as `ZO_LOCAL_MODE: "false"` on the reading that the flag chooses disk versus S3. It
      # does not — it chooses *single-node versus cluster*, and the pod crash-looped on:
      #
      #     common config error: Meta store only supports postgres in cluster mode.
      #
      # Cluster mode requires a Postgres meta store; this deployment uses the sqlite default, which
      # is correct for one node. `ZO_LOCAL_MODE_STORAGE` is the flag that actually moves the data off
      # the disk, and it works in exactly the mode we want.
      ZO_LOCAL_MODE: "true"
      ZO_LOCAL_MODE_STORAGE: "s3"
      ZO_S3_PROVIDER: "s3"
      ZO_S3_SERVER_URL: "https://fsn1.your-objectstorage.com"
      # Hetzner enforces the region in the request signature and rejects a mismatch — the same trap
      # infra/bootstrap/versions.tf documents for the MinIO provider. The chart's default is
      # `us-east-2`, which is never right here.
      ZO_S3_REGION_NAME: "fsn1"
      ZO_S3_BUCKET_NAME: "event-junkie-o2"
      # Path style, not virtual-hosted. Hetzner's endpoint serves `<endpoint>/<bucket>`, which is
      # exactly what `bucket_domain_name` came back as on the import.
      ZO_S3_FEATURE_FORCE_HOSTED_STYLE: "false"

      # **Retention, and this is the number LEGAL.md §7.5 depends on** (#271 item 1). It defaults to
      # `3650` — ten years — so until now nothing expired anything and §7.5's claim that retention is
      # enforced by the bucket was resting on a control that did not exist.
      #
      # **OpenObserve's own compactor, not an S3 lifecycle rule, is the mechanism.** It deletes the
      # Parquet *and* its entry in the file list. A bucket rule alone would delete objects out from
      # under that list, leaving queries referencing files that are gone — a corruption rather than an
      # expiry. The lifecycle rule in `infra/bootstrap/storage.tf` is a **backstop set deliberately
      # longer than this**, for the case where the compactor stops running; the same argument #586
      # makes about a sweep that only runs while its node does.
      #
      # **14 days is a starting position, not a settled one.** The privacy notice's original intent
      # was seven; fourteen leaves room to investigate an incident a week old while staying short
      # enough that this is not a log archive. **#278 writes the notice and must state whatever this
      # says**, so changing it here changes a published claim.
      #
      # **The catch worth knowing before this bites:** it applies to metrics as well as logs, and
      # #271 item 7 wants an availability figure that survives a year. That needs per-stream
      # retention on the metric streams, which is configured in the application rather than here.
      # **Set short and lose metrics history; set long and over-retain personal data** — this errs
      # toward the recoverable mistake.
      ZO_COMPACT_DATA_RETENTION_DAYS: "14"

      # **The memtable never rotates on size, because the default cannot be reached (#625).** Two
      # thresholds decide whether ingestion works, and out of the box the smaller one is the wrong
      # one. Read together, in `v0.92.2`:
      #
      #   - `writer.rs:68` rejects a write with `MemoryTableOverflowError` when the **global** gauge
      #     `zo_ingest_memtable_arrow_bytes` — the sum across every memtable — reaches
      #     `ZO_MEM_TABLE_MAX_SIZE`.
      #   - `config.rs:3612` derives that, when unset, as **`mem_total / 4` in local mode** — 25%,
      #     not 50%, and `mem_total` is the **cgroup limit**, not the node's. With `limits.memory:
      #     1Gi` below, the ceiling is **256 MiB**.
      #   - `writer.rs:706` rotates a memtable — the thing that actually drains it — when **that one
      #     table** exceeds `ZO_MAX_FILE_SIZE_IN_MEMORY`, which defaults to **512 MB**.
      #
      # **One table has to reach 512 MB while all of them together may not exceed 256 MiB**, so
      # size-triggered rotation is unreachable by construction and the only thing that ever rotates a
      # memtable is the age check in `check_wal_threshold` (`ZO_MAX_FILE_RETENTION_TIME`, 600s). The
      # pod accumulates up to ten minutes of arrow batches, hits the ceiling, and returns HTTP 503 to
      # the collector until the timer fires. #625 recorded that as "bursts during flush cycles"; over
      # 48 hours it **lost ~51% of all post-filter metric points** — 4.44M rejected outright and
      # 8.45M never even queued — and **74% of k8s event logs**.
      #
      # **32 MB, not something closer to the ceiling.** Writers are one per `(bucket, org,
      # stream_type)` (`writer.rs:718`), so with `ZO_MEM_TABLE_BUCKET_NUM` at its default of 1 there
      # are a handful — `default` and `_meta` x logs/metrics/traces. Six full tables at 32 MB is
      # 192 MB against a 256 MiB ceiling; at 64 MB the worst case is over it, the same bug with a
      # larger constant.
      #
      # **Raising the memory limit does not work**: at `1536Mi` the ceiling becomes 384 MiB, still
      # below the 512 MB rotation threshold, so nothing changes but how long it takes to fill.
      # Reaching the default by sizing alone needs 4 GiB, more than ADR-015 budgets for the stack.
      #
      # **The cost is more, smaller Parquet files**, which the compactor merges on its 10s interval
      # (`ZO_COMPACT_MAX_FILE_SIZE` is 2048 MB) — file count is the compactor's problem and it has a
      # mechanism for it, while a rejected write is data that no longer exists.
      ZO_MAX_FILE_SIZE_IN_MEMORY: "32"

      # **Let it report its own pressure — the chart turns this off, the app defaults it on.**
      # `config.rs:1447` has `ZO_PROMETHEUS_ENABLED` defaulting to **true**; the chart sets it to
      # `false`, so `/metrics` answers 200 with an empty body and **the store that holds every metric
      # exports none of its own**. `zo_ingest_memtable_arrow_bytes` is the exact gauge the overflow
      # check reads, and until now it existed nowhere — the outage in #625 had to be diagnosed from
      # log lines, which is why it was mis-attributed to the container's RSS.
      #
      # Paired with the scrape annotations below, this is what makes the fix above checkable rather
      # than asserted, and what would make the next occurrence visible while it is happening rather
      # than after the data is gone.
      ZO_PROMETHEUS_ENABLED: "true"

      # **An outbound flow nobody decided on.**
      # `ZO_TELEMETRY` defaults to **true** and posts to `https://e1.zinclabs.dev` every 30
      # minutes. It was found while working out what this pod is allowed to connect to, which
      # is the only reason it surfaced at all — nothing here had ever named it.
      #
      # Turned off rather than allowed, on the same principle as the egress policy: an
      # outbound flow that nobody chose is not one to keep because it happens to be small.
      # It also does not survive scrutiny under LEGAL.md — this is the component holding
      # every log line and metric in the system, and what its heartbeat contains is
      # documented nowhere we control.
      ZO_TELEMETRY: "false"

      # **An alert has to have a destination, and every in-cluster URL is refused.** #271's alert
      # rules cannot be created without one — `POST /api/v2/{org}/alerts` returns `Alert destination
      # or workflows is required`, with or without `creates_incident` — and every destination inside
      # the cluster is rejected by an SSRF guard:
      #
      #     openobserve-…svc.cluster.local  -> 400 Destination URL blocked by SSRF guard
      #     signal-cli.observability.svc…   -> 400 Destination URL blocked by SSRF guard
      #
      # The second is #271 item 4's entire architecture — an OpenObserve webhook into
      # `signal-cli-rest-api` — blocked for reasons unrelated to the missing phone number.
      #
      # `config.rs:1177` offers two ways out and they are not equivalent: `ZO_SSRF_ALLOW_LOOPBACK`
      # lets the process notify **itself** and nothing else, `ZO_SKIP_SSRF_CHECKS` removes the check
      # for every destination. **Both are set** — the first for the interim destination the rules
      # use, a POST back into this pod's own ingest API so a firing becomes a row in `alert_history`;
      # the second only because the containment it needs now exists, `openobserve-netpol.yaml` in
      # this directory.
      #
      # **That moves the control from the application to the network, which is the stronger place.**
      # A URL allowlist inside a process constrains the feature, not the process; an egress policy
      # constrains anything the pod can be made to do. This pod may reach CoreDNS, the public
      # internet on 443 and the Signal bridge — PostgreSQL, the Kubernetes API, the kubelet and every
      # other pod are unreachable, so a destination aimed at them fails at the network rather than at
      # a check somebody can turn off. **What it does not fix:** a destination may still be any
      # *public* address, so the root credential can exfiltrate alert bodies — inherent to having a
      # webhook at all, and that credential already reads every metric and log in the system.

      # **It is NOT in the `config:` block above, and that is not a style choice.** The chart renders
      # its ConfigMap from the 226 keys it knows about and **silently drops anything else** — no
      # error, no warning, and a `helm template` that looks entirely correct. `extraEnv` is the
      # chart's escape hatch for a key it has never heard of, and it lands as a plain environment
      # variable, which is what the process reads anyway.

    extraEnv:
      # Kept alongside the skip below rather than removed by it: if the wider flag is ever
      # reverted, the loopback destination that records firings into `alert_history` keeps
      # working, and the alert rules do not all break at once.
      - name: ZO_SSRF_ALLOW_LOOPBACK
        value: "true"
      - name: ZO_SKIP_SSRF_CHECKS
        value: "true"

    # The gateway's `prometheus-autodiscovery` job keeps pods carrying these, exactly as
    # postgres-exporter.yaml does. Without them the setting above exposes metrics nothing collects.
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "5080"
      prometheus.io/path: "/metrics"

    persistence:
      # Small on purpose: with S3 as the store this is the write-ahead and cache directory, not the
      # corpus. The corpus is in the bucket.
      enabled: true
      size: 5Gi

    resources:
      requests:
        memory: "512Mi"
        cpu: "100m"
      limits:
        # Measured, not guessed. A k3d rehearsal put standalone at 634Mi under load and the whole
        # metrics path — this, the collector gateway, two agents and the operator — at 938Mi against
        # ADR-015's ~1.5 GB ceiling.
        #
        # **1Gi is deliberately tighter than that ceiling.** Criterion 2 is a real test rather than a
        # hope only if breaching it is observable, and an OOMKill says so immediately. Raise it if it
        # proves too tight on real data — but raise it as a decision, and record what the number
        # became, because 1.5 GB is the point at which ADR-015's fallback is supposed to trigger.
        #
        # **This number is not only a limit — it sizes two things inside the process**, which is not
        # obvious and cost #625 a wrong diagnosis:
        #
        #   - the memtable ceiling is a quarter of it (`config.rs:3612`), so 1Gi means 256 MiB;
        #   - `config.rs:3060` caps worker threads at **one core per GiB of this limit**, floored at
        #     two — `cpu_num = min(real_cpu, mem_total / 1GiB)`. The persist and file-move pools are
        #     sized from that, so raising `cpu` alone below buys nothing while this stays at 1Gi.
        #
        # Both are why the fix for #625 is the rotation threshold in `config` above rather than a
        # bigger number here: the memtable was never near this limit — 759Mi of 1Gi while rejecting
        # writes — because it was bounded by its own 256 MiB ceiling, not by the cgroup.
        memory: "1Gi"
        cpu: "1"
