# Staging's release of the event-junkie chart. `spec.values` IS THE STAGING CONFIGURATION — there is no
# `values-staging.yaml` (#414): a HelmRelease cannot read a file, and two copies would drift.
# `scripts/cluster-assertions.sh` re-runs the chart's invariant suites against these values, so the
# assertions gate what Flux deploys. Only overrides live here.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: event-junkie
  namespace: flux-system
  annotations:
    kubernetes.io/description: >-
      The BFF, importer and frontend on the staging cluster, upgraded automatically to every
      snapshot published from main.
spec:
  # Named explicitly: left to Flux the release is `event-junkie-event-junkie`, and the fullname helper
  # puts that into every resource.
  releaseName: event-junkie
  targetNamespace: event-junkie
  # This release renders a ClusterIssuer, a `cert-manager.io/v1` kind, so without cert-manager the
  # whole release fails at an unknown kind. Naming the webhook gets both, and the webhook is what has
  # to answer before the DNS-01 solver means anything.
  dependsOn:
    - name: cert-manager-webhook-hetzner
  # Not the OCIRepository's clock: that one asks "is there a new chart?", this one "does the cluster
  # still match?" — the drift check. A new snapshot still reconciles immediately through the source.
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: event-junkie
    namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 2
      # Deliberately NOT `remediateLastFailure` here: install remediation is an *uninstall*, and leaving
      # the failed release in place is what lets somebody look at why.
  upgrade:
    remediation:
      retries: 2
      # Roll back rather than uninstall: `uninstall` on a failed upgrade takes the site down to fix a
      # deploy that was merely bad.
      strategy: rollback
      # WITHOUT THIS, A BAD DEPLOY IS NEVER ROLLED BACK — only retried. `remediateLastFailure` defaults to
      # **false**, so remediation happens between attempts and not after the final one. Found by breaking a
      # release on purpose on k3d and watching the workload stay broken.
      remediateLastFailure: true
    # Delete anything the failed upgrade created before rolling back, so a retry starts clean.
    cleanupOnFail: true
  # The chart's own hooks under `templates/tests/`, run in-cluster after every install and upgrade —
  # CI cannot reach this cluster (ADR-033). `ignoreFailures` stays false, or the hooks are decoration.
  test:
    enable: true
    timeout: 3m
  rollback:
    cleanupOnFail: true
    timeout: 5m
  # Correct a manual `kubectl edit` back to what the chart says. `warn` for now: being told what drifts
  # beats a silent revert mid-investigation. Raise to `enabled` once staging is boring.
  driftDetection:
    mode: warn
  values:
    networkPolicy:
      # The /32 of `database.host` below — NetworkPolicy cannot resolve a name, so two settings for one
      # address, and `scripts/cluster-assertions.sh` fails on a real host with a placeholder CIDR. **A
      # placeholder does NOT fail the render**: `REPLACE-ME…/32` templates and the API server rejects it,
      # rolling the release back several steps from anything mentioning a CIDR. Confirm with
      # `tofu -chdir=infra/environments/staging output postgres_ip`.
      databaseCidr: "10.1.1.10/32"
    database:
      # The k3s node's own private address — PostgreSQL is co-located on staging but reached over the
      # network, so the path has production's shape. Matches `k3s_private_ip` in the staging stack.
      host: "10.1.1.10"
      # Created out of band before the first reconcile, in the TARGET namespace (`event-junkie`), not
      # flux-system: `kubectl create secret generic events-db -n event-junkie --from-literal=username=events
      # --from-literal=password=…`.
      existingSecret: "events-db"
    # Cached venue images (ADR-019). `serving.enabled` is on here first: it is the switch a visitor sees,
    # it tightens `img-src`, and staging is off the public internet.
    images:
      enabled: true
      serving:
        enabled: true
      # The orphan sweep. Reporting mode showed 5 unreferenced images and no stray; a large number would
      # mean the reference query is wrong (#902).
      sweep:
        enabled: true
      storage:
        # The only thing keeping staging's objects away from production's in a shared bucket. The chart
        # refuses to render without it.
        prefix: "staging"
        # Out of band in the target namespace, scoped to this bucket (docs/ops/SECRETS.md).
        existingSecret: "event-junkie-images"
      # The sidecar that generates the derivatives (ADR-020). `event-junkie-imgproxy` has to exist first —
      # a `secretKeyRef` with no `optional` leaves the pod in CreateContainerConfigError.
      imgproxy:
        enabled: true
    # Both stateless services drop to one replica — the one place staging is not production-shaped, and
    # a capacity fact: the node also carries PostgreSQL, which production keeps on a cx23 of its own.
    # Measured at 51% of memory, ~300 MB of it Flux.
    bff:
      replicaCount: 1
      resources:
        requests:
          cpu: "50m"
          memory: "384Mi"
        limits:
          cpu: "1000m"
          memory: "640Mi"
    importer:
      # **Off here: production translates.** Running both billed the same sources twice for a copy nobody
      # reads. `translation_licence` stays PERMITTED.
      translation:
        engine: none
      resources:
        requests:
          cpu: "50m"
          memory: "384Mi"
        limits:
          cpu: "1000m"
          memory: "768Mi"
    frontend:
      replicaCount: 1
    ingress:
      # Does not resolve on the public internet, by design (PLATFORM_SETUP §4a): resolution happens over
      # the WireGuard tunnel.
      host: "staging.event-junkie.de"
      # No redirect domain on staging — the .com 301 is a production concern.
      redirectHosts: []
      # `X-Robots-Tag: noindex, nofollow` on every response (#286). Defence in depth: the real control is
      # that this host has no public address record. It costs the property that an empty `redirectHosts`
      # leaves nothing Traefik-specific rendered; production keeps that property.
      noindex: true
      # The Content-Security-Policy is enforced here, not report-only (#854): the report-only header was
      # loaded in a browser first — every route family, both locales, both themes, zero violations. The
      # chart default stays report-only.
      securityHeaders:
        contentSecurityPolicy:
          reportOnly: false
      tls:
        enabled: true
        secretName: "event-junkie-staging-tls"
    certManager:
      clusterIssuer:
        # Created here because staging is its own cluster with exactly one release, so the singleton problem
        # does not arise.
        create: true
        name: "letsencrypt-staging-dns"
        # A role mailbox, not a person (docs/LEGAL.md §6).
        email: "hello@event-junkie.de"
        # Not a preference: HTTP-01 needs Let's Encrypt to reach the host, and this environment exists to
        # stop that. The TXT record is public; the A record never exists. The webhook answering it is
        # `cert-manager-webhook.yaml`. The token is the one thing NOT automated, created once per cluster in
        # `cert-manager` — not `event-junkie`, because a ClusterIssuer resolves secret references against
        # cert-manager's namespace: `kubectl create secret generic hetzner -n cert-manager
        # --from-literal=token=<hcloud token, read+write>`.
        solver: "dns01"
        # The ACME *staging* endpoint, and it stays there (#265): rate limits are per registered domain and
        # `event-junkie.de` is the same one here, so burning the limit would lock out production. Production
        # issues over HTTP-01, so this endpoint has nothing left to rehearse but account registration.
        server: "https://acme-staging-v02.api.letsencrypt.org/directory"
    tests:
      smoke:
        # The k6 hook (#1697), first here: a week without a false rollback is what production waits for.
        enabled: true
        # The certificate above is from the ACME staging CA, which nothing trusts on purpose.
        verifyTls: false
