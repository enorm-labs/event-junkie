# Traefik binds the node's ports 80 and 443 itself (#1013), so a visitor's address reaches it
# without passing through ServiceLB.
#
# **This replaces `externalTrafficPolicy: Local`, which was measured and was not enough.** k3s did
# aim klipper-lb at the node and its NodePort, and klipper-lb still installed a MASQUERADE, which
# rewrote the source before the packet reached the NodePort.
#
# **`type: ClusterIP` frees the ports** — svclb's own containers declare `hostPort: 80` and `443`.
#
# **A hostPort rather than `hostNetwork`, and the NetworkPolicies decide that.** The chart finds
# Traefik by `podSelector: app.kubernetes.io/name: traefik`. A hostPort leaves the pod its own
# address, so the selector still matches; `hostNetwork` gives it the node's and closes ingress.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      spec:
        type: ClusterIP
    ports:
      web:
        hostPort: 80
      websecure:
        hostPort: 443
    # **A hostPort and a rolling update cannot both work on one node.** The chart's
    # `maxUnavailable: 0` starts the replacement before stopping the old pod, and it cannot
    # schedule while the old one holds 80 and 443. Observed, not predicted: the access-log rollout
    # left a pod `Pending` on "didn't have free ports", and it would never have recovered.
    # `Recreate` stops the old pod first — an ingress gap on every Traefik change, bounded by
    # `terminationGracePeriodSeconds` (60).
    updateStrategy:
      type: Recreate
