# Traefik binds the node's ports 80 and 443 itself (#1013), so a visitor's address reaches it
# without passing through ServiceLB.
#
# **This replaces `externalTrafficPolicy: Local`, which was measured and was not enough.** k3s did
# point klipper-lb at the node and its NodePort rather than the ClusterIP. klipper-lb still installed
# `iptables -t nat -I POSTROUTING -d <nodeIP>/32 -j MASQUERADE`, rewriting the source before the
# packet reached the NodePort where `Local` would have preserved it.
#
# **`type: ClusterIP` is what frees the ports.** svclb's own containers declare `hostPort: 80` and
# `hostPort: 443`, so Traefik cannot hold them while the Service is a LoadBalancer.
#
# **A hostPort rather than `hostNetwork`, and the NetworkPolicies decide that.** The chart finds
# Traefik by `podSelector: app.kubernetes.io/name: traefik`. A hostPort leaves the pod its own
# address, so the selector still matches; `hostNetwork` gives it the node's and closes ingress.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      spec:
        type: ClusterIP
    ports:
      web:
        hostPort: 80
      websecure:
        hostPort: 443
    # **Temporary, and here to measure one thing (#1013).** Traefik logs nothing by default, which
    # is half of why "no IP address is logged" holds. Without a logged source address the hostPort
    # can only be inferred to work from an absent iptables rule, never observed to.
    #
    # **Remove it the same day.** The collector ships every container's stdout to OpenObserve, kept
    # 14 days, so this writes addresses into the log store for as long as it is on. Staging is
    # reachable only through WireGuard, so the only address it can capture is the operator's own —
    # which is what makes it acceptable here and **never on production**. See docs/LEGAL.md §7.5.1.
    logs:
      access:
        enabled: true
        format: json
