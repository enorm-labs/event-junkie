# What Flux syncs for the staging cluster. `flux bootstrap --path=deploy/clusters/staging` points
# its own Kustomization at this directory, and bootstrap adds a generated `flux-system/` alongside
# these files — that directory is machine-written, ~2 MB, and must never be hand-edited.
#
# Order here is presentational only. Kustomize applies these as one set and Flux does not read the
# list as a sequence: what actually orders the installs is `dependsOn` inside the HelmReleases —
# cert-manager, then the webhook, then the application.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # flux-system/ is Flux's own manifests, and listing it here is what makes the cluster
  # self-managing — the standard bootstrap behaviour, which THIS FILE accidentally switched off.
  #
  # A Flux Kustomization pointing at a directory that has no kustomization.yaml walks it
  # recursively and picks up flux-system/ for free. Adding an explicit one, as this file is,
  # replaces that discovery with exactly the list below — so from the moment it existed, Flux's own
  # Kustomization stopped being reconciled by anything except a `flux bootstrap` re-run.
  #
  # That was invisible until #416 put a `decryption` patch in flux-system/kustomization.yaml: the
  # patch rendered perfectly, was committed, merged, and never reached the cluster, and the sync
  # then failed on an encrypted Secret it had no key for. Rendering is not applying.
  - flux-system
  - namespace.yaml
  # The other namespaces the cluster runs, declared rather than left to `createNamespace: true`
  # (#604). A HelmRelease creating its own namespace creates a bare one, and Pod Security Admission
  # is enforced by namespace label — so an undeclared namespace is an ungoverned one, silently.
  # Each file carries the reasoning for the level it sets; `namespace-observability.yaml` in
  # particular sets a level that enforces nothing and says why.
  - namespace-cert-manager.yaml
  - namespace-observability.yaml
  - namespace-default.yaml
  # SOPS-encrypted, decrypted by kustomize-controller with the `sops-age` key (#416,
  # docs/ops/SECRETS.md). Order here is presentational — Flux applies by kind, so the
  # namespace exists before the Secret lands wherever this sits in the list.
  - secrets/events-db.yaml
  - helm-repository-jetstack.yaml
  - helm-repository-hetzner.yaml
  - cert-manager.yaml
  - cert-manager-webhook.yaml
  # OpenObserve (#271). Listed here for the reason this file's own header records: the explicit
  # resource list replaced Kustomize's directory walk, so a file that is not named is a file that
  # renders, lints, merges — and never reaches the cluster.
  - openobserve.yaml
  # Default-deny plus one named allowance per conversation, for the two namespaces that had none
  # (#662). `observability-netpol.yaml` replaces the egress-only `openobserve-netpol.yaml` from
  # #661 and keeps its `openobserve-egress` object under the same name, so the containment for
  # `ZO_SKIP_SSRF_CHECKS` is updated in place rather than deleted and recreated — there is no window
  # in which that flag is set and unbounded.
  #
  # A NetworkPolicy that never reaches the cluster is the most dangerous kind of unnamed file here,
  # and these two are worse than most: the failure of a policy that is *present but wrong* is a pod
  # cut off in silence, while the failure of one that is *absent* is a namespace that looks hardened
  # and is not.
  - observability-netpol.yaml
  - cert-manager-netpol.yaml
  # The Signal bridge (#271). Same rule as above — a file not named here never reaches the cluster.
  - signal-bridge.yaml
  # The collector (#271 item 2). Same rule — unnamed here means it never reaches the cluster.
  - collector.yaml
  # PostgreSQL metrics (#271). Named here or it never reaches the cluster.
  - postgres-exporter.yaml
  - oci-repository.yaml
  - helm-release.yaml
  - notification.yaml
