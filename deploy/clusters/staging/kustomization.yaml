# What Flux syncs for the staging cluster. `flux bootstrap --path=deploy/clusters/staging` points here
# and adds a generated `flux-system/` that must never be hand-edited. Order is presentational;
# `dependsOn` inside the HelmReleases orders the installs. **A FILE NOT NAMED IN `resources:` NEVER
# REACHES THE CLUSTER** — it still renders and lints, so the omission is silent.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Listing flux-system/ is what makes the cluster self-managing, and the easiest entry to forget: a
  # Flux Kustomization with no kustomization.yaml walks the directory recursively, so writing an explicit
  # list is what takes it away — which is how #416's `decryption` patch merged without reaching the cluster.
  - flux-system
  # The five namespaces, the chart repositories, PostgreSQL metrics and the two collectors — identical
  # on both clusters, so `../base` holds them (#953, #1080). Drop this line and seventeen objects leave
  # the cluster at once.
  - ../base
  # SOPS-encrypted, decrypted by kustomize-controller with the `sops-age` key (#416). Flux applies by
  # kind, so the namespace exists before the Secret lands.
  - secrets/events-db.yaml
  - helm-repository-hetzner.yaml
  - cert-manager.yaml
  - cert-manager-webhook.yaml
  - openobserve.yaml
  # Default-deny plus one named allowance per conversation (#662). `observability-netpol.yaml` keeps
  # its `openobserve-egress` object under the old name, so the containment for `ZO_SKIP_SSRF_CHECKS` is
  # updated in place with no window in which the flag is set and unbounded. An absent policy leaves a
  # namespace that looks hardened and is not.
  - observability-netpol.yaml
  - cert-manager-netpol.yaml
  # Not in `../base`, though both clusters want it: that rolls both at once, and staging goes first.
  - traefik-host-ports.yaml
  # The Signal bridge (#271).
  - signal-bridge.yaml
  - oci-repository.yaml
  - helm-release.yaml
  - notification.yaml

# The one field `../base/collector.yaml` leaves for each cluster (#953). `replace` rather than `add`:
# the path has to exist, so removing the key from the base fails this build loudly.
patches:
  - target:
      kind: HelmRelease
      name: openobserve-collector
    patch: |
      - op: replace
        path: /spec/values/k8sCluster
        value: staging
  # The nodes whose patch state the gateway scrapes (#419). `replace`, like `k8sCluster`.
  - target:
      kind: HelmRelease
      name: openobserve-collector
    patch: |
      - op: replace
        path: /spec/values/gateway/receivers/prometheus~1nodes/config/scrape_configs/0/static_configs/0/targets
        value:
          - 10.1.1.10:9100
  # Twice, because the agent is its own release (#709); two literal targets fail loudly when either is renamed.
  - target:
      kind: HelmRelease
      name: openobserve-collector-agent
    patch: |
      - op: replace
        path: /spec/values/k8sCluster
        value: staging
