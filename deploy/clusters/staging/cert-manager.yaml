# cert-manager on staging. The chart's ClusterIssuer template renders a `cert-manager.io/v1` object,
# so **cert-manager must already be installed or the application release fails outright** at an
# unknown kind — why `helm-release.yaml` declares `dependsOn`.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
  annotations:
    kubernetes.io/description: >-
      cert-manager, which issues the staging certificate over DNS-01. Installed by Flux rather than
      by hand so its version is reviewable and its drift is corrected.
spec:
  releaseName: cert-manager
  targetNamespace: cert-manager
  # Where Helm keeps its release secret; left to itself Flux stores it in `flux-system` and
  # `helm list -n cert-manager` disagrees with reality.
  storageNamespace: cert-manager
  interval: 1h
  chart:
    spec:
      chart: cert-manager
      # Pinned exactly, never a range: a range lets a patch release land with no diff, no review and no
      # commit. Bumping this is a pull request.
      version: "v1.21.2"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      interval: 1h
  install:
    createNamespace: true
    remediation:
      retries: 2
  upgrade:
    remediation:
      retries: 2
      strategy: rollback
      # Without this, remediation runs only between attempts and a failed final upgrade is left running.
      # Losing cert-manager quietly means certificates stop renewing, unnoticed for sixty days.
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    crds:
      # OFF BY DEFAULT IN THIS CHART, and the failure is downstream: the cert-manager pods run happily and
      # the *application* release fails on an unknown kind. A values flag, not Flux's `install.crds`:
      # cert-manager templates its CRDs rather than shipping a `crds/` directory.
      enabled: true
      # `helm.sh/resource-policy: keep`, so uninstalling cert-manager does not garbage-collect every
      # Certificate and Issuer with it. Upstream's default; the consequence of flipping it is not recoverable.
      keep: true
    # One of everything: staging shares one node with PostgreSQL and the application, and cert-manager's
    # replicas exist for availability, not throughput.
    replicaCount: 1
    resources:
      requests:
        cpu: "10m"
        memory: "48Mi"
      limits:
        memory: "128Mi"
    webhook:
      replicaCount: 1
      resources:
        requests:
          cpu: "10m"
          memory: "32Mi"
        limits:
          memory: "64Mi"
    cainjector:
      replicaCount: 1
      resources:
        requests:
          cpu: "10m"
          # The memory-hungry one: cainjector caches cluster-wide Secrets and CRDs, so its footprint tracks the
          # cluster. First place to look at an OOMKill here.
          memory: "96Mi"
        limits:
          memory: "256Mi"
    startupapicheck:
      # Kept on: a Job proving the webhook answers before the release reports Ready, which is the failure
      # this dependency chain exists to order. A timeout on a slow first boot is information.
      enabled: true
      resources:
        requests:
          cpu: "10m"
          memory: "32Mi"
        limits:
          memory: "64Mi"
