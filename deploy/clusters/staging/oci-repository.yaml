# comment-lint: allow-file 21 lines of OCIRepository, of which one field failed silently twice.
# The chart source for staging; #264 publishes it on every push to `main`. THE ONE FIELD THIS FILE
# EXISTS FOR IS `semver`, AND IT FAILS SILENTLY — twice, for independent reasons.
#
# **One: the range has to admit prereleases.** Masterminds skips prereleases unless the range says
# otherwise, so `">=0.0.0"` matches nothing, reports Ready, and staging stops moving until somebody
# notices the site is a fortnight old. The `-0` is the entire mechanism.
#
# **Two: the versions have to order.** SemVer compares alphanumeric prerelease identifiers lexically,
# so `0.1.0-snapshot.g<sha>` meant "whichever sha sorts highest in ASCII" — once the sixth-oldest of
# ten, three days stale (#455). Snapshots are `0.1.1-snapshot.<utc-timestamp>.g<sha>`: a digits-only
# identifier compares numerically. The base moved 0.1.0 → 0.1.1 at the same time, a numeric
# identifier ranking BELOW an alphanumeric one; `scripts/version-test.sh` asserts the ordering.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: event-junkie
  namespace: flux-system
  annotations:
    kubernetes.io/description: >-
      The event-junkie Helm chart, pulled from GHCR. Tracks every snapshot published from main.
spec:
  # 1m rather than a laptop reflex's tighter number: Flux's guidance is not to poll below 30s without
  # webhooks, and a Receiver is an inbound endpoint §8's firewall design exists to forbid. A deploy
  # lands within about a minute of the publish.
  interval: 1m
  url: oci://ghcr.io/enorm-labs/charts/event-junkie
  ref:
    semver: ">=0.0.0-0"
  # Set explicitly rather than "first layer found", which works until an artifact grows a second layer.
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  # No secretRef: the packages are public, and making them private would put a classic PAT in this
  # cluster, unscopable to one package. Refuses a chart not signed by our own release workflow (#1425):
  # source-controller checks the cosign Fulcio certificate against these two regexes — a snapshot runs
  # at `refs/heads/main`, a release at `refs/tags/vX.Y.Z`. A chart pushed by hand carries no signature
  # and never reconciles.
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: "^https://token\\.actions\\.githubusercontent\\.com$"
        subject: "^https://github\\.com/enorm-labs/event-junkie/\\.github/workflows/release\\.yml@refs/(heads/main|tags/v[0-9]+\\.[0-9]+\\.[0-9]+)$"
