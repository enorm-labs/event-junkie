# The chart source for staging. #264 publishes it here on every push to `main`.
#
# THE ONE FIELD THIS FILE EXISTS FOR IS `semver`, AND IT IS THE ONE THAT FAILS SILENTLY.
#
# Staging runs snapshots — `0.1.0-snapshot.g<sha>`, a SemVer *prerelease*. Helm's constraint syntax
# (Masterminds) **skips prerelease versions unless the range says otherwise**, so `">=0.0.0"` here
# would match nothing at all: the OCIRepository reconciles happily, reports Ready, and resolves the
# last release — or nothing, if there has never been one. No error is logged anywhere. Staging simply
# stops moving, and the first symptom is somebody noticing the site is a fortnight old.
#
# The `-0` suffix is what admits prereleases. It is two characters and it is the entire mechanism.
#
# ---------------------------------------------------------------------------------------------
# TEMPORARILY PINNED TO A TAG (2026-08-13) — #455. `semver` IS COMING BACK; DO NOT TIDY THIS AWAY.
#
# The range above is correct and still does not work, for a second reason nobody looked for. SemVer
# compares alphanumeric prerelease identifiers **lexically**, and `g<sha>` is effectively random —
# so `">=0.0.0-0"` resolves whichever short sha sorts highest in ASCII, not the newest chart.
#
# Observed on this cluster: ten snapshots published, and Flux selected the sixth-oldest.
#
#     g21cfd20  g69bea59  g8955528  g9c64e89  gaeb1985
#     gc14ccfb  gcc52b77  gdf18a02  gf3c1146  gf6407e3   <- resolved, because f > d
#
# Staging had been three days stale and would not have moved again until a merge produced a sha
# sorting above `f6407e3` — about a 1-in-16 chance per commit, and it can go backwards too. It
# surfaced as a certificate that would not issue, because the stale chart still rendered
# `groupName: acme.hetzner.cloud` against a webhook serving `acme.hetzner.com` (#452 fixed that
# weeks of reading would not have found it; only the cluster did).
#
# So this is a **stopgap**: an explicit tag is deterministic and gets the fixed chart deployed. It
# also defeats the whole point of staging — it no longer follows `main`. #455 makes the snapshot
# identifier monotonic; the moment it lands, this reverts to `semver: ">=0.0.0-0"`.
#
# Production is untouched and does not need to be: its range is `>=0.1.0` with a numeric-triple
# filter, and release versions order correctly.
# ---------------------------------------------------------------------------------------------
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: event-junkie
  namespace: flux-system
  annotations:
    kubernetes.io/description: >-
      The event-junkie Helm chart, pulled from GHCR. TEMPORARILY pinned to one tag (#455) rather
      than tracking snapshots — staging does not follow main until that lands.
spec:
  # 1m rather than the tighter number a laptop reflex picks. Flux's own guidance is not to poll below
  # 30s without webhooks, and we cannot use webhooks: a Receiver is an *inbound* endpoint and §8's
  # firewall design exists to have nothing inbound. So a deploy lands within about a minute of the
  # publish, and that latency is a consequence of the security posture rather than a tuning oversight.
  interval: 1m
  url: oci://ghcr.io/enorm-labs/charts/event-junkie
  ref:
    # Reverts to `semver: ">=0.0.0-0"` when #455 lands. This is the newest published snapshot as of
    # 2026-08-13, and the oldest one carrying #452's cert-manager fixes — verified by reading the
    # published artifact's values rather than by trusting the git history:
    #   helm show values oci://ghcr.io/enorm-labs/charts/event-junkie --version 0.1.0-snapshot.gdf18a02
    tag: "0.1.0-snapshot.gdf18a02"
  # Set explicitly rather than left to the default "first layer found". A Helm chart pushed by
  # `helm push` carries this media type; relying on layer ordering works until an artifact grows a
  # second layer (a provenance or SBOM attestation, both of which #443 proposes adding).
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  # No secretRef: the GHCR packages are public and pull anonymously, which is why the chart's
  # `image.pullSecrets` is empty too. Making them private would put a classic PAT in this cluster —
  # GitHub Packages does not support fine-grained tokens — and that token cannot be scoped to one
  # package. See docs/PLATFORM_SETUP.md §3.
  #
  # No `verify:` yet either, and that is the interesting gap: Flux can refuse to reconcile a chart
  # that is not cosign-signed by our own workflow (`spec.verify.provider: cosign` plus
  # `matchOIDCIdentity`). #443 proposes signing the artifacts; the day it lands, this is where the
  # signature stops being decorative metadata and becomes a gate.
