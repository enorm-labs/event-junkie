# PostgreSQL metrics — #271 item 2's remaining third, and ADR-015's "connection count, slow queries,
# disk usage" row.
#
# **It runs in the cluster and connects over the private network**, rather than on the database host.
# That is not a compromise: staging co-locates PostgreSQL on the k3s node while production gives it a
# dedicated one, and the *connection path is the same shape either way* — which is the same reason
# the application's own `database.host` is an address rather than `localhost`. One manifest works
# on both topologies.
#
# ## What this does NOT cover, so it is not assumed later
#
# **Disk usage on a dedicated database node.** The collector's agent already scrapes `filesystem` and
# `disk` hostmetrics from every node it runs on, so on staging — where PostgreSQL sits on the k3s
# node — the disk-filling alert is already covered without this. **On production the database node is
# outside the cluster, so no agent runs there and nothing reports its free space.** This exporter
# reports database *size*, which grows for reasons unrelated to the disk filling. Closing that gap is
# a separate piece of work and it belongs to whoever provisions the dedicated node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: observability
  annotations:
    kubernetes.io/description: >-
      Exports PostgreSQL statistics for the collector to scrape. Reads with a dedicated monitoring role, not the application's.
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-exporter
      annotations:
        # The same discovery mechanism the application pods use (#590). Without these the collector
        # cannot find it, and the failure is silence rather than an error.
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "9187"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
          imagePullPolicy: IfNotPresent
          env:
            # The whole connection string is the credential, so it comes from the Secret as one
            # value rather than being assembled from parts here.
            - name: DATA_SOURCE_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-exporter
                  key: DATA_SOURCE_NAME
          ports:
            - name: metrics
              containerPort: 9187
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              # It queries `pg_stat_*` on an interval and holds nothing. Tight on purpose: this is
              # the smallest thing in the observability namespace and should stay that way.
              memory: "128Mi"
              cpu: "200m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            # It reads no files and writes none. Unlike signal-cli, this one can be locked down
            # fully — and it was checked rather than assumed.
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: observability
  annotations:
    kubernetes.io/description: >-
      Scraped by the collector gateway. No Ingress — these metrics name databases and connection counts, which is not public information.
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres-exporter
  ports:
    - name: metrics
      port: 9187
      targetPort: metrics
