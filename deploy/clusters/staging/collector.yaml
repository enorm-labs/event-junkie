# The metrics and logs collector — #271 item 2, and the reason OpenObserve currently holds nothing.
#
# #415 built the meters and #590 annotated the pods so a collector can find them. **Nothing was
# collecting.** OpenObserve has been running since 2026-08-20 storing only records fed to it by hand
# to prove the bucket works.
#
# ## Two charts, and the order is not a preference
#
# The collector chart renders `OpenTelemetryCollector` and `Instrumentation` custom resources, and
# **Helm resolves kinds up front** — so installing it before the operator's CRDs exist fails with
# `ensure CRDs are installed first`, not with a wait. Found on a k3d rehearsal, and it is the same
# shape as the Traefik CRD wait `scripts/k3d-rehearsal.sh` already performs for the application
# chart. `dependsOn` below is what makes that ordering a property of the config rather than of
# whoever applies it.
#
# ## What the rehearsal established, so it is not rediscovered
#
# - **The agent does not scrape the app pods; the gateway does.** The agent's metrics pipeline is
#   `kubeletstats` and `hostmetrics` only. The `prometheus` receiver with the autodiscovery job lives
#   in the gateway, so a pod is scraped from wherever the gateway runs — which is what made the
#   NetworkPolicy in #591 necessary.
# - **Discovery is by `prometheus.io/*` annotation and nothing else.** A pod without them is invisible
#   to collection while looking perfectly healthy.
# - **Footprint, measured:** 938Mi for the whole path — this plus OpenObserve — against ADR-015's
#   ~1.5 GB ceiling. That was k3d on arm64, so **it is an expectation to check against this node, not
#   a number to trust**. If it lands materially higher, criterion 2 is the thing to re-judge.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: open-telemetry
  namespace: flux-system
  annotations:
    kubernetes.io/description: >-
      The upstream OpenTelemetry chart repository, for the operator the collector's custom resources need.
spec:
  interval: 1h
  url: https://open-telemetry.github.io/opentelemetry-helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-operator
  namespace: flux-system
  annotations:
    kubernetes.io/description: >-
      The OpenTelemetry operator. Installed for its CRDs and its reconciliation of the collector custom resources — not for auto-instrumentation, which is
      disabled below.
spec:
  releaseName: otel-operator
  targetNamespace: observability
  storageNamespace: observability
  interval: 1h
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      remediateLastFailure: true
  chart:
    spec:
      chart: opentelemetry-operator
      version: "0.121.0"
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: flux-system
      interval: 1h
  values:
    admissionWebhooks:
      certManager:
        # cert-manager IS installed here, but pointing the operator at it couples this release to a
        # ClusterIssuer and a DNS-01 token for a certificate nothing outside the cluster ever sees.
        # A self-signed webhook cert is the smaller dependency for an internal admission endpoint.
        enabled: false
      autoGenerateCert:
        enabled: true
    manager:
      collectorImage:
        # The `-k8s` distribution rather than `-contrib`: it carries the Kubernetes and Prometheus
        # receivers this needs and leaves out the several hundred exporters it does not.
        repository: otel/opentelemetry-collector-k8s
      resources:
        requests:
          memory: "64Mi"
          cpu: "50m"
        limits:
          # Measured at 35Mi in the rehearsal. The operator only reconciles CRs; it is not on the
          # data path.
          memory: "128Mi"
          cpu: "200m"
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: openobserve-collector
  namespace: flux-system
  annotations:
    kubernetes.io/description: >-
      The same OpenObserve chart repository the server comes from, declared separately because a HelmRepository is per-URL and this one is reused by name.
spec:
  interval: 1h
  url: https://charts.openobserve.ai
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openobserve-collector
  namespace: flux-system
  annotations:
    kubernetes.io/description: >-
      Scrapes the annotated application pods and the node, and ships to OpenObserve. Depends on the operator for its CRDs and on OpenObserve for somewhere to
      send to.
spec:
  releaseName: o2c
  targetNamespace: observability
  storageNamespace: observability
  interval: 1h
  # Both, and for different reasons. The operator provides the CRDs this chart's resources are
  # instances of — without it the install fails outright rather than waiting. OpenObserve is the
  # destination; starting the collector first would only produce export errors until it appeared.
  dependsOn:
    - name: otel-operator
    - name: openobserve
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      remediateLastFailure: true
  chart:
    spec:
      chart: openobserve-collector
      version: "0.4.6"
      sourceRef:
        kind: HelmRepository
        name: openobserve-collector
        namespace: flux-system
      interval: 1h

  # The collector authenticates to OpenObserve as the root user, from the same hand-made Secret the
  # server reads. Injected rather than written here for the reason #598 gives: a credential under
  # `spec.values` is a credential in a public repository.
  #
  # The header is `Basic <base64 of email:password>`, which is why it is a separate key rather than
  # composed from the two the server uses — building it here would mean the two halves passing
  # through Helm values in the clear.
  valuesFrom:
    - kind: Secret
      name: openobserve-credentials
      valuesKey: O2_BASIC_AUTH_HEADER
      targetPath: exporters.otlphttp/openobserve.headers.Authorization
    - kind: Secret
      name: openobserve-credentials
      valuesKey: O2_BASIC_AUTH_HEADER
      targetPath: exporters.otlphttp/openobserve_k8s_events.headers.Authorization

  values:
    k8sCluster: staging
    # The operator is installed above, as its own release. Leaving this true would make the chart
    # try to install a second copy as a subchart.
    opentelemetry-operator:
      enabled: false
    exporters:
      otlphttp/openobserve:
        # In-cluster, so plain HTTP over the pod network rather than through the ingress — which does
        # not route OpenObserve at all, deliberately.
        endpoint: http://openobserve-openobserve-standalone.observability.svc.cluster.local:5080/api/default/
      otlphttp/openobserve_k8s_events:
        endpoint: http://openobserve-openobserve-standalone.observability.svc.cluster.local:5080/api/default/
        headers:
          stream-name: k8s_events

    # ## Stripping the identity attributes that churn — metrics only
    #
    # **Every metric arrives carrying about 29 resource attributes**, and a dozen of them change
    # whenever a pod is replaced. A new value in any one of them is a NEW TIME SERIES, so:
    #
    #   - a pod restart starts a new series, which is defensible — a counter really did reset;
    #   - **a deploy also starts a new series**, which is not. `container.image.tag` is a snapshot
    #     version (`0.1.1-snapshot.20260820145738.g12be9a8`), so every push to main multiplies the
    #     series count for every metric the pod emits, permanently, until retention expires it.
    #
    # Measured on staging: a bare `db_events` returned **six series in one hour** for what is
    # logically two, and an *instant* PromQL query at `now` returned **nothing at all**, because the
    # newest series had not been written within the lookback window. That is the failure mode this
    # prevents — not an error, just a panel that is silently empty.
    #
    # **`k8s.pod.name` is deliberately KEPT.** Dropping it would merge two replicas of the same
    # deployment into one series, and for a counter that is not a tidier graph but a wrong one.
    # Everything deleted below is either per-deploy churn or a duplicate of something kept.
    #
    # **Metrics only, not logs or traces.** A pod name in a log line is how you find the log; the
    # `logs/k8s_events` and `traces` pipelines are left alone. This is also why the deletions are a
    # separate processor rather than a narrower `k8sattributes.extract.metadata` list — that setting
    # is shared by all three pipelines.
    #
    # **This changes nothing about the agent**, which is a separate collector and the only thing
    # holding `kubeletstats`. Its `k8s_pod_*` metrics keep their pod names, which they need: there
    # the pod IS the subject of the measurement rather than a label on it.
    #
    # **Nested under `gateway:`, unlike `exporters:` above.** The chart puts `exporters` at the top
    # level because both collectors share them, but `processors` and `service` exist once per
    # collector — so the same keys at the top level are silently ignored, and the render looks fine
    # while the processor is simply absent. `helm template` plus a `yq` query for the processor is
    # what catches that; the rendered pipeline list is not enough on its own.
    # ## Both collectors ship with `resources: {}`, and that is how a node dies
    #
    # **The chart sets no requests and no limits on either collector**, with the "conscious choice for
    # the user" comment that upstream charts use — and until now the choice was never made. The
    # gateway was measured at **928Mi with nothing above it**: not scheduled against, not capped, free
    # to take the node with it. That is not a hypothetical failure mode here, it is the 2026-08-20
    # global OOM (#271), where the kernel killed OpenObserve while the API server flapped.
    #
    # **The number is not a guess: it is the limiter's own worst case.** Both collectors run a
    # `memory_limiter` processor that refuses data at `limit_mib` and forces GC above it — the
    # graceful, *countable* form of shedding. The container limit therefore has to sit **above**
    # `limit_mib + spike_limit_mib`, so that the limiter is always what bites first. Below it, the
    # kernel wins the race and the pod dies with everything in flight, reporting nothing:
    #
    #     agent     memory_limiter 512 + 128 spike  ->  limits.memory 640Mi
    #     gateway   memory_limiter 1024 + 256 spike ->  limits.memory 1280Mi
    #
    # **Requests are steady state, not the ceiling**, which is what the scheduler needs and what the
    # 08-20 post-mortem's "floor before observability" arithmetic was missing: an unrequested pod is
    # invisible to that sum.
    agent:
      resources:
        requests:
          memory: "128Mi"
          cpu: "50m"
        limits:
          # Measured at 98Mi steady on staging. 640Mi is the limiter's ceiling plus its spike
          # allowance, not headroom for growth — if the agent ever needs this much, the limiter has
          # been refusing data for some time and that is the thing to look at.
          memory: "640Mi"
          cpu: "500m"

    gateway:
      resources:
        requests:
          # 928Mi today, but that was a queue backed up behind #625's rejected writes rather than a
          # working set. Revisit once a week of post-fix data exists; too high a request wastes the
          # node, too low and the scheduler is again unaware of the largest pod in the namespace.
          memory: "512Mi"
          cpu: "100m"
        limits:
          memory: "1280Mi"
          cpu: "1"

      processors:
        # ## Dropping the metrics nothing here will ever query
        #
        # **One metric was 47% of every row stored and 38% of the bytes**: the k3s API server's
        # `apiserver_request_duration_seconds` histogram, at 385,752 rows and 278 MB. Its cardinality
        # is verb x resource x scope x bucket, so it is enormous on a cluster doing almost nothing.
        #
        # Measured before this change — 983 streams, 822,942 rows, 729 MB total:
        #
        #     apiserver_*            51.5% of rows, 41.9% of bytes   (10 streams)
        #     go_*                   10.5%          14.6%            (164 streams)
        #     kube_*                 10.9%           8.1%
        #     controller_runtime_*    3.7%           5.4%
        #     workqueue_*             2.9%           4.2%
        #     otelcol_*               2.1%           3.3%
        #     gotk_*                  1.7%           2.5%
        #     process_* rest_client_* 1.0%           1.3%   <- process_ deliberately NOT dropped
        #
        # **This is the lever, and #611's label-stripping was not.** That change was right for
        # query correctness — a deploy no longer starts a new series — but the volume was never in
        # the application's metrics. `importer_source_last_success`, the meter the whole project
        # cares about, is 0.7% of rows.
        #
        # ## What is dropped, and the principle
        #
        # **Runtime internals of software we do not operate, and histograms of it.** `go_*` describes
        # the garbage collector of controllers Kubernetes already restarts when they fail; nothing
        # here would act on it. The histograms are the same argument plus a cardinality multiplier.
        #
        # **`apiserver_request_total` is deliberately KEPT** while its duration histogram goes. The
        # count carries "is the API server erroring", which is what mattered during the 2026-08-20
        # OOM; the latency distribution is what costs 278 MB. `_count` and `_sum` survive for the
        # rest, so a mean is still available where a percentile is not.
        #
        # **Our own meters are untouched** — verified per family against the live data rather than
        # assumed from the prefix, which is how the `process_` mistake above was caught — as are
        # `pg_*`, `k8s_*`, `system_*`, `container_*`,
        # `certmanager_*`, `traefik_*`, `jvm_*` and `kube_*` — the four alerts #271 still owes
        # (disk filling, certificate expiry, site down, importer failing) are all written against
        # those, and `kube_pod_*` is how a restart loop becomes visible.
        #
        # **Filtered by BASE NAME, not by the `_bucket` suffix**, and that distinction is the whole
        # trap here. OpenObserve shows `apiserver_request_duration_seconds_bucket` as a stream, but
        # that name does not exist in this pipeline: the Prometheus receiver rebuilds the histogram
        # into a single OTLP metric called `apiserver_request_duration_seconds`, and OpenObserve
        # re-expands it into `_bucket`/`_count`/`_sum` at ingest. A rule matching `_bucket$` here
        # would match nothing at all and look like it worked. The give-away is the bare stream
        # sitting at `docs=0` next to the three suffixed ones — that is the name the collector sends.
        filter/drop_infrastructure_noise:
          # A condition that fails to evaluate skips rather than tearing down the pipeline. OTTL is
          # parsed at startup, so a syntax error still fails fast and visibly.
          error_mode: ignore
          metrics:
            # A metric is DROPPED when any condition here is true.
            metric:
              # Go runtime and Kubernetes client-library internals, whole families.
              #
              # **`process_` is NOT in this list, and that is a correction rather than an
              # oversight.** It was, and it silently took five of our own metrics with it:
              # `process_` is a mixed namespace. The Go Prometheus client publishes
              # `process_cpu_seconds_total`, `process_resident_memory_bytes`, `process_open_fds`
              # and friends — cert-manager, coredns — while **Micrometer publishes
              # `process_cpu_usage`, `process_uptime_seconds`, `process_cpu_time_ns_total` and
              # `process_files_*` from the BFF and the importer.** A prefix cannot tell them apart.
              #
              # The whole `process_` family is ~0.7% of rows and ~1.0% of bytes, so there is nothing
              # here worth the risk of dropping application metrics to save. Left in.
              - 'IsMatch(name, "^(go|rest_client|workqueue)_")'
              # **`postgres-exporter` is 60% of everything ingested, for one metric anybody
              # queries.** Measured 2026-08-21 from the bucket itself — objects written after 06:30,
              # so after every earlier filter was already live:
              #
              #     pg_*         1810     <- this
              #     kube_*        440
              #     otelcol_*     195
              #     jvm_*         125
              #
              # 362 distinct `pg_*` streams, and `deploy/dashboards/` queries exactly one of them.
              # That is not a rounding error in the budget, it is the budget.
              #
              # **It is stream COUNT that hurts, not row count.** OpenObserve holds arrow batches per
              # stream inside the memtable, so 362 near-idle streams cost far more than the row
              # figures suggest.
              #
              # **Correction, 2026-08-23:** this paragraph used to explain the HTTP 503s by saying the
              # pod was "overflowing at 700Mi of 1536Mi, nowhere near its ceiling". The 700Mi was the
              # container's RSS and the ceiling is not the container's — it is a separate 25%-of-cgroup
              # memtable limit that the default rotation threshold sits above and can never reach.
              # #625 has the arithmetic and `openobserve.yaml`'s `ZO_MAX_FILE_SIZE_IN_MEMORY` is the
              # fix. Cutting the stream count was still worth doing and still helped — it lengthened
              # the interval between overflows — but it was treating a symptom.
              #
              # The allowlist keeps what a single-node database is actually worth watching: is it up,
              # how big is it, how many connections, is it committing, is it deadlocking, and did the
              # exporter itself fail. Everything else is reversible — the exporter still produces it,
              # this only decides what is stored.
              - 'IsMatch(name, "^pg_") and not IsMatch(name, "^pg_(up|database_size_bytes|database_connection_limit|locks_count|exporter_last_scrape_error|stat_database_(numbackends|xact_commit|xact_rollback|deadlocks|blks_hit|blks_read))$")'
              # The single biggest stream in the system.
              - 'name == "apiserver_request_duration_seconds"'
              # Reconcile-latency histograms from the operators and Flux.
              - 'name == "controller_runtime_reconcile_time_seconds"'
              - 'name == "gotk_reconcile_duration_seconds"'
              # The collector describing the size of its own batches.
              - 'IsMatch(name, "^otelcol_.*_batch_send_size$")'

        resource/strip_metric_identity:
          attributes:
            # Per-deploy churn. The reason this change exists.
            - key: container.image.tag
              action: delete
            - key: service.version
              action: delete
            - key: k8s.replicaset.name
              action: delete
            - key: k8s.replicaset.uid
              action: delete
            # Per-pod churn that `k8s.pod.name` already covers.
            - key: k8s.pod.uid
              action: delete
            - key: k8s.pod.start_time
              action: delete
            - key: service.instance.id
              action: delete
            # The scrape target's address. Stable only until the pod moves, and `k8s.pod.name` is the
            # useful form of the same fact.
            - key: server.address
              action: delete
            - key: server.port
              action: delete
            - key: url.scheme
              action: delete
            # Stable, so not churn — but stored on every row, and nothing queries them. `k8s.cluster`
            # is set by the `attributes` processor and is the readable form of the uid.
            - key: container.image.name
              action: delete
            - key: k8s.cluster.uid
              action: delete

      service:
        pipelines:
          # ## Twenty-seven object kinds, six of which anybody would look at
          #
          # The chart's `logs/k8s_events` pipeline watches **every** workload, RBAC and networking
          # kind in the cluster. Counted from the gateway's own receiver metrics over 48 hours, that
          # produced 40,981 log records, of which:
          #
          #     crds            33,408   <- 81.5% of everything, a 5-minute PULL of every CRD
          #     events           4,726
          #     pods               897
          #     nodes              571
          #     replicasets        474   <- deploy churn, and `deployments` already says it
          #     deployments        378
          #     endpoints          226
          #     networkpolicies    144
          #     services            54
          #     serviceaccounts     54
          #     configmaps          36
          #     ingresses           18
          #     statefulsets         6
          #     the other 14         0
          #
          # **`crds` is not a watch, it is a `mode: pull` every five minutes** — the full spec and
          # status of every CustomResourceDefinition in the cluster, which on a cluster running Flux,
          # cert-manager and the OTel operator is a great deal of YAML nobody will ever query. The
          # chart carries a `transform/strip_crd_spec` processor whose entire purpose is to make that
          # receiver survivable; with the receiver gone the processor has nothing to do, so it comes
          # out of the list below too. **Re-adding `k8sobjects/crds` means re-adding it.**
          #
          # **The memory argument matters as much as the volume.** Each of these is a client-go
          # informer holding its object set in the gateway's heap — 21 fewer of them is the other
          # half of why that pod sat at 928Mi.
          #
          # **What is kept, and why each one earns it:**
          #
          #   - `events`       — the reason the pipeline exists: OOMKilled, FailedScheduling,
          #                      ImagePullBackOff. This is the stream you read after an incident.
          #   - `pods`         — phase transitions. **kube-state-metrics is not installed** (its
          #                      scrape target has failed since day one), so this is the only record
          #                      of a pod's lifecycle we have.
          #   - `nodes`        — node conditions. MemoryPressure on this node is exactly what nothing
          #                      was watching on 2026-08-20.
          #   - `deployments`  — the three application workloads.
          #   - `statefulsets` — OpenObserve and this gateway, which are the things that break.
          #   - `daemonsets`   — the agent. Zero records so far, which is what healthy looks like.
          #
          # **`jobs` and `cronjobs` are deliberately dropped and deliberately named here**, because
          # the reason is "nothing in this cluster is one yet" rather than "they do not matter". The
          # importer is a Deployment with its own scheduler; the backups are systemd timers on the
          # node. The day either becomes a Job, this list is where that gets noticed.
          #
          # **This does not shrink the ClusterRole.** The chart grants get/list/watch on all of these
          # statically, so the permission survives the watch. Worth its own change; not this one.
          logs/k8s_events:
            receivers:
              - k8sobjects/events
              - k8sobjects/pods
              - k8sobjects/nodes
              - k8sobjects/deployments
              - k8sobjects/statefulsets
              - k8sobjects/daemonsets
            # Restated for the same reason the metrics list below is — Helm replaces lists — and
            # minus `transform/strip_crd_spec`, whose only receiver is gone.
            processors:
              - memory_limiter
              - resourcedetection
              - attributes
              - k8sattributes
              - batch
          metrics:
            # **Restated in full because Helm replaces lists rather than merging them**, so naming
            # only the new processor here would drop the other five. Order matters: this has to run
            # after `k8sattributes`, which is what adds most of the attributes being deleted, and
            # before `batch`.
            processors:
              - memory_limiter
              # **First, immediately after the limiter**, because two thirds of what arrives is
              # about to be thrown away and there is no reason to enrich it first. `k8sattributes`
              # in particular does pod lookups per resource.
              - filter/drop_infrastructure_noise
              - resourcedetection
              - attributes
              - k8sattributes
              - resource/strip_metric_identity
              - batch
