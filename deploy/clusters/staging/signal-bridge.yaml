# The Signal alert bridge — deployed, unregistered and **not a destination**: the alert rules go by
# e-mail, and the Signal route waits for numberless registration in signal-cli (#877). **Signal rather
# than Telegram** (PLATFORM_SETUP §4.1): alert bodies carry venue names, error strings and possibly IP
# addresses, and Signal is end-to-end encrypted where Telegram's Bot API is plaintext to Telegram.
# **This layer cannot report the node being dead** — that is what `site-probe.yml` and healthchecks.io
# are for, off Hetzner. **Registration is a manual step, once, and losing it is silent**: until an
# account is registered, the pod answers health checks and sends nothing (docs/ops/SECRETS.md). The
# registration state lives on the PVC below; lose the PVC and alerting stops without saying so.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: signal-cli
  namespace: observability
  annotations:
    kubernetes.io/description: >-
      signal-cli's registration state. Small, but losing it means re-registering the number by hand and alerting is silent until somebody notices.
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Registration state is kilobytes; the smallest the storage class honours.
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signal-cli
  namespace: observability
  annotations:
    kubernetes.io/description: >-
      signal-cli-rest-api, the thing OpenObserve posts alerts to. One replica, deliberately — two would race for the same registration state on one PVC.
spec:
  # One, and not for capacity: the registration state is single-writer, the ADR-008 argument.
  replicas: 1
  strategy:
    # The PVC is ReadWriteOnce, so a rolling update deadlocks: the new pod cannot mount until the old one
    # lets go. Recreate makes the gap explicit.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: signal-cli
  template:
    metadata:
      labels:
        app.kubernetes.io/name: signal-cli
    spec:
      # Nothing here talks to the Kubernetes API, so the token would be a credential for no reason.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: signal-cli
          # The `-rootless` variant, for `restricted` Pod Security Admission: the default image starts as root
          # and drops privileges. Pinned by tag and digest.
          image: bbernhard/signal-cli-rest-api:0.100-rootless@sha256:7f80cec95fc36408fae6bdc6b4534764d825d5bd02c5772db8740842bdd257f0
          imagePullPolicy: IfNotPresent
          # **Bypassing the image's s6-overlay init, deliberately.** `/init` demands CAP_SETGID, then CHOWN and
          # FOWNER to fix up `/run` — four capabilities for a pod that otherwise needs none, measured one at a
          # time against the real image. Kubernetes is already the supervisor. Running the binary directly
          # starts clean as UID 1000 with `drop: [ALL]`. **What this gives up**: s6 also starts a
          # `signal-json-rpc` daemon, so switching MODE to `json-rpc` means revisiting this decision.
          command: ["/usr/bin/signal-cli-rest-api"]
          env:
            # `normal` is the JVM mode §4.1 budgeted for. `native` (GraalVM) is the lever if the node gets tight —
            # a behaviour change, not a tuning knob.
            - name: MODE
              value: "normal"
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: state
              mountPath: /home/.local/share/signal-cli
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              # 320Mi against §4.1's ~150–250 MB, above the range: a JVM that OOMs while delivering an alert is a
              # failure of the thing that reports failures.
              memory: "320Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            # NOT read-only, the exception: signal-cli writes registration and session state under the mount and
            # scratch inside the image, and a wrong guess at the paths breaks alerting rather than a build. Worth
            # retrying now that s6 is out of the picture.
            readOnlyRootFilesystem: false
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: signal-cli
---
apiVersion: v1
kind: Service
metadata:
  name: signal-cli
  namespace: observability
  annotations:
    kubernetes.io/description: >-
      Reached only from inside the cluster, by OpenObserve's webhook destination. No Ingress: this API can send messages as us, so exposing it is a way to let
      somebody else do that.
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: signal-cli
  ports:
    - name: http
      port: 8080
      targetPort: http
