apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
# Added by hand, and HERE rather than in gotk-sync.yaml, which `flux bootstrap` regenerates; a patch
# in this file is Flux's documented place (#416, docs/ops/SECRETS.md). `sops-age` must already exist
# in flux-system under a name ending in `.agekey` — Flux ignores any other name, silently. Without it
# this Kustomization stops reconciling and takes every deploy with it, so the secret goes on the
# cluster BEFORE this merges. **AFTER bootstrap, never before**: bootstrap runs `kustomize build`
# over this directory before it writes `gotk-sync.yaml`, so a `resources:` entry naming that file
# points at something that cannot exist yet.
patches:
  - patch: |
      - op: add
        path: /spec/decryption
        value:
          provider: sops
          secretRef:
            name: sops-age
    target:
      kind: Kustomization
      name: flux-system

  # Pod Security Admission on flux-system (#604), a patch for the same reason: the Namespace lives in
  # `gotk-components.yaml`, which `flux bootstrap` regenerates, and an unlabelled namespace admits
  # everything and reports nothing. **Flux ships `warn: restricted` and nothing else** — a warn label
  # returns a message to whoever created the pod, and here that is a controller — so this adds
  # `enforce` and `audit`. `restricted` is verified: all four controllers carry `runAsNonRoot`,
  # `seccompProfile: RuntimeDefault`, `capabilities.drop: [ALL]` and no hostPath. **Re-check after a
  # Flux upgrade**: a controller that will not schedule takes every deploy with it, including the one
  # that would relax the label — the argument for pinning `enforce-version`.
  - patch: |
      - op: add
        path: /metadata/labels/pod-security.kubernetes.io~1enforce
        value: restricted
      - op: add
        path: /metadata/labels/pod-security.kubernetes.io~1enforce-version
        value: v1.34
      - op: add
        path: /metadata/labels/pod-security.kubernetes.io~1audit
        value: restricted
    target:
      kind: Namespace
      name: flux-system
