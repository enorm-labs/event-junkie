# comment-lint: allow-file 89 lines of config, of which two upstream defaults silently drop data (#625).
# OpenObserve on production — the same standalone chart staging has run since #271, on the cluster
# whose failures a visitor sees (#880). ADR-015's trial ran on staging and nothing here re-argues
# it; what differs from that file is marked, and what is unmarked is deliberately identical.
#
# **The `openobserve-standalone` chart, NOT `openobserve`.** The plain chart deploys microservices —
# ingester, querier, router, scheduler, compactor and `o2ai` at two replicas — nothing like the
# footprint ADR-015 compared, and it would not fit a node already running two JVMs. Standalone is one
# StatefulSet and one PVC, and every measured number in ADR-015 is standalone's, so **picking the
# wrong one silently invalidates criterion 2**, which the whole decision turned on.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openobserve
  namespace: flux-system
  annotations:
    kubernetes.io/description: >-
      Logs, metrics and alerting for production. Backed by the same event-junkie-o2 bucket staging writes to, under a production/ key prefix against
      staging's staging/ — the separation the backups and images buckets already make between the two environments.
spec:
  releaseName: openobserve
  targetNamespace: observability
  # Where Helm keeps its release secret (cert-manager.yaml gives the same reasoning): left alone,
  # Flux stores it in flux-system while the objects live elsewhere, so `helm list -n observability`
  # disagrees with reality for anyone debugging.
  storageNamespace: observability
  interval: 1h
  # **How long Helm waits for the rollout, and it has to exceed the startup window below** (#924).
  # The default is five minutes. A pod that needs longer than that to answer is marked `Failed`,
  # remediation rolls the release back to the template that caused the problem, and the release
  # stalls — which is exactly what happened on staging: the fix could not deploy because deploying
  # it required the pod it fixes to already be healthy.
  timeout: 10m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      # Explicit because the default is the trap #414's flux-break rehearsal found: without it a
      # failed upgrade is retried and then left running, rather than rolled back.
      remediateLastFailure: true
  chart:
    spec:
      chart: openobserve-standalone
      # Pinned, not a range. 1.0.1 followed staging by a night, as a major always does here: v1.0.0
      # migrates the metadata sqlite forward on start, and a rollback across that is untested (#1571).
      version: "1.0.1"
      sourceRef:
        kind: HelmRepository
        name: openobserve
        namespace: flux-system
      interval: 1h

  # **The whole reason `valuesFrom` is used at all.** The chart takes `auth.ZO_S3_ACCESS_KEY` and
  # `auth.ZO_S3_SECRET_KEY` as plain values, so putting them under `spec.values` would put live
  # Object Storage credentials in a public repository in plaintext. `existingRootUserSecret` covers
  # the root user and nothing else, so Flux merges these two in at reconcile time instead.
  #
  # Nothing here creates the Secret (docs/ops/SECRETS.md). Until it exists this release reconciles
  # into a failed state, which is intended: a missing credential should stop the deploy, not produce
  # a running server nobody can log into.
  valuesFrom:
    - kind: Secret
      name: openobserve-credentials
      valuesKey: ZO_S3_ACCESS_KEY
      targetPath: auth.ZO_S3_ACCESS_KEY
    - kind: Secret
      name: openobserve-credentials
      valuesKey: ZO_S3_SECRET_KEY
      targetPath: auth.ZO_S3_SECRET_KEY

  values:
    # **What `restricted` asks of a pod that needs no privilege** (#709). The chart already runs the
    # server as UID 10000 with `runAsNonRoot`; these are the three fields it leaves empty, and the
    # dry run in `namespace-observability.yaml` named exactly them. `podSecurityContext` merges with
    # the chart's map, so `fsGroup`, `runAsUser` and `runAsGroup` keep their defaults. Object storage
    # is reached over HTTPS and 5080 is unprivileged, so dropping every capability costs nothing.
    # `OnRootMismatch` skips the kubelet's chown of every inode on the data volume at each start
    # (#1519): 13 GB and 1.26 million files on production, four minutes per pod start.
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
      fsGroupChangePolicy: OnRootMismatch

    auth:
      # Root credentials from the same hand-made Secret. The chart reads the two keys named here
      # directly, so they never pass through Helm values at all.
      existingRootUserSecret:
        name: openobserve-credentials
        emailKey: ZO_ROOT_USER_EMAIL
        passwordKey: ZO_ROOT_USER_PASSWORD

    config:
      # Object storage rather than local disk, which is the point of the bucket: ADR-015 wants log
      # retention to stop competing with the node's disk, and LEGAL.md §7.5 needs that retention to
      # be a policy something enforces rather than an intent.
      #
      # **`ZO_LOCAL_MODE` stays `true`, and the storage switch is the line below it.** The flag
      # chooses *single-node versus cluster*, not disk versus S3 — set it `false` and the pod
      # crash-loops on `Meta store only supports postgres in cluster mode`, cluster mode requiring a
      # Postgres meta store where this uses the sqlite default. `ZO_LOCAL_MODE_STORAGE` is what
      # actually moves the data off the disk, and it works in the mode we want.
      ZO_LOCAL_MODE: "true"
      ZO_LOCAL_MODE_STORAGE: "s3"
      ZO_S3_PROVIDER: "s3"
      ZO_S3_SERVER_URL: "https://fsn1.your-objectstorage.com"
      # Hetzner enforces the region in the request signature and rejects a mismatch — the same trap
      # infra/bootstrap/versions.tf documents for the MinIO provider. The chart's default is
      # `us-east-2`, which is never right here.
      ZO_S3_REGION_NAME: "fsn1"
      ZO_S3_BUCKET_NAME: "event-junkie-o2"

      # **One bucket, two environments, and this line is what keeps them apart** (#880). The same
      # separation `s3://event-junkie-backups/<environment>/` and the images bucket's
      # `storage.prefix` already make, rather than a fourth bucket needing a second lifecycle rule
      # to keep LEGAL.md §7.5 true.
      #
      # **Staging now takes `staging/` too, and the question that kept it at the root is answered.**
      # The file list stores keys **relative** to the prefix, and this instance is the proof: it
      # records `files/default/…` internally while writing under `production/`. So adding a prefix
      # to a store that already holds indexed Parquet is what breaks it, and staging's move was
      # therefore paired with a wipe of the PVC holding that list.
      #
      # **Nothing writes at the root any more**, which makes the root the assertion rather than
      # staging's address: an object appearing there is a dropped setting on either cluster. The
      # 90-day backstop in `infra/bootstrap/storage.tf` still clears what staging left behind.
      #
      # **In `config:` rather than `extraEnv`, unlike the flags below** — checked rather than
      # assumed, because the chart drops an unknown key without a word: `helm show values
      # openobserve-standalone --version 0.92.2` lists this one directly under
      # `ZO_S3_BUCKET_NAME`. **Verify the objects, not this comment** — the first ingest should
      # land under `production/` and nothing new should appear at the root.
      ZO_S3_BUCKET_PREFIX: "production/"
      # Path style, not virtual-hosted. Hetzner's endpoint serves `<endpoint>/<bucket>`, which is
      # exactly what `bucket_domain_name` came back as on the import.
      ZO_S3_FEATURE_FORCE_HOSTED_STYLE: "false"

      # **Retention, and this is the number LEGAL.md §7.5 depends on** (#271 item 1). The default is
      # `3650` — ten years — which expires nothing and leaves §7.5's claim resting on a control that
      # does not exist.
      #
      # **OpenObserve's own compactor, not an S3 lifecycle rule, is the mechanism**: it deletes the
      # Parquet *and* its entry in the file list, where a bucket rule alone would delete objects out
      # from under that list and leave queries referencing files that are gone — corruption rather
      # than expiry. `infra/bootstrap/storage.tf`'s lifecycle rule is a **backstop set deliberately
      # longer than this**, for the case where the compactor stops running (the argument #586 makes
      # about a sweep that only runs while its node does).
      #
      # **14 days is a starting position.** It leaves room to investigate an incident a week old
      # while staying short of a log archive. **#278 writes the privacy notice and must state
      # whatever this says**, so changing it here changes a published claim.
      #
      # **The catch:** it applies to metrics as well as logs, and #271 item 7 wants an availability
      # figure that survives a year — which needs per-stream retention configured in the application,
      # not here. **Set short and lose metrics history; set long and over-retain personal data.**
      # This errs toward the recoverable mistake.
      ZO_COMPACT_DATA_RETENTION_DAYS: "14"

      # **The memtable never rotates on size, because the default cannot be reached (#625).** Two
      # thresholds decide whether ingestion works and, out of the box, the smaller one is the wrong
      # one. In `v0.92.2`: `writer.rs:68` rejects a write with `MemoryTableOverflowError` once the
      # **global** gauge `zo_ingest_memtable_arrow_bytes` reaches `ZO_MEM_TABLE_MAX_SIZE`, which
      # `config.rs:3612` derives when unset as `mem_total / 4` in local mode — 25%, not 50%, of the
      # **cgroup** limit, so 256 MiB against the `limits.memory: 1Gi` below. But `writer.rs:706`
      # rotates a memtable — the thing that actually drains it — only when **that one table** passes
      # `ZO_MAX_FILE_SIZE_IN_MEMORY`, which defaults to **512 MB**.
      #
      # **One table has to reach 512 MB while all of them together may not exceed 256 MiB**, so
      # size-triggered rotation is unreachable by construction and the only thing that ever rotates a
      # memtable is the age check in `check_wal_threshold` (`ZO_MAX_FILE_RETENTION_TIME`, 600s). The
      # pod accumulates ten minutes of arrow batches, hits the ceiling and returns HTTP 503 to the
      # collector until the timer fires. Over 48 hours that **lost ~51% of all post-filter metric
      # points** — 4.44M rejected outright, 8.45M never queued — and **74% of k8s event logs**.
      #
      # **32 MB, not something closer to the ceiling.** Writers are one per `(bucket, org,
      # stream_type)` (`writer.rs:718`), so with `ZO_MEM_TABLE_BUCKET_NUM` at its default of 1 there
      # are a handful — `default` and `_meta` x logs/metrics/traces. Six full tables at 32 MB is
      # 192 MB against a 256 MiB ceiling; at 64 MB the worst case is over it, the same bug with a
      # larger constant. **Raising the memory limit does not work**: `1536Mi` gives a 384 MiB
      # ceiling, still under the rotation threshold, and reaching the default by sizing alone needs
      # 4 GiB — more than ADR-015 budgets. **The cost is more, smaller Parquet files**, which the
      # compactor merges on its 10s interval; file count is its problem and it has a mechanism for
      # it, while a rejected write is data that no longer exists.
      ZO_MAX_FILE_SIZE_IN_MEMORY: "32"

      # **The disk cache sizes itself from the node's disk, not from the claim (#1521).** With
      # `ZO_DISK_CACHE_MAX_SIZE` unset, `check_disk_cache_config` in `v0.92.2`'s `config.rs` takes
      # half of the free space on the disk the data directory sits on — `local-path` puts that on
      # the node's root disk and enforces nothing — so the cache grew to 13 GB on a `5Gi` claim,
      # half of a node's headroom with PostgreSQL beside it on staging. 3072 MB leaves room inside
      # the claim for `db/`, `wal/` and the two 10% caches derived from this. The corpus is in the
      # bucket, same region; a miss reads it.
      ZO_DISK_CACHE_MAX_SIZE: "3072"
      # **The chart pauses the cache's own GC** — it ships `"0"`, and `spawn_pausable_job!` treats
      # `<= 0` as paused — so nothing above the cap is released until a write forces it. 60 is
      # the application's default: 100 MB (`ZO_DISK_CACHE_GC_SIZE`) a minute while over the cap.
      ZO_DISK_CACHE_GC_INTERVAL: "60"

      # **Let it report its own pressure — the chart turns this off, the app defaults it on.**
      # `config.rs:1447` has `ZO_PROMETHEUS_ENABLED` defaulting to **true**; the chart sets it to
      # `false`, so `/metrics` answers 200 with an empty body and **the store that holds every metric
      # exports none of its own**. `zo_ingest_memtable_arrow_bytes` is the exact gauge the overflow
      # check reads, and until now it existed nowhere — the outage in #625 had to be diagnosed from
      # log lines, which is why it was mis-attributed to the container's RSS.
      #
      # Paired with the scrape annotations below, this is what makes the fix above checkable rather
      # than asserted, and what would make the next occurrence visible while it is happening rather
      # than after the data is gone.
      ZO_PROMETHEUS_ENABLED: "true"

      # **An outbound flow nobody decided on.**
      # `ZO_TELEMETRY` defaults to **true** and posts to `https://e1.zinclabs.dev` every 30
      # minutes. It was found while working out what this pod is allowed to connect to, which
      # is the only reason it surfaced at all — nothing here had ever named it.
      #
      # Turned off rather than allowed, on the same principle as the egress policy: an
      # outbound flow that nobody chose is not one to keep because it happens to be small.
      # It also does not survive scrutiny under LEGAL.md — this is the component holding
      # every log line and metric in the system, and what its heartbeat contains is
      # documented nowhere we control.
      ZO_TELEMETRY: "false"

      # **An alert has to have a destination, and every in-cluster URL is refused.** #271's alert
      # rules cannot be created without one — `POST /api/v2/{org}/alerts` returns `Alert destination
      # or workflows is required`, with or without `creates_incident` — and every destination inside
      # the cluster is rejected by an SSRF guard:
      #
      #     openobserve-…svc.cluster.local  -> 400 Destination URL blocked by SSRF guard
      #     signal-cli.observability.svc…   -> 400 Destination URL blocked by SSRF guard
      #
      # The second is #271 item 4's entire architecture — an OpenObserve webhook into
      # `signal-cli-rest-api` — blocked for reasons unrelated to the missing phone number.
      #
      # `config.rs:1177` offers two ways out and they are not equivalent: `ZO_SSRF_ALLOW_LOOPBACK`
      # lets the process notify **itself** and nothing else, `ZO_SKIP_SSRF_CHECKS` removes the check
      # for every destination.
      #
      # **Staging sets both. This sets only the first, and the difference is the Signal bridge**
      # (#880). Staging needs the wider flag because its destination is another pod; production has
      # no bridge until #877, so its only destination is the loopback POST into this pod's own
      # ingest API that turns a firing into a row in `alert_history`. **A flag that buys nothing
      # here is not carried across for symmetry**: #877 brings the bridge, this line and the egress
      # allowance in `observability-netpol.yaml` together, or the destination is refused — and a
      # refusal is the correct answer to a webhook aimed at a pod nothing is allowed to reach.
      #
      # **So production keeps the in-application guard as well as the egress policy**, where staging
      # has only the second. `observability-netpol.yaml` argues what that boundary is worth.
      # **What neither fixes:** a destination may still be any *public* address, so the root
      # credential can exfiltrate alert bodies — inherent to having a webhook at all.

      # **NOT in the `config:` block above, and that is not a style choice.** The chart renders its
      # ConfigMap from the 226 keys it knows about and **silently drops anything else** — no error,
      # no warning, and a `helm template` that looks correct. `extraEnv` is the escape hatch for a
      # key it has never heard of, and it lands as a plain environment variable anyway.

    extraEnv:
      # The only destination production has, and the reason the alert rules can exist here at all:
      # a POST into this pod's own ingest API, so a firing becomes a row in `alert_history` rather
      # than nothing. `ZO_SKIP_SSRF_CHECKS` is deliberately absent — see above.
      - name: ZO_SSRF_ALLOW_LOOPBACK
        value: "true"
      # Files older than this are read from the bucket rather than cached (#1521); the dashboards
      # query hours. Not in `config:` — the chart does not know the key and would drop it.
      - name: ZO_DISK_CACHE_MAX_AGE_DAYS
        value: "3"

    # The gateway's `prometheus-autodiscovery` job keys on these, as postgres-exporter.yaml does.
    # Without them the setting above exposes metrics nothing collects.
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "5080"
      prometheus.io/path: "/metrics"

    persistence:
      # Small on purpose: with S3 as the store this is the write-ahead and cache directory, not the
      # corpus. The corpus is in the bucket. `local-path` does not enforce the size; what bounds the
      # directory is `ZO_DISK_CACHE_MAX_SIZE` above.
      enabled: true
      size: 5Gi

    resources:
      requests:
        memory: "512Mi"
        cpu: "100m"
      limits:
        # **1Gi became 1536Mi here too, and this is the recorded number.** 1Gi was set deliberately
        # under ADR-015's ~1.5 GB ceiling, so that a breach would be observable as an OOMKill, and
        # production was the live test of the tighter number after staging left it. The breach
        # arrived: one OOMKill (exit 137) at 09:17Z on the day #419 landed, with the pod at
        # 1008–1012Mi of 1024Mi afterwards. Two things met at once — a node_exporter that ran for
        # twenty minutes with every default collector on (its config step had not run yet, see
        # CLUSTER_BOOTSTRAP.md § The reboot-pending metric) and created 260 metric streams, and
        # fifteen PromQL evaluations in a burst from `deploy/alerts/apply.sh --check`. The streams
        # were deleted; the burst is what every `--check` does, and a limit the operator's own
        # check can trip is a limit that has stopped being a test. Staging's file has the sizing
        # argument for why 1536Mi is safe: the memtable ceiling becomes 384 MiB, and `cpu: "1"`
        # keeps the worker pool at two whatever this says.
        memory: "1536Mi"
        cpu: "1"

  # **The chart cannot express this, and the default kills the pod** (#924). Its `probes:` block
  # offers `enabled`, `initialDelaySeconds`, `failureThreshold` and `path` — and no
  # `timeoutSeconds` — so both probes render with Kubernetes' default of **one second**. This
  # process compacts Parquet on its own schedule, `/healthz` occasionally answers slower than that
  # while it does, and three in a row are a SIGKILL: staging restarted 124 times in 8 days, roughly
  # every half hour, with no error in any log and every restart reported as `Exit Code: 137`.
  #
  # **Raising `failureThreshold` was available and is not the fix.** It multiplies a wrong timeout
  # rather than correcting it, and it would trade a kill every half hour for a kill every hour.
  #
  # **Readiness is patched as well as liveness, and that half is what broke tooling rather than the
  # pod.** A failing readiness probe takes this pod out of its Service, so `deploy/alerts/apply.sh`
  # reached nothing and reported all eleven rules as returning no data — a dead server reading
  # exactly like a metrics problem.
  #
  # 5s against a 10s period, keeping `failureThreshold: 3`: the pod is killed after 30 seconds of a
  # genuinely unresponsive process, which is what liveness is for. A strategic merge patch rather
  # than JSON 6902, so the container is matched by name and not by index.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: StatefulSet
              name: openobserve-openobserve-standalone
            patch: |
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: openobserve-openobserve-standalone
              spec:
                template:
                  spec:
                    containers:
                      - name: openobserve-standalone
                        livenessProbe:
                          timeoutSeconds: 5
                        readinessProbe:
                          timeoutSeconds: 5
                        # **Neither of the two above runs until this one succeeds**, which is the
                        # whole point. On start the process replays its write-ahead log and merges
                        # whatever small Parquet files it left behind, and until that work lets it
                        # answer, a liveness probe measures the backlog rather than the health.
                        # Staging turned that into a spiral: every kill left more to catch up on,
                        # so the next start was slower and the kills moved from every half hour to
                        # every sixty seconds — 146 restarts and counting.
                        #
                        # 30 x 10s is five minutes to become responsive, against a release timeout
                        # of ten. A process that cannot answer inside five minutes is genuinely
                        # wedged, which is when a restart is the right answer rather than the cause.
                        startupProbe:
                          httpGet:
                            path: /healthz
                            port: 5080
                          periodSeconds: 10
                          timeoutSeconds: 5
                          failureThreshold: 30
