# Production's release of the event-junkie chart, serving the apex. The ingress host, redirect hosts and
# `noindex` are the chart's defaults, which describe production. `oci-repository.yaml` admits release tags
# only.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: event-junkie
  namespace: flux-system
  annotations:
    kubernetes.io/description: >-
      The BFF, importer and frontend on the production cluster, serving event-junkie.de.
spec:
  releaseName: event-junkie
  targetNamespace: event-junkie
  # This release renders a ClusterIssuer, so without cert-manager the whole release fails at an unknown
  # kind. Production names cert-manager directly where staging names the DNS-01 webhook: HTTP-01 works
  # against an address the internet can reach.
  dependsOn:
    - name: cert-manager
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: event-junkie
    namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 2
  upgrade:
    remediation:
      retries: 2
      strategy: rollback
      # Without this a bad deploy is retried and then left broken: `remediateLastFailure` defaults to
      # false, so remediation runs between attempts and never after the final one (#414).
      remediateLastFailure: true
    cleanupOnFail: true
  # **Off for one upgrade, back on in the next PR.** The go-live upgrade moves the Ingress to the apex,
  # and the k6 hook verifies TLS about ten seconds later, while HTTP-01 still needs a minute. It failed
  # three times on Traefik's default certificate, and each rollback undid the certificate request.
  test:
    enable: false
    timeout: 3m
  rollback:
    cleanupOnFail: true
    timeout: 5m
  # `enabled` rather than staging's `warn`: on production a manual `kubectl edit` is an incident, and
  # reverting it is the correct response.
  driftDetection:
    mode: enabled
  values:
    networkPolicy:
      # The database node's private address in CIDR form — NetworkPolicy cannot resolve a name, so two
      # settings for one address, the pairing most likely to be left half-done.
      # `scripts/cluster-assertions.sh` fails on a real host beside a placeholder CIDR. **A wrong value does
      # NOT fail the render**: it templates and the API server rejects it, rolling the release back several
      # steps from anything mentioning a CIDR.
      databaseCidr: "10.0.1.20/32"
    database:
      # The dedicated PostgreSQL node, on the private network, reachable from this cluster and from nowhere
      # else: it carries no inbound firewall rule, and its public address exists so it can reach out.
      host: "10.0.1.20"
      # Committed encrypted and decrypted by Flux with the `sops-age` key (docs/ops/SECRETS.md).
      existingSecret: "events-db"
    # Cached venue images (ADR-019). Serving is on: the backfill finished, and the images not cached are
    # ones we may not hold (one venue's CDN publishes `Disallow: /`), so those cards show no image rather
    # than a hotlink (#843). **`serving.enabled` is a published claim**: §5 of the privacy notice says no
    # image request reaches a third party, true only while this is on (LEGAL.md §7.3a).
    importer:
      # **On here translates.** A source also needs a PERMITTED `translation_licence` (ADR-027). The Secret
      # is hand-made (docs/ops/SECRETS.md). Off for the two days the importer re-bought the catalogue
      # nightly (#1301); back on with the release that keeps a translation across re-import.
      translation:
        engine: anthropic
        # Per source, per pass — not per night. A nightly import adds more than the chart's 50 to some
        # sources (92 on Uber Arena, measured), and a pass that stops at the cap leaves a tail no later pass
        # clears. 250 covers the largest night seen; across 84 sources it bounds a night at 21,000 (#1432).
        maxPerRun: 250
    images:
      enabled: true
      serving:
        enabled: true
      # The orphan sweep, on in both environments (#843). Reporting mode found 3 unreferenced images and no
      # stray; a large number would mean the reference query is wrong.
      sweep:
        enabled: true
      storage:
        # Required by the chart, and the only thing separating these objects from staging's in one
        # content-addressed bucket: a shared prefix would let one environment's sweep delete the other's.
        prefix: "production"
        # Out of band in this namespace, scoped to the images bucket alone (docs/ops/SECRETS.md).
        existingSecret: "event-junkie-images"
      imgproxy:
        enabled: true
    # No replica counts and no resources: `values.yaml`'s defaults are production-shaped by design, so
    # repeating them here would be a second place to look with nothing to say. The HPA's bounds are
    # defaults too, and only its switch is here (#1774).
    bff:
      autoscaling:
        enabled: true
    ingress:
      # The Content-Security-Policy is enforced here, not report-only (#854): staging went first, and
      # production's report-only header had the same pass — every route family, both locales, both themes,
      # zero violations. The chart default stays report-only.
      securityHeaders:
        contentSecurityPolicy:
          reportOnly: false
    certManager:
      clusterIssuer:
        create: true
        name: "letsencrypt-production"
        email: "hello@event-junkie.de"
        # HTTP-01 works here, unlike staging: production has a public address, so no DNS-01 webhook and no token.
        solver: "http01"
        # The real ACME endpoint, the only place in this repository it appears. 50 certificates per
        # registered domain per week, and `event-junkie.de` is the same registered domain staging uses —
        # which is why staging stays on the ACME staging endpoint.
        server: "https://acme-v02.api.letsencrypt.org/directory"
    tests:
      smoke:
        # The k6 hook (#1697), second here: staging carried it first, through 64 reconciles with no
        # false rollback. `verifyTls` keeps the chart default, unlike staging — a certificate that did
        # not issue is a finding this hook exists to make.
        enabled: true
