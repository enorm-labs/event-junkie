# The chart source for production — the inverse of staging's policy: only what was deliberately
# released, a published GitHub Release and its tag (#264). TWO GUARDS, AND THE SECOND IS THE POINT.
# `>=0.1.0` already excludes prereleases, but by omission — it excludes `0.2.0-snapshot.gabc1234` only
# because nobody wrote `-0`, and the person most likely to add it is the one who just debugged why
# staging was not moving. `semverFilter` states the intent positively, so the omission stops being
# load-bearing.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: event-junkie
  namespace: flux-system
  annotations:
    kubernetes.io/description: >-
      The event-junkie Helm chart, pulled from GHCR. Release versions only — no snapshot can match.
spec:
  # Slower than staging on purpose: production moves when a human publishes a release, monthly.
  interval: 10m
  url: oci://ghcr.io/enorm-labs/charts/event-junkie
  ref:
    semver: ">=0.1.0"
    semverFilter: '^[0-9]+\.[0-9]+\.[0-9]+$'
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  # Refuses a chart not signed by our own release workflow (#1425), staging's block: a release runs
  # `release.yml` at `refs/tags/vX.Y.Z`. A chart pushed by hand never reconciles; the last verified
  # artifact stays.
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: "^https://token\\.actions\\.githubusercontent\\.com$"
        subject: "^https://github\\.com/enorm-labs/event-junkie/\\.github/workflows/release\\.yml@refs/(heads/main|tags/v[0-9]+\\.[0-9]+\\.[0-9]+)$"
