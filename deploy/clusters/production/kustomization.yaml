# What Flux syncs for the production cluster — `flux bootstrap --path=deploy/clusters/production`,
# which adds a generated `flux-system/`. Order is presentational; `dependsOn` orders the installs.
# cert-manager is NOT suspended while `helm-release.yaml` is, so bootstrapping brings certificate
# issuance up first.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Listing flux-system/ is what makes the cluster self-managing; an explicit list replaces the
  # recursive discovery, so omitting it leaves Flux's own Kustomization reconciled only by a bootstrap
  # re-run, and the `decryption` patch renders and never reaches the cluster (#416). **Rendering is not
  # applying.**
  - flux-system
  # The five namespaces, the chart repositories, PostgreSQL metrics and the two collectors, shared with
  # staging (#953, #1080). Namespaces are declared rather than left to `createNamespace: true`, which
  # creates an unlabelled one PSA cannot govern (#604).
  - ../base
  # Encrypted; decrypted by the sops-age patch in flux-system/kustomization.yaml, which is why that patch
  # has to reach the cluster.
  - secrets/events-db.yaml
  - cert-manager.yaml
  # The observability stack (#880); each file argues its own difference from staging's copy.
  - openobserve.yaml
  - observability-netpol.yaml
  # Its own file, shorter than staging's (#920): this cluster solves HTTP01, so the DNS01 self-check and
  # the Hetzner webhook are arrows it does not have.
  - cert-manager-netpol.yaml
  - traefik-host-ports.yaml
  # **One of staging's files is absent.** `signal-bridge.yaml`: alerts go by e-mail and the Signal route
  # is deferred (#1812). The bridge and the route into it arrive together or not at all.
  - oci-repository.yaml
  - helm-release.yaml
  - notification.yaml

# The one field `../base/collector.yaml` leaves for each cluster (#953). `replace` rather than `add`:
# the path has to exist, so removing the key from the base fails this build loudly.
patches:
  - target:
      kind: HelmRelease
      name: openobserve-collector
    patch: |
      - op: replace
        path: /spec/values/k8sCluster
        value: production
  # The nodes whose patch state the gateway scrapes (#419). `replace`, like `k8sCluster`.
  - target:
      kind: HelmRelease
      name: openobserve-collector
    patch: |
      - op: replace
        path: /spec/values/gateway/receivers/prometheus~1nodes/config/scrape_configs/0/static_configs/0/targets
        value:
          - 10.0.1.10:9100
          - 10.0.1.20:9100
  # Twice, because the agent is its own release (#709); two literal targets fail loudly when either is renamed.
  - target:
      kind: HelmRelease
      name: openobserve-collector-agent
    patch: |
      - op: replace
        path: /spec/values/k8sCluster
        value: production
