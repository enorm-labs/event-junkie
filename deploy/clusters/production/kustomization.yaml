# What Flux syncs for the production cluster — `flux bootstrap --path=deploy/clusters/production`.
# Bootstrap adds a generated `flux-system/` alongside these files.
#
# Order here is presentational only; `dependsOn` inside the HelmReleases orders the installs.
# cert-manager is NOT suspended while `helm-release.yaml` is, so bootstrapping brings certificate
# issuance up first and the application only when its suspend line is deliberately removed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Listing flux-system/ is what makes the cluster self-managing. A Flux Kustomization pointing at a
  # directory with no kustomization.yaml walks it recursively and picks it up for free; an explicit
  # list replaces that discovery, so omitting it leaves Flux's own Kustomization reconciled by
  # nothing but a `flux bootstrap` re-run — and the `decryption` patch then renders, merges and
  # never reaches the cluster (#416). **Rendering is not applying.**
  - flux-system
  - namespace.yaml
  # Declared rather than left to `createNamespace: true` (#604): a HelmRelease creating its own
  # namespace creates a bare one, and Pod Security Admission is enforced by namespace label, so an
  # undeclared namespace is silently ungoverned. That is why `namespace-observability.yaml` is in
  # this list rather than left to the OpenObserve release, which sets `createNamespace: true`.
  - namespace-cert-manager.yaml
  - namespace-observability.yaml
  - namespace-default.yaml
  # Encrypted; decrypted by the sops-age patch in flux-system/kustomization.yaml, which is exactly
  # why that patch has to actually reach the cluster.
  - secrets/events-db.yaml
  - helm-repository-jetstack.yaml
  - cert-manager.yaml
  # The observability stack (#880). Each file argues its own difference from staging's copy.
  - openobserve.yaml
  - observability-netpol.yaml
  - collector.yaml
  - postgres-exporter.yaml
  # Its own file rather than staging's, and shorter (#920): this cluster solves HTTP01, so the DNS01
  # self-check and the Hetzner webhook are arrows it does not have.
  - cert-manager-netpol.yaml
  # **One of staging's files is still absent.** `signal-bridge.yaml` has no destination until #877,
  # so the bridge and the route into it arrive together or not at all.
  - oci-repository.yaml
  - helm-release.yaml
  - notification.yaml
