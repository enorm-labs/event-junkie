# GitHub deployments for production — what is running here, and since when (#565). **Deliberately no
# `github` commit-status Provider** (#567): `parseRevision` needs a git hash and a HelmRelease event
# reports the *chart version*; the `originRevision` mechanism exists only in kustomize-controller.
---
# A deployment is per environment and answers "what is on production right now, and since when".
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: github-dispatch
  namespace: flux-system
  annotations:
    kubernetes.io/description: >-
      Fires a repository_dispatch so .github/workflows/deployment-status.yml can record a
      GitHub deployment for this cluster.
spec:
  type: githubdispatch
  address: https://github.com/enorm-labs/event-junkie
  # THE ONLY CREDENTIAL THIS CLUSTER HOLDS FOR GITHUB'S SAKE. `repository_dispatch` needs **contents:
  # write**, which is why it is per-cluster and DIFFERENT FROM STAGING'S: one credential across two
  # clusters means revoking it takes both down. **Hand-made rather than SOPS-encrypted**
  # (docs/ops/SECRETS.md): encrypting a `contents: write` token into a public repository publishes its
  # ciphertext for good. Nothing in this repository creates it; typed by hand — CLUSTER_BOOTSTRAP.md §8.
  secretRef:
    name: github-dispatch
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: github-dispatch
  namespace: flux-system
spec:
  providerRef:
    name: github-dispatch
  eventSeverity: info
  # The HelmRelease only: a chart arriving in the registry is not a deployment. The OCIRepository has
  # its own Alert below.
  eventSources:
    - kind: HelmRelease
      name: event-junkie
      namespace: flux-system
  # The workflow's whole input beyond the revision. An unrecognised `env` fails the run rather than
  # filing production under staging.
  eventMetadata:
    env: production
    cluster: production
---
# The source's failures, and nothing else (#1454): a chart that fails cosign verification or an
# unreachable registry keeps the last good artifact, and the HelmRelease emits no event. `error`
# rather than `info`. `flux-source-failure.yml` receives these and goes red.
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: source-failure
  namespace: flux-system
spec:
  providerRef:
    name: github-dispatch
  eventSeverity: error
  eventSources:
    - kind: OCIRepository
      name: event-junkie
      namespace: flux-system
  eventMetadata:
    env: production
    cluster: production
