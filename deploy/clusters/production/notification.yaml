# GitHub deployments for production — what is running here, and since when (#565).
#
# **This file used to carry a `github` commit-status Provider as well, and #567 deleted it rather
# than fixing it.** Recorded here because "why is there no commit status?" is the obvious question
# and the answer is not obvious: notification-controller's `parseRevision` needs a git hash, and a
# HelmRelease event reports the *chart version*. The mechanism that solves this — `originRevision`,
# derived from `org.opencontainers.image.revision` — exists only in **kustomize-controller**;
# helm-controller has no equivalent, so no annotation on the chart could have fixed it. See §4a.
---
# A deployment is per-environment and produces a timeline, which is the question worth answering:
# "what is on production right now, and since when" has no single commit to ask about.
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: github-dispatch
  namespace: flux-system
  annotations:
    kubernetes.io/description: >-
      Fires a repository_dispatch so .github/workflows/deployment-status.yml can record a
      GitHub deployment for this cluster.
spec:
  type: githubdispatch
  address: https://github.com/enorm-labs/event-junkie
  # THE ONLY CREDENTIAL THIS CLUSTER HOLDS FOR GITHUB'S SAKE. `repository_dispatch` needs
  # **contents: write** — a strong scope, which is why it is per-cluster rather than shared.
  #
  # Fine-grained, scoped to this repository, and DIFFERENT FROM STAGING'S: one credential across two
  # clusters means revoking it takes both down. **Hand-made rather than SOPS-encrypted** (decided
  # 2026-08-19, docs/ops/SECRETS.md) — encrypting a `contents: write` token into a public repository
  # publishes its ciphertext for good.
  #
  # So nothing in this repository creates it, and this Provider is inert twice over until production
  # is bootstrapped (#560) and the Secret is typed against it by hand — CLUSTER_BOOTSTRAP.md §8.
  secretRef:
    name: github-dispatch
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: github-dispatch
  namespace: flux-system
spec:
  providerRef:
    name: github-dispatch
  eventSeverity: info
  # Deliberately narrower than the commit-status Alert above, which also watches the OCIRepository.
  # A chart arriving in the registry is not a deployment — it is what a deployment later consumes —
  # and recording it as one would put two entries on the timeline for a single rollout.
  eventSources:
    - kind: HelmRelease
      name: event-junkie
      namespace: flux-system
  # These two are the workflow's whole input beyond the revision: `env` picks the GitHub environment
  # and `cluster` is recorded on the deployment. An unrecognised `env` fails the run rather than
  # defaulting, so a typo here is loud instead of filing staging under production.
  eventMetadata:
    env: production
    cluster: production
