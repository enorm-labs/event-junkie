# comment-lint: allow-file 14 lines of Namespace, and the dry run that proves the level does not fit in 12.
# The observability namespace, declared here so it can carry Pod Security Admission labels (#604).
#
# **`restricted` is verified against the cluster, not read off the charts.** The check is a server
# dry run of this very label — `kubectl label --dry-run=server --overwrite ns observability
# pod-security.kubernetes.io/enforce=restricted` — which names every running pod the level would
# reject. Before #709 it named three: the collector agent (hostPath mounts of `/`, `/var/log` and
# `/var/lib/docker/containers`, plus a root initContainer), the collector gateway and OpenObserve
# (both missing `allowPrivilegeEscalation: false`, `capabilities.drop: ALL` and a seccomp profile).
# The operator, the Postgres exporter and the Signal bridge already passed.
#
# **The agent is gone from here, and the other two are hardened where they are.** `hostPath` is
# restricted under `baseline` as well as `restricted`, so no enforcing level admits the agent, and
# PSA has no per-workload exemption — one pod that needs the node holds its whole namespace at
# `privileged`. So the agent runs alone in `observability-agent`
# (`namespace-observability-agent.yaml`), and the gateway and OpenObserve carry the four fields
# `restricted` asks for in `collector.yaml` and `openobserve.yaml`. **Run the dry run again before
# bumping either chart**: a new version that drops a securityContext field fails the *release*
# rather than a pod, which reads as a chart problem rather than a policy one.
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    # ENFORCING. Every pod here — OpenObserve with every log line in the system, the exporter with
    # the database credential, the bridge with a registered account — is held to the profile the
    # application namespace already runs under.
    pod-security.kubernetes.io/enforce: restricted
    # Pinned for the reason `namespace-cert-manager.yaml` gives: a cluster upgrade must not tighten
    # the profile under a running release.
    pod-security.kubernetes.io/enforce-version: v1.34
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    app.kubernetes.io/part-of: event-junkie
    app.kubernetes.io/managed-by: flux
