# comment-lint: allow-file 14 lines of Namespace, and the dry run that proves the level does not fit in 12.
# The observability namespace, declared so it can carry Pod Security Admission labels (#604).
# **`restricted` is verified against the cluster**: `kubectl label --dry-run=server --overwrite ns
# observability pod-security.kubernetes.io/enforce=restricted` names every running pod the level
# would reject. Before #709 it named three; the agent is gone to `observability-agent` (`hostPath` is
# restricted under `baseline` too, and PSA has no per-workload exemption), and the gateway and
# OpenObserve carry the four fields `restricted` asks for. **Run the dry run again before bumping
# either chart**: a new version that drops a securityContext field fails the *release*, which reads
# as a chart problem.
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    # ENFORCING: OpenObserve with every log line, the exporter with the database credential, the bridge
    # with a registered account.
    pod-security.kubernetes.io/enforce: restricted
    # Pinned: a cluster upgrade must not tighten the profile under a running release.
    pod-security.kubernetes.io/enforce-version: v1.34
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    app.kubernetes.io/part-of: event-junkie
    app.kubernetes.io/managed-by: flux
