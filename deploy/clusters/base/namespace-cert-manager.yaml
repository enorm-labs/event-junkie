# The cert-manager namespace, declared here so it can carry Pod Security Admission labels (#604).
# `createNamespace: true` on `cert-manager.yaml` cannot, for the reason `namespace.yaml` records:
# it creates a bare namespace with no labels, and PSA is enforced by namespace label.
#
# **`restricted` is verified rather than assumed.** Rendering `jetstack/cert-manager` v1.21.1 — the
# version `cert-manager.yaml` pins — gives four pod-producing objects, and all four already run
# `runAsNonRoot` with `RuntimeDefault`, drop ALL and no privilege escalation: the controller, the
# cainjector, the webhook, and the `startupapicheck` Job. The Job matters as much as the Deployments,
# because a profile that rejected it would fail the *release* rather than a pod, which reads as a
# chart problem rather than a policy one. **Re-render before bumping the pinned version** — this
# label turns an upstream regression into a release that will not install, which is correct but not
# obvious to diagnose.
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    # ENFORCE, NOT JUST WARN — the argument `namespace.yaml` makes: in a GitOps flow nobody reads
    # `kubectl` output, so a warn-only label is a message with no reader.
    pod-security.kubernetes.io/enforce: restricted
    # Pinned, so a cluster upgrade cannot tighten the profile under a running release. Raised
    # deliberately, with a rehearsal, like any other breaking change.
    pod-security.kubernetes.io/enforce-version: v1.34
    # Left at `latest`: neither can reject anything, so a newer standard only says early what the
    # next `enforce-version` bump would break.
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    app.kubernetes.io/part-of: event-junkie
    app.kubernetes.io/managed-by: flux
