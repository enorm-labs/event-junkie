# The metrics and logs collector — #271 item 2.
#
# **Two charts, and the order is not a preference.** The collector chart renders
# `OpenTelemetryCollector` and `Instrumentation` CRs, and Helm resolves kinds up front, so installing
# it before the operator's CRDs exist fails with `ensure CRDs are installed first`. `dependsOn` makes
# the ordering a property of the config.
#
# From the rehearsal: **the agent does not scrape the app pods; the gateway does** (`kubeletstats`
# and `hostmetrics` only on the agent, the `prometheus` receiver on the gateway — why #591's
# NetworkPolicy exists). **Discovery is by `prometheus.io/*` annotation and nothing else.**
# **Footprint measured at 938Mi** for the whole path on k3d/arm64, against ADR-015's ~1.5 GB ceiling
# — an expectation to check against this node, not a number to trust.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: open-telemetry
  namespace: flux-system
  annotations:
    kubernetes.io/description: >-
      The upstream OpenTelemetry chart repository, for the operator the collector's custom resources need.
spec:
  interval: 1h
  url: https://open-telemetry.github.io/opentelemetry-helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-operator
  namespace: flux-system
  annotations:
    kubernetes.io/description: >-
      The OpenTelemetry operator. Installed for its CRDs and its reconciliation of the collector custom resources — not for auto-instrumentation, which is
      disabled below.
spec:
  releaseName: otel-operator
  targetNamespace: observability
  storageNamespace: observability
  interval: 1h
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      remediateLastFailure: true
  chart:
    spec:
      chart: opentelemetry-operator
      version: "0.123.1"
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: flux-system
      interval: 1h
  values:
    admissionWebhooks:
      certManager:
        # cert-manager is installed here, but a ClusterIssuer and a DNS-01 token for a certificate nothing
        # outside the cluster sees is the larger dependency; a self-signed webhook cert is the smaller one.
        enabled: false
      autoGenerateCert:
        enabled: true
    manager:
      # **No `collectorImage`, because it can do nothing**: the OpenObserve chart pins `spec.image` on both
      # collectors. **The smaller `-k8s` distribution fails today**: the gateway's `traces` pipeline uses
      # the contrib-only `servicegraph` connector, and nothing sends traces there. Retiring that pipeline
      # is its own change.
      resources:
        requests:
          memory: "64Mi"
          cpu: "50m"
        limits:
          # Measured at 35Mi in the rehearsal; the operator only reconciles CRs.
          memory: "128Mi"
          cpu: "200m"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openobserve-collector
  namespace: flux-system
  annotations:
    kubernetes.io/description: >-
      The gateway: scrapes the annotated pods and the control plane, watches six object kinds, and ships to OpenObserve. The agent DaemonSet is the release
      below, in its own namespace (#709). Depends on the operator for its CRDs and on OpenObserve for somewhere to send to.
spec:
  releaseName: o2c
  targetNamespace: observability
  storageNamespace: observability
  interval: 1h
  # Both, for different reasons: the operator provides the CRDs (without it the install fails
  # outright), OpenObserve is the destination (without it, export errors until it appears).
  dependsOn:
    - name: otel-operator
    - name: openobserve
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      remediateLastFailure: true
  chart:
    spec:
      chart: openobserve-collector
      version: "0.4.7"
      # The shared source, not a second object at the same URL (#1080).
      sourceRef:
        kind: HelmRepository
        name: openobserve
        namespace: flux-system
      interval: 1h

  # The collector authenticates to OpenObserve as the root user, from the same hand-made Secret the
  # server reads — injected, because a credential under `spec.values` is a credential in a public
  # repository (#598). The `Basic <base64 of email:password>` header is a separate key so the two
  # halves never pass through Helm values in the clear.
  valuesFrom:
    - kind: Secret
      name: openobserve-credentials
      valuesKey: O2_BASIC_AUTH_HEADER
      targetPath: exporters.otlphttp/openobserve.headers.Authorization
    - kind: Secret
      name: openobserve-credentials
      valuesKey: O2_BASIC_AUTH_HEADER
      targetPath: exporters.otlphttp/openobserve_k8s_events.headers.Authorization

  values:
    # **The only field either cluster patches** (#880, #953): it tags every metric, log and trace with
    # its cluster, which is what makes an exported panel say which one you were looking at. **No overlay
    # may leave `unset` in place.**
    k8sCluster: unset
    # The operator is installed above as its own release; `true` here installs a second copy as a subchart.
    opentelemetry-operator:
      enabled: false
    exporters:
      otlphttp/openobserve:
        # In-cluster, plain HTTP over the pod network; the ingress does not route OpenObserve, deliberately.
        endpoint: http://openobserve-openobserve-standalone.observability.svc.cluster.local:5080/api/default/
      otlphttp/openobserve_k8s_events:
        endpoint: http://openobserve-openobserve-standalone.observability.svc.cluster.local:5080/api/default/
        headers:
          stream-name: k8s_events

    # **Stripping the identity attributes that churn — metrics only.** Every metric arrives with ~29
    # resource attributes, a dozen of which change when a pod is replaced, and a new value in any one is
    # a NEW TIME SERIES. `container.image.tag` is a snapshot version, so every push to main multiplied
    # the series count until retention expired it: on staging a bare `db_events` returned six series in
    # an hour for what is logically two, and an instant query at `now` returned nothing.
    #
    # **`k8s.pod.name` is deliberately KEPT**: dropping it merges two replicas into one series, which for a
    # counter is wrong, not tidier. **Metrics only** — a pod name in a log line is how you find the log.
    # **The agent is unaffected**: its `kubeletstats` metrics need their pod names. **Nested under
    # `gateway:`**: `exporters` is shared, `processors` and `service` exist once per collector, and the
    # same keys at the top level are ignored silently.

    # **Both collectors ship with `resources: {}`, and that is how a node dies** — the gateway measured
    # 928Mi in #271's global OOM. **The limits are the limiter's own worst case**: each collector's
    # `memory_limiter` refuses data at `limit_mib` and forces GC above it, the countable form of shedding,
    # and the container limit has to sit above `limit_mib + spike_limit_mib` so the limiter bites before
    # the kernel does:
    #
    #     agent     memory_limiter 512 + 128 spike  ->  limits.memory 640Mi
    #     gateway   memory_limiter 1024 + 256 spike ->  limits.memory 1280Mi
    #
    # Requests are steady state — what the scheduler needs, which an unrequested pod is invisible to.

    # **The agent is not rendered by this release** (#709): the chart puts both collectors into one
    # namespace, and the agent's hostPath mounts hold whatever namespace it lands in at `privileged`. So
    # the agent is the second HelmRelease below, in `observability-agent`.
    agent:
      enabled: false

    gateway:
      # **What `restricted` asks of a pod that needs no privilege** (#709): the image runs as UID 10001, and
      # these four fields say so in a form Pod Security Admission can check.
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          # **256Mi, and the first draft said 512Mi.** The 928Mi measured during #625 was 1,000 queued batches
          # waiting on writes OpenObserve was rejecting; five minutes after the fix the same pod sat at 221Mi.
          # A resource request taken during an incident encodes the incident.
          memory: "256Mi"
          cpu: "100m"
        limits:
          memory: "1280Mi"
          cpu: "1"

      # **The two nodes' patch state, scraped from node_exporter on their private addresses** (#419). A
      # second `prometheus` receiver rather than a job in the chart's: `scrape_configs` is a list, Helm
      # replaces lists, and restating nine jobs to add one is how one goes missing. `targets` is the field
      # each cluster patches, with the same `unset` rule as `k8sCluster`. Every 60s; the metrics are ages.
      #
      # **`node` is the label that tells the two production nodes apart, and `instance` is not**: the
      # receiver puts `instance` into `service.instance.id`, which `resource/strip_metric_identity` deletes
      # on purpose, so without the relabel both nodes land in ONE series. A metric label survives the strip.
      receivers:
        prometheus/nodes:
          config:
            scrape_configs:
              - job_name: node-patch-state
                scrape_interval: 60s
                static_configs:
                  - targets:
                      - unset
                relabel_configs:
                  - source_labels: [ __address__ ]
                    target_label: node

      processors:
        # comment-lint: allow the six-line measurement is what every drop rule below is argued from.
        # **Dropping the metrics nothing here will ever query.** The k3s API server's
        # `apiserver_request_duration_seconds` histogram alone is 47% of rows and 38% of bytes on a cluster
        # doing almost nothing. Measured across 983 streams / 822,942 rows / 729 MB:
        #
        #     apiserver_*            51.5% of rows, 41.9% of bytes   (10 streams)
        #     kube_*                 10.9%           8.1%
        #     go_*                   10.5%          14.6%            (164 streams)
        #     controller_runtime_*    3.7%           5.4%
        #     workqueue_*             2.9%           4.2%
        #     process_* rest_client_* 1.0%           1.3%   <- process_ deliberately NOT dropped
        #
        # What goes is runtime internals of software we do not operate. **`apiserver_request_total` is
        # KEPT** while its histogram goes: the count carries "is the API server erroring", and `_count`/`_sum`
        # give a mean. **Our own meters are untouched**, verified per family against live data — `pg_*`,
        # `k8s_*`, `system_*`, `container_*`, `certmanager_*`, `traefik_*`, `jvm_*`, `kube_*`.
        #
        # **Filtered by BASE NAME, not the `_bucket` suffix**: the Prometheus receiver rebuilds a histogram
        # into one OTLP metric named `apiserver_request_duration_seconds`, which OpenObserve re-expands at
        # ingest. A rule matching `_bucket$` matches nothing and looks like it worked.
        filter/drop_infrastructure_noise:
          # A condition that fails to evaluate skips rather than tearing down the pipeline; OTTL is parsed at
          # startup, so a syntax error still fails fast.
          error_mode: ignore
          metrics:
            # A metric is DROPPED when any condition here is true.
            metric:
              # Go runtime and Kubernetes client-library internals, whole families. **`process_` is NOT in this
              # list**: it is a mixed namespace — the Go client's `process_cpu_seconds_total` beside Micrometer's
              # `process_cpu_usage` and `process_uptime_seconds` from the BFF and importer — and it once silently
              # took five of our own metrics. ~0.7% of rows; left in.
              - 'IsMatch(name, "^(go|rest_client|workqueue)_")'
              # **`postgres-exporter` is 60% of everything ingested, for one metric anybody queries.** Measured from
              # the bucket: `pg_*` 1810 streams, `kube_*` 440, `otelcol_*` 195, `jvm_*` 125 — and
              # `deploy/dashboards/` queries exactly one. **It is stream COUNT that hurts**: OpenObserve holds
              # arrow batches per stream in the memtable. The 503s are a separate memtable limit (#625,
              # `ZO_MAX_FILE_SIZE_IN_MEMORY` in `openobserve.yaml`); this treats the symptom. The allowlist keeps
              # what a single-node database is worth watching; the exporter still produces the rest.
              - 'IsMatch(name, "^pg_") and not IsMatch(name, "^pg_(up|database_size_bytes|database_connection_limit|locks_count|exporter_last_scrape_error|stat_database_(numbackends|xact_commit|xact_rollback|deadlocks|blks_hit|blks_read))$")'
              # The single biggest stream in the system.
              - 'name == "apiserver_request_duration_seconds"'
              # Reconcile-latency histograms from the operators and Flux.
              - 'name == "controller_runtime_reconcile_time_seconds"'
              - 'name == "gotk_reconcile_duration_seconds"'
              # The collector describing the size of its own batches.
              - 'IsMatch(name, "^otelcol_.*_batch_send_size$")'

        resource/strip_metric_identity:
          attributes:
            # Per-deploy churn. The reason this change exists.
            - key: container.image.tag
              action: delete
            - key: service.version
              action: delete
            - key: k8s.replicaset.name
              action: delete
            - key: k8s.replicaset.uid
              action: delete
            # Per-pod churn that `k8s.pod.name` already covers.
            - key: k8s.pod.uid
              action: delete
            - key: k8s.pod.start_time
              action: delete
            - key: service.instance.id
              action: delete
            # The scrape target's address. Stable only until the pod moves, and `k8s.pod.name` is the
            # useful form of the same fact.
            - key: server.address
              action: delete
            - key: server.port
              action: delete
            - key: url.scheme
              action: delete
            # Stable, so not churn — but stored on every row, and nothing queries them. `k8s.cluster`
            # is set by the `attributes` processor and is the readable form of the uid.
            - key: container.image.name
              action: delete
            - key: k8s.cluster.uid
              action: delete

      service:
        pipelines:
          # comment-lint: allow the five-line count is what says which kinds are worth watching.
          # **Twenty-seven object kinds, six of which anybody would look at.** The chart's `logs/k8s_events`
          # pipeline watches every workload, RBAC and networking kind: 40,981 records over 48 hours, of which
          #
          #     crds     33,408  <- 81.5%, a 5-minute PULL of every CRD
          #     events    4,726
          #     pods        897
          #     nodes       571
          #     the rest  1,379  across 23 kinds, 14 of them at zero
          #
          # `crds` is a `mode: pull` every five minutes of every CRD's full spec; the chart's
          # `transform/strip_crd_spec` exists only to make it survivable, so it comes out too — **re-adding
          # `k8sobjects/crds` means re-adding it.** Each kind is also an informer holding its objects in the
          # gateway's heap. **Kept**: `events` (the stream read after an incident), `pods` (the phase
          # transition, which `kube_pod_*` gauges cannot give), `nodes` (MemoryPressure), `deployments`,
          # `statefulsets`, `daemonsets`. `jobs` and `cronjobs` are dropped because nothing here is one yet.
          # The ClusterRole is unchanged.
          logs/k8s_events:
            receivers:
              - k8sobjects/events
              - k8sobjects/pods
              - k8sobjects/nodes
              - k8sobjects/deployments
              - k8sobjects/statefulsets
              - k8sobjects/daemonsets
            # Restated because Helm replaces lists, minus `transform/strip_crd_spec`, whose only receiver is gone.
            processors:
              - memory_limiter
              - resourcedetection
              - attributes
              - k8sattributes
              - batch
          metrics:
            # The chart's three plus the node scrape above — restated, because Helm replaces lists.
            receivers:
              - otlp
              - servicegraph
              - prometheus
              - prometheus/nodes
            # **Restated in full because Helm replaces lists**; naming only the new processor would drop the
            # other five. After `k8sattributes`, which adds most of what is deleted, and before `batch`.
            processors:
              - memory_limiter
              # First, immediately after the limiter: two thirds of what arrives is about to be thrown away, and
              # `k8sattributes` does pod lookups per resource.
              - filter/drop_infrastructure_noise
              - resourcedetection
              - attributes
              - k8sattributes
              - resource/strip_metric_identity
              - batch
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openobserve-collector-agent
  namespace: flux-system
  annotations:
    kubernetes.io/description: >-
      The collector agent DaemonSet, alone in `observability-agent`: reads every container log and the node's own meters, and ships them to OpenObserve. The
      same chart as the gateway's release, with the gateway switched off (#709).
spec:
  # **A second release of the same chart, not a patch.** Pod Security Admission is a namespace label
  # with no per-workload exemption, and the chart renders both collectors into `.Release.Namespace`;
  # two releases is the only shape in which the agent's hostPath mounts govern a namespace holding
  # nothing else (#709). `o2c-agent` because the chart names its ClusterRole after the release.
  releaseName: o2c-agent
  targetNamespace: observability-agent
  storageNamespace: observability-agent
  interval: 1h
  # The same two as the gateway's release, for the same two reasons.
  dependsOn:
    - name: otel-operator
    - name: openobserve
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      remediateLastFailure: true
  chart:
    spec:
      chart: openobserve-collector
      version: "0.4.7"
      sourceRef:
        kind: HelmRepository
        name: openobserve
        namespace: flux-system
      interval: 1h

  # The same credential, injected the same way (#598). Both exporters, although the agent uses only the
  # first: the chart hands every collector the whole `exporters` map.
  valuesFrom:
    - kind: Secret
      name: openobserve-credentials
      valuesKey: O2_BASIC_AUTH_HEADER
      targetPath: exporters.otlphttp/openobserve.headers.Authorization
    - kind: Secret
      name: openobserve-credentials
      valuesKey: O2_BASIC_AUTH_HEADER
      targetPath: exporters.otlphttp/openobserve_k8s_events.headers.Authorization

  # **Giving the agent somewhere to remember how far it read (#950).** Without it, `filelog` re-reads
  # every container log from line one on a restart: the part older than 24h is refused by OpenObserve
  # in bursts and the part newer is ingested twice — 617 of 2,066 rows duplicated, 29.9%. With it,
  # both go to zero on staging at the baseline row rate.
  #
  # The chart hardcodes the agent's volumes, so the mount arrives by patch on the rendered
  # `OpenTelemetryCollector`. **JSON 6902 `add`, not a strategic merge**: kustomize has no schema for a
  # custom resource, so a merge REPLACES the list — tested, the merge form yields `otelcol-state` alone,
  # dropping /var/log while the agent looks healthy. `openobserve.yaml` merges for the opposite reason:
  # a StatefulSet has a schema. **The initContainer keeps the collector unprivileged**: a hostPath is
  # created root-owned, `fsGroup` does not apply to it, and #709 chose this over running as root.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: OpenTelemetryCollector
              name: o2c-agent-openobserve-collector-agent
            patch: |
              - op: add
                path: /spec/volumes/-
                value:
                  name: otelcol-state
                  hostPath:
                    path: /var/lib/otelcol-agent
                    type: DirectoryOrCreate
              - op: add
                path: /spec/volumeMounts/-
                value:
                  name: otelcol-state
                  mountPath: /var/lib/otelcol
              - op: add
                path: /spec/initContainers
                value:
                  - name: chown-state
                    image: busybox:1.38.0
                    securityContext:
                      runAsUser: 0
                    command:
                      - sh
                      - -c
                      - chown 10001:10001 /var/lib/otelcol
                    volumeMounts:
                      - name: otelcol-state
                        mountPath: /var/lib/otelcol

  values:
    # Patched per cluster as the gateway's is, same rule: no overlay may leave `unset` in place.
    k8sCluster: unset
    opentelemetry-operator:
      enabled: false
    # **Off, because the other release already renders them with fixed names**: `kube-state-metrics` in
    # `kube-system` and the five Instrumentation CRs. A second copy is a Helm ownership conflict.
    kube-state-metrics:
      enabled: false
    autoinstrumentation:
      enabled: false
    # The agent's `k8sattributes` still needs cluster RBAC, so the release brings its own ServiceAccount.
    gateway:
      enabled: false
    exporters:
      otlphttp/openobserve:
        # Fully qualified; plain HTTP over the pod network, not through the ingress.
        endpoint: http://openobserve-openobserve-standalone.observability.svc.cluster.local:5080/api/default/
      otlphttp/openobserve_k8s_events:
        endpoint: http://openobserve-openobserve-standalone.observability.svc.cluster.local:5080/api/default/
        headers:
          stream-name: k8s_events
    # **The agent, unchanged by the move** (#709); the memory table above still covers its 640Mi limit.
    agent:
      # The offsets. `directory` is the mount added by the postRenderer above; the two halves are useless apart.
      extensions:
        file_storage:
          directory: /var/lib/otelcol

      # **OpenObserve indexing its own indexer, the biggest log producer in the cluster.** The chart
      # excludes `openobserve-ingester`, the clustered container name; `ZO_LOCAL_MODE` runs
      # `openobserve-standalone`, so the exclusion misses it and every `generated tantivy index file` line
      # is shipped back, indexed and written to another Parquet file: 102,974 of ~104,200 log lines in an
      # hour on staging, 99%, against 820 from the BFF. **Restated in full because Helm replaces lists**;
      # the first three are the chart's own, and dropping any re-opens a collector-logs-about-collector loop.
      receivers:
        filelog/std:
          # What makes `start_at: beginning` mean "from where I stopped".
          storage: file_storage
          exclude:
            - /var/log/pods/*/otel-collector/*.log
            - /var/log/pods/*/otc-container/*.log
            - /var/log/pods/*/openobserve-ingester/*.log
            # This deployment's own, the one the chart's list does not reach.
            - /var/log/pods/*/openobserve-standalone/*.log

      # comment-lint: allow the allowlist argument and the two silent-failure traps are the whole reason this processor is not three lines.
      # **Lifting the application's JSON into fields.** The apps emit ECS JSON, and that alone changes
      # nothing: `filelog` moves the container line into `body` as a string and nothing looks inside — Flux's
      # rows carried perfect unparsed JSON with `severity` 0. **An allowlist, not a flatten** (#624): a
      # blind merge gives every key any container logs its own column, the unbounded-stream problem that
      # took staging down; adding a field is a line here. **`error_mode: ignore` and the `where` guards are
      # both load-bearing**: most containers log plain text, and without them a failed statement takes the
      # whole pipeline — the only thing shipping logs — with it.
      processors:
        # **What is left of the log volume once the application stops logging its own health checks
        # (#959).** Both are a control loop reporting that it did nothing, on a timer: 198 an hour from
        # coredns (100% of its output), 88 of 132 from flux, against a ~406-row baseline on production.
        # **Matched on the body alone**, so this rule's position is not load-bearing; scoping by
        # `k8s.container.name` would silently stop matching if moved ahead of `k8sattributes`. A pattern that
        # matches nothing looks identical to one that works (#615): check a new rule against the store.
        filter/drop_log_noise:
          # A condition that fails to evaluate skips rather than tearing down the pipeline, which would be a
          # total outage of logs.
          error_mode: ignore
          logs:
            # A log record is DROPPED when any condition here is true.
            log_record:
              # CoreDNS looking for the optional custom-config directory k3s never creates, on every reload. Scoped
              # to the message, so a real CoreDNS error still arrives.
              - 'IsString(log.body) and IsMatch(log.body, "No files matching import glob pattern")'
              # Flux saying the cluster already matches git. **`server-side apply completed`, `garbage collected N
              # artifacts` and the HelmChart lines are deliberately absent**: those record work done, and a failed
              # reconcile is diagnosed against them.
              - 'IsString(log.body) and IsMatch(log.body, "\"msg\":\"no changes since last reconciliation")'
              - 'IsString(log.body) and IsMatch(log.body, "\"msg\":\"release in-sync with desired state\"")'
              - 'IsString(log.body) and IsMatch(log.body, "\"msg\":\"all dependencies are ready\"")'
              - 'IsString(log.body) and IsMatch(log.body, "\"msg\":\"checking [0-9]+ dependencies\"")'
              - 'IsString(log.body) and IsMatch(log.body, "\"msg\":\"artifact up-to-date with remote revision")'

        transform/parse_structured_logs:
          error_mode: ignore
          log_statements:
            - context: log
              statements:
                # **A JSON key is not a shape, hence `IsMap` on every nested read.** Flux logs `error` as a STRING,
                # and indexing it threw `type Str does not support string indexing` until the guard existed. OTTL's
                # `and` short-circuits, so the guard runs first. The `log.` prefixes are the other half: bare paths
                # work and are rewritten with a warning.
                - set(log.cache, ParseJSON(log.body)) where IsMatch(log.body, "^\\{")
                # The level, as both an OTLP severity and a plain field: `severity_text` is what OpenObserve shows,
                # `severity_number` is what its level filter sorts on.
                - set(log.severity_text, log.cache["log"]["level"]) where IsMap(log.cache["log"]) and log.cache["log"]["level"] != nil
                - set(log.severity_number, SEVERITY_NUMBER_TRACE) where log.severity_text == "TRACE"
                - set(log.severity_number, SEVERITY_NUMBER_DEBUG) where log.severity_text == "DEBUG"
                - set(log.severity_number, SEVERITY_NUMBER_INFO) where log.severity_text == "INFO"
                - set(log.severity_number, SEVERITY_NUMBER_WARN) where log.severity_text == "WARN"
                - set(log.severity_number, SEVERITY_NUMBER_ERROR) where log.severity_text == "ERROR"
                # The logger, so a noisy class can be excluded without excluding its pod.
                - set(log.attributes["logger"], log.cache["log"]["logger"]) where IsMap(log.cache["log"]) and log.cache["log"]["logger"] != nil
                # The MDC fields (#380). Spring copies every MDC entry to the top level of the ECS object, so flat reads.
                - set(log.attributes["sourceSlug"], log.cache["sourceSlug"]) where log.cache["sourceSlug"] != nil
                - set(log.attributes["importRunId"], log.cache["importRunId"]) where log.cache["importRunId"] != nil
                - set(log.attributes["requestId"], log.cache["requestId"]) where log.cache["requestId"] != nil
                # The payload fields (#945), the same flat read. **A name absent here is silently absent from the
                # column**: match `LogFields` and the BFF's `LogContextConfiguration`, which `collector-parity.sh` checks.
                - set(log.attributes["url"], log.cache["url"]) where log.cache["url"] != nil
                - set(log.attributes["eventId"], log.cache["eventId"]) where log.cache["eventId"] != nil
                - set(log.attributes["eventSourceId"], log.cache["eventSourceId"]) where log.cache["eventSourceId"] != nil
                - set(log.attributes["httpMethod"], log.cache["httpMethod"]) where log.cache["httpMethod"] != nil
                - set(log.attributes["path"], log.cache["path"]) where log.cache["path"] != nil
                # **One name, both directions**: a venue's status to us, and ours to a browser; `service_name` separates them.
                - set(log.attributes["httpStatus"], log.cache["httpStatus"]) where log.cache["httpStatus"] != nil
                # High cardinality, safe only because the two lines that write it are rare (#980).
                - set(log.attributes["storageKey"], log.cache["storageKey"]) where log.cache["storageKey"] != nil
                # The stack trace as one field rather than forty unparented lines.
                - set(log.attributes["errorType"], log.cache["error"]["type"]) where IsMap(log.cache["error"]) and log.cache["error"]["type"] != nil
                - set(log.attributes["stackTrace"], log.cache["error"]["stack_trace"]) where IsMap(log.cache["error"]) and log.cache["error"]["stack_trace"] != nil
                # Last: replace the JSON blob with the human-readable message.
                - set(log.body, log.cache["message"]) where log.cache["message"] != nil

      service:
        # **One `service:` key.** A second under `agent:` is a duplicate YAML mapping key: the later wins
        # silently — `helm template` once showed `extensions` back at the chart's two. Restated because Helm
        # replaces lists; without the chart's first two the health probe has no endpoint.
        extensions:
          - health_check
          - zpages
          - file_storage
        pipelines:
          logs:
            # Restated because Helm replaces lists; `receivers` and `exporters` are absent because those are
            # maps this does not change.
            processors:
              - memory_limiter
              # Before the enrichers, so a dropped line is not enriched first, and before `batch`.
              - transform/parse_structured_logs
              - resourcedetection
              - attributes
              - k8sattributes
              # After `k8sattributes`, so the dropped records are the only thing this ordering costs; before `batch`.
              - filter/drop_log_noise
              - batch
      resources:
        requests:
          memory: "128Mi"
          cpu: "50m"
        limits:
          # Measured at 98Mi steady on staging; 640Mi is the limiter's ceiling plus spike, not headroom. The
          # measurement is staging's and production is busier (86 live sources, #876); the limiter is what
          # makes one number safe for both, and `otelcol_processor_refused_*` is the series to read after a few
          # production import cycles.
          memory: "640Mi"
          cpu: "500m"
