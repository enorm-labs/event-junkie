# The release namespace, created here rather than by the HelmRelease's `createNamespace`, so it can
# carry the Pod Security Admission labels (#416, PLATFORM_SETUP §8 item 2). `createNamespace: true`
# makes a bare namespace, and PSA is enforced by *namespace label* — without one the admission
# controller has nothing to enforce and every pod is admitted, privileged ones included. The flag
# stays set on the HelmRelease as a no-op, cheaper than making the release depend on this file.
apiVersion: v1
kind: Namespace
metadata:
  name: event-junkie
  labels:
    # `restricted` is the strictest built-in profile, and the chart's workloads already satisfy it
    # (#426, #448, held there by `tests/hardening_test.yaml`). ENFORCE, NOT JUST WARN: a warn-only
    # label produces `kubectl` output that nobody reads in a GitOps flow.
    pod-security.kubernetes.io/enforce: restricted
    # Pinned, so a cluster upgrade cannot tighten the profile under a running release and reject
    # pods that were admitted yesterday. Raise it deliberately, with a rehearsal.
    pod-security.kubernetes.io/enforce-version: v1.34
    # `audit` and `warn` stay at `latest`: neither can reject anything, so a newer standard only
    # says early what the next `enforce-version` bump would break.
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    app.kubernetes.io/part-of: event-junkie
    app.kubernetes.io/managed-by: flux
