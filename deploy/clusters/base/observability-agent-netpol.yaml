# Default-deny for the `observability-agent` namespace, plus one named allowance per real conversation
# (#709). The agent's arrows, lifted out of `observability-netpol.yaml` when the agent moved, and the
# same shape as that file: one deny-all, then a narrow policy per conversation, so an arrow not
# written down does not happen.
#
#     agent            -> OpenObserve:5080          otlphttp export, now across a namespace boundary
#     agent            -> kubelet:10250             the kubeletstats receiver
#     agent            -> apiserver:6443            the k8sattributes processor
#     gateway          -> agent:8888                the agent's own meters, scraped by prometheus-autodiscovery
#     everything       -> CoreDNS:53
#
# **Every cross-namespace arrow is two policies, and a `podSelector` alone is the wrong half.** A
# peer written as `podSelector` only matches pods in the policy's own namespace; the same pod one
# namespace over is silently not matched, and the traffic falls under the deny-all with no error
# anywhere. So each arrow into or out of this namespace names the other namespace by
# `kubernetes.io/metadata.name` beside the pod labels, here and in `observability-netpol.yaml`, and
# both halves are required: the egress here and the ingress there, or the reverse.
#
# **The agent's `instance` label embeds this namespace and the release name.** The operator sets it
# to `<namespace>.<collector>`, so the selector below reads `observability-agent.o2c-agent-…`; renaming
# either invalidates it without erroring. `kubectl -n observability-agent get pods --show-labels`
# is the check, not this file.
#
# **The node is reached by port, not address**, and the API server on the node's 6443 rather than
# `10.43.0.1:443` — both for the reasons the header of `observability-netpol.yaml` gives, and both
# were exercised from a cold start there before being copied here.
#
# **Deliberately absent.** No ingress for kubelet probes or the operator's reconcile: both originate
# on the node, and node-to-pod traffic is not subject to NetworkPolicy in k3s.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observability-agent-default-deny
  namespace: observability-agent
  annotations:
    kubernetes.io/description: >-
      Denies all ingress and egress in this namespace. Every allowance is a separate, named policy — so an arrow that is not written down does not exist.
spec:
  # Every pod in the namespace, including a debug pod nobody wrote a manifest for.
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observability-agent-allow-dns
  namespace: observability-agent
  annotations:
    kubernetes.io/description: Every pod resolves names. Without this nothing else in this file works, and the failures are slow rather than sharp.
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observability-agent-allow-agent-egress
  namespace: observability-agent
  annotations:
    kubernetes.io/description: >-
      The collector agent DaemonSet — the pod that reads every container log on the node. It ships them to OpenObserve in `observability` and reads the
      kubelet, and needs nothing else.
spec:
  podSelector:
    matchLabels:
      # NOT app.kubernetes.io/name — that label is the chart name and the gateway shares it.
      app.kubernetes.io/instance: observability-agent.o2c-agent-openobserve-collector-agent
  policyTypes:
    - Egress
  egress:
    # OpenObserve, one namespace over. The matching ingress is `observability-allow-ingest` in
    # `observability-netpol.yaml`, which names this namespace the same way.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: openobserve-standalone
      ports:
        - protocol: TCP
          port: 5080

    # The `kubeletstats` receiver on 10250, and the API server on 6443 for `k8sattributes` — the
    # processor that names the pod every log line came from. By port rather than by address, because
    # the node's is public and has already changed once, and because 6443 is where the `kubernetes`
    # service DNATs to; an allowance on the service address matches nothing.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 10250
        - protocol: TCP
          port: 6443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observability-agent-allow-scrape-ingress
  namespace: observability-agent
  annotations:
    kubernetes.io/description: >-
      The gateway in `observability` reaching the agent's own meters on 8888. The matching half of `observability-allow-gateway-egress`; omitting either
      produces a target that is silently `up=0`.
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: observability-agent.o2c-agent-openobserve-collector-agent
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: observability.o2c-openobserve-collector-gateway
      ports:
        - protocol: TCP
          port: 8888
