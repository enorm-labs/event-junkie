# PostgreSQL metrics — ADR-015's "connection count, slow queries, disk usage" row. **In the cluster,
# over the private network**, not on the database host: staging co-locates PostgreSQL and production
# dedicates a node, and the connection path is the same shape either way. **What this does NOT
# cover**: disk usage on a dedicated database node. The agent's `filesystem` hostmetrics cover the
# staging node; on production the database node is outside the cluster and nothing reports its free
# space. Database *size* grows for reasons unrelated to the disk filling.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: observability
  annotations:
    kubernetes.io/description: >-
      Exports PostgreSQL statistics for the collector to scrape. Reads with a dedicated monitoring role, not the application's.
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-exporter
      annotations:
        # The same discovery mechanism the application pods use (#590); without these the failure is silence.
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "9187"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
          imagePullPolicy: IfNotPresent
          env:
            # The whole connection string is the credential, so it comes from the Secret as one value.
            - name: DATA_SOURCE_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-exporter
                  key: DATA_SOURCE_NAME
          ports:
            - name: metrics
              containerPort: 9187
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              # It queries `pg_stat_*` on an interval and holds nothing. The smallest thing in the namespace.
              memory: "128Mi"
              cpu: "200m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            # It reads no files and writes none; checked rather than assumed.
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: observability
  annotations:
    kubernetes.io/description: >-
      Scraped by the collector gateway. No Ingress — these metrics name databases and connection counts, which is not public information.
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres-exporter
  ports:
    - name: metrics
      port: 9187
      targetPort: metrics
