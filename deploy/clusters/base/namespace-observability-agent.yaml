# comment-lint: allow-file 12 lines of Namespace, and the reason it enforces nothing does not fit in 12.
# The namespace the collector agent DaemonSet runs in, alone (#709). **It enforces nothing, and that
# is the honest state**: the agent mounts the node (`hostPath` of `/`, `/var/log`,
# `/var/lib/docker/containers`, plus the checkpoint), `hostPath` is restricted under `baseline` and
# `restricted` alike, and a rejected agent is a log pipeline that stops quietly (#625). **What the
# split buys is the blast radius**: before #709 this one pod held OpenObserve, the exporter, the
# bridge and the gateway at `privileged` beside it; now the ungoverned namespace holds one DaemonSet
# and nothing with a credential. **`audit` and `warn` will name the agent on every restart, and that
# is the design** — its own drift arrives named, and so does anything that lands here by mistake.
apiVersion: v1
kind: Namespace
metadata:
  name: observability-agent
  labels:
    # NOT ENFORCING — see the header; rejecting the agent costs the cluster its logs.
    pod-security.kubernetes.io/enforce: privileged
    # The half that does work: every violation recorded and reported without being rejected.
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    app.kubernetes.io/part-of: event-junkie
    app.kubernetes.io/managed-by: flux
