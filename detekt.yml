# Detekt configuration – overrides for the default rule set.
# See https://detekt.dev/docs/rules/style/#maxlinelength

style:
  MaxLineLength:
    # Aligned with .editorconfig max_line_length = 160
    maxLineLength: 160

# This repository's own rules, implemented in the :detekt-rules module.
event-junkie:
  LongComment:
    active: true
    # A cap, not a target: what makes a comment long here is nearly always restated code, a history
    # of how it got that way, or a decision copied out of an ADR instead of referenced. One that
    # genuinely needs more takes `@Suppress("LongComment")` with a reason — an explicit decision a
    # reviewer sees, rather than a threshold raised until nothing fires. One cap governs every
    # package (#741), and blank ` * ` separators do not count toward it.
    maxLines: 25

  CommentDensity:
    active: true
    # The per-file backstop a per-comment cap cannot be: twenty individually reasonable comments
    # still add up to a file that reads as prose with code between it. 70 is measured to catch an
    # outlier rather than re-litigate every dense file, which 65 would.
    maxPercent: 70
    # A ratio needs mass behind it: `EventsSchema.kt` is one `const val` and its reasoning, 22
    # comment lines of 24, and nothing about that is a defect.
    minCommentLines: 25

  CommentSmell:
    active: true
    # Test sources are excluded deliberately: a date there is usually a fact about a fixture, not a
    # changelog entry — 47 of the tree's 52 test-side dates are — and flagging them would train
    # everyone to ignore the rule.
    excludes: ['**/test/**', '**/androidTest/**']

