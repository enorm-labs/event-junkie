services:
  postgres:
    image: 'postgres:18.6-alpine'
    environment:
      - 'POSTGRES_DB=event_junkie'
      - 'POSTGRES_PASSWORD=admin'
      - 'POSTGRES_USER=admin'
    ports:
      # Fixed host port for convenient manual DB access (psql, IntelliJ Database panel).
      # Spring Boot Docker Compose support auto-discovers the mapped port regardless.
      # Override via environment variable if the default port conflicts:
      #   POSTGRES_HOST_PORT=5555 ./gradlew :events-importer:bootRun
      - '${POSTGRES_HOST_PORT:-56298}:5432'
    volumes:
      # Named volume so seeded data survives the container being recreated. Without it the
      # data sits on an anonymous volume that is discarded with the container, and every
      # recreation comes back as an empty schema with no error to say anything was lost —
      # re-seeding then means re-scraping all ~75 venues (see ADR-007 on politeness).
      # Spring Boot's Docker Compose support stops the container on application shutdown by
      # default (`spring.docker.compose.lifecycle-management`), so this is easy to trip over.
      #
      # `/var/lib/postgresql` is the volume the postgres:18 image itself declares; PGDATA
      # lives at `/var/lib/postgresql/18/docker` beneath it. (Images up to 17 declared
      # `/var/lib/postgresql/data` instead, so this path changes on a major upgrade.)
      - 'postgres-data:/var/lib/postgresql'

  # The image cache runs the real S3 path locally rather than a filesystem adapter chosen by
  # profile (ADR-019 §2.9). A local path that differs from production hides key encoding, content
  # type and streaming faults until after a deploy, and this repo already runs a k3d rehearsal
  # rather than accept that class of trade.
  minio:
    # Pinned by digest: MinIO stopped serving its own images anonymously, and Chainguard publishes only
    # `latest` (#1855). The tests pin the same digest in MinioTestImage.kt.
    image: 'cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1'
    command: 'server /data --console-address ":9001"'
    # Root, because the volume was created by the old image, which ran as root; Chainguard's user 65532
    # cannot write to it. Local development only.
    user: '0:0'
    environment:
      - 'MINIO_ROOT_USER=minioadmin'
      - 'MINIO_ROOT_PASSWORD=minioadmin'
    ports:
      - '${MINIO_HOST_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9090}:9001'
    volumes:
      # Named, for the same reason postgres-data is: an anonymous volume discards the cache on every
      # container recreation, and refilling it means asking about 80 venues for their images again.
      - 'minio-data:/data'

  # Creates the bucket the importer writes to, then exits. A one-shot service rather than a step in
  # `dev-env.sh`, so `docker compose up` alone gives a working environment and the two cannot drift.
  # `mc mb --ignore-existing` is idempotent, which is what makes re-running compose free.
  minio-init:
    # The `-dev` variant, because the entrypoint below needs a shell and the plain image has none.
    image: 'cgr.dev/chainguard/minio-client@sha256:614e083a12c6dc779f13f97e01b13afda4021a8ce3f4021a2fcf23ec86f46837'
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/event-junkie-images;
      "

volumes:
  # `scripts/dev-env.sh db-reset` drops this deliberately via `docker compose down --volumes`.
  postgres-data:
  minio-data:
