# Increase JVM heap and metaspace for the Gradle daemon to prevent restarts due to insufficient memory during builds.
# MetaspaceSize raised to 768m to accommodate OWASP Dependency-Check's NVD analysis.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError
# The Kotlin compile daemon has its own heap; unset, it inherits the 2g above. CodeQL's Kotlin
# extractor runs inside it, and at 2g `:events-bff:compileTestKotlin` ran out of heap under
# CodeQL (#4853), while the plain build stayed well inside it.
kotlin.daemon.jvmargs=-Xmx3g -XX:+HeapDumpOnOutOfMemoryError
# Configuration cache – reuses the configured task graph between builds, so repeat invocations
# skip the configuration phase entirely.
# Exception: `dependencyCheckAggregate` (OWASP Dependency-Check) reaches for `project` at
# execution time, which the configuration cache forbids. Run that task with
# `--no-configuration-cache`; both CI workflows that invoke it already pass the flag.
# Still the case on 13.0.0 — retest when upstream PR #478 lands.
# Same exception, same reason: `generateLicenseReport` / `checkLicense`
# (com.github.jk1.dependency-license-report 2.9) serialize a `Project` into the task. They still
# produce correct output without the flag, but the cache entry is discarded — so the next
# unrelated build re-runs configuration. Always pass `--no-configuration-cache` to those two.
org.gradle.configuration-cache=true
# Task outputs are cached by their inputs, so a run that changes one module takes the others'
# compile, detekt and tests from the local build cache — which setup-gradle persists between CI
# runs (seeded from main, read by pull requests). Parallel project execution is NOT on here: the
# licence-report plugin resolves the Boot modules' configurations from the root task, which Gradle
# refuses under parallel ("attempted without an exclusive lock"). build-backend.yml passes
# `--parallel` to the steps that benefit and leaves `checkLicense` alone.
org.gradle.caching=true
# Application version – a placeholder, never the truth (ADR-032).
#
# No file carries the version. `scripts/version.sh compute` reads it from the last release tag and
# the commits since it, and every CI build passes it in as `-Pversion=…`, which overrides this line.
# The Gradle build stamps that number into the BFF's META-INF/build-info.properties, the BFF serves
# it at GET /meta and /actuator/info, and the frontend footer displays it. A build without the flag
# — a laptop — shows the placeholder. Setting `version` here applies it to the root project and
# every subproject, so `build.gradle.kts` must NOT assign `version` in its `subprojects` block — a
# leftover assignment silently wins over `-Pversion` and the footer shows the wrong number while the
# build stays green.
version=0.0.0-SNAPSHOT
# Centralized dependency versions – change here to update all subprojects at once.
# These live in gradle.properties rather than root `extra[...]` so every subproject resolves
# them as its own project property. Gradle 10 removes the implicit lookup of properties in
# parent projects that the `extra[...]` form relied on.
# See https://docs.gradle.org/current/userguide/upgrading_version_9.html#deprecated_implicit_lookup_in_parent_projects
# robots.txt parsing for the scraper's RobotsTxtFilter. Apache-2.0, so green under LEGAL.md §9.2.
# A dependency rather than a hand-rolled parser on purpose: group selection by user-agent, `Allow`
# beating `Disallow` on longest match, `*`/`$` wildcards and the RFC 9309 status rules are all easy
# to get subtly wrong, and a wrong parser reports compliance we do not have.
# The S3 client for the cached venue image bucket (ADR-019). Apache-2.0, so green under LEGAL.md
# §9.2. The AWS SDK rather than a lighter S3 client because Hetzner Object Storage is S3-compatible
# and this is the implementation its compatibility is defined against — a smaller library would be
# a second guess at the same protocol.
awssdk.version=2.57.13
crawler-commons.version=1.6
greenmail.version=2.1.15
# The Java major: every module's toolchain reads it, and detekt takes its JVM target from the toolchain.
# `.sdkmanrc`, the `java-version:` lines in `.github/workflows/` and both backend Dockerfiles copy it by hand.
# Move them together; ADR-017 holds the Dockerfiles' JRE base image on purpose.
java.version=25
# Also constrains the build classpath: dependency-check-core 13.0.0 pulls 1.23.1 (GHSA-65r4-943x-97jj).
# Drop that constraint once `./gradlew -q buildEnvironment | grep jsoup` shows 1.23.2 without it.
jsoup.version=1.24.1
kotest.version=6.2.6
kotlin-logging.version=8.0.7
mockk.version=1.14.12
mockwebserver.version=5.5.1
slugify.version=4.0.1
spring-ai.version=2.0.2
spring-modulith.version=2.1.2
springdoc.version=3.2.0
webauthn4j.version=0.32.0.RELEASE
# --- Build classpath (CVE remediation) --------------------------------------------------
# jackson-databind CVE-2026-68497, CVE-2026-91776 and CVE-2026-91777, on the classpath no BOM reaches.
# dependency-check-gradle 13.0.0 pulls Jackson 2.22.1, and 2.22.3 is that minor's fix. Constrained by
# the root `buildscript` block. **Delete this once dependency-check-gradle resolves 2.22.3 or later.**
# Check by removing the line and running `./gradlew -q buildEnvironment | grep jackson-databind`.
jackson-buildscript-2.version=2.22.3

# --- Pins that are not ordinary project versions ---------------------------------------
# None of these is managed by the Spring Boot BOM, and none may be bumped on sight.
#
# log4j-api is a direct dependency of events-core, which applies `io.spring.dependency-management`
# but not the Boot plugin — so no BOM reaches it and this is the only thing choosing a version.
# It is deliberately NOT named `log4j2.version`: that is the BOM's own property, and setting it
# here would override the version every Boot module resolves, which is the trap above.
log4j-api.version=2.25.5
# scram is not BOM-managed either — it arrives only as a transitive of r2dbc-postgresql, which
# pins 3.2 in both 1.1.1.RELEASE and 1.1.2.RELEASE, so bumping r2dbc-postgresql does not help.
# It is raised by a dependency constraint in the two modules that use r2dbc-postgresql.
# scram-client/scram-common 3.2 are affected by CVE-2026-53712 (high), fixed in 3.3.
scram.version=3.4
# FreeMarker is on the *build* classpath only — Kover 0.9.11 renders its HTML report through
# intellij-coverage-reporter → coverage-report, which pins 2.3.32. That is CVE-2026-84939
# (critical): path traversal through a malformed locale in template lookup, fixed in 2.3.35.
# Nothing shipped carries it, and the templates are Kover's own, but a fixable finding is fixed.
# Kover 0.9.11 is its latest release and still pins 2.3.32, so there is nothing to bump on that
# side. Constrained by the root `buildscript` block. **Delete this once Kover's reporter resolves
# 2.3.35 or later.** Check by removing the line and running
# `./gradlew -q buildEnvironment | grep freemarker`.
freemarker.version=2.3.35
# Guava is on the *build* classpath only: dependency-check-gradle 13.0.0 pulls 33.6.0-jre. That is
# CVE-2026-102554 (high), unbounded allocation when CompactHashMap, CompactHashSet or
# MapMakerInternalMap is deserialized, fixed in 33.7.2. Nothing shipped carries Guava. Constrained by
# the root `buildscript` block. **Delete this once dependency-check-gradle resolves 33.7.2 or later.**
# Check by removing the line and running `./gradlew -q buildEnvironment | grep guava:guava`.
guava-buildscript.version=33.7.2-jre
# org.json is on the *build* classpath only: dependency-check-gradle 13.0.0 pulls 20260522. That is
# CVE-2026-59171 (medium), unbounded BigInteger/BigDecimal construction from a long numeric literal,
# fixed in 20260719. Nothing shipped carries org.json. Constrained by the root `buildscript` block.
# **Delete this once dependency-check-gradle resolves 20260719 or later.** Check by removing the line
# and running `./gradlew -q buildEnvironment | grep org.json`.
org-json-buildscript.version=20260814
