# Increase JVM heap and metaspace for the Gradle daemon to prevent restarts due to insufficient memory during builds.
# MetaspaceSize raised to 768m to accommodate OWASP Dependency-Check's NVD analysis.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError
# Configuration cache – reuses the configured task graph between builds, so repeat invocations
# skip the configuration phase entirely.
# Exception: `dependencyCheckAggregate` (OWASP Dependency-Check) reaches for `project` at
# execution time, which the configuration cache forbids. Run that task with
# `--no-configuration-cache`; both CI workflows that invoke it already pass the flag.
# Still the case on 13.0.0 — retest when upstream PR #478 lands.
# Same exception, same reason: `generateLicenseReport` / `checkLicense`
# (com.github.jk1.dependency-license-report 2.9) serialize a `Project` into the task. They still
# produce correct output without the flag, but the cache entry is discarded — so the next
# unrelated build re-runs configuration. Always pass `--no-configuration-cache` to those two.
org.gradle.configuration-cache=true
# Application version – the single source of truth.
#
# The Gradle build stamps it into the BFF's META-INF/build-info.properties, the BFF serves it at
# GET /meta and /actuator/info, and the frontend footer displays it. Setting `version` here applies
# it to the root project and every subproject, so `build.gradle.kts` must NOT assign `version` in
# its `subprojects` block — a leftover assignment silently wins and the footer shows the wrong
# number while the build stays green.
#
# `main` carries -SNAPSHOT; a release build overrides it from the tag (`-Pversion=0.1.1`) rather
# than editing this line, so tag == version by construction.
#
# MIRROR ANY CHANGE into `version` in events-frontend/package.json — deliberately without the
# -SNAPSHOT suffix, since npm's SemVer has no such convention. See docs/LEGAL.md §4.
#
# 0.1.0 -> 0.1.1 WITHOUT A RELEASE OF 0.1.0, and that is not an accident (#455). Ten snapshots were
# published under the old `0.1.0-snapshot.g<sha>` scheme and they are immutable artifacts, so they
# cannot be withdrawn. SemVer ranks a numeric prerelease identifier BELOW an alphanumeric one, so a
# timestamped snapshot of 0.1.0 — `0.1.0-snapshot.20260814…` — would sort under every single one of
# those ten `g…` tags, and staging would have kept resolving a chart from August. Moving the base
# version puts every new snapshot above all of them on the major.minor.patch comparison, before any
# prerelease identifier is looked at. Nothing is deleted from the registry and nothing is rewritten.
version=0.1.1-SNAPSHOT
# Centralized dependency versions – change here to update all subprojects at once.
# These live in gradle.properties rather than root `extra[...]` so every subproject resolves
# them as its own project property. Gradle 10 removes the implicit lookup of properties in
# parent projects that the `extra[...]` form relied on.
# See https://docs.gradle.org/current/userguide/upgrading_version_9.html#deprecated_implicit_lookup_in_parent_projects
java.version=25
jsoup.version=1.23.1
kotest.version=6.2.4
kotlin-logging.version=8.0.4
mockk.version=1.14.11
mockwebserver.version=5.5.0
slugify.version=4.0.1
spring-modulith.version=2.1.0
springdoc.version=3.1.0
# swagger-ui is NOT a project dependency and NOT BOM-managed — it arrives only as a transitive of
# springdoc-openapi-starter-webflux-ui, which pins 5.32.11. That build of the bundle carries
# DOMPurify 3.4.12, which is GHSA-55q2-fjhq-7xh7 (medium): an IN_PLACE hook removal leaves a
# detached subtree executable, causing XSS. Fixed in DOMPurify 3.4.13, which the webjar first
# carries in 5.32.13 — measured, by unzipping both jars and reading `DOMPurify.version` out of
# swagger-ui-bundle.js, not inferred from a changelog.
#
# Pinned here rather than waited on, because springdoc 3.1.0 is its latest release, so there is
# nothing to bump on that side (#491). It is a patch move inside 5.32.x, and the two modules
# constrain it. **Delete this the moment springdoc ships a release naming 5.32.13 or later**, so
# the pin does not silently hold us behind springdoc's own choice.
swagger-ui.version=5.32.13
# --- Spring Boot BOM overrides (CVE remediation) ---------------------------------------
# These are NOT ordinary project versions: each one overrides a version the Spring Boot BOM
# would otherwise manage. `io.spring.dependency-management` resolves BOM properties from
# Gradle project properties, so setting the BOM's own property name here is enough — no
# per-module `extra[...]` needed, and it reaches both events-bff and events-importer.
#
# Each entry exists only because the BOM's version carries a known CVE. **Delete the entry
# once a Spring Boot release ships an equal or newer version**, rather than carrying a
# permanent override that silently pins us behind the BOM.
#
# netty 4.2.15.Final (Boot 4.1.0) is affected by 10 advisories published 2026-08-04,
# including CVE-2026-56820/56819/56817/56816/56745/55851/55833/55831/44891 against
# netty-codec-http, -http2, -http3 and others. All are fixed in 4.2.16.Final.
netty.version=4.2.17.Final
# postgresql 42.7.11 (Boot 4.1.0) is affected by CVE-2026-54291 (high), which affects
# 42.7.4 through 42.7.11 and is fixed in 42.7.12.
postgresql.version=42.7.13
# log4j-api 2.25.4 (Boot 4.1.0) is affected by CVE-2026-49844 (medium) — invalid JSON from
# non-finite floats in MapMessage — which affects 2.13.1 through 2.25.4 and is fixed in 2.25.5.
# Below the CVSS >= 7 gate, so this is hygiene rather than a build-breaker.
log4j2.version=2.25.5
# Both Jackson lines are on the project's classpath and both carry medium advisories:
# jackson-databind 2.21.4 (CVE-2026-54515, CVE-2026-59889, GHSA-mhm7-754m-9p8w -> 2.21.5) and
# tools.jackson 3.1.4 (CVE-2026-59889 -> 3.1.5). The BOM exposes them as two separate
# properties; both must move, since bumping one leaves the other line untouched.
jackson-2-bom.version=2.21.5
jackson-bom.version=3.1.5
# scram is NOT BOM-managed — it arrives only as a transitive of r2dbc-postgresql, which pins
# 3.2 in both 1.1.1.RELEASE and 1.1.2.RELEASE, so bumping r2dbc-postgresql does not help.
# It is raised by a dependency constraint in the two modules that use r2dbc-postgresql.
# scram-client/scram-common 3.2 are affected by CVE-2026-53712 (high), fixed in 3.3.
scram.version=3.4
